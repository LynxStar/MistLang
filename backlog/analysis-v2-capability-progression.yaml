      source closes against every constraint of its parameter: a type constraint by the classifier, class
      and struct by the definition's kind, readonly, mutable and owned by the declared modifiers, the
      substructural three by discipline where LINEAR SATISFIES AFFINE AND RELEVANT -- exactly once is both
      at most once and at least once, and samples/SubstructuralFieldDiscipline closes both with a linear
