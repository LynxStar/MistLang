        default-construction defect, leaving struct-backed enums with state unexercised.
      - THE V2 BASELINE DIVERGES FROM CLASSIC ON THREE LINES AND THAT IS RECORDED RATHER THAN FIXED.
        Because Coordinate declares no fields (the entry above), all four Corner variants are
        value-equal, so v2 prints TopLeft for every one of them where classic prints each name. This is
        EnumEmitter's alias doctrine working as designed -- one equality notion, structural, so that
        printing and comparing cannot disagree -- and it is what C# itself does with a repeated enum
        value. Classic's reference-identity name lookup is the inconsistent one, since its `==` stays
        structural. Give Coordinate fields and the divergence disappears.
      - The pattern form is never applied to Corner. Sections 10's `is` tests cover the int, string,
        byte and class-backed enums, all of which have distinct values, so the value collapse above is
