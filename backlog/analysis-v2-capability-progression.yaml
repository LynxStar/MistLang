    tasks:
      - >
        `readonly` on a class method is admitted and means nothing, as in classic. Either it constrains
        the method not to mutate `this` and wants enforcing, or it is invalid and wants a diagnostic.
        A decision, not a rule.
      - >
        Override and interface-implementation accessibility (Requirement 7 of the spec) is not judged:
        the model records no override relation, and Roslyn refuses the C# forms.
      - >
        A protected instance member reached through a base-typed receiver from a derived type is
        admitted, where C# demands the receiver be of the accessing type. Permissive on purpose until a
        program shows it matters.
      - >
        The unknown default-entry refusal and the constraint checks at field initializers are stricter
        than classic's analyzer; the first Roslyn refuses anyway, the second classic itself refuses one
        position over.
      - >
        A top-level type declared `private` or `protected` is not refused here; since emitter order 40
        spells every level, Roslyn refuses it as CS1527, which is what classic does with it too. The
        frontend owning the rule is a decision.
      - >
        An equality refinement predicate whose constant cannot belong to the base is admitted at the
        declaration and can then be discharged by nobody, so every use is refused instead -- the sibling
        of the relational rule this order already holds, missing its half. Measured 2026-09-16 on both
        pipelines: `Ne(string key) where key not 18` is admitted at the declaration on v2 and on classic,
        and `Ne("x")` is MIST_PA_CONSTRAINT_UNPROVEN on v2 where classic prints. The same shape reached
        through substitution behaves identically -- `Keyed<string>().Ne("x")` over `Ne(K key) where key
        not 18` -- so this is one gap at the declaration, not two at the uses. Requirement.Of reads the
        constant and Known reads nothing integral off a string, so Everything is not a subset of the
        admitted set and the prover reports. Adhoc-refinement-constraints Requirement 11.6 names the
        types a constant pattern is accepted on; refusing the constant against the base at the
        declaration would silence every use through Comparability.IsRefused, as the relational form
        already is.
      - >
        Two operators of one signature, and two conversions between one pair of types, are not refused.
        Measured 2026-09-15 on a struct Money: `operator +(Money a, Money b)` declared twice is MIST_SM_0020
        on classic and MIST_CS_ERROR on v2, and `implicit operator int(Money m)` twice is MIST_SB_0043 with
        SM_0020 on classic and MIST_CS_ERROR on v2. Neither Operator nor CastOperator is an IOverload, so
        OverloadSignature does not reach them.
      - >
        DONE 2026-09-28 (workstream 16): DeclarationShapeAnalyzer judges extension methods by normalized
        receiver and parameter signatures and properties by receiver and name, within each namespace.
        ExtensionSignatureDecisionTests and ExtensionSignatureAnalysisTests construct source declarations
        directly; the binder only registers them. Identical declarations in different namespaces
        coexist; importing both makes a use subject to ordinary call-site ambiguity rules. Identical
        declarations in one namespace are refused even when written in separate blocks.
        Mixed method/property and static/instance collision policy remains unspecified; this rule
        keeps methods and properties separate and follows OverloadSignature for methods.
      - >
        A nested generic's constraint naming its enclosing type's parameter is judged unsubstituted where
        the binder builds the nested type without its enclosing instantiation: `new Inner<Score>()` inside
        `Deriv : Outer<Score>`, with `Inner<U> where U : IRank<T>`, is refused against 'IRank<T>' where C#
        admits it. The model does not know `T` there, so no rule can. Filed in backlog/general.md with
        `Outer<string>.Inner<int>` not resolving, which is also why the enclosing instantiation
        ConstraintClosureRegistry.RecordType takes is reached by no program.
        DONE 2026-09-26, by the binder (emitter order 66, nested-type-declarations): both resolve, the
        derivation's name carried under its base, and RecordType is handed that enclosing at the nested
