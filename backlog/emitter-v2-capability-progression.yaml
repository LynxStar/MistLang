  - id: type-argument-inference
    name: Type argument inference from call arguments
    order: 55
    layer: generics
    requires: [generic-methods]
    v2_status: partial
    verified_by: v2-semantics
    evidence: >
      Unification of parameter types against argument types, including through a nested
      constructed type, then substitution into the return type so var binds concretely.

      Banked in AllFeaturesV2, which covers five inferring calls and one stating its arguments:
      T from an int and from a string, two parameters from two arguments, T read through a
      `List<int>` in a parameter position, and inference on an instance method.

      INFERENCE IS PART OF APPLICABILITY, not a step after selection. A candidate is CLOSED before
      any conversion is weighed, because ConversionRelation declines to reason about an open type
      parameter -- so a candidate left open is eliminated for being generic rather than for being
      wrong, which is how a generic overload beside a non-generic one refused a valid call before
      this. A candidate whose parameters cannot all be determined is not applicable, matching C#.

      THE CALL SITE STATES ITS TYPE ARGUMENTS IN THE EMITTED C#, inferred ones included, rather
      than leaving Roslyn to infer them again. This is a choice about failure rather than about
      correctness, and MEASURED as such: suppressing the emission entirely leaves all 4647 tests
      green, the AllFeaturesV2 v2 baseline among them, so nothing in the repository distinguishes
      stating the answer from not having one.

      The reason to state it anyway is that this algorithm is the weaker of the two, in five named
      ways: it does not walk bases or interfaces when matching, does not track variance, folds
      repeated answers pairwise rather than resolving a bound set, has no inference from lambdas or
      method groups, and runs one pass rather than fixing in dependency order. Every shape it does
      infer, C# infers and agrees on, so its successful answers are a subset of C#'s -- established
      by reasoning over the cases, not proved. Stating them therefore makes a wrong answer a C#
      error rather than something Roslyn quietly infers correctly on our behalf.

      IT ALSO HAS A FAILURE MODE C# DOES NOT, and this cuts against the direction of order 26. Where
      one parameter is answered twice with types neither of which converts, Wider keeps the first
      arbitrarily; a lone candidate is then returned without weighing conversions, so
      `F<T>(T, T)` called `F("x", 1)` emits `F<string>("x", 1)` and fails in Roslyn against a
      generated file. C# reports CS0411 on the call itself. Refusing that in the frontend is the
      best-common-type task below.

      Which also means the sample does not test inference as tightly as it appears to. Every result
      it prints would print the same had inference answered nothing at all; what the baseline pins
      is the emitted C#, not the answer.

      Failure is REPORTED rather than left open, by MIST_PM_TYPE_ARGUMENTS_NOT_INFERRED naming the
      parameters to state. An undetermined parameter is not a missing preference but a missing
      type: it reaches the call's result, so binding anyway records a local typed by a parameter
      out of scope and emits that parameter where a type belongs, which Roslyn then reports against
      a generated file naming neither the call nor the parameter.
    tasks:
      - Unify an argument against a BASE of the declared parameter type, so
        `F<T>(IEnumerable<T>)` can be called with a `List<int>`. Matching requires the same
        definition today, and answers nothing otherwise. Gated on the same base chain walk that
        order 53 needs, and unreachable until abstract types can be reached generically.
      - Bind GenericInvocationExpression, so a bare `Identity<string>(x)` works as the qualified
        `Program.Identity<string>(x)` already does. Only the MethodCallSuffix form carries stated
        type arguments through today; the primary form reaches ExpressionBinder.BindPrimary
        unhandled and binds to a sentinel.
      - Replace the pairwise Wider fold with a bound set per type parameter and a fixing step, which
        is C#'s shape and the right one. The fixing RULE is DECIDED and differs from C#'s, in two
        ordered steps. One, if some bound dominates -- every other bound implicitly converts to it --
        fix to that bound, so {int, long} answers long. Two, failing that, fix to the UNION of the
        bounds, so {string, int} answers `string | int` and `F<T>(T, T)` on `F("x", 1)` is a legal
        call where C# reports CS0411. A union is the answer of last resort, never a first choice.
      - The two steps have to be ordered EXPLICITLY, because step two is not a fallback that step one
        subsumes and neither follows from "most specific". The union of the bounds is by construction
        their LEAST common supertype, so a most-specific rule alone would answer `int | long` for
        {int, long} and never reach `long`. Dominance is what expresses "a stricter fit exists".
      - Fixing then never fails for a parameter carrying at least one bound, since every bound
        converts to the union of the bounds by construction. So MIST_PM_TYPE_ARGUMENTS_NOT_INFERRED
        narrows to its real case, which is a parameter mentioned in no parameter type at all, where
        the arguments say nothing about it whatsoever.
      - Step one cannot answer `unknown`, and not because of a guard against it --
        ConversionRelation declines `unknown` outright as indeterminate, so no conversion INTO it is
        ever established and it cannot qualify as a common supertype. Worth knowing rather than
        rediscovering, because were the relation to start modelling it as a true top type, step one
        would admit it on every call. Step two needs no such guard -- a union of the bounds is
        strictly more specific than the top type.
      - BLOCKED ON A UNION ARM IN ConversionRelation, which has none -- constituent-to-union and
        union-to-wider-union are both unmodelled, so a fixed union is found INAPPLICABLE and the
        candidate eliminated wherever two or more share an arity. A lone candidate would bind and, as
        it happens, compile, since the emitted carrier declares an implicit conversion from each
        constituent. Half-live is the worst of the three states, so do the relation arm first. See
        orders 76 to 78.
      - COST TO WEIGH when it lands. `F<T>(T, T)` accepting `("x", 1)` is a signature saying "two of
        the same thing" being handed two different things, and C# refuses it precisely to catch that.
        Under this rule it compiles. If that turns out to be too quiet, the place to say so is a
        warning at the fixing site, not a change to the rule.
      - Until any of this, that call emits `F<string>("x", 1)` on an arbitrary first-wins pick and
        fails in Roslyn against a generated file. This is the one gap in this entry reachable today,
        and it puts an error where the user cannot act on it, which is the opposite of order 26's
        direction. Refusing it in the frontend is worth doing on its own, ahead of the union work.
    unlocks: []

  - id: generic-constraints-nominal
    name: class, struct, base-class and abstract-type constraints
