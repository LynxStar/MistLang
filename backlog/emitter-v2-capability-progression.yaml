  - id: cast-expression
    name: Explicit cast expression syntax
    order: 44
    layer: conversions
    requires: [same-file-forward-type-references]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      Was the only one of the sample's three conversion requirements that ANNOUNCED itself:
      MIST_BE_UNSUPPORTED_EXPRESSION at the two explicit-cast lines and nothing else. The other two
      failed silently.

      THE BINDER WAS THE MISSING HALF, not just the emitter, and the earlier note here was wrong to
      put it all on BodyEmitter. OperatorBinder.BindUnary had cases for Postfix, Negate and LogicalNot
      and fell to `default => UnresolvedExpression` for everything else, so a cast never bound at all
      -- which is why the local degraded to ErrorType and emitted as `/* error */ bodyK =`. The
      emitter's missing case was real but downstream of that.

      Closed with a CastExpression model node carrying operand, target type and the selected
      CastOperator, a BindUnary case, and a BodyEmitter case emitting `((T)operand)`. Matches what
      classic emits.

      THE OPERATOR IS RESOLVED IN MIST, and the first version of this did not do that -- it recorded no
      operator, on the reasoning that C# resolves the same cast against the same declarations anyway so
      a choice made here could only disagree with the one that runs. That reasoning is backwards, and
      it is recorded rather than deleted because it is an easy trap to fall into twice. A disagreement
      between Mist's answer and Roslyn's is a defect worth surfacing, not a reason to decline to hold
      an answer. Deferring also put C#'s conversion rules in the language's place, left any backend
      that is not the transpiler with nothing to read, and pushed failures onto generated code.
      It also broke this file's own convention: var-type-inference (order 8) emits the INFERRED type
      rather than C# `var`, and array-literals (order 12) emits an explicit element type rather than
      leaning on a target type. Both are cases where C# could have worked it out and Mist decides
      regardless. See also the header of Test/Mist.Tests/Semantics/OverloadSelectionTests.cs, which
      makes the same argument for overload selection: a program that prints the right answer is equally
      consistent with Mist having chosen nothing.

      GUARDED BY Test/Mist.Tests/Semantics/CastSelectionTests.cs, which asserts on CastExpression.Operator
      because no sample can: emission writes `((T)operand)` whatever was selected, so the generated code
      and the output are identical whether Mist chose the right operator, the wrong one, or none. Eight
      cases -- the explicit operator on the source, an implicit operator at an explicit cast site, an
      operator declared by the TARGET rather than the source, a derived source reaching its base's
      operator, a downcast selecting none, an unrelated pair selecting none without being refused, the
      target type flowing into an inferred local, and the operator on the ACTUAL source where a second
      type declares one to the same target.
      Each branch was confirmed to be load-bearing by mutation: dropping the target-end search fails only
      the target-declared case, matching the parameter by identity instead of standard convertibility
      fails only the derived-source case, and binding the cast with includeExplicit false fails only the
      two explicit-cast cases.

      THE C# BACKEND CANNOT BE MADE TO HONOUR THE SELECTION, so the two answers agree by coincidence
      rather than by construction. C# refuses to call a conversion operator by name (CS0571), leaving a
      cast as the only spelling available, and Roslyn resolves it again from the same declarations.
      Nothing detects a disagreement. That is a limit of this backend rather than of the model, and it
      is exactly why the selection is recorded: a second backend would have no other source for it.

      NO PARENTHESES AROUND THE OPERAND, and that is a grammar fact rather than an omission. Unary's
      CastExpression alternative binds its operand to a Unary, every form of which binds tighter than
      any binary operator in C# too, so `(Kelvin)a + b` arrives already shaped as a cast of `a` and
      cannot capture the `+ b`.

      THE OPERAND IS AN ARGUMENT, AND IS LOWERED AS ONE (2026-09-12). A cast calls a conversion function
      and its operand may reach that function's parameter through a declared implicit operator, an enum's
      value or a union carrier -- each a user-defined conversion to C#, which applies one per cast.
      CastLowering.Argument, generalised from EnumEmitter.LookupArgument, converts an operand not already
      of CastExpression.ParameterType in a cast of its own: `(Feet)reading` with Reading implicit to
      Meters emits `((Feet)(Probe.Meters)(reading))` and prints 6 where both pipelines failed before
      (Roslyn CS0030 on classic). The selection is now CastOperatorSelection's, not FindOperator's, the
      cast is typed as the called operator's return type, and the refusals it makes possible are analysis
      order 4's. CastLoweringTests holds the spellings; no sample can, the baseline being shared with
      classic, which fails every one that needs a step.

      THE NO-PARENTHESES PARAGRAPH ABOVE WAS WRONG, AND IT PRINTED A WRONG ANSWER (2026-09-13). The grammar
      does bound the operand to a Unary, but a parenthesized expression is a Unary whose parentheses bind
      the expression inside them and reach the model as nothing -- ParenthesizedExpression binds straight to
      its inner expression. So `(double)(a / b)` arrived as a cast of a division and was emitted
      `((double)a / b)`: with a = 7 and b = 2, v2 printed 3.5 where classic prints 3. `(long)(a * b)` emitted
      `((long)a * b)` too and printed 14 on both only because the product is the same either way. Found
      while changing this emitter case for order 46. The operand is now parenthesized whatever it is,
      `((double)(a / b))`, which also covers the signed operand the old code special-cased. v2 prints 3.
      PROVED BY CastEmissionTests (a division, a product and a negation); mutating the case back to a bare
      operand fails all three, the negation's spelling being `((long)-a)` there. Full suite green, 6057 of
      6057.
    unlocks: []

