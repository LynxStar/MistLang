  - id: default-value-synthesis
    name: Synthesized default construction and default blocks
    order: 50
    layer: initialization
    requires: [default-expression, readonly-struct, explicit-this-member-read,
               object-creation, string-interpolation, var-type-inference,
               standard-library-binding]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      THE THREE RESIDUES ARE CLOSED. A class holding another class now defaults, a default block's
      TYPE BINDING form is read, and a default block STATES a zero the constructor shape would
      otherwise deny. Measured on a probe holding all four shapes at once -- Config (block plus an
      argument-taking constructor), OptionalHolder (an `int?` field), Scene (both binding forms) and
      Nested (a class field) -- byte-identical to classic across every line.

      A DEFAULT BLOCK OUTRANKS THE CONSTRUCTOR SHAPE, which is the rule the previous gate had
      backwards. Requiring arguments is the author saying there is no sensible zero only when they
      say nothing else; a block is them saying exactly what the zero is, so `default(Config)` on a
      type whose only constructor takes a string is not a gap to refuse. DatabaseConnection, which
      declares a constructor and no block, stays non-defaultable -- the sample asserts that shape
      explicitly, and a test pins it against the widening.

      THE SENTINEL NOW ROUTES EVERY DECLARED-CONSTRUCTOR TYPE, not only one that spent the
      parameterless slot itself. A type spelling only `Config(string)` has no parameterless
      constructor in MIST either, so emitting a public one to default it would hand C# a construction
      Mist rejects -- and would silently satisfy a `new()` constraint downstream.

      A CYCLE IS ANSWERED, NOT RECURSED. `class Node { Node Next; }` has no finite default, so the
      predicate carries the set of types under test and answers a re-entry non-defaultable. Without
      the guard the recursion into a field's own type does not terminate. Classic reports
      MIST_DEFAULT_NOT_SUPPORTED here; v2 falls to the backend sentinel, which is the same
      declines-to-emit posture the rest of this entry takes.

      AN OPTIONAL DEFAULTS TO ABSENCE rather than to a defaulted inner value, absence being the
      reading every inner type has and the one needing nothing constructed. Wider unions keep their
      carrier and stay non-defaultable: which constituent a carrier defaults to is unanswered.

      A NESTED OVERRIDE BINDS AGAINST THE BOUND TYPE'S FIELD, in the ENCLOSING type's scope. Two
      different types own the two halves -- the field name is the bound type's, the expression was
      written where the block was -- and reading either off the wrong one leaves the entry unbound.

      What was already delivered: every defaultable type gets a parameterless initializer assigning each field its
      default plus a static __CreateDefault factory, so `default(T)` becomes an ordinary call. Banked in
      AllFeaturesV2, output byte-identical to classic, including the three cases that distinguish the
      layers: Settings replaying its field initializers, AppState's block REPLACING the field defaults
      rather than adding to them, and Container diverging between `new` (99, constructed) and `default`
      (42, defaulted).

      THE MODEL ALREADY HELD THE BLOCK, unbound. ConcreteTypeBuilder.ResolveDefaultBlock parked each
      entry's value as an UnresolvedExpression, so the block parsed and nothing could read it. Now bound
      in Phase 3 against the type of the field each entry names, through the same BodyBinder.BindInitializer
      a field initializer takes. An entry naming no declared field is left unbound rather than reported:
      whether a block may name a member the type does not declare is a judgement on a finished model.

      DEFAULTABILITY IS A GATE, NOT A DIAGNOSTIC. A type is defaultable only if it states a zero, its
      base is defaultable, and every field has an answer. A base must also leave a parameterless
      constructor STANDING rather than merely be defaultable: one stating its zero through a block
      alone emits only the private sentinel, and the derived sentinel's implicit `base()` would name a
      constructor that does not exist. Classic REPORTS the bad cases (MIST_BASE_CTOR_UNSATISFIED and
      MIST_DEFAULT_BASE_NOT_DEFAULTABLE, measured); v2 declines to emit and stays silent, because
      refusing a program is analysis-phase work. The predicate was verified against both banked samples
      rather than derived: DefaultKeyword's six types all qualify, and CastOperators' five
      parameterized-constructor types do not, which is exactly the set classic skips.

      A SEPARATE MARKER FROM THE ANCESTOR FACTORY, and that is required rather than tidy. On a struct
      with no fields and no properties StructAncestorFactory's constructor takes its marker ALONE, so one
      marker serving both lowerings would put two identical signatures on the same type.

      A BARE `default` ARGUMENT WAS AMBIGUOUS, and this is the one that broke a banked sample before it
      was caught. `new T(default)` converts to EVERY one-parameter constructor, so the factory call was
      ambiguous on any type declaring one -- three errors across Overloading and GenericConstraints,
      naming Printer(string), OrderableInt(int) and Widget(int)/Widget(bool). The marker argument is now
      typed. Classic avoids this only by passing a dummy `true`, which is the collision hazard order 42
      rejected.
    tasks:
      - >
        DELIVERED. Recurse into a field whose type is itself defaultable, which classic calls
