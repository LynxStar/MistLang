        written in terms of its abstract's type parameters is not compared at the instantiation the
        conformer supplies, so reading an open position as a mismatch refuses correct programs --
        `IntBox : IBox<int>` among them. The cost is that a generic slot is checked on arity alone.
      - >
        Slots come from the type's OWN base list, transitively through the abstract hierarchy: a
        slot reached through a concrete base is that base's obligation and is reported on its own
        declaration, so collecting it twice reports it twice. Fillers come the other way, across the
        concrete base chain as well as the type itself, since an inherited member fills a slot as
        well as a declared one.
      - >
        Retroactive conformance needs its own pass. BaseTypeResolver.ResolveAbstractBase is the only
        writer of BaseAbstractTypes and ConformanceBuilder writes ConformancesList instead, so a
        with-block conformance is invisible to a walk over base lists. See order 73.
      - >
        NEEDS A SOURCE LOCATION ON THE CONTRACT FIRST. Nothing under ProgramModel/Contracts/ exposes
        an origin -- MemberType.DeclarationNode is internal and absent from IMemberType -- so an
        analyzer over IProgramModel can detect an unfilled slot and has nowhere to point. That is a
        prerequisite for this task, not a reason to site it in construction.
    unlocks: [GenericConstraints, GenericTypes]

