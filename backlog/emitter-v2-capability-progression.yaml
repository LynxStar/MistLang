  - id: nary-operator-group-folding
    name: Left-associative folding of n-ary operator chains
    order: 184
    layer: grammar-projection
    requires: [operators-arithmetic-comparison-logical]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      The parser is generated from a PEG grammar that materializes an n-ary group list per
      precedence level, so the left fold happens during lowering rather than in the parser.
      v2 already folds correctly -- the AllFeaturesV2 baseline shows the mixed
      addition-and-subtraction chain evaluating left-associatively.
      StormAnonymousGroups is now referenced from AllFeaturesV2 and needed no compiler change to get
      there. Its every required capability was already done, which is how it was found: a sweep for
      samples with no outstanding blocker turned it up as the only one.
    unlocks: [StormAnonymousGroups]

