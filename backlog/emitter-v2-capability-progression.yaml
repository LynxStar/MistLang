      of the spec, and the reason a refinement needs no carrier of its own.

      MEMBERS COME FROM THE BASE, which erasure alone does not give: a refinement is a nominal
      subtype (R8.3), so `ok.End` on a `ValidInterval` resolves through to Interval. Found by a test
      rather than by a sample -- samples/RefinementTypes binds a property-pattern match and never
      reads a member off the binding.

      THE ONE PLACE ERASURE IS UNSOUND is a TEST, and that is order 144's, not this one's. Erasing
      there turns `x is AdultAge` into `x is int`, which is true of every int -- a runtime check
      silently becoming a constant. Measured before building: with erasure alone RefinementComparison
      and AdhocRefinementConstraints matched classic exactly and RefinementTypes printed two lines
      wrong, which is what split this capability from 144.

      WAS BROKEN, THEN REFUSED, NOW BUILT. It was briefly recorded `broken`: a refined type reached
      emission and was written as its own display name, `public Int32{refined} Age;`, whose braces
      terminate the member declaration -- 253 Roslyn errors from RefinementTypes and 196 from
      RefinementComparison, with no Mist diagnostic at all. UnspellableTypeGuard then refused it
      honestly. Both the refusal and its walk are now gone.
    analysis_phase_tasks:
      - >
        Report a compile-time constant that violates the predicate (R5.2). Classic's MIST_TC_0097 is
        the model: "Value '7' does not satisfy refinement '>= 18' on type 'AdultAge'". v2 accepts it
        and emits the value.
      - >
        Report a non-constant assigned to a refinement without proof (R6.1), classic's MIST_TC_0098.
        This is the rule that makes the `is` test the only way in; without it a base-typed value
        reaches a refined slot unchecked.
    unlocks: []

  - id: refinement-static-discharge
    name: Static discharge of a refinement predicate
    order: 142
    layer: refinement-types
    requires: [refinement-type-declarations]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      Compile-time evaluation of a literal against a predicate including boundary values, widening a
      refinement to its base, and degrading an arithmetic result to the base.

      THE TYPE RULES ARE WHAT THIS OWES, and they hold: widening a refinement to its base is
      accepted (R8.3), and arithmetic on one produces the base rather than the refinement (R8.1) --
      `AdultAge age = 30; int w = age; var sum = age + 1;` gives 30 and 31, and passing `age` to an
      `int` parameter works.

      THE DISCHARGE ITSELF IS A JUDGEMENT, not something that stops a model being built or emitted,
      so it is recorded below rather than counted here. See the field documentation: a capability
      with analysis_phase_tasks is not partial.
    analysis_phase_tasks:
      - >
