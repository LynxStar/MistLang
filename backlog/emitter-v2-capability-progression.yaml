  - name: Properties
    intro_order: 7
    threshold: adhoc-refinement-where-clauses
    requires: [property-backing-field-and-field-keyword,
               property-accessor-accessibility-and-init, static-properties,
               abstract-type-property-slots, abstract-type-inheritance,
               adhoc-refinement-where-clauses, string-interpolation]
    note: >
      This sample currently FAILS on the classic pipeline and nothing catches it. Mixed
      accessor forms emit two separate backing fields, so writes never reach reads -- the
      built DLL prints a zero after a non-zero assignment. There is no baseline file for
      Properties.
    untested:
      - The mixed-accessor defect above is not caught by anything, because the sample has no
        baseline.
      - The indexer parameter refinement erases entirely and only in-range indices are
        exercised, so the missing bounds check never shows.

  - name: RefinementTypes
    intro_order: 37
    threshold: refinement-runtime-guard-insertion
    requires: [refinement-runtime-guard-insertion, refinement-implication-engine,
               property-patterns, union-widening-at-use-sites,
               readonly-member-and-type-contexts, instance-fields, constructors,
               control-flow-basic, string-interpolation]
    untested:
      - Every predicate is satisfiable by inspection and no site is meant to fail, so a
        solver that answered yes unconditionally would compile the sample.
      - One helper is never called, and the narrowing bindings are unused.

  - name: RefinementComparison
    intro_order: 47
    threshold: refinement-implication-engine
    requires: [refinement-implication-engine, pattern-matching-core, string-interpolation]
    untested:
      - Every assignment is built to SUCCEED, so nothing separates "proved" from "always
        true".
      - No base-type mismatch and no non-implication case appears, and the narrower base
        cases sit inside guards that always hold.
      - Every alias erases to its base and assignments become plain copies, so no runtime
        site observes the engine at all.

  - name: AdhocRefinementConstraints
    intro_order: 42
    threshold: adhoc-refinement-where-clauses
    requires: [adhoc-refinement-where-clauses, indexer-declarations,
               nominal-conformance-and-slot-checking, generic-constraints-nominal,
               instance-fields, constructors, string-interpolation]
    untested:
      - No runtime guard is emitted for any ad-hoc constraint and no call violates one, so
        the output is byte-identical if every check is skipped.
      - The override-weakening rule is exercised only in the ACCEPTING direction, and the
        weaker override is called only with values the stricter predicate also admits.

  - name: DependentTypes
    intro_order: 33
    threshold: dependent-const-witness-encoding
    requires: [dependent-const-witness-encoding, type-alias-declarations,
               abstract-type-declaration, nominal-conformance-and-slot-checking,
               struct-declaration, string-interpolation]
    untested:
      - Nothing constructs with a wrong-domain literal or the wrong arity.
      - The dependent type test is applied to a statically known instantiation, so dependent
        identity is never actually discriminated.
      - One declared dependent type is only ever described in a string.

  - name: DependentTypeRefinementConstraints
    intro_order: 75
    threshold: dependent-const-witness-encoding
    requires: [dependent-const-witness-encoding, refinement-type-declarations,
               struct-declaration, string-interpolation]
    untested:
      - No construction uses a value the predicate would reject, so the predicate never
        decides anything. The sample is identical if the domain were the plain base type.

  - name: ArrayBoundsFlowAnalysis
    intro_order: 48
    threshold: array-bounds-flow-analysis
    requires: [array-bounds-flow-analysis, indexer-declarations, array-literals,
               control-flow-basic, string-interpolation]
    untested:
      - No out-of-bounds site exists anywhere.
      - Unknown-length arrays accept any index with only the lower bound enforced, and
        binding a concrete-length array to an annotated local ERASES its length, so several
        patterns pass by falling through to the runtime check.
      - One pattern's indexer emits no guard at all.

  - name: DefiniteAssignment
    intro_order: 70
    threshold: stampability-classification
    requires: [stampability-classification, definite-assignment-analysis, array-literals,
               lambda-expressions, dependent-type-parameters, instance-fields, constructors,
               string-interpolation]
    untested:
      - Every path is legal, so the unassigned-read and partially-assigning-constructor
        diagnostics never fire.
      - Nothing checks that a bare sized creation with a non-stampable element type is
        actually REJECTED. The sample only shows the accepted forms.

  - name: OptionalDefaultability
    intro_order: 69
    threshold: default-generic-constraint
    requires: [default-generic-constraint, defaultability-inference,
               enum-conversion-operators, optional-union-representation,
               lambda-expressions, string-interpolation]
    untested:
      - The non-defaultable types are never used with a default expression, so the rejection
        path is unexercised.
      - The constraint is emitted as a comment plus an injected factory, so it is NOT carried
        in metadata and a violating instantiation from outside would not be caught.

  - name: RegexLiterals
    intro_order: 40
    threshold: regex-refined-string-types
    requires: [regex-refined-string-types, regex-full-match-lowering, switch-expressions,
               pattern-matching-core, string-interpolation, var-type-inference]
    untested:
      - Full match is lowered by wrapping the pattern via string concatenation, so an
        already-anchored pattern gets DOUBLE-anchored. Correct here only because no test uses
        multiline or an alternation spanning the anchor.
      - Invalid-pattern rejection is never exercised.

  - name: DropSemantics
    intro_order: 66
    threshold: with-blocks-and-drop-scopes
    requires: [with-blocks-and-drop-scopes, drop-recognition-and-insertion,
               substructural-disciplines, generic-constraints-nominal, instance-fields,
               constructors, string-interpolation]
    untested:
      - The generic box's drop emits the inner field drop AFTER the return, so it is
        unreachable and no output line asserts it. It also uses dynamic dispatch rather than
        constraint-resolved dispatch.
      - Nothing exercises a use-after-move or a linear binding dropped twice.

  - name: Ownership
    intro_order: 68
    threshold: this-tier-inference
    requires: [this-tier-inference, jagged-per-field-ownership, iclonable-implicit-clone,
               method-tier-visibility-filtering, instance-fields, constructors,
               property-declarations-and-accessors, string-interpolation]
    untested:
      - Every specifier except readonly ref ERASES at emission, so there is no runtime
        evidence distinguishing correct analysis from missing analysis. The would-fail cases
        are comments and are never compiled.
      - An explicit clone into an owned binding emits a DOUBLE clone, so explicit clone is
        not recognised as owned provenance.
      - Implicit clone for an immutable reference type emits no clone at all, which looks
        correct only because the type is immutable.

  - name: SubstructuralFieldDiscipline
    intro_order: 71
    threshold: async-expression-functor
    requires: [substructural-field-containment, async-expression-functor,
               drop-recognition-and-insertion, generic-constraints-nominal,
               instance-fields, string-interpolation]
    untested:
      - Only PERMITTED combinations appear, so the rejecting half of the containment matrix
        never fires.
      - The generic field drop goes through dynamic dispatch and sits after the return, so
        the constraint is neither used to resolve the drop nor reached.

  - name: DisposableDropInterop
    intro_order: 81
    threshold: disposable-drop-interop
    requires: [disposable-drop-interop, with-blocks-and-drop-scopes,
               property-declarations-and-accessors, instance-fields, constructors,
               string-interpolation]
    untested:
      - This directory has NO build output, so the sample has never been compiled or run.
        Nothing in it is verified.
      - The asymmetry case asserts a NEGATIVE purely by output ordering, which would still
        read correctly if the drop fired late.

  - name: StructuredConcurrency
    intro_order: 52
    threshold: async-state-machine-lowering
    requires: [async-state-machine-lowering, discarded-task-obligation,
               async-expression-functor, entry-point-resolution, string-interpolation]
    untested:
      - The two scope-exit-await demonstrations emit NO await at all. The output only looks
        right because every helper completes synchronously before returning.
      - Concurrent ordering is unproven -- nothing schedules or joins, so the printed order
        is incidental.

  - name: AsyncDropChaining
    intro_order: 67
    threshold: async-drop-chaining
    requires: [async-drop-chaining, async-expression-functor, lambda-expressions,
               substructural-disciplines, string-interpolation]
    untested:
      - The recursive chain is only ever ONE level deep, so no fixpoint or cycle guard is
        exercised.
      - Auto-await inside the sync lambda lowers to a blocking getter, which cannot deadlock
        here only because nothing installs a synchronization context.

  - name: StructuredContext
    intro_order: 41
    threshold: structured-context
    requires: [structured-context, abstract-type-declaration,
               nominal-conformance-and-slot-checking, union-types-and-carriers,
               instance-fields, constructors, string-interpolation]
    untested:
      - The context store is a process-global static dictionary, not thread-static or
        flow-local, so this is correct only because the sample is single-threaded and
        synchronous.
      - Generic constructed types as independent keys is explicitly WAIVED in a source
        comment and demonstrated with hand-written wrapper types instead.
      - The missing-context diagnostic is never triggered.

  - name: Attributes
    intro_order: 83
    threshold: clr-assembly-type-projection
    requires: [generic-attributes, attribute-arguments-and-type-literals,
               indexer-declarations, property-declarations-and-accessors,
               global-usings-from-manifest, clr-assembly-type-projection,
               struct-declaration, string-interpolation]
    untested:
      - Attributes can be emitted VERBATIM with zero type resolution and the sample still
        passes, because the C# compiler validates them.
      - No output line reflects any attribute, so a dropped or mis-targeted attribute is
        invisible. Several annotate members the sample never reads.

  - name: Testing
    intro_order: 82
    threshold: mist-test-command
    requires: [mist-test-command, attribute-arguments-and-type-literals,
               type-argument-inference]
    untested:
      - Bodies compute over literals, so a build-only check passes vacuously without the
        runner ever executing.
      - Collapsed repeated data attributes would yield fewer test cases but no failure.
      - Nothing verifies the emitted output type beyond the external runner succeeding, which
        it also would for an executable.

  - name: StormAnonymousGroups
    intro_order: 87
    threshold: nary-operator-group-folding
    requires: [nary-operator-group-folding, var-type-inference, string-interpolation]
    untested:
      - Two of the three arithmetic chains are associative and commutative, so a wrong fold
        order still prints the right answer. Only the mixed addition-and-subtraction chain
        distinguishes association.
      - No mixed-precedence chain, so interaction between the two group lists is unexercised.
      - All operands are literals with no side effects, so constant folding could yield right
        answers over a wrong tree and short-circuiting is not observable.

# =====================================================================
# NON-SAMPLE ACCEPTANCE TARGETS
#
# The stdlib is transpiled by v2 on EVERY compile, and it exercises constructs no
# sample touches. Tracking samples alone structurally cannot see these.
# =====================================================================

non_sample_targets:

  - name: stdlib
    kind: library
    path: Source/Standard
    threshold: intrinsic-member-declarations
    requires: [intrinsic-member-declarations, operator-overload-declarations,
               cast-operator-declarations, property-declarations-and-accessors,
               indexer-declarations, associated-type-slots, type-pack-declarations,
               generic-type-aliases, dependent-type-parameters,
               refinement-type-declarations, nominal-conformance-and-slot-checking,
               struct-declaration]
    note: >
      Every v2 compile transpiles this, so it is the one target that is already exercised on
      every run -- and it is currently emitted with operators, cast operators and properties
      silently dropped. The array type alone needs a dependent length parameter, a refinement
      alias for its bounds, an associated enumerator slot, an indexer with a refined
      parameter, a nested struct and the intrinsic modifier.
    untested:
      - Nothing asserts on the emitted stdlib. The samples pass because they do not call the
        dropped members, so the stdlib's own correctness has no test at all.
      - The unit type is transpiled and then rewritten to the void keyword at every
        reference, so the emitted file is dead code that still had to compile -- which is how
        the forced-public struct constructor workaround came about.

# =====================================================================
# ORPHAN CAPABILITIES
#
# Required by no target. Each is a soundness check whose only observable is a
# REJECTION, and no sample can contain one because samples must build clean.
# =====================================================================

orphan_capabilities:

  - id: static-context-checking
    reason: >
      Its whole purpose is rejecting a this reference or an instance-field read in a static
      member. Every sample is legal by construction, so no sample can require it. Classes
      exercises the neighbouring code path and would pass WITHOUT this check, which is
      precisely why it needs a unit test rather than a sample.

  - id: member-before-namespace-precedence
    reason: >
      Observable only when a field name collides with a visible type name. No sample contains
      such a collision. Needs a unit test asserting the field wins.

  - id: non-public-type-accessibility
    reason: >
      No tier-0 through tier-8 sample declares a non-public type, so the current collapse of
      every non-public level to C# internal is latent. Needs a unit test per level.

# =====================================================================
# UNCOVERED CONSTRUCTS
#
# The grammar generates 403 AST node classes. After removing 65 abstract rule nodes,
# 14 operator-symbol nodes recorded as operators instead, and 4 precedence-plumbing
# nodes, these 24 appear in NO sample. Recorded so this file cannot be mistaken for
# evidence that the sample suite is complete.
#
# disposition: needs-sample | unit-test-only | dead-grammar | stdlib-only
# =====================================================================

uncovered_constructs:

  - construct: OperatorMemberMemberDeclarationNode
    what: User-declared operator overloads
    disposition: stdlib-only
    capability: operator-overload-declarations
    note: >
      The sharpest gap in the suite. Declared in 16 stdlib files, dropped silently by the
      emitter, and unreachable from any sample. Every arithmetic and comparison operator on a
      Mist primitive depends on it.

  - construct: IntrinsicModifierModifierNode
    what: The intrinsic modifier
    disposition: stdlib-only
    capability: intrinsic-member-declarations

  - construct: BinaryLiteralExpressionPrimaryNode
    what: Binary integer literals
    disposition: needs-sample
    note: Primitives covers decimal and hex but not binary.

  - construct: BinaryLiteralTypeArgumentTypeArgumentNode
    what: A binary literal as a dependent type argument
    disposition: needs-sample
    capability: dependent-type-parameters

  - construct: HexLiteralTypeArgumentTypeArgumentNode
    what: A hex literal as a dependent type argument
    disposition: needs-sample
    capability: dependent-type-parameters

  - construct: FalseLiteralTypeArgumentTypeArgumentNode
    what: A false literal as a dependent type argument
    disposition: needs-sample
    capability: dependent-type-parameters
    note: DependentTypes covers the true literal but not the false one.

  - construct: CharConstantConstantLiteralNode
    what: A char constant in pattern position
    disposition: needs-sample
    capability: constant-and-relational-patterns

  - construct: FloatConstantConstantLiteralNode
    what: A float constant in pattern position
    disposition: needs-sample
    capability: constant-and-relational-patterns

  - construct: CompoundRefinementPredicateRefinementPredicateNode
    what: A compound refinement predicate
    disposition: needs-sample
    capability: refinement-type-declarations

  - construct: DefaultTypeBindingDefaultFieldInitializerNode
    what: The type-binding form inside a default block
    disposition: needs-sample
    capability: default-value-synthesis
    note: DefaultKeyword covers the field-override form only.

  - construct: ExpressionInitAccessorAccessorDeclarationNode
    what: An expression-bodied init accessor
    disposition: needs-sample
    capability: property-accessor-accessibility-and-init

  - construct: ExtensionItemTopLevelItemNode
    what: An extension block at top level rather than in a namespace body
    disposition: needs-sample
    capability: extension-block-declaration

  - construct: ForInitializerExpressionForInitializerNode
    what: A for loop whose initializer is an expression rather than a declaration
    disposition: needs-sample
    capability: control-flow-basic

  - construct: NamedAttributeArgumentAttributeArgumentNode
    what: A named attribute argument
    disposition: needs-sample
    capability: attribute-arguments-and-type-literals
    note: >
      Attributes claims to cover named arguments in a comment but every argument in the
      sample is positional.

  - construct: NamespaceNamespaceItemNamespaceBodyItemNode
    what: A namespace nested inside a namespace body
    disposition: needs-sample
    capability: nested-block-namespaces

  - construct: NestedNewtypeMemberMemberDeclarationNode
    what: A newtype nested inside a type
    disposition: needs-sample
    capability: newtype-declarations

  - construct: NestedTypeAliasMemberMemberDeclarationNode
    what: A type alias nested inside a type
    disposition: needs-sample
    capability: type-alias-declarations

  - construct: OptionalMemberAccessSuffixPostfixSuffixNode
    what: Conditional MEMBER access, as distinct from a conditional method call
    disposition: needs-sample
    capability: optional-operators
    note: OptionalTypes covers the conditional invocation form only.

  - construct: OwnedConstraintConstraintNode
    what: An owned generic constraint
    disposition: needs-sample
    capability: substructural-field-containment

  - construct: ParenthesizedTypeRefSingleTypeRefNode
    what: A parenthesized type reference
    disposition: needs-sample
    note: >
      Probably only observable where it disambiguates a union inside a function type or an
      array element type.

  - construct: ReadonlyRefSpecifierOwnershipSpecifierNode
    what: The readonly ref ownership specifier
    disposition: needs-sample
    capability: ownership-specifiers
    note: >
      RefParameters uses a readonly ref LOCAL, which is a different node. This is the
      ownership-specifier position.

  - construct: TargetTypedNewExpressionNoArgsPrimaryNode
    what: Target-typed creation with an initializer block and no argument list
    disposition: needs-sample
    capability: target-typed-new

  - construct: UnknownElementTypeRefElementTypeRefNode
    what: An unknown array element type
    disposition: needs-sample
