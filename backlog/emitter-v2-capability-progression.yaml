    untested:
      - The three printers are uniquely named, not overloaded, so argument-type-driven
        resolution over the three array types is never required. If every literal inferred
        as an unknown element type the calls would still bind and print correctly.
      - The empty literal is observed only through its Length, so the target-typed empty
