      so it needs no using directives" holds for MIST-DECLARED types and for no others:
      TypeNameEmitter.ShouldQualify returns false for every ambient type, on the assumption the
      emitted usings cover its CLR namespace. So a file reaching a CLR type through a manifest
      global using named it nowhere -- not in the file, not in the emitted usings, which copied only
      unit.Usings -- and the name arrived in C# with nothing to bind it to. Measured with a probe
