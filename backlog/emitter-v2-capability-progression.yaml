    unlocks: []

  - id: refinement-implication-engine
    name: Predicate entailment between refinements
    order: 143
    layer: refinement-types
    requires: [refinement-static-discharge]
    v2_status: done
    verified_by: unexercised
    evidence: >
      Assignability is ENTAILMENT, not predicate equality and not alias identity. The engine
      normalizes into relational, equality, negation and disjunction constraints and covers
      cross-operator strictness, disjunction membership and subset, and conjunctive interval
      containment, with the base type held fixed.

      THE WHOLE OF IT IS A JUDGEMENT ON A FINISHED MODEL, which is why nothing was built here and
      why samples/RefinementComparison banks without it. An entailment engine decides which
      assignments to REJECT; every assignment the sample makes is one that should be accepted, and
      v2 accepts them all -- for the wrong reason, since it accepts the rejectable ones too.

      SAID PLAINLY BECAUSE THE BASELINE CANNOT SAY IT. A stdout diff sees only programs that run, so
      a sample demonstrating accepted conversions passes identically under a correct engine and
      under no engine at all. RefinementComparison being green is not evidence that entailment
