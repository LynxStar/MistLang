      THE ARGUMENT POSITION CARRIES A REAL LIMIT rather than an unfinished one. A parameter type
      can target an argument only once the overload is known, and the overload is chosen from the
      argument types, so the two are circular. ArgumentBinder therefore pushes a parameter type
      only where exactly ONE candidate takes this many arguments, which covers every call in the
      sample. Where several do, the argument gets no target and
      MIST_PM_TARGET_TYPED_NEW_NO_TARGET asks for the type rather than guessing at a parameter.
      C# breaks the circle properly, by treating the construction as convertible to anything with
      an applicable constructor.

