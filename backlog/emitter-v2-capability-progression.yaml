      projection reaches -- `System.` plus the Standard name through the unconditional `using System`,
      or WellKnownTypeMap's entry, or RegexLowering's. A nested intrinsic type resolves to the CLR
      nesting of the same name, or failing that to what the CLR returns where Mist returns it, which is
      how Array's Enumerator is the IEnumerator that System.Array.GetEnumerator answers. Name matching
      proves a member exists, not that the emitted call compiles, so samples/StandardSurface stays the
      end-to-end proof. IntrinsicSupplyTests (Tier 4) walks the real Standard against the runtime's
      metadata and fails on any member in no category, so a new intrinsic without emission fails a test
      rather than a user's build; MissingIntrinsicRefusalTests (Tier 3) hands the emitter an oracle
      that finds nothing and reads the refusal off Math.Abs.

      MEASURING IT FOUND A FOURTH MEMBER OF THE CLASS. Task<TResult>.Drop() and ValueTask<TResult>.Drop()
      are declared intrinsic and no CLR task has a Drop; an explicit `pending.Drop()` bound, emitted as
