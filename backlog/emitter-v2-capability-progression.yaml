  # ===================================================================
  # Layer AH -- conversion classification.
  # ===================================================================

  - id: conversion-classification-for-as
    name: Total versus fallible conversion classification
    order: 182
    layer: conversions-advanced
    requires: [pattern-matching-core, union-types-and-carriers]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      The as operator's RESULT TYPE depends on the classification -- a bare type for a provable
      conversion, an optional for a runtime-checked one. C# always yields a nullable, so this is a
      divergence, and it is why the classification is RECORDED ON THE MODEL rather than recomputed at
      emission: one lookup answers both what the expression's type is and which C# spelling produces it.
      TypeTestPattern.Constituent's reason, at the same layer.

      FOUR KINDS, and the ORDER is forced. Identity answers first, then containment as WIDENING, so a
      conversion that cannot fail is never classified as one that can; the union arm precedes
      containment-in-reverse, because a constituent has to be reached through its own carrier accessor and
      a carrier stands in no relation to what it holds; NARROWING closes it. `unknown` is an arm of its own
      because ConversionRelation declines to reason about it, answering false in both directions -- every
      value inhabits it, so narrowing out of it is checked rather than unrelated.

      THE OPERAND IS EVALUATED ONCE in every form, which is the thing classic gets wrong: it re-emits the
      operand twice for a reference constituent and three times for a value one, inside a ternary. Both of
      C#'s runtime-checked spellings already bind what they tested -- `as` answers the value or null, an
      `is` pattern binds it -- so neither wants the operand again. Measured rather than assumed: a
      side-effecting operand counted exactly one evaluation for unknown narrowing, union extraction and
      reference narrowing alike.

      A UNION NEEDS NO TEST AT ALL, which is order 98's accessor paying for itself a second time.
      `AsInt32OrNull` already answers the constituent or absent, and that IS the lifted result type this
      expression carries, so `union as int` emits as `union.AsInt32OrNull` -- no conditional, nothing that
      could be re-evaluated. Where the target sits INSIDE a constituent rather than equal to it the
      accessor answers wider, so exactly one further test composes onto it and `Animal | int as Dog` emits
      as `(wide.AsAnimalOrNull as Dog)`.

      TWO RELATIONSHIPS ARE REFUSED, and that is a SPELLING problem rather than a classification one. Two
      siblings under one base, and a struct against an abstract it does not declare, are both reachable in
      principle; neither is expressible as C#'s `as`, which demands a reference conversion that sibling
      classes do not have and a struct cannot acquire by subclassing. Admitting them would report nothing
      and put a CS0039 in a generated file, so they report MIST_PM_AS_NO_RELATIONSHIP instead. Classic
      classifies both as non-provable and would emit the broken C#; no sample reaches it. An abstract is
      otherwise unaffected -- a declared conformance IS containment, so widening to one and narrowing from
      one both go through the ordinary arms, verified by hand.

      ONE DIAGNOSTIC where classic has three. Classic words a void source and a void target separately;
      nothing converts to or from the unit type, so "no relationship" is already the true answer there and
      the extra descriptors would only say it more specifically.

      AsOperator is banked in AllFeaturesV2, output identical to classic.
    tasks:
      - >
        Find a spelling for the two refused relationships, or settle that they stay refused. A sibling
        narrow could go through a common base and a struct-to-abstract through boxing, and both change
        what the operand COSTS, so this is a language decision rather than an emitter one.
    unlocks: []

  - id: struct-inheritance-flattening
    name: Struct inheritance by field flattening
    order: 183
    layer: conversions-advanced
    requires: [struct-inheritance]
    v2_status: partial
    verified_by: v2-semantics
    evidence: >
      Inherited fields and methods flatten into the derived struct, base constructor chaining
      runs through every level, and a derived-to-base implicit conversion is synthesized that
      copies only the base fields, applied at assignment, argument and return positions and
      able to skip a level. Generic struct bases must substitute before the layout forms.

      v2 emits all of this. Rather than inlining a base constructor's statements, it emits one
      private __{Base}_ctor initializer per ancestor constructor and calls it, which keeps the
      base body and its chain arguments emitting verbatim in terms of their own parameters.
      Structs carry [StructLayout(Sequential)] and ancestor fields are laid out root-first, so
      an ancestor's fields sit at the same offsets in the derived struct. Verified against the
      classic pipeline: StructInheritance output is byte-identical apart from the residue below.

      Not a struct-to-class lowering. Classic turns an inheriting struct into a class, which
      changes allocation and dispatch cost, so v2 does not follow it.
    tasks:
      - Bind a member inherited from a GENERIC base. `ext.Value`, where `ExtendedContainer<int>`
        extends `Container<int>`, reports MIST_PM_UNRESOLVED_MEMBER on 'ExtendedContainer<>' --
        member lookup does not walk a constructed base's chain. This is stage 4, not the backend,
        and is what keeps StructInheritance out of AllFeaturesV2.
      - Prove generic substitution with a CONCRETE type argument, a struct extending
        `Container<int>` rather than `Container<T>`. The substitution is implemented but no
        sample reaches it.
      - >
        DONE. A private or readonly ancestor field, and an ancestor property, now copy correctly:
        the conversion calls a generated factory on the ancestor instead of assigning its fields from
        outside. MIST_BE_STRUCT_CONVERSION_FIELD is deleted. See order 42.
      - >
        DONE. A COMPUTED property no longer joins the factory, which it did on EVERY struct and not
        only an inheriting one. StructAncestorFactory transported all of flattened.Properties and
        assigned each, which is right for an auto-property -- its backing field is the state, and a
        constructor is the only place C# permits writing a get-only one -- and wrong for a property
        with a body, which has no storage of its own and derives from members the factory already
        moves. A struct with `private int degrees; public int Degrees => degrees;` and no base, no
        abstract and no conformance therefore failed with "Property or indexer cannot be assigned to"
        against generated C#. Found while banking Iterators, whose struct enumerator has exactly that
        shape in `public int Current => current;`, but reachable from a plain struct alone -- so the
        gap was never about inheritance, only surfaced through it.
      - >
        REINTERPRETATION IS NOT AVAILABLE AS A SHORTCUT HERE, and FlattenedStruct's doc comment
        claimed otherwise until this was measured. The CLR honours LayoutKind.Sequential only for a
        struct holding no managed reference, transitively; with one anywhere inside, references are
        grouped first and a derived struct adding a reference of its own DISPLACES its ancestor's
        fields, so a shared prefix does not sit at shared offsets. Generic structs are auto-laid-out
        regardless. A struct with `int a; string s;` and a derived one appending `string t` was
        measured moving `a` from offset 8 to 16, non-generic, with Sequential declared on both.
        Reinterpretation is sound only where every field in the whole chain is an unmanaged value
        type and no type parameter is involved -- `bool`, `char`, `nint` and nested value structs
        qualify, so the predicate is `unmanaged` rather than blittable, and it is decidable at emit
        time. Nothing needs it yet, because a copy serves by-value widening.
      - >
        `ref` WIDENING WILL NEED IT, and cannot use the copy. C# refuses a user-defined conversion at
        a `ref` position (CS1503) because the callee needs the caller's storage, so widening a
        `ref Derived` to a `ref Ancestor` requires aliasing, which only reinterpretation gives. That
        makes the unmanaged predicate above a USER-VISIBLE LANGUAGE RULE rather than an optimization
        switch: a struct with one `string` in its ancestry can be widened by value and not by `ref`.
        Was blocked behind ref-parameters-and-ref-locals (order 132) while that was `broken`; 132
        is `done` as of feddfdf7, so this is now unblocked and merely unbuilt.
      - Name a generic ancestor more than one level up by its own arguments rather than the
        parent's. Correct only where the arguments pass straight through unchanged.
    unlocks: [AsOperator, StructInheritance]

