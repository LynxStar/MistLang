      THE RULE. PatternAnalyzer.IsComparable moved, unchanged, to Comparability.Supports, which both rules
      ask, so a pattern and a refinement cannot disagree about a type: a primitive numeric, a char, or a
      refinement or enum over one. Comparability.Misordered finds a relational comparison whose own scrutinee
      Supports refuses. It looks through `and`, `or` and `not`, not into a property subpattern, and never at a
      scrutinee that is already an ErrorType. DeclarationShapeAnalyzer asks it of each predicate
      PredicateBinder binds: every constituent of an alias; every dependent parameter of a type or of a method,
      operator, constructor or cast operator; and every parameter of those, and of an indexer, whose type is an
      ANONYMOUS refinement. A parameter typed by a named refinement is the alias's to answer. One report per
      predicate, however many of its conjuncts order. THE USES STAY SILENT by asking the same question in each
      reader that complained. Requirement.Of reads a misordered comparison as nothing it can decide, which
      silences the prover, the strengthening check and dependent closings. Assignability admits any value into
      a refused refinement. PatternAnalyzer does not walk a refused refinement under a type test.

