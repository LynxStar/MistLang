      PARALLEL REFINEMENT FOLLOW-UPS (2026-09-26). RangeBound now captures an immutable admitted set when
      the range is constructed. Later writes never reread that symbol, and copies carry the captured
      value. Exact offsets compare by numeric value; non-exact descriptors retain symbol identity and
      from-end markers, without inferring correlation between their independent interval sets. Loop
      declarations and introduced bindings clear prior facts, and unseen writes and ref aliases remain
      conservative. Join and Same compare the same bound representation; differing ranges remain lost
      even if their resulting lengths happen to agree.

