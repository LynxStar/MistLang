      process spawned. Model-level rather than through output because C# HAS target-typed new of
      its own, so emitting `new(...)` unchanged would let Roslyn resolve it and print the right
      answer whatever Mist decided. Emission spells the resolved type instead, which the sample's
      generated C# shows as `new TargetTypedNew.Point(3, 4)`.
