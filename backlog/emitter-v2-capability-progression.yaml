      as well as enabling the feature. An enclosing target type used to reach straight through an
      argument list, so `Point p = new(3, 4)` bound its arguments with Point as their target --
      harmless for an integer literal, wrong for an array literal. It is also why the nested case
      earns a test: an inner `new` inheriting the outer target would construct a second Holder
      instead of the Tag its parameter asks for.

