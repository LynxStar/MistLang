        is never touched.

  - name: StructInheritance
    intro_order: 53
    threshold: struct-inheritance-flattening
    requires: [struct-inheritance-flattening, type-argument-substitution,
               string-interpolation, var-type-inference]
    untested:
      - The sample works around its own gaps, so those gaps cannot fail it. The multi-level
        constructor chain is unprovable either way because the derived constructor
        re-assigns the grandparent fields by hand.
      - The base struct's method is declared and never called, so inherited-method resolution
        is never exercised.
      - The generic derived struct's inherited field is never read, hiding the generic
        flattening gap. No base-to-derived negative case.

  - name: AssemblyTypeProvider
    intro_order: 58
    threshold: clr-nullable-projection
    requires: [clr-nullable-projection, clr-byref-parameter-projection,
               clr-generic-construction-and-members, arrays-sized-index-length,
               string-interpolation]
    untested:
      - Every optional-projected result is consumed without narrowing, so union discipline is
        never forced.
      - The failing branch of the by-ref lookup is never taken.

  - name: CSharpInteropV2
    intro_order: 72
    threshold: span-projection-and-length-erasure
    requires: [framework-and-package-reference-resolution, clr-extension-method-discovery,
               span-projection-and-length-erasure, array-literals, string-interpolation]
    untested:
      - Each chosen overload is the only one applicable to its single argument, so no
        conversion competition is exercised even though ref structs are visible candidates
        that must lose.
      - All string returns are optional-projected and never narrowed.

  - name: ClrRefInterop
    intro_order: 59
    threshold: ref-parameters-and-ref-locals
    requires: [ref-parameters-and-ref-locals, clr-generic-construction-and-members,
               string-interpolation]
    untested:
      - The in-parameter case is declared as a plain ref, so that projection path is never
        exercised.
      - The out-parameter miss only observes the caller's own initial value, so callee-assigns
        semantics are weakly checked.

  - name: RefParameters
    intro_order: 45
    threshold: adhoc-refinement-where-clauses
    requires: [ref-parameters-and-ref-locals, adhoc-refinement-where-clauses,
               struct-declaration, instance-fields, arrays-sized-index-length,
               string-interpolation]
    untested:
      - The readonly ref local emits a plain COPY, so the alias is dropped, and the sample
        only prints the local -- a copy passes.
      - No write through a readonly ref is attempted.
      - The ref-returning accessor is only ever called with a literal index.

  - name: ReadonlyLocals
    intro_order: 51
    threshold: ownership-specifiers
    requires: [readonly-locals-and-blocks, ownership-specifiers, tuple-deconstruction,
