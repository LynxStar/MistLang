  - id: abstract-type-default-members
    name: Default member implementations on an abstract type
    order: 71
    layer: abstract-types
    requires: [abstract-type-declaration]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      SPEC: .kiro/specs/abstract-type-unification/requirements.md, Requirement 13 for the slot
      against default distinction the parser draws, and Requirement 16.1 for this emission. 16.1 is
      the whole of what this entry owes and it is satisfied. The rest of Requirement 16 concerns
      reaching the default from a concrete receiver and belongs to order 72, where two of its clauses
      are recorded as WRONG.

      A bodied member on an abstract type is a default, emitted as a C# default interface method.

      SHAPEABSTRACTS EXERCISES IT, which is what makes this `v2-semantics` rather than
      `unexercised`. IShape declares a bodied `Summary()` whose body reads a property slot and calls
      two method slots through `this`, and the sample invokes it twice: once through an IShape
      reference and once through IResizable, which INHERITS the default from its base abstract. Both
      lines are in AllFeaturesV2.out and in AllFeatures.out, identical, so the two pipelines agree on
      a default's dispatch as well as on its emission.

      The capability was banked before that coverage existed, on scratch programs since deleted, and
      the sample was extended precisely because a `done` nothing runs is a status resting on
      evidence nobody can re-check.

      WAS BROKEN, NOT MISSING, AND THE FIX IS SMALL. TypeEmitter.EmitInterfaceMethod terminated
      every abstract-type method with a semicolon and discarded Method.Body, so `string Describe()
      { ... }` came out as `string Describe();` and every conformer was short one implementation --
      Roslyn refusing the generated file with "'Widget' does not implement interface member
      'IDescribable.Describe()'", with no Mist diagnostic and no sentinel, because the emission
      looked like a well-formed interface and what was wrong about it was an absence. C# has had
      default interface methods since 8.0, so no lowering was needed: the body emits as a block when
      Method.Body is non-null and the semicolon is kept only for a slot.

      ITS DOC COMMENT IS WHY IT LOOKED FINISHED. It asserted that interface methods are bodiless
      declarations as a universal truth, which is true of slots and false of defaults.

      A SECOND DEFECT IN THE SAME EXPRESSION, found by reading it rather than by the reported
      symptom: EmitInterfaceMethod also dropped Method.TypeParametersList, so a GENERIC slot emitted
      as `string Echo(T value)` with no `<T>` and failed as "The type or namespace name 'T' could not
      be found". Measured broken on v2 and working on classic, and fixed in the same change.

      BOTH WERE ONE BUG: A LESSER COPY OF METHOD EMISSION. The interface path spelled its own
      signature rather than sharing MethodEmitter's, so it drifted from it. The fix extracts
      MethodEmitter.EmitSignature -- return type, name, type parameters, parameters -- and has both
      paths compose it, which is what makes a future addition to a signature reach the interface
      form without anyone remembering to. The accessibility handling is untouched, since C# interface
      members are implicitly public and neither path emits a modifier.

      THE RESIDUE BELONGS TO ORDER 72, and the boundary was measured rather than assumed. Calling a
      default through a CONCRETE-typed receiver still fails on v2 -- "'Widget' does not contain a
      definition for 'Describe'" -- and works on classic, because a C# default is unreachable except
      through an interface-typed reference. That is default-member-forwarding-stubs, which needs the
      Rust-style duplication, and it is the reason v2 remains behind classic on defaults overall
      even with this entry done.
    unlocks: []

  - id: default-member-forwarding-stubs
    name: Default members callable directly on a conformer
    order: 72
    layer: abstract-types
    requires: [abstract-type-default-members, nominal-conformance-and-slot-checking]
    v2_status: partial
    verified_by: v2-semantics
    evidence: >
      Rust-style semantics. A C# default interface method is callable only through an
      interface-typed reference, so the body is RESTATED on every conformer that does not answer
      for itself. A forwarding stub casting to the interface would recurse infinitely, because the
      public method it sits in becomes the implicit implementation and the cast dispatches back
      into it -- so restating is forced rather than chosen. DefaultMemberDuplication collects what
      a conformer owes and TypeEmitter emits it after the type's own methods, which is also the
      order classic emits in.

      COVERED IN SHAPEABSTRACTS RATHER THAN WHERE THE SPEC PUTS IT. Requirement 29's Build-Up
      Plan assigns the Phase 3 demonstrations to samples/AbstractTypes, which holds the proof code
      and cannot be banked on v2 until order 73 lands. ShapeAbstracts is banked in both
      orchestrators, so it is where the coverage can actually bite today. See that sample's untested
      notes, which also record that NOTHING runs AbstractTypes on either pipeline.

      ALL THREE TASKS LAND AND SHAPEABSTRACTS EXERCISES ALL THREE. Circle takes IShape's `Summary`
      DIRECTLY. Rectangle takes it TRANSITIVELY, conforming to IResizable which inherits it from
      IShape. And Rectangle answers `Kind` itself while Circle takes the default, which is the
      SUPPRESSION case -- so a regression in any of the three fails a Tier 6 baseline. Measured
      byte-identical to classic on the sample and on a scratch program covering a default that
      calls another default.

      SPEC: .kiro/specs/abstract-type-unification/requirements.md, Requirements 14, 15 and 16.
      REQUIREMENT 15 IS SATISFIED IN FULL and every clause of it is measured -- callable on the
      concrete type (15.1), identical behaviour through either reference (15.2), a conformer's own
      implementation used through either reference (15.3), `this` resolving against the abstract's
      full member set including inherited members (15.4), a default calling another default (15.5),
      and only methods having defaults (15.6, enforced by the parser). Of Requirement 14 this entry
      delivers 14.3 and 14.6 and half of 14.4; the other half, rejecting a near-miss, is order 69's.

      REQUIREMENT 16 IS WRONG WHERE IT IS SPECIFIC, AND THAT IS PROVEN RATHER THAN ARGUED. 16.1 and
      16.4 are satisfied -- the default emits as a C# default interface method, and a conformer that
      answers for itself gets only its own member. But 16.2 and 16.5 prescribe a FORWARDING STUB
      USING AN EXPLICIT INTERFACE CAST, spelling it `public string Greet() =>
      ((IGreeting)this).Greet();`, and that construct does not terminate. Compiled and run as C#
      exactly as written, it dies with a stack overflow at 261298 frames of `P.Greet()`: the public
      method is the implicit implementation of the interface member, so the cast dispatches back
      into the method it sits in. 16.3 states the goal the stub was meant to reach and is satisfied
      by restating the body instead.

      NEITHER PIPELINE IMPLEMENTS 16.2, and classic never did -- it emits the body verbatim onto the
      conformer, which is what this entry matches. So the CAPABILITY NAME is the spec's word rather
      than a description of the mechanism; nothing here forwards. Requirement 16 wants amending to
      say the body is restated, and until it is, the spec and both implementations disagree on
      paper.

      SUPPRESSION IS BY THE CONFORMER'S OWN MEMBERS ONLY, matched on name and parameter count, and
      that is measured against classic rather than assumed. A member reached through a concrete
      BASE does NOT suppress the restatement, so the restatement hides that base member: classic
      emits `Hello` onto `InheritsImpl : BaseSaysHello, IGreet` even though BaseSaysHello declares
      one, and prints the default's body rather than the base's. Suppressing there instead would
      have been the natural guess and would not match. A DIAMOND resolves to the nearest abstract
      in base-list order, one member emitted rather than two, which is also what keeps C# from
      seeing a duplicate declaration.

      NAME AND PARAMETER COUNT IS WEAKER THAN 14.5, WHICH ALSO REQUIRES THE RETURN TYPE, and that is
      a KNOWN GAP recorded on order 69 rather than a test to tighten here. Tightening it in the
      emitter makes the failure worse, not better: a conformer declaring `int Summary()` against a
      `string Summary()` default would stop suppressing, so both would be emitted and C# would
      refuse the DECLARATION for redeclaring one parameter list, where today it refuses the missing
      implementation only if something calls it. The program is invalid either way and 14.4 says a
      mismatch is to be REJECTED, which is a check and belongs with the other checks. So the loose
      test is deliberate: it keeps the emitter from turning an unreported semantic error into a
      syntactic one ahead of the analyzer that should have caught it.

      FOUR MORE SHAPES MEASURED, all byte-identical to classic on both pipelines, because the
      sample reaches none of them. A STRUCT conformer gets the restatement, which is the case the
      `declared` parameter exists for -- a struct emits a FLATTENED method set, and matching
      suppression against anything else is how a duplicate member would reach C#; the emitted
      struct carries `Wrap` exactly once. A default WITH PARAMETERS restates and dispatches. A
      conformer declaring the default's NAME AT A DIFFERENT ARITY does not answer it, so both are
      emitted and both are callable -- a legitimate overload pair rather than a duplicate, which is
      what the arity half of the match is for. And a default calling ANOTHER default works, both
      being restated onto the same conformer.

      `partial` FOR GENERIC ABSTRACTS ONLY, and the blocking half is not here. A default whose
      SIGNATURE names its abstract's type parameter is deliberately skipped, because restating `T
      Echo()` verbatim puts `T` where the conformer has nothing to bind it to -- and that is an
      error on the DECLARATION, so it would break a build that never called the member. Closing it
      needs the type arguments applied to the body as well as the signature, which is a rewrite of
      a bound block that nothing in the backend does.

      A DEFAULT WITH A CLOSED SIGNATURE ON A GENERIC ABSTRACT NOW WORKS END TO END. `string Show()`
      on `IHold<T>` is restated onto `IntHold : IHold<int>` as valid C# and the concrete-receiver call
      resolves and runs. It previously reported MIST_PM_UNRESOLVED_MEMBER because member lookup did
      not reach a generic ancestor; order 53's walk now does.

      WHAT REMAINS IS THE OPEN SIGNATURE, and the two layers refuse it in step. The emitter skips a
      default whose signature names a type parameter, and order 53's lookup withholds any member of a
      generic base for the same reason -- neither can apply the conformer's type arguments, and both
      would rather answer nothing than answer an open `T`. So the residue is unreachable from either
      side rather than half-emitted, and closing it means composing substitutions along the base
      chain, which is order 53's remaining task.
    tasks:
      - >
        Substitute a generic abstract's type arguments into a restated default, in the BODY as well
        as the signature, and drop the skip in DefaultMemberDuplication.NamesATypeParameter.
        Blocked behind order 53's first task, which has to make the member reachable before
        restating it can be observed. LIVE DEFECT IN CLASSIC to not copy: classic substitutes the
        signature and NOT the body, emitting `T held = this.Item();` into a conformer where no T is
