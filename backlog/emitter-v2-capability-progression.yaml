  - id: delegate-func-conversion
    name: Conversion between structural function types and named delegates
    order: 109
    layer: functions
    requires: [method-group-conversion]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      NOT ATTEMPTED, and the `requires` above understates what it needs. Mist has no delegate
      DECLARATION syntax -- the `Delegate` in Mist.storm is a Storm trait for members carrying a body,
      unrelated -- so a named delegate type can only enter a Mist program by being PROJECTED from a CLR
      assembly. That is clr-assembly-type-projection, order 126, seventeen orders later, and
      DelegateFuncConversion confirms it: the sample needs orders 121, 126, 129 and 131 besides this
      one, and its first line imports Microsoft.AspNetCore.Http.

      So this order cannot be reached from within the functions layer whatever effort is spent on it,
      and its requires should name order 126 rather than implying the layer is self-contained. Recorded
      here rather than acted on, because renumbering to put it after 126 would move a whole layer.
      THE STANDARD.FUNC HALF IS DELIVERED, and it needed packs rather than order 126. Func is
      declared `Func<params TArgs, TResult>`, so collapsing a construction of it into the structural
      function type was impossible until a pack could be bound -- exactly as FunctionType's own
      comment has said since it was written. `Func<int, int> f = x => x * 2;` now binds, runs, and
      is the SAME interned type as `func<int, int>`.

      THIS IS WHAT MIST_PM_LAMBDA_PARAMETER_NO_TYPE WAS, on four samples. Lambda inference worked
      throughout; what failed was that a nominal Func had no parameter types for a lambda to read
      its slots from, and could not be invoked as a function at all. Diagnosed at order 129 and
      fixed here, which is the whole distance between the symptom and the cause.

      THE SPLICE HAD TO REACH A FUNCTION'S PARAMETER LIST, found by the first probe emitting `...`
      into C#. Collapsing happens before the pack is bound, so `type Action<params TArgs> =
      Func<TArgs..., void>` leaves a spread sitting in a parameter list rather than in the argument
      list it was written in, and substitution had no arm for it.

      INFERENCE THROUGH A FUNCTION ARGUMENT CAME WITH IT, and had to: `Apply(Func<TArgs..., TResult>
      f, params TArgs args)` has no other way to learn TResult, since nothing else in the signature
      mentions it. Match had no FunctionType arm at all.

      A LATENT IDENTITY BUG WAS FIXED HERE AND CANNOT YET BE FALSIFIED. TypePackValue compared its
      elements by fully qualified name, which is sound for the interned types a pack usually holds
      and WRONG for a spread: SpreadType is built with no declaring type, so every `TArgs...` in the
      program shares the qualified name `TArgs...` whatever parameter it wraps. Two declarations
      spreading their own packs therefore interned to one value carrying whichever was seen first.
      It now compares the operand, whose qualified name is per-declaration.

      NO PROGRAM DISTINGUISHES THE TWO TODAY, which is recorded rather than glossed: the packs that
      collide are the ones built at a DECLARATION, and a type holding one is refused at emission, so
      the wrong binding never reaches anything observable. Order 153 is what would make it visible.

      STILL MISSING: conversion between a function type and a NAMED CLR delegate, which is what this
      entry is actually about and still needs order 126.

      A CLR DELEGATE IS NOW A FUNCTION TYPE, whatever it is called. Comparison, Predicate and
      RequestDelegate are ordinary delegates Mist has no name for, and a nominal projection of one gave a
      lambda no parameter types to read and a method group nothing to convert to. The Invoke signature is
      what a delegate means, so that is what it resolves to. Func and Action are deliberately excluded --
      they map onto Standard's own declarations and collapse to a function type by their own route, and
      taking them here would bypass the pack that makes one declaration cover seventeen CLR arities.
      
      samples/DelegateFuncConversion drops 17 refusals to 3, having also needed collection initializers.
      
      WHAT REMAINS IS ONE THING, and it is overload resolution's rather than conversion's: a METHOD GROUP
      passed where several overloads could take it. `list.Sort(CompareDescending)` has two candidates of
      arity one -- IComparer<T> and Comparison<T> -- so ArgumentBinder pushes no target type, and a group
      with no target cannot be converted. Its own comment already says why: choosing between candidates
      needs the argument types, which is what binding the argument is about to produce. C# resolves this
      by trying each candidate; v2 would have to do the same.
      
      THE GROUP IS NOW LEFT UNSETTLED RATHER THAN TRIED REPEATEDLY, which answers the paragraph above
      without the speculative re-binding it assumed. A group whose call has several arity matches survives
      binding untyped, applicability asks whether one of its overloads IS the parameter's function type,
      and the chosen overload converts it. So the argument is bound once, not once per candidate: the only
      thing a target was needed for was a question selection could ask directly. Speculative binding would
      also have had to re-declare a lambda's parameters in the scope, which this never reaches.
      
      THE OTHER TWO REFUSALS WERE NOT ABOUT METHOD GROUPS AT ALL, and the diagnostic hid that behind the
      one that was. `app?.MapGet("/hello", () => "Hello!")` has candidates (string, func) and
      (string, Delegate), and the lambda failed applicability against BOTH because no conversion from a
      function type to System.Delegate was known. Every function value IS a delegate once emitted, so that
      is containment and ConversionRelation now says so. It went unnoticed while MapGet was the only such
      call, since a lone candidate is selected without consulting the relation at all.
      
      C# KEEPS A DISTINCTION THE MODEL ERASES, and that is the emitter's to restore. A CLR delegate and
      its function shape are one type to Mist and two to C#, which converts between them only through a
      CONSTRUCTION. A first attempt projected the delegate's SHELL as an alias too, so that Mist source
      naming System.Predicate<int> resolved to the function type -- coherent, and reverted: it left the
      call `numbers.FindAll(predicate)` emitting a Func into a CLR parameter C# declares as Predicate,
      a mismatch nothing in the model could see. Nominal shells stay, and DelegateLowering materialises
      the construction at the sites EmitCoerced already knows a target type for -- the same channel, and
      the same reasoning, as the regex-to-string conversion beside it.
      
      ONE DIVERGENCE FROM CLASSIC SURVIVES, and order 108 already names the reason: a group passed where
      a GENERIC candidate could take it is declined, since its type arguments are inferable only from the
