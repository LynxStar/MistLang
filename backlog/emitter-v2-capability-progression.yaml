  - id: generic-constraints-constructor
    name: Constructor constraints including parameterized forms
    order: 57
    layer: generics
    requires: [generic-constraints-nominal]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      GenericConstraints is BANKED in AllFeaturesV2, and its 16 printed lines are byte-identical to
      classic's. That also flips order 56 off `unexercised`: the constraint resolution and `where`
      emission it delivered are now covered by a baseline rather than measured on an unbanked sample.

      Mist allows a parameterized constructor constraint, which lowers to synthesized factory delegate
      parameters threaded through constructors and call sites. C# has only the parameterless form.

      THE ONE CONSTRAINT THAT CANNOT BE ERASED, and the reason is worth stating because every other
      one can. A constraint normally RESTRICTS what a type argument may be, so dropping it from
      emission loses a check and nothing else -- which is exactly what order 56 does with readonly,
      owned and the substructural kinds. A constructor constraint does the opposite: it ENABLES,
      granting the right to write `new T(value)` inside the generic body. Erase it and the body has no
      way to construct, so the emitted C# does not compile rather than merely going unchecked.

      A SYNTHESIZED STATIC ABSTRACT INTERFACE, one per distinct signature, added to the declaration of
      each type that closes the constraint. `where T : new(int)` emits as
      `where T : Mist.Emission.CSharp.__IConstruct_int<T>`, and `new T(value)` in the body emits as
      `T.__New(value)`. The generic's own shape is UNTOUCHED: same arity, same constructor, no field,
      no delegate, no allocation, and a construction site is byte-identical to the Mist source. The
      constraint is a real C# constraint again, so Roslyn enforces it rather than it being erased.

      THE MEMBER IS ONE OVERLOADED NAME, `__New`, not one per signature. MultiFactory carries
      `new(int)` and `new(bool)` on one parameter, so two constraints share arity one, and naming them
      apart would put signature matching in the emitter -- which cannot tell equal arities apart
      without reimplementing overload resolution. One name hands that to C#. Case 8 is what proves it
      works, printing `int=Widget(5), bool=Widget(1)`.

      THE CLOSING TYPE MUST BE DECLARED IN MIST, and that is the whole cost of this shape. The
      interface is added to a declaration, and a precompiled type has none to add to -- nothing emitted
      can change the interface list recorded in another assembly's metadata. Enforced at STAGE 6 by
      MIST_BE_FOREIGN_CTOR_CONSTRAINT, reported on the Mist source, because it is this BACKEND that
      cannot express the program rather than Mist that forbids it. A monomorphizing or non-CLR backend
      would have no such limit. Measured before choosing: ZERO of the repository's constructor
      constraints are closed by a foreign type -- all eleven live in GenericConstraints and close with
      Widget or OrderableInt. Parameterless `new()` is untouched and any type may still close it.

      APPENDING TO THE DECLARATION IS WHAT MAKES DEPTH IRRELEVANT. `Box<T> : __IConstruct_int<Box<T>>`
      substitutes to cover `Box<Widget>`, `Box<Box<Widget>>` and any depth from one append, so the
      lowering needs no instantiation-depth guard. Monomorphizing the generic would have needed one,
      because polymorphic recursion enumerates unboundedly many instantiations for a program that
      terminates -- that is why the generic is left open and only the capability is specialized.

      DISCOVERY NEEDS A REGISTRY, NOT THE INTERNER, and this is the part most likely to be got wrong.
      A generic TYPE closure interns a ConstructedType, but a generic METHOD closure does not: a call's
      type arguments live on the expression denoting the callee and are never interned, so `Foo(7)`
      resolved to `Foo of Widget` is invisible to the interner. ConstraintClosureRegistry records both,
      from the four resolution sites that have a node plus PostfixBinder for the method case.
      A closure reached through substitution is deliberately not recorded, because an outer generic
      that constructs an inner one must carry the constraint itself, so the concrete type reaches the
      inner only by closing the outer, which is already a recorded site.

      METHOD-LEVEL CONSTRAINTS COME FREE HERE, where the earlier delegate lowering left them unbuilt.
      The constraint is just a `where` clause on the method, so there is no arity change and no
      call-site change; only discovery needed the registry.

      BOTH OF THOSE ARE MEASURED, NOT REASONED, on a scratch program because nothing in the repository
      reaches either. A GENERIC closing type gets ONE append on its open declaration --
      `class Box<T> : Mist.Emission.CSharp.__IConstruct_int<Box<T>>` -- and that single append served
      `IntFactory<Box<int>>` and `IntFactory<Box<Box<int>>>` together, which is the substitution
      argument holding at two depths. A METHOD-LEVEL constraint emitted as
      `static T Make<T>(int seed) where T : Mist.Emission.CSharp.__IConstruct_int<T>` with a body of
      `return T.__New(seed);`, and its call site stayed `Maker.Make<Widget>(33)` with nothing threaded
      in. Five cases across both shapes compiled with zero diagnostics and printed correct values.

      CLASSIC'S TARGET SHAPE IS MEASURED. A `Func<int, T>` field per parameterized constraint, named
      for the parameter and its argument types; a constructor parameter supplying it; `new T(value)`
      rewritten to invoke it; and a factory passed at every construction of the generic type. So this
      is field synthesis plus call-site rewriting rather than an emitter tweak.

      DECIDED: A STATIC ABSTRACT INTERFACE ON THE CLOSING TYPE, after first shipping a threaded factory
      and replacing it. Four shapes were weighed:

      A C# 11 STATIC ABSTRACT INTERFACE MEMBER is the most faithful, keeping the constraint a
      constraint rather than re-expressing it as data. It requires the interface on the type argument
      itself, so a foreign argument is impossible -- which is a LANGUAGE decision about what may close
      the constraint, not a fact about C#, and it was originally mistaken for the latter.

      A THREADED FACTORY works on a foreign type, because the synthesized factory lives at the
      construction site rather than on the argument. Shipped first, then replaced: it appends a
      parameter to the user's constructor, synthesizes one where there was none, adds a readonly field,
      and costs an allocation and an indirection per call. Correct but it rewrites declarations the user
      wrote.

      A WITNESS TYPE PARAMETER keeps foreign types AND leaves the constructor alone -- a separate
      `IConstructFromInt<T>` implemented by a generated struct, passed as an extra type parameter, so
      `T` stays the real type and nothing is wrapped. Verified working on a foreign type and under
      polymorphic recursion. Costs one type parameter per constrained parameter, observable at every
      mention of the type. The fallback if foreign closure is ever wanted.

      VALUE-WRAPPING THE FOREIGN TYPE was weighed and is WRONG, worth recording because it is the
      obvious move. Making the wrapper be `T` satisfies the constraint but changes what `T` IS, so every
      field, return, parameter and array of `T` holds a wrapper and the emitter must unwrap at every
      boundary -- and inside the generic `T` is open, so there is nothing to unwrap to. A witness
      changes only what the type is CALLED, which one function emits; a wrapper changes what it is,
      which every value flows through.

      `Activator.CreateInstance` WITH A CAST is the cheapest to build, a purely local rewrite of the
      `new T(...)` expression that changes no signature, and is REJECTED on three counts. It erases
      the constraint and rediscovers it by reflection, so a violating program fails at RUNTIME with
      MissingMethodException where the other two fail at compile time -- and v2 has no constraint
      checker, so nothing else would catch it. It boxes every argument and does a runtime constructor
      lookup, in a language that otherwise carries stack-only types and substructural discipline. And
      `Activator.CreateInstance(typeof(T), ...)` on an open parameter is not statically analyzable, so
      it makes any program using the constraint trim-hostile and AOT-hostile.

      CLASSIC DIVERGES AND IS LEFT ALONE. It threads a closure per construction site, which is the
      shape v2 shipped first and then replaced. Nothing in this entry applies to the classic pipeline.

      NOTE ON CHECKING THE CONSTRAINT ITSELF: classic checks it rather than leaning on the target
      language, reporting MIST_CONSTRAINT_0015 "Type 'NoIntCtor' must have a public constructor with
      parameters '(Int32)'" at the Mist source. V2 has no such check and does not need one to stay
      sound under this lowering -- a closing type without the matching constructor fails to satisfy the
      synthesized interface and Roslyn refuses it. That is `roslyn-downstream`, so the diagnostic lands
      on a generated file and porting the check is worth doing for the location alone.
    analysis_phase_tasks:
      - >
        REPORT A MISSING CONSTRUCTOR ON THE CLOSING TYPE AT THE MIST SOURCE. The synthesized `__New`
        body is an ordinary `new Widget(arg0)` call, so a type closing `new(int)` with no `(int)`
        constructor is refused by Roslyn against the generated file rather than named at the Mist site.
        Port of classic's MIST_CONSTRAINT_0015. Correctness does not depend on it; the location does.
    tasks:
      - >
        THE STAGE 6 RESTRICTION IS THE THING TO REVISIT, and it is a decision rather than a defect. A
        parameterized constructor constraint can only be closed by a Mist-declared type, because the
        lowering adds an interface to the closing type's declaration. Measured as costing nothing
        today: ZERO of the repository's eleven constructor constraints are closed by a foreign type.
        If one is ever wanted, the witness-type-parameter shape described above is the drop-in -- it
        keeps the constructor untouched and works on foreign types, for one extra type parameter per
        constrained parameter. Do NOT reach for value-wrapping, for the reason recorded above.
      - >
        NO SAMPLE COVERS A GENERIC CLOSING TYPE OR A METHOD-LEVEL CONSTRAINT, though both are measured
        working on a scratch program -- see the evidence above. Every closure in the repository is a
        NON-generic type, Widget or OrderableInt, and all eleven constraints are on TYPES. So the two
        shapes are verified but unprotected: nothing would catch a regression in either. Enriching
        GenericConstraints with a generic closer and a `Make<T>(int) where T : new(int)` would bank
        them, and it is a sample change rather than compiler work.
      - >
        PROPAGATION NEEDS NOTHING, which is worth stating because the delegate lowering needed a
        subtask for it. Where the type argument is itself a type parameter, the outer declaration
        carries the same `where` clause and C# forwards it; there is no factory to thread and no
        instantiation chain to bound. An earlier draft of this entry claimed case 12 exercised
        propagation -- it does not, being the parameterless form -- and under this lowering the question
        does not arise at all.
    unlocks: []

