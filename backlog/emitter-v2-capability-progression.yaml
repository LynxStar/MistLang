        coexistence is declared but never actually resolved.
      - No ambiguity or arity-mismatch case, so the diagnostic is unexercised.

  - name: Enums
    intro_order: 30
    threshold: readonly-member-and-type-contexts
    requires: [enum-conversion-operators, enum-member-patterns,
               readonly-member-and-type-contexts, union-types-and-carriers,
               optional-operators, string-interpolation, control-flow-basic]
    untested:
      - No enum has two variants sharing an underlying value, which would expose that the
        name lookup uses reference equality while the pattern form uses structural equality
        on the value.
      - The abstract-type-underlying-type cases are commented out pending emitter fixes.
      - No enum designates a default variant, so the default factory path is unexercised.

  - name: EnumReadonlyRestriction
    intro_order: 39
    threshold: readonly-member-and-type-contexts
    requires: [enum-conversion-operators, enum-member-patterns,
               readonly-member-and-type-contexts, union-types-and-carriers,
               string-interpolation]
    untested:
      - No NON-readonly base type is ever attempted, so the restriction the sample is named
        for is never actually triggered.
      - The struct-backed enum deliberately declares no fields to sidestep a known
        default-construction defect, leaving struct-backed enums with state unexercised.

  - name: TypeUnions
    intro_order: 25
    threshold: union-narrowing-through-patterns
    requires: [union-narrowing-through-patterns, union-widening-at-use-sites,
               string-interpolation, var-type-inference, control-flow-basic]
    untested:
      - Every type test takes the true branch, so a discriminator that always answered true
        would pass.
      - Nothing uses a narrowed binding inside the same condition -- a form the hoisted-
        binding emission scheme structurally cannot express, so the sample cannot reveal
        that limitation.

  - name: UnknownType
    intro_order: 23
    threshold: pattern-matching-core
    requires: [unknown-covariant-generic-widening, pattern-matching-core,
               type-argument-substitution, instance-fields, string-interpolation]
    untested:
      - The rejected call that would exercise member FILTERING is a comment, so filtering is
        never actually applied.
      - The widened receiver is always backed by a runtime type that has the member, so no
        binder failure is ever observed under the dynamic lowering.

  - name: UnknownReadonlySemantics
    intro_order: 36
    threshold: readonly-mutation-checking
    requires: [unknown-readonly-member-filtering, readonly-mutation-checking,
               pattern-matching-core, string-interpolation]
    untested:
      - The rejected mutations are comments only, so nothing distinguishes "member filtered
        by context" from "member does not exist".
      - No mutable member is reached through a chained or indexed receiver.

  - name: PatternMatching
    intro_order: 21
    threshold: list-and-slice-patterns
    requires: [list-and-slice-patterns, property-patterns, logical-patterns,
               constructor-chain-base, property-declarations-and-accessors,
               arrays-sized-index-length, string-interpolation]
    untested:
      - Every type test takes the true branch, so an always-true condition passes
        identically.
      - Arrays are exactly the arity the pattern wants, so the distinction between an exact
        length constraint and a minimum length constraint is unproven.
      - No negation and no disjunction pattern appears.

  - name: SwitchExpressions
    intro_order: 31
    threshold: list-and-slice-patterns
    requires: [exhaustiveness-checking, when-guards, union-narrowing-through-patterns,
               property-patterns, list-and-slice-patterns, tuple-types-and-literals,
               string-interpolation]
    untested:
      - No switch ever falls through all arms, so the no-match failure path is unexercised,
        and no arm is subsumed by an earlier one, so ordering is unproven.
      - No enum-scrutinee switch appears, which is exactly the case the exhaustiveness
        checker has no rule for.

  - name: Tuples
    intro_order: 24
    threshold: tuple-patterns
    requires: [tuple-patterns, named-tuple-elements, tuple-deconstruction,
               unknown-top-type, string-interpolation, var-type-inference]
    untested:
      - Only one test is expected to be false; nothing checks that a wrong-arity or
        wrong-element-type narrow is rejected.
      - No optional element appears, so absence never interacts with tuples.

  - name: TuplePatternMatching
    intro_order: 62
    threshold: tuple-patterns
    requires: [tuple-patterns, enum-member-patterns, when-guards, unknown-top-type,
               string-interpolation]
    untested:
      - The quadrant switch has no catch-all and is accepted ONLY because the exhaustiveness
        checker returns exhaustive unconditionally for a tuple scrutinee. That is an accident,
        not a proof.
      - Overlapping enum arms never disagree, so first-match ordering is unproven, and no
        scrutinee misses every arm.

  - name: AnonymousTypes
    intro_order: 80
    threshold: anonymous-type-structural-equality
    requires: [anonymous-type-structural-equality, property-patterns, unknown-top-type,
               string-interpolation, var-type-inference]
    untested:
      - The property pattern lowers to a null guard plus dynamic member reads, so it never
        checks the SHAPE -- a wrong-shaped payload throws rather than failing to match, and
        the sample only ever supplies the right shape.
      - The inequality result is equally satisfied by reference equality, so nothing
        discriminates structural from reference equality.

  - name: AsOperator
    intro_order: 77
    threshold: struct-inheritance-flattening
    requires: [conversion-classification-for-as, struct-inheritance-flattening,
               union-narrowing-through-patterns, optional-operators, unknown-top-type,
               string-interpolation]
    untested:
      - Every operand is a simple local, so the double-evaluation of a non-provable operand
        is not observable.
      - Each failure branch is fed a statically obvious wrong type, so an always-fails
        implementation would print the same lines.

  - name: DelegateFuncConversion
    intro_order: 74
    threshold: clr-extension-method-discovery
    requires: [delegate-func-conversion, clr-extension-method-discovery,
               framework-and-package-reference-resolution, lambda-expressions,
               string-interpolation, var-type-inference]
    untested:
      - Invocation proves the wrapper is callable but nothing checks that delegate IDENTITY
        survives wrapping, so removal from an event or a list would fail undetected.
      - The endpoint registration is never invoked, so the lambda-to-delegate-base path's
        runtime behaviour is never exercised.

  - name: FirstClassFunctions
    intro_order: 65
    threshold: discarded-task-obligation
    requires: [func-type-aliases-and-currying, lambda-closure-capture, static-lambdas,
               discarded-task-obligation, async-expression-functor, extension-properties,
               clr-extension-method-discovery, string-interpolation]
    untested:
      - The discarded-task case inside an async lambda emits BARE fire-and-forget with no
        await, and reads correctly only because the helper completes synchronously.
      - Static lambda capture rejection is never negatively tested.
      - Nothing checks that a function-typed extension parameter is invoked lazily.

  - name: Iterators
    intro_order: 55
    threshold: foreach-over-user-enumerable
    requires: [foreach-over-user-enumerable, iterator-protocol-via-associated-type,
               nested-type-declarations, property-declarations-and-accessors,
               array-literals, string-interpolation]
    untested:
      - No sequence is enumerated twice or restarted, so the value-type enumerator's copy
        semantics are indistinguishable from reference semantics.
      - Nothing iterates an empty sequence, so the advance-before-read ordering contract is
        only checked on the happy path.
      - The synthesized reset and dispose members are emitted but never called.

  - name: ExtensionMethods
    intro_order: 26
    threshold: extension-properties
    requires: [extension-properties, universal-unknown-receiver-extensions,
               extension-lookup-and-specificity, control-flow-basic, var-type-inference]
    untested:
      - Every extension body is a PLACEHOLDER that returns its input unchanged, so a wrong
        receiver binding still yields plausible values.
      - Seven of the computed results are assigned and never printed. Only two lines reach
        stdout, so the sample largely proves typecheck-and-compile rather than correctness.
      - No call site omits the import, so namespace gating could be a no-op, and no name is
        declared on both a concrete and the universal receiver, so specificity ordering is
        never contended.
      - The sample declares no entry point, so it cannot currently satisfy executable rules.

  - name: ExtensionMethodBinding
    intro_order: 61
    threshold: clr-extension-method-discovery
    requires: [clr-extension-method-discovery, array-literals, string-interpolation]
    untested:
      - Emission is a static call, so the CLR library resolves the call even if Mist inferred
        the wrong type argument. Only the two explicitly typed locals could catch that.
      - Every receiver is an array of a primitive. No user-defined ambient extension, and no
        receiver requiring a base-class match.
      - No two namespaces supply the same member, so ambiguity detection is unexercised, and
