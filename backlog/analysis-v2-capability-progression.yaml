      A FROM-END INDEX IS PROVEN BY NOTHING, which defeats the bounds discharge this entry already claims.
      MEASURED 2026-09-15 at 0931374e, one project per shape, on both pipelines. `var a = new int[3]; int x
      = a[7];` is MIST_PA_INDEX_OUT_OF_BOUNDS on v2 and MIST_REFINEMENT_0005 on classic, as above -- but
      `a[^9]`, the same array with the same known length and the same decidable question, compiles on both
      and throws IndexOutOfRangeException, and so does the write `a[^9] = 10;` that the write-side paragraph
      closed for a constant. An indexer's `where` goes the same way and more quietly, there being no guard
      to throw: over `this[int entry] where entry >= 0 and < 3` on a Ledger whose Count is 9, `ledger[^1]`
      prints 8 on both pipelines with no diagnostic, where `ledger[5]` is CONSTRAINT_VIOLATED and `var local
      = 5; ledger[local]` is CONSTRAINT_UNPROVEN (classic reports MIST_REFINEMENT_0005 for both, naming the
      parameter 'index' where v2 names 'entry' and the interval it read). A LIST PATTERN'S POSITIONS ARE THE
      SAME HOLE BY ANOTHER ROUTE: `ledger is [_, _, _, _, _, _, _, _, var last]` prints 8 on both, C#'s own
      length test admitting it because Count is 9. samples/OverloadedIndexers banks `ledger[^1]` and that
      pattern shape, sound there because its Count IS its `int[3]`'s Length; its untested note carries this
      measurement rather than repeating it.

      THE CAUSE IS TWO, read off the model. NeedIndex asks nothing of an index whose type is not integral,
      and a from-end index is Standard.Index; independently, IndexBinder records ParameterType only when the
      index is NOT an Index, so the slot NeedIndex would read is null by construction (order 5). The
      position finally reached -- `Count - k`, which Indexability.Select re-selects as an int position,
      C#'s lowering onto Count and an int indexer -- is never an expression in the model, so there is no
      node to carry the obligation. A list pattern's positional element is not an IndexExpression at all:
      PatternBinder asks Indexability.ElementType for a TYPE and nothing else, so the shared walk never sees
      an index there. NOTHING DOWNSTREAM COVERS EITHER, a refinement having no C# equivalent; the one
      from-end shape C# does refuse is a type error, `shelf[^1]` over `this[byte slot]` beside a Count
      reaching Roslyn as MIST_CS_ERROR on both pipelines.

      CLOSED WHERE THE LENGTH IS A NUMBER, the same day, by giving the prover the value that reaches the
      slot instead of a rule about indices. `^k` names the position `Length - k`, so NeedIndex substitutes
      that position for the written offset (Reaching) and proves it as it proves any other value entering a
      slot; nothing in the rule knows what `^` means. `var a = new int[3]; a[^9]` and the write `a[^9] = 10`
      are MIST_PA_INDEX_OUT_OF_BOUNDS, worded as `a[7]` already was -- "Index -6 is outside the bounds of
      'a', which needs >= 0 and <= 2" -- and `a[^1]`, `a[^3]` and `a[^1] = 1` stay silent. Where the length
      is not a number there is nothing to substitute, and the index stays exactly as unproven as every other
      index into a receiver whose type carries no length: `ledger[^1]` over a property Count, and
      RangesAndIndices' `trimmed[^1]` over a slice, are unchanged. Two corpus cases here, four decision rows
      in RefinementDecisionTests, and two mutations on a confirmed build -- no substitution fails both
      corpus cases; the offset judged instead of the position fails the `a[^1] + a[^3]` admit row and the
      `^0` write case.

