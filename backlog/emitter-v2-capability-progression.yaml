  - id: discarded-task-obligation
    name: Completion obligation for a discarded task
    order: 173
    layer: async-and-context
    requires: [auto-await-and-explicit-await]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      A discarded task carries a completion obligation -- awaited immediately in sync
      context, deferred to scope exit in async context. The classic pipeline does NOT emit
      the scope-exit await, so several samples are bare fire-and-forget and read correctly
      only because every helper completes synchronously.

      BOTH HALVES ARE DELIVERED, and the second makes v2 do what classic does not. The sync half was
      already there: an auto-await wraps a task-returning call where it stands, so a discarded one in
