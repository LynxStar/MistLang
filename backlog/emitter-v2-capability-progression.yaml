  - id: method-group-conversion
    name: Method group conversion by signature matching
    order: 108
    layer: functions
    requires: [func-structural-function-types]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      The hook already existed and said so. MethodGroupExpression's own doc names exactly two consumers
      -- "an invocation selects on its bound argument types, and a conversion to a function type selects
      on the target signature" -- and PostfixBinder already had the point where an unconsumed group was
      reported, described in place as the last point that still knows one went unconsumed. This order
      fills the second consumer at that point, so a group is converted before it can be reported.

      IDENTITY PER POSITION RATHER THAN ASSIGNABILITY, which is the CLR's rule for binding a delegate
      and not the rule for passing an argument: a method taking an `int` does NOT convert to a
      `func<long, ...>` even though the argument would widen at a call. Mutation-checked by relaxing to
      containment -- exactly the one test asserting that fails, which is what makes the distinction
      recorded rather than incidental.

      SELECTION IS BY THE TARGET, there being no arguments to rank on. A GENERIC method was declined
      until 2026-09-19, its type arguments being inferable only from the target; the paragraph dated
      that day below records the inference.

      TWO CANDIDATES THE RECEIVER MAKES ONE SIGNATURE, 2026-09-19. `lifted.Take` at `Lifted<int>`
      converted to `func<int?, string>` matched both `Take(K?)` and `Take(int?)` and was declined as
      ambiguous, which first-class-functions 7.8 said and method-overloading 3.8 contradicted for a
      call. The specs now agree (method-overloading 3.12, first-class-functions 7.8 amended): the
      conversion keeps the candidates no other beats under OverloadResolution.MoreSpecificSignature,
      the tail of the call's tiebreak with its identity gate already met, and converts when exactly
      one remains; a pair no position separates -- `Take(A)` against `Take(B)` at `Pair<int, int>` --
      is MIST_PM_METHOD_GROUP_AMBIGUOUS, a descriptor of its own since the not-converted text names a
      different fault. The conversion also drops a slot its filler hides (OverloadResolution's
      WithoutHidden, now reachable on a candidate list), which a call always did and the conversion
      never had, so a conformer's `Take(K?)` beside `ITaker<K>`'s no longer ties at `<string>`. The
      emitter names the chosen one as it names a call (`lifted.Take__o1`, order 76).
      FunctionTypeResolutionTests pins the fixed choice, the filler over the slot, and the ambiguity;
      UnionSpecializationTests pins the spelling in a closed body and in a generic one;
      samples/OpenUnions prints `values: int? | K? | K?`. Two mutations, each caught: the preference
      removed fails the fixed-choice row, and the specialization fixture's `Chooser` with it; the
      hiding removed fails exactly the filler-over-slot row.

      A converted group is a FunctionReferenceExpression rather than a MethodReferenceExpression,
      because the latter's type is the method's RESULT -- it exists to be an invocation's receiver --
      where here the whole function is the value and the type is the function type. An instance group
      keeps its receiver, so `d.Twice` emits as `d.Twice`.

      A GENERIC METHOD NAMED AS A VALUE TAKES ITS TYPE ARGUMENTS FROM THE TARGET (2026-09-19), decided by
      the language owner the same day: `func<int, int> same = Api.Same;` should work. MEASURED FIRST, one
      project per probe: it was MIST_PM_METHOD_GROUP_NOT_CONVERTED on v2 and MIST_TC_0084 on classic -- static
      or instance, a local or an argument or a return -- the conversion declining any candidate with type
      parameters of its own. TypeArgumentInference.FromSignature matches each declared position against the
      type standing in the target, the RESULT included, and closes only where every parameter met exactly one
      type; the closed signature is then held to the same identity as any other candidate, so nothing widens.
      A method the target leaves open -- `Pick<T, R>(T | R)` against `func<int | string, string>`, which does
      not say which constituent is T -- or pulls two ways (`First<T>(T, T)` against `func<int, long, long>`)
      stays NOT_CONVERTED; a plain overload of the same signature is preferred, as at a call; and an inferred
      argument that breaks the method's `where` is MIST_PA_CONSTRAINT_NOT_SATISFIED, the closing being
      recorded for the rule as a call's is. FunctionReferenceExpression carries the TypeArguments, the
      instantiation is recorded in GenericCalls so a method emitted per instantiation (order 76) has its
      instance, and the emitter states them -- `Probe.Api.Same<int>`, `box.Show<bool>`,
      `Probe.Api.Lift__Standard_Int32` -- rather than leaving C# to infer from a delegate it may not be
      looking at.
      FOUND ON THE WAY, fixed because the first probe inside generic code met it: a position typed by a TYPE
      PARAMETER never matched, ConversionRelation.IsIdentity answering false for anything indeterminate, so
      `func<K, K> kept = Kept;` inside `Keeper<K>` was refused for a method that is not generic at all. A
      position whose two sides are the same parameter is the same. And the not-converted message said the
      conversion "is not yet supported by the experimental pipeline", false since this order landed; it
      states the rule.
      MEASURED after, each line derived by hand first: `7 w | 9`, `8 | u | 3` through an argument and a
      return, `box 5 | box w | 4` through a receiver and a bare private name, `plain 3 | generic w`, `held 4
      True | held w 2` on a generic class, `some 5 | none | some w` through a per-instantiation method,
      `3 | w | 3` inside a generic method and a generic class, and `4 3` as the argument of a generic call
