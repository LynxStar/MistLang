      CLASSIC'S VERDICTS ARE THE CONTRACT, measured on a probe whose symbol-stage shapes had to be split
      from its type-checker shapes, since classic's symbol errors gate its type checker and v2's binder
      errors gate Stage 5 the same way. Classic refuses private and protected access from outside the
