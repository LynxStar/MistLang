  - id: async-drop-chaining
    name: Interaction of drop insertion with async lowering
    order: 175
    layer: async-and-context
    requires: [async-state-machine-lowering, drop-recognition-and-insertion]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      A scope-exit drop obligation can RETROACTIVELY make the enclosing method async,
      because dropping a task means awaiting it inside the finally block. Explicit capture of
      a drop result suppresses the recursive chain and gives the local its own obligation.

      BOTH CLAUSES DELIVERED. The retroactive promotion is a second seed in AsyncPromotion: the
