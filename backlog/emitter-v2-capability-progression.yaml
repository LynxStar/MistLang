    requires: [type-parameters-and-constructed-types]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      GenericConstraints covers all four nominal forms plus multiple constraints on one
      parameter, multiple where clauses, method-level constraints, propagation through
      inheritance, and constraints on struct and abstract-type declarations.

      TWO HALVES, BOTH NOW BUILT, AND THE FIRST WAS THE SURPRISE. The declarations already parsed and
