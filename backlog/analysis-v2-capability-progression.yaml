      THE FOUR ITEMS THE LENGTH WORK LEFT OPEN, CLOSED (2026-09-19), under the one rule (Arthur,
      2026-09-16): a value that reaches a slot must satisfy the slot's type, and what cannot be proven is
      refused. Arthur decided the boundary on the way: flow analysis never crosses a member. A user
      type's `public int Count` is an unknown int wherever it is read, so `ledger[^1]` into `where entry
      >= 0 and < 3` is refused whatever the getter returns, and a guard on it teaches nothing -- `if
      (ledger.Count == 3)` says what one call returned, not what the next returns. An array's Length is
      different because the type states it. He then specified the lift that lets a signature carry what
      its body proves (refinement-types R18, with R13.5 reworded so a use still reads only the type):
      a method, getter or indexer getter whose every return is a constant or a refined pass-through is
      read as returning their union, the way ReadonlyInference lifts readonly. Mist has no overriding
      and recompiles the whole program, so a body is the only one a use reaches and no lift is stale.
      Returns the flow narrowed (`var n = 7; return n;`) are tabled until this closes (task below).

