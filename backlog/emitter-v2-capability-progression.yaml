        looks smaller than it is.
      - Wrap rather than convert where a unit-returning method is used as a function value, since
        Func<Standard.Void> cannot bind a void-returning method.
      - Support void as a type argument, a parameter type and a field type.
    unlocks: [OptionalTypes, VoidType, VoidValueLiteral]

