      THE NAME DOES NOT SURVIVE RESOLUTION: ScopeResolver expands an alias where it resolves one, and a
      qualified or nested name leaves only the type it reached, so no model node holds anything to judge.
      The binder records each naming as it resolves it instead -- TypeNamingRegistry, a registry on the model
