  - id: union-narrowing-through-patterns
    name: Narrowing a union to one constituent
    order: 98
    layer: patterns
    requires: [pattern-matching-core, union-types-and-carriers]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      A tag test, and it STILL BINDS INLINE -- which is the whole point and the thing classic cannot do.
      Classic emits the discriminator as the condition and HOISTS the binding to the top of the
      then-branch, so a narrowed binding cannot be read in the condition that introduced it. The obstacle
      is real: C# can bind inside a pattern but not inside a property test, so `u.IsInt32` discriminates
      and gives nowhere to put the binding.

      THE WAY OUT is to make the tag check produce a pattern-testable VALUE rather than a bool. Each
      carrier gained a nullable per-constituent accessor -- `public int? AsInt32OrNull => _tag == 1 ?
      (int)_value : null;` -- and the check is folded into the SCRUTINEE, leaving an ordinary C# pattern
      to test and bind what comes back: `u is int i` emits as `u.AsInt32OrNull is int i`. So
      `u is int n && n > 40` works on a union, the form TypeUnions' own untested list recorded as
      structurally unreachable. Testing the boxed `_value` instead would also have bound inline but would
      NOT have been a tag test: two constituents erasing to the same CLR type -- an int and a refinement
      over int -- are distinguishable by tag and not by runtime type.

      The accessor's spelling reuses the value/reference split optionals already lower through
      (TypeNameEmitter.EmitOptional, now the one home for it): Nullable for a value kind, the bare type
      with null as absence for a reference kind, UNANNOTATED because the generated files carry no
      nullable context and a `?` on a reference type there is a warning.

      WHICH CONSTITUENT is resolved during binding and recorded on the pattern, because the same lookup
      answers two questions: which accessor to name, and whether the test has any lowering at all.
      Identity is tried across every constituent before containment is tried at all, so an exact
      constituent is never answered by a wider one that merely also contains it; containment then lets
      `Animal | int` narrow to Dog through the Animal accessor. Both halves mutation-checked.

      A TYPE NO CONSTITUENT HOLDS is reported at construction (MIST_PM_PATTERN_TYPE_NOT_A_CONSTITUENT),
      not deferred, and the distinction matters: this is not "a test that will always fail" but a test
      with no accessor to name and therefore no C# to write. It is the one place in the patterns layer
      where unreachability is construction's business.

      WHAT IS NOT DONE, and why the guard survives in narrowed form: a combinator or a value comparison
      over a union still reports MIST_BE_UNSUPPORTED_UNION_PATTERN. `u is int or string` needs a DIFFERENT
      accessor per operand and a C# pattern has one scrutinee, so it has to become two tests joined by
      `||` -- an expression rather than a pattern, which is a second emission shape. A catch-all needs no
      narrowing and matches the carrier as it stands. Optionals never reach any of this.

      TypeUnions is banked in AllFeaturesV2, byte-identical to classic.

      DOWNGRADED FROM done BY THE ORDER 125 WORK, which found the SWITCH-ARM position had no lowering
      and, worse, no guard. Everything above is about `is`, and EmitIsPattern is where the union check
      lives; EmitSwitch had none, so `int | string mixed = 123; mixed switch { int n => ..., string s
      => ... }` emitted a switch over the carrier and Roslyn rejected every arm --
      "An expression of type 'Union_Int32_String' cannot be handled by a pattern of type 'int'". Four
      errors against a generated file the user never wrote. That is the `broken` shape rather than the
      missing one, which is why this is recorded here rather than left to be rediscovered.

      THE ARM POSITION IS NOW BUILT, and NOT as the chain of tests this entry and the deleted
      MIST_BE_UNSUPPORTED_UNION_SWITCH both predicted. A C# switch has one scrutinee for all of its arms,
      but a PROPERTY PATTERN reaches an accessor from inside the arm, so the tag check can be per-arm
      while the scrutinee stays shared and evaluated once: `int n` emits as `{ AsInt32OrNull: int n }` and
      the construct stays a switch. Same accessor as the `is` lowering, so both positions narrow through
      one mechanism rather than two.

      THE CHAIN WAS THE WRONG SHAPE AND BOTH OF ITS DEFECTS WERE MEASURED rather than reasoned, by
      compiling the candidates. C# scopes a pattern variable to the whole enclosing statement instead of
      to the conditional that introduced it, so `mixed switch { int n => ..., string n => ... }` -- legal
      Mist, since every arm binds in a scope of its own, and a shape the switch generator already
      produces -- fails CS0128 with a use-before-assignment error behind it. And a conditional has
      nowhere to bind the scrutinee, so a chain re-emits it per arm: a side-effecting scrutinee was
      measured running twice for a two-arm switch, the same double-evaluation order 182 records against
      classic. Staying a switch also keeps first-match ordering, the `when` guard and the no-match throw
      from C# rather than rebuilding all three.

      A NON-TYPE-TEST ARM is refused per ARM now rather than per construct, reporting the
      MIST_BE_UNSUPPORTED_UNION_PATTERN the `is` position already reports, so a combinator or a constant
      is refused for the reason it actually fails. The refused arm emits well-formed C# so the Mist
      diagnostic is the only error the user sees.

      SwitchExpressions is banked in AllFeaturesV2, output identical to classic.
    analysis_phase_tasks:
      - >
        Report a narrowing that is unreachable for a reason other than the type belonging to no
        constituent -- a second test of a constituent an earlier arm or branch already took. Order 95's
        unreachable-arm task is the same rule seen from the switch side.
    unlocks: [TypeUnions]

  - id: enum-member-patterns
    name: Enum members in pattern position
    order: 99
    layer: patterns
    requires: [constant-and-relational-patterns, enum-declaration-over-readonly-base]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      A VARIANT IS A VALUE, so `Direction.North` names no type at all, and the reading has to be tried
      BEFORE type resolution rather than after it: ScopeResolver.ResolveNamedType reports what it cannot
      find, so the fallback ordering would emit MIST_PM_UNRESOLVED_TYPE alongside a correctly bound
      pattern. The probe therefore goes through the scope's own Lookup, which answers without reporting.
      Mutation-checked by resolving first: exactly the five tests that assert a clean bind fail, and the
      pattern they inspect is still right, which is the point -- the defect would have been an extra
      diagnostic, not a wrong model.

      IT IS AN EQUALITY COMPARISON AND NOT A NEW KIND. What comes out is the ComparisonPattern a constant
      pattern binds to, differing only in what the bound expression is -- order 91's "a constant pattern
      is the Equal case rather than a kind of its own" extends to cover this without alteration. The bound
      is the same MemberAccessExpression over a TypeReferenceExpression that `Direction.North` binds to in
      EXPRESSION position, so one shape means one reference to a variant wherever it appears, and emission
      of the bound needed nothing new. Narrows nothing and keeps nothing, as every comparison does.

      READ OFF THE QUALIFIER, NEVER THE SCRUTINEE. Consulting the scrutinee's type would have been
      cheaper and is wrong twice over: it accepts a variant of some OTHER enum whose name happens to
      match, and it refuses a variant on an `unknown` scrutinee, which has no enum to consult. So
      `u is Direction.North` binds. The qualifier must resolve to an EnumType AND the trailing segment
      must be a variant that enum declares; dropping the second half fails exactly the test that says a
      name the enum does not declare still reports an unresolved type.

      WHAT THE READING MUST NOT CLAIM is pinned separately, because a dotted name in pattern position is
      usually a nested TYPE: `u is Outer.Inner` stays a TypeTestPattern, and a dotted name qualified by a
      non-enum falls through to reporting an unresolved type exactly as before.

      TWO EMISSION SHAPES, because a variant lowers to a static readonly field on a record class and C#
      admits only a compile-time constant in a pattern. An `is` becomes the comparison outright,
      PARENTHESIZED -- type testing outranks equality in C#, so `flag == (d is Direction.North)`, which
      Mist parses with the test on the right, would re-associate to `(flag == d) == Direction.North`
      written bare. A switch arm becomes `var __e751 when __e751 == Direction.North`, binding what the
      switch already evaluated so a side-effecting scrutinee is not run twice, and combining with the
      arm's own guard by `&&` at the right precedence.

      THE TEMPORARY IS NAMED FROM THE PATTERN'S SOURCE OFFSET, not from the arm's ordinal, and that was
      measured rather than reasoned: an ordinal is unique within one switch and collides with the
      enclosing one's for a switch nested inside an arm's RESULT, which C# rejects outright (CS0136)
      rather than shadowing. A three-line nested switch reproduced it. Classic's `__e` and `__eN` have the
      same defect and no sample reaches it.

      A COMBINATOR IS REFUSED at emission, MIST_BE_UNSUPPORTED_ENUM_PATTERN, naming the variant at the
      Mist source position. `d is Direction.North or Direction.South` would have to become two
      comparisons joined by `||` -- an expression rather than a pattern, the same second emission shape
      order 98 declined for union combinators, and declined here for the same reason. The refusal tests
      the BOUND's type rather than the comparison's kind, so `d is > Direction.North` is caught by it too.
      Construction is indifferent: the disjunction binds, nothing about the model is wrong, and a test
      records that division so it stays visible.

      AN OPTIONAL ENUM WORKS, measured: `Direction? maybe` emits as an annotated reference type and
      `maybe is Direction.North` emits `(maybe == Direction.North)`, which runs. No projection was needed,
      unlike order 93's property patterns -- equality against null is well defined where a member lookup
      is not.

      NOT BANKED, AND EMISSION IS THEREFORE NOT REGRESSION-LOCKED. All three samples that require this
      order bottom out far past it: Enums and EnumReadonlyRestriction at order 134
      (readonly-member-and-type-contexts), TuplePatternMatching at order 103 (tuple-patterns). Emission
      was verified by hand end to end on the experimental pipeline -- bare `is` on an int-backed and a
      string-backed enum, an `is` as a branch condition, an `is` on the right of an `==`, switch arms with
      and without a guard, an arm mixed with a var pattern, a nested switch, and both refusals -- all
      correct. What is missing is a test that would notice if it stopped being true.

      THE TUPLE-ELEMENT FORM IS ORDER 103's, not deferred residue: v2's PatternBinder has no
      TuplePositionalPattern case at all, so there is no element position for a variant to occupy yet.
      When there is, the `var __e when` machinery this order built is what it extends -- which is the
      reason the arm form is here despite no sample needing it.
    analysis_phase_tasks:
      - >
        Report a switch over an enum whose arms cover every variant but declare no catch-all, or rather
        do NOT: classic has no enum rule, so an enum falls to its unbounded-type rule and is told it needs
        a catch-all even where coverage is total. Order 97 already records this as one of the two
        opposite-facing defects its coverage rule must decide deliberately; noted here because an enum
        scrutinee is now expressible in arm position, which is what makes the decision reachable.
    unlocks: []

