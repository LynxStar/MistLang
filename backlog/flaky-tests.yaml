# Known flaky tests.
# Tests that fail intermittently without a corresponding code change. Recorded rather than fixed
# on discovery, because a flake found mid-change is a distraction from that change -- but an
# unrecorded flake is worse: the next person to see it re-diagnoses it from scratch, and every
# unexplained red run erodes the signal the suite is supposed to carry.
#
# Append an entry the moment a flake is identified, even when leaving it unfixed. See
# .kiro/steering/test-failure-triage.md.
#
# Fields:
#   id          Short dashed identifier.
#   test        Fully qualified test name.
#   file        Where it lives.
#   discovered  ISO date first recorded.
#   status      open | unreproduced | fixed | quarantined
#               `unreproduced` means it was seen but deliberate attempts to trigger it failed, so
#               even the symptom is not yet pinned down. Do not act on one of these without a
#               reproduction -- a fix aimed at a guessed cause is worse than no fix, because it
#               retires the entry without changing anything.
#   symptom     What the failure looks like.
#   cause       Why it happens. "unknown" is an acceptable answer; a guess dressed as a cause is not.
#   evidence    How the diagnosis was reached, so it can be re-checked rather than re-derived.
#   fix         The proposed change. Omit when the cause is unknown.

flakes:
  - id: attribute-emission-round-trip-unreproduced
    test: Mist.Tests.Backend.AttributeEmissionRoundTripPropertyTests.AttributeEmission_PreservesStructure_RoundTrip
    file: Test/Mist.Tests/Backend/AttributeEmissionRoundTripPropertyTests.cs
    discovered: 2026-07-26
    status: unreproduced
    symptom: >
      Failed twice during full-solution runs and passed on immediate rerun. Not reproduced since,
      across 19 deliberate attempts.
    cause: >
      Unknown. The first recorded cause was wrong and is disproven below; do not reinstate it without
      new evidence.
    evidence: >
      DISPROVEN -- the original entry blamed the generator for drawing the same named argument twice,
      producing invalid C#. Three findings kill that theory. The test never invokes Roslyn: it
      compiles with `EmitToDisk: false` and filters to front-end diagnostics only, so invalid C# is
      never compiled. Both the Mist source and the expected C# are built from the same scenario
      record, so a duplicate appears identically on both sides of the comparison. And duplicates are
      generated constantly rather than rarely -- three named arguments drawn from a five-name pool
      collide about half the time, so essentially every run of 100 scenarios contains many, yet 14
      consecutive isolated runs (~1400 scenarios) all passed.

      REPRODUCTION ATTEMPTS, all green: 14 runs of the test alone, 3 runs of the Mist.Tests project,
      2 runs of the full solution. Both original failures were under `dotnet test Mist.slnx`, which
      runs three test projects concurrently, so the full-solution runs matched the original
      conditions and still did not fail.

      NOT YET RULED OUT, in rough order of suspicion. This test exercises the CLASSIC pipeline
      (SemanticModelBuilder, CSharpTranspilerBackend via CSharpEmitter), not ProgramModel, so
      whatever it is lives there or in shared infrastructure. Its own state looks clean: `outputDir`
      is per-instance with a GUID, and `SharedDriver` is static but private to the class. Candidates
      are therefore process-wide state reachable from the classic pipeline under concurrent load --
      assembly loading and framework reference resolution being the obvious ones.

      OBSERVER ERROR IS ALSO POSSIBLE. Both sightings were during active development, immediately
      after a rebuild, and this session contains one confirmed instance of a test run racing an
      unfinished build (`dotnet test --no-build` batched in parallel with `dotnet build
      --no-incremental`, which made every test project report its assembly as an invalid argument).
      A test run against half-written binaries could produce an unrelated failure.
    fix: >
      None proposed; the cause is unknown. The next sighting should capture the FULL failure message
      before rerunning -- the message names whether the scenario failed to compile or failed
      verification, and which, together with the emitted output, is the missing evidence. Both
      earlier sightings were rerun before that was read.

      Optional and unrelated: the generator can still produce a duplicate named argument, which is
      invalid Mist that currently passes only because nothing rejects it. Constraining names to be
      distinct would remove a latent fragility, but it is not a fix for this entry.

  - id: storm-memo-propagation-property
    test: Storm.SourceGenerator.Tests.StormMemoPropagationPropertyTests.P3_MemoPropagation_RuleIR_IsMemo_MatchesSource
    file: Test/Storm.SourceGenerator.Tests/StormMemoPropagationPropertyTests.cs
    discovered: 2026-07-30
    status: unreproduced
    symptom: >
      Failed once in a full-solution test run and passed on immediate isolated rerun.
    cause: unknown
    evidence: >
      Failed during `dotnet test Mist.slnx --no-build` (all three test projects concurrent).
      Immediate rerun with --filter passed. The change being tested (generic object creation
      binding, TypeEmitter, ConstructorEmitter, CSharpEmitterV2) touches nothing in
      Storm.SourceGenerator. The test file was unmodified in the working tree.

      SECOND SIGHTING 2026-07-31, SAME TEST UNCONFIRMED. One of 664 failed in
      Storm.SourceGenerator.Tests under `dotnet test Mist.slnx --no-build`; the project passed
      664/664 on immediate isolated rerun and the full solution passed 5324/5324 on the next run.
      Same project, same trigger, same one-of-664 shape as above, but recorded here as UNCONFIRMED
      because the failing test's name was never captured -- the run was filtered to summary lines
      (`grep -E 'Passed:|Failed:'`), which discards the name along with the message. It may have
      been a different test in this project entirely.

      That sighting cannot implicate the change it ran against either way: the working tree held one
      edit, to backlog/emitter-v2-capability-progression.yaml, which is a document no code or test
      reads.

      PROCESS NOTE: redirect the run to a file and grep the file, rather than piping the run through
      a summary filter. Two of the three sightings across this register lost their failure message
      to exactly that.
  - id: sample-runner-tests-race-concurrent-sample-runs
    test: Mist.Tests.Integration.SamplesCompileAndMatchBaselineTest.EnumReadonlyRestriction_CompilesAndProducesExpectedOutput
    file: Test/Mist.Tests/Integration/SamplesCompileAndMatchBaselineTest.cs
    discovered: 2026-07-31
    status: open
    symptom: >
      Failed once in a full-solution run, then passed 19/19 under --filter with no intervening
      edit, and the sample it drives ran clean from the shell with no diagnostics.
    cause: >
      NOT a product flake. Every test in this class spawns the Mist CLI against a directory under
      samples/, and the CLI writes its emitted C# into that sample's own out/ directory. Anything
      else driving the same sample concurrently writes to the same place. In this instance the test
      suite and a full 78-sample sweep were launched as PARALLEL tool calls, so both were running
      the CLI over samples/*/out/ at the same time and collided.
    evidence: >
      The failing test asserts on stdout from samples/EnumReadonlyRestriction. That sample declares
      no properties or indexers, so the change under test -- accessor body binding, PropertyEmitter,
      AccessorEmitter, the TypeEmitter walk -- has no path to it. Running the sample directly on
      classic gave a clean exit and the expected sections. The test file was unmodified. The full
      suite then passed 5324/5324 twice, both times run on its own rather than beside a sweep.
    fix: >
      Do not run a sample sweep, or any manual `mist run`, at the same time as the test suite. They
      contend for samples/*/out/. Sequence them instead, which is what turned this green and kept it
      green.

      A durable fix would give the spawning tests their own output directory rather than the
      sample's, which would also let the suite parallelise against local experimentation. That is a
      change to the test harness rather than to the compiler, and nothing depends on it yet.
  - id: storm-trait-field-type-resolution-property
    test: Storm.SourceGenerator.Tests.StormTraitFieldTypeResolutionPropertyTests.P3_FragmentFieldType_STORM0018Emitted
    file: Test/Storm.SourceGenerator.Tests/StormTraitFieldTypeResolutionPropertyTests.cs
    discovered: 2026-08-01
    status: unreproduced
    symptom: >
      Failed once in a full-solution run and passed 5/5 on immediate isolated rerun.
    cause: unknown
    evidence: >
      Failed during `dotnet test Mist.slnx --no-build` (all three test projects concurrent). Rerun
      with --filter passed 5/5 with no intervening edit. The change it ran against was overload
      resolution in the v2 binder -- OverloadResolution, ConversionRelation, PostfixBinder,
      IdentifierBinder, ExpressionBinder, the two expression nodes, ProgramModelDiagnostics and
      BodyEmitter -- none of which Storm.SourceGenerator references. `git status` reported both
      Source/Storm.SourceGenerator and Test/Storm.SourceGenerator.Tests clean.

      THIRD SIGHTING IN THIS PROJECT, and the first with a captured name. The two under
      storm-memo-propagation-property share the shape exactly: one of 664 fails in
      Storm.SourceGenerator.Tests under a concurrent full-solution run, passes in isolation, against
      a change that cannot reach the project. Whether this is the same underlying flake as that entry
      is still unknown -- what is now established is that it is not confined to a single test, since
      this one and P3_MemoPropagation are different tests in different files.

      That makes a per-test cause less likely than something shared: both are property tests in the
      same project, and the project's tests run concurrently with two others. Process-wide state
      under concurrent load is the standing suspicion, unchanged from the earlier entry.

      The failure message was captured only as the FAIL line; the assertion detail was lost to a
      `Select-String` summary filter, which is the same mistake that entry's process note warns
      about. Next sighting in this project should redirect the run to a file and read the file.
  - id: mass-standard-namespace-not-found-stale-binaries
    test: Not one test -- 430 of 4645 in Mist.Tests, across every area that compiles Mist source.
    file: n/a
    discovered: 2026-08-01
    status: open
    symptom: >
      A large fraction of the suite fails at once, and the failures that carry a message carry
      `MIST_UNDEFINED_NAMESPACE: The namespace 'Standard' could not be found`. Tests that never touch
      the standard library pass. A plain `dotnet build` followed by the same `dotnet test --no-build`
      returns the suite to green with no source change.
    cause: >
      NOT a product flake and not a test flake. The test binaries' copied content -- Standard/*.mist
      among it -- was absent or half-written when the run started, so the stdlib could not be loaded
      and every compilation failed at name resolution. Recorded because the SIGNATURE is worth
      recognising instantly: a mass failure whose message names the Standard namespace is a stale or
      mid-write output directory, not a semantic regression.
    evidence: >
      Seen once during the overload-resolution change. The immediately preceding run of the same
      command on the same source was green apart from one unrelated Storm flake, and the only edit in
      between was an append to this file, which no code or test reads. A rebuild plus rerun then gave
      5377/5377.

      The preceding command batch had issued `dotnet format --verify-no-changes` and
      `dotnet test --no-build` as PARALLEL tool calls. `dotnet format` loads and builds the solution
      to run its analyzers, so it can be rewriting output directories while a `--no-build` run is
      reading them. This is the second instance in this register of a test run racing a build; see the
      observer-error note under attribute-emission-round-trip-unreproduced.
    fix: >
      Do not batch `dotnet format` in parallel with `dotnet test`. Chain them, or run the tests first.
      More generally, treat any mass failure naming the Standard namespace as a build-state problem
      and rebuild before reading it as a regression -- diagnosing 430 failures on the assumption they
      are real is a large amount of wasted work.
