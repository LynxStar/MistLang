  - id: using-import-resolution
    name: Explicit using imports across project namespaces
    order: 29
    layer: declaration-boundaries
    requires: [namespace-inferred-from-directory, object-creation,
               implicit-instance-field-access, string-interpolation, var-type-inference,
               standard-library-binding]
    v2_status: partial
    verified_by: unexercised
    evidence: >
      ScopeResolver.ResolveByNamespace handles imports, but no done v2 sample imports a
      project namespace -- only Standard. Namespaces imports both Namespaces.Models and
      Namespaces.Models.Game, so imports must be non-hierarchical. A parent import must not
      cover the child, and requiring the child import must not be necessary either way.

      FIXED. Until this was measured, v2 hard-refused any compilation unit writing `using Standard;`
      and `using System;` together. Both namespaces declare `Console`, and LookupImports collected
      across every import at once, treating two reaching DIFFERENT types as unrecoverable: it
      reported MIST_PM_AMBIGUOUS_TYPE and returned ErrorType, with no precedence arm. Classic
      resolved the same source and ran it.

      It was the largest single blocker on the unbanked set and it MASKED what its samples were
      really waiting for. Measured before the fix: ClrRefInterop 7 of 7 errors, RefStructs 42 of 43,
      DisposableDropInterop 13 of 15. Measured after: ClrRefInterop 2, and those 2 are order 128's
      actual residue -- so the sample that looked one capability from green was never that, and the
      arithmetic saying so had never been checked against a build.

      CLASSIC ALREADY ANSWERS THIS AND THE ANSWER IS A SEARCH ORDER, NOT A PRECEDENCE RULE ANYONE
      HAD TO INVENT. SemanticModelBuilder resolves an imported name in two ORDERED phases: 3a
      searches user-defined namespace scopes and RETURNS on the first hit; 3b consults the ambient
      resolver, where CLR-projected types live, and runs only if 3a found nothing. `Standard` is
      user-defined -- Source/Standard/*.mist is Mist source transpiled on every compile -- so
      `Console` binds to Standard.Console and `System` is never reached. Classic's ambiguity check
      exists, but it can only fire between two USER-DECLARED namespaces, which is why importing
      System alongside Standard costs it nothing.

      v2 FLATTENED THE TWO PHASES INTO ONE LOOP. ImportingScope.LookupImports walks a single
      `imports` list holding both kinds and compares candidates with ReferenceEquals, so a
      source-declared type and a CLR projection of the same name are a conflict. Its own doc comment
      states the intended contract -- "compared by identity, so two usings that reach the same type
      agree rather than conflict" -- and identity is the wrong instrument here: Standard.Console is
      an `intrinsic` declaration (Bootstrap/Console.mist, bodiless, five members) and System.Console
      is a projection, genuinely two objects. They do not need to be made equal; the ambient one
      needs to not be consulted once the source one is found.

      THE FIX REPRODUCES THE PHASE SPLIT rather than picking a winner. LookupImports now resolves in
      two tiers, source-declared first and CLR-projected only when those find nothing, keyed on
      IAssembly.HasMistSource -- a predicate the model already carried, documented as "whether this
      assembly's types are declared in Mist source". Identity comparison is kept WITHIN a tier, so
      two usings reaching the same type still agree, and two projected namespaces offering one name
      are still ambiguous because nothing separates them.

      Nothing about the language was open and no sample was wrong. An earlier revision of this entry
      recorded it as an undecided language question needing its own docs commit, listing four
      candidate precedence rules; that was wrong, and wrong in the direction that invents work. C#
      reporting CS0104 for its own version of this shape is not evidence about Mist, because in Mist
      the two names are not peers -- one is the stdlib and the other is what the stdlib projects onto.
      The question that settled it was "how does classic already run this source", answered by one
      file read.

      STILL `partial`, for the reason it always was: no banked v2 sample imports a PROJECT namespace,
      only Standard, so the non-hierarchical import rules above remain unexercised. That is separate
      from the ambiguity, which is now covered by three ScopeResolverAmbiguityTests -- source beats
      projected, projected still answers when nothing else does, and two projected namespaces are
      still ambiguous. Reverting the tier split fails exactly the first.
    unlocks: []

