      TypeEmitter has no operator path yet -- it walks fields, constructors and methods
      only, so OperatorsList is never reached. The stdlib declares operators in 16 files
      and the emitted stdlib contains none of them, so every arithmetic and comparison
      operator on a Mist primitive is still absent from v2's output. Their bodies DO bind:
      Phase 3 walks MemberType.EnumerateDelegates, which includes operators, so the
      remaining work is emission alone. No sample declares an operator overload, so the
      sample suite structurally cannot exercise this once the work lands.
    unlocks: []

  - id: intrinsic-member-declarations
    name: The intrinsic modifier
    order: 186
    layer: stdlib-only
    requires: [class-declaration]
    v2_status: missing
    evidence: >
      Marks a declaration whose implementation is supplied by the compiler rather than by a
      Mist body. Used throughout Source/Standard/Bootstrap and by nothing in samples.
    unlocks: [stdlib]

# =====================================================================
# SAMPLES
#
# status is derived -- runnable when every capability in the closure of `requires`
# is delivered. `requires` lists DIRECT dependencies only.
# =====================================================================

samples:

  - name: Simpliest
    intro_order: 2
    threshold: standard-library-binding
    requires: [class-declaration, methods-static-and-instance, statements-core,
               namespace-file-scoped, standard-library-binding]
    untested:
      - args is declared and never read, so array-of-string need only be a resolvable
        parameter type.
      - Only one argument type ever reaches Console.WriteLine, so first-match resolution
        looks correct. If the unknown-typed overload were preferred over the string one the
        output would be byte-identical.
      - The declared namespace is never referenced from inside the file, so namespace
        registration is unverified by this sample alone.

  - name: Primitives
    intro_order: 17
    threshold: arrays-sized-index-length
    requires: [class-declaration, methods-static-and-instance, statements-core,
               namespace-file-scoped, standard-library-binding, literals-primitive,
               string-interpolation, var-type-inference,
               operators-arithmetic-comparison-logical, control-flow-basic,
               arrays-sized-index-length]
    untested:
      - Every non-int primitive flows only into string interpolation. No arithmetic,
        comparison or argument passing of uint, long, ulong, short, ushort, byte, sbyte,
        float, double, decimal or char. A wrong inferred or widened type is invisible as
        long as the digits match.
      - The narrow-type declarations emit as bare C# literals, and Roslyn's own
        constant-conversion rule makes them compile whether or not Mist modelled the
        conversion. The bootstrap declares no conversion INTO byte or sbyte at all.
      - The escaped string local is never printed, so escape decoding need only round-trip
        through emitted source rather than be interpreted.
      - score is a constant, so two of the three grade branches are dead.
      - The DigitSum negative guard never executes; the only call passes a positive value.
      - Console.WriteLine at arity zero is never selected anywhere.

  - name: ArrayLiterals
    intro_order: 35
    threshold: array-literals
    requires: [class-declaration, methods-static-and-instance, statements-core,
               namespace-file-scoped, standard-library-binding, literals-primitive,
               string-interpolation, var-type-inference,
               operators-arithmetic-comparison-logical, control-flow-basic,
               arrays-sized-index-length, array-literals]
    note: >
      Green on v2, and the build is now clean. It previously reported six
      MIST_PM_AMBIGUOUS_MEMBER errors on its Length reads while still running correctly, which
      nothing caught: the Tier 6 v2 test asserts exit code 0 plus a baseline match, and v2 exits
      0 with binder errors outstanding. See arrays-sized-index-length (order 11) for the fix.
      Every Length read here sits in a for-condition or an interpolation hole, so none of them
      writes an inferred type. That is why the sample kept passing through both the ambiguity
      and the lifted-value emission bug, and it still says nothing about either. A
      `var n = items.Length` would exercise the first and, on an unknown-length array, still
      fails today -- adding one of each is the cheapest way to put this under the suite.
    untested:
      - The three printers are uniquely named, not overloaded, so argument-type-driven
        resolution over the three array types is never required. If every literal inferred
        as an unknown element type the calls would still bind and print correctly.
      - The empty literal is observed only through its Length, so the target-typed empty
        literal's element type is never used.
      - No foreach and no sized array creation anywhere. This sample says nothing about
        array enumeration or sized creation despite being the array sample.
      - Nested arrays are two levels deep with equal inner lengths, so a jagged versus
        rectangular confusion in the type model produces identical output.
      - Every index is trivially in range, so the dependent array-bounds refinement can be
        ignored entirely with no observable failure.

  - name: Overloading
    intro_order: 16
    threshold: constructor-overload-resolution
    requires: [class-declaration, methods-static-and-instance, statements-core,
