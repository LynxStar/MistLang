        and RefStructs both bottom out at span-projection-and-length-erasure.
      - Classify a RANGE-INDEXER type and a COUNTABLE-PLUS-SLICE-MEMBER type as sliceable, which the
        spec sentence names and this does not implement. NOTHING IN THE REPOSITORY DECLARES EITHER --
        no type in Source/Standard/Bootstrap has an indexer taking Standard.Range, and none declares
        `Slice(int, int)`. So the branch would be written with no receiver to exercise it, which is
        why it is a task here rather than code now.
      - Give Standard.String an indexer. String.mist declares none, so `word[0]` answers ErrorType
        while `word[1..3]` answers String -- sliceable but not indexable, which is backwards from
