      scratch C# under out/ is still written, holding a comment where the call would have been, which
      is what this backend does for every refusal it makes mid-body). DERIVED, NOT TABULATED: an
      operator, a cast and an indexer are C# syntax the backing type answers; a respelling is one of the
      entries IntrinsicCalls lists, and the emitter and the audit read the same classification so the
      list cannot drift from what is rewritten; everything else is looked up by name, static-ness and
