    name: sealed on classes and structs
    order: 41
    layer: accessibility
    requires: [class-declaration]
    v2_status: missing
    evidence: >
      MemberModifiers.IsSealed exists and ModifierBuilder sets it, but neither
      MemberModifierEmitter nor TypeEmitter emits it. FullAccessibilityModel declares one
