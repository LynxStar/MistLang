    threshold: intrinsic-member-declarations
    evidence: >
      THE SKIP IS PER DECLARATION AS OF ORDER 186 (2026-09-11), where it used to be per assembly.
      Standard's compilation units go through the same emission path as a user's, and
      TypeEmitter.SuppliedByBackend drops what the target already has.

      EMITTED FROM SOURCE: IClonable, to out/Standard/IClonable.cs, and since 2026-09-12 Unknown.mist's
      universal extension block to out/Standard/Unknown.cs and Int32.IsEven to __Intrinsics.g.cs (see
      order 186). That is the whole list, and it is
      not a shortfall -- it is what the stdlib actually contains once each file is read. SUPPLIED BY THE
      BACKEND: every Bootstrap type, intrinsic by declaration (the ten numerics, Boolean, Char, String,
      Array, Span, Func, Task, Type, Console, Math, Convert, Regex, Index, Range); IEnumerable and
      IEnumerator, which ARE the CLR's interfaces; and Standard.Void, whose C# shape needs overrides
      Mist cannot spell (see order 186). ERASED, so there is nothing to emit: Optional, Action, and the
      other type aliases. NOTHING IS SKIPPED PER ASSEMBLY ANY MORE (2026-09-12): Standard's extension
      blocks emit like a user's, one declaration at a time, and Unknown.mist's block lands as
      extension methods on object that System.Object's own instance members always win over. Its
      bodies are placeholders by its own header; whether they should be spelled as the runtime's is a
      language question, and the emitter no longer answers it by dropping the file.

      THE DRIFT THIS ENTRY WARNED ABOUT IS NOW A TEST. EmitVoidStruct, a transcription of Void.mist
      that could drift from it silently, is VoidStandIn, and StandardDeclarationEmissionTests holds it
      to every member Void.mist declares.

