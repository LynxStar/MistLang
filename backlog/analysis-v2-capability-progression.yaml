      a closure assigns but does not declare, those handed to a `ref` or `out` parameter of a call or a
      construction, and a ref local with the local it aliases; RefinementFlow drops such a local, and every
      bound held against it, after every step, in the body and in the closures nested in it. It is then
      known by its declared type alone, which every write is still judged against. Deliberately whole-body
      rather than from-the-write-on: a closure runs whenever it is called, and a simple rule here is worth
      more than the precision. A local a closure only reads, one a closure declares itself, one passed by
      value or by `readonly ref`, and every other local of the body keep what the flow learned.

