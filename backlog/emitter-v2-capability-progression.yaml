  - id: field-initializers
    name: Field initializer binding and emission
    order: 47
    layer: initialization
    requires: [instance-fields]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      Field AND property initializers now bind. ProgramModelBuilder.BindInitializers walks each
      ConcreteType's FieldsList and every MemberType's PropertiesList in Phase 3, and
      BodyBinder.BindInitializer replaces the sentinel
      Phase 2 parked. Verified on a scratch program covering an int, string and bool literal, a
      binary expression, a static field, a static field read from another initializer, and a
      field with no initializer: all six emit correct C# and print correct values. Before this,
      `public int retries = 3;` emitted
      `public int retries = /* unsupported: UnresolvedExpression */;` and failed in Roslyn with
      "Invalid expression term ';'" against the GENERATED file -- no Mist location, no Mist
      diagnostic. Classic has always handled it.
      Initializers bind in a new InitializerScope, which narrows the request through
      WithoutReceiver UNCONDITIONALLY -- unlike MethodScope, which narrows only when its
      member is static. An initializer runs before any constructor body, so no instance exists
      for a bare name to read through whether or not the field is static. That is what stops the
      emitter writing a C# field initializer that reads an instance member, which C# rejects
      outright (CS0236).
      Two changes outside this capability were needed to finish it, both recorded in the tasks
      below: LookupRequest.WithoutReceiver no longer widens a type-position request, and
      Source/Standard/Void.mist renamed its `Void` property to `Instance` so it stops sharing its
      enclosing type's name -- which C# rejects as CS0542 and which the new
      MIST_PM_MEMBER_NAME_IS_TYPE_NAME diagnostic now refuses up front.
      The emitter sentinel diagnostic is in: BackendDiagnostics.UnsupportedExpression, reported
      from BodyEmitter's expression default with the location taken off the retained SyntaxNode.
      CSharpEmitterV2 already gated on diagnostics.HasErrors between writing the C# and invoking
      Roslyn, so it halts there. Measured: an instance field read in an initializer now reports
      MIST_BE_UNSUPPORTED_EXPRESSION at Program.mist(7,25), where CLASSIC reports a Roslyn
      CS0236 against out/Program.cs. v2 is now better than classic on this input.
    tasks:
      - >
        DONE. Property initializers bind too. This was recorded here as blocked on "LookupRequest
        cannot say it wants a type", which was WRONG in an instructive way: ResolveNamedType has
        always passed MemberVisibility.None precisely so that members are excluded from a type
        position rather than matched and rejected, and its doc comment already spelled out the
        C# reasoning. The type-position mode existed. What was broken is that
        LookupRequest.WithoutReceiver() then CLOBBERED it -- it set Visibility to StaticOnly
        unconditionally, so a type-only request that crossed a type boundary came out the other
        side admitting static members again. Crossing a boundary is supposed to narrow, and this
        widened. Fixed by returning the request unchanged when Visibility is None.
        That bug was PRE-EXISTING and not about initializers at all. Reproduced with no
        initializer in sight: `Paint p = new Paint(7);` inside a STATIC method of a type that
        declares `public static int Paint` reported MIST_PM_UNRESOLVED_TYPE twice. It now prints
        made=7 field=5 -- the type position resolves to the type while Canvas.Paint still
        resolves to the field, which is the behaviour C# gets from its "Color Color" rule.
        The same shape WITHOUT a boundary crossing (an instance field named after another type,
        used in a type position from an instance context) already worked, which is why this went
        unnoticed: MethodScope only narrows when the member is static, so only static members and
        initializers crossed the boundary that did the damage.
      - >
        DONE. Report a diagnostic for an unsupported STATEMENT, as
        BackendDiagnostics.UnsupportedStatement. This was previously recorded here as blocked on
        statement origins, which was WRONG and worth recording as a lesson: the Statement BASE
        class is a bare marker with no origin, but UnsupportedStatement -- the only kind that
        needed one -- retained its AST node all along and said so in its own doc comment. The
        conclusion came from reading the base and generalizing. Nothing was blocked.
        This mattered more than the expression case, not less. An unsupported expression emits a
        comment where C# needs an expression, so it cannot parse and cannot be missed; an
        unsupported statement emits a comment where a statement WAS, which is legal C#, so it
        compiled and ran with a piece of the program silently gone. Measured on
        `readonly { Console.WriteLine("inside"); }`: classic prints all three lines, while v2
        emitted `/* unsupported statement: ReadonlyBlockStatementStatementNode */` between the
        two surviving WriteLines and ran clean. It now reports at Program.mist(9,9).
        UnsupportedStatement.Node was widened from StatementNode to SyntaxNode as part of this.
        A for-initializer is a ForInitializerNode, not a statement node, so the narrower type had
        forced StatementBinder to pass `null!` at one of the three construction sites -- meaning
        that one genuinely had no location. The node is only ever used for provenance and
        ReportAtNode takes the base type, so nothing wanted the tighter type.
        The emitter's remaining `default:` for statements is now a different thing and stays
        silent: it means a Statement subclass nobody taught the emitter about, which is a
        compiler-authoring bug with nothing for a user to fix.
    unlocks: []

  - id: readonly-struct
    name: readonly struct and readonly distribution to members
    order: 48
    layer: initialization
    requires: [struct-declaration]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      TypeEmitter emitted no readonly on the type, so `readonly struct Container` came out as
      `public struct Container`.

      THE RECORDED HAZARD WAS LIVE, not latent, and worse than the note implied. MemberModifierEmitter
      emitted readonly for METHODS from MemberModifiers alone, and the Modifier grammar rule is shared
      across all declarations, so `public readonly int Peek()` on a CLASS parsed, bound, and emitted --
      measured refusing a program classic compiles and runs, as MIST_CS_ERROR "The modifier 'readonly'
      is not valid for this item" against generated C# with no Mist location. Classic erases readonly on
      methods, which is why it never showed there.

      FIELD DISTRIBUTION IS REQUIRED and was measured rather than inferred: without it C# reports
      CS8340, "Instance fields of readonly structs must be readonly", once per field. So the type's
      modifier has to reach every field it declares.

      METHOD DISTRIBUTION IS NOT REQUIRED, and this entry previously said it was, inferring it from
      classic's out/Main.cs emitting `public readonly string Describe()`. Measured: a readonly struct
      with an undecorated method compiles and runs with fields distributed and methods left alone,
      because C# already treats every member of a readonly struct as readonly. Classic emits it
      redundantly. v2 does not, and the two produce identical stdout.

      readonly IS NOW THE CALL SITE'S DECISION rather than MemberModifierEmitter's, which is the shape
      the defect argued for: whether C# accepts the modifier depends on the POSITION, not the
      declaration -- any field, a struct's methods and properties, and nothing in a class but a field.
      A MemberModifiers holds neither the member kind nor the declaring type, so it cannot answer.
      Emit now takes an explicit emitReadonly with no default, so each of the six callers states its own
      rule: a field ORs in the enclosing readonly struct, a method, property and indexer require a
      struct, and a constructor and cast operator pass false outright.
    analysis_phase_tasks:
      - >
        Decide what `readonly` on a CLASS method should MEAN, rather than dropping it at emission. Mist
        admits the modifier there and nothing rejects it, so the declaration is silently ignored. Either
        it constrains the method not to mutate `this` and wants enforcing, or it is invalid and wants a
        diagnostic. Dropping it keeps the emitted C# valid, which is all order 48 needed.
    unlocks: []

