  - id: retroactive-conformance-with-blocks
    name: Retroactive conformance declared in a with block
    order: 73
    layer: abstract-types
    requires: [nominal-conformance-and-slot-checking, abstract-type-default-members]
    v2_status: partial
    verified_by: v2-semantics
    evidence: >
      A with block declares that an existing type conforms, mapping its members onto slots. Every
      mapping is now resolved to a real member at both ends, assignability honours the conformance,
      and emission makes it real in C#. AbstractTypes is banked in AllFeaturesV2, byte-identical to
      classic, including both with-block sections -- `Logger : INamed` mapping `GetLabel as Name`, and
      `TaggedWidget : ITaggable` where the mapped `DisplayTag` BEATS the slot's default, printing
      `<Widget>` and not `[widget-tag]`.

      THE STORAGE DECISION IS THE WHOLE DESIGN, and it was measured rather than argued. Conformances
      live on `ConcreteType.ConformancesList`, deliberately NOT folded into
      `MemberType.BaseAbstractTypes` which every consumer already walks. Folding them in is one line
      and looks strictly better -- it fixes ConversionRelation, TypeMemberLookup, TypeEmitter and
      DefaultMemberDuplication at a stroke -- and it REPRODUCES CLASSIC'S DEFECT VERBATIM. Tried:
      AbstractTypes then fails with "'TaggedWidget' does not contain a definition for 'Tag'", because
      DefaultMemberDuplication restates the abstract's default as a PUBLIC method whose body calls
      `this.Tag()`, and `Tag` exists only as an explicit interface implementation, which C# does not
      admit on a concrete-typed receiver. Keeping the two lists apart is what buys the correct
      behaviour, and it is pinned by two tests asserting the ABSENCE -- that the abstract is not in
      BaseAbstractTypes, and that the slot does not resolve on the concrete type.

      THE FIFTH TASK THEREFORE NEEDED NO CODE, and that is a consequence of the decision above rather
      than luck. DefaultMemberDuplication is driven off BaseAbstractTypes, so it never sees a
      retroactive conformance and never restates its defaults -- the same structural immunity order 50
      recorded against the braceless-binding defect. Measured on both sides: a mapping over a defaulted
      slot emits only the explicit implementation, and a defaulted slot left UNMAPPED still works,
      C#'s default interface method serving the abstract-typed call and its `this.Tag()` resolving
      inside the interface where the slot lives.

      AN EXPLICIT IMPLEMENTATION IS QUALIFIED BY THE ABSTRACT THAT DECLARES THE SLOT, not by the one
      the with block names. Found by probe rather than reasoned: mapping onto a slot `IWithArgs`
      inherits from `IBase` emitted `string IWithArgs.Inherited()` and C# refused it outright --
      "not found among members of the interface that can be implemented" -- rather than resolving
      through the inheritance. So the declaring abstract is resolved during construction and recorded
      on the mapping, which is also why the slot search is a breadth-first walk of the abstract chain
      here rather than a TypeMemberLookup call: that answers what a name MEANS on a type, and this
      needs to know WHERE it was declared.

      REPORTED AT STAGE 6 FOR A CLR CONFORMER, and this is a backend limit rather than a language rule.
      C# cannot add an interface to a type whose metadata is already compiled, there is nothing to
      duck-type an interface onto, and no lowering reaches the same effect -- so MIST_BE_FOREIGN_CONFORMANCE
      refuses it at EMISSION while the model still builds the edge and assignability still honours it.
      Verified end to end on `with MemoryStream : IReadable`: the abstract-typed assignment binds
      unremarked and only the backend declines. Classic reports the equivalent at
      SemanticModelConstruction, which puts a C# restriction in the language's mouth. The sibling
      MIST_BE_FOREIGN_CTOR_CONSTRAINT at order 57 is the same limitation for the same reason, so the
      two now read alike.

      THE FIRST TASK WAS ALREADY SATISFIED, and is now measured rather than assumed -- TypeBuilder
      stashes the file's NamespaceScope, so the target resolves the way any other type reference in
      that position does. CLASSIC'S DEFECT REPRODUCED, and it is narrower than recorded: it is
      CROSS-PROJECT, not cross-namespace. Two namespaces declaring one name inside a single project
      resolve correctly on BOTH pipelines. With a REFERENCED project declaring the same name, v2 binds
      the local type and classic binds the referenced one, reporting the right member names against
      the wrong type. That is why AbstractTypes needed `Widget` renamed to `TaggedWidget` to enter
      AllFeatures, and the rename is what makes the sample unable to test the resolution -- a probe is
      the only check.

      FOUR MORE LIVE DEFECTS IN CLASSIC, all measured, all of which v2 handles. An INHERITED SLOT is
      refused: MIST_WITH_0004 "'IWithArgs' does not have a member named 'Inherited'" where IWithArgs
      inherits it from IBase. An INHERITED SOURCE MEMBER is refused the same way, "'Derived' does not
      have a public member named 'Label'" where Derived gets it from a base class. Classic's slot
      lookup walks neither chain; v2's walks both. Classic emits UNCOMPILABLE C# for the unmapped
      default described above. And classic cannot resolve a CLR type in with-block position at all,
      failing MIST_WITH_0001 before reaching its own MIST_WITH_0006, so the CLR refusal it declares is
      unreachable.

      THE SAMPLE IS A FALSE GREEN FOR ASSIGNABILITY, which is why the tests exist. AbstractTypes
      passes with the conformance consult in ConversionRelation.Inherits DELETED: its only use is a
      plain assignment, and ConversionRelation's contract forbids refusing a program, so the
      assignment binds either way and the C# compiles on the base-list append alone. Applicability
      only runs when a call has TWO candidates, which the sample has none of. Suppressing the consult
      makes v2 refuse a program classic runs -- MIST_PM_UNRESOLVABLE_OVERLOAD naming
      `(INamed), (bool)` -- which is exactly the order 46 pattern. Pinned in
      Test/Mist.Tests/Semantics/ConformanceResolutionTests.cs, 14 tests on the ProgramModelProbe
      harness.

      A CONFORMANCE RANKS, deliberately, and this is the opposite call from order 46's on user-defined
      conversions. It sits under IsWithin because a with block asserts the type IS an instance of the
      abstract, so every value of it is already a value of the abstract -- a subtyping claim of the
      same strength as naming the abstract in a base list. An `implicit operator` asserts nothing of
      the kind, being possibly lossy, which is why that one is excluded from ranking and this one is not.

      A DUPLICATE CONFORMANCE IS REFUSED, NOT COLLAPSED, and the first attempt at this got it wrong in
      a way worth recording. A type reaching one abstract twice has two spellings -- a with block
      restating what the base list already declares, and two with blocks naming the same pair -- and the
      first version deduplicated the emitted base list, which made the first spelling COMPILE AND RUN.
      That is source Requirement 19.7 names as an error and classic refuses with MIST_WITH_0003, so the
      dedupe was buying a running program for a program the language forbids; it also did nothing for
