  - id: clr-assembly-type-projection
    name: CLR assembly loading and type projection
    order: 126
    layer: clr-interop
    requires: [type-parameters-and-constructed-types]
    v2_status: partial
    verified_by: v2-semantics
    evidence: >
      Metadata-only load of the reference set, CLR namespaces mapped into Mist scopes driven by
      imports, and stdlib alias bridging so the Mist string and array types resolve back to their CLR
      counterparts. The load, the import-driven mapping and the bridging all work: ArityOverloads is
      banked and byte-identical to classic while importing System.Collections.Generic and flowing Mist
      `int` and `string` into projected generics as type arguments.

      RECLASSIFIED FROM `missing` ON THE EVIDENCE OF A BANKED SAMPLE, which is the same
      status-is-wrong-in-both-directions shape orders 74 and 132 turned out to have. ArityOverloads
      requires this transitively through order 127 and has been green throughout, so `missing` was
      never true; nothing was built for this entry, and nothing needed to be.

      RESIDUE: the reference set is whatever the project already pulls in, so nothing exercises a
      DECLARED reference beyond the default framework set, and no sample imports a CLR namespace that
      the Standard library does not already reach. Attributes was blocked on order 129 rather than on
      this; both have since landed and it is banked.

      THE BRIDGING HALF WAS NARROWER THAN "the Mist string and array types resolve back to their CLR
      counterparts" SUGGESTS, and one part of it is now fixed. The TYPE bridged; its MEMBERS did not.
      WellKnownTypeMap's rule is that a well-known type is never projected -- the Standard instance
      is returned instead -- so Standard.String held only what Bootstrap/String.mist declares, and
      every other member of System.String was unreachable. Measured: ToUpper and Trim failed with
      MIST_PM_UNRESOLVED_MEMBER while Length and Contains worked, and Substring(Int32, Int32) failed
      with "Declared arities: 1". WellKnownMemberBridge now merges the CLR members in after Phase 2a.

      STRING ONLY, WHICH IS WHAT CLASSIC DOES rather than a shortcut. Probed on classic: Int32.Parse,
      Int32.MaxValue, Double.Parse and CompareTo on Int32, Double, Char and Boolean are all refused
      there. Widening the list is also unsafe for most of the map -- Standard.Array declares no
      Length ON PURPOSE, its dependent type parameter being the length, and a projected property
      beside it makes every read ambiguous; Task and ValueTask are type ALIASES, not member types;
      Func and Action are one Mist declaration behind seventeen CLR arities each.

      AFTER PHASE 2A, NOT AT 1B, and that ordering is the whole correctness argument. At 1b the
      Standard declarations hold no members yet, so there is nothing to merge against and the
      projected copy of every colliding member would win by arriving first -- silently, since
      overload lookup dedupes by a signature key that excludes the return type. Standard's
      `owned String Clone()` and the CLR's `object Clone()` collide exactly that way.

