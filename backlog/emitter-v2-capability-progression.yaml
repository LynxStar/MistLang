  - id: method-group-conversion
    name: Method group conversion by signature matching
    order: 108
    layer: functions
    requires: [func-structural-function-types]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      The hook already existed and said so. MethodGroupExpression's own doc names exactly two consumers
      -- "an invocation selects on its bound argument types, and a conversion to a function type selects
      on the target signature" -- and PostfixBinder already had the point where an unconsumed group was
      reported, described in place as the last point that still knows one went unconsumed. This order
      fills the second consumer at that point, so a group is converted before it can be reported.

      IDENTITY PER POSITION RATHER THAN ASSIGNABILITY, which is the CLR's rule for binding a delegate
      and not the rule for passing an argument: a method taking an `int` does NOT convert to a
      `func<long, ...>` even though the argument would widen at a call. Mutation-checked by relaxing to
      containment -- exactly the one test asserting that fails, which is what makes the distinction
      recorded rather than incidental.

      SELECTION IS BY THE TARGET AND NOTHING ELSE, there being no arguments to rank on, so two
      candidates matching one signature is ambiguity and declines rather than picking. A GENERIC method
      is declined too: its type arguments are inferable only from the target, which is inference this
      does not do.

      A converted group is a FunctionReferenceExpression rather than a MethodReferenceExpression,
      because the latter's type is the method's RESULT -- it exists to be an invocation's receiver --
      where here the whole function is the value and the type is the function type. An instance group
      keeps its receiver, so `d.Twice` emits as `d.Twice`.
    unlocks: []

  - id: delegate-func-conversion
    name: Conversion between structural function types and named delegates
    order: 109
    layer: functions
    requires: [method-group-conversion]
    v2_status: partial
    verified_by: v2-semantics
    evidence: >
      NOT ATTEMPTED, and the `requires` above understates what it needs. Mist has no delegate
      DECLARATION syntax -- the `Delegate` in Mist.storm is a Storm trait for members carrying a body,
      unrelated -- so a named delegate type can only enter a Mist program by being PROJECTED from a CLR
      assembly. That is clr-assembly-type-projection, order 126, seventeen orders later, and
      DelegateFuncConversion confirms it: the sample needs orders 121, 126, 129 and 131 besides this
      one, and its first line imports Microsoft.AspNetCore.Http.

      So this order cannot be reached from within the functions layer whatever effort is spent on it,
      and its requires should name order 126 rather than implying the layer is self-contained. Recorded
      here rather than acted on, because renumbering to put it after 126 would move a whole layer.
      THE STANDARD.FUNC HALF IS DELIVERED, and it needed packs rather than order 126. Func is
      declared `Func<params TArgs, TResult>`, so collapsing a construction of it into the structural
      function type was impossible until a pack could be bound -- exactly as FunctionType's own
      comment has said since it was written. `Func<int, int> f = x => x * 2;` now binds, runs, and
      is the SAME interned type as `func<int, int>`.

      THIS IS WHAT MIST_PM_LAMBDA_PARAMETER_NO_TYPE WAS, on four samples. Lambda inference worked
      throughout; what failed was that a nominal Func had no parameter types for a lambda to read
      its slots from, and could not be invoked as a function at all. Diagnosed at order 129 and
      fixed here, which is the whole distance between the symptom and the cause.

      THE SPLICE HAD TO REACH A FUNCTION'S PARAMETER LIST, found by the first probe emitting `...`
      into C#. Collapsing happens before the pack is bound, so `type Action<params TArgs> =
      Func<TArgs..., void>` leaves a spread sitting in a parameter list rather than in the argument
      list it was written in, and substitution had no arm for it.

      INFERENCE THROUGH A FUNCTION ARGUMENT CAME WITH IT, and had to: `Apply(Func<TArgs..., TResult>
      f, params TArgs args)` has no other way to learn TResult, since nothing else in the signature
      mentions it. Match had no FunctionType arm at all.

      A LATENT IDENTITY BUG WAS FIXED HERE AND CANNOT YET BE FALSIFIED. TypePackValue compared its
      elements by fully qualified name, which is sound for the interned types a pack usually holds
      and WRONG for a spread: SpreadType is built with no declaring type, so every `TArgs...` in the
      program shares the qualified name `TArgs...` whatever parameter it wraps. Two declarations
      spreading their own packs therefore interned to one value carrying whichever was seen first.
      It now compares the operand, whose qualified name is per-declaration.

      NO PROGRAM DISTINGUISHES THE TWO TODAY, which is recorded rather than glossed: the packs that
      collide are the ones built at a DECLARATION, and a type holding one is refused at emission, so
      the wrong binding never reaches anything observable. Order 153 is what would make it visible.

      STILL MISSING: conversion between a function type and a NAMED CLR delegate, which is what this
      entry is actually about and still needs order 126.
    tasks:
