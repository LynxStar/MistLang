      - >
        Refuse `default(T)` on a class whose only constructor is a user-declared parameterless one and
        which has no default block: defaultability Requirement 3.6 (optional-defaultability 4.2) makes it
        non-defaultable. v2 admits it -- Defaultability.StatesAZero counts a parameterless constructor as
        stating a zero -- and `default(Counter)` prints `start=1 step=0`, the initializers and zeros with
        the constructor not run. Classic refuses it as MIST_DEFAULT_NOT_SUPPORTED. Measured 2026-09-26. From
        order 50 (default-value-synthesis), where it is the third analysis task; placed here because
        purity-checking already judges what taking a default runs.
      - >
        MIST_PA_READONLY_CONTEXT_CALLS_MUTABLE, for a local Add on a list the scope does not own, says only
        "it is not readonly". It does not name the owned receiver that would admit the call, as
        Requirement 10.2 asks; the pure-scope messages do.
      - >
        PurityAnalyzer does not merge findings that share a node, so one root cause read twice, such as
        `inner` and `inner.v` through a pattern binding, is two complaints.
      - >
        DONE 2026-09-27: design.md lagged the implementation, and now states what is built: the List.mist
