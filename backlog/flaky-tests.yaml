  - id: storm-trait-composition-inheritance-property
    test: >
      Storm.SourceGenerator.Tests.StormTraitCompositionInheritancePropertyTests.P6_ComposingTrait_EmittedInterfaceExtendsBase,
      Storm.SourceGenerator.Tests.StormTraitCompositionInheritancePropertyTests.P6_RuleBindingComposingTrait_NodeImplementsComposingInterface,
      Storm.SourceGenerator.Tests.StormTraitCompositionInheritancePropertyTests.P6_RuleBindingComposingTrait_BaseInterfaceInheritedTransitively,
      Storm.SourceGenerator.Tests.StormTraitCompositionInheritancePropertyTests.P6_BaseTraitInterface_HasOwnProperties
    file: Test/Storm.SourceGenerator.Tests/StormTraitCompositionInheritancePropertyTests.cs
    discovered: 2026-09-14
    status: fixed
    symptom: >
      Never sighted by name in a suite run. Found by replay while converting the remaining trait property
      tests that looped over Gen.Sample, the pattern the three storm-* entries above were fixed for. The
      failure read "Failed to build emission context for scenario" and printed the drawn grammar, with no
      diagnostic.
    cause: >
      THE GENERATOR DREW INVALID GRAMMARS, the habit named under storm-trait-field-type-resolution-property,
      in a fourth file. GenScenario renames the two trait names, the rule name and every token name apart,
      but DeduplicateFields kept field names distinct only within one trait, so traits A and B could each
      declare a field of the same name. Their token types are always distinct, so `trait B : A` inherits
      one field with two definitions, TraitValidationPass reports STORM0025, and BuildEmissionContext
      returned null. Storm is right to reject it: B includes all of A's fields (requirement 3.6 of
      storm-trait-keyword), and a node cannot carry one field at two types -- the composition analogue of
      requirement 9.3. All four tests share the generator, so all four could draw it.
    evidence: >
      REPRODUCED BY REPLAY, 2026-09-14. The four tests were converted from [Fact]s over Gen.Sample to
      [Property]s over the unchanged generator, and a scratch harness ran each through Check.One for five
      rounds of 200000 draws, each on a fresh seed. Three rounds failed across 3717301 draws of the shared
      generator, about one draw in 1.2 million, or one run of the four tests' 550 draws in 2250:
      P6_RuleBindingComposingTrait_NodeImplementsComposingInterface after 154985 and 38941 draws, and
      P6_RuleBindingComposingTrait_BaseInterfaceInheritedTransitively after 123375. The other two passed
      1000000 each. The three inputs gave A and B a field named `nff`, `qid` and `qmx`.

      CONFIRMED AS FIXED INPUTS, before the fix. Each recorded grammar built (grammar.Succeeded=True) and
      lowered (Succeeded=True), and TraitValidationPass reported "STORM0025 Trait 'Qqq2n' has conflicting
      definitions for field 'nff' from composed traits", and likewise 'qid' on Iw6 and 'qmx' on Qxlt. The
      first grammar with B's field renamed `nff1` validated with no diagnostics and emitted
      `public interface IQqq2nNode : IMz24aib5Node` and
      `public sealed class PfqmiuNode : SyntaxNode, IQqq2nNode`.
    fix: >
      APPLIED 2026-09-14. DeduplicateFields shares one field-name set across both traits, and
      BuildEmissionContext asserts each step -- grammar build, trait validation, lowering -- with that
      step's diagnostics, so a future invalid draw fails naming the diagnostic instead of returning null.
      After it the four properties passed five rounds of 200000 draws each, 20 of 20. At the rate above
      those 4000000 draws should have held about three failures, so a clean run is consistent with the fix
      rather than proof of it; the proof is that one shared set cannot hand two fields the same name.

