      receiver's own members, with candidates merged across blocks and ordered by
      specificity. Visibility is a property of the CALL SITE -- gated on its import set --
      not of the program.

      ExtensionLookup sits on the MISS PATH of MemberResolution, which is what makes "own members
      win" a consequence of where it sits rather than a rule anything states. The call-site scope is
      threaded in as an optional argument, and its ABSENCE is the other half: ResolveStorage passes
      none, so an initializer target and a property pattern do not widen to extensions.

      TWO STEPS AND THEIR ORDER IS THE WHOLE ALGORITHM: filter blocks by MEMBER NAME first, then
      rank the survivors by specificity. Ranking first is the obvious reading of the design and it is
      wrong -- a prototype built that way left samples/ExtensionMethods with four errors, every one a
      universal-receiver call, because the concrete blocks for that receiver win the tier and declare
      none of those names. Ranking is pairwise rather than a concrete-versus-universal split, since a
      base and a derived receiver both survive an untiered merge and the binder then records one
      overload while C# resolves the other.
