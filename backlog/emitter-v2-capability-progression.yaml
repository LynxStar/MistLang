      INSERTED clone needed too, since every primitive declares IClonable and a clone of a value is the
      value. 279 intrinsic members are declared; 195 are operators the expression emitter already
      supplies; the sample reaches the named ones.

      Task.WhenAll AND Task.WhenAny WERE THE BACKEND'S DEBT, not the stdlib's, and the first reading of
      them here said otherwise. Mist declares them on Task<TResult> answering Task<TResult[]> and
      Task<TResult>; the CLR hosts them on a non-generic Task whose overloads answer `Task` and
      `Task<Task>`. Emitting the call as written produced
      `Standard.Void[] all = await System.Threading.Tasks.Task.WhenAll(tasks);`, which hands back nothing
      where the declaration promised a Void[] -- so the emitted code failed, and the temptation was to
      rewrite Task.mist into the CLR's shape. That would have contorted the LANGUAGE to fit one backend's
      gap, which is the inverse of what `intrinsic` means: the declaration is the contract and supplying
      it is the backend's job. TaskCombinators now emits __Tasks.g.cs with wrappers of the declared
      shape, exactly as MistArray is supplied, and the sample calls both. The stdlib is unchanged.

      The one piece still out of reach is a non-void TResult, and it is a GRAMMAR gap rather than a
      stdlib one: `Task.WhenAll` resolves through the `Task = Task<void>` alias so the parameter is
      Task<void>[], and the spelling that would select another instantiation, `Task<int>.WhenAll`, does
      not parse -- the nested-through-a-constructed-generic entry already under uncovered_constructs.
      Task.Delay and Task.Yield work on v2 and are refused by classic, which cannot await a non-generic
      Task; that is why the sample is banked on AllFeaturesV2 alone.

      `intrinsic` IS NOW RESERVED TO STANDARD, and was not when this order first landed. The entry
      claimed a user could not reach an intrinsic type's dropped members; measured, a user file declaring
      `intrinsic public class Helper` with an ordinary Mist-bodied member COMPILED, the type was dropped
      as any intrinsic type is, and the call then failed as MIST_CS_ERROR: "The type or namespace name
      'Helper' does not exist" -- an error about generated C# for code the author wrote in Mist. The
      standard-library spec reserves the marker (Req 5.6 and 5.13) and nothing enforced it, so
      ConcreteTypeBuilder now refuses a type-level `intrinsic` outside the Standard assembly
      (MIST_PM_INTRINSIC_RESERVED). The member-level marker needs no separate check: the pairing rule
      (Req 5.15) already requires an intrinsic container. A corpus case under refusals/binding/ holds it,
      and Standard's own types are unaffected -- AllFeaturesV2 is byte-identical.

      THE CONTRACT IS NOW CHECKABLE (2026-09-12). IntrinsicSupply classifies every intrinsic member
      Standard declares -- 250 of them, 195 operators, 3 indexers and 52 named members and constructors;
      the 279 above counted the type-level markers too -- as one of three things the backend supplies,
      and refuses the rest at the call site with MIST_BE_0002 naming the declaring type and member
