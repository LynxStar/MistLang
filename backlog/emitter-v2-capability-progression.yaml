  - name: StackOnlyTypes
    intro_order: 73
    threshold: stackalloc
    requires: [stackalloc, struct-declaration, foreach-over-user-enumerable,
               arrays-sized-index-length, string-interpolation, var-type-inference,
               clr-extension-method-discovery]
    resolved_language_rule: >
      A CLR EXTENSION IS REACHED THROUGH ITS DECLARING CLASS'S NAMESPACE, decided here and settled
      by adding the import the sample was relying on classic to overlook.

      The sample called `arr.AsSpan()` under `using Standard` alone and v2 refused with
      MIST_PM_UNRESOLVED_MEMBER while classic accepted. AsSpan is a member of System.MemoryExtensions,
      a static CLASS in the System namespace rather than a namespace of its own, so C# reaches it by
      importing System -- and ExtensionProjector already keys a block on the declaring class's
      namespace, which is exactly that rule. Order 131 states the same design as eager metadata
      scanning PER IMPORTED NAMESPACE. Every other sample already assumes it: ExtensionMethodBinding
      imports System.Linq for First and Skip on the SAME relocated Standard.Array receiver, and
      CSharpInteropV2 imports three namespaces. Classic's looseness was the anomaly.

      THE ERGONOMIC OBJECTION WAS REAL AND WAS ANSWERED ELSEWHERE. Needing both `using Standard` and
      `using System` for an operation on an intrinsic array does surprise a C# developer, and Mist
      does have a mechanism that would avoid it: Span.mist declares `intrinsic Slice` mapping onto the
      CLR's, and String.mist declares `intrinsic ToUpper` the same way, which is why `s.ToUpper()`
      binds under `using Standard` alone. Declaring `AsSpan` on Standard.Array would work the same
      way.

      IT WAS REJECTED AS A FIX FOR AN IMPORT, on the ground that it makes the surprise WORSE rather
      than smaller: adopting one CLR extension onto Standard.Array starts a list with no principled
      edge, and every operation not adopted still needs its namespace, so the rule stops being
      "CLR extensions need their namespace" and becomes "some do, and nothing tells you which".
      Promoting an operation into Standard stays available as a deliberate language decision with
      its own justification. Bridging Array would not have served here anyway: AsSpan is an
      extension on T[], not an instance member of System.Array.
    untested:
      - No negative stackalloc case -- no managed element type, no non-constant or oversized
        length -- so the element-type check may be absent.
      - The escape rule is exercised only in the permitted direction.
      - Zero-initialization rests on one element printing zero, which uninitialized memory
        could match by chance, and the struct element type has no members so element dispatch
        is never touched.

