    untested:
      - Slices only ever print their first element, so a slice with a correct length but a
        wrong offset for later elements would still pass.
      - Every bound is a literal against a fixed-length array, so no bound is ever clamped or
        empty.

  - name: Variadics
    intro_order: 86
    threshold: variadic-monomorphization
    requires: [variadic-monomorphization, spread-generated-members,
               nominal-conformance-and-slot-checking, struct-declaration,
               lambda-expressions, control-flow-basic, string-interpolation]
    untested:
      - Narrowing branches are copied verbatim into every arity monomorph, leaving
        shape-impossible tests in the arity-1 and arity-2 bodies. Nothing checks that branch
        PRUNING happens, only that the reachable branch returns the right value.
      - The arity is folded per monomorph, so a size-agnostic arity computation is never
        actually required.
      - The generated projections are emitted as settable properties over a mutable aggregate
        but are only ever read.

  - name: RefStructs
    intro_order: 60
    threshold: span-projection-and-length-erasure
    requires: [span-projection-and-length-erasure, ref-struct-declarations,
               property-declarations-and-accessors, foreach-over-user-enumerable,
               arrays-sized-index-length, string-interpolation]
    untested:
      - There is NO escape-analysis case at all. Nothing boxes a ref struct, stores it in a
        class field, captures it, or returns a stack-referencing span, so a ref struct could
        emit as a plain struct and every line would still pass.
      - The property with a statement body exercises both branches only across separate
        instances, never one instance both ways.

  - name: StackOnlyTypes
    intro_order: 73
    threshold: stackalloc
    requires: [stackalloc, struct-declaration, foreach-over-user-enumerable,
               arrays-sized-index-length, string-interpolation, var-type-inference]
    untested:
      - No negative stackalloc case -- no managed element type, no non-constant or oversized
