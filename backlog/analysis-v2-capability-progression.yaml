      CLASSIC'S VERDICTS ARE THE CONTRACT, measured on a 17-shape probe. Classic refuses an unfilled
      slot, one filled with the wrong parameter or return type, a slot inherited through the abstract
      hierarchy, a generic slot left half filled, a property slot missing an accessor (SM_0022 and
      MISSING_ABSTRACT_PROPERTY_ACCESSOR), a with block leaving a slot unanswered (WITH_0004), a mapping
      of the wrong signature (WITH_0005), a with block naming an abstract the base list already reaches
      (WITH_0003), and a nested type filling an associated type slot without meeting its constraint
      (AT_0003); it also refuses a slot hidden by a default restated on a derived abstract, which order
      69 had measured on both pipelines. Every one is refused by v2 at the same construct, and the
      mapping of the wrong signature by the binder alone. Classic admits a default left unfilled, a
      default the conformer restates, a generic slot closed by the base list, a slot filled by an
      inherited member, a diamond filled once, and a with block answered by a mapping; v2 admits all of
      those and a with block answered by the type's own member, which C# implements implicitly.

      THE RULE. Slots are the bodiless instance members of the abstracts the type's own base list
      reaches, transitively through the abstract hierarchy, each abstract visited once so a diamond asks
      once. Fillers are the public instance members the type declares or inherits along its concrete
      base chain, each read through the substitution of the base it came from; a default is a member,
      not a slot, and fills nothing but its own name. A member answers a slot when the arity matches
      and every type AGREES: identical by name once the abstract's own type arguments are applied,
      structurally through a construction, or indeterminate on either side -- a type parameter the
      conformer supplies nothing for, and an associated type slot, which the conformer's nested type IS
      under another name. A property slot is answered by name and judged by accessor shape, which is
      carried by which accessors exist, and its type is compared as the method types are. A with block
      answers the slots of the abstract it names by its mappings, judged by signature alone since a
      mapping renames, or by the type's own public members; a slot whose mapping the binder already
      refused counts as answered, because the author did map it and that fault has its complaint. A
      with block naming an abstract the base list or an earlier block reaches is redundant, reported
      here now rather than at emission, which kept only the deduplication. An associated type slot's
      filler is judged against the slot's constraints, and its absence reported here, both moved out of
      the backend's lift, which now consults TypeSlots in the model for the filler itself.

