      half binds it to a temporary and awaits at scope exit, nested like any other release, which is
      why StructuredConcurrency's `scope-exit will await both tasks` is now true rather than aspirational.

      IT CHANGES NO BASELINE, which is the point rather than a reprieve: awaiting a task that already
      completed is invisible, and every helper in these samples completes synchronously. The guarantee
      is real now instead of resting on that.

      AN ASSIGNMENT IS NOT A DISCARD, and reading it as one broke a banked sample. The first cut
      hoisted any task-typed expression statement, which caught `this.Pending = task;` in a
      constructor -- a task handed to a FIELD, which takes the obligation with it. It awaited a value
      the type was still holding, in a constructor no promotion had made async.
    unlocks: [FirstClassFunctions]

  - id: async-state-machine-lowering
    name: Async lowering with scope-exit awaits
    order: 174
