      A drop member may RETURN A VALUE, which C# disposal cannot. Drops fire in reverse
      declaration order, are ELIDED when the binding is moved into a call or a return, and
      chain recursively when the drop's return type is itself droppable. A container's drop
      is synthesized from its droppable fields in declaration order. Emission nests
      try-finally per binding to get the ordering.

