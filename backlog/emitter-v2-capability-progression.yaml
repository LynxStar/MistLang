  - id: struct-inheritance
    name: Struct inheriting from another struct
    order: 42
    layer: accessibility
    requires: [struct-declaration, base-member-lookup,
               accessibility-full-model, constructor-chain-base,
               constructor-chain-args-referencing-parameters,
               operators-arithmetic-comparison-logical, string-interpolation,
               var-type-inference, standard-library-binding]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      Mist-specific. Structs are inheritable, which is what makes protected and sealed
      meaningful on struct members. FullAccessibilityModel declares a struct with a struct
      base, a base chain, and inherited protected and internal field reads from the derived
      struct. Banked in AllFeaturesV2, output byte-identical to classic.

      TWO DEFECTS CLOSED TO GET THERE, both in the flattening lowering rather than here, and both
      of which classic handled correctly.

      PROPERTIES WERE NOT FLATTENED AT ALL. StructFlattener collected FieldsList and MethodsList
      and never PropertiesList, so a derived struct inherited an ancestor's METHODS but not the
      state they read -- the emitted struct carried a `Describe()` whose body named an `Amount`
      that was never emitted, and every error landed on generated C#. The Mist binder had bound
      those reads happily, so nothing upstream reported it. Fixed by collecting properties
      ancestor-first under the same override-skipping rule as methods.
      An inherited property needs a settable accessor the derived struct can reach: an ancestor's
      constructor becomes an ordinary initializer METHOD (StructInitEmitter), and C# permits
      writing a get-only or init-only auto-property only from a constructor. So a flattened
      property carries a PRIVATE plain setter. Its own declaration is untouched, and nothing
      outside the struct gains the right to write it.

      ENCAPSULATED ANCESTOR STATE REFUSED TO BUILD. The conversion did `Ancestor result = default;`
      then assigned each field, which cannot reach a field the ancestor keeps private -- so
      MIST_BE_STRUCT_CONVERSION_FIELD refused the whole program. Not a corner case: `protected` is
      remapped to private by the flattener, and an ordinary `private` field on a base struct hit it
      too, with no `protected` anywhere. Measured refusing a program classic compiles and runs.
      Fixed by routing construction through a generated private constructor plus an internal
      `__FromParts` factory on every struct, so the READS happen on the derived struct's own members
      and the WRITES happen inside the ancestor -- the one context C# allows for a private field, a
      readonly field or a get-only auto-property. No cross-type access, no widened member, no layout
      assumption, and it works on generic ancestors. See StructAncestorFactory.
      Emitted unconditionally rather than only where something derives today, because a struct's own
      compilation cannot see a derivation in a later one and a C# partial cannot span assemblies.
      The constructor is discriminated from user signatures by a marker parameter type rather than a
      dummy bool: its other parameters are the struct's own members, so a plausible user constructor
      can match them exactly, and a constructor cannot be renamed out of the way.
      MIST_BE_STRUCT_CONVERSION_FIELD is deleted; nothing can now reach it.

      AN INTRINSIC STRUCT BASE IS NOW REFUSED, which was the worst of the three because it was
      SILENT. `struct TaggedRange : Range` compiled clean and widened to a zeroed value: an intrinsic
      type declares no fields for the flattener to find, so the conversion ignored its argument and
      returned `default`. Mist cannot model an intrinsic struct's representation -- `Range` is
      declared `intrinsic public struct Range { }` while System.Range holds `_start` and `_end` -- and
      the base is not ours to emit a factory onto, so there is no mechanism that would make it
      correct. Refused with MIST_BE_INTRINSIC_STRUCT_BASE at the derived declaration, and the base is
      dropped from flattening so no bogus conversion is emitted either. Classic also fails here, but
      as a Roslyn error on generated C# ("cannot derive from sealed type 'Range'"), so v2 now reports
      it better rather than merely differently.
    analysis_phase_tasks:
      - >
        Nothing here checks the accessibility it records. See accessibility-full-model (order 39),
        whose tasks own that, and note FullAccessibilityModel exercises only permissive paths.
    unlocks: [FullAccessibilityModel]

