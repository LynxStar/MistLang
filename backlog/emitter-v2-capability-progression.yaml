      (TypeSubstitution), built by reading the parameters off the receiver's DEFINITION. A
      parameter belonging to anything else is absent from the map and travels through untouched,
      so the question "is this mine" is answered structurally rather than assumed. The ordinal
      still indexes the arguments, which is what keeps ExtensionProjector's CLR numbering
      meaningful; what changed is that a list is consulted first. ConstructedType.Substitute is
      gone, and with it the doc comment that claimed a check it did not perform.

      SUBSTITUTION IS ALSO RECURSIVE NOW. It descends a construction, so a member typed
      `List<T>` read off a `Box<int>` is a `List<int>`; the shallow version returned it open.
      Arrays come through the same arm, being a construction of Standard.Array. Unions and tuples
      are not descended, so a parameter reachable only through one survives untouched -- no
      signature in the model produces that yet.

      WHAT WAS BROKEN, all four reproduced on 620bfe20 from a scratch project and correct on
      classic, all four now passing. TypeParameterPopulator records a method's parameters with
      the ENCLOSING TYPE as their DeclaringType, so in `class Box<T>` with `U Echo<U>(U input)`
      T and U are both ordinal 0 with DeclaringType Box, indistinguishable to an ordinal-only
      substitution.

      One, `b.Echo("hello")` on a `Box<int>` then `.Length` off the result gave
      `MIST_PM_UNRESOLVED_MEMBER: 'Int32' has no member named 'Length'` -- Int32 because U was
      answered with Box's argument. Two, the nested case: a field typed `Box<A>` on a `Pair<A>`
      gave `'A' has no member named 'Length'`, the shallow substitution leaving A open. Three,
      `Tag<U>(U)` beside `Tag(int)` on a `Box<int>` refused `b.Tag("x")` with
      MIST_PM_UNRESOLVABLE_OVERLOAD -- valid code, refused, exactly as this entry predicted once
      order 26 stopped guessing. Four, and unrecorded before now, `b.Tag(3)` reported
      MIST_PM_AMBIGUOUS_OVERLOAD: U answered as int makes the generic signature IDENTICAL to its
      non-generic sibling, so the call tied between a method and its own specialisation. That one
      needed C#'s tie-break -- a non-generic candidate beats a generic one where every argument
      converts alike -- which selection now applies.

      GREEN-OVER-BROKEN IS RESOLVED, the question this entry used to carry as a task. GenericTypes
      and ArityOverloads were green while requiring this, and reading both confirms neither could
      reach the defect: neither declares a generic method, and every generic member in either is
      typed as a BARE type parameter -- `T Value`, `T1 First`, `T GetItem()` -- never a nested
      construction over one. Both triggers need what neither sample writes, so the exemption was
      sound rather than lucky.

      STILL `partial`, for the inheritance half. `Derived<A, B> : Base<B>` composes correctly if
      asked, since Extend unions two maps, but nothing asks: member lookup does not reach a
      generic ancestor at all, so substitution is never consulted there. See the remaining tasks.

      THE WALK NOW REACHES A GENERIC ANCESTOR, which is half of the inheritance gap and the half that
      needed no substitution. EnqueueBases unwraps a ConstructedType base to its definition, since
      that is where members are declared, and flags everything reached from there OPEN. A member of an
      open base is returned when its type names no type parameter and WITHHELD when it does.

      WITHHELD RATHER THAN ANSWERED OPEN, and that is the load-bearing choice. Surfacing `T Get()`
      off a `Box<int>` base without applying the argument would answer `T`, and no caller can tell an
      open T from a real one, so a wrong type would flow on silently where today the name simply does
      not resolve. Not answering is recoverable; answering wrongly is not. Order 72's emitter half
      refuses the same members for the same reason, which is a coincidence worth keeping: both layers
      decline exactly what they cannot close.

      MEASURED, and v2 is now AHEAD of classic here. `IntBox : Box<int>` reads an inherited
      `Describe()` and `Size()`, and `StringPair : Pair<string>` reads them through a GENERIC MIDDLE
      two levels up. CLASSIC FAILS ALL OF THOSE -- MIST_UNDEFINED_MEMBER, "'IntBox' does not contain
      a definition for 'Describe'" -- so generic CLASS base inheritance is a LIVE DEFECT in classic
      rather than a v2 gap, and no sample exercises it on either pipeline. Classic does handle a
      generic ABSTRACT base, which is what made order 72's residue a genuine v2-only gap; that is now
      closed and `Holder.Show()` on a conformer of `IHold<T>` resolves.

      THE SUBSTITUTED HALF IS DONE FOR STATE, by a third shape neither option this entry recorded had
      considered. Both assumed the choice was to carry a MAP through the lookup or to move the walk into
      Construction; the layering objection dissolves once the walk carries neither. It records the
      CONSTRUCTED BASES it stepped through -- ConstructedType being a Model type, so no Model-to-
      Construction dependency appears -- and Construction composes them. FieldResult and PropertyResult
      gained a BaseConstructions list, outermost first, and TypeSubstitution.ForMember folds it over
      ForReceiver's map, resolving each hop's arguments through the map built so far before they become
      bindings themselves. That is exactly the ordering this entry identified as the obstacle:
      `StringPair -> Pair<string> -> Box<A>` binds Box.T to string rather than to Pair.A.

      WITHHELD IS GONE FOR FIELDS AND PROPERTIES and kept for METHODS, which is the same division the
      obstacle predicted. A method group spans every depth at once and MergeMethods flattens across them,
      so one substitution per group would be wrong -- and overload resolution takes its substitution from
      the receiver alone. So an inherited method naming a type parameter still does not resolve, and a
      test records that limit rather than leaving it to be rediscovered.

      MEASURED, and v2 is now ahead of classic by a wider margin than the walk alone made it. StructInheritance
      is banked, and its `ext.Value` on an `ExtendedContainer<int> : Container<int>` prints 42 rather than 0 --
      the sample's own comment names that as what separates the inherited generic field being INITIALIZED from
      its name merely resolving. Beyond the sample: a base parameter RENAMED by the deriver
      (`Renamed<U> : Holder<U>`), base arguments REORDERED (`Swapped<X, Y> : Pair<Y, X>`), two generic levels,
      and a base argument that is itself a construction (`HoldsAnArray<T> : Holder<T[]>`). CLASSIC FAILS the
      renamed case -- `'T' does not contain a definition for 'Length'` -- because it matches type parameters
      by NAME AND ORDINAL, so `Holder.T` and `SameName.T` collide by luck and `Holder.T` against `Renamed.U`
      does not. v2 keys on parameter IDENTITY, which is why the spelling stops mattering.

      MUTATION-CHECKED, with a result worth recording: discarding the recorded chain fails seven model
      tests and NOT ONE sample test. With no chain the field is typed as the raw `T`, emission still writes
      `ext.Value`, and C# resolves it to int and prints 42 -- so the sample passes on a model that is wrong.
      That is the case for asserting this on the model rather than on output, in the one place it can be
      demonstrated rather than argued.

      STILL `partial`: the method half above, and an EMITTER gap the renamed case exposed. StructFlattener
      composes base substitutions correctly for a struct whose base reuses its parameter, which is every
      struct any sample declares, but a renamed or reordered generic struct base emits C# naming a type
      parameter that is not in scope. The frontend now types those correctly, so the two halves disagree;
      no sample reaches it.
    tasks:
      - >
        Carry a per-depth substitution for an inherited METHOD, which needs MethodGroupResult to hold one
        per candidate and CandidateSet.MergeMethods to preserve it across depths, or overload resolution to
        take a substitution per candidate rather than one per receiver. Until then TypeMemberLookup.Withheld
        stays for methods and an inherited method naming a type parameter does not resolve.
      - >
        Substitute a renamed or reordered generic base's parameters in StructFlattener, which composes by
        position today and emits an out-of-scope parameter name for `Renamed<U> : Container<U>`. The
        frontend half is done, so this is the emitter catching up rather than a shared gap.
      - Descend unions and tuples in TypeSubstitution.Apply when a signature can be stated in
        terms of one.
