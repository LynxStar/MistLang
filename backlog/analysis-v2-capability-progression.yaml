      NOTHING MAY HIDE AN INHERITED MEMBER (2026-09-15), as MIST_PA_MEMBER_REDECLARATION at the derived
      declaration, carrying classic's message. Arthur's decision -- "overloads in derived types against
      inherited members are allowed, hiding and overriding aren't" -- which is method-overloading
      Requirements 5.1 and 5.2 and class-inheritance's additive-only model, the one that "cannot override
      base class behavior". Class-inheritance Requirement 4.4 refuses a shared NAME outright, and 5.1
      already amended it to admit an overload.

      THE RULE: a declared member is refused when its type inherits a member of the same name, unless both
      are members a use site selects among -- a method or an indexer -- whose signatures differ, which is
      the overload 5.1 admits. An inherited signature is read THROUGH the substitution that reaches it,
      since what a deriving type hides is what it sees, so closing a generic base does not license
      declaring what the closing produces. Every ancestor up the base chain is asked, through a constructed
      base and a grandparent alike, and only a Mist-declared member counts, so a projected CLR base is not
      consulted -- a class declaring `ToString` still runs.

