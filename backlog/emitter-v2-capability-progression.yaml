    note: >
      Represented in the model and dropped at emission with no diagnostic. Each was LATENT while no
      BANKED sample contained the construct, and each would have become a false green the moment its
      sample was made to build for another reason. Two of the three are now closed; the entries stay
      because the shape is what this section is for.
    entries:
      - Attribute lists, order 117. CLOSED -- v2 binds and emits every one, and samples/Attributes
        is banked. It was the clearest instance of the shape, one small unrelated fix away from
