  blocking_refusals:
    - defect: Standard and System cannot be imported together
      recorded_on: using-import-resolution (order 29)
      gates: [ClrRefInterop, RefStructs, DisposableDropInterop]
      status: FIXED
      note: >
        Was the largest single blocker on the unbanked set, and it masked what those three samples
        were actually waiting for. Not a language question: classic resolves user-declared
        namespaces before ambient ones and returns on the first hit, so `Console` binds to
        Standard.Console and System is never consulted. v2 had flattened those two phases into one
        loop. LookupImports now tiers on IAssembly.HasMistSource. Measured after: ClrRefInterop 7
        errors -> 2, RefStructs 43 -> 4, DisposableDropInterop 15 -> 2. None of the three banks yet;
        what changed is that their real residue is now visible instead of masked.

    - defect: a type present in two reference assemblies is refused outright
      recorded_on: clr-assembly-type-projection
      gates: [Testing, CSharpInteropV2, DelegateFuncConversion]
      status: FIXED
      resolved: >
        First definition wins, silently. THE DIAGNOSTIC WAS ANSWERING A QUESTION CLASSIC NEVER ASKS:
        classic resolves a type on demand and returns the first assembly whose namespace index has
        the name, so a second definition is simply never reached. v2 shells every exported type
        eagerly, which is what surfaces the collision -- so the collision belongs to v2's strategy
        and is v2's to absorb. Type FORWARDING was already excluded by the loop above it; what
        reached the check was the same name genuinely defined twice, which real package sets do.

        Measured: Testing 223 duplicates -> 0, CSharpInteropV2 5 -> 0, DelegateFuncConversion 4 -> 0.
        All 47 banked samples unaffected, both baselines matching on both pipelines.

        NO UNIT TEST, and the reason is worth stating rather than hiding: reproducing it needs two
        assemblies that define the same FQN without forwarding, which the runtime reference set does
        not readily provide and which would take a crafted fixture pair. What replaces the test is
        structural -- the DESCRIPTOR IS DELETED, so the diagnostic cannot return without someone
        deliberately re-adding it.

        WHAT IT WAS MASKING is now the top blocker, and it is a different defect: MIST_AMBIENT_UNRESOLVED,
        Testing 5, CSharpInteropV2 137, DelegateFuncConversion 56. Types like
        Microsoft.VisualStudio.TestPlatform.ObjectModel.ILazyPropertyValue and Xunit.Sdk.ITheoryData
        are referenced from projected member signatures but were never shelled. Unchanged in count by
        this fix, which is the evidence they are independent rather than downstream.
      note: >
        v2-ONLY, and now the largest single blocker on the unbanked set. AmbientTypeProviderV2
        reports MIST_AMBIENT_DUPLICATE when a type FQN is already shelled, on the theory stated in
        its own message -- "Remove the conflicting package" -- that this means conflicting NuGet
        packages. It routinely does not: a framework reference pack and a NuGet package legitimately
        carry the same type, which is what type forwarding is for. The descriptor's own summary says
        "without type forwarding"; the code never checks for forwarding, only `shells.ContainsKey`.

        Measured 2026-09-06: Testing 223, CSharpInteropV2 5, DelegateFuncConversion 4, all with
        MIST_AMBIENT_UNRESOLVED alongside. CLASSIC BUILDS ALL THREE CLEAN, so this is a divergence
        where v2 refuses what the contract accepts, not a gap. Classic's provider takes the first
        and moves on.

        SAME SHAPE AS THE STANDARD/SYSTEM BLOCKER ABOVE: it masks what those samples are actually
        waiting for. CSharpInteropV2's 137 MIST_AMBIENT_UNRESOLVED are the bigger half of its
        residue and cannot be read until this clears.

    - defect: a signature mentioning an unloaded type refuses the whole compilation
      recorded_on: clr-assembly-type-projection
      gates: [Testing, CSharpInteropV2, DelegateFuncConversion]
      status: FIXED
      resolved: >
        AmbientTypeResolver returns ErrorType without a diagnostic. THE CALLER ALREADY KNEW WHAT TO
        DO WITH IT: every member projector skips a member whose signature will not resolve, so the
        member was being dropped AND the compilation refused, when dropping alone is right. A member
        mentioning a type from an assembly nobody loaded is unusable whether or not we say so, and
        calling it still fails -- at the call site, in the user's own file, as
        MIST_PM_UNRESOLVED_MEMBER.

        SAME ASYMMETRY AS THE DUPLICATE ABOVE. Classic resolves on demand, so a signature it never
        asks about costs nothing. v2 projects every member of every type eagerly and walks thousands
        of them, which is how samples/Testing came to be refused over Xunit.Sdk.ITheoryData -- a name
        its author never wrote and cannot act on.

        Measured: CSharpInteropV2 143 errors -> 1, DelegateFuncConversion 60 -> 17, Testing 228 -> 16.
        CSharpInteropV2 is now a ONE-ERROR sample, its residue being UseNpgsql, a CLR extension
        method from a NuGet package -- order 131, correctly `missing`.

    - defect: no non-string argument is applicable to an `unknown` parameter
      recorded_on: overload-resolution-by-argument-type (order 26)
      gates: [ExtensionMethods, Variadics]
      note: >
        Refuses `Console.WriteLine(7)`, which classic prints. Already carried its own one-task fix;
