               operators-arithmetic-comparison-logical, control-flow-basic,
               instance-fields, constructors, this-expression,
               implicit-instance-field-access, object-creation, constructor-chain-this,
               overload-resolution-by-argument-type, constructor-overload-resolution]
    note: >
      Marked done in the old progression. It is not. Everything except overload resolution
      is delivered; the sample passes because Roslyn resolves the calls and every result
      feeds string interpolation. This entry is the correction.
      A static Main calling RunDemo was added so the sample builds and runs on its own. That
      changes nothing about the debt: the wrong-overload case stays invisible here, and the
      reproduction lives outside the sample suite -- `var sum = MathHelper.Add(1.5, 2.5)`
      against an int-first overload set emits `int sum = ...` and fails in Roslyn with CS0029.
    untested:
      - Every Format and Add result is interpolated, so choosing the int overload for the
        double arguments would be invisible. The double sum prints as 4 and so would an int
        result.
      - The double Clamp call returns its min and prints as 1, indistinguishable from an int
        result.
      - No overload is selected in a position where the static type is observable, such as
        assignment to an explicitly typed local.
      - The chain in the parameterless constructor passes a literal, so the
        parameter-referencing chain argument is not exercised.

