      A SLICE OF AN ARRAY IS AN ARRAY OF UNKNOWN LENGTH, built through ScopeResolver.ConstructArray
      with a null length rather than assembled by hand, that being the single place an array type is
      built. `numbers[1..3]` is statically 2 long but `numbers[a..b]` is not, so no length is claimed.
