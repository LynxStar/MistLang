# Known flaky tests.
# Tests that fail intermittently without a corresponding code change. Recorded rather than fixed
# on discovery, because a flake found mid-change is a distraction from that change -- but an
# unrecorded flake is worse: the next person to see it re-diagnoses it from scratch, and every
# unexplained red run erodes the signal the suite is supposed to carry.
#
# Append an entry the moment a flake is identified, even when leaving it unfixed. See
# .kiro/steering/test-failure-triage.md.
#
# Fields:
#   id          Short dashed identifier.
#   test        Fully qualified test name.
#   file        Where it lives.
#   discovered  ISO date first recorded.
#   status      open | unreproduced | fixed | quarantined
#               `unreproduced` means it was seen but deliberate attempts to trigger it failed, so
#               even the symptom is not yet pinned down. Do not act on one of these without a
#               reproduction -- a fix aimed at a guessed cause is worse than no fix, because it
#               retires the entry without changing anything.
#   symptom     What the failure looks like.
#   cause       Why it happens. "unknown" is an acceptable answer; a guess dressed as a cause is not.
#   evidence    How the diagnosis was reached, so it can be re-checked rather than re-derived.
#   fix         The proposed change. Omit when the cause is unknown.

flakes:
  - id: property-tests-fail-together-under-full-suite
    test: >
      Mist.Tests.Backend.TypeArgumentInferenceEmissionPropertyTests.InferredCalls_EmitExplicitTypeArguments_InCSharp,
      Mist.Tests.Analysis.RefinementSubsetPropertyTests.CompoundSubset_AcceptedIffSourceRangeContained,
      Mist.Tests.Backend.InitializerArrayConstructionPropertyTests.InitializerConstruction_ProducesCorrectElementValues
    file: Test/Mist.Tests/Backend, Test/Mist.Tests/Analysis
    discovered: 2026-09-07
    status: fixed
    symptom: >
      Three property tests failed together in one full-solution run, having passed in the run
      immediately before it with the same binaries. All three passed under --filter in isolation and
      all three passed on the next full run, with no edit between. The three failures do not share a
      message: one reports a falsified property with a printed seed, one a falsified property after
      46 cases, and one an exit code -1 whose stderr is MIST_UNDEFINED_NAMESPACE for `Standard`.
    cause: >
      THE SHARED THING IS NAMED, as of 2026-09-08, and it is the build-copied standard library.
      Mist.Tests.csproj copies Source/Standard/**/*.mist as Content into
      AppContext.BaseDirectory/Standard/, and Mist.CLI's output carries its own copy that spawning
      tests read. `dotnet test Mist.slnx` BUILDS AND RUNS three projects together, so tests can read
      those directories while the build is still writing them -- and a stdlib that is not there yet
      is not a failed property, it is MIST_UNDEFINED_NAMESPACE for `Standard`, which is the third
      symptom this entry was opened for.

      A NESTED BUILD IS THE WRITER, and this corrects a first reading that blamed a missing
      ProjectReference. Mist.Tests does not reference Mist.CLI, but that is not the defect: the
      tests never consume the CLI's output as a reference. SamplesCompileAndMatchBaselineTest spawns
      `dotnet run --project Source/Mist.CLI/Mist.CLI.csproj`, which is a SECOND MSBuild inside the
      first. It rebuilds Mist.CLI and re-runs that project's own `Content` copy of
      Source/Standard/**/*.mist into Source/Mist.CLI/bin/.../Standard/ -- the exact directory the
      `mist` it then launches reads through StdlibLoader's AppContext.BaseDirectory/Standard. So
      adding a ProjectReference would change nothing on its own; ordering the solution build does
      not stop a test from starting its own.

      A SUSPICIOUS CORRELATION worth checking on the next sighting: the copy is PreserveNewest, so
      it is a no-op until a source file's timestamp moves. The 462-failure run came minutes after
      Source/Standard/Bootstrap/Span.mist was edited, which would have made every nested build
      re-copy the whole Standard tree rather than skip it. If that holds, the flake is far likelier
      in any session that has touched Source/Standard than in one that has not -- which would also
      explain why it clusters rather than appearing uniformly.

      FIXED 2026-09-09 by removing the nested build: SamplesCompileAndMatchBaselineTest now runs the
      CLI with --no-build, and Mist.Tests carries a ProjectReference on Mist.CLI with
      ReferenceOutputAssembly="false" so something still guarantees the binary exists. Neither half
      works alone. NestedBuildBanTest is the structural guard, asserted on source because what the
      fix removes is a RACE -- a passing run proves nothing, so nothing observable could catch the
      regression.

      MEASURED, not assumed: `dotnet run --project ... --no-build` leaves the copy's mtime untouched,
      where the same command without the flag moves it once a Source/Standard file is touched. That
      also confirms the PreserveNewest correlation above -- the copy is a no-op until a timestamp
      moves, which is why the flake clustered in sessions editing the standard library. Two runs of
      the racy `dotnet test Mist.slnx` form, each preceded by touching every Source/Standard file,
      came back 5150/5150 with zero Standard-missing failures; that is consistent with the fix rather
      than proof of it, the proof being that the only nested build in the suite is now gone.

      RESIDUE, AND WHAT A NEW SIGHTING WOULD MEAN. The in-process failures in the 462 run are NOT
      explained by this mechanism: they read Test/Mist.Tests/bin/.../Standard/, written by the outer
      build, which VSTest waits for. They may have been collateral of heavy concurrent MSBuild I/O.
      A recurrence whose failures are in-process ONLY is therefore a second mechanism and should open
      a NEW entry rather than reopen this one -- capture the full log first.

      This supersedes "unknown" rather than guessing at it -- see the 462-failure reproduction under
      recurrences, which is where the window is measured.
    evidence: >
      Found while delivering order 146, which changes type-argument emission -- so the first of the
      three had to be treated as a real regression rather than assumed flaky, since it asserts
      exactly what that change touches. It was not: the three pass under --filter together, the
      full suite passes on rerun at 5057, and neither of the two test files was modified by that
      work (git status shows only DependentCarrierNameTests and UnspellableTypeGuardTests).
      Every unbanked sample was also swept at zero Roslyn errors before and after.

      MUCH STRONGER EVIDENCE THE NEXT DAY, during order 151, and it changes what this entry is
      about. Four consecutive full-suite runs on IDENTICAL binaries with no edit between them gave:
      1 failure, 1 failure, 9 failures, 0 failures. The failing sets were disjoint each time --
      AttributeEmissionRoundTrip, then a parse PERFORMANCE test, then eight of the nine
      CrossFileTypeResolutionTests plus a tuple-pattern test, then nothing. Every one of them
      passed under --filter immediately afterwards, and CrossFileTypeResolutionTests passed 9/9 in
      isolation moments after failing 8/9 in the suite.

      SO THIS IS NOT THREE TESTS, it is the suite. Whole classes fail together and recover
      together, which no per-test defect explains and which fits the MIST_UNDEFINED_NAMESPACE
      symptom above: something shared -- a temp directory, a stdlib cache, a file still being
      written -- is occasionally unavailable, and whichever tests touch it in that window fail
      whatever they were asserting.

      NOTE FOR attribute-emission-round-trip-unreproduced BELOW: it was reproduced here, in a full
      suite run, after that entry recorded 19 failed attempts to trigger it deliberately. The
      attempts were presumably in isolation, which by this theory is exactly where it cannot
      happen. Reproducing it may be a matter of load rather than of input.

      Machine was under sustained load from back-to-back full-suite runs throughout, which is the
      obvious confound and also the likeliest trigger.
