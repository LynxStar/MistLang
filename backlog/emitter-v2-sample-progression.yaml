# V2 Emitter Sample Progression
#
# GENERATED FILE -- do not hand-edit. Regenerate with:
#   dotnet run --project tools/SampleFingerprint -- <repoRoot> \
#     backlog/emitter-v2-sample-fingerprints.json "<comma,separated,done,samples>"
#
# Append --reuse to reorder from the fingerprints already recorded in the JSON instead
# of re-parsing every sample. Only valid when no .mist source has changed since the
# last full run -- typically when the only edit is adding a sample to the done-list.
#
# HOW THE ORDER IS DERIVED
#
#   syntax_constructs / new_constructs are MEASURED: every .mist file in the sample is
#   parsed with the real Mist parser and the distinct AST node kinds are collected.
#   Operator-precedence chain nodes are excluded (Storm materializes them for every
#   expression whether or not an operator is used); operators actually applied appear
#   as 'op:X', and union / optional types as 'type:union' / 'type:optional'.
#
#   gate_tier is the compiler subsystem the sample depends on. It is the HIGHER of a
#   curated assignment and the tier proven by the constructs the sample contains, so a
#   sample cannot be filed early when its source says otherwise. Samples are ordered
#   tier by tier, and within a tier by fewest new constructs.
#
# IMPORTANT CAVEAT
#
#   new_constructs measures SYNTAX ONLY. It is a lower bound on the work, never an
#   estimate of it. new_constructs: [] means the sample introduces no new syntax, NOT
#   that it is free -- semantic work (overload resolution, type inference, void
#   lowering, ownership analysis) is invisible to this measurement.
#
#   gated_by lists the constructs that force a sample above its curated tier. A long
#   gated_by means the sample is a kitchen sink whose name understates what it needs.
#
# AllFeatures is excluded (meta-sample calling all others). 75 samples, 315 distinct constructs currently covered.

