      A TYPE IS JUDGED WHEREVER IT IS NAMED (2026-09-26), decided by Arthur: a name denoting a type outside
      its accessibility domain is refused, as C# refuses it (CS0122) -- the full-accessibility-model spec's
      Requirement 11.2, a nested type's domain being its own intersected with its enclosing type's (11.1).
      MEASURED FIRST on both pipelines, one probe per position, over a private class and a private alias
      nested in a public Gauge and named from another type: a local's type, `new`, a cast, `as`, `is`, a
      typed property pattern, a type argument of a construction and of a generic method, a type in value
