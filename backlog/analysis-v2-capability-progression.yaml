      GENERIC EXTENSION CONTRACTS (WORKSTREAM 11, 2026-09-27). Revalidated the specialization loss on
      main bedd3576. Method.SourceDeclaration links each closed signature to its canonical declaration;
      PurityInference.Answer and ReadonlyInference's root and transitive-call decisions consume that
      link. The declaration's body, parameter identities, receiver binding, nested generic parameters
      and closure roots are analyzed together, with the existing greatest fixpoint. Body is deliberately
      absent on the closed signature. Inferred promises are universal declaration contracts, shared by
      its views; closing a type argument does not infer a stronger promise from a concrete type.
      Each view keeps its own BlockClosing, closed return/parameter/context types, context identifiers,
      ReturnOwnership, DeclaredThisTier, diagnostic DeclarationNode, declaring type/block, scope and
      SequenceLengthOperation. Method and parameter attribute lists are copied independently; their
      declaration payloads and method type parameters/constraints retain canonical identities rather
      than being rebound or evaluated. Reclosing a view starts from the canonical signature, so the
      first receiver's types and substitution cannot leak into the next. Overload ranking and carrier
      emission retain their existing paths; no new analyzer order or purity policy is introduced.

