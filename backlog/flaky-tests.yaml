    test: >
      Storm.SourceGenerator.Tests.StormTraitMultiAltRejectionPropertyTests.P8_MultiAltRuleWithTraitBindings_AlwaysEmitsSTORM0022,
      Storm.SourceGenerator.Tests.StormTraitMultiAltRejectionPropertyTests.P8_Inverse_SingleAltRuleWithTraitBindings_NeverEmitsSTORM0022
    file: Test/Storm.SourceGenerator.Tests/StormTraitMultiAltRejectionPropertyTests.cs
    discovered: 2026-09-14
    status: fixed
    symptom: >
      Never sighted by name in a suite run. Found by replay alongside
      storm-trait-composition-inheritance-property. The failure read "Grammar build failed for source" and
      printed the drawn grammar, with no diagnostic.
    cause: >
      THE GENERATORS DREW INVALID GRAMMARS, the same habit in a fifth file. Both tests renamed the rule
      apart from the other declarations but left the trait's name unchecked. P8 declares a token for each
      alternative's reference name and P8_Inverse one for each trait field's type name, and either could be
      the trait's own name. One name declared twice is STORM0003, and traits share the declaration
      namespace with tokens and rules by design (storm-trait-keyword design.md, TraitValidationPass item 2),
      so Storm is right.
    evidence: >
      REPRODUCED BY REPLAY, 2026-09-14, the same way as storm-trait-composition-inheritance-property.
      P8_MultiAltRuleWithTraitBindings_AlwaysEmitsSTORM0022 failed four rounds of five, after 98863, 32158,
      76350 and 21704 draws: four failures in 429075 draws, about one in 107000, or one run in 540 at the
      test's 200 draws. Each time the trait was named like one of the alternatives' tokens -- La3e, Brb,
      Axj, Wa6. P8_Inverse failed one round, after 162739 draws, on `trait Znq = jxt6:Znq ...` beside
      `token Znq`: one failure in 962739 draws, too few to call a rate.

      CONFIRMED AS FIXED INPUTS, before the fix. The recorded grammars for La3e and Wa6, and the P8_Inverse
      grammar, each gave grammar.Succeeded=False with "STORM0003 Duplicate declaration name". With the token
      renamed apart (La3e1, Znq1) both built: the multi-alternative grammar still reported STORM0022, and
      the single-alternative one reported no trait diagnostic and emitted
      `public sealed class Id7k9Node : SyntaxNode, IZnqNode`.

      LEFT AS IT IS, and noted so it is not rediscovered: P8's generator also binds undeclared traits and
      names undeclared field types, so its grammars report STORM0018 and STORM0019 beside STORM0022. The
      property asks only that STORM0022 is present, which those do not disturb.
    fix: >
      APPLIED 2026-09-14. Each generator requires the trait's name to differ from every name it declares as
      a token, and the grammar-built assertion prints the build diagnostics. After it both properties
      passed five rounds of 200000 draws each, 10 of 10, where P8 had failed four rounds of five before.
      P8_Inverse's clean million is weak evidence on its own, given one failure in 962739 draws before; the
      filter rejects the colliding draw by construction.
