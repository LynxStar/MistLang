# ===================================================================
# Order 13 -- purity. Specified after the 91 tasks were ordered, from
# a spec of its own; it closes one of them, and holds the 92nd, which
# order 50 gained afterwards.
# ===================================================================

  - id: purity-checking
    name: What a member may touch beyond its own scope -- readonly, local and pure
    order: 13
    subsystem: purity
    requires: [ownership-borrow-checking, declaration-shape-checks, refinement-proving]
    status: done
    from: >
      order 50 (default-value-synthesis), its analysis task "Report a field initializer of a defaultable
      type, and a default block entry, that is not a pure expression", and its later task "Refuse
      `default(T)` on a class whose only constructor is a user-declared parameterless one", placed here
      because both ask what taking a default runs; and the purity spec
      (.kiro/specs/purity), which states the rest and which no emitter task needed
    evidence: >
      THREE PROMISES AND ONE TYPE. `readonly` existed. `local` promises that a member touches only its own
      instance, and `pure` promises no side effects and a deterministic result, with allocation allowed.
      Both are new keywords, admitted on members, types, accessors, local functions and lambdas, and
      `pure func<...>` is a function type. Commit e1c03a6a added the syntax and the model:
      MemberModifiers.IsPure, which sets IsReadonly, and IsLocal, inherited from a type per Requirement
      15; FunctionType.IsPure, interned separately and erased in overload signatures; and
      LambdaExpression.IsPure and IsLocal. The binder reports MIST_PM_PURE_AND_LOCAL,
      MIST_PM_READONLY_IMPLIED_BY_PURE (info), MIST_PM_LOCAL_REQUIRES_INSTANCE,
      MIST_PM_PURITY_MODIFIER_PLACEMENT and MIST_PM_PURE_REQUIRES_FUNCTION_TYPE. Emission reads no promise
      and changes no behavior; it reads IsReadonly, which IsPure sets, so a pure type's fields are emitted
      `readonly`, as a readonly type's are (measured: `public pure class Money { public int Cents; }`
      emits `public readonly int Cents;`).

      WHAT THE JUDGE REFUSES AND ADMITS. PurityJudge walks one body under Pure, Local or LocalReadonly.
      Every answer goes through Origins, which says what the scope owns, what it holds frozen and what is
      external. A scope owns a construction, an owned binding or parameter, a local that is fresh at every
      assignment, a struct held by value, and a capture that its enclosing scope owns. A reference field
      is external unless it is owned and reached through an owning reference. The judge refuses: writing
      anything frozen or external; reading non-stable state of anything external; calling a readonly or
      unmarked member; calling a local member on anything the scope does not own; calling a function value
      that is not pure; `new` through a constructor that is not pure; storing a frozen or external
      reference of a mutable type into an owned instance; and await, async blocks and with blocks. It
      admits: anything done to what the scope owns; a stable field of anything; a pure member on anything;
      a local readonly member on what the scope owns or holds frozen; a pure function value; and
      allocating an array, tuple, anonymous object or lambda. Its analysis ids are
      MIST_PA_PURE_SCOPE_WRITES, _READS_MUTABLE, _CALLS_IMPURE and _STORES_UNOWNED;
      MIST_PA_LOCAL_SCOPE_READS_ARGUMENT; MIST_PA_PURE_FUNCTION_REQUIRED; MIST_PA_DEFAULT_NOT_CONSISTENT;
      MIST_PA_PURITY_CONTRACT_NOT_MET, for an implementation that breaks its abstract's declared promise;
      and MIST_PA_PURE_FUNCTION_TYPE_UNTESTABLE, for a runtime test or cast to a pure function type. The
      ownership side adds MIST_PA_OWNED_RETURN_NOT_OWNED, MIST_PA_SLOT_RETURN_NOT_OWNED and
      MIST_PA_OWNED_SOURCE_NOT_OWNED. PurityAnalyzer reports declared promises only. A member that
      declares nothing is consulted only as a callee, so an inferred promise is never reported
      (Requirement 3). A member declared pure or local readonly is judged by PurityAnalyzer alone, not by
      ReadonlyAnalyzer as well: one mistake, one complaint.

      THE WHOLE-PROGRAM FIXPOINT (Requirement 8). PurityInference starts every member that has a body with
      all three promises. Each round re-judges every body against its callees' current promises and drops
      what the body breaks: readonly first, then pure, then local. The rounds repeat until nothing
      changes. PurityInference owns ReadonlyInference, because the two depend on each other: Local needs
      Readonly, and Readonly's Requirement 11 admission needs Local. A bodiless member keeps what it
      declares (Requirement 9.1). An abstract member keeps what it declares, or else the meet of every
      implementation in the program, found through ConformanceAnalyzer.Fillers. A CLR interface slot with
      no Mist implementer keeps nothing. Getters that only read each other keep pure, as a greatest
      fixpoint must (Requirement 8.3). Cost, measured when the analysis landed and under load from other
      sessions: building AllFeaturesV2 on v2 went from 15.4 s to 16.7 s, about 8%. On an idle machine it
      took 4.5 s.

      THE AMENDMENTS. Requirement 11 amends readonly-contexts. A readonly context may write a field, index
      or element of what it owns, and may call a local member on it. It counts as a write anything done
      through a ref parameter, an element of an array parameter, an object initializer's setter, a
      property pattern, an extension property or a conversion operator
      (MIST_PA_READONLY_CONTEXT_WRITES_THROUGH_REF is new). For Requirement 12.2, StableMembers admits a
      getter that PurityInference proves pure; local readonly is not enough. This admits order 6's
      "refused for want of analysis" getter, which calls a method that reads only readonly state.

      STANDARD'S PROMISES (Requirement 9.3). The 13 intrinsic primitives, String and Regex keep `readonly`
      on the type and declare every member `pure`. `pure` cannot replace `readonly` on these types,
      because classic parses the keyword and ignores it, and it judges enum bases by the type's
      `readonly`. Replacing it was measured: classic reports MIST_TC_0102 and 0103 on
      EnumReadonlyRestriction. Math, Convert, Index and Range are pure types; Console, Task, Type and Span
      state nothing. List<T> is declared in Source/Standard/Experimental/List.mist, which only the
      experimental pipeline loads, so classic's baseline holds. It is an intrinsic over
      System.Collections.Generic.List<T> and is never `owned`. Its constructor is pure. Count, Contains,
      IndexOf, ToArray, GetEnumerator and the indexer's getter are local readonly. Add, Insert, Remove,
      RemoveAt, Clear, Sort, Reverse and the indexer's setter are local. On its Enumerator, MoveNext is
      local and Current is local readonly. Its comparisons judge the element's Equals and CompareTo
      (ElementComparisons).

      ACCESSOR PROMISES. An accessor may state its own promise ahead of its accessibility, as in
      `{ local readonly get; local set; }`. It is written through the grammar rule AccessorPromise and
      recorded on PropertyAccessor.OwnModifiers, and it replaces the declaration's promise for that
      accessor wherever a promise is read (commit 34f77aef). `private pure get` is a parse error. List's
      indexer is why this exists: its getter and setter keep different promises.

      CULTURE-INVARIANT EMISSION, DECISION A (Arthur, 2026-09-27). Several of Standard's pure members read
      the current culture at run time: String.ToUpper, Convert.ToInt32(String), Regex construction and
      matching, numeric interpolation and concatenation, and List<string>.Sort. These were 11 of the 13
      holes the adversarial rounds left open. There were two ways out: withdraw promises the spec
      mandates, or emit with the invariant culture, which changes output against classic under any culture
      that is not invariant. The decision was to emit invariant. If a culture-aware form is ever wanted,
      it will be a separate overload that is not pure. Requirement 13.2 states the rule, and
      Lowering/InvariantCulture holds it. ToUpperInvariant, Convert's overload taking InvariantCulture,
      and RegexOptions.CultureInvariant are emitted for those members. A numeric hole is wrapped in
      System.FormattableString.Invariant. A numeric operand, Console argument or ToString gets
      ToString(CultureInfo.InvariantCulture). A value whose text is decided at run time goes through
      MistInvariant.Text, and a sort gets StringComparer.InvariantCulture, MistInvariant.Comparer<T>() or
      MistInvariant.Elements<T>(...). The MistInvariant helper is emitted into __Invariant.g.cs only when
      used. Measured: AllFeaturesV2 prints output byte-identical to its baseline under tr_TR, de_DE and
      sv_SE; before the change, its 11 decimal lines would have printed commas.
      InvariantCultureEmissionTests (Tier 3, 18 rows) pins each emitted form.
      CultureInvariantEmissionTests (Tier 4) compiles one program, runs it under tr_TR.UTF-8 and
      de_DE.UTF-8, and checks as a control which culture the run actually got. Removing the
      FormattableString wrapper fails it on "1,5"; dropping the sort comparers fails it on "abBIi". Seven
      existing expectations changed on purpose, to the invariant spellings: ClrSpellingTests (2),
      IntrinsicCloneEmissionTests (2), OperandParenthesesEmissionTests (2) and UnitHoistingEmissionTests
      (1). This work is commit 66ac194b.

      THE PROCESS BOUNDARY, DECISION B (Arthur, 2026-09-27). Pure means the same input gives the same
      output WITHIN ONE PROCESS RUN, not across machines, runs or runtime versions. What the process fixes
      when it starts -- the runtime and its version, its globalization mode and ICU, the operating system
      and machine -- is the program's setting, not an input, so a pure member may depend on it. What can
      change during the run -- the current culture, the clock, randomness, environment variables, files,
      statics that are not stable -- is outside state. Requirement 7.5 states it, and the Introduction's
      "deterministic" says "within one run". Hence text ordering stays on StringComparer.InvariantCulture
      and the emitted runtimeconfig pins nothing. Measured before the decision: a pure member sorting text
      prints `abBiI` normally and `BIabi` under DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 (scratch probe
      rerun/gi1), and that mode is fixed when the process starts, so it is the program's setting. The
      "ordinal or invariant ordering" and "pin the globalization mode" items the Phase 3 review raised are
      CLOSED by this definition. Another ordering, ordinal among them, can be added later as its own
      member, as a culture-aware form can (decision A).

