      NOT STARTED: MIST_VAR_0008, an empty stem, which the grammar may not admit at all.
    unlocks: []

  - id: variadic-monomorphization
    name: Monomorphization per observed arity
    order: 153
    layer: variadics
    requires: [spread-generated-members, tuple-patterns]
    v2_status: done
    evidence: >
      Discover the finite set of arities actually used across declarations, member types and
      construction sites, then specialize to each. Pack narrowing by tuple pattern re-enables
      fixed-arity forwarding inside a branch, and those branches must be PRUNED per
      monomorph -- the classic pipeline copies them verbatim, leaving shape-impossible tests
      in every arity.

      MONOMORPHIZATION IS NOT A MIST CONCERN AND MUST NOT TOUCH THE MODEL. It exists because the
      TARGET requires it, and design.md says so outright: "Mist core semantics: arity is unbounded",
      the ceiling is "explicitly a per-backend limitation", and "by emission time every pack has a
      concrete Type[] value and every spread has a known length, so emission IS monomorphization".
      Another backend may need none of this.

      RECORDED BECAUSE THE OBVIOUS IMPLEMENTATION IS THE WRONG ONE. Specializing a variadic
      declaration means rewriting its method BODIES, and the model has neither expression
      substitution nor type cloning -- so the natural move is to make ProgramModelBuilder re-bind
      the declaration once per arity with the pack pre-bound. That works, and it puts a C#
      limitation inside the language's model. It was proposed here and rejected on exactly that
      ground.

      THE SHAPE THAT IS RIGHT reads the model and produces SOURCE, adding files rather than
      changing types -- which is where classic already puts it, in Backends/CSharpTranspiler rather
      than in Semantics. v2 has the same pattern in EmitUnionCarriers and EmitDependentCarriers.
      Mappings the spec fixes: a value pack `(TArgs...)` to System.ValueTuple, nested past seven;
      spread projections to Item1..ItemN, matching ValueTuple's own field names; a constructed Func
      or Action to the matching CLR shape.

      HALF OF IT IS ALREADY DONE, by order 109 rather than by anything here: Func and Action collapse
      to the structural function type, which the emitter already maps to System.Func and
      System.Action. So the mapping half needs nothing further and only USER-DECLARED variadic
      types need per-arity declarations.

      MEASURED AGAINST samples/Variadics, whose model is now clean, so every remaining error is
      emission's: five variadic DECLARATIONS needing per-arity emission; six whole-pack ASSIGNMENTS
      (`Item... = values...`), which belong to order 152; two symbolic spreads awaiting an arity;
      and two bracketed pack arguments at a METHOD call site, which order 150 delivered for type
      references only.

      THE TYPE AXIS IS DELIVERED. A variadic family becomes one C# declaration per arity used, and
      the original is no longer emitted where it was written. Variadics 15 emission errors -> 2, and
      all 28 samples stay at zero Roslyn errors, which was the whole risk in un-refusing pack
      emission.

      THE SPECIALIZATION IS AMBIENT WHILE ONE IS EMITTED, thread-static and scoped to a single
      declaration. The alternative is a substitution parameter threaded through twelve emitters, and
      a concern spread that thinly is one that gets forgotten in the thirteenth.

      LOWERINGS THE AMBIENT MADE POSSIBLE: `TArgs.Length` becomes the constant, since at a fixed
      width there is no value standing for the pack to read it off; a spread inside a tuple expands,
      with ValueTuple named outright for the one and zero widths C#'s tuple syntax cannot spell; a
      whole-pack zip `Item... = values...` becomes a tuple assignment, both sides being the same
      shape; and a PROVABLE spread expands at last, its width having been unknown when binding let
      it through.

      THE METHOD AXIS IS DELIVERED TOO. A variadic method becomes one C# method per width it was
      CALLED at -- the widths coming from call sites, since neither the declaration nor an inferred
      call names one, and recorded as calls bind through VariadicUseRegistry beside the constraint
      closures that exist for the same reason.

      THE FLATTENED CALL CONVENTION WAS HIDING BEHIND THE GATE. `params TArgs args` is ONE tuple
      parameter reached by a FLAT argument list, which C# has no notion of, so the absorbed
      arguments are packed at the call site. Until then the specialization emitted a one-parameter
      method and every call passed N -- broken C# that nothing compiled, because the two remaining
      refusals were still gating compilation. Found by probing a variadic call in isolation rather
      than by the sample, which could not have shown it.

      SPECIALIZATION IS KEYED ON THE PACK, not on an owner, which is what lets a type and a method
      share one mechanism: each emitter asks whether the specialization in scope owns the parameters
      it is about to write.

      THE GATE WAS LIFTED LAST, WHICH IS THE PART WORTH KEEPING. `Describe<[int, string, bool]>(...)`
      is an explicit generic invocation of an unqualified method, which v2 did not bind at all. That
      binding was written early, turned two honest refusals into 25 MIST_CS_ERROR -- the
      silent-emission shape, in a single edit -- and was REVERTED. Those 25 were then the inventory,
      and each entry became its own commit before the binding landed again.

      WHAT THE 25 WERE, and where each went:
        - Spread syntax reaching the emitted file: two causes. A base clause emitted verbatim, base
          references being the fourth site to resolve a generic without binding the pack; and a
          symbolic Func, whose parameter list the tuple emitter had always spliced and the function
          emitter never did.
        - A pack leaking outside any specialization: refused as MIST_BE_UNSPECIALIZED_PACK, a
          signature walk beside the refinement one.
        - Value-level `params T[]`: the modifier was dropped, so a flat call had no overload to
          reach. Emitted for the homogeneous form alone.
        - A variadic abstract in a base list: needed both the base clause routed through
          MonomorphReference and a specialization set CLOSED over what a specialization itself asks
