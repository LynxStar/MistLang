      type. Element types must satisfy a stampability predicate distinct from C#'s unmanaged
      rule, memory is zero-initialized, and the escape rule must permit passing a
      stackalloc-backed span down while refusing to let it escape.

      BOUND AND EMITTED. The node has the same shape as an array creation and is deliberately a
      separate one: the two differ in where the memory lives, which is the whole of what the syntax
      chooses between, and only the emitted keyword records it. StackOnlyTypes is banked in
