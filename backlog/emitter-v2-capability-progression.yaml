      options.GlobalUsings, which CompilerDriver documents as the test path: when a mist.toml is
      parsed the manifest value goes to CompilationUnit.GlobalUsings instead, leaving the options
      field empty. So v2 global usings only ever worked in tests, and the sample reported
      MIST_PM_UNRESOLVED_TYPE three times.
      Implicit usings now belong to the assembly. MistAssembly carries them, set once at
      registration, for the same reason it carries EntryPoint: the setting is a project's, and one
      project's choice must not reach another's files. GlobalScope became AssemblyScope, one per
      assembly rather than one shared across the compilation, seeded from its own assembly.
      CompilationUnitBuilder resolves the assembly before building the file scope -- it was already
      resolving it four lines below -- and parents each FileScope onto that assembly's scope.
      All three recorded tasks are covered. A file inside a globally-used namespace resolving a type
      from the other one is GlobalUsings/Services/Formatter.mist reaching Product, and it works. The
      redundant explicit using produces no error and no warning.

