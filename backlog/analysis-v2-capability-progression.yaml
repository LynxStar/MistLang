  - id: pattern-checking
    name: Impossible, redundant and unreachable patterns
    order: 8
    subsystem: typechecker
    requires: [assignability-core, exhaustiveness-checking]
    status: done
    from: >
      orders 90, 91, 92, 93, 98, 99, 103 -- 11 tasks
    evidence: >
      ALL OF THESE ASK THE SAME QUESTION AS ASSIGNABILITY, about a pattern rather than a value: can this
      type reach that one. Each pattern is judged against the type flowing INTO it -- the scrutinee's,
      a conjunct's predecessor's narrowing, a member's, a tuple element's -- so one walk reaches the
      top-level test, the subpattern order 93 asked for, the tuple element order 103 asked for, and the
      conjunct order 92 hit while writing its sample. PropertySubpattern now records the member's type,
      which the binder had and dropped. Typed property patterns retain their leading TypeTestPattern;
      the walker visits it and this rule judges it against the original input before member subpatterns.
      The typed-property-pattern-never-matches refusal and admitted derived/unknown tests pin that path.

      CLASSIC'S VERDICTS ARE THE CONTRACT, measured on a 20-shape probe. Classic refuses a relational
      pattern on a type with no comparison operators and a constant of an incomparable type (TC_0051
      and TC_0052, two complaints for one mistake) and narrowing to unknown (TC_0063); it warns on a
      union constituent tested twice (TC_0093) and a non-constituent test (TC_0074). Classic ADMITS an
      impossible type test, a relational bound that is no constant, an impossible subpattern, tuple
      element, negated test and conjunct after narrowing -- and Roslyn then refuses every one of them, so
      each is a Stage 5 error under the policy order 5 records. Classic also admits a test that is always
      true, and that one RUNS: samples/DependentTypes tests `target is FixedBuffer<5>` on a
      FixedBuffer<5> on purpose, so the always-true rule order 90 asked for is NOT built, whatever
      severity -- a warning on a banked sample fails the ledger -- and is the decision recorded below.

      THE RULE. A type test is impossible when neither the input reaches the tested type nor the tested
      type the input, unless one side is an abstract and the other an unsealed class, which a derivation
      may yet implement -- C#'s rule, and classic's silence on `shape is Dog`. An indeterminate input
      admits any test: a type parameter, unknown, an unknown value, an error, a lifted length, a pack
      or a tuple carrying one; a union input is the binder's, which already refuses a non-constituent.
      Narrowing a determinate input to unknown is an error as classic has it. A relational bound must
      be a constant -- a literal, its negation, or an enum variant -- and the input a primitive numeric,
      a char, or a refinement or enum over one; a constant pattern's constant must reach the input or be
      reached by it, an int literal counting against any numeric. An arm is unreachable when an earlier
      unguarded arm is a catch-all, a type test the arm's type is within, or the same literal. That one
      is an ERROR though classic warns: Roslyn refuses the emitted switch (CS8510), so a warning would
      only move the refusal onto generated code, which the corpus measured before the severity was fixed.

      DECISIONS, each recorded rather than assumed. A relational subpattern on an unknown member stays
      admitted, as order 93 asked; an unknown input admits every test, so the rule never reaches it.
      Enum exhaustiveness is order 3's. Tuple exhaustiveness waits on order 12's range reasoning.

      MEASURED: the first sweep reported four findings on working programs -- the always-true rule, and
      a pack-typed tuple scrutinee judged as determinate -- then zero findings and identical stdout on
      AllFeaturesV2 and AllFeatures, and zero on the three unbanked samples standalone. Twelve corpus
      cases, one per refused shape. 28 decision rows pinning the admits, the comparisons the input
      supports, the arms some value reaches, the already-failed inputs, and the reach facts. Twelve
      mutations, each on a confirmed build: the impossible test never reported, the abstract exemption
      dropped and then widened to sealed classes, conjunct narrowing not followed, negation and tuple
      elements not walked, the member type not recorded, every type comparable, the bound not required
      constant, the unreachable arm and the unknown narrowing not reported, every constant fitting.
      Eleven caught on the first pass; the comparability mutation did not compile and a compiling
      variant was caught. Twelve of twelve.

      A CLONE IS NEVER ITS SOURCE (2026-09-20, newtypes Requirement 2.1). The rule above asks whether either
      type reaches the other, and a newtype over a COPYABLE source reaches its source by the copy Requirement
      2.4 admits, so every test between the two was admitted where a mutable source's was already refused.
      MEASURED on v2 before: `position is Point` and `cash is Money` answered false, `money is Cash` and
      `maybePosition is Point` answered false, `position switch { Point p => ... }` reached Roslyn as CS8121,
      and `position as Point` RAN THE COPY and answered a Point -- a silent wrong answer rather than a
      missing refusal. The union pattern the emitter register listed beside them was already refused by the
      binder, that clause having gone stale.

      THE RULE. Containment already had the two readings this needs -- IsWithin, which folds in the copy so
      assignability, overload ranking and a lossless leave all see it, and IsWithinAsItself, which does not.
      A test asks what a value IS, so it asks the second. ConversionRelation.CopiesAClone is the pair only
      the copy relates; PatternAnalyzer refuses it in BOTH directions, before the union bail and on an
      optional's held type so a `Position?` scrutinee is judged too; and `as` classifies by IsWithinAsItself,
      which leaves its refusal at construction, where the classification is what gives the expression its
      type. `age is long` and `age as long` go with them, a type only the copy reaches being no closer than
      the source. Reusing MIST_PA_PATTERN_NEVER_MATCHES is deliberate: the judgement is the one a mutable
      source already got, so the author reads the same sentence whichever kind of source it is.
      MIST_PM_AS_NO_RELATIONSHIP kept its id and lost its opening clause, which claimed no conversion
      related the two and would have been false here.

      UNTOUCHED, each measured: `jaguar is Cat` at the renamed base, `int is long`, `int as long`, and every
      test on an `unknown` -- `boxed is Position` true, `boxed is Point` false -- which is what keeps
      Requirement 5.3's runtime half answering false rather than being refused. AllFeaturesV2 matches the
      baseline with no line moved.

      PROVED BY nine refusal rows and three admit rows in NewtypeConversionDecisionTests, two rows and a
      renamed-base fact in ClonableNewtypeConversionDecisionTests, and two corpus cases. Four mutations, each
      caught by name and by no more than its own rows: CopiesAClone always false fails the seven pattern rows
      and NEITHER `as` row, which is what shows the two halves are held apart; `as` back to IsWithin fails the
      two `as` rows only; the optional judged as its carrier fails the `Position?` row alone; and dropping the
      reverse direction fails `money is Cash` alone. Full suite green, 7440 of 7440.
    tasks:
      - >
        The always-true test is not reported, in any severity: classic is silent, samples/DependentTypes
        does it deliberately, and Roslyn's CS0183 is a warning the driver does not collect. Whether Mist
        wants a warning that the sample would then have to lose is a decision.
      - >
        A list pattern's elements are not judged against the collection's element type.
      - >
        An arm is judged unreachable only against a catch-all, a covering type test, or the same
        literal; relational overlap and exhausted unions are left to order 12's range reasoning.
      - >
        A tuple pattern on a pack-typed scrutinee is not judged at all, as it cannot be until the pack
        is closed.

  - id: operator-and-positional-checks
    name: Operator admissibility, and the positions with one rule each
    order: 9
    subsystem: typechecker
    requires: [assignability-core]
    status: done
    from: >
      orders 9, 78, 79, 81, 83, 107, 123, 128 -- 11 tasks
    evidence: >
      CLASSIC'S VERDICTS ARE THE CONTRACT, measured on a 24-shape probe that had to be split three ways,
      classic's symbol and resolution stages each gating its checker. Classic refuses a comparison,
      equality or arithmetic no operator admits (TC_0003 to 0005), `?.` on a receiver that cannot be
      absent (TC_0111), `??=` as a sub-expression (TC_0047), reassigning a readonly local by `=` or
      `??=` (READONLY_LOCAL_0001, and a garbled TC_0043 for the second), an operator or a member on
      unknown (TC_0066, TC_0065), a static lambda reaching an outer local or an instance field
      (TC_0122), and `?` over a type already holding void (TC_0045); `void?` does not parse, so TC_0046
      is unreachable. Every one is refused by v2 at the same construct. Three of classic's refusals are
      NOT followed, each more permissive and each compiling: `"a" + 1` concatenates, as C# has it and as
      order 5 already types it; a variant of one enum equals another; and `ToString` on unknown reaches
      Standard/Unknown.mist's universal extension, which order 81 asked for. Class equality without a
      declared operator is refused as classic refuses it. `numbers[^1]` stays admitted: order 123's
      task would refuse samples/RangesAndIndices, and was a decision left open here until order 5 recorded
      it on 2026-09-15 -- a from-end index reaches the element through the length, not the parameter.

      ONE HOME FOR WHAT AN OPERATOR ADMITS. OperatorAdmissibility, beside the classifier, gives the type
      a binary operator produces over two operand types or null where none does: numeric promotion as
      C# promotes, string concatenation, a declared operator on either operand's type with projected
      CLR operators included, bool for the logical pair and every equality, and equality for a string,
      a char, a variant of one enum, an anonymous shape, and an intrinsic or projected type against
      itself, whose equality is the CLR's to define. An indeterminate operand admits anything; unknown
      and a union admit nothing. The binder types the expression by it -- comparisons were typed as
      their left operand until order 5, and arithmetic over a class as the class -- and types an
      inadmissible one as the error type, so that nothing downstream complains a second time about a
      mistake the operator rule reports once, against the operands. A misapplied `?.` is typed the same
      way by the same predicate, OptionalUnion.AdmitsConditionalAccess, which admits an optional, an
      indeterminate receiver, and a CLR-projected one, whose nullability is Roslyn's: both unbanked
      interop samples chain through a non-optional CLR value on purpose. A `?` the source applied is
      recorded by the resolver in OptionalApplicationRegistry with the type it was applied to, since
      resolution flattens `(int | void)?` into the same union as `int?` and leaves nothing to judge.

      THE POSITIONS. `??=` is judged at statement position by the set of expression statements it heads;
      any other occurrence is refused. A readonly local as an assignment target is refused whatever the
      operator. A static lambda's own names are its parameters and whatever its body declares -- a
      local, a loop or deconstruction variable, a pattern binding, a nested lambda's parameters -- and
      any other local, `this`, or an instance field or property is a capture, reported at each use.

      MEASURED: the first sweep reported four findings on working programs, equality on an anonymous
      shape and on Type, then two more on the interop samples, `?.` on a CLR value; each was a rule
      admitting less than the language does, fixed at its source. Then zero findings and identical
      stdout on AllFeaturesV2 and AllFeatures, and zero on the three unbanked samples standalone.
      Fifteen corpus cases, one per refused shape. Decision rows pin the admits and the divergences.
      Fourteen mutations, each on a confirmed build, all caught: the operator rule silenced, everything
      admitted, unknown admitted, a union admitted, class equality admitted, declared operators
      ignored, `?.` admitting any receiver, `??=` not judged for position, a readonly local not
      judged, captures not judged, a lambda's own names not collected, a `?` application not
      recorded, an inadmissible operator typed as its left operand, the unknown-member rule silenced.
      Two of those first survived: unknown and a union were refused by the numeric rules anyway, and
      only concatenation admits any operand -- so `u + "x"` and `m + "x"` are the two cases that
      pin the guard.

      LOCAL FUNCTIONS, 2026-09-11 (.kiro/specs/local-functions). A `static` local function is judged as a
      static lambda is, by the same walk over the same own-names, reporting
      MIST_PA_STATIC_LOCAL_FUNCTION_CAPTURE for an outer variable, `this`, an instance field or an instance
      property. Two corpus cases, a local and a field; the lambda rows of the decision tests pin the shape
      and LocalFunctionDecisionTests pins that a static function capturing nothing is admitted.

      A FOREACH ITERATION VARIABLE IS A READONLY LOCAL (2026-09-13), so reassigning one is
      MIST_PA_READONLY_LOCAL_REASSIGNED. MEASURED BEFORE: `foreach(int n in numbers) { n = 5; }` passed
      Mist on BOTH pipelines and failed in Roslyn, "Cannot assign to 'n' because it is a 'foreach iteration
      variable'" -- the rule was C#'s alone. It could stay C#'s only while every loop emitted its variable in
      the foreach header: emitter order 46 now emits a loop whose element converts as a foreach over the
      element with the variable declared from its conversion, an ordinary local, and on that loop the
      reassignment compiled and printed 9. The binder marks the variable readonly, which this rule already
      judges; nothing else reads a local's readonly flag but ref-local emission, which a loop variable never
      reaches. Two corpus cases, a plain loop and a converting one.

      A PROPERTY OR INDEXER USED WHERE ITS ACCESSOR IS MISSING (2026-09-15), the properties spec's
      Requirements 13.1-13.2 and 11.4-11.5. MEASURED FIRST, on both pipelines, over an indexer and a property
      each get-only and set-only: a write, a read, `t[i] = t[i] + 1`, and `??=`. `t[i] += 1` does not parse
      on either, Mist having no compound assignment, so the long form stands in for it. v2 refused none of
      them at the Mist source; every one reached Roslyn as CS0200 or CS0154 against the generated file, and
      so did an overloaded pair whose selected indexer lacked the accessor its sibling had. Classic refuses
      one shape itself, a set-only property read (MIST_TC_0019, reported twice for `s.X = s.X + 1`, the write
      target counted as a read), and refuses `??=` on every property and indexer, read-write included, as a
      garbled MIST_TC_0043. That last is not followed: a read-write `t[i] ??= 5` runs on v2 and prints 5.

      AccessorAnalyzer refuses a read with no getter (MIST_PA_NO_GET_ACCESSOR) and a write with no set or
      init accessor (MIST_PA_NO_SET_ACCESSOR), once each, at an indexer, a property through a receiver, and a
      property by name. A `??=` is both a read and a write. An index is judged as its index selected it and
      never re-selected by accessor, which is C#'s order: select, then refuse. THE DIRECTION IS DERIVED ONCE.
      The runner's walk records each assignment's target and AnalysisContext.DirectionOf answers from it,
      because the model already leaves direction to the surrounding expression -- PropertyReferenceExpression
      says so -- and ReadonlyAnalyzer's private set of write targets was the same derivation made a second
      time; it reads DirectionOf now. A get-only AUTO-property stays assignable in its own type's constructor,
      as C# admits and banked samples rely on. Refused by Roslyn on both pipelines, and refused here: the same
      write from a method, from a lambda or local function inside that constructor, on another instance, on a
      base type's property from a derived constructor, and on a static property from an instance
      constructor. A static one from a static constructor runs and is admitted. An init accessor counts as a
      setter for this rule; the init window is emitter order 60's.

      THE SWEEP FOUND A MODEL DEFECT. AllFeaturesV2 reported MIST_PA_NO_GET_ACCESSOR twice in Variadics, at
      `row.Slot1`: a spread property's per-element projection was synthesized with the aggregate's name, type
      and modifiers but without its accessors or its declaring type, so the model said Slot1 could be neither
      read nor written. Both projection sites -- SpreadProjection per construction and TypeMemberLookup's
      fixed-arity family -- now carry the aggregate's. Then zero findings and identical stdout.

      EMISSION. UnsafeReach declared an indexer's get_Item accessor for every write a clone conversion made
      through an indexer it cannot reach, whether or not the write reads. Over a private set-only indexer that
      is an UnsafeAccessor naming a method that does not exist, compiled because it is never called: measured
      in the emitted file of a probe that printed 10. The getter is declared for `??=` alone, the one write
      that reads.

      PROOF. 22 corpus cases, one refusal each. AccessorDecisionTests pins a read-write indexer and property
      read, written, reassigned from themselves and coalesced; each single-accessor slot used in the direction
      it has; the sibling selected and written; the constructor privilege, instance and static; both
      projection families read; and an init write and an array element left to other rules.
      CloneConversionEmissionTests pins the getter left undeclared. Seventeen mutations, each on a confirmed
      build, all caught by name: each accessor check silenced (index-read-without-a-getter,
      index-written-without-a-setter); the indexer, member-access and by-name arms silenced in turn
      (selected-indexer-without-a-setter, property-written-without-a-setter,
      property-written-by-name-without-a-setter); the constructor privilege removed (every
      AccessorDecisionTests row, its fixture being under analysis in each); lambda and local-function bodies
      privileged, local functions alone left uncollected, and the declaring type, the static match and the
      `this` receiver each dropped from the privilege (the five get-only-auto-property cases, one apiece); a
      `??=` target taken as a write only and as a read only (index-coalesced-without-a-getter,
      index-coalesced-without-a-setter); assignment targets not recorded (property-written-without-a-setter);
      the clone write declaring its getter (AWriteThroughASetOnlyIndexer_DeclaresNoGetter); and each
      projection family dropping its getter (AccessorDecisionTests). The four on order 11's analyzer are
      recorded there. Rebased onto main at e48d8dba on 2026-09-19, which had banked OverloadedIndexers and the
      inherited-indexer candidates meanwhile, and measured again there: AllFeaturesV2 identical with zero
      findings, the full suite through the ledger at 7113 tests with none failing, zero warnings, and format
      clean.

      THE ACCESSOR A USE CALLS, COMPLETED (2026-09-25), the properties spec's Requirements 13.1, 13.2 and
      13.5 in full: the accessor must exist, must be accessible where it is called, and if it is `init` must
      be called in construction. MEASURED FIRST, 38 probes on both pipelines. Every refused shape below
      reached Roslyn on v2, against the generated file: CS8852 for an init-only write outside construction,
      "the set accessor is inaccessible" for a private setter or init accessor used outside its type, "lacks
      the get accessor" for a set-only property in a pattern, and "cannot be assigned to -- it is read only"
      for an initializer entry over a get-only property. Classic refuses only that last one itself
      (MIST_PI_0003) and leaves the rest to Roslyn too. The admitted shapes ran and printed the same on both
      wherever classic can bind them: an object initializer, including one inside a lambda; `this.Size` and a
      bare `Size` in an instance constructor of the type and of a derived one; an init accessor writing
      another init-only property of its own type or a base, by name and through `this`; a struct constructor
      and a struct initializer; `Size ??= 5` in the constructor; a private setter used from its own type, a
      nested type and a factory's initializer; and a public read and a pattern over a private-set property.

      AccessorAnalyzer takes the getter for a read, the setter for a write and both for `??=`, as before at
      an indexer and a property through a receiver or by name, and now also at an OBJECT INITIALIZER ENTRY,
      always a write, and a PROPERTY SUBPATTERN, always a read. Of the accessor it takes: missing is
      MIST_PA_NO_GET_ACCESSOR or MIST_PA_NO_SET_ACCESSOR as before; `private` and used outside its type's
      domain is MIST_PA_INACCESSIBLE_ACCESSOR; and a setter that is `init`, called anywhere but construction,
      is MIST_PA_INIT_ONLY_ASSIGNMENT. Construction is an initializer entry, or `this`, written or implied, in
      an instance constructor or in the body of an init accessor -- of the declaring type or a derivation,
      which `this` already guarantees. Never another instance (`other.Size`, `value.Size`), never a lambda or
      local function inside either body, and never a getter or a set accessor beside the init one, all three
      bodies having the property as their member; AnalysisContext.RootOf tells them apart. The get-only
      auto-property's backing-field privilege is unchanged and stays narrower: its own type's constructor
      only, where C# refuses the same write in an init accessor (CS0200, and MIST_PA_NO_SET_ACCESSOR here,
      measured). An index keeps the indexer it selected: over an int indexer with a private setter beside a
      string one with a public setter, `catalog[0] = 1` is refused and `catalog["a"] = "b"` admitted.

      ONE COMPLAINT PER USE. Whether the MEMBER is accessible stays order 6's question, so nothing more is
      said here about an accessor of a member out of reach: a protected property with a private setter,
      written from an unrelated type, is one MIST_PA_INACCESSIBLE_MEMBER, which is classic's verdict too
      (TC_0171). And an inaccessible setter ends the judgement: a `private init` written after construction
      from outside is one MIST_PA_INACCESSIBLE_ACCESSOR, not an init complaint beside it.

      WHAT THE MODEL GAINED. ObjectInitializerAssignment.Member records what its name resolved to, as
      MemberAccessExpression.Member and PropertySubpattern.Member already did, from the StorageLookup the
      binder was already holding and dropping, and UnsafeReach reads it too (see below). The domain question -- private, protected, internal, a nested type inside its enclosing one --
      moved out of AccessibilityAnalyzer into AccessDomains, so the member rule and the accessor rule ask it
      of one home and cannot disagree about what `private` reaches.

      PROOF. 21 corpus cases under this order, one refusal each: init-only writes after construction, in a
      method, in a set accessor, in a getter beside the init accessor, on another instance from a
      constructor and from an init accessor, and from a lambda or local function in a constructor and a
      lambda in an init accessor; private setters written from outside, by name and through `this` from a
      derived type (one of them over a protected property), coalesced, and at an index; the selected indexer
      whose setter is private; a private init accessor from an initializer, and written after construction;
      initializer entries over a get-only property, a get-only auto-property and a private setter; and a
      set-only property in a pattern. Six more under order 6, recorded there. AccessorDecisionTests' fixtures
      now write init-only properties from constructors and init accessors of their type and of a derived
      one, `??=` included, and a private setter and a private index setter from the type, a lambda in it and
      a nested type -- silences every row proves -- and rows admit initializer entries (one in a lambda, one
      naming a base's init-only property), reads of init-only and private-set properties through a receiver,
      an index and a pattern, and the public string indexer beside the private-set int one. The row that
      pinned an init write as NOT this rule's is gone: it is this rule's now. Sixteen mutations, each on a
      confirmed build and each caught by what was written for it: the initializer entry's init privilege
      dropped (six rows and a corpus case whose initializer then failed); the constructor's and the init
      accessor's (every AccessorDecisionTests row, its fixtures writing through both); any accessor of an
      init property taken for the init accessor (the getter-beside case); the closure exclusion dropped (the
      five lambda and local-function cases, get-only and init-only); the init rule silenced (every init-only
      case); the accessor's accessibility read as the member's (every private-accessor case); an accessor of
      a member out of reach judged again (the protected-property case under order 6); the init rule judged
      past an inaccessible setter (the private init written after construction); an entry taken as a read and
      a subpattern as a write (the entry cases; the pattern case and both pattern rows); the entry and
      subpattern arms dropped in turn; the entry's owner lost (every row, through the fixture factory's `new
      Counter { Count = 40 }`); the index re-selected by accessor (both selected-indexer cases); and the
      binder no longer recording the entry's member (all six initializer cases). The five on order 6's
      analyzer are recorded there. The first run died with its session after fourteen, leaving the fifteenth
      applied: it was reverted by hand, every mutation's text grepped absent, and the last seven rerun from a
      fresh backup, which the restored files matched byte for byte. MEASURED: AllFeaturesV2 byte-identical
      with zero findings; all 86 samples built standalone on v2 with no MIST_PA finding (five libraries
      without a Main stop at the backend's entry-point check, after analysis, as before); the fourteen book
      snippets that declare an init or private-set property, or use an initializer block or a property
      pattern, built clean; the full suite through the ledger at 6702, 706 and 68 tests with none failing
      and no rerun; zero warnings; and format clean.

      THREE GAPS CLOSED BESIDE IT (2026-09-26), each recorded as a task above until then. A CLR ACCESSOR
      CARRIES ITS OWN ACCESSIBILITY: PropertyProjector and IndexerProjector projected every visible accessor
      at the default, which the model reads as the property's own, so a public property's protected setter
      read as public. Measured first on both pipelines with DataTypeAttribute.DisplayFormat (`get; protected
      set;`, found by reflection over the shared framework, as PipeStream.IsConnected and DbColumn's are):
      a write from outside a derivation reached Roslyn as "the set accessor is inaccessible", a read ran.
      Each accessor now takes ClrAccessibilityMap.FromMethod, as constructors, methods and operators
      already did, and the write is MIST_PA_INACCESSIBLE_ACCESSOR at the Mist source; the read still runs,
      and so does a Mist class deriving from DataTypeAttribute that writes DisplayFormat in its constructor.
      Nothing else reads a CLR accessor's accessibility -- UnsafeReach asks only for `private`, which no
      projection yields. `init` ON A STATIC PROPERTY is refused where it is declared,
      MIST_PM_STATIC_INIT_ACCESSOR, beside the abstract and indexer refusals of the same accessor, and is
      then built as a plain setter, so the write in its static constructor that this order refused as
