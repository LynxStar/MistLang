      FOUR RULES OVER THE MODEL, all reporting as one register order. AccessibilityAnalyzer asks the two
      questions of the full-accessibility-model spec: whether a use sits inside the member's domain -- the
      declaring type for private, that type or a derivation for protected, the same assembly for internal,
      a nested type counting as inside its enclosing one -- and whether a declaration exposes a type less
      accessible than itself, with effective accessibility the narrowest along the nesting and, for
      anything structural, the narrowest of what it is built from. Internal and protected are
      incomparable, as C# has them. The abstract bases in a base list are EXEMPT, whatever Requirement
      6.2 of the spec says: C# lets a public class implement an internal interface, samples/Variadics does
