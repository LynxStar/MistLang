  # ===================================================================
  # Layer P -- enums.
  #
  # Mist enums wrap an arbitrary readonly type, not an integral one, so they are
  # nominal wrappers with real instances and are inexpressible as a C# enum.
  # ===================================================================

  - id: enum-declaration-over-readonly-base
    name: Enum declaration over an arbitrary readonly base type
    order: 87
    layer: enums
    requires: [nested-type-declarations, instance-fields]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      The base may be a primitive, a readonly struct, a readonly class or a union, and must be proven
      deeply readonly including every union constituent. Emits as a record carrier with a value
      parameter plus a public static readonly singleton per variant, always public regardless of the
      enum's own accessibility.

      DELIVERED FOR EVERY BASE INCLUDING THE UNION. String, integral and byte-by-default all emit and
      run byte-identical to classic, nested and top-level, measured on a probe covering eight shapes.
      The union arm arrived BY CONSTRUCTION when order 76 landed: EnumEmitter already routed the
      underlying type through TypeNameEmitter, whose union arm spells the carrier, and the probe enum
      over int | string declares, resolves variants and prints identically to classic.

      ONE NOTED DIFFERENCE, not a defect on either side: classic REFUSES assigning an enum value into
      its own underlying union (MIST_TC_0070, enum is not a constituent), where v2 binds it -- the
      enum's implicit conversion to its underlying type reaches the union slot through
      ConversionRelation legitimately, and the emitted C# runs. Whether Mist wants classic's stricter
      rule is an analyzer decision for later; construction has no grounds to refuse it.

      REACHABILITY WAS THE FIRST BLOCKER AND IT WAS STRUCTURAL. EnumType derives DeclaredType, not
      MemberType, so it could not sit in CompilationUnit.Types -- a List of MemberType -- and
      FinalizeRegistration dropped every top-level enum on the floor. That list now holds DeclaredType,
      which is what a file DECLARES rather than what happens to have members, and a new
      DeclaredTypeEmitter routes each kind. Nested enums needed only that routing, having always been
      on their parent's NestedTypes.

      A NEWTYPE AND AN ALIAS ARE NOW VISIBLE AND DELIBERATELY ERASED, where before they were invisible.
      Both name an existing type, so there is nothing of their own to declare -- the same answer
      classic reaches, but reached by a decision recorded in one place rather than by never arriving.
      (Since order 78, an alias USE also expands at resolution -- see optional-union-representation.)

      THE READONLY REQUIREMENT IS NOT ENFORCED, and no sample would notice: EnumReadonlyRestriction
      never attempts a non-readonly base, so the restriction it is named for is untriggered on both
      pipelines. Logged as an analysis-phase task rather than built blind.

      `default` ON AN ENUM REACHES THE DESIGNATED VARIANT, which took one arm in the default-expression
      emitter and was missing at first: the factory was emitted and nothing called it, so
      `default(Direction)` reported the backend sentinel while classic printed the variant. Caught by
      checking a claim this entry had made without measuring it. An enum is defaultable exactly when it
      designates a variant, there being no other way to choose between them -- where a class is
      defaultable when each field has a zero of its own. An enum designating none falls to the sentinel,
      which is what a non-defaultable class does.
    analysis_phase_tasks:
      - >
        Report a base type that is not deeply readonly, including every constituent of a union base.
        Walks a finished model and judges it, so it is an analyzer's; nothing about it stops the enum
        being built or emitted. No sample reaches it on either pipeline.
    unlocks: []

  - id: enum-variant-value-inference
    name: Variant value inference and declaration-time initializer evaluation
    order: 88
    layer: enums
    requires: [enum-declaration-over-readonly-base]
    v2_status: done
    verified_by: sample
    evidence: >
      Two inference rules by base kind -- a string base takes the variant's own name, an integral base
      counts on from the previous variant. A NAME-ONLY enum's base is byte, filling from zero; an
      unannotated enum that writes values takes its base from them (see below). NestedScoping is
      banked in AllFeaturesV2 and byte-identical to classic.

      "DEFAULT BASE IS BYTE" WAS WRONG, and read as a design choice when it contradicted the spec (found
      2026-09-12). Enums Requirement 3.1 gives an unannotated enum the one type its written values share
      and 3.2 the union of their types; only 3.3, the name-only enum, gets byte. v2 gave every
      unannotated enum byte, so `enum Mixed { Num = 1, Text = "x" }`, `enum Dir { North = "N", South = "S" }`
      and `enum Code { Ok = 200, Big = 1000 }` were refused ('string' or 'int' to 'byte') where classic
      prints Text, S and 1000, and `enum Flag { A = 1, B = 2 }` compiled as byte-backed where classic
      emits it over int. EnumTypeBuilder now settles the base in Phase 2 only for an annotation or a
      name-only enum; EnumMemberBinder binds the written values of any other with NO TARGET, since the
      base is what they decide, and takes TypeInterner.GetOrCreateUnionType of their types -- one type
      comes back bare, and the union is flattened, deduplicated and ordered, so `{ "x", 1, 2 }` is
      `int | string`. A value that failed to bind contributes nothing. Enums now bind BEFORE every other
      body in Phase 3: a body's cast choosing between operators asks whether an enum reaches a parameter
      through its base, and with the base still unset `(Fathoms)Code.Ok` over Fathoms(double) and
      Fathoms(string) selected nothing and reached Roslyn.
      MEASURED against classic on 30 probes; outcomes match except where noted. Inferred int
      (`{ 200, 1000 }`, `{ -10, 40 }`), string, double, bool, and `int | string` in either order all print
      as classic does; `{ Ok = 200, Next }` gives 201 and `{ First, Ok = 200 }` gives First = 0 over int,
      as classic does. `byte b = Flag.A` over `{ 1, 2 }` is now MIST_PA_NO_IMPLICIT_CONVERSION, where v2
      printed 1 and classic fails in Roslyn -- a corpus case. `{ 1, 3000000000L }` is `int | long` and
      `{ 1, 4000000000u }` is `int | uint` on both pipelines, so `long l = Size.Huge` is refused on both.
      `{ North = "N", South }` gives South its name, as classic does.
      DIVERGENCES, none introduced by inference -- each holds for the same base written as an annotation.
      An omitted value over a union base (`{ Num = 1, Text = "x", Other }`, `{ Text = "x", Other, Num = 1 }`)
      is MIST_PM_ENUM_VALUE_NOT_INFERABLE, which v2 already reports over `: int | string`, where classic
      counts on from the last integral value it saw (Other = 2) or from zero (Other = 0), read off its
      emitted C#; a corpus case. An omitted value after a char or double is NOT_INFERABLE where classic
      emits `(char)0` and 0, the integral-zero defect above. `enum Alias { First = Base.One }` over an
      int-backed Base is admitted, where classic refuses it as a non-readonly base (MIST_TC_0102); v2
      treats an enum as readonly with or without the annotation. And `int | string u = Mixed.Text` is
      refused on BOTH pipelines, annotated or not, though an enum converts to its own base -- see the
      first analysis_phase_tasks entry below.
      PROVED BY EnumUnderlyingInferenceTests (six one-type rows, three unions, three that take nothing
      from their values, three omitted values over an inferred base, and the operator chosen through an
      inferred base) and two corpus cases. Three mutations on confirmed builds each fail at least one
      test: every unannotated enum byte (thirteen failures, both corpus cases), the first written type
      instead of the union (three), and enums bound after bodies (the operator test -- the only thing
      that sees the order). samples/Enums does NOT cover Requirement 3.1 or 3.2: its sections labelled
      "inferred" and "union" both carry annotations, and no sample or book snippet declares an
      unannotated enum with written values, so nothing banked could shift -- measured, AllFeaturesV2 and
      AllFeatures green.

      EVERY VARIANT LEAVES CONSTRUCTION WITH AN EXPRESSION, which is where this DIVERGES FROM CLASSIC
      and is the more consequential of the two divergences taken here. Classic emits a WRITTEN value by
      re-emitting the syntax and an OMITTED one from a resolved constant on the model, so the two
      halves of one question are answered from two different places and only one of them is in the
      model. v2 binds a written value in Phase 3 the way a field initializer is bound, and SYNTHESIZES
      a literal for an omitted one in the same walk. Emission then has a single path and no backend has
      to know the inference rules or reach back to the syntax. Measured across eight shapes: string
      inferred, explicit and mixed; integral explicit, inferred and mixed; no annotation; and nested.

      COUNTING ON IS RELATIVE TO THE PREVIOUS VARIANT, NOT THE PREVIOUS EXPLICIT ONE, which this
      entry had stated as "previous explicit value plus one". Those differ for three or more
      consecutive omissions and the register's wording would have produced repeats. Mutation-checked:
      resetting the running value makes 401 become 0 and turns an unannotated enum into three aliases
      of zero.

      COUNTING SURVIVES A NEGATIVE VALUE, WHICH IS A THIRD DELIBERATE DIVERGENCE and a LIVE DEFECT IN
      CLASSIC, found by semantic review after this entry was first written done. A negative value
      binds as negation over a literal, not as a literal, so a constant tracker reading only literals
      loses it -- and classic's does: `Freezing = -10, Cold` gives Cold = 0 on classic, measured,
      silently landing on whatever value 0 collides with. v2 folds negation and gives Cold = -9. A
      written value the binder genuinely cannot fold -- a const reference, arithmetic -- REFUSES the
      NEXT omitted variant as MIST_PM_ENUM_VALUE_NOT_COUNTABLE rather than guessing, because a wrong
      guess merges variants the author believes are distinct.

      A SYNTHESIZED VALUE IS RANGE-CHECKED AGAINST THE BASE, same review, same day. The unannotated
      default base is byte, so `A = 255, B` -- or any plain enum past 256 variants -- walked off the
      base by the compiler's OWN arithmetic and died as CS1503 against generated C#, the exact failure
      the emitter's contract promises to prevent. Now MIST_PM_ENUM_VALUE_OUT_OF_RANGE at the variant,
      naming the value it would have taken. WRITTEN values are deliberately not checked: that is
      general initializer type-checking, which belongs to whatever v2 grows for every initializer
      rather than to an enum special case. Recorded as the third analysis-phase task.

      A BASE WITH NO SUCCESSOR REPORTS RATHER THAN GUESSING. A struct or class base has no next
      instance, so a variant omitting its value over one is MIST_PM_ENUM_VALUE_NOT_INFERABLE.
      Reported at construction because it stops the variant getting a value at all. LIVE DEFECT IN
      CLASSIC, measured: it infers an integral zero whatever the base and emits `new Vec2(0)`,
      failing as CS1503 against generated C# with no Mist-level cause. Found by mutation --
      suppressing the string arm crashed the v2 emitter on a null value, which is what showed the
      null was reachable at all. All three diagnostics land on the VARIANT's own node, stashed for
      the purpose; the enum's node is only the fallback for members with no syntax behind them.

      DUPLICATE VALUES ARE NOT DETECTED, and the consequence is now decided rather than latent. Under
      one structural equality notion two variants sharing a value are ALIASES and the first one
      declared names them both, which is what C# enums do with a repeated value -- measured, `Second`
      prints `First`. Classic refuses the program outright with MIST_SB_0085, so its own recorded
      print-versus-match inconsistency turns out UNREACHABLE there; the inconsistency was real only in
      the emitted shape, never in a program classic would compile. Detection is logged below.
    analysis_phase_tasks:
      - >
        An enum does not convert to its own UNION base: `int | string u = Mixed.Text` over
        `Mixed : int | string` is MIST_PA_NO_IMPLICIT_CONVERSION on v2 and MIST_TC_0070 on classic, though
        Requirement 7.1 admits it and an enum to its backing value is lossless. The refusal is measured
        (2026-09-12); the cause is read, not confirmed: ConversionClassifier.Within probes the target union's constituents with the same
        visited set it then uses for the enum's own base, so the base is already marked visited when its
        turn comes. Newly reachable from an unannotated enum, whose base can now be a union.
      - >
        Report two variants sharing an underlying value. Classic's MIST_SB_0085 is the model. Deferred
        rather than built because it judges a finished set of variants and nothing about it stops one
        being built -- and because the emitted behaviour without it is coherent rather than broken,
        aliases naming the first variant. Landing it makes the alias case unreachable, which is what
        makes the equality decision on order 89 permanent rather than provisional.
      - >
        Type-check a WRITTEN variant value against the base. `A = 300` over byte and `A = 5` over a
        string base both bind unremarked and die in Roslyn. Not an enum rule: it is initializer
        type-checking, the same judgement every field initializer wants, so it belongs to that
        machinery when v2 grows it rather than to a per-construct check here. The SYNTHESIZED path is
        already range-checked, that arithmetic being the compiler's own.
    unlocks: [NestedScoping]

  - id: enum-conversion-operators
    name: Enum conversions to and from the underlying type
    order: 89
    layer: enums
    requires: [enum-variant-value-inference, optional-union-representation]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      Enum to underlying is TOTAL and implicit; underlying to enum is PARTIAL and therefore returns an
      optional, lowered to a per-variant equality chain.

      BOTH DIRECTIONS NOW RUN. Reading a variant's underlying value is measured over string, int and
      byte bases. The partial direction became consumable when order 78 landed: a probe casts a
      matching and a non-matching value to an optional enum over int, prints the variant and the
      absence, and coalesces the miss back to a variant -- identical to classic line for line.

      THE UNION-BACKED ENUM'S PARTIAL CAST FAILS ON BOTH PIPELINES, a shared limit rather than a v2
      gap: `(MixedResult?)0` needs the int to become the carrier and the carrier to become the enum,
      and C# will not chain two user-defined conversions. Classic emits the same refusal. Whether the
      cast should lower through an explicit carrier construction is a question for the patterns
      layer, which is where narrowing a union-backed enum becomes reachable at all.

      ONE EQUALITY NOTION, STRUCTURAL, AND THIS DIVERGES FROM CLASSIC DELIBERATELY. Interpolation must
      print the variant name, and classic finds that name by REFERENCE identity while comparing values
      structurally. v2's ToString compares on the value, so printing agrees with comparison by
      construction. THE DIVERGENCE IS CURRENTLY UNOBSERVABLE and was taken anyway: classic refuses
      duplicate values (MIST_SB_0085), so the inconsistency it records cannot arise in a program it
      compiles, and Mist has no `==` on an enum for a user to write -- classic reports MIST_TC_0005 for
      it. The only reader today is interpolation. It is settled now so that order 99's pattern
      lowering, which compares values, agrees with printing without anything having to be reconciled
      afterwards.

      WHAT THE CHOICE COSTS is that v2, which does not yet detect duplicates, treats two variants
      sharing a value as ALIASES naming the first -- coherent, and what C# enums do, where classic
      would have printed two names for one value. See order 88.

      SPECIFIED, AND LOWERED AS THE CALL IT IS (2026-09-12). The partial direction had no spec -- enums
      Requirement 7.3 said only that reverse conversion is not supported -- and v2 typed `(Tier)7` as
      Tier, so `Tier t = (Tier)7;` compiled clean and threw NullReferenceException where classic
      refuses it with MIST_TC_0071; `func<int, Tier> f = v => (Tier)v;` compiled clean the same way. No
      sample could see it, samples/Enums casting only into an optional. The language owner's rule is now
      enums Requirement 15: a cast is sugar for a conversion function, `(E)v` is `E.ExplicitCast(v)`
      taking the underlying type and answering `E?`, and the operand is matched as an argument is. The
      binder types the cast `E | void` (CastExpression carries TargetType beside Type, as AsExpression
      does), analysis order 4 judges the operand against the underlying type, and order 5 refuses the
      unnarrowed result wherever it meets an E -- both lines above are refused now.

      THE UNION-BACKED CAST ABOVE IS NO LONGER A LIMIT. One user-defined conversion per cast is C#'s rule,
      not Mist's, and lowering around it is the emitter's job: EnumEmitter.LookupArgument converts an
      operand that is not already the lookup operator's parameter type in a cast of its own, so a probe's
      `(Mixed)"x"` over `int | string` emits `((Mixed?)(Union_Int32_String)("x"))`. The same lowering carries
      another enum, `(Tier)Other.One` -> `((Tier?)(int)(Other.One))`, and a class declaring `implicit
      operator int`. Measured on v2, each prints the right variant. Classic passes the first two through
      its checks and fails them in Roslyn (Cannot convert type), so none can join samples/Enums, whose
      baseline both pipelines share; EnumCastLoweringTests holds the spellings instead.
    unlocks: []

  # ===================================================================
  # Layer Q -- pattern matching.
  # ===================================================================

  - id: pattern-matching-core
    name: Type patterns with bindings
    order: 90
    layer: patterns
    requires: [unknown-top-type]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      A BINDING IS PART OF THE EXPRESSION, not a statement grafted onto the branch, and that is the
      whole design decision. Pattern.NarrowedType and Pattern.Binding are intrinsic properties of the
      bound pattern, so `u is int i && i > 0` binds and emits as itself -- the case the classic
      pipeline structurally cannot express, since it emits the discriminator as the condition and
      hoists the binding to the top of the then-branch, where the conjunction has already been
      resolved (order 98 records the same fact from the union side).

      SCOPE IS THE GUARDED BLOCK'S, chosen by making that block's scope FIRST and binding the
      condition into it: StatementBinder.BindConditionInto, used by both BindIf and BindWhile. So a
      binding reaches the rest of its own condition and the block it guards, and nothing else -- not
      the else branch, not the statements after, and sibling conditions may reuse a name because each
      owns its own scope. This is the load-bearing claim and it is the half no sample can carry: a
      sample that compiles proves a binding IS reachable somewhere, where the claim is about where it
      stops. Those cases are compile failures, so they live in PatternResolutionTests, MUTATION-CHECKED
      both ways -- binding the condition in the enclosing scope fails exactly the three scope tests,
      suppressing the declaration fails exactly the seven positive ones.

      Type tests resolve through the full type-ref path (ScopeResolver.Resolve), so a constructed
      generic (`u is Box<int> bx`) narrows with its type argument intact, and `u is Nonexistent n`
      reports UnresolvedType once and binds an ErrorExpression rather than parking a sentinel that
      emission would report a second time. Emission writes an inline C# pattern; BodyEmitter's
      precedence helper now ranks a type test with C#'s relational operators, which is what keeps
      `!(a is Dog)` from emitting as C# for `(!a) is Dog`.

      OPTIONAL SCRUTINEES CAME FREE and are exercised: `int? is int present` and `Box? is Box b` both
      narrow, and absence fails the test, because an optional bypasses the union carrier for Nullable
      or the bare type. A non-optional union does NOT -- its carrier stands in no relation to its
      constituents, so a C# type test against one answers false for everything. That is reported as
      MIST_BE_UNSUPPORTED_UNION_PATTERN at emission rather than emitted as C# Roslyn would reject; the
      tag test that replaces it is order 98's.

      NOT banked as a sample: UnknownType needs order 82 (unknown-covariant-generic-widening) as well,
      which is untouched. Its three narrowing sites would compile today.
    analysis_phase_tasks:
      - >
        Report a type test that can never succeed -- a pattern type with no conversion relation to the
        scrutinee's static type. Construction binds it happily and emission writes valid C#, so
        nothing is wrong with either; the judgement is about a finished model. Order 98 carries the
        union-specific half of the same rule.
      - >
        Report a test that is always true, where the scrutinee's static type is already within the
        pattern's. Roslyn's own CS0183 covers the emitted form, but Roslyn WARNINGS are not collected
        (CSharpCompilationDriver reads Errors only), so nothing surfaces it today.
    unlocks: [UnknownType]

  - id: constant-and-relational-patterns
    name: Constant and relational patterns
    order: 91
    layer: patterns
    requires: [pattern-matching-core]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      ONE MODEL KIND CARRIES BOTH. ComparisonPattern holds a ComparisonKind and a bound expression, and
      a constant pattern is the Equal case rather than a kind of its own -- `42` and `< 42` differ only
      in the operator, and emission spells Equal by writing no operator at all. Future consumers get one
      kind to switch over instead of two: order 97's bool coverage rule reads Kind == Equal.

      All five constant forms bind (int, float, string, char, bool) and all four relational operators
      carry their own kind, each pinned in PatternResolutionTests. The two literal node hierarchies now
      share their parsing rather than duplicating it: ConstantLiteralNode is a separate hierarchy from
      PrimaryNode, so LiteralBinder's five entry points were changed to take a lexeme instead of a node,
      which is what lets the suffix and quote handling have one home.

      A COMPARISON NARROWS NOTHING, deliberately: a value test says nothing about which type holds the
      value. The one case where it could -- picking a constituent out of a union -- is order 98's, and
      the emitter's union guard from order 90 already refuses that scrutinee. An optional scrutinee needs
      nothing special; `int?` compares directly in C#.

      REGEX CONSTANTS ARE NOT HERE. The grammar admits one in constant-pattern position, and it is the
      one ConstantLiteral alternative that answers null and parks the `is`, because a regex test is not a
      C# pattern at all -- classic lowers it to a Regex.IsMatch call. It belongs with the rest of the
      regex layer rather than being half-built here.

      RECLASSIFIED, and the original wording is the reason to say so: this record used to read
      "relational constants MUST be comparability-checked against the scrutinee's static type", which is
      a rule that walks a finished pattern and judges it. Applying the file's own test -- is the model or
      the emission wrong without it? -- the answer is no, so it moved to analysis_phase_tasks alongside
      order 90's impossible-type-test rule, which is the same rule for a different pattern kind.
    analysis_phase_tasks:
      - >
        Report a relational pattern whose bound is not comparable to the scrutinee's static type, and a
        constant pattern whose constant is not. Both bind coherently and emit as written; Roslyn then
        rejects the C#, which puts the error on a generated file rather than on Mist source. That is a
        message-quality argument, not a representability one.
      - >
        Report a relational bound that is not a compile-time constant. The grammar admits a full
        expression there (`constant:VoidCoalescing`), so `n is < f()` binds and emits; C# requires a
        constant and rejects it downstream.
    unlocks: []

  - id: logical-patterns
    name: and, or and not patterns
    order: 92
    layer: patterns
    requires: [constant-and-relational-patterns]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      THE REPETITION-LIST TRAP IS AVOIDED AND THE PROOF NEEDS THREE OPERANDS. The generated Right slot
      holds the LAST repeated operand and that operand is ALSO in the array, so a fold reading Left and
      Right drops everything between them -- and passes every two-operand test, which is why the classic
      emitter's EmitOrPattern still loses the `b` of `a or b or c`. PatternBinder.Flatten is the single
      home for that hazard, used by both folds, and the two three-operand tests fail exactly when it is
      mutated to the classic shape.

      A CONJUNCTION NARROWS AS IT GOES: each operand binds against what its predecessors proved, not
      against the original scrutinee, so `a is Dog and var d` types d as Dog. This was found by running
      the emitted C# rather than by reading: C# narrows a conjunction's input the same way, and since
      emission hands it the pattern verbatim, answering the wider type would have put the model at odds
      with the C# it produced. Mutation-checked.

      A DISJUNCTION DECLINES TO NARROW to the union of its operands, even though a match proves exactly
      that. Interning that union would be a side effect with an observable cost -- the emitter discovers
      carrier structs by reading the interner, so writing a pattern would add a struct to __Unions.g.cs
      for a type the program never names. With no binding permitted under `or` there is nothing to type,
      so nothing is lost. The test asserts the interner stays empty AND that a union spelled in source
      does reach it, so the assertion is not vacuous.

      BINDINGS ARE REFUSED UNDER `or` AND `not`, reported as MIST_PM_PATTERN_BINDING_NOT_ESTABLISHED, and
      this one IS construction's rather than an analyzer's: matching a disjunction proves only that SOME
      operand did, and matching a negation proves its operand did not, so there is no value for the name
      to hold. Left alone the model would declare a local in the guarded block's scope while emission
      wrote no C# pattern to produce it, and a branch reading the name would emit C# naming a variable
      that does not exist. Permission travels down the walk as a flag, so the ban reaches through
      grouping and through a nesting conjunction. A refused binding does not stop the pattern being
      built, so a use site adds an unresolved-name error behind the first -- a cascade, recorded rather
      than defended.

      GROUPING IS NOT MODELLED. A parenthesized pattern binds to whatever it wraps and emission
      re-derives the parentheses from precedence, as the expression side does since order 90. Mist and C#
      rank these identically, so the mapping is 1:1: `(1 or 2) and > 1` re-parenthesizes and
      `1 or 2 and > 1` does not, and the two disagree on 1, which the sample run checks by output rather
      than by inspecting the C#.
    analysis_phase_tasks:
      - >
        Report a conjunct that cannot match what its predecessors narrowed to -- `a is Dog and not Cat`
        binds and emits, and Roslyn then rejects it, because progressive narrowing makes Cat unreachable
        inside Dog. Reachable today and hit while writing the sample for this order, which is the
        clearest evidence yet for order 90's impossible-type-test task; they are one rule.
    unlocks: []

  - id: property-patterns
    name: Property patterns with subpattern member resolution
    order: 93
    layer: patterns
    requires: [pattern-matching-core, property-declarations-and-accessors]
    v2_status: partial
    verified_by: v2-semantics
    evidence: >
      A subpattern name is a MEMBER, and it resolves through MemberResolution.ResolveStorage -- the same
      lookup `new T { X = ... }` uses, extracted so a property pattern and an initializer block cannot
      disagree about what X is. The member's type then becomes the SUBPATTERN's scrutinee, so
      `{ Name: { Length: > 2 } }` narrows twice without PatternBinder counting depth, and generic
      substitution survives the hand-off: `item` on a `Box<int>` answers Int32, not T.

      THE PRIMITIVE CASE WORKS, and for one reason worth naming: `s is { Length: > 3 }` resolves only
      because Standard.String is a ClassType that declares Length (Bootstrap/String.mist). An array does
      NOT -- Array.mist makes Length a dependent type PARAMETER, so the name answers a TypeResult rather
      than storage -- and a span is worse, declaring both a parameter and a property and so resolving
      AMBIGUOUSLY. Both are the pre-existing ConstructedType gap that program-model-body-tasks.yaml
      records under members, not something this order introduced or should paper over.

      MULTIPLE BINDERS COME FROM THE SUBPATTERNS. `{ Age: int years, Name: var who }` yields two, each on
      its own subpattern, and PropertyPattern.Binding is null. That is half of what this order was to
      test about Pattern.Binding being singular per node, and the half that held. The OTHER half could
      not be tested at all: see the grammar note below.

      SCOPE IS INHERITED, NOT REBUILT. Each subpattern's binder is declared into whatever scope the
      caller put in effect, so orders 90 and 95 already decided where it reaches -- the rest of its own
      condition and the guarded block, or the arm's guard and result, and nothing else. Tested here for
      the property-pattern path specifically, because "readable in its own condition" is the case classic
      cannot express and a nested binder is a new way to reach it. `bindingsPermitted` reaches subpatterns
      too, so a binder inside a property pattern under `or` or `not` is refused with
      MIST_PM_PATTERN_BINDING_NOT_ESTABLISHED -- mutation-checked by threading `true` instead, which fails
      exactly the two tests that claim it.

      TWO GRAMMAR SLOTS ARE SPELLED AND UNREACHABLE, which is why this is `partial` rather than `done`,
      and neither is a binder gap:

      - The leading `Type` in `Type { ... }` cannot parse. BareTypePattern sits above PropertyPattern in
        PrimaryPattern's ordered choice and claims the identifier first, so `a is Dog { }` leaves the
        brace unconsumed and fails as MIST_PARSE_INCOMPLETE at the enclosing member. Fixing it is a
        grammar reorder -- safe in PEG terms, since the alternative resets on a missing LEFT_BRACE -- and
        it then owes the typed form a type test, which means deciding whether it reuses TypeTestPattern's
        constituent resolution for a union scrutinee.

      - The trailing `name` in `{ ... } p` cannot parse either, and this one is a GENERATOR gap rather
        than an ordering one: Storm emits no parse code for an optional GROUP. `_ParsePrimaryPattern`
        declares `Token? _Name = null` under the comment "Optional complex expression" and consumes
        nothing, so the slot is structurally always null. The non-optional form works -- TypePattern's
        `name:(IDENTIFIER | DISCARD)` parses -- so the cheap fix is to split the alternative in two, the
        named one first, exactly as ObjectCreationExpression and ObjectCreationExpressionNoArgs are
        already split for the same reason.

      Both slots are REFUSED rather than ignored: BindPropertyPattern parks the pattern when either is
      filled, so whichever fix lands surfaces as an unsupported form instead of silently dropping a type
      test or a binder that source did spell.

      THREE WAYS A SUBPATTERN NAME FAILS, on the two channels order 90 established. Resolving to nothing
      or ambiguously is MemberResolution's own MIST_PM_UNRESOLVED_MEMBER, and the pattern narrows to
      ErrorType so BindIs answers ErrorExpression through the check it already makes. Resolving to a
      method, a nested type or an enum member is new: MIST_PM_PATTERN_SUBPATTERN_NOT_STORAGE, the sibling
      of InitializerTargetNotAssignable worded for matching rather than assignment. And a scrutinee with
      no members to speak of -- unknown, or a type that already failed -- parks the whole `is` as
      UnresolvedExpression, because MemberResolution suppresses its report there and an ErrorExpression
      with nothing reported is the one outcome the two channels forbid. `u is { }` still binds, having
      nothing to look up, and means non-null as it does in C#.

      AN OPTIONAL SCRUTINEE IS PROJECTED. Members are looked up on OptionalLifting.NonVoidPortion, since
      a property pattern only matches a value that is present -- `maybe is { Length: > 3 }` on a
      `string?` resolves and narrows to String. Without it a union would be asked for members it declares
      none of and every such pattern would report a member that is really there. A NON-optional union is
      left alone: it reaches EmitUnionNarrowing's existing UnsupportedUnionPattern guard, which is
      correct until the typed form can name a constituent.

      NOT BANKED, AND EMISSION IS THEREFORE NOT REGRESSION-LOCKED. PatternMatching and SwitchExpressions
      both require this order but bottom out at order 125 (list-and-slice-patterns), so no sample can
      carry it and none was invented for it. Emission was verified by hand instead, end to end on the
      experimental pipeline over eight forms in one program -- `{ }`, two binders, a nested property
      pattern, a primitive scrutinee, `or` and `and not` between property patterns, switch arms with a
      `when` guard, and type-test subpatterns -- all producing correct output and C# that matches the
      source shape. What is missing is a test that would notice if that stopped being true; the sample at
      order 125 is where it comes from.
      
      AN UNKNOWN SCRUTINEE NOW ANSWERS EVERY MEMBER NAME, with unknown, where it used to park the whole
      `is` as UnresolvedExpression. Nothing is known about the shape, so the member can be called neither
      present nor missing, and the pattern asking for it is the only thing that could have said -- which
      is what matching an anonymous type held as unknown IS, and the last blocker on samples/AnonymousTypes.
      A scrutinee that already FAILED keeps parking, and for the reason unknown no longer does: the mistake
      was reported where the type failed, and answering the member would launder that into a pattern that
      looks resolved.
      
      C# CANNOT PROPERTY-MATCH AN OBJECT EITHER, its member names being resolved at compile time against a
      type that by then has none, so the emission is a lowering rather than a spelling: a null test that
      BINDS the scrutinee, plus one test per member beside it reading that binding through `dynamic`. Every
      subpattern shape survives, because deferring the read defers the whole subpattern to the runtime
      binder -- the constant, type-test, relational and nested-property forms all work, and the last three
      are forms CLASSIC EMITS BROKEN C# FOR. Measured on a probe of twelve forms: classic fails three of
      them with MIST_CS_ERROR against its own generated file.
      
      THE TESTS GO IN THE CONDITION, not ahead of the branch where classic puts them, and this is the
      better shape rather than merely a different one. One evaluation of the scrutinee either way, and the
      binding then reaches the REST OF THE CONDITION as well as the branch -- so `box is { X: var x } && ...`
      can read x, which a statement hoisted into the branch cannot offer. It also needs no new channel: the
      existing `hoisted` list already joins tests onto the condition with `&&`, which is why no statement
      channel was built.
      
      A MISSING MEMBER THROWS rather than failing the match, exactly as on classic, and nothing here checks
      the shape because there is no shape to check against. Recorded as the sample's first `untested` entry
      before this work and still true after it.
      
      `or` AND `not` ARE REFUSED, with MIST_BE_UNSUPPORTED_UNKNOWN_PROPERTY_PATTERN: the member reads go
      through a binding of the scrutinee and neither combinator establishes one -- the same wall
      UnsupportedEnumPattern meets. Classic emits broken C# for these instead. Untested below Tier 6, for
      this order's existing reason: no harness asserts on a v2 emission refusal, and its two siblings have
      none either.
    tasks:
      - >
        Move the PropertyPattern alternative above BareTypePattern in PrimaryPattern, so `Dog { ... }`
        parses, then give the leading type name a type test. It is a QualifiedIdentifier rather than a
        TypeReference, so it bypasses ScopeResolver.ResolveNamed and must expand aliases itself -- the
        same trap ExpressionBinder.BindNamedCreation documents for `new` -- and a generic type name stays
        out of reach either way.
      - >
        Split the alternative in two so the trailing binding parses, the named form first. The optional
        GROUP is what Storm cannot generate; the non-optional form generates fine. Emission then has to
        spell `{ ... } p`, and PropertyPattern.Binding stops being unconditionally null -- which is what
        finally tests the claim that a pattern's own binder and its subpatterns' binders are separate
        slots.
    analysis_phase_tasks:
      - >
        DECIDE WHETHER A RELATIONAL SUBPATTERN ON AN UNKNOWN MEMBER STAYS ADMITTED. Classic refuses
        `box is { X: > 3 }` with MIST_TC_0052, unknown supporting no comparison operators; v2 admits it and
        it RUNS, the dynamic binder doing the comparison against whatever X turns out to hold. So v2 is the
        more permissive of the two and there is no classic runtime behaviour to be held to. Admitting it is
        consistent with the rest of the lowering -- a wrong-typed member throws exactly as a missing one
        does -- but it is a choice, and this is where it is recorded rather than assumed.
      - >
        EXTEND order 90's impossible-type-test rule to reach SUBPATTERNS, and NOT to a member whose type
        is unknown -- where any type test is possible, so a rule written for declared members would refuse
        the anonymous-type case this order exists to admit. `p is { Name: int i }` on a
        string Name binds and emits, and Roslyn then rejects it -- measured, as MIST_CS_ERROR on the
        generated file, so it is loud but reported against C# the user did not write. The rule is order
        90's; what this order adds is that the type it must compare against is the MEMBER's, not the
        scrutinee's, which a walk written only for top-level tests would miss.
    unlocks: []

  - id: discard-and-var-patterns
    name: Discard and var patterns
    order: 94
    layer: patterns
    requires: [pattern-matching-core]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      All three catch-all forms bind to ONE model kind, CatchAllPattern, which is what "classified as
      such" means here: `var x`, `var _` and a bare `_` are the same pattern differing only in whether
      a binding survives, so a later consumer cannot accidentally treat one of them as a test.
      PatternResolutionTests asserts the kind for all three and the binding for each.

      A FOURTH FORM IS NOT ONE. The grammar spells the discard in the same slot as a name
      (`name:(IDENTIFIER | DISCARD)`), so `int _` arrives as a TYPE pattern carrying a discard token,
      not as a discard pattern -- reading it the other way would drop the type test. PatternBinder
      separates the two readings on the token's kind, and a test pins that `int _` still narrows to
      Int32 while keeping nothing.

      A var pattern narrows to the scrutinee's STATIC type, not to whatever the value turns out to be:
      on an `unknown` scrutinee `is var v` leaves v unknown, so it is honestly still un-narrowed.
      Emission spells a discard as `var _`, which is valid C# in every position a bare `_` is not.

      The "binds the scrutinee for use in the ARM body" half arrived with order 95: an arm's catch-all
      binds in that arm's own scope, reaching its guard and result and nothing else. RESIDUE, recorded not
      owned: classifying an unguarded catch-all as COVERING, which is what makes the distinction matter,
      is order 97's consumer and no consumer exists yet.
    unlocks: []

  - id: switch-expressions
    name: Switch expressions with arm result-type unification
    order: 95
    layer: patterns
    requires: [logical-patterns, discard-and-var-patterns]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      THE SECOND PATTERN ENTRY POINT IS OPEN. `switch { }` reached BindPostfixSuffix's `default:` until
      now, which is what made every item under the body register's switch_expression section untestable.
      The scrutinee is whatever the postfix fold accumulated to the left, so it arrives already bound.

      EACH ARM OWNS A SCOPE, built before its pattern binds into it -- the same ordering order 90 gave a
      guarded branch, and for the same reason. So an arm's bindings reach that arm's GUARD and its result
      and nothing else: not a sibling arm, not a sibling's guard, not the expression around the switch,
      and two arms may reuse a name because neither is declaring into shared ground. Five tests fail
      exactly when the per-arm scope is removed.

      RESULT TYPE: a target type is an answer, so when one is in effect the arms are not asked to supply
      one and are left to Roslyn to check -- assignability is not construction's here as it is not
      anywhere else. With no target the arms must AGREE, by interned identity, following the precedent
      LiteralBinder.CommonElementType set for array literals: there is no conversion or numeric promotion
      infrastructure to compute a best common type, so disagreement reports rather than guesses. An arm
      whose result failed to bind is SKIPPED rather than compared, because pairing it with a sound arm
      would report that same failure a second time as a disagreement between them; mutation-checked.

      ARM ORDER IS KEPT and recorded as load-bearing on the model, since the first arm whose pattern
      matches and whose guard holds wins. An empty arm list is reported: the grammar admits
      `x switch { }` and an expression must have a type, which there is no arm to take one from.

      Emission writes one line, matching how array literals emit rather than introducing a second
      multi-line-expression style. Exercised in every position that matters -- initializer, argument,
      interpolation hole, a target-typed local, and an arm result that is itself a switch expression.
    tasks:
      - >
        A member read off a parenthesized switch expression binds against the scrutinee's type. Measured
        2026-09-14: `int x = 1; int n = (x switch { 1 => "five", _ => "six" }).Length;` is
        MIST_PM_UNRESOLVED_MEMBER "'Int32' has no member named 'Length'" beside a NO_IMPLICIT_CONVERSION on
        v2, and prints 4 on classic.
    analysis_phase_tasks:
      - >
        Report an arm whose result type cannot convert to the target type. Construction accepts it on the
        target's word and emission hands Roslyn a C# switch expression, which rejects it -- the same
        deferral every other assignability question gets.
      - >
        Report an unreachable arm -- one whose pattern is subsumed by an earlier arm's. Order is already
        modelled, so the information is there; nothing judges it.
    unlocks: []

  - id: when-guards
    name: when guards on switch arms
    order: 96
    layer: patterns
    requires: [switch-expressions]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      A guard binds inside its arm's own scope, after the pattern, which is what lets it read the
      pattern's bindings -- and the ban on reading a SIBLING arm's bindings holds for guards too, tested
      separately from the result case since a guard is bound on a different path. The target type is
      pushed away for it: a guard is a condition, and the type the switch as a whole is expected to
      produce is the one thing a guard is not.

      The grammar bounds a guard to VoidCoalescing rather than a full Expression so the arm's `=>` is
      never swallowed by a lambda inside the guard, so binding goes through
      OperatorBinder.BindVoidCoalescing rather than the expression entry point. A guard is recorded only
      where one is written; the arm carries null otherwise, which is the shape a coverage rule will read.

      RESIDUE, recorded not owned: "guarded arms must NEVER count toward exhaustiveness coverage" is
      order 97's, and there is no coverage rule yet to be wrong about it. What this order owes that rule
      is the ability to tell a guarded arm from an unguarded one, and SwitchArm.Guard is it.
    unlocks: []

  - id: exhaustiveness-checking
    name: Exhaustiveness checking per scrutinee kind
    order: 97
    layer: patterns
    requires: [switch-expressions, union-types-and-carriers]
    v2_status: done
    evidence: >
      RECLASSIFIED WHOLESALE: this order has no capability content, and the entry is kept only so the
      order numbering stays contiguous and SwitchExpressions keeps a `requires` id that resolves.
      NO `verified_by`, deliberately -- that field records how a done claim is satisfied, and there is
      nothing here to satisfy it. `done` says construction and emission owe this order nothing, which is
      what the status measures.

      Applying this file's own test: exhaustiveness checking takes a FINISHED switch expression --
      scrutinee type, arm patterns, guard flags -- and answers whether the arms are collectively total.
      It makes no program representable that was not, emits no C# that differs, and lets no program run
      that could not run before. That is the shape the header describes as analysis-phase, and building it
      as a capability would repeat orders 69 and 70 exactly: a checker that made nothing new
      representable or emittable, which was reverted.

      THE OTHER REGISTER ALREADY SAID SO. program-model-body-tasks.yaml lists "switch exhaustiveness
      (ExhaustivenessChecker)" under out_of_scope and its patterns section header reads "exhaustiveness
      is a CHECK (out_of_scope)". The two files disagreed until now; this entry is the one that was wrong.

      THE HONEST COST, recorded rather than hidden: classic DOES enforce this and v2 does not, so unlike
      the rest of the patterns layer v2 is behind here. A non-exhaustive switch compiles clean and throws
      SwitchExpressionException at runtime -- measured, not assumed. Roslyn's own CS8509 does not cover
      for it either, because CSharpCompilationDriver collects Roslyn diagnostics of severity Error only.
      Loud at runtime rather than silently wrong, and no sample reaches it: SwitchExpressions is not
      banked, and its own `untested` list records that the no-match path stays unexercised when it is.

      WHAT ACTUALLY BLOCKS IT is not the rule but the absence of a v2 analyzer contract.
      ExperimentalPipeline.RunAnalyzers exists and is wired -- it runs even when Stage 4 reported errors,
      so binding and analysis both have their say before a user is asked to act -- but its body is a TODO
      with three discards. Writing this rule means being v2's FIRST analyzer and therefore designing what
      an analyzer is, how it registers, how EnabledAnalyzerIds selects it, and how it tolerates the
      ErrorType and unresolved sentinels that stage's own comment warns it will see. That contract wants
      designing deliberately with several rules in view, not reverse-engineering from one.

      Orders 94 and 96 already built what the rule will need: SwitchArm.Guard distinguishes a guarded arm
      from an unguarded one, and CatchAllPattern classifies all three catch-all forms as one kind, so
      "unguarded catch-all" is one property and one type test rather than a syntax walk. Classic reaches
      the same answers through TryGetSinglePrimaryPattern over raw PatternNodes, which is also why its
      checker cannot be ported under the clean-room rule.
    analysis_phase_tasks:
      - >
        Implement unguarded-catch-all, bool true-and-false, and union-constituent coverage. These are
        classic's three real rules and the three worth keeping.
      - >
        Decide deliberately what a TUPLE scrutinee gets. Classic returns exhaustive UNCONDITIONALLY for
