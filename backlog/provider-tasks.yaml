      - [x] name
      - [x] namespace
      - [x] origin (Ambient)
      - [x] static (abstract + sealed in CLR) -> Mist static modifier
      - [x] sealed -> sentinel attribute [Sealed] (no Mist concept)
      - [x] abstract -> sentinel attribute [Abstract] (C# interfaces are Mist abstract types; C# abstract classes need sentinel)
