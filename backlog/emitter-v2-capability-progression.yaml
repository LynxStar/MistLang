  - id: func-structural-function-types
    name: Structural function types
    order: 104
    layer: functions
    requires: [type-parameters-and-constructed-types]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      NOT A CONSTRUCTION OF Standard.Func, though that is what it emits as, and the reason is a
      dependency this entry's own `requires` already implies. Func is declared
      `Func<params TArgs, TResult>` -- one variadic type rather than an overload family -- so resolving
      that declaration needs TYPE PACKS, which are orders 149-153 and all missing. Requiring only order
      51 is therefore only satisfiable by a structural type: FunctionType is interned by its parameters
      and result, exactly as TupleType is by its elements, and the CLR family becomes an EMISSION
      concern. Had the model gone through Func, this layer would have been unreachable until order 153.

      THE RESULT IS THE LAST TYPE ARGUMENT, which is what lets one syntax serve every arity --
      `func<bool>` takes nothing and returns a bool, so the grammar needs no separate niladic form. The
      split is made once, at resolution, so nothing downstream re-derives which slot the result is in.
      Mutation-checked by reading the result off the FRONT instead: exactly the five tests that assert
      the ordering fail.

      EMISSION PICKS Action FOR A VOID RESULT and Func otherwise, which is the CLR drawing a distinction
      Mist does not -- void is an ordinary unit type here, so `func<int, void>` and `func<int, bool>`
      differ only in their result while Action<int> and Func<int, bool> are unrelated families. Neither
      family spells its no-argument case with an empty argument list, so arity does the rest.

      INVOCATION OF A FUNCTION-TYPED VALUE is part of this order rather than the next: the type is what
      says a call is possible and what it produces. BindInvocation previously answered a call on any
      non-method-group with the RECEIVER's own type, which its own comment recorded as wrong for a
      delegate; a function type now answers with its result, and an argument count that does not match
      is refused. Chained invocation falls out -- `curried(3)(4)` needs nothing beyond the result of the
      first call being a function type too.

      One interner key serves tuples and functions, both being an ordered list of type identities. They
      key separate dictionaries, so `func<int, int>` and `(int, int)` never collide despite keying
      equal, and a test pins that.
    unlocks: []

  - id: lambda-expressions
    name: Lambda expressions with parameter and return inference
    order: 105
    layer: functions
    requires: [func-structural-function-types]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      Both bodies, and the two are different C# forms rather than one form spelled two ways, so the
      model keeps separate slots and exactly one is set.

      THE TARGET SAYS WHAT IT CAN AND INFERENCE SUPPLIES THE REST, which splits cleanly by position. A
      PARAMETER is typed by its annotation or by the target's parameter at that position, and by
      nothing else -- a parameter's type is what the body is read AGAINST, so inferring it from the body
      would be circular, and an untyped parameter with no target is refused rather than guessed.
      Mutation-checked: dropping the target's contribution fails exactly the three tests that assert an
      inferred parameter. A RESULT is the target's where there is one, and otherwise the body's -- for a
      block body, read back off its `return` statements, which is why the block is bound before the type
      is known. A body that returns nothing is void; returns that disagree are refused for the same
      reason a switch's arms would be.

      LAMBDA IS AN EXPRESSION ALTERNATIVE, not something reached through the precedence chain, so the
      binder dispatches ahead of the assignment unwrap. That ordering is the grammar's: a lambda binds
      looser than everything, so `x => a = b` is a lambda whose body assigns.

      RETURNS ARE COLLECTED WITHOUT DESCENDING A NESTED LAMBDA, whose returns answer to it instead. That
      is the only reason the walk cannot simply visit every statement.

      PARAMETERS ARE EMITTED WITH THEIR TYPES even where source left them implicit, so C# never infers
      its own from the target and reaches a different answer. It costs nothing -- C# accepts an explicit
      list wherever it accepts an implicit one.

      AN ASYNC LAMBDA IS PARKED, not reported: the modifier changes what the body's type MEANS, so
      binding it as a synchronous lambda would answer confidently with the wrong result. It belongs to
      the async layer, orders 169-175.

      A CLR DELEGATE AS TARGET, 2026-09-11. `System.Predicate<int> pred = x => x < 10` refused to infer
      `x`, the binder asking only whether the target IS a function type. It now reads the target through
      DelegateShape, so a CLR delegate's Invoke shape types the parameters as a func would. Verified by
      the delegate-system-delegate snippet.
