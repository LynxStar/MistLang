          sighting is a match rather than a re-derivation.

          IT IS THE ONE ENTRY HERE WITH A STATED BUDGET, which makes it the cheapest probe of the
          load theory: the test allows 2 seconds of wall clock for lex+parse over the AllFeatures
          corpus while 5000 other tests run beside it. If the shared-resource theory above is right
          this test should fail MORE often than the others under load and for a reason visible in
          its own message -- the elapsed milliseconds -- which no other entry offers. The next
          sighting should capture that number: an elapsed just over 2000 says load, and a wild one
          says the same shared stall the other symptoms point at.

          Machine was under sustained load from repeated full builds and suite runs, the same
          confound as above.
      - date: 2026-09-08
        detail: >
          NAME NOT CAPTURED, and recorded anyway so the procedural miss is visible rather than
          repeated. 1 failure of 5145 in a full-solution run, 0 of 5145 on an immediate rerun with
          the same binaries and no edit. The run was filtered to "Passed!|Failed!" as it happened,
          which prints the COUNT and not the name, and the count is all that survives.

          THIS IS THE FIFTH SUCH SIGHTING and the reason the fields above keep asking for a name.
          The fix is procedural, not diagnostic: a full-suite run must capture the whole output to a
          file and read the "[FAIL]" lines out of it afterwards, because narrowing the grep at the
