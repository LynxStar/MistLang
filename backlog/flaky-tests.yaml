      - date: 2026-09-08
        detail: >
          THE REPRODUCTION THAT NAMES THE CAUSE. 462 failures of 5145 under `dotnet test Mist.slnx`,
          0 of 5145 on an immediate rerun with no edit, and 0 again once the runner was changed to
