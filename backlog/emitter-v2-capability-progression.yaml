  - id: dependent-const-witness-encoding
    name: Const witness encoding for dependent arguments
    order: 146
    layer: refinement-and-dependent
    requires: [dependent-type-parameters]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      DELIVERED. A dependent parameter becomes a C# type parameter constrained to a per-domain
      witness interface, each distinct value becomes a readonly struct implementing it, and a read
      of the parameter as a VALUE becomes a static member access on that parameter. One generated
      file, __DependentValues.g.cs, top-level so a construction in any namespace can name it.

      THE DOMAIN COMES FROM THE SLOT, NEVER FROM THE VALUE, and this was the defect that took the
      longest to see. Every integral literal lifts as int, so a 999 filling a `long` parameter is a
      LiftedType over Int32 -- name its carrier from that and you emit Const_Int_999 : IConstInt
      into a slot whose constraint says IConstLong, which Roslyn rejects. Both the collection site
      and the emission site read the parameter's declared Domain instead, which is the whole reason
      order 145 had to land first.

      THE CARRIER SET IS DELIBERATELY LARGER THAN THE REACHABLE ONE: every declared domain crossed
      with every value the program mentions, filtered by kind and by range. Collecting only what is
      used means walking every expression, because a constructed type holds its arguments but a
      method call site holds its own -- and the two costs are wildly asymmetric. A spare carrier is
      an unreferenced struct in a file nobody reads; a missing one is MIST_CS_ERROR against
      generated code, which is the failure shape this register calls its worst.

      HEX ALWAYS FOR CHARS, diverging from the spec deliberately: its readable form names 'x' and
      'X' both Const_Char_X, and two values sharing a carrier are two types silently becoming one.

      NOT COVERED: the spec's [DependentType] reflection attribute, and the implicit static
      property that makes FixedBuffer<5>.Size readable from outside the type. No sample exercises
      either, and both are additive.
      C# has no analogue, so the encoding is invented -- a dependent parameter becomes a type
      parameter constrained to a per-domain witness interface, each distinct value becomes a
      const struct deduplicated program-wide, and body uses become a static member read.
    unlocks: [DependentTypeRefinementConstraints, DependentTypes]

  - id: adhoc-refinement-where-clauses
    name: Value predicates in where clauses
    order: 147
    layer: refinement-and-dependent
    requires: [refinement-implication-engine, dependent-const-witness-encoding]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      The SYNTAX binds and emits, with the predicate ERASED, which is all a where clause needs to be
      representable and emittable: Properties declares `public int this[int index] where index >= 0 and
      < 3` and is banked, its indexer emitting as a plain C# indexer over the same body. Nothing was
      built for this entry.

      RECLASSIFIED FROM `missing`, AND THE MISREADING IS THE SAME ONE ORDER 69 RECORDS AT LENGTH. Every
      obligation the original evidence described -- discharge at a use site, implication between two
      predicates, predicate contravariance in override compatibility -- is a JUDGEMENT ON A FINISHED
      MODEL, not something that stops one being built or emitted. That is what `v2_status` does not
      measure and what `analysis_phase_tasks` is for. Recording it `missing` also put a banked sample
      over a missing capability, which is the invariant break that surfaced it.

      THE REQUIRES EDGES STAY AS THEY ARE. Erasing a predicate needs neither the implication engine nor
      witness encoding, but the capability is not finished until the obligations are discharged, and
      those are what it depends on. So the dependencies describe the whole capability while the status
      describes the part that is delivered -- which is what `partial` meant.

      DONE ON 2026-09-11, by analysis order 12: a use site, a call, a construction, a chain and an
      index are judged against the clause; implication is decided by interval subset; a strengthening
      implementation is refused; and every position the clause is admitted in reaches the model, the
      constructor position from this day, since ConstructorBuilder had never resolved its constraints.
      The clause is the parameter's TYPE, an anonymous RefinedType, rather than a field beside it.
    analysis_phase_tasks:
      - >
        DISCHARGE a predicate at a use site: `arr[i] where i >= 0 and < 3` must refuse an `i` not known
        to satisfy it. Decidable by evaluation where the value is known.
      - >
        Decide IMPLICATION between two predicates, for forwarding to a base or weakening in an
        override. Not decidable by evaluation, and predicate contravariance participates in override
        compatibility, which C# has no equivalent for -- so nothing downstream will catch a violation
