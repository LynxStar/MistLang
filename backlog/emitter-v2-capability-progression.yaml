  recommended_response: >
    DELIVERED, and kept because the pattern it argued for is the one to reuse. All three items
    landed: refined types and dependent value parameters are refused at Mist source (orders 141 and
    145, see silent_emission_failures.resolved) and the CLR out-direction shipped in order 128.
    silent_emission_failures.remaining is 0 and stays 0 -- re-measured 2026-09-06, ZERO Roslyn
    errors across all 29 unbanked samples, down from 491.

    NEXT, in the order the evidence supports:

    1. DONE -- order 129 shipped and Testing went 16 -> 0. Its two neighbours are unmoved and their
       remaining errors are the well-behaved kind, reported at a .mist line: CSharpInteropV2 1
       (UseNpgsql, order 131), DelegateFuncConversion 17 (collection initializers). Testing is still
       NOT bankable; see green_but_unbankable.

       ONE PREDICTION IN THIS ENTRY WAS WRONG and it is worth keeping. Order 129 was called "a
       manifest-to-csproj emission rather than a semantic gap", and the csproj half turned out to be
       the half that changed nothing -- v2 never builds that file. What was actually missing was the
       reference set reaching Roslyn. Reading a symptom in generated C# as evidence about which
       artifact is at fault is the same trap silent_emission_failures warns about for measurement.
    2. NOT LAMBDA PARAMETER INFERENCE. This entry read MIST_PM_LAMBDA_PARAMETER_NO_TYPE across five
       samples as one capability worth taking next. It is not a capability at all -- it is a symptom
       of two, and lambda inference itself already works. Investigated at order 129; do not re-derive.

       WHAT THE DIAGNOSTIC ACTUALLY MEANS is that LambdaBinder found no IFunctionType on the target
       (LambdaBinder.cs:35), and only the structural `func<...>` spelling produces one. Probed: with
       a `func<int, int>` target both a local annotation and a method parameter infer correctly. The
       failing sites divide cleanly, and neither half is reachable from here:

         Standard.Func / Action as the target -- DefiniteAssignment, OptionalDefaultability,
         Variadics, and half of FirstClassFunctions. Array's constructor takes Func<int, TValue>, so
         `new Array<Point, 2>(i => new Point())` is this case too rather than a construction case.
         FunctionType's own doc records the split as deliberate: Func is declared
         `Func<params TArgs, TResult>`, resolving it needs type packs, and those are orders 149-151.
         The arity evidence confirms packs are absent rather than partial -- only Func<,> and
         Action<> resolve at all, which is exactly what treating the pack as one ordinary type
         parameter would give; Func<>, Func<,,>, Action, Predicate<> and Comparison<> all report
         MIST_PM_UNRESOLVED_TYPE.

         A CLR DELEGATE as the target -- DelegateFuncConversion's `numbers.FindAll(x => x > 0)` and
         FirstClassFunctions' `items.ForEach(...)`. That is order 109, already recorded `missing`
         with a task on it, and already recorded as unreachable until clr-assembly-type-projection.

       OptionalDefaultability is therefore NOT a cheap bank. Its single error is the Array
       constructor, which is the type-pack case, so it sits behind a five-capability layer.
    3. DONE -- AssemblyTypeProvider is banked, 47th on AllFeaturesV2. It was the cheapest green on
       the board and cost only the two orchestrator edits plus eight appended baseline lines.

    The measurement discipline matters more than the order: count diagnostics from the whole build
    output, not per source file, or `<ambient>`-scoped refusals vanish -- which is how Testing came
    to be recorded green while emitting 228 of them.
