  - id: type-alias-declarations
    name: Transparent type alias declarations
    order: 84
    layer: aliases
    requires: [type-parameters-and-constructed-types]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      An alias introduces no nominal identity, and the model can prove it where output cannot --
      an alias-typed local's type IS the interned underlying type (TypeAliasResolutionTests
      asserts Same, and a two-candidate overload resolves through the alias spelling). Expansion
      stays where order 78 put it, at resolution, and CHAINS now bottom out there regardless of
      declaration order: ExpandAlias completes an unbuilt alias on demand through
      ScopeResolver.AliasCompleter, wired to TypeAliasBuilder.Build, which is idempotent and
      keeps a building-set so re-entering an alias mid-build IS the cycle test. The invariant
      that erased the classic pipeline's ~30 scattered lazy unwraps: AliasedType is never
      another alias -- a chain flattens at construction and a cycle resolves to ErrorType.

      Cycles report MIST_PM_CYCLIC_TYPE_ALIAS once, at the declaration where the build
      re-entered itself. DIVERGENCE from classic, deliberate: classic reports its MIST_SB_0060
      plus a cascade of MIST_SB_0062 unresolved-target errors for the same cycle (measured on
      /tmp/cycle: 5 diagnostics for two cycles where v2 reports 2), and classic's name-only
      ThreadStatic stack would confuse arity-overloaded aliases sharing a name where v2's set
      is keyed by identity.

      CONSTRUCTIBLE aliases close the last gap the classic emitter plugged with name-scan
      fallbacks: the `new` grammar names its type as a qualified identifier, bypassing
      ResolveNamed, so ExpressionBinder.BindNamedCreation expands an alias itself -- through
      the same ExpandAlias, substituting call-site type arguments for generic aliases -- and
      constructor selection then runs against the real target. No emitter fallback exists or
      is needed; the expansion is in the model before emission ever looks.

      AN ALIAS IN EXPRESSION POSITION, 2026-09-11. `Task.Yield()` reported that `Task` had no such
      member: MemberResolution looked on the alias rather than on `Task<void>`, and TypeNameEmitter spelled
      an alias by its bare name, so even a resolved call would have named a type C# does not have. Both
      now look through the alias to what it names. No banked sample calls a static through an alias;
      verified by the yield-points snippet, which the spec's intrinsic `Task.Yield` is written for.
    analysis_phase_tasks:
      - >
        Report a duplicate alias name in the same scope at the declaration (classic
        MIST_SB_0061, arity-aware). Both aliases register and construction proceeds; use
        sites see an AmbiguousResult, so nothing stops building.
      - >
        Report `sealed` on a type alias (classic MIST_TC_0179) and an alias exposing a less
        accessible target (classic folds aliases into MIST_TC_0173). Modifiers are parsed and
        stored; judging them is an analyzer's.
    unlocks: []

  - id: generic-type-aliases
    name: Generic aliases and aliases over unions
    order: 85
    layer: aliases
    requires: [type-alias-declarations]
    v2_status: done
    verified_by: sample
    evidence: >
      Almost all of this arrived with order 78's slice: TypeAliasBuilder resolves union and
      refined targets through the interner, and ExpandAlias substitutes call-site type
      arguments by ordinal, so Box<int> and GenericBox<int> are the SAME interned construction
      (TypeAliasResolutionTests asserts Same) and a generic chain (Outer<T> = Inner<T> =
      GenericBox<T>) expands through the order-84 completer. What this order added is the
      constructible half -- new IntBox(42) and new Box<int>(7) select GenericBox's constructor
      with the substitution applied. The starting error list was measured before writing
      anything: the sample failed on exactly its four construction sites and nothing else.
      TypeAliases is banked in AllFeaturesV2, byte-identical to classic.

      RESIDUES, recorded not owned: the stdlib's Action (`type Action<params TArgs> =
      Func<TArgs..., void>`) registers as fixed arity-1 `Action<>`, so `Action<T>` expands
      correctly by coincidence while bare `Action` (arity 0) and `Action<T1, T2>` (arity 2+)
      fail lookup -- pack folding at alias use sites belongs to the variadics layer, and no
      banked sample uses Func or Action at a use site. ExpandAlias substitutes only through
      constructions and unions (TypeSubstitution's arms), so a parameter reachable solely
      through a tuple or refinement survives unsubstituted, as before. THE REFINEMENT HALF IS
      CLOSED (2026-09-16): Apply descends into a RefinedType's base, and a generic refinement
      alias expands through this same path -- the analysis register's order 5 holds what was
      measured and what the prover then owes.
    unlocks: [TypeAliases]

  - id: newtype-declarations
    name: Newtype declarations over a representation type
    order: 86
    layer: aliases
    requires: [type-alias-declarations]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      DISTINCTNESS COSTS NOTHING AND IS PROVEN, not assumed. ConversionRelation.IsWithin has
      no newtype arm, so a newtype relates to nothing but itself by FQN identity -- where
      classic needs a ReferenceEquals guard ordered before its identity checks and a second
      copy in IsDirectlyAssignable. The proof is NewtypeResolutionTests: IsWithin refuses all
      four mixings (both directions, both cross-newtype directions), and a TWO-candidate
      overload -- one candidate would skip applicability and hide transparency -- rejects a
      newtype argument for source-typed parameters while selecting a newtype-typed one.
      MUTATION-CHECKED: an arm making a newtype within its source fails exactly those two
      tests; deleting the member-forwarding arm fails exactly the three forwarding tests.

      The model carries the wrapper's whole surface. Member lookup forwards by walking
      SourceType as a pseudo-base in TypeMemberLookup.EnqueueBases -- depth-based visibility
      then hides the source's private members for free. The synthesized Value accessor is a
      real Field on the Newtype, present only for intrinsic sources (an intrinsic declares no
      Mist members to forward). Construction forwards through
      ExpressionBinder.ConstructionTarget, so new Position(3, 7) selects Point's constructor
      while the expression keeps the newtype's type. Casts need no binder arm at all: the
      bound CastExpression emits as a plain C# cast, and the emitted wrapper's explicit
      operators carry it.

      EMISSION SPLITS BY SOURCE KIND (NewtypeEmitter). An intrinsic source emits a readonly
      struct wrapping a Value field with explicit conversion operators both ways -- string
      included, so a newtype-over-class can emit as a C# struct. A user-defined source emits
      a full member duplicate under the newtype's name, constructors renamed via
      ConstructorEmitter's name override; accessibility follows the declaration where classic
      hardcodes public. Cast operators are NOT duplicated -- they name their declaring type
      structurally, so a copy could not compile. LIVE DEFECT in classic, reproduced
      deliberately and unreachably: neither pipeline puts conversion operators on a
      struct/class-sourced duplicate, so casting one to its source emits C# that cannot
      compile; no sample casts a non-intrinsic newtype. Newtypes is banked in AllFeaturesV2,
      byte-identical to classic.

      Untested beyond the sample and model tests: a newtype over another newtype (source
      resolves to the Newtype object; no chain semantics defined), over a constructed generic
      (constructor selection would miss the substitution context), and cross-assembly use of
      an internal-by-default newtype.

      THE RENAMED CLONE (2026-09-13), the newtypes spec having been revised the same day to the language
      owner's model and this being its task 13. A newtype over a non-generic, non-intrinsic class or
      struct declared in Mist is no longer a Newtype forwarding lookup to its source. NewtypeCloner, between
      registration and the first resolved signature, replaces the placeholder with a ClassType or
      StructType built from the source's own declaration under a CloneScope, which answers the source's
      name with the clone and the source's nested types by simple name. Base, abstract bases, members and
      bodies all come from binding: `type Jaguar = new Tiger` is a Cat and an IStriped, `jaguar.Twin()` is
      a Jaguar, and the emitter writes `class Jaguar : Cat, IStriped` with Tiger's bodies renamed. A with
      block or extension declared for Tiger elsewhere does not reach it, and nothing makes it a Tiger.
      A CLONE REBINDS ITS SOURCE'S SYNTAX, so building, binding and Stage 5 run over clones after the
      program with diagnostics withheld (DiagnosticBag.Withhold, CloneDiagnostics): one the source already
      reports at that place is dropped, and an error only the renaming causes -- a Tiger body passing `this`
      to Admit(Tiger) -- is MIST_PM_NEWTYPE_CLONE_INVALID at the newtype, naming the member. Stage 5 runs
      once over the program without clones and once per clone, so every rule reads AnalysisContext.Types
      and Bodies instead of walking the model.
      MEASURED on v2. A Jaguar assigned to Cat and to IStriped: was CAST_REQUIRED twice, now runs. A Tiger
      with a Stage 5 mistake of its own and a clone-only one: the first reported once, the second at the
      newtype; before, the first twice and the second against Tiger's line. Newtypes byte-identical to its
      baseline. The cast between a class or struct newtype and its source, a Roslyn failure on both
      pipelines, is now CAST_HAS_NO_CONVERSION at the Mist source until spec tasks 15 and 17.
      NOT YET CLONED, keeping the forwarding placeholder: an intrinsic source (task 14), a generic newtype or
      a generic source, and a source named through an alias.
      PROVED BY NewtypeCloneTests -- kinds, containment in the bases and never the source, a renamed member
      and body, a nested type not cloned, a with block not carried, the withheld report -- and the corpus
      case binding/newtype-clone-passes-itself-as-its-source. Four mutations on confirmed builds each fail
      at least one: renaming off, duplicates kept, nested types unreachable, clones analysed with the
      program. NewtypeResolutionTests' private-member case now expects the MIST_PA_INACCESSIBLE_MEMBER a
      plain class gives, the member being the clone's own. Full suite green, 5938 of 5938.

      THE COPY CONVERSIONS OF A COPYABLE SOURCE (2026-09-13, spec task 15), for the cloned kinds above
      whose source is a struct or a readonly class. NewtypeConversions synthesizes two bodiless cast
      operators on the clone, marked CopiesClone: implicit to the source, explicit from it. The explicit
      one is selected and lowered as any declared operator, so `(Coord)position` passes through Point and
      `(Position)reading` through a declared implicit. The implicit one is lossless: ConversionRelation's
      LeavesClone reads the clone as within whatever its source is within, which is what lets a declared
      implicit to Position still reach Point and ranks Take(Point) above Take(unknown) for a Position.
      CloneCopyEmitter writes both as a copy into a new target: every instance field and auto-property
      backing field, flattened for a struct and along the Mist base chain for a class, each reached through
      UnsafeAccessor because both types keep their state private -- prototyped first against readonly
      struct fields, readonly class fields and a base class's private field -- and a class allocated
      uninitialized so the source's constructor does not run twice.
      MEASURED on v2, a struct and a readonly class with a private field, an auto-property and a base
      class's private field: `(Position)point`, `Point back = pos`, `(Coord)pos`, `(Cash)money` and
      `Money again = cash` were all refused, and now print every field's value; `Sink.Take(pos)` picks
      Take(Point); a boxed Position is `is Position` and not `is Point`, and a Cash is not a Money.
      PROVED BY NewtypeConversionDecisionTests (eight admits, four refusals including both directions of a
      mutable class, the called conversion, the ranking) and CloneCopyEmissionTests (the private field,
      the backing field, the base class's field, the uninitialized allocation), plus corpus cases
      assignability-core/struct-newtype-from-its-source and
      total-conversion-classification/mutable-class-newtype-from-its-source. Four mutations on confirmed
      builds each fail at least one: nothing synthesized, the out-conversion not lossless, base fields not
      copied, mutable classes treated as copyable. Full suite green, 5954 of 5954.

      THE INTRINSIC CLONE (2026-09-13, spec task 14). A newtype over a readonly intrinsic Standard type --
      the numerics, Boolean, Char, String, Regex -- is cloned like any other: NewtypeCloner reaches a
      keyword source through the resolver, and `type Age = new int` is Int32's declaration renamed, an
      intrinsic StructType carrying the synthesized Value and the copy conversions above. So `age + age`
      is an Age, Int32's Mist-bodied IsEven binds against Age, `int raw = age` and `(Meters)feet` hold.
      IntrinsicCloneEmitter supplies the contract, since a clone is no longer the backend's type to skip:
      the wrapper holds Value and forwards every intrinsic method, operator, property, indexer,
      constructor and cast to the source's spelling on it, unwrapping an argument of the newtype and
      wrapping a result, prints its value, and emits Boolean's short-circuiting operators as the bitwise
      ones beside true and false, which is the only way C# lets a type take part in them.
      A NEWTYPE OVER AN UNSUPPORTED KIND is now MIST_PM_NEWTYPE_SOURCE_NOT_SUPPORTED at the Mist source --
      `new int[]`, an enum, `new List<string>`, an intrinsic that is not readonly -- where each failed in
      Roslyn. A generic or alias source still keeps the forwarding placeholder.
      MEASURED on v2: `age + (Age)1` prints 31 and IsEven False; `int raw = age`, `long wide = age` and
      `age > (Age)5` print; `$"{label}"` prints hello, and Length, the indexer and ToUpper forward; a
      regex clone matches; a boxed Age is `is Age` and not `is int`. Before, `age + age` was
      OPERATOR_NOT_APPLICABLE and the conversions refused. `type Pattern = new regex` is
      MIST_PM_NEWTYPE_CLONE_INVALID -- Regex declares a member named Pattern, which the renaming collides
      with -- and that refusal is correct. Newtypes byte-identical to its baseline.
      THREE CORPUS CASES MOVED WITH THE MODEL, each by a spec: `Meters m = feet` is CAST_REQUIRED rather
      than NO_IMPLICIT_CONVERSION (cast-operators 7.8); `(Meters)feet` is admitted (newtypes 2.5), so its
      refusal case is deleted; and `new Meters[3]` stamps, a clone of double being a struct of one
      primitive field (definite-assignment 3.1), so that case now holds a class-sourced newtype.
      PROVED BY IntrinsicCloneTests and IntrinsicCloneEmissionTests over a model built with the real
      Standard sources -- ProgramModelProbe's shells have no declaration to clone, and the intrinsic cases
      NewtypeResolutionTests carried were passing only because its shells kept the retired placeholder,
      so they moved, with the new expectations -- plus the corpus case binding/newtype-over-an-enum.
      Four mutations each fail at least one: intrinsics not cloned, results not wrapped, arguments not
      unwrapped, short-circuit symbols kept. Full suite 5966 of 5967, the one failure the parse timing
      flake recorded under property-tests-fail-together-under-full-suite, green on rerun.
      NOT YET DONE at the time: the book's newtype chapter and its snippets' emitted C# still described the old
      model. See the book paragraph below.

      A LITERAL ENTERS A NEWTYPE WHERE THE SLOT'S TYPE IS IN SIGHT (2026-09-13, spec task 16). The binder
      calls NewtypeLiterals.Admit with the bound value at exactly the slots Requirement 9.2 names -- a typed
      local, a simple assignment, an object initializer entry, a field or property initializer, a default
      block entry, a getter's expression, a return outside a lambda -- and at each element of an array
      literal standing in one; a literal the source accepts becomes the cast it stands for. Admitting at the
      slot rather than inside the literal binder is what keeps a literal nested in the value, a call
      argument and a lambda's result refused without a rule of their own. The spec named a parameter's
      default value as a slot; Mist's grammar has none, so 9.2 now names the default block entry instead.
      MEASURED on v2: a typed local, an assignment, `-5`, `[40, 41]` into Age[], a field, a property, a
      default block, a return, a getter and `Meters m = 2` all print their values; `Take(30)`, `30 + 1`
      and `() => 30` are CAST_REQUIRED and `Small s = 300` NO_IMPLICIT_CONVERSION. `a += 1` does not parse,
      so compound assignment is unreachable. FOUND ON THE WAY: `((Age)-5)` failed Roslyn -- C# reads a cast
      of a signed operand as a subtraction unless the type is a keyword -- which a written `(Age)-5` met
      too; BodyEmitter now parenthesizes a signed operand.
      PROVED BY NewtypeLiteralDecisionTests (seven admits, five refusals, the recorded cast, the negative
