      binders and the domain resolver, since within one compilation a simple name finds nothing out of reach.
      A row names the outermost blocked level in the message, and one counts the findings at a name reached
      twice, because the corpus cannot see a duplicate: Diagnostic is a record, so one expectation claims two
      identical findings. THIRTY-ONE MUTATIONS, each on a confirmed build. Twenty-nine caught by what was
      written for them: each recording site left out in turn (the named-type lookup failing thirty-five
      cases; the variadic probe, a nested generic's segment, a type nested off a type, the enum variant and
      the attribute their own; the bare name, the namespace-qualified one and the domain the cross-compilation
      rows alone), the clone skip removed (the clone row), the owner read as the outermost type (the
      nested-in-nested row), the assembly lost (every exposure case and the internal rows), the namings left
