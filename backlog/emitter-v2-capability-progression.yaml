    unlocks: [RefinementTypes]

  - id: dependent-type-parameters
    name: Values as type arguments
    order: 145
    layer: refinement-and-dependent
    requires: [type-parameters-and-constructed-types]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      DELIVERED WITH ORDER 146, which had to ship in the same change: 145's model half alone
      changes nothing observable, because the refusal is at emission and only the witness encoding
      lifts it. Domain is now populated -- the field this entry recorded as never filled -- and
