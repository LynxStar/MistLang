      over. MEASURED on v2, each through a value still typed by the predicate: a getter computed from a
      mutable field printed 11 after `low.Grow()`; `type NonEmpty = List<int> { Count: > 0 }` printed 0
      after `full.Clear()`; an abstract's `Size { get; }` printed 11 after its implementer grew; and the
      same through a `readonly abstract`. Classic declares all four. THE REASON FIRST WRITTEN HERE FOR THE
      LAST WAS WRONG, and Arthur corrected it: a readonly contract IS met member by member, by members that
      write nothing, on a type that need not be readonly (readonly-contexts Requirement 13.6;
      samples/ReadonlyContexts section 15 is that shape). What it does not promise is that what a member
      READS stays put: over that sample's Document, `readable.GetLength()` is 12, then 7 after
