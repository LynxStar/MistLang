      - [x] declaration (name, position)
      - [x] constraints:
        - [x] struct constraint
        - [x] class constraint
        - [x] new() constraint
        - [x] base type constraint
        - [x] interface constraint
    base_type:
      - [x] resolve direct base
      - [x] recursive resolution (base's base must also resolve)
      - [x] closed generics (e.g., base is List<int>)
      - [ ] hide type if base unresolvableonl
    interfaces:
      - [x] resolve all implemented interfaces
      - [x] recursive (interface inheritance)
      - [x] closed generics (e.g., implements IComparable<int>)
      - [ ] hide type if any interface unresolvable
    constructors:
      - [x] parameters:
        - [x] type
        - [x] name
        - [x] attributes (CLR custom attributes and calling conventions)
      - [x] visibility (public, protected)
      - [x] attributes
    methods:
