    threshold: standard-library-binding
    requires: [class-declaration, methods-static-and-instance, statements-core,
               namespace-file-scoped, standard-library-binding]
    untested:
      - args is declared and never read, so array-of-string need only be a resolvable
        parameter type.
      - Only one argument type ever reaches Console.WriteLine, so first-match resolution
        looks correct. If the unknown-typed overload were preferred over the string one the
        output would be byte-identical.
      - The declared namespace is never referenced from inside the file, so namespace
        registration is unverified by this sample alone.

  - name: Primitives
    intro_order: 17
    threshold: arrays-sized-index-length
    requires: [class-declaration, methods-static-and-instance, statements-core,
               namespace-file-scoped, standard-library-binding, literals-primitive,
               string-interpolation, var-type-inference,
               operators-arithmetic-comparison-logical, control-flow-basic,
               arrays-sized-index-length]
    untested:
      - Every non-int primitive flows only into string interpolation. No arithmetic,
        comparison or argument passing of uint, long, ulong, short, ushort, byte, sbyte,
        float, double, decimal or char. A wrong inferred or widened type is invisible as
        long as the digits match.
      - The narrow-type declarations emit as bare C# literals, and Roslyn's own
        constant-conversion rule makes them compile whether or not Mist modelled the
        conversion. The bootstrap declares no conversion INTO byte or sbyte at all.
      - The escaped string local is never printed, so escape decoding need only round-trip
        through emitted source rather than be interpreted.
      - score is a constant, so two of the three grade branches are dead.
      - The DigitSum negative guard never executes; the only call passes a positive value.
      - Console.WriteLine at arity zero is never selected anywhere.

