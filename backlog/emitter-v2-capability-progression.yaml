  # ===================================================================
  # Layer AB -- variadics.
  # ===================================================================

  - id: type-pack-declarations
    name: Type pack declarations
    order: 149
    layer: variadics
    requires: [type-parameters-and-constructed-types, dependent-type-parameters]
    v2_status: done
    evidence: >
      Packs on classes, structs, abstract types and methods, in a keyword form and in
      bracketed open and fixed-size forms, with the pack arity readable as a compile-time
      value in expression position.

      THE ARITY HALF NEEDED NO RULE OF ITS OWN, which is the keystone paying out again. A pack in
      expression position IS the comptime Type[] it ranges over, so member access on it resolves
      against its DOMAIN as a value rather than against the parameter as a type -- and `TArgs.Length`
      is then the ordinary array length, with iteration and indexing arriving on the same footing
      rather than each needing a case. Six errors in Variadics, closed by moving one receiver.

      THE DEPENDENCY ON ORDER 145 WAS REAL AND UNRECORDED, which is the same defect order 109
      carries against 126. A pack is not a new kind of entity: design.md's keystone is that
      `params TArgs` is sugar for the dependent type parameter `Type[]:TArgs`, its domain being
      a comptime `Type[]` "in exactly the same sense that `N:int` is", and a constructed variadic
      type is identified by (family, the `Type[]` value) -- FixedBuffer<5> against FixedBuffer<6>,
      lifted from int values to Type[] values. The array literal of type literals that fills the
      slot is already delivered, at orders 12 and 118.

      SO THE WHOLE THING HANGS ON TypeParameter.Domain, which order 145's own evidence records as
      never populated. Building packs ahead of 145 would mean writing comptime-value type identity
      once for Type[] and again for the integral domains, then removing the first -- the
      architecture reimport this rewrite exists to avoid. Recorded before it was built rather than
      after, which is the only reason it cost nothing.

      DELIVERED SO FAR: the declaration half. Both spellings reach the model, a lone explicit pack
      is unbracketed by inverse sugar, a fixed-size domain keeps its arity, and two bracket-free
      packs are refused as MIST_VAR_0001. That part is genuinely pack-specific -- it is the one
      thing not inherited from dependent parameters -- so it stands whichever order the rest lands
      in. Binding, spread and expression-position arity all wait on 145.
    unlocks: []

  - id: pack-binding-and-inference
    name: Pack binding rule and inference
    order: 150
    layer: variadics
    requires: [type-pack-declarations]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      Leading and trailing fixed parameters bind inward from the ends and the pack absorbs
      the middle. Packs are inferred from a call's argument list or supplied explicitly in
      brackets, and several independent packs in one signature must be disambiguated.

      THE TYPE-ARGUMENT HALF IS DELIVERED. A bound pack is a comptime Type[] -- a TypePackValue
      interned exactly as a lifted integer is -- so Func<[int, string], void> gets its identity from
      the value in its slot, and order and length both count without either being stated anywhere.
      Func at every arity now resolves, Action included, and so does the empty pack.

      THE MATCHING ARITY IS NOT PRIVILEGED, which was the subtle part. A family is registered under
      its SLOT count, so Func<,> is the only Func there is; binding therefore has to apply to
      `Func<int, int>` exactly as it does to `Func<int, int, int>`, or the two-argument case would
      quietly bind a bare type into a slot that holds a list -- resolving, emitting, and being
      wrong. That case passed before this work for that reason.

      MIST_VAR_0005 WAS DEAD, THEN REACHABLE, and the fix was a bound rather than an index. A use
      site finds a variadic family by trying the slot counts its arguments could fill, which made
      the diagnostic unreachable by construction: the probe accepted a declaration only when
      slots <= args + 1, while the diagnostic fires only when args < slots - 1. Disjoint. The
      descriptor was written, found to be dead, and removed rather than shipped -- then restored
      once the probe was widened to the WIDEST VARIADIC FAMILY THE PROGRAM DECLARES. Derived, not
      chosen: a fixed ceiling is too small for some program and too large for every other, and the
      stem index this entry called for turned out to be unnecessary.

      THE VALUE SIDE IS DELIVERED TOO. `params TArgs args` gives args the tuple the pack expands to,
      overload resolution filters by a FLOOR rather than an exact count, and inference binds the
      pack from whatever the fixed parameters at each end do not claim. Which is the one inference a
      positional walk cannot do: past the pack, the slot and the argument stop sharing an index.

      THE SAME GAP EXISTED IN THREE PLACES, found one at a time. A type reference, an alias
      expansion and a `new` each built the arity name and looked it up themselves, so a variadic
      family was reachable from whichever had been fixed last -- `new Bundle<int, string, bool>`
      still failed after field declarations worked. They now share one entry point, which is what
      the second and third occurrences argued for.

      BRACKETED CONSTRUCTION AND SEVERAL PACKS ARE DELIVERED, and neither needed the stem lookup
      this entry predicted. Brackets supply a pack DIRECTLY, so the argument count already matches
      the slot count -- `Describe<[int, string, bool]>` is one argument against one slot, and
      `TwoPacks<[int, int], [string]>` is two against two. Nothing has to work out where one pack
      ends and the next begins, which is exactly why the bracketed form exists.

      A BRACKETED ARGUMENT IS ADOPTED, NOT WRAPPED. Binding it like a flat one would nest a pack
      inside a pack, making Foo<[int, string]> a different type from Foo<int, string> -- while
      resolving and emitting perfectly well -- when being the same type is the whole point of the
      form. Requirement 4.4 asserted directly.

      ORDER 150 IS COMPLETE.
    unlocks: []

  - id: pack-spread-positions
    name: Pack spread in type and value positions
    order: 151
    layer: variadics
    requires: [pack-binding-and-inference, func-structural-function-types]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      Spread into a type argument list, into a base-type list, inside a type alias including
      with void as the result, and as a value at a call site. Requires PROVABLE-spread
      checking -- spreading into a fixed-arity target must be rejected unless the pack's
      shape is proven for every instantiation, not just the observed one.

      THE TYPE-ARGUMENT-LIST CASE IS DELIVERED, including inside an alias and with void as the
      result -- which is Standard's own shape, `type Action<params TArgs> = Func<TArgs..., void>`.

      A SPREAD HAD TO BECOME A MARKER RATHER THAN ITS OPERAND, and that is the whole design. An
      alias is resolved ONCE at its declaration, while its pack is still open, and substituted at
      each use; so a spread that resolved to the pack itself would be indistinguishable from an
      ordinary reference by substitution time, and substitution would put one list where the
      elements belong. Measured before the fix: A<int, string> resolved to F<[TArgs], void>, which
      made it the same type as A<string, int> -- resolving, emitting, and silently wrong.
      SpreadType carries the distinction forward; substitution splices.

      ALIASES NEEDED THE BINDING RULE TOO, which the class path already had. ExpandAlias resolved
      its arguments and substituted them by ordinal, so a flat use site against a pack-declaring
      alias dropped every argument past the first.

      THE VALUE SPREAD AND THE PROVABLE CHECK ARE DELIVERED, and the base-type list needed nothing:
      `class Tup<params TArgs> : ICountable<TArgs...>` already resolved once the type-argument case
      did, the base list being an argument list like any other.

      General tuple decomposition runs end to end -- `Add2(pair...)` prints 30 -- because a spread
      expands into member accesses and needs no machinery downstream. Expansion happens at the
      ARGUMENT, not at the suffix: everything after it counts arguments, so a spread reaching
      overload resolution unexpanded would count as one however many it stood for.

      MIST_VAR_0011 REFUSES A SPREAD WHOSE LENGTH IS UNKNOWN, with the exception the spec calls
      provable: a pack spread into a slot declared as THAT pack survives unexpanded, since however
      many it turns out to hold, the slot holds that many. It is the one spread whose correctness
      does not depend on the arity being known.

      NOT REACHED, and not by this capability's fault: the sample's own witness for provable spread
      is `Apply(f, ...)` with `f: Func<TArgs..., TResult>`, and Standard.Func is a NOMINAL class, so
      the call never reaches the function-invocation path where a target exists to prove against.
      The rule is exercised through Mist's native `func<...>` spelling instead. Closing that needs
      the Func-to-FunctionType bridge, which is no part of 149-151.
    unlocks: []

  - id: spread-generated-members
    name: Spread-generated members
    order: 152
    layer: variadics
    requires: [pack-spread-positions, property-declarations-and-accessors]
    v2_status: partial
    verified_by: v2-semantics
    evidence: >
      A spread member declaration surfaces both an aggregate and one projection per element,
      in field and get-only-property kinds, with whole-pack assignment in a constructor. A
      whole-pack constraint distributes to every element so the constrained members are
      callable on each projection.

      THE AGGREGATE AND THE PROJECTIONS ARE DELIVERED, in both kinds. A spread in member position is
      one value rather than several, so the member holds the TUPLE its pack expands to and
      substitution fills it in.

      THE PROJECTIONS CANNOT BE DECLARED WITH THE TYPE, which is the shape of this capability. N is
      not a property of the declaration -- the same Bundle has three projections where its pack
      holds three and none where it holds none -- so the family exists per CONSTRUCTION and is found
      on demand from the receiver, which is the only thing that knows. Bounded by the pack: one past
      the end names nothing and the ordinary no-such-member answer stands.

      MIST_VAR_0007 IS DELIVERED. A spread reserves a name FAMILY rather than a name, and it has to:
      how many projections it has is unknown where it is declared, so the prefixed namespace is held
      rather than the names one instantiation happens to produce. Covers an ordinary member taking a
      projection name, in either declaration order, and one spread prefixing another. It stops at
      what the family can actually claim -- `ItemName` beside `Item` is fine.

      THE SYMBOLIC ELEMENT AND THE CONSTRAINT DISTRIBUTION ARE DELIVERED. A fixed-size domain fixes
      the ARITY without fixing the element types, which is exactly what lets a projection be named
      inside its own declaration, where the pack is open and no receiver exists to ask.
      PackElementType is a type PARAMETER seeded with the pack's constraints, and both halves of
      that carry weight: the constraints are what make Shape1.Area() resolve, and not being the pack
      is what stops Shape1 answering for Length, which a Type[] would.

      THE PROJECTIONS EMIT AS OF ORDER 153, projected through the aggregate rather than stored
      beside it: the constructor's zip fills only the aggregate, so independent backing would read
      back empty. A field-kind spread's projections are writable and a property-kind spread's follow
      its own accessors.

      NOT STARTED: MIST_VAR_0008, an empty stem, which the grammar may not admit at all.
    unlocks: []

  - id: variadic-monomorphization
    name: Monomorphization per observed arity
    order: 153
    layer: variadics
    requires: [spread-generated-members, tuple-patterns]
    v2_status: done
    evidence: >
      Discover the finite set of arities actually used across declarations, member types and
      construction sites, then specialize to each. Pack narrowing by tuple pattern re-enables
      fixed-arity forwarding inside a branch, and those branches must be PRUNED per
      monomorph -- the classic pipeline copies them verbatim, leaving shape-impossible tests
      in every arity.

      MONOMORPHIZATION IS NOT A MIST CONCERN AND MUST NOT TOUCH THE MODEL. It exists because the
      TARGET requires it, and design.md says so outright: "Mist core semantics: arity is unbounded",
      the ceiling is "explicitly a per-backend limitation", and "by emission time every pack has a
      concrete Type[] value and every spread has a known length, so emission IS monomorphization".
      Another backend may need none of this.

      RECORDED BECAUSE THE OBVIOUS IMPLEMENTATION IS THE WRONG ONE. Specializing a variadic
      declaration means rewriting its method BODIES, and the model has neither expression
      substitution nor type cloning -- so the natural move is to make ProgramModelBuilder re-bind
      the declaration once per arity with the pack pre-bound. That works, and it puts a C#
      limitation inside the language's model. It was proposed here and rejected on exactly that
      ground.

      THE SHAPE THAT IS RIGHT reads the model and produces SOURCE, adding files rather than
      changing types -- which is where classic already puts it, in Backends/CSharpTranspiler rather
      than in Semantics. v2 has the same pattern in EmitUnionCarriers and EmitDependentCarriers.
      Mappings the spec fixes: a value pack `(TArgs...)` to System.ValueTuple, nested past seven;
      spread projections to Item1..ItemN, matching ValueTuple's own field names; a constructed Func
      or Action to the matching CLR shape.

      HALF OF IT IS ALREADY DONE, by order 109 rather than by anything here: Func and Action collapse
      to the structural function type, which the emitter already maps to System.Func and
      System.Action. So the mapping half needs nothing further and only USER-DECLARED variadic
      types need per-arity declarations.

