  - id: tuple-types-and-literals
    name: Structural tuple types and literals
    order: 100
    layer: tuples
    requires: [class-declaration]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      THE TYPE SIDE WAS ALREADY BUILT AND TESTED -- TupleType with its synthesized Item1..ItemN fields,
      NamedTupleType decorating it, the interner's arity-sensitive reference-identity key, ScopeResolver's
      resolution, and TypeMemberLookup answering both `pair.Item1` and `point.x`. What was missing was
      everything from the literal onwards: no expression node, no binder arm, no conversion arm, and not
      one mention of a tuple anywhere under the emitter.

      A LITERAL IS TYPED BY THE INTERNED STRUCTURAL TUPLE, never by a NamedTupleType, and the names it
      spells are use-site metadata on the expression node. Wrapping them into the type would produce one
      interned tuple per spelling and put two literals of the same shape at different identities. A
      DECLARATION site is the asymmetric case and does wrap, because there the names are part of what was
      declared -- so `(x: 3, y: 4)` is a `(Int32, Int32)` while `(int x, int y) p` is a decoration over
      one.

      ELEMENTS BIND AGAINST THE TARGET'S ELEMENTS, one position at a time, which is what lets a
      target-typed `new()` sit in an element and what carries a string into an `unknown` slot. A target of
      another arity supplies no element target at all, saying nothing about what any one element should
      be. The element push is guarded by the one element form that cannot bind without it: a bare `new()`
      has no type of its own.

      THE CONVERSION ARM DID NOT EXIST AT ALL, and the hole it left was sharper than arity. Type identity
      in v2 is compared by fully qualified name, and a NamedTupleType's name INTERPOLATES its element
      names -- `(Int32 x, Int32 y)` against `(Int32, Int32)` -- so a named tuple was not identical to its
      own shape and `(int x, int y) p = (x: 3, y: 4)` had no rule to accept it. The unwrap to Underlying
      therefore goes at the ENTRY of both IsWithin and IsIdentity rather than being an arm of either.
      Mutation-checked, and the result was more precise than expected: removing it fails the identity
      assertion ONLY -- containment survives through the element-wise arm, which is the second half of
      this order and makes a tuple widen wherever its elements do, so `(byte, string)` is within
      `(int, string)`.

      EMISSION KEEPS ELEMENT NAMES IN TYPE POSITION, because `point.x` is emitted as `.x` and only
      compiles if the C# type carries the name. Tuples are also value kinds now, so `(int, string)?` spells
      as Nullable of the tuple rather than as the bare type with null for absence -- a ValueTuple is a
      struct, and IsValueKind answering false for it was wrong.
    unlocks: []

