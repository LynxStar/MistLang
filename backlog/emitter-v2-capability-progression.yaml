  - id: list-and-slice-patterns
    name: List patterns with slice elements
    order: 125
    layer: ranges
    requires: [index-and-range-expressions, logical-patterns]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      The grammar already carried all of it -- `ListPattern` at Mist.storm 731 and
      `ListPatternElement` with its PatternElement and SliceElement alternatives at 751-754 -- and
      both optional slots are optional RULE REFERENCES rather than the optional anonymous group that
      order 93 found unreachable, so `[]` and a bare `..` both arrive. PatternBinder's BindPrimary
      simply had no arm and fell to `default: return null`.

      ONE PATTERN, TWO SCRUTINEE TYPES, which is what separates a list pattern from a tuple pattern
      and the reason this order requires 124. A positional element is scrutineed by the element type
      and a slice by the SLICE type, so `[var first, .. var middle, var last]` types first and last as
      int while middle is int[]. Mutation-checked: binding the slice against the element type instead
      fails ASliceIsTypedByTheSubsequence and the AllFeaturesV2 baseline both, since `middle.Length`
      does not resolve on an int.

      NO MINIMUM-LENGTH CONSTRAINT IS COMPUTED, which the spec sentence for this order names and is
      deliberately not done here. C# derives it from the pattern's own shape, so stating it again would
      be a second authority on one fact. What construction does own is the count of slices: two would
      leave undetermined which elements are counted from the front and which from the back, so a
      second slice reports MIST_PM_LIST_PATTERN_MULTIPLE_SLICES rather than yielding a weaker
      constraint.

      AN UNKNOWN SCRUTINEE IS REFUSED where a tuple pattern type-tests one, and the asymmetry is C#'s
      rather than a shortfall. TuplePattern.TestedType exists because a tuple pattern can name the
      ValueTuple ahead of itself; `[...]` is the only spelling C# has for a list pattern and it
      requires a countable scrutinee, so there is no type to name first. Making it work would mean
      emitting `is int[] and [1, ..]`, a second emission shape. Reported as
      MIST_PM_LIST_PATTERN_SCRUTINEE.

      BINDERS ALL LIVE ON THE ELEMENTS, the slice included, and the node carries none. The grammar
      spells no trailing name here at all, so this is PropertyPattern's situation and not
      TuplePattern's -- Pattern.Binding stays singular per node with multiplicity coming from the
      recursion. A positional element threads the order 99 hoisting list as a tuple element does,
      being the same kind of binding site; a SLICE clears it, since lifting an enum variant out of one
      would compare a sub-sequence against a variant.

      EVERY REACHABLE PrimaryPattern ALTERNATIVE IS NOW BOUND. All thirteen the grammar generates have
      arms, so BindPrimary's `default: return null` is unreachable from any spelling and parking now
      happens only inside an arm -- a property pattern's two unreachable slots, a tuple pattern whose
      elements name no type, a list pattern whose element fails to bind. Two tests that had used a
      list pattern AS the unmodelled form were retargeted: PatternResolutionTests lost
      AListPattern_ParksUnresolvedWithoutADiagnostic outright, and SwitchExpressionResolutionTests'
      arm-parking test now uses `(0, 0)` on an unknown, which order 103 established still parks.
    unlocks: [PatternMatching, RangesAndIndices, SwitchExpressions]

