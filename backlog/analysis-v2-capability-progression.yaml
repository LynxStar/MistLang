      THE CLOSING CARRIES ITS SUBSTITUTION. TypeArgumentClosing.Closing is the site's whole
      TypeSubstitution rather than one parameter and its argument: at a type closing, the declaration's
      parameters by the written arguments over the enclosing instantiation where the site has one; at a
      call, overload resolution's own substitution -- receiver, base path, and the method's arguments
      written or inferred, so the two are judged alike by construction rather than by a second inference;
      at a method group, the same rebuilt from the receiver's path and the stated or target-read
      arguments; and for a method of a generic extension block, Method.BlockClosing, which
      ExtensionSpecialization sets on the closed copy, since that copy substitutes its parameters and
      return but shares its type parameters, whose constraints still name the block's. The rule applies
      it to a type constraint and to a constructor signature before judging, and names what it judged:
      'IRank<Grade>', 'Dog', 'IKeyed<int>', 'new(string)'. A constraint into which the closing brings a
      type that already failed -- `Kin<Nothing, Dog>`, `Link<Nothing, Badge>`, `Factory<Widget, Nothing>`
      -- says nothing more, the binder having reported the name; each of the three was a second complaint.
      The site reported is unchanged: the construction, the call, the group, the base clause.
      A whole-pack constraint naming its own pack is read of each element on its own, variadics
      Requirement 11.1 -- `Row<params Ts> where Ts : IRank<Ts>` asks IRank<Score> of a Score -- by
      rebinding the pack to the element under judgment (TypeSubstitution.With); read of the pack it asked
      'IRank<[Score, Score]>', which no element satisfies. A pack naming a sibling needs nothing more.
      Classic refuses both pack forms, valid closings included, as MIST_VAR_0009 against the declared
      constraint.

