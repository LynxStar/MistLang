# =====================================================================
# NOTES CARRIED FORWARD
# =====================================================================
#
# DEFERRABLE INDEFINITELY: compound assignment and increment/decrement. Neither appears in
# ANY of the 75 samples -- verified by search. Every loop iterator is written longhand and
# every accumulator re-assigns. BodyEmitter's AssignmentExpression emits a plain assignment
# only and MapUnaryOperator handles only negate and logical-not, and that is sufficient for
# the entire suite. TopLevelStatements advertises a control-flow survey and still writes the
# iterator longhand.
#
# ALSO ABSENT from all 75: continue, do-while, and try/catch/throw as SOURCE constructs.
# try/finally appears only as emitter output for drop insertion and scope-exit awaits, never
# written by a Mist program, so there is no exception-handling capability in this file at all.
# That is a genuine hole in the sample suite, not an omission here.
#
# ORDERING JUDGEMENTS WORTH REVISITING
#
#   1. Overload resolution sits at order 26, ahead of the declaration-boundary layer,
#      because Overloading is already marked done and should not stay falsely green. Treated
#      as greenfield rather than debt it would sit later, after the samples that need no new
#      semantic algorithm.
#
#   2. The inheritance layer sits at 34 through 38. Classic shipped inheritance at
#      intro_order 4, and 6957888b already emits a base chain against a missing base list,
#      so there is a real argument for pulling this layer ahead of declaration boundaries.
#
#   3. struct-as-parameter-and-return at order 25 is a thin capability carrying a fat
#      requires list, because it is the last thing Classes needs. If it turns out to work
#      for free, Classes unlocks at ambient-math-intrinsics instead.
#
#   4. Nested types sit ahead of abstract types, because AssociatedTypes fills every slot
#      with a nested type. That ordering was inverted in the first draft and is easy to get
#      wrong again.
#
#   5. Attributes bottoms out on CLR type projection, not on the attribute layer, because
#      its attribute types come from the BCL. If a sample used only Mist-declared
#      attributes it would unlock much earlier.
#
# SAMPLES THAT HAVE NEVER BEEN RUN: DisposableDropInterop has no build output at all.
# ArrayLiterals and CastOperators have no committed out/ directory. A sample with no build
# output cannot be an acceptance test for anything. (VoidValueLiteral used to head this list
# -- its "no entry point" note was stale, and banking it at order 80 was its first execution
# on either pipeline; both pipelines agree on its output.)
#
# MEASURED GAP ORDERING. Every construct the v2 binder leaves unbound, counted across the whole
# sample suite. Prefer this to the requires lists below when choosing what to do next: those are
# hand-written and have overstated the remaining work four times, whereas this is counted at the
# point of failure.
#
#   sites  samples  construct
#      64       13  ObjectCreationExpressionPrimaryNode         (generic, see order 17)
#      27        3  IdentifierExpressionPrimaryNode             (bare property read, order 58)
#      22        3  TypeLiteralExpressionPrimaryNode
#      18        1  SwitchExpressionSuffixPostfixSuffixNode
#      10        2  IsExpressionRelationalNode
#      10        2  AwaitExpressionUnaryNode
#       8        2  DefaultExpressionPrimaryNode
#       8        1  ObjectCreationExpressionNoArgsPrimaryNode
#       7        2  VoidCoalescingNode
#       7        1  TargetTypedNewExpressionPrimaryNode
#       5        2  AsyncExpressionUnaryNode
#       5        1  OptionalMethodCallSuffixPostfixSuffixNode
#       4        1  WithVarBlockStatementStatementNode
#       3        1  AssignmentFormExpressionNode
#       3        1  ReadonlyBlockStatementStatementNode
#       2        1  LambdaFormExpressionNode
#       2        1  CastExpressionUnaryNode
#       2        2  DefaultLiteralExpressionPrimaryNode
#       2        1  TupleLiteralExpressionPrimaryNode
#       1        1  WithBlockStatementStatementNode
#
#   210 sites, 24 samples, 20 distinct constructs.
#
# To reproduce: run each sample on --pipeline experimental and count the
# '/* unsupported: Kind */' markers left in the emitted .cs. Emission writes every file before
# the error gate, so a failing run still leaves them on disk, and the marker names the AST node
# kind rather than the sentinel's own type.
#
# What this ordering does NOT capture: a construct the binder handles WRONGLY rather than not at
# all leaves no marker. Two are known -- ref-parameters-and-ref-locals (order 132) and
# entry-point-resolution (order 33) -- and both compile, run and produce the wrong program. A
# marker count finds unbound constructs, never silent miscompiles.

# CROSS-CUTTING TASKS, not tied to one capability:
#
#   - DONE. Report a Mist diagnostic when the emitter encounters a sentinel. Both halves are in:
#     BodyEmitter reports BackendDiagnostics.UnsupportedExpression and
#     BackendDiagnostics.UnsupportedStatement, each with a real Mist location, so a gap no longer
#     surfaces as a Roslyn error on a generated file and no longer silently drops a statement.
#     See field-initializers (order 47) for the measurements and for the mis-diagnosis that had
#     the statement half recorded as blocked.
#
#   - OPEN, design cleanup rather than a fix. Detect sentinels in Stage 5 instead of during
#     emission. ExperimentalPipeline ALREADY refuses to run Stage 6 when Stages 4 or 5 reported
#     errors -- verified: a program with an unresolved field type produces no out/ directory at
#     all. The gate is not the gap. The gap is that nothing reports a sentinel before Stage 6:
#     the binder parks them silently on purpose (UnresolvedExpression means "not implemented",
#     and ExperimentalPipeline documents that analyzers must tolerate sentinels), and
#     RunAnalyzers is still a stub. So the bag is empty when the gate is evaluated and the
#     emitter is the first thing to walk the bound tree.
#     Moving detection into Stage 5 would attribute the error to the right stage and stop
#     uncompilable .cs being written to disk before the build fails. It would NOT change whether
#     the build fails, nor how many sentinels get reported -- the emitter writes every file
#     before its own HasErrors check, so it already reports all of them. Cost is a second
#     traversal of the statement/expression hierarchy duplicating BodyEmitter's switch shape,
#     which is why the check went in the emitter to begin with. Wants the bound-tree walker
#     (program-model-body-tasks.yaml, bound_node_hierarchy).
#
#   - Decide what to do about the rejection surface. Roughly two thirds of the `untested`
#     entries in this file are the same observation: the sample exercises only the accepting
#     path, because a sample must build clean. Ownership, readonly, refinement, dependent
#     types, substructural disciplines and accessibility are ALL in that position -- their
#     analyses could be entirely absent and every sample would still pass and print
#     correctly. Those checks need unit tests; no amount of sample work will cover them.
#
#   - Give Properties a baseline. It currently produces wrong output on the classic
#     pipeline (two backing fields for a mixed accessor pair, so writes never reach reads)
#     and nothing catches it because the sample has no expected-output file.

# =====================================================================
# MEASURED DEFECTS
#
# v2 code paths that EXIST and produce output that does not compile, plus one that
# refuses a program classic accepts. Recorded here because the ordering model has no
# other home for them: it orders CAPABILITIES, and a capability is either unstarted
# (`missing`) or delivered. "Order 141 is not unstarted, it is emitting garbage" was
# not expressible until the entries below were flipped to `broken`, and the LIVE DEFECT
# convention used elsewhere in this file describes CLASSIC's bugs, never v2's.
#
# WHY THIS SECTION EXISTS AT ALL. Every status in this file was derived from reading
# source and from what the sample suite proves. Nobody had built an UNBANKED sample and
# read the errors, so `missing` -- whose definition here is "NOT a bug and NOT a
# regression ... an absent emitter path" -- was being applied to paths that are present
# and wrong. Seven unbanked samples emit ZERO Mist diagnostics and fail only in Roslyn
# against generated files, which is this file's own worst category, and it recorded
# zero `broken` entries while that was true.
#
# HOW TO RE-TAKE IT: build every unbanked sample on `--pipeline experimental`, redirect
# output away from samples/, and split the diagnostics per sample into MIST_CS_ERROR
# (Roslyn, against generated C#) versus MIST_PM_* / MIST_BE_* (a refusal at Mist
# source). A sample in the first column with an empty second column is a defect of this
# kind. That split is the whole measurement and it is cheap; it should be re-run
# whenever a status here is questioned.
# =====================================================================

measured_defects:

  measured_at: 23bcea57
  measured_on: 2026-09-05
  method: >
    All 32 unbanked samples built on the experimental pipeline, diagnostics classified by
    prefix. Tree was green throughout -- build clean with 0 warnings, 5659 tests passing --
    so none of this is a regression against a red baseline. No sample directory was written
    to; every build was redirected elsewhere.

    RE-TAKEN 2026-09-06 over all 29 currently-unbanked samples, tree green at 5751 tests.
    silent_emission_failures confirmed at ZERO Roslyn errors. Two corrections came out of it and
    both were measurement faults rather than status faults, so the method is amended:

    1. COUNT FROM THE WHOLE BUILD OUTPUT, not per source file. Diagnostics scoped `<ambient>` carry
       no .mist location, so a per-file classification silently counts zero for a sample that
       emitted 228 of them -- which is how samples/Testing came to be recorded green.
    2. USE THE RID-SPECIFIC CLI. Source/Mist.CLI/bin/Debug/net10.0/mist.dll is a STALE leftover
       predating the --pipeline flag; the live build is under net10.0/win-x64/. The stale one exits
       with "Unknown flag: --pipeline", which a script counting error LINES reads as a uniform
       small failure across every sample rather than as a broken harness.

  silent_emission_failures:
    count: 7
    remaining: 0
    samples: [RefinementTypes, RefinementComparison, DependentTypes,
              DependentTypeRefinementConstraints, AdhocRefinementConstraints,
              ArrayBoundsFlowAnalysis, Attributes]
    total_roslyn_errors: 491
    remaining_now: 0
    reopened_and_cleared: >
      samples/Testing RE-ENTERED THIS CATEGORY on 2026-09-06 with 16 MIST_CS_ERROR and ZERO Mist
      diagnostics, and LEFT IT the same day: order 129 shipped and it now builds on v2 at zero
      errors. Measured on the whole build output, not per source file.

      THE ENTRY NAMED THE WRONG CAUSE, which is the part worth keeping. It read the empty ItemGroup
      in the generated csproj as the reason, and that csproj is never built -- v2 compiles in
      process through Roslyn, which was simply not given the resolved assemblies. Emitting the
      ItemGroup alone would have left all 16 errors standing while looking like a fix.

      THAT MISREADING IS THIS CATEGORY'S OWN FAILURE MODE ONE LEVEL UP. A silent emission failure
      hands you a symptom in generated code and no Mist-level cause; the temptation is to accept the
      first plausible story about where it came from. The check that would have caught it early is
      the same one this section already demands of measurement -- look at what actually consumes the
      artifact you are blaming.
    resolved: >
      Six of the seven report at Mist source instead, via UnspellableTypeGuard: orders 141 and
      145 are refused rather than mis-emitted, which took 491 Roslyn errors against generated files
      to a handful of MIST_BE_* diagnostics naming a .mist line. Attributes was always a different
      defect -- the constructor-accessibility divergence on order 14, not a refinement -- and is now
      banked, so this list is empty.
    note: >
      Zero Mist diagnostics between them. The compiler reports success and the user receives
      syntax errors in a file they never wrote. Contrast the well-behaved gaps -- Ownership and
      AsyncDropChaining report MIST_BE_UNSUPPORTED_EXPRESSION, ReadonlyContexts and DropSemantics
      report MIST_BE_UNSUPPORTED_STATEMENT -- which is the shape these seven are missing.
    root_causes:
      - Refined type names leak into emitted C# -- see order 141, now `broken`.
      - A dependent VALUE parameter is lowered to a C# TYPE parameter -- see order 145, now `broken`.
      - Constructor default accessibility diverges from classic -- see order 14, now `done`.
        This one was Attributes' entire failure and had nothing to do with refinement.

  blocking_refusals:
    - defect: Standard and System cannot be imported together
      recorded_on: using-import-resolution (order 29)
      gates: [ClrRefInterop, RefStructs, DisposableDropInterop]
      status: FIXED
      note: >
        Was the largest single blocker on the unbanked set, and it masked what those three samples
        were actually waiting for. Not a language question: classic resolves user-declared
        namespaces before ambient ones and returns on the first hit, so `Console` binds to
        Standard.Console and System is never consulted. v2 had flattened those two phases into one
        loop. LookupImports now tiers on IAssembly.HasMistSource. Measured after: ClrRefInterop 7
        errors -> 2, RefStructs 43 -> 4, DisposableDropInterop 15 -> 2. None of the three banks yet;
        what changed is that their real residue is now visible instead of masked.

    - defect: a type present in two reference assemblies is refused outright
      recorded_on: clr-assembly-type-projection
      gates: [Testing, CSharpInteropV2, DelegateFuncConversion]
      status: FIXED
      resolved: >
        First definition wins, silently. THE DIAGNOSTIC WAS ANSWERING A QUESTION CLASSIC NEVER ASKS:
        classic resolves a type on demand and returns the first assembly whose namespace index has
        the name, so a second definition is simply never reached. v2 shells every exported type
        eagerly, which is what surfaces the collision -- so the collision belongs to v2's strategy
        and is v2's to absorb. Type FORWARDING was already excluded by the loop above it; what
        reached the check was the same name genuinely defined twice, which real package sets do.

        Measured: Testing 223 duplicates -> 0, CSharpInteropV2 5 -> 0, DelegateFuncConversion 4 -> 0.
        All 47 banked samples unaffected, both baselines matching on both pipelines.

        NO UNIT TEST, and the reason is worth stating rather than hiding: reproducing it needs two
        assemblies that define the same FQN without forwarding, which the runtime reference set does
        not readily provide and which would take a crafted fixture pair. What replaces the test is
        structural -- the DESCRIPTOR IS DELETED, so the diagnostic cannot return without someone
        deliberately re-adding it.

        WHAT IT WAS MASKING is now the top blocker, and it is a different defect: MIST_AMBIENT_UNRESOLVED,
        Testing 5, CSharpInteropV2 137, DelegateFuncConversion 56. Types like
        Microsoft.VisualStudio.TestPlatform.ObjectModel.ILazyPropertyValue and Xunit.Sdk.ITheoryData
        are referenced from projected member signatures but were never shelled. Unchanged in count by
        this fix, which is the evidence they are independent rather than downstream.
      note: >
        v2-ONLY, and now the largest single blocker on the unbanked set. AmbientTypeProviderV2
        reports MIST_AMBIENT_DUPLICATE when a type FQN is already shelled, on the theory stated in
        its own message -- "Remove the conflicting package" -- that this means conflicting NuGet
        packages. It routinely does not: a framework reference pack and a NuGet package legitimately
        carry the same type, which is what type forwarding is for. The descriptor's own summary says
        "without type forwarding"; the code never checks for forwarding, only `shells.ContainsKey`.

        Measured 2026-09-06: Testing 223, CSharpInteropV2 5, DelegateFuncConversion 4, all with
        MIST_AMBIENT_UNRESOLVED alongside. CLASSIC BUILDS ALL THREE CLEAN, so this is a divergence
        where v2 refuses what the contract accepts, not a gap. Classic's provider takes the first
        and moves on.

        SAME SHAPE AS THE STANDARD/SYSTEM BLOCKER ABOVE: it masks what those samples are actually
        waiting for. CSharpInteropV2's 137 MIST_AMBIENT_UNRESOLVED are the bigger half of its
        residue and cannot be read until this clears.

    - defect: a signature mentioning an unloaded type refuses the whole compilation
      recorded_on: clr-assembly-type-projection
      gates: [Testing, CSharpInteropV2, DelegateFuncConversion]
      status: FIXED
      resolved: >
        AmbientTypeResolver returns ErrorType without a diagnostic. THE CALLER ALREADY KNEW WHAT TO
        DO WITH IT: every member projector skips a member whose signature will not resolve, so the
        member was being dropped AND the compilation refused, when dropping alone is right. A member
        mentioning a type from an assembly nobody loaded is unusable whether or not we say so, and
        calling it still fails -- at the call site, in the user's own file, as
        MIST_PM_UNRESOLVED_MEMBER.

        SAME ASYMMETRY AS THE DUPLICATE ABOVE. Classic resolves on demand, so a signature it never
        asks about costs nothing. v2 projects every member of every type eagerly and walks thousands
        of them, which is how samples/Testing came to be refused over Xunit.Sdk.ITheoryData -- a name
        its author never wrote and cannot act on.

        Measured: CSharpInteropV2 143 errors -> 1, DelegateFuncConversion 60 -> 17, Testing 228 -> 16.
        CSharpInteropV2 is now a ONE-ERROR sample, its residue being UseNpgsql, a CLR extension
        method from a NuGet package -- order 131, correctly `missing`.

    - defect: no non-string argument is applicable to an `unknown` parameter
      recorded_on: overload-resolution-by-argument-type (order 26)
      gates: [ExtensionMethods, Variadics]
      note: >
        Refuses `Console.WriteLine(7)`, which classic prints. Already carried its own one-task fix;
        what was new is that it is a prerequisite of Layer T, reachable from no `requires` edge.

  wrong_answers:
    note: >
      The worst category this file can record: v2 compiles clean and the program prints something
      other than what it means. Both entries are FIXED and kept because the shapes are worth
      recognising again. Neither was found by a sample -- the first while adversarially verifying
      order 128, the second while regenerating a baseline for an unrelated shipment -- and the second
      was BANKED, with the baseline recording the wrong answer as expected output.
    entries:
      - defect: every variant of an enum prints the FIRST variant's name when values collide
        recorded_on: enum-with-readonly-base (order 134)
        status: FIXED
        note: >
          samples/EnumReadonlyRestriction prints all four variants of `enum Corner : Coordinate`.
          Classic printed each name; v2 printed TopLeft four times, zero diagnostics, exit 0.

          THE LOWERING SHAPE WAS NEVER THE PROBLEM. A Mist enum wraps an arbitrary readonly type
          where a CLR enum admits only integral ones, so both pipelines lower to the same record with
          one static singleton per variant. The emissions were identical but for ToString, which read
          `Equals(Value, X.Value)` where classic reads `ReferenceEquals(this, X)`. Coordinate keeps
          nothing it is constructed with, so every Coordinate is byte-identical, so the first arm
          answered for all four. The variant identity was in hand -- four distinct singletons -- and
          discarded to re-derive the name from the payload.

          IT WAS RECORDED AS SANCTIONED, WHICH IS THE PART WORTH REMEMBERING. EnumEmitter's class doc
          argued ONE equality notion, structural, "so printing and comparing cannot disagree", and
          called the aliasing "what C# enums do with a repeated value". 60ae348d then banked the
          three lines on that argument. Both halves fail against Mist, and one probe each settles it:
          `enum Rank : int { Private = 1, Corporal = 1 }` is refused by classic with MIST_SB_0085, so
          Mist has no repeated values; `Corner.TopLeft == Corner.BottomRight` is refused with
          MIST_TC_0005, so Mist has no equality between variants. The consistency the design bought
          was with two operations the language does not offer, and it was paid for with a wrong
          answer on a program classic runs.

          The only route to value-equal variants is a base type that discards its constructor
          arguments, which MIST_SB_0085 cannot catch because the written values differ. That is why a
          degenerate struct was needed to expose it, and why fixing the SAMPLE -- the first instinct,
          and wrong -- would have hidden the defect instead of closing it.

          RESIDUE, LATENT AND NOT REACHED: the emitted `sealed record class` takes structural
          equality from the record, so on the C# side two variants with equal payloads compare equal
          while naming themselves differently. Mist exposes no such comparison (MIST_TC_0005 again),
          so nothing reaches it today -- but it is the inconsistency the value-based ToString was
          written to avoid, and it is still there.

      - defect: a by-ref call site binds to a BY-VALUE overload
        recorded_on: overload-resolution-by-argument-type (order 26)
        status: FIXED
        root_cause_was_deeper_than_diagnosed: >
          The diagnosis was that the call site's `ref` is erased before selection. True, and not
          sufficient: CandidateSet.SignatureKey keyed on parameter TYPES, so the two overloads
          collapsed into ONE candidate before selection ran, and a lone candidate is returned without
          consulting applicability at all. Fixing the erasure alone changed nothing -- measured, the
          reproducer still printed the by-value answer -- because there was never a second candidate
          to choose between. Both halves were needed.
        note: >
          With `M(int v)` and `M(ref int v)` both declared, ArgumentBinder erases the call site's
          `ref` before selection, so BOTH `M(a)` and `M(ref b)` bind to the by-value candidate. v2
          emits `M(a)` and `M(b)`, builds with ZERO errors, and prints the by-value result twice --
          classic prints one of each. No diagnostic anywhere.

          Order 26's evidence already says the call site's ref is erased before binding, and treats
          that as harmless because "C# requires the call site and the parameter to agree" (feddfdf7).
          That holds when only one candidate exists. It fails exactly when a by-ref and a by-value
          overload share a name, which is the case nobody had written.

          Scope measured: ONE such overload group exists in the whole net10.0 BCL
          (EventSource.Write<T>) and none in ASP.NET, so the CLR side is nearly unreachable. The
          Mist-declared side is wide open and is what the reproducer uses.

          Any rule that picks a keyword from the resolved callee -- including ArgumentKeywords --
          inherits this: it will faithfully spell whatever the wrong callee wanted.

      - defect: a CLR out parameter hands Mist a naked null and the program crashes
        recorded_on: clr-nullable-projection (order 130)
        status: FIXED
        note: >
          WORSE THAN THE OTHER TWO IN THIS SECTION, and in both pipelines rather than v2 only. This
          did not print a wrong answer; it threw.

            var dict = new Dictionary<string, string>();
            string got = "";
            dict.TryGetValue("missing", ref got);
            Console.WriteLine(got.Length);   // NullReferenceException

          Compiled clean on classic AND v2. Mist has no null, so `got` is a String that cannot be
          absent -- and the CLR wrote one into it.

          THE CAUSE WAS LOOKUP, NOT NULLABILITY, which is why staring at the projection never found
          it. CollectMethodOverloads switched on ClassType/StructType/AbstractType with no arm for
          ConstructedType, so a Dictionary<string,string> receiver produced NO candidates at all and
          argument checking for a call on a constructed CLR receiver had simply never run. Roslyn
          covered what it could, which is everything except nullability: C# is content with
          `out string`. That is exactly why an `out int` type mismatch WAS caught and the null was
          not.

          Adding the arm turned three checks on for a shape they had never been run against, and
          each needed the receiver's type arguments threaded in or it fired wrongly -- 111 new
          diagnostics across 11 samples before the substitutions, none after. Scoped to CLR
          receivers: admitting Mist-declared generics misjudged variadic packs, reporting a
          lambda-body error for a Func variable in Bundle<...>.Map.

  classic_defects_where_v2_is_correct:
    note: >
      A category this file had no home for. The clean-room rule makes classic's BEHAVIOR the
      contract, so the default assumption is that a divergence means v2 is wrong. These are the
      cases where measurement said otherwise, and v2 must NOT be made to match them. They are worth
      recording because a future parity sweep will find each one and be tempted to "fix" v2.
    entries:
      - defect: overload specificity does not look inside a union
        pipelines: classic wrong, v2 correct
        status: OPEN
        note: >
          `sb.Append("x")` is refused as MIST_TC_0032, ambiguous between Append(Void | unknown) and
          Append(String | Void) -- C# resolves it trivially. Reproduced with Mist-declared
          overloads and no CLR involved: Take(unknown) vs Take(string) picks string, while
          Take(Optional<unknown>) vs Take(Optional<string>) is ambiguous. The specificity rule works
          on bare types and stops at the union boundary. v2 picks string in both.

          Independent of the by-ref work: ref arguments use exact matching, so specificity never
          runs for them.

          WHY IT MATTERS DESPITE CLASSIC BEING REPLACED: samples must compile on classic to produce
          baselines, so classic's defects constrain what any sample can contain. A sample wanting
          `sb.Append("x")` cannot be written today.

      - defect: diagnostics print their format placeholders
        pipelines: classic
        status: OPEN
        note: >
