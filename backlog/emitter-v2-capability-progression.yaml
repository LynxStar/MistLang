# =====================================================================
# NON-SAMPLE ACCEPTANCE TARGETS
#
# The stdlib is transpiled by v2 on EVERY compile, and it exercises constructs no
# sample touches. Tracking samples alone structurally cannot see these.
# =====================================================================

non_sample_targets:

  - name: stdlib
    kind: library
    path: Source/Standard
    threshold: intrinsic-member-declarations
    evidence: >
      NOTHING OF THE STDLIB IS EMITTED BY v2 TODAY, which the untested entries below assume away.
      CSharpEmitterV2 skips the whole Standard ASSEMBLY, where the rule is per DECLARATION:
      `intrinsic` says the target already supplies it -- stages 1-5 are pure Mist and only stage 6
      answers where it comes from -- and everything else is ordinary Mist that has to be emitted.

      FIVE STANDARD FILES DECLARE NO INTRINSIC AT ALL: IClonable, Optional, Void, IEnumerable and
      IEnumerator, with Unknown nearly so. Classic emits them (IClonable.cs and Unknown.cs appear in
      every classic out/); v2 emits none, and carries hand-written C# stand-ins instead --
      CSharpEmitterV2.EmitVoidStruct is a transcription of Void.mist that can drift from it silently.

      WHAT LIFTS THE SKIP is orders 185 and 186: the emitter has to be able to tell an intrinsic
      declaration from an ordinary one before the test can narrow from the assembly to the
      declaration. Every other capability this target requires is already done.
    requires: [intrinsic-member-declarations, operator-overload-declarations,
               cast-operator-declarations, property-declarations-and-accessors,
               indexer-declarations, associated-type-slots, type-pack-declarations,
               generic-type-aliases, dependent-type-parameters,
               refinement-type-declarations, nominal-conformance-and-slot-checking,
               struct-declaration]
    note: >
      Every v2 compile transpiles this, so it is the one target that is already exercised on
      every run -- and it is currently emitted with operators, cast operators and properties
      silently dropped. The array type alone needs a dependent length parameter, a refinement
      alias for its bounds, an associated enumerator slot, an indexer with a refined
      parameter, a nested struct and the intrinsic modifier.
    untested:
      - Nothing asserts on the emitted stdlib. The samples pass because they do not call the
        dropped members, so the stdlib's own correctness has no test at all.
      - The unit type is transpiled and then rewritten to the void keyword at every
        reference, so the emitted file is dead code that still had to compile -- which is how
        the forced-public struct constructor workaround came about.

# =====================================================================
# ORPHAN CAPABILITIES
#
# Required by no target. TWO REASONS PUT A CAPABILITY HERE and they are not the same.
#
#   The first three are soundness checks whose only observable is a REJECTION, and no
#   sample can contain one because samples must build clean.
#
#   sealed-modifier is the second kind and the preamble used to deny it existed. The
#   construct IS written in a sample -- FullAccessibilityModel declares a sealed class and
#   a sealed struct, and builds clean. It is unobservable because NEITHER pipeline emits
#   the modifier and Tier 6 compares stdout, where it is invisible. So a capability can be
#   orphaned by what the acceptance test can SEE rather than by what a sample can CONTAIN,
#   and an orphan of this kind is a live emission gap rather than a deferred check.
# =====================================================================

orphan_capabilities:

  - id: static-context-checking
    reason: >
      Its whole purpose is rejecting a this reference or an instance-field read in a static
      member. Every sample is legal by construction, so no sample can require it. Classes
      exercises the neighbouring code path and would pass WITHOUT this check, which is
      precisely why it needs a unit test rather than a sample.

  - id: member-before-namespace-precedence
    reason: >
      Observable only when a field name collides with a visible type name. No sample contains
      such a collision. Needs a unit test asserting the field wins.

  - id: sealed-modifier
    reason: >
      ORPHANED BY INVISIBILITY, NOT BY ABSENCE -- the second kind described in the preamble, and
      the only capability here that is a live emission gap rather than a deferred check.
      FullAccessibilityModel declares `public sealed class Ledger` and a sealed struct, and banks
      green. Neither pipeline emits the modifier -- MemberModifiers.IsSealed is populated by
      ModifierBuilder and read by neither MemberModifierEmitter nor TypeEmitter, and classic's own
      emitted Ledger.cs is `public class Ledger` -- so Tier 6's stdout comparison cannot see the
      difference and the sample passes on both pipelines with the modifier dropped on both.

      It was listed among FullAccessibilityModel's requirements until that sample was banked
      WITHOUT it, which is what removed the edge and left this unreachable. Recording it here
      rather than deleting it keeps the fact that the emission is missing; deleting it would
      have made a silent drop disappear from the file along with the entry.

      Needs a unit test on emitted C#, per class and per struct. A sample cannot serve, and that
      is a property of the acceptance test rather than of the construct.

  - id: non-public-type-accessibility
    reason: >
      No tier-0 through tier-8 sample declares a non-public type, so the current collapse of
      every non-public level to C# internal is latent. Needs a unit test per level.

# =====================================================================
# UNCOVERED CONSTRUCTS
#
# The grammar generates 403 AST node classes. After removing 65 abstract rule nodes,
# 14 operator-symbol nodes recorded as operators instead, and 4 precedence-plumbing
# nodes, these 25 appear in NO sample. Recorded so this file cannot be mistaken for
# evidence that the sample suite is complete.
#
# disposition: needs-sample | unit-test-only | dead-grammar | stdlib-only | covered
#
#   covered -- a sample was WRITTEN for it after this census was taken, so the entry no
#   longer describes an uncovered construct. Kept rather than deleted because the census
#   is hand-taken and re-running it means re-doing the diff; an entry that records its own
#   resolution is cheaper than an entry that silently disappears. The note says which
#   sample and on which pipeline it runs, because a sample that covers a construct on
#   classic while v2 cannot bind it is not coverage for v2's purposes.
# =====================================================================

uncovered_constructs:

  - construct: A nested type reached through a CONSTRUCTED generic
    what: >
      `Box<int>.Wrapper.Info()` -- naming a nested type through an instantiation of its generic
      enclosing type. MIST_PARSE_INCOMPLETE on BOTH pipelines, measured while landing order 66, so it
      is a gap in the SHARED grammar rather than in either backend. Not a node kind the census counted;
      recorded here because it is the one nested-type shape order 66 cannot reach, and because a reader
      of that order would otherwise expect it to work.
      NestedScoping dodges it by naming `Wrapper` only from inside `Box<T>`, where the simple name
      suffices. That is also the only position from which a definition CAN be named, so the parse gap and
      the emitter's respell-with-parameter-names rule are two views of the same limit.
    disposition: needs-sample

  - construct: OperatorMemberMemberDeclarationNode
    what: User-declared operator overloads
    disposition: stdlib-only
    capability: operator-overload-declarations
    note: >
      The sharpest gap in the suite. Declared in 16 stdlib files, dropped silently by the
      emitter, and unreachable from any sample. Every arithmetic and comparison operator on a
      Mist primitive depends on it.

  - construct: IntrinsicModifierModifierNode
    what: The intrinsic modifier
    disposition: stdlib-only
    capability: intrinsic-member-declarations

  - construct: BinaryLiteralExpressionPrimaryNode
    what: Binary integer literals
    disposition: needs-sample
    note: Primitives covers decimal and hex but not binary.

  - construct: BinaryLiteralTypeArgumentTypeArgumentNode
    what: A binary literal as a dependent type argument
    disposition: needs-sample
    capability: dependent-type-parameters

  - construct: HexLiteralTypeArgumentTypeArgumentNode
    what: A hex literal as a dependent type argument
    disposition: needs-sample
    capability: dependent-type-parameters

  - construct: FalseLiteralTypeArgumentTypeArgumentNode
    what: A false literal as a dependent type argument
    disposition: needs-sample
    capability: dependent-type-parameters
    note: DependentTypes covers the true literal but not the false one.

  - construct: CharConstantConstantLiteralNode
    what: A char constant in pattern position
    disposition: needs-sample
