  - id: iterator-protocol-via-associated-type
    name: Enumerable protocol declared through an associated type slot
    order: 115
    layer: iterators
    requires: [associated-type-slots]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      The stdlib enumerable abstract type declares an enumerator SLOT rather than relying on a
      conventionally named method, so the element type comes from slot resolution rather than
      duck-typed lookup. Both a struct and a class enumerator work, over Iterators, banked.

      STANDARD.IENUMERABLE AND IENUMERATOR *ARE* THE CLR INTERFACES, and that is the whole shape of
      this capability. Mist declares them so its own types can conform; every use emits as
      System.Collections.Generic's, because foreach, LINQ and every framework API expect that one and
      a structurally identical duplicate would satisfy none of them. Lowering/ClrProjection.cs is the
      single place that knows it, with two consumers.

      THE SECOND CONSUMER IS THE SLOT LIFT, and it is the non-obvious one. IEnumerable declares
      `type Enumerator`, so associated-type-slots (order 74) lifted it and spelled `IEnumerable<int,
      CountSequence.Enumerator>` -- an arity the CLR interface does not have, because another assembly
      fixes it. So a projected abstract must NOT lift, and the enumerator survives instead as
      GetEnumerator's return type, which is also what keeps a struct enumerator unboxed. Classic
      special-cases the same two abstracts by display name in four separate places; here the rule is
      stated once and both the lift and the emitter read it.

      THE CLR PAIR INHERIT MORE THAN MIST DECLARES: the non-generic interfaces and IDisposable,
      obliging four members Mist never writes. IteratorBoilerplateEmitter synthesizes them, matching
      classic's choices exactly -- `object System.Collections.IEnumerator.Current => Current`, both
      GetEnumerator forwarders, an empty Dispose, and a Reset that throws NotSupportedException, which
      is what the CLR documents for an enumerator that cannot restart. They cannot be declared in
      Source/Standard because each body forwards to a member the CONFORMER declares, which the
      abstract cannot name. Reset and Dispose are emitted PUBLIC rather than explicit, deliberately:
      an explicit IDisposable on a struct enumerator would box it at the Dispose foreach performs.

      RESIDUE: only a DIRECT conformance is recognised. An abstract that itself extends IEnumerable
      gets no boilerplate and no projection, so a type reaching the protocol through it emits C# that
      does not compile. Classic has the same limit, and no sample reaches it.
    unlocks: []

