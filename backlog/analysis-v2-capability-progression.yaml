        admitting a promise; the fields a pure type emits `readonly`; the literal refusals as built; the
        culture exceptions; and the three test sources that renamed `local`.
      - >
        SpecProofCodeMatchesSampleTest's EveryExpectedOutputBlock_AppearsAsASlice_OfTheClassicBaseline now
