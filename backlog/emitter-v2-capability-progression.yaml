  - id: enum-variant-value-inference
    name: Variant value inference and declaration-time initializer evaluation
    order: 88
    layer: enums
    requires: [enum-declaration-over-readonly-base]
    v2_status: done
    verified_by: sample
    evidence: >
      Two inference rules by base kind -- a string base takes the variant's own name, an integral base
      counts on from the previous variant. Default base is byte filling from zero. NestedScoping is
      banked in AllFeaturesV2 and byte-identical to classic.

      EVERY VARIANT LEAVES CONSTRUCTION WITH AN EXPRESSION, which is where this DIVERGES FROM CLASSIC
      and is the more consequential of the two divergences taken here. Classic emits a WRITTEN value by
      re-emitting the syntax and an OMITTED one from a resolved constant on the model, so the two
      halves of one question are answered from two different places and only one of them is in the
      model. v2 binds a written value in Phase 3 the way a field initializer is bound, and SYNTHESIZES
      a literal for an omitted one in the same walk. Emission then has a single path and no backend has
      to know the inference rules or reach back to the syntax. Measured across eight shapes: string
      inferred, explicit and mixed; integral explicit, inferred and mixed; no annotation; and nested.

      COUNTING ON IS RELATIVE TO THE PREVIOUS VARIANT, NOT THE PREVIOUS EXPLICIT ONE, which this
      entry had stated as "previous explicit value plus one". Those differ for three or more
      consecutive omissions and the register's wording would have produced repeats. Mutation-checked:
      resetting the running value makes 401 become 0 and turns an unannotated enum into three aliases
      of zero.

      COUNTING SURVIVES A NEGATIVE VALUE, WHICH IS A THIRD DELIBERATE DIVERGENCE and a LIVE DEFECT IN
      CLASSIC, found by semantic review after this entry was first written done. A negative value
      binds as negation over a literal, not as a literal, so a constant tracker reading only literals
      loses it -- and classic's does: `Freezing = -10, Cold` gives Cold = 0 on classic, measured,
      silently landing on whatever value 0 collides with. v2 folds negation and gives Cold = -9. A
      written value the binder genuinely cannot fold -- a const reference, arithmetic -- REFUSES the
      NEXT omitted variant as MIST_PM_ENUM_VALUE_NOT_COUNTABLE rather than guessing, because a wrong
      guess merges variants the author believes are distinct.

      A SYNTHESIZED VALUE IS RANGE-CHECKED AGAINST THE BASE, same review, same day. The unannotated
      default base is byte, so `A = 255, B` -- or any plain enum past 256 variants -- walked off the
      base by the compiler's OWN arithmetic and died as CS1503 against generated C#, the exact failure
      the emitter's contract promises to prevent. Now MIST_PM_ENUM_VALUE_OUT_OF_RANGE at the variant,
      naming the value it would have taken. WRITTEN values are deliberately not checked: that is
      general initializer type-checking, which belongs to whatever v2 grows for every initializer
      rather than to an enum special case. Recorded as the third analysis-phase task.

      A BASE WITH NO SUCCESSOR REPORTS RATHER THAN GUESSING. A struct or class base has no next
      instance, so a variant omitting its value over one is MIST_PM_ENUM_VALUE_NOT_INFERABLE.
      Reported at construction because it stops the variant getting a value at all. LIVE DEFECT IN
      CLASSIC, measured: it infers an integral zero whatever the base and emits `new Vec2(0)`,
      failing as CS1503 against generated C# with no Mist-level cause. Found by mutation --
      suppressing the string arm crashed the v2 emitter on a null value, which is what showed the
      null was reachable at all. All three diagnostics land on the VARIANT's own node, stashed for
      the purpose; the enum's node is only the fallback for members with no syntax behind them.

      DUPLICATE VALUES ARE NOT DETECTED, and the consequence is now decided rather than latent. Under
      one structural equality notion two variants sharing a value are ALIASES and the first one
      declared names them both, which is what C# enums do with a repeated value -- measured, `Second`
      prints `First`. Classic refuses the program outright with MIST_SB_0085, so its own recorded
      print-versus-match inconsistency turns out UNREACHABLE there; the inconsistency was real only in
      the emitted shape, never in a program classic would compile. Detection is logged below.
    analysis_phase_tasks:
      - >
        Report two variants sharing an underlying value. Classic's MIST_SB_0085 is the model. Deferred
        rather than built because it judges a finished set of variants and nothing about it stops one
        being built -- and because the emitted behaviour without it is coherent rather than broken,
        aliases naming the first variant. Landing it makes the alias case unreachable, which is what
        makes the equality decision on order 89 permanent rather than provisional.
      - >
        Type-check a WRITTEN variant value against the base. `A = 300` over byte and `A = 5` over a
        string base both bind unremarked and die in Roslyn. Not an enum rule: it is initializer
        type-checking, the same judgement every field initializer wants, so it belongs to that
        machinery when v2 grows it rather than to a per-construct check here. The SYNTHESIZED path is
        already range-checked, that arithmetic being the compiler's own.
    unlocks: [NestedScoping]

  - id: enum-conversion-operators
    name: Enum conversions to and from the underlying type
    order: 89
