  - id: tuple-patterns
    name: Tuple positional patterns
    order: 103
    layer: tuples
    requires: [tuple-types-and-literals, logical-patterns]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      THE FIRST REGRESSION GUARD ON ORDERS 90-99. Both samples are banked in AllFeaturesV2, so the
      patterns layer's emission is now held to a baseline diff instead of to hand verification. Orders 93
      and 99 were the two that shipped unguarded: TuplePatternMatching exercises order 99's
      `var __eN when` machinery through enum variants in tuple elements, and SwitchExpressions'
      `{ Item1: 0, Item2: 0 }` reaches order 93's property patterns over a tuple, which cost nothing extra
      once a literal existed because member lookup already resolved Item1.

      THREE GRAMMAR ALTERNATIVES, VERIFIED EMPIRICALLY BEFORE ANY DESIGN, because the ordered choice is
      not obvious from the rules: `(int, string)` is a valid type reference, so the TYPE alternative claims
      any tuple followed by a name. `u is (int, string)` and `u is (int i, string s)` are tuple patterns;
      `u is (int, string) whole` and `u is (int x, int y) whole` are type patterns. Nothing but the
      trailing name decides. Recorded as four tests asserting the MODEL each reading produces, that being
      the consequence worth pinning.

      WHAT `is (int x, int y) named` BINDS was the open question, and the answer is that the element names
      mean LOCALS, as they do in C#. It arrives as a type pattern over a NamedTupleType, where the names
      are names on the TYPE, and the binder lifts them: a TuplePattern whose elements each bind one name at
      one element type, plus a whole-value binder. THIS IS WHERE `Binding` BEING SINGULAR PER NODE GETS ITS
      FIRST REAL TEST AT THE PATTERN NODE LEVEL -- order 93 established the subpattern half, and here a
      node genuinely needs its own binder as well as its subpatterns'. Singular per node, not at most one
      beneath.

      DECONSTRUCT OR TYPE-TEST IS DECIDED AT CONSTRUCTION and recorded on the pattern, because the two are
      different C# CONSTRUCTS and not two spellings of one. A scrutinee already typed as a tuple takes a
      bare positional pattern; one that is not has to name the ValueTuple first. Where the scrutinee is not
      a tuple, the type to test is read back OFF the element patterns, which works only while every one of
      them names a type -- `u is (0, 0)` says the elements equal zero and not which tuple holds them, so
      the whole `is` parks. Substituting `unknown` for the unnameable element would have emitted, compiled,
      and never matched, the runtime value being a tuple of ints and not of objects.

      OPEN QUESTION 1 WAS SHARPER THAN RECORDED. The guess was that TypeNameEmitter emits near-valid C# by
      accident. It does not: C# reads `(int, string)` in PATTERN position as a positional pattern, so
      `box is (int, string) pair2` against an `unknown` is not a near-miss type test but a DECONSTRUCTION
      of object, which has no Deconstruct (CS8129). A second spelling was needed --
      `System.ValueTuple<...>` -- and it is the sample that guards it: mutation-checked, collapsing
      EmitAsPatternType into Emit fails the Tier 6 diff and nothing else.

      ONE HOISTING WALK, NOT TWO. An enum variant lowers to a static readonly field, which C# will not
      admit in a pattern, so a variant in a tuple element becomes `var __eN` in the pattern plus
      `__eN == Variant` beside it -- in a `when` guard for an arm, in a trailing `&&` for an `is`. The
      collect and the rewrite are the SAME walk, threading a list that `or` and `not` clear: two walks
      agreeing by convention would have emitted a pattern whose comparison silently went nowhere. With the
      list cleared, the element falls to EmitComparison and is refused there, which is order 99's existing
      refusal reached rather than duplicated. Unifying this SIMPLIFIED EmitArm: order 99's whole-pattern
      case is now the same code path with one hoisted test.

      A PRE-EXISTING V2 GAP HAD TO BE FIXED TO BANK ANYTHING, and it is not about tuples. Mist scopes a
      pattern binding to the branch its condition guards; C# scopes it to the block CONTAINING the `if`.
      So a name reused later in the same Mist scope collided (CS0136) against a binding Mist considered out
      of scope. Classic wraps such an `if` in an extra braced block; v2 did not, and `if (a is Dog d) { }`
      followed by anything else named `d` failed before this order. Construction records whether the
      condition bound anything -- it is the only party that knows -- and emission contains it. Reproduced
      on a two-local program with no tuple in it, so the gap is independent of this layer and was merely
      first reached by it.
