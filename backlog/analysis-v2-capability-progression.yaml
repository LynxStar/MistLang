      Scoped formatting of the seven C# files and final `dotnet format Mist.slnx --verify-no-changes
      --no-restore` both exited 0 with no diagnostics; `git diff --check` was clean.
    tasks:
      - >
        THE ADVERSARIAL HUNT IS OPEN WORK. Arthur decided on 2026-09-27 to record it rather than finish
        it. The hunt worked like this: independent agents, each given one angle (aliasing, dispatch,
        Standard, inference), wrote small Mist programs that the analysis ADMITTED even though they break
        a promise the spec makes. Examples are a pure method that ends up printing, one that writes
        through a frozen input, or one that reads state that can change. Each agent compiled and ran its
        programs, and reported every one of them as a hole. Three rounds reported 31, 50 and 44 holes, 125
        in all. They are the branch's rounds three to five, hence PurityRoundThree/Four/FiveTests; rounds
        one and two were reviews, closed in commits 6afd4d17 and 34f77aef. 112 holes were closed, each
        with a Tier 2 row. 11 of the other 13 were the current culture, which decision A closes (see the
        evidence's culture paragraph), and the last 2 are the two DECISION LEFT items below. The count per
        round did not fall, so the hunt has not converged, and nothing shows that another round would find
        fewer. It stops here because it was recorded, not because it ran dry. The later holes were
        narrower. They included static constructors run through a method group, a computed static
        property, an operator or a conversion; an enumerator's Dispose at the end of a foreach; list
        patterns and index-from-end running Count and the indexer; and the emitter re-resolving an
        overload in restated, flattened and specialized bodies, so that what ran was not what was judged.
        They sit where the language turns one construct into calls the judge does not see written. That
        is where the next round should look first.
      - >
        OPEN CATEGORY: calls inserted by desugaring. User conversions in conditions and array sizes were
        found in round five; other positions are unmeasured.
      - >
        OPEN CATEGORY: aliasing through arguments. Aliasing of owned bindings is tracked for stores into
        non-local targets, tuples, anonymous objects and initializer entries. It is not tracked for
        non-owned call arguments or for what a callee returns (`Keep(o)`, `var alias = Id(o)`). Treating
        every non-owned argument as an alias would refuse `Print(o); Bump(o);`.
      - >
        OPEN CATEGORY: readonly formatting. Only holes of Mist types that implement IFormattable are
        judged in readonly contexts. A type parameter instantiated with an impure Mist IFormattable stays
        unjudged; judging it refused samples/OpenUnions.
      - >
        CLOSED 2026-09-27 (workstream 11): generic extension signature views retain their canonical
        source declaration and closed contracts. Purity and readonly inference analyze that declaration's
        body with coherent identities; the workstream evidence above records the regressions.
      - >
        OPEN CATEGORY: a readonly class that holds nothing changeable counts as unchangeable, although a
        class that is not readonly may derive from it. That is sound only because narrowing from it to a
        changeable type answers External and Mist has no overriding; refusing the derivation instead would
        be a language decision.
      - >
        OPEN CATEGORY: a pure function type keys its ambient context separately, and keys must match
        exactly. A plain `with func` push does not satisfy a `with Step` clause, and a pure push no longer
        satisfies a plain `with func` clause. Nothing refuses an unsatisfied clause at compile time, so the
        mismatch shows at run time as a KeyNotFoundException.
      - >
        RECORDED AS SOUND, NOT OPEN: some losses of precision. A frozen binding that is ever reassigned
        answers External; in a readonly context a ref returned by a call is External; and reading any
        static runs its type's static initializers, so a stable static of a type with an impure static
        initializer is refused.
      - >
        DECISION LEFT (1): an owned binding stored into a non-owning holder is not a move. Storing one into
        an owned field or property is now a move (ownership-v2 Req 4.1 and 6.9), which classic does not
        treat as one. A store into a field that does not own leaves the alias alive after the binding
        moves into a pure scope. Classic admits it. Making that store a move, or refusing it, is an
        ownership-v2 decision.
      - >
        DECISION LEFT (2): an extension shadowed by a CLR instance member (backlog/general.md). v2 now
        emits calls to extensions from Mist blocks in carrier (static) form, so the extension Mist bound is
        the one that runs; classic runs the CLR member, and v2's output differs where one shadows the
        other. ToString/0, GetHashCode/0 and Equals/1 keep the instance spelling. An extension method group
        converted to a delegate is still spelled in instance form, where Roslyn can re-bind it. Whether
        that divergence from classic is the answer has not been decided. general.md's Action, "emit the
        call through the extension's carrier class", describes the part that has shipped.
      - >
        ALSO OPEN: an accessor may state only its promise. A getter takes no other modifier, and a setter
        takes only `private`. `readonly` alone has no accessor spelling, only `local readonly` or `pure`,
        and no other accessor-level modifier has been specified.
      - >
        ALSO OPEN: a plain function value in a readonly context is refused. A declared readonly member may
        now call only a pure function value (MIST_PA_READONLY_CONTEXT_CALLS_MUTABLE on `f(...)`), because
        no function type states readonly. Whether Mist wants a readonly function type, or wants to admit
        the call, is undecided.
      - >
        DEFERRED by Arthur on 2026-09-27 ("I probably do want it but let's not complicate"): `local`,
        `local readonly` and `pure` on enums and newtypes. Requirement 15.1 now admits them on class,
        struct and abstract declarations only and names the gap as the spec's Deferred item 2;
        ModifierBuilder.Misplaced refuses them on an enum and a newtype (MIST_PM_PURITY_MODIFIER_PLACEMENT),
        while `readonly enum` and `readonly type T = new int;` compile. Probed 2026-09-27: `public pure enum
        Color` is "'pure' is not valid on an enum." and `pure type Meters = new double;` is "'pure' is not
        valid on a newtype."
      - >
        DONE 2026-09-27: the root CLAUDE.md carries no counts. Its figures for specs, capabilities, samples
        and analysis_phase_tasks were behind measurement (Arthur: "what value is there in maintaining the
        count of the samples in the root claude?"), so they were removed with his approval; the registers
        are grepped for a number when one is needed. Measured that day with PyYAML, for the record: 187
        capabilities, 92 samples (91 AllFeaturesV2 references plus Testing), 92 analysis_phase_tasks, and
        123 directories under .kiro/specs.
      - >
        DONE 2026-09-27, in this change: CULTURE, THE COMPILER'S OWN READ. LiteralBinder parsed decimal,
        float and double literals with TryParse and no provider, and BodyEmitter formatted them with none:
        under LANG=de_DE.UTF-8 `mist run` turned 1.5 into 15.0 and printed 15, and under sv_SE every
        fractional literal became 0 with no diagnostic. LiteralBinder now reads every numeric literal with
        the invariant culture and drops `_` separators and the u and l suffixes, so 1_000 and 0xFFu, which
        bound as 0 on v2, read correctly. What it cannot hold is refused with
        MIST_PM_NUMERIC_LITERAL_OUT_OF_RANGE instead of binding 0: an integer or hex literal whose digits
        pass long (ulong, with a UL suffix), a float or double literal that is not finite, a decimal past
        decimal's range. -9223372036854775808L (long.MinValue) is admitted after a unary minus, as C# and
        classic admit it. A dependent-value literal in a type argument (Wide<5L>, Narrow<1_000>,
        Narrow<0x1_0>), which lifted 0, is read the same way, with two differences. It must fit a long,
        since LiftedType holds a long, so a ulong dependent parameter takes values up to long.MaxValue:
        `new U<18446744073709551615UL>()` is refused with MIST_PM_NUMERIC_LITERAL_OUT_OF_RANGE naming
        'long', although `ulong x = 18446744073709551615UL;` compiles (the merge base lifted it as 0;
        classic cannot compile the probe). And a binary literal is read in a type argument
        (Narrow<0b1_01> lifts 5) but not yet in an expression, which does not bind one.
        BodyEmitter.EmitLiteral writes R for
        double and float, and decimal's invariant form. DiagnosticBag formats a message's arguments
        invariantly, CSharpCompilationDriver takes a Roslyn message in the invariant culture, and the CLI
        formats its timing summary invariantly, so Requirement 13.3's "the compiler reads no culture" holds
        for everything the build prints. VariadicUseRegistry orders the width specializations it emits
        with StringComparer.Ordinal, where the default comparer was the current culture's; its keys are
        digits and underscores, so the emitted order was already stable. Not a culture read, and open: an
        unsuffixed literal beyond int's range but within long's is typed int and reaches Roslyn as
        MIST_CS_ERROR, and the refusal's message names 'int' for the long range it checks
        (backlog/general.md). The literal review found seven more misreads that the merge base 13b67c0e
        shares, each now its own backlog/general.md entry: a u literal past uint truncated where it is
        emitted (5000000000u prints 705032704); a hex literal typed int whatever its suffix, and sixteen
        hex digits with the top bit set read as a negative long; char escapes read as the backslash; a
        binary literal unbound in an expression; a sized array's length written with `_` or a suffix read
        as 0; an explicit ToString() refused on a Mist class that declares only ToString(string,
        IFormatProvider); and `-(-x)` emitted as the C# pre-decrement `--x`. The ulong dependent-parameter
        limit above is the eighth entry. Tests: LiteralCultureInvarianceTests (26 Tier 1 rows reading and
        writing each literal kind under de-DE and sv-SE, and a Tier 2 fact for the refusal),
        NumericLiteralBindingTests (Tier 2, 23 rows: long.MinValue under a minus, dependent-value literals
        and their refusals), RefinementSiteTests' negated-real theory (Tier 2, 3 rows: a negated float,
        double or decimal bound quoted as '> -0.5' in a finding), and CultureInvariantEmissionTests (Tier
        4), whose in-process compile runs under de-DE. Measured on the
        previous round's 77 scratch probes, compiled under nine locales: the emitted C# and every
        diagnostic are byte-identical across locales.
      - >
        DONE 2026-09-27, in this change: CULTURE, THE PHASE 3 REVIEW. Every emitted form the invariant rule
        missed is closed. A method group of a respelled member (String.ToUpper, Convert.ToInt32, List.Sort,
        Regex.IsFullMatch, which failed in C#) or of a number's own ToString is a lambda over the respelled
        call, its receiver evaluated once (Lowering/RespelledGroups). `x?.ToString()` keeps the `?.` with
        the invariant provider on an optional numeric, and is MistInvariant.Optional(x) on an optional
        type parameter. List.Sort() reads the element type from the List<T> the receiver reaches: through
        a subclass's base types, a generic subclass's substitution, and a type parameter's bounds. A
        Console argument C# converts to a number -- a newtype over a numeric, an enum over one, a Mist type
        with an implicit numeric conversion -- is written as the conversion C#'s overload resolution picks,
        formatted invariantly; a char, or a type that is or converts to one, is left as written, since C#
        prefers WriteLine(char). A KeyValuePair formats as [key, value] through MistInvariant.Text, and an
        explicit ToString() that a CLR type declares, and its method group, goes through MistInvariant.Text
        as interpolation does. MistInvariant.Text's last arm runs the value's own ToString with the current
        thread's culture set to the invariant culture for that call and restored in a finally, which closes
        the anonymous object (`{ Price = 1,5, Delta = -2 }` under sv_SE) and CLR values that format
        themselves by the culture without IFormattable (Lazy<double> printed 1,5 under de_DE). A pure scope
        still refuses such a hole (FormatsByType), since its ToString is code the program cannot see.
        Tests: InvariantCultureIndirectFormEmissionTests (Tier 3, 22 facts over HandBuiltModel) pins each
        form; InvariantCultureEmissionTests, 18 rows over the real Standard sources at commit 66ac194b, is
        rebuilt over HandBuiltModel with 19; and the Tier 4 program gained a method-group line, a `?.ToString()`
        line, Console of a newtype over double and a KeyValuePair line. Mutations -- LiteralBinder's double
        parse switched to the current culture, RespelledGroups.Applies disabled, the Pair arm removed --
        failed 10 tests, the Tier 4 test among them. The review's ordering question is closed by decision B
        (the evidence's process-boundary paragraph), not by code, and Requirement 13.2 now says what is
        emitted: ordering and case mapping use the invariant culture, and equality is ordinal.
      - >
        DONE 2026-09-27, in this change: CULTURE, THE THIRD REVIEW. A review of the second round built a
        private compiler from the tree and ran 158 earlier probes and 50 new ones under C, tr_TR, de_DE,
        sv_SE, ar_SA and fa_IR. It found three regressions this branch introduced, none of them
        locale-dependent, and each is fixed in Lowering/InvariantCulture. (1) Console of a CLR enum printed
        its number: `Console.WriteLine(DayOfWeek.Monday)` was emitted as
        `((int)d).ToString(CultureInfo.InvariantCulture)` and printed 1, where the merge base 13b67c0e and
        classic print Monday. Only a Mist enum, emitted as a record with an implicit operator to its
        underlying type, converts to a number in C#. A CLR enum is now left as written, and C#'s
        WriteLine(object) prints its name and reads no culture. (2) The conversion taken for a Console
        argument was not always C#'s: the order ranked every pair and put byte ahead of int. A type with
        implicit conversions to byte (returning 1) and int (1000) printed 1 where classic prints 1000, and
        one converting to double (1.5) and decimal (7.25m) printed 1.5 where C# and classic refuse the
        call as ambiguous. The choice now ranks Write's own numeric parameters (int, uint, long, ulong,
        float, double, decimal) by C#'s better-conversion-target rule, leaving decimal unranked against
        float and double, and takes the most encompassing conversion that reaches the chosen parameter;
        where C# has no single choice, or prefers char, bool or string, the argument is left as written
        for Roslyn to judge. (3) List<T>.Sort() over a clone of an ordered intrinsic threw:
        `type Label = new string;` or `type Meters = new double;`, sorted bare, raised
        InvalidOperationException ("At least one object must implement IComparable") under every locale,
        since the emitted clone implements no IComparable. It now orders by the backing value through
        MistInvariant.ByValue, a String clone by StringComparer.InvariantCulture, which closes
        backlog/general.md's entry for it. Standard's List<T> is new on this branch, so the merge base had
        no such sort. The review also found the documents
        behind the code: Requirement 13.2 now names the sort through T, unknown or optional tuples as its
        second by-design exception, leaves the CLI to 13.3, and says a call either names the invariant
        culture or runs under it for that one call (MistInvariant.Text's last arm), which the book
        mirrors; design.md's literal paragraph, test records and Console and Sort bullets, and tasks.md's
        counts, now match the tree. Its other findings predate the branch; THE COMPILER'S OWN READ above
        lists them, each a backlog/general.md entry. Tests: InvariantCultureIndirectFormEmissionTests
        (Tier 3) grows to 34 cases, 25 facts and 9 rows, among them a CLR enum left as written, a pair of
        conversions C# finds ambiguous left as written, the conversion C# picks among several, and a text
        clone and a numeric clone sorted by their backing values; the Tier 4 program gained a DayOfWeek
        line.
      - >
        CULTURE, KNOWN AND ACCEPTED, each by design and each out of a pure scope's reach (Requirement 13.2 and
        design.md's Emission section list them). A qualified `System.Console.WriteLine(3.5)` is the CLR call it
        names (Requirement 9.2) and prints with the current culture; it states no promise, so no pure scope can
        call it. The same holds for any CLR member Standard does not declare. A tuple held at run time in an
        `unknown` or T element orders through MistInvariant.Comparer<T>, which orders two strings invariantly
        and anything else by Comparer<T>.Default, so the tuple's text is ordered by the current culture; a list
        of optional tuples keeps the plain Sort(). A pure scope refuses both sorts (ElementComparisons; probed:
        Sort on an owned List of `(string, int)?` is MIST_PA_PURE_SCOPE_CALLS_IMPURE). Requirement 13.2 names
        these two as its by-design exceptions, and no others. The CLI's own output is not one of them: 13.3
        governs it, and its timing summary is formatted invariantly.
      - >
        CULTURE, A DECISION: an explicit `d.ToString()` on a primitive is still refused in a pure scope
        (Requirement 9.1; the universal ToString states no promise), although emission is now invariant.
        Admitting it is a separate decision. The book tells the reader to interpolate instead.
      - >
        CULTURE, RUNTIME DIFFERENCES FROM CLASSIC. An explicit `x.ToString()` on a type parameter, `unknown` or
        a CLR value now goes through MistInvariant.Text, which answers "" for null where C#'s ToString throws
        NullReferenceException. The same holds for an absent optional (`none?.V.ToString()` answers "", where
        interpolating it prints "Void"; classic refuses the program with MIST_TC_0073). What text the universal
        ToString gives an absent value is undecided.
      - >
        CULTURE, NOISE. A CLR-projected Boolean, such as a CLR Predicate's result, is classed as decided at
        run time and emits MistInvariant.Text: the output is the same, the emitted C# noisier. Every
        numeric Console argument carries a fully qualified
        ToString(System.Globalization.CultureInfo.InvariantCulture), since an emitted file may carry only
        the source's usings (ClrSpellingTests). OperandParenthesesEmissionTests' `"n=" + (b + c)` row gets
        its parentheses from postfix rendering too, so it no longer isolates the same-precedence rule; the
        subtraction and division rows still do.
