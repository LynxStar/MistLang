  - id: mist-tests-garbled-lexemes-without-a-lock-warning
    test: Mist.Tests (465 of 5890, no single test implicated; RefusalCorpusTest and AllFeatures among them)
    file: Test/Mist.Tests
    discovered: 2026-09-12
    status: fixed
    symptom: >
      `dotnet test Mist.slnx --no-build` reported 465 failures in Mist.Tests, finishing in 1m5s against
      4m44s for the green rerun. The messages are the incoherent kind: 625 of
      "MIST_INTERNAL_AST_UNIT_MISMATCH: AST count (1) does not match compilation unit count (33)", and
      MIST_UNDEFINED_TYPE for names no source declares -- 'derly', 't', 'i', 'e' -- beside 268 of
      MIST_UNDEFINED_NAMESPACE for `Standard`. Failures span classic and v2 tests alike. The other two
      test assemblies passed.
    cause: >
      A TEST POISONED THE PROCESS-WIDE STDLIB PARSE CACHE, confirmed 2026-09-14 by deliberate replication
      and by a natural reproduction from unmodified test code. CompilerDriver kept the lexed and parsed
      standard library in a static shared by every driver in the testhost, while the lexer and parser are
      injected per driver. PipelineBackendPropertyTests.PipelineShortCircuit_LexErrorSkipsParser builds a
      driver whose lexer reports an error for EVERY unit, the 32 stdlib units included, so its compile
      lexes and parses nothing. If that compile was the first to reach the cache write, the cache held
      (0 token streams, 0 ASTs) for the rest of the process.

      EVERY LATER COMPILE THEN MISALIGNED. Both pipelines pair AST i with unit i. v2 checks the counts
      and reports AST count (1) against (33) -- one user AST, 32 stdlib units plus the user's. Classic
      does not check: it pairs the user's AST with Bootstrap/Action.mist, the first stdlib unit in
      ordinal order, and slices that file's text with the user's spans, which is where 'fixing' (a word
      in Action.mist's comment), 't', 'i', 'e' and the missing Standard namespace come from. 'derly'
      comes from a multi-file sample compile slicing one user file's spans against another's.

      IT IS OCCASIONAL BECAUSE XUNIT SHUFFLES COLLECTIONS. xunit 2.9.3 starts test classes in an order
      that differs from run to run on identical binaries (measured: two runs of the same filter started
      classes in different orders). LexErrorSkipsParser is always the first test of its class, so the
      process is poisoned exactly when PipelineBackendPropertyTests is among the classes that start
      before any real compile finishes parsing the stdlib -- 22 of 984 classes in a measured green run,
      more when a loaded machine slows that first parse. A draw, not a load failure, which is why every
      rerun was green.
    evidence: >
      The same garbled-lexeme signature as mist-tests-mass-failure-under-stale-copy, but WITHOUT that
      entry's cause: the build immediately before reported 0 warnings, so no MSB3026 lock was hidden,
      and it was not piped into anything that closes early (grep and sort drain their input). The test
      run started within seconds of that build returning. No `dotnet format` ran alongside it.
      Nothing was rebuilt between the failing run and the rerun: Mist.Core.dll in Source/Mist/bin and
      Test/Mist.Tests/bin, and Mist.Tests.dll, carried the same 23:46 timestamps and hashes before and
      after, and the rerun three minutes later on those binaries gave 5890/5890. The copied
      Test/Mist.Tests/bin/.../Standard tree still carries its 15:57 timestamp, so the stdlib copy was not
      rewritten either. Seen while landing declared cast operators as calls; that change touched
      Source/Mist (binding, CastAnalyzer, CastLowering, diagnostics) and four ProgramModelProbe test
      classes, about 75 tests, all of which passed under --filter before the full run and again in the
      rerun, so it cannot account for 465 failures across unrelated classes.

      REPLICATION, 2026-09-14, on cc43c5ff, every run captured through tools/test-ledger/run.sh. Five
      measurements, each checked against a control.

      (1) The consequence. A scratch test that ran LexErrorSkipsParser's body and then compiled one
      program read the static cache through reflection: null before, tokens=0 asts=0 after. Classic
      then reported MIST_UNDEFINED_NAMESPACE for `Standard` against Action.mist, and v2 reported "AST
      count (1) does not match compilation unit count (33)" verbatim. In a fresh process without the
      ErrorLexer step the cache filled with 32 and 32 and both pipelines compiled clean.

      (2) The natural trigger, unmodified test code. `--filter` on PipelineBackendPropertyTests plus
      CrossFileTypeResolutionTests: 9 of 13 failed, all nine CrossFile scenarios on `Standard`, 3 runs of
      3. CrossFileTypeResolutionTests alone: 9 of 9 passed, 2 runs of 2.

      (3) The whole signature. A module initializer that ran LexErrorSkipsParser before any other test,
      then all of Mist.Tests: 468 of 6053 failed in 79s -- against this entry's 469 of 6052 in 1m30s --
      carrying 'fixing', 'derly', 't', 'i', 'e', "AST count (1) ... (33)", MIST_UNDEFINED_NAMESPACE for
      `Standard`, three of "ErrorType has no TypeKind", and "Expected 'Program.cs' in emitted files.
      Got: [Action.cs]". Every message this entry and mist-tests-mass-failure-under-stale-copy recorded
      came back from the one trigger.

      (4) The draw. A green natural full run with a watcher thread on the cache: first populated at
      +782ms with 32 and 32, by which time 22 of 984 classes had started; LexErrorSkipsParser started
      at +7.4s, its class 88th, after the cache was full. Class start order differed between two
      identical filtered runs.

      (5) The fix. After it, (2) passed 13 of 13 in 3 runs of 3, and (3) passed 6055 of 6055: the
      ErrorLexer compile left the cache empty and the next compile filled it with 32 and 32.

      NOT CAPTURED: a natural full-suite run that drew the poison under the watcher. From (4) the odds
      are something like 22 in 984 a run on a quiet machine, and fifty runs to catch one was not worth
      it once (2) had reproduced it from real test code.

      THE RECURRENCES BELOW, both "cause still unknown" when written, carry the replicated signature:
      "AST count (1) ... (33)", `Standard`, 'e', 't', 'i', and 'Func', 'Span' and 'Action', all of which
      (3) produced. The second notes that every mass failure began seconds after a solution build and no
      green rerun had one. That fits without being measured: the poison needs PipelineBackendPropertyTests
      to start before the first real compile finishes parsing the stdlib, and a first compile straight
      after a build runs with a cold JIT and file cache, so it parses slower and the window is wider.
    fix: >
      APPLIED 2026-09-14. The cache moved into Source/Mist/Driver/StdlibParseCache.cs. It records an
      entry only when the compile produced a token stream and an AST for every stdlib unit, serves an
      entry only to a compile with the same stdlib unit count, and is published with
      Interlocked.CompareExchange rather than written as a struct under a lock and read without one.
      CompilerDriver takes it through an internal constructor, so
      Test/Mist.Tests/Driver/StdlibParseCacheTests.cs drives the ErrorLexer-then-real sequence against a
      private instance -- deterministically, without racing the rest of the suite. Each of that file's
      two tests fails when its guard is removed and passes with it.

      The same class of silent short population was closed in the two other stdlib caches:
      StdlibLoader no longer caches an empty listing and reads its cache without a torn Nullable, and
      Test/Mist.Tests/Helpers/StdlibTestHelper.cs uses Lazy and throws on a stdlib unit that does not
      lex and parse instead of skipping it.

      AFTER EVERY FIX IN THIS REGISTER LANDED, ten consecutive `tools/test-ledger/run.sh Mist.slnx` runs
      (2026-09-14, 00:25-01:35) were 10 of 10 green at 6786 tests, with no other worktree's test process
      running when any of them started. Ten runs cannot measure a two-per-cent flake on their own; the
      evidence for this fix is (5) above, where the trigger that failed 468 tests passes 6055.
    recurrences:
      - date: 2026-09-13
        detail: >
          469 of 6052, finishing in 1m30s against 5m29s and 9m39s for the next two runs. Seen on the first
          full run after rebasing claude/newtype-revision-loose-ends-7317d8 onto main, which brought in
          four commits (type argument fixing by dominance). The messages that survived the output filter are
          the incoherent kind again, but a new one: "System.InvalidOperationException : ErrorType has no
          TypeKind -- it is an error sentinel", from classic's model, beside a property test reporting that
          no constructor error was emitted. Failures spanned Analysis (146), Backend (134), Semantics (71),
          Integration (64), Variadics (41), Driver (7) and ReadonlyContexts (6). The run was
          `dotnet format Mist.slnx --verify-no-changes 2>&1 | tail -3; echo; dotnet test Mist.slnx`: format
          chained BEFORE the test run rather than beside it, and tail drains its input, so neither known
          trigger applies. A `dotnet build Mist.slnx` had returned "Build succeeded" with no warning
          immediately before. Tests from three of the failing classes then passed under --filter with
          --no-build, the next full run failed 1 of 6052, and the one after passed 6052 of 6052, all on the
          same rebased source with nothing edited. Cause still unknown.
      - date: 2026-09-13
        detail: >
          465 failures again, of 6081, in 1m42s against 7m14s for the green rerun, with the same messages: 647
          lines of MIST_INTERNAL_AST_UNIT_MISMATCH "AST count (1) does not match compilation unit count (33)",
          266 of MIST_UNDEFINED_NAMESPACE for `Standard`, and MIST_UNDEFINED_TYPE for 'e', 't' and 'i' beside
          'Func', 'Span' and 'Action'. Classic and v2 classes alike, samples and the refusal corpus among them;
          the other two assemblies passed. The run was chained straight after `dotnet build Mist.slnx`, which
          reported 0 warnings and 0 errors and rewrote Test/Mist.Tests/bin/.../Mist.Core.dll at 22:19:17;
          Mist.Tests.dll there carried 22:16:48 and the copied Standard tree 11:03:26, and none of the three
          changed before the rerun. Five of the failing classes (75 tests) then passed under --filter, and a
          full `--no-build` rerun on those binaries, with nothing edited or built, gave 6081 of 6081. The
          change under test removed the signed-over-unsigned tiebreak from OverloadResolution and widened
