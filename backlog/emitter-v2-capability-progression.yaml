        fields, the declaring type for statics -- rather than implement it on the old premise. No
        program is known to need it; the case is that C# and Mist agreeing on simple-name lookup is
        currently an unstated invariant rather than something the emitter enforces. Shared with
        static-fields, order 21. Weigh against the churn: it rewrites every field reference in every
        generated file.
