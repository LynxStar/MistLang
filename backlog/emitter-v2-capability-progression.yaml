  - id: user-defined-conversion-insertion
    name: Insert a user-defined conversion at assignment and argument sites
    order: 46
    layer: conversions
    requires: [cast-operator-declarations, base-type-list, constructor-chain-base,
               constructor-chain-args-referencing-parameters,
               operators-arithmetic-comparison-logical, string-interpolation,
               var-type-inference, standard-library-binding,
               implicit-instance-field-access]
    v2_status: partial
    verified_by: v2-semantics
    evidence: >
      PARTIAL, on its own name: no conversion is INSERTED at an implicit site. What exists is the
      relation that decides whether one is available, which is enough for overload selection and enough
      for CastOperators to run. The residue is unreachable from that sample -- see the first task.

      Nothing in the syntax marks these. An assignment from Celsius to Fahrenheit requires
      searching the SOURCE type for an implicit operator to the target, and an argument
      passed to a Fahrenheit parameter requires the same search driven by the parameter
      type. Casts must resolve against the static type only.

      THE SAMPLE CANNOT VERIFY THIS, and that still holds. Its two implicit sites bind with no
      diagnostic whether or not the operator exists: no assignability rule runs, because RunAnalyzers
      is a stub, and PrintTemperature declares ONE overload, so OverloadResolution returns the lone
      closed candidate without consulting applicability at all. Both sites would bind identically with
      the operator deleted. So the sample going green is not the evidence here; the probes below are.

      AND IT WAS WORSE THAN A FALSE GREEN. With TWO overloads, applicability does run, and v2 REFUSED
      a program classic compiles and runs: `Show(Fahrenheit)` and `Show(string)` called with a Celsius
      reported MIST_PM_UNRESOLVABLE_OVERLOAD, "No conversion is known from the given arguments to any
      of: (Fahrenheit), (string)". ConversionRelation knew identity, numeric widening and inheritance
      and nothing else, so the one conversion that made the call work was the one it could not see.
      Not a missing feature so much as a live defect that no sample was shaped to reach.

      Closed by admitting user-defined conversions into ConversionRelation, which is the single funnel
      OverloadResolution.IsApplicable already went through, so no per-site change was needed at either
      the assignment or the argument site. Both ends of a conversion are searched and each end's base
      chain with it, since either type may declare it. An operator matches on standard convertibility
      TO its parameter and FROM its return rather than on identity with either, which is what lets a
      derived source reach an operator its base declares -- measured working, and matching classic.

      EXPLICIT OPERATORS ARE EXCLUDED, and that is checked rather than assumed: the same two-overload
      probe with `explicit operator Fahrenheit` instead of `implicit` is still refused, as it must be.
      Classic refuses it too but only as a Roslyn error against generated C# ("cannot convert from
      'Celsius' to 'Fahrenheit'"), so v2 now reports it at the Mist source location instead.

      BOTH DIRECTIONS ARE GUARDED in OverloadSelectionTests -- one test that a user-defined implicit
      conversion makes an overload applicable, one that an explicit one does not, and a third pinning the
      ranking decision below. Two overloads in each fixture on purpose, since a lone candidate is
      returned without applicability being consulted at all. Confirmed discriminating by mutation:
      removing the operator search from IsImplicit fails the first, and admitting explicit operators into
      it fails the second.

      NO CONVERSION IS INSERTED AT AN IMPLICIT SITE, and this capability's name overstates what is
      built. An earlier note here said "nothing was needed in the emitter", which measured only whether
      the output RUNS. It does, because C# performs the conversion itself once the operator declarations
      are emitted, and classic relies on the same thing. But no node is inserted, so the model holds no
      record that a conversion happens at `Fahrenheit boilingF = boiling;` or at the argument site --
      the initializer is typed Celsius, the local is typed Fahrenheit, and nothing connects them.

      WHAT MIST ACTUALLY DECIDES IS ONE THING: whether an implicit conversion EXISTS, via
      ConversionRelation, consulted only by OverloadResolution.IsApplicable, which runs only where two
      or more candidates match on arity. That is the whole reach. Measured: with an explicit-only
      operator, an assignment `Fahrenheit f = c;` and a SINGLE-overload call `Show(c)` both pass Mist
      unremarked and are refused by Roslyn against generated C# with no line number -- CS0266 and "cannot
      convert from 'Celsius' to 'Fahrenheit'". So the implicit-versus-explicit distinction is enforced
      by the C# compiler at every site except a multi-overload call.

      RANKING DELIBERATELY DOES NOT USE THEM, and this is a LANGUAGE DECISION rather than a C# one. The
      relation answers two different questions. Whether an argument can REACH a parameter is exactly what
      an `implicit operator` declares, so applicability asks the full relation. Which of two parameters is
      the BETTER home needs specificity, and only a built-in conversion carries it -- `int` reaches `long`
      because every int IS a long, so int is the narrower home. A user-declared operator asserts no
      containment; it may be lossy, costly, or a change of units, as Celsius to Fahrenheit is. Ranking on
      it would read a claim the declaration does not make, and would let a call's meaning turn on an
      operator declared elsewhere between two parameter types.

      SO THE TWO ARE NOT ONE RELATION AT TWO STRENGTHS, and naming them as though they were cost a round
      of confusion. IsImplicit asks whether a conversion may happen unwritten; IsWithin asks whether every
      value of one type is already a value of the other. The second was first called IsStandardImplicit,
      which implied a non-existent "non-standard implicit" and made the superset calling the subset read
      backwards. CompareConversions and TypeArgumentInference.Wider ask IsWithin, IsApplicable asks
      IsImplicit, and FindOperator brackets an operator's ends with IsWithin so it cannot chain a second
      user-defined conversion.

      THE FIRST VERSION OF THIS ENTRY JUSTIFIED THE SPLIT BY THE C# SPEC AND HAD THE SPEC BACKWARDS.
      C# considers user-defined conversions when comparing conversion targets, so it RESOLVES the case
      below rather than refusing it -- measured, not read. Recorded because the error was appealing to C#
      at all: what Mist should do here is not settled by what C# does, and the appeal hid the fact that
      no one had asked the language question.

      SO THIS DIVERGES FROM CLASSIC, in the direction of v2 being stricter. Two overloads `Take(A)` and
      `Take(B)`, an argument reaching both by user-defined conversion and being neither, and `A` declaring
      an operator to `B`: classic compiles it and prints "took A", v2 reports MIST_PM_AMBIGUOUS_OVERLOAD
      and the message already names the remedy -- "Cast an argument to choose one". No sample reaches the
      shape, which needs all three conditions at once, and the full suite is green. Pinned by
      OverloadSelectionTests.TwoCandidatesSeparatedOnlyByAUserDefinedConversion_AreAmbiguous so the
      decision is guarded rather than incidental.
    tasks:
      - >
        Insert a conversion node at the implicit sites -- variable declaration, assignment, argument and
        return -- carrying the operator Mist selected, as CastExpression now does for an explicit cast.
        Four binder sites: StatementBinder.BindVariableDeclaration and BindReturn, ExpressionBinder's
        assignment path, and ArgumentBinder.Bind, each of which already pushes a target type and then
        discards the relationship. Needs no emitter change for the C# backend, for the CS0571 reason on
        order 44. THIS IS WHAT THE CAPABILITY IS NAMED FOR and it is the half still outstanding.
      - >
        Report an implicit site with no implicit conversion, which is what the two probes above show
        landing on generated C# today. Mist has the information at an argument site already and does not
        use it outside multi-overload selection. NOT a free change: it is a REFUSAL built on
        ConversionRelation, which carries a standing prohibition on exactly that while it stays partial
        -- so it waits on the relation being complete enough, as does the constructed-generic gap below.
      - >
        Search a CONSTRUCTED generic type's cast operators. Its operators are declared in terms of its
        type parameters and would have to be substituted through its arguments before they could be
        compared, so it is skipped rather than mismatched. No sample reaches it.
      - >
        DO NOT DELETE ConversionRelation.NumericWidening, which its own doc comment used to invite once
        cast operators were consulted, on the reasoning that scanning the stdlib's implicit operators
        reproduces the table. MEASURED FALSE: suppressing the table fails four overload tests, the
        narrower-target and genuine-tie cases among them. Ranking asks the standard-only relation on
        purpose, so a numeric widening has to be expressible WITHOUT consulting an operator, and being
        expressible that way is what the table IS. The comment is corrected in place.
    analysis_phase_tasks:
      - >
        Refuse a cast for which no conversion exists, which is what the sample's commented-out
        compile-time-safety case is about: `(Kelvin)m` where m is typed Measurement must fail even
        though the runtime value is a Weight that declares the operator. CastExpression now RESOLVES the
        operator, so the information is present -- a null Operator on a cast between unrelated types is
        the case to refuse. Deferred anyway, and not for want of the answer: null there means no
        operator was FOUND rather than none exists, since FindOperator brackets the ends more narrowly
        than C# does, so refusing on it is a refusal built on a partial relation. Classic's equivalent
        is TypeCheckerAnalyzer.CheckCastExpression.
    unlocks: [CastOperators]

