      DISTINCT CLOSED BASES ARE SEPARATE OBLIGATIONS (2026-09-26). Reaching IGeneric<int> does not
      answer or suppress IGeneric<string>. Reached shares AbstractInheritance with conformance
      mapping construction, deduplicating closed constructions while guarding cycles per path.
      Mapped property answers now compare the closed property type as well as its name. Two
