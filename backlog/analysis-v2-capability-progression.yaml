      cannot build, against the Mist source, where the backend used to name the expression unsupported.

      WHAT THE MODEL GAINED. Method, Field, Property and Indexer carry the type that declares them and
      the node they were written at, set by the source builders and, for the declaring type, the ambient
      projectors; an exposure rule has nowhere else to report. MemberAccessExpression records what its
      name resolved to, so the access rule never resolves a second time. ConstraintClosureRegistry
      records every closing, not only the parameterized constructor ones emission needed a witness for.
      A duplicate type is reported at its declaration rather than at no location. Defaultability moved
      from the backend's synthesis into the model, since what has a default is a language rule the
      backend happened to need first; the synthesis now consults it. Each body root carries the type it
      sits in and the assembly it came from, and AnalysisContext answers both per node, because a body
