  - id: clr-nullable-projection
    name: Projection of CLR nullability into optionals
    order: 130
    layer: clr-interop
    requires: [clr-assembly-type-projection, optional-union-representation]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      A CLR reference-type return projects to an optional, which then has to flow into
      interpolation and member access, forcing a decision about whether narrowing is required.

      DELIVERED IN BOTH PIPELINES, and it was a soundness hole rather than a nicety. Mist has no
      null; a reference the CLR hands back can be one anyway, and until 715e38c1/463a4445 it was
      typed plain T -- a naked null inside a language whose optional discipline assumes there is
      no such thing. Returns, properties, fields and indexer results are now `T | void`.

      THE RULE IS DIRECTIONAL, and the direction is the whole design. Inbound is wrapped; outbound
      parameters are NOT, because Mist has no null to send, so an outbound reference is non-null by
      construction and a union there only gives overload resolution more candidates to be ambiguous
      between. NRT annotations are ignored: an annotation is advisory, and a lying one is still a
      naked null.

      CLASSIC HAD IT EXACTLY INVERTED, which is why this was recorded `missing` against a pipeline
      that appeared to have it. ProjectNullableType already implemented the intended rule, was
      documented for "parameter type, return type, property type, field type", and cited
      Requirements 14.1/14.2/14.5/14.6 -- with ONE call site, for parameters, feeding emitter
      metadata only. The union existed in the one direction carrying no safety content and was
      absent from every direction a null can arrive from.

      THE GENERIC HALF NEEDED A SECOND MECHANISM (5b45d790, a1c66602). A parameter cannot be
      wrapped at projection -- that would make List<int>'s element optional too -- so the decision
      moves to substitution, while "the CLR could have put a null here" is knowable only at
      projection. Classic carries that fact on a marked TypeParameterType; v2 carries it on
      MemberModifiers.IsClrProjected, because v2 keys substitutions by REFERENCE and mutates
      TypeParameter.Domain later, so a marked copy would miss its binding.

      A Mist-declared generic is never wrapped, by construction rather than by heuristic.
      samples/ArityOverloads declares `Wrapper<T> { public T Value; }` and is banked.

      SHARPENED TO WHAT THE METADATA ACTUALLY SAYS. Every reference-typed result was wrapped, which is
      sound and far too pessimistic: most of the BCL declares outright that it never returns null, and
      wrapping those makes a caller narrow something that cannot be absent. `xs.Skip(5).First()` is the
      shape it broke -- First does not resolve on an optional -- and it is why ExtensionMethodBinding
      could not be banked after everything else about it worked.
      
      NullableAttribute on the result, then NullableContextAttribute on the member, its type and its
      module, in the order the C# compiler writes them. ABSENT METADATA STAYS PESSIMISTIC: an assembly
      compiled without annotations is OBLIVIOUS, not non-null, and reading silence as a promise is how the
      naked null this rule exists to stop would get back in.
      
      Both projection and substitution had to learn it -- the two halves the evidence above describes --
      since a non-generic result is wrapped at projection and a generic one only once its parameters are
      known.

      TRUSTING THE ANNOTATION IS A DECISION, TAKEN KNOWINGLY. C# erases nullability: a string and a
      nullable string are one CLR type and nothing checks at runtime, so the metadata is a declaration of
      intent, never a guarantee. A member that declares non-null and hands back null anyway now puts a
      null into a Mist value whose type says it cannot hold one -- which was impossible while every CLR
      reference was wrapped, because narrowing is a real runtime check.
      
      THE C# COMPILER'S OWN ANALYSIS IS UNSOUND IN NAMED PLACES, and each is a way a null reaches a
      non-null slot with at most a warning: `null!`; `new string[10]`, whose elements are typed non-null
      and are all null; `default(T)` for an unconstrained T; `default` of a struct, which zeroes its
      reference fields; an unassigned field on some constructor paths; and reflection, JSON
      deserialization and ORM materialization, which write straight past it. A library may also ship with
      nullable warnings simply not raised to errors.
      
      THE TRUST IS GRADED IN PRACTICE AND FLAT IN THE CODE. The BCL and Microsoft's own packages are a
      good bet -- annotated since .NET Core 3.0 and corrected over many releases -- and confidence falls
      off the further from that a package sits. The implementation does NOT distinguish them: an
      annotated third-party assembly is believed exactly as much as System.Private.CoreLib. That is the
      axis to revisit along if this ever bites, by grading trust by assembly origin rather than by
      abandoning the annotation.
      
      SILENCE IS NOT A PROMISE, which is where pessimism is kept. Absence of an attribute on a member
      means "inherit the enclosing context", and that context may itself say nullable -- so absence is
      read as a question for the scope, never as an answer of non-null. An oblivious assembly stays
      wrapped.
      
      VERIFIED AGAINST THE APIS MOST LIKELY TO CATCH IT OUT, all of which carry no return annotation of
      their own and are nullable through their method-level context: Enumerable.FirstOrDefault,
      List.Find, Type.GetType and Console.ReadLine all read as nullable, while String.ToUpper and
      Enumerable.Skip read as non-null. Reading absence as non-null would have got the first four wrong.
      
      NOT TAKEN: emitting a runtime null check at the boundary for every result declared non-null. It
      would close the hole and costs a branch on every CLR call, and the point of believing the
      annotation is to not pay for what it says cannot happen. Recorded so the next reader knows it was
      weighed rather than missed.
    untested:
      - A generic parameter substituting to another OPEN parameter stays open, so the hole survives
        inside a Mist generic body over a CLR generic. Named and chosen, not measured against a
        sample.
      - CLR extension method returns go through ProjectMemberType and are not marked.
    unlocks: [AssemblyTypeProvider]

