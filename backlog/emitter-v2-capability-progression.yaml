  # ===================================================================
  # Layer D -- member binding. Outstanding debt.
  #
  # Overloading is currently marked done in the old progression with no overload
  # resolution behind it. This layer pays that debt.
  # ===================================================================

  - id: overload-resolution-by-argument-type
    name: Select a method overload by argument types
    order: 26
    layer: member-binding
    requires: [methods-static-and-instance, object-creation, control-flow-basic]
    v2_status: partial
    verified_by: v2-semantics
    evidence: >
      A call selects among the overloads its name resolved to -- by argument count, then by exact
      argument type -- and the choice is RECORDED as InvocationExpression.Method. The record is the
      substance of this entry, not a convenience: emission re-writes the call as source spelled it
      and lets Roslyn resolve it again, so nothing observable in the emitted program distinguishes a
      correct selection from no selection followed by a lucky one. The model is the only place the
      choice can be seen, so that is where the tests read it.

      COLLECTION AND SELECTION ARE SEPARATE CONCERNS, and only selection was ever missing.
      CandidateSet.MergeMethods returns the whole overload set spanning the base chain, nearest
      first, shadowing correctly: same name and signature at greater depth is overridden, same name
      with a different signature is another overload. Both consumers simply threw that set away --
      IdentifierBinder took Methods[0], PostfixBinder took the first name match.

      SELECTION RUNS C#'s THREE STAGES: filter by arity, keep the candidates every argument converts
      to, take the best of those. ConversionRelation supplies the conversions -- identity, the implicit
      numeric widening table, and inheritance through the base chain and declared abstract types.

      THE PARTIAL RELATION MAY NARROW AND RANK, NEVER REFUSE, and this is the load-bearing idea in the
      whole entry. It knows nothing of user-defined cast operators, unions, tuples or variance, so a
      false answer means "no conversion is known", which is not the claim "no conversion exists". What
      that licenses is declining to read an eliminated candidate as proof the call is wrong. What it
      does NOT license is choosing one regardless: with every candidate eliminated the relation has
      contributed nothing to choose ON, so selection reports MIST_PM_UNRESOLVABLE_OVERLOAD and binds an
      error expression rather than recording a call the program does not make.

      WHICH IS WHAT MAKES THE AMBIGUITY DIAGNOSTIC SAFE. MIST_PM_AMBIGUOUS_OVERLOAD is reported only
      among candidates already established APPLICABLE, so it rests on a positive fact about each rather
      than on the absence of a conversion nobody looked for. `Pair(int, double)` against
      `Pair(double, int)` called with two ints is exact in one position and widened in the other for
      both candidates, so neither is better and the call is refused with both signatures named. A call
      the relation cannot place at all is not a tie but an absence, and carries the unresolvable
      diagnostic instead.

      BETTERNESS IS PAIRWISE, exact over converted and then the narrower target, established by asking
      which direction converts: int beats long because int widens to long and long does not narrow to
      int. This is not decoration -- Console.WriteLine carries about nineteen overloads and a
      `WriteLine(42)` admits int, long, float, double and decimal. Without exact-beats-converted every
      such call would tie and the ambiguity error would fire across every sample.

      A CALL MATCHING NO ARITY IS REFUSED. MIST_PM_NO_APPLICABLE_OVERLOAD names the arities on
      offer, and reports at the Mist source instead of arriving as MIST_CS_ERROR against a generated
      .cs the user never wrote. Unlike applicability it needs no conversions at all, so it is a hard
      rejection rather than a preference.

      `partial` FOR ONE REASON ONLY: a call whose correct resolution turns on a conversion the relation
      does not model -- a user-defined cast among them -- is now REFUSED rather than guessed at. That is
      a false rejection of a valid program, and it is the deliberate trade: a wrong selection recorded
      in silence is far harder to find than an error, and the refusal is what creates pressure to
      extend the relation. It can only bite at two or more candidates of the same arity, because a lone
      arity match is returned without consulting the relation at all -- there is nothing to select
      between, so applicability could only serve to refuse, and whether the one candidate able to take
      an argument actually suits it is a type check rather than a selection. Everything the relation
      does model is decided here.

      THE GROUP TRAVELS AS A NODE, and no further than its consumer. MethodGroupExpression carries the
      candidates from the lookup that found them to the invocation that decides between them, and it
      has to exist because arguments are bound before the overload they are arguments to is selected,
      so a group in an argument slot has no target available yet. Where the consumer is reached
      directly it is only ever a local: BindMemberAccess and BindInvocation sit one statement apart.

      A GROUP IS NEVER A VALUE. It has no runtime representation -- resolving one happens entirely at
      compile time and leaves nothing behind -- and no Mist syntax can produce one, since `var x = Add;`
      wants the initialiser's type while the initialiser wants a target. So it carries MethodGroupType,
      a sentinel ConversionRelation declines to reason about, rather than a plausible-looking type
      borrowed from whichever overload happens to be first.

      IT HAS EXACTLY TWO CONSUMERS: an invocation, selecting on argument types, and a conversion to a
      function type, selecting on the target signature. Only the first is built, so every other position
      reports MIST_PM_METHOD_GROUP_NOT_CONVERTED at the end of the postfix walk -- the complete choke
      point, since OperatorBinder routes every primary through it -- and binds an error expression. That
      is what makes BodyEmitter's MethodGroupReachedEmission unreachable. It stays as an invariant
      assertion, because a group arriving there means the binder both failed to resolve one and failed
      to report that, which is a compiler fault rather than anything in the source.

      THE OVERLOADING SAMPLE IS NOW RESOLVED BY CONSTRUCTION rather than by coincidence. Every call
      in it is an exact match: Format over 42, true, 3.14 and "hello"; Add and Clamp in their int and
      double forms; Printer at arity 0 and 1. None reaches the fallback above, so the sample no
      longer passes for the reason it used to.

      THE REFUSAL BITES ON `Console.WriteLine`, WHICH IS THE MEASURED COST OF THIS BEING PARTIAL AND
      the sharpest instance of it. Standard/Bootstrap/Console.mist declares WriteLine(String),
      WriteLine(unknown) and WriteLine() -- so a non-string argument gives two candidates of the same
      arity, and ConversionRelation.IsIndeterminate excludes UnknownType outright, leaving neither
      applicable. `Console.WriteLine(7)` is therefore refused on v2 with
      MIST_PM_UNRESOLVABLE_OVERLOAD naming "(string), (unknown)", where classic prints 7. Measured on
      a literal, a local, a method call and an indexer read, all identical -- so it is the parameter
      type, not the argument.

      WHICH MAKES THE TOP TYPE THE ONE PARAMETER THIS RELATION CAN NEVER MATCH, and order 81 calls
      `unknown` the type every non-void type is assignable to. The exclusion is deliberate there and
      right for the questions IsIdentity is asked -- unknown admits everything, so it discriminates
      nothing -- but APPLICABILITY is a different question from identity, and for applicability the
      answer is always yes. NO SAMPLE CATCHES THIS: every banked one routes output through string
      interpolation, so `WriteLine` is only ever called on a string.

      DELIVERED. ConversionRelation.WidensToUnknown answers containment INTO unknown ahead of the
      indeterminate bail, which is why the arm has to sit before the guard rather than inside the
      switch: unknown is itself indeterminate, so the bail rejected the question before it was
      asked. IsIdentity still excludes it, as this entry required -- applicability asks whether an
      argument fits, identity ranks candidates, and a type admitting everything ranks nothing.
      `Console.WriteLine(7)`, `(3.5)` and `(true)` now print on v2.

      The exclusions are the things that are not values: void has one inhabitant and no
      representation to widen, a method group is a set of signatures awaiting selection, and an
      ERROR type would launder a failure into a resolution. That last is load-bearing rather than
      tidy -- samples/ExtensionMethods calls `Console.WriteLine(value.GetType())` where GetType does
      not resolve, and its WriteLine diagnostic correctly survives as a cascade of that.

      IT WAS A PREREQUISITE OF LAYER T, which no `requires` edge showed, because the dependency ran
      through a partial that sample happens to touch. ExtensionMethods was 10 unresolved extension
      members plus this; it is now 10 plus the GetType cascade, so orders 111-114 are what remain.

      PASSING MODE IS NOW PART OF SELECTION, which closes the wrong-answer defect this entry carried.
      Two faults produced it and each had to be fixed for the other to matter. CandidateSet keyed a
      signature on generic arity and parameter TYPES, so `M(int)` and `M(ref int)` collapsed into one
      entry and the second was silently dropped as an override; overload resolution then had a lone
      candidate, which it returns WITHOUT consulting applicability at all. And IsApplicable compared
      types only, so even with both candidates present it could not have told them apart. Reverting
      either fix alone fails exactly one test.

      The call site's mode reaches selection through ArgumentBinder.RefFlags rather than through the
      bound tree, because it is not a property of an expression -- the same expression is a different
      argument depending on the keyword before it -- and because only SELECTION needs it. Emission
      reads the keyword back off the parameter that was chosen (ArgumentKeywords, order 128), so
      nothing downstream of the choice carries it.

      THAT THE LONE CANDIDATE SKIPS APPLICABILITY IS WHY THIS COULD NOT REGRESS the banked suite:
      every by-ref call site across all 44 has exactly one candidate. The modes must MATCH rather
      than merely be compatible, since C# refuses a by-value argument to a `ref` parameter as firmly
      as the reverse.

      AN INTEGER CONSTANT IS APPLICABLE TO AN INTEGRAL PARAMETER IT FITS (2026-09-13), by
      ConstantConversion beside the type relation: `Take(2)` over Take(byte) and Take(string) was
      MIST_PM_UNRESOLVABLE_OVERLOAD where classic prints `byte 2`. Recorded on analysis order 4.

      A CONSTRUCTED ARGUMENT REACHES ITS BASES (2026-09-13): `Sink.Take(list)` over
      Take(IEnumerable<int>) and Take(string) was UNRESOLVABLE_OVERLOAD where classic prints
      `enumerable`, since the relation gave a constructed type no bases. Recorded on analysis order 4.

      A SIGNED INTEGRAL PARAMETER OUTRANKS AN UNSIGNED ONE IT DOES NOT CONTAIN (2026-09-13), by the
      language owner's decision and C#'s table, where classic reports MIST_TC_0032. Recorded on analysis
      order 4.

      STILL MISSING, none of it contradicting the above: generic method type-argument inference, so
      an open parameter cannot be matched and falls to the arity path; explicit type arguments, which
      MethodCallSuffix still drops; extension and ambient methods, which never enter the group at
      all; and the delegate case, where invoking a Func value yields the Func type rather than its
      return type.
    tasks:
