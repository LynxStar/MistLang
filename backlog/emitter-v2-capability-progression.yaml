      THAT REPORT IS IN THE WRONG STAGE AND IS THERE KNOWINGLY. It walks a finished model and finds
      nothing wrong with how the model was BUILT, which is the test that otherwise keeps a rule out of
      construction, so it is an analyzer's judgement and Stage 5 is where it belongs. It sits in emission
      because Stage 5 is an empty stub and because emission has no valid C# to write instead -- CS0528
      for the repeated interface, CS0557 for the repeated slot. Reported as a USER error rather than an
      ICE: it is reachable from ordinary source and the source really is wrong, so blaming the compiler
      would send the reader looking in the wrong place. Logged for relocation rather than left implicit.

      PARTIAL FOR THE GENERIC ABSTRACT. The arity path builds and interns a ConstructedType, so
      `with Widget : IHold<int>` records and emits, but a slot inherited from a GENERIC base of the
      named abstract records the base as written rather than with the named abstract's type arguments
      applied. That is the same open-generic residue orders 53 and 72 carry, and it is unreachable
      from any sample: every abstract in the repository that a with block names is non-generic.
    tasks:
      - >
        Apply the named abstract's type arguments when the slot is inherited from a GENERIC base
        abstract, so the explicit implementation is qualified by the closed form. Shares its blocker
        with order 53's remaining task, which has to compose substitutions along the base chain before
