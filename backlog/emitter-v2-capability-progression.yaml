  - id: ref-parameters-and-ref-locals
    name: Mist-declared ref parameters, ref returns and ref locals
    order: 132
    layer: clr-interop
    requires: [clr-byref-parameter-projection]
    v2_status: broken
    evidence: >
      BROKEN RATHER THAN MISSING, and the distinction is the point: RefParameters compiles and RUNS
      on v2, printing wrong answers. `ref` is dropped entirely from emission -- the whole v2 output
      contains no occurrence of the keyword, where classic emits
      `private static void MutatePoint(ref Point p)` and `return ref this.Field`. Mutation through a
      ref parameter therefore fails to propagate: classic prints `after: Point(100, 200)` and
      `[ref-return-field] 77`, v2 prints `after: Point(1, 2)` and `10`.
      Nothing catches it and nothing can as things stand. No name is unresolved, so no sentinel is
      parked; the binder discards ref-ness and the emitter has nothing to notice. A sample that
      passes a compile-based screen while computing the wrong result is the failure this file exists
      to prevent, which puts it ahead of anything merely missing.
      Also needs an lvalue check for ref arguments, escape analysis for ref returns, and alias
      liveness for ref locals whose referent is a field or an element. Mist omits the second
      ref keyword C# requires at a ref-local initializer, so the emitter reinstates it.
    tasks:
      - >
        Refuse a ref parameter, ref argument, ref return or ref local rather than dropping it, until
        the alias can be emitted. A diagnostic naming the Mist declaration beats a program that runs
        and lies, and it is what makes the gap visible to a sample sweep at all.
      - Preserve the alias for a readonly ref local. The classic pipeline currently emits a
        plain copy, silently turning an alias into a value.
    unlocks: [ClrRefInterop]

