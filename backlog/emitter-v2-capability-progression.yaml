      missing capability, the invariant break this file now states in checkable form. ClrRefInterop
      carries 128 directly instead, which is the sample that actually needs it.

      WHAT THE GUARDS BOUGHT, since they are now deleted and the reasoning would otherwise go with
      them. They were built one shipment earlier, and holding the line at "refuse rather than drop"
      turned out to be what made this shipment cheap: the model already carried every flag emission
      needed, because guarding had forced each one to be found and named. A ref return needed no model
      change at all -- `Modifier` admits `ref` and every rule but a local's matches `Modifier*`
      greedily ahead of the ownership specifier, so a method's ref lands on `MemberModifiers.IsRef`,
      which ModifierBuilder already populated and nothing read.

      A REF ARGUMENT NEEDED NO MODELLING EITHER, which was the part expected to be invasive. Binding
      erases the call site's `ref` at ArgumentListNodeExtensions.GetAllExpressions, so the plan was a
      per-argument wrapper on every call-shaped expression. Unnecessary: C# requires the call site and
      the parameter to AGREE, so the resolved callee is a sufficient record, and both
      InvocationExpression.Method and NewExpression.Constructor were already recorded -- each
      documented as read by nothing, existing so a test could tell a real overload selection from a
      lucky one. Emission reads them, so a ref argument is marked from the parameter it fills, and a
      callee that resolved to nothing marks nothing, which is correct for invoking a function value.

      TWO PLACES V2 IS NOW BETTER THAN CLASSIC. A readonly ref local emits as a genuine
      `ref readonly int ro = ref rt;`, where classic emits a plain copy -- it treats `readonly ref` on a
      local as an ownership lend, so the alias silently becomes a value. And a ref parameter on an
      abstract's method slot emits, where the interface path used to bypass the parameter guard
      entirely. Output still matches classic because the sample only READS through the readonly alias.

      C# MARKS AN ALIAS TWICE, once on the local's type and once on what it aliases, and Mist writes
      only the first. RefKeywords owns the spelling for all four positions because C# also fixes the
      order as `ref readonly`, the reverse of how Mist writes it.

      ONE SPELLING IS REFUSED, and it is a language question rather than an emitter gap.
      MIST_BE_READONLY_REF_RETURN rejects a method declared both `readonly` and `ref`, because on a
      struct `readonly` is ALREADY the modifier meaning the receiver is not mutated -- so the pair
      reads either as that modifier on a method returning a writable ref, or as a method returning
      `ref readonly`, and the two differ in whether the alias may be written through. Guessing the
      first silently widens a read-only alias, which is the one direction a wrong guess is unsafe.
      Every other position is unambiguous and emits, since `readonly` means nothing else on a
      parameter or a local.
    tasks:
      - >
        Settle what `readonly ref` MEANS on a method, then emit it. Both readings are reasonable and
        the grammar separates neither; MIST_BE_READONLY_REF_RETURN refuses the pair until one is
        chosen. A separate spelling for a ref-readonly return would decide it.
      - >
        Refuse or emit a ref FIELD. `FieldDeclaration` carries an ownership specifier and `ref` on it
        lands on MemberModifiers.IsRef exactly as a method's does, so `ref int F;` is still dropped
        silently -- the last member of this family that is. Out of this capability's name and untouched
        by it, and now the only one left, which makes it more conspicuous than before rather than less.
    analysis_phase_tasks:
      - >
        ESCAPE ANALYSIS for a ref return. `ref int Bad() { int x = 1; return ref x; }` now emits, and
        Roslyn refuses it with CS8168 against the GENERATED file. That is a badly-sited diagnostic
        rather than a silent miscompile, and strictly better than the wrong answer this capability used
        to produce -- but it is the one place emitting made the message worse than refusing did.
      - An LVALUE CHECK for a ref argument. Mist requires `ref` at the call site; nothing verifies the
        argument is assignable, and emission takes the parameter's word for it.
      - Alias liveness for a ref local whose referent is a field or an element.
    unlocks: [ClrRefInterop]

  # ===================================================================
  # Layer Y -- the readonly discipline.
  #
  # In Mist readonly is a context, not only a field modifier.
  # ===================================================================

  - id: readonly-locals-and-blocks
    name: Readonly locals and readonly blocks
    order: 133
    layer: readonly-discipline
    requires: [statements-core]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      A readonly local is single-assignment, composes with an ownership specifier and with
      tuple deconstruction, and a readonly block makes every declaration inside it readonly.
      Readonly is a property of the BINDING, not the value, so member reads and method calls
      through it stay legal. C# has none of these; all three erase.

      DELIVERED. A readonly block binds as a Block that REMEMBERS it was readonly, and emits as a plain C#
      one -- classic does the same, C# having no such block. The flag is kept rather than erased at bind
      time because the rule it stands for is order 136's, a judgement on a finished model, and a model
      that forgot could not make it without re-reading the source. Readonly LOCALS already bound; only the
      block was unhandled, falling through to MIST_BE_UNSUPPORTED_STATEMENT.
    unlocks: []

  - id: readonly-member-and-type-contexts
    name: Readonly on members, types and parameters
    order: 134
    layer: readonly-discipline
    requires: [property-declarations-and-accessors, instance-fields]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      MOSTLY ALREADY BUILT, by 1c18f5c7 ("Emit readonly where C# accepts it, and only there"), and
      recorded `missing` only because nobody had re-measured. That commit changed seven emitters and
      added NO test, which is why this order's residue had to be found by reading output rather than
      by running anything. Both samples already ran on v2 before a line was written here.

      THE POSITION DECIDES, NOT THE DECLARATION, and MemberModifierEmitter's own doc says why: C#
      accepts `readonly` on any field, on a struct's methods and properties, and on nothing in a class
      but a field. So MethodEmitter, PropertyEmitter and IndexerEmitter each gate on `inStruct`, and a
      readonly method on a class is dropped rather than passed through -- CS0106 refuses it.

      TWO GAPS FOUND AND CLOSED. First, FIELD PROMOTION WAS STRUCT-ONLY: the flag threaded from
      TypeEmitter was `inStruct && type.IsReadonly`, so `readonly class Color` emitted `public int r`
      where classic emits `public readonly int r`. Renamed to inReadonlyType and computed from the
      type alone. The two reasons are unrelated and both belong -- C# REFUSES a writable instance
      field on a readonly struct (CS8340), and it has no `readonly class` at all, so on a class the
      field is the only place the type's readonly-ness survives emission at all. NewtypeEmitter had
      conflated the same two uses in one flag and was split the same way.

      Second, A READONLY PARAMETER WAS SPELLABLE AND SILENTLY DROPPED. Mist.storm line 372 carries
      `modifier:READONLY?` on every parameter and ParameterBuilder hardcoded `IsReadonly: false`, so
      the model could not represent one. Now read from the node. Emission is unchanged and that is
      correct rather than incidental: ParameterEmitter writes only type and name, C# having no
      readonly parameter, so this order's "parameters erase entirely" was already the behaviour and
      what was missing was only the model's half of it.

      NEITHER FIX IS OBSERVABLE FROM OUTPUT, measured both ways. Reverting the promotion fails exactly
      one test and leaves the AllFeaturesV2 baseline GREEN; reverting the parameter fix likewise. A
      readonly field and a writable one holding the same value print identically, so no sample can
      guard any of this -- the same situation as order 123's index typing, and the reason
      Test/Mist.Tests/Backend/ReadonlyTypeEmissionTests.cs exists.

      THAT FILE IS THE FIRST V2 EMISSION UNIT TEST and the seam is worth knowing about:
      TypeEmitter.EmitTypeBody takes a MemberType and a CSharpWriter, so a ProgramModelProbe model can
      be emitted to a string with no disk, no Roslyn and no process spawn. Every prior v2 emitter
      change was verified only through the sample baseline, which is why 1c18f5c7 could ship a
      struct-only promotion without anything noticing.

      Enums banked BYTE-IDENTICAL to classic. EnumReadonlyRestriction banked with a three-line
      divergence that is not this order's -- see the sample.
      PROPAGATION LANDED 2026-09-11 with order 135. A readonly TYPE's modifier now reaches its members
      through ModifierBuilder.ForMember, which is the member half of the one call every member builder
      already made -- kept apart from Build because that one also builds a nested TYPE's modifiers, where
      the same parameter is the ENCLOSING type and readonly does not reach through it. Emission is
      unchanged, ReadonlyEmission dropping the modifier on a readonly struct's members exactly as before;
      what changed is that order 136's rules can now read the context off the member. One measured
      consequence: a readonly type's FIELDS became readonly too, which moved the verdict on a field write
      inside such a type's method from FIELD_ASSIGNED_IN_READONLY_MEMBER to READONLY_FIELD_ASSIGNED, so
      ReadonlyAnalyzer now judges the member context before the field -- the corpus case that caught it
      is refusals/ownership-borrow-checking/field-assigned-in-readonly-type.mist.
    analysis_phase_tasks:
      - Enforce what a readonly parameter constrains. The model now records one and nothing reads it,
        so `readonly int x` is a declaration with no effect. Judging a finished model, so deferred by
        the same rule as order 97 -- and note 1c18f5c7 filed the equivalent for a readonly method on a
        class, which is the same shape of unacted-on declaration.
    unlocks: [EnumReadonlyRestriction, Enums]

  - id: readonly-inference
    name: Per-member readonly inference
    order: 135
    layer: readonly-discipline
    requires: [readonly-member-and-type-contexts]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      LANDED 2026-09-11. Classification of each member body as reads-only or writes-storage, with a
      bounded fixed point because a readonly caller's status depends on its callees.

      ReadonlyInference sits beside ThisTiers, which is the one home for what a BODY does: both walk a
      body with BodyWalker and answer a question about it, and a second walker could disagree with the
      first. The classification is the readonly-contexts spec's base rules read as a predicate -- a field
      written, a setter called, a write through an index whose receiver roots at `this` or a field, a
      callee that is not readonly, an allocation through a constructor that is not -- with a constructor
      privileged to assign the fields of its own type (Req 10.7). The indexed-write arm was MISSING from
      the first cut and added the same day: without it a struct method mutating an array field was
      inferred readonly and emitted as such, which C# accepts (an array is a reference) and which was
      false at the Mist level. See analysis order 11 for how it was found. A call
      asks the CALLEE's status and never its body (Req 10.8), which is what makes this a fixed point over
      the call graph. It is the GREATEST one: a member is readonly unless something reachable from it
      writes, so two methods that only call each other settle readonly instead of deadlocking, and the
      walk memoises only what it proved -- everything reached when nothing writes, the root alone when
      something does.

      THE INFERRED STATUS IS NOT ON THE MODEL, and that is a deliberate departure from this order's
      task. ProgramModel/CLAUDE.md makes the model immutable after construction with later-pass results
      in separate stores, and ProgramAnalysis/CLAUDE.md makes a rule something that reads the model and
      changes nothing -- so recording it would have meant either Stage 5 mutating the model or
      construction calling Stage 5. It is a memoised store instead, which both Stage 5 and the emitter
      read; the backend already reaches into ProgramAnalysis for AsyncPromotion and LocalNames, so the
      direction is not new. What the MODEL gained is order 134's half: a readonly type's modifier now
      propagates onto its members through ModifierBuilder.ForMember.

      EMITTABLE, AND NARROWER THAN MIST INFERS. C# takes `readonly` on a struct's INSTANCE members only,
      never on a static (CS8657) and not usefully on a readonly struct's, whose members it already treats
      as readonly -- so ReadonlyEmission decides the position: a getter-only property carries it on the
      property, a get/set pair on the getter (CS8658 refuses the accessor form without both, CS8661 both
      at once), and a Drop carries it never, since the emitter appends field drops after the author's
      body and would be claiming what the emitted form does not do. AllFeaturesV2 is byte-identical with
      the modifier on struct members throughout, which is the point: it buys Roslyn checking the claim
      and the defensive copy going away, and changes no output.

      TWO DEFECTS FOUND BY LANDING IT. The first attempt emitted `readonly get` on getter-only
      properties and Roslyn refused it (CS8658) -- caught by the orchestrator, not by a unit test, which
      is why the Tier 3 rows now pin both positions. The second is older and not this order's: LocalNames
      held its name maps in plain statics where every other ambient emitter state is [ThreadStatic], so
      two emission tests running in parallel clobbered each other's renames. Adding one more Tier 3
      emission class made it reproducible; the fields are now [ThreadStatic] like AsyncPromotion's.

      THE REFUSALS ARE ORDER 11'S and landed with this, the base rules having been waiting on exactly
      this inference. See the analysis register.
    unlocks: []

