      default whose signature names a type parameter, and order 53's lookup withholds any member of a
      generic base for the same reason -- neither can apply the conformer's type arguments, and both
      would rather answer nothing than answer an open `T`. So the residue is unreachable from either
      side rather than half-emitted, and closing it means composing substitutions along the base
      chain, which is order 53's remaining task.
    tasks:
      - >
