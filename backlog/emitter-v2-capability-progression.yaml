      as the remaining undescended kind.

      THE RESULT IS SUBSTITUTED ALONGSIDE THE PARAMETERS, which is what an alias needs in both
      positions; substituting only the parameters would have left `Transform<int, string>` returning
      TOut. A test asserts an alias reaches the SAME interned type as spelling the function type out,
      which is the strongest form the claim has -- transparency means there is one type, not two that
      agree.

      CURRYING WAS ALREADY DONE by orders 104 and 105 between them: a function type nests because its
      result is an ordinary type, chained invocation works because the first call's result is a function
