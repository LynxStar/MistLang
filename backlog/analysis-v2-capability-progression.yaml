      `DateTime { Year: > 1999 }` are declared, the projection knowing a readonly struct, and
      `List<int>.Count` and every abstract's property are not. A body is held to a LIST of node kinds rather
      than refused for the ones known to be trouble, there being no runtime guard behind a wrong answer: a
      field or property it reads is judged in turn, a cycle of getters answering no; an intrinsic operator
      is admitted and a declared operator or conversion is not; and a call, an index, an assignment, a loop,
      an interpolated string and any kind the model gains later are refused until someone decides otherwise.
