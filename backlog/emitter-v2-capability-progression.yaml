      THE GENERIC COMBINATORS ARE NOW REACHABLE (2026-09-12), because the grammar names a member
      through an instantiation: `Task<int>.WhenAll(pending)`. One Primary alternative,
      GenericTypeMemberAccessExpression, committed to only when `>` is followed by `.name`, which no
