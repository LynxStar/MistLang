    untested:
      - No reassignment is attempted anywhere, so the output is identical if readonly
        enforcement is a no-op.
      - The ownership specifier never drives a move or a drop.

  - name: ReadonlyContexts
    intro_order: 32
    threshold: readonly-generic-constraints
    requires: [readonly-generic-constraints, readonly-mutation-checking,
               readonly-locals-and-blocks, property-backing-field-and-field-keyword,
               abstract-type-declaration, nominal-conformance-and-slot-checking,
               struct-declaration, string-interpolation]
    untested:
      - Every construct in the sample is LEGAL, so the entire readonly diagnostic surface can
        be absent and the sample still passes and prints correctly.
      - Readonly inference has no observable effect -- the inferred members behave identically
