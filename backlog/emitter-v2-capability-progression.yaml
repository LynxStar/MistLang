      must drop exactly once and relevant at least once, so a scope holding either owes one. Affine
      may drop AT MOST once and explicitly allows forgetting, so inserting a drop there would invent a
      call the author declined to make -- DropSemantics asserts exactly that, and the first cut failed
      it by dropping every type with a Drop method.

      A MOVE IS A POSITION, NOT A MENTION. Passing the value on, returning it, or calling its own Drop
      hands the obligation over; reading a member off it does not, and neither does LENDING -- a
      by-reference parameter is a loan and the caller still owes the drop. Counting references would
      elide the drop for `f.GetFd()`.

      A DECLARED DROP DOES NOT DISCHARGE THE CONTAINER'S OBLIGATION. What the author wrote happens IN
      ADDITION to releasing what the type holds, so the field drops are appended to it -- and a field
      the body hands back is moved, so a Drop returning its own value releases nothing. That makes the
      synthesized case and the declared case one rule with two spellings rather than two rules.

      AN INTRINSIC DROP IS NOT CALLABLE. Standard's Task declares one so a task can carry a
      discipline, which is a claim about Mist's type system; no CLR task has such a member, and
