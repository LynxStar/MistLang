  - id: operator-overload-declarations
    name: User-declared operator overloads
    order: 185
    layer: stdlib-only
    requires: [class-declaration]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      LANDED 2026-09-11. Emission alone, as recorded, and closed the way cast operators were at order
      45: OperatorEmitter writes `public static R operator <symbol>(...)` from Operator.Symbol, never
      from Method.Name, which is the CLR spelling (op_Addition) and not a C# identifier, and TypeEmitter
      walks OperatorsList after the cast operators. The symbol table lives on the model,
      Operator.SymbolOf, so the emitter and the order-6 rules below spell an operator from one place.

      THE SAMPLE IS samples/OperatorOverloads, AND CLASSIC CANNOT RUN IT -- nor any program declaring an
      operator. Probed as a black box: classic drops every operator declaration and then calls
      `Vec2.op_GreaterThan(a, b)`, spelling unary minus `Vec2.op_Subtraction(b)`, so Roslyn refuses its
      output; it also types `3 * v`, the operator declared on the RIGHT operand's type, as Int32. So the
      sample follows the samples/LocalFunctions precedent: banked on AllFeaturesV2 alone, its 22 lines
      captured from v2 and each read against the program by hand, and NOT on AllFeatures, which it would
      break. v2 finds `3 * v` on the right operand, as the standard-library spec's Req 6.1 asks.

      THREE THINGS THE SAMPLE FOUND beyond the missing walk. (1) A receiver lost its parentheses:
      `(a + b).Describe()` emitted as `a + b.Describe()` and `(-a).Describe()` as `-a.Describe()`.
      Binding drops source parentheses and EmitSubExpression re-derives them, but a member access, an
      invocation and an index wrote their receiver bare, and a unary expression ranked as a primary --
      invisible until an operator could yield a type with members. (2) A unary operator was typed as its
      operand: `!v` on Vec2 was a Vec2 though the declared `!` answers bool. OperatorAdmissibility gained
      UnaryResultType beside the binary rule; a declaration answering its operand's own type -- every
      stdlib negation and Boolean's `!` -- keeps the operand as written, so no existing type moves. (3)
      CS0660 and CS0661: C# warns on a type declaring == or != without overriding Equals and
      GetHashCode. The in-process compile reports errors only, so AllFeaturesV2 could not see it; MSBuild
      reported four on the sample. Mist has no object base and no `override`, so no Mist type can declare
      either. DECIDED BY THE OWNER: suppress rather than synthesize. TypeEmitter wraps each type
      declaring == or != in `#pragma warning disable CS0660, CS0661`. The accepted cost: CLR Equals and
      the hashed collections keep reference or field equality and can disagree with the declared ==.
      Rejected: an Equals derived from == (exact) beside a constant GetHashCode (the only hash that
      agrees with an arbitrary ==, at the price of linear lookup), and a field-combined hash (fast, and
      wrong whenever == ignores a field).

      THE REFUSALS ARE THE FRONTEND'S, on analysis order 6, measured on both pipelines first. Classic
      refuses a non-public and a non-static operator (MIST_SB_0035) and ADMITS an unpaired == or <=, and
      && on a user struct -- only because it drops the declaration unread. v2 left the unpaired and the
      private ones to Roslyn (CS0216, CS0558) and crashed on && at emission. Now refused: an operator not
      public (not-static stays construction's, MIST_PM_OPERATOR_MUST_BE_STATIC, since the binder needs
      it); a ==/!=, </> or <=/>= declared without its pair over the same operand and result types; && or
      || anywhere but Boolean, the spec's Req 4.5; and an operator taking no parameter of its declaring
      type, which is C#'s CS0562/CS0563 and in Mist a declaration its operands' lookup can never select.
      Nothing of an operator's declaration is left to Roslyn.

      PROOF: the sample; Test/Mist.Tests/Backend/OperatorEmissionTests.cs on the emitted text (public
      static by symbol and never by op_ name, the receiver parentheses, the pragma present only where
      equality is declared); five corpus cases under refusals/declaration-shape-checks/; decision rows for
      a complete operator set and for a unary result type. The 16 stdlib files that declare operators
      declare them all intrinsic, which is order 186's.
      AN OPERATOR ON AN ABSTRACT IS REFUSED, decided 2026-09-11 after the first cut left it filed as
      undecided. It was not a scope question: the standard-library spec puts an Operator_Declaration in a
      class or struct body (Req 4.1) and asks for a diagnostic anywhere else (Req 4.7), so it is invalid
      Mist and the frontend's to refuse -- which is what AbstractTypeBuilder already did for a cast
      operator on an abstract, through MIST_PM_MEMBER_NOT_ALLOWED_ON_ABSTRACT. Measured before the fix:
      the declaration bound, emitted nothing, and a use of it then failed as MIST_CS_ERROR against
      generated C# -- an error about code the author never wrote, which is exactly what the
      language-rules discipline exists to prevent. A corpus case under refusals/binding/ holds it.
    unlocks: []

  - id: intrinsic-member-declarations
    name: The intrinsic modifier
    order: 186
    layer: stdlib-only
    requires: [class-declaration]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      LANDED 2026-09-11. Marks a declaration whose implementation is supplied by the compiler rather
      than by a Mist body. Used throughout Source/Standard/Bootstrap and by nothing in samples.

      THE SKIP IS NOW PER DECLARATION. CSharpEmitterV2 skipped the whole Standard ASSEMBLY; it now
      skips only an assembly with no Mist source, and Standard's compilation units go through the same
      EmitCompilationUnit path as a user's. What the target already supplies is dropped one declaration
      at a time by TypeEmitter.SuppliedByBackend: an intrinsic type, whose implementation is the
      backend's by declaration; Standard.Void; and an abstract that IS a CLR interface.

      WHAT THAT ACTUALLY EMITS IS ONE FILE, and the register's earlier reading of "five Standard files
      declare no intrinsic" does not survive contact with them. IClonable is the only one that is
      ordinary Mist with a C# counterpart to write: it now emits from its own compilation unit to
      out/Standard/IClonable.cs, where EmitStandardAbstracts used to collect it into __Standard.g.cs,
      and that hand-rolled aggregator is deleted. Optional.mist declares a type ALIAS, which erases, so
      there is nothing to emit and its file is skipped. IEnumerable and IEnumerator project onto the
      CLR interfaces, so emitting them would duplicate a framework type that satisfies no framework API
      and no foreach -- ClrProjection, the rule EmitStandardAbstracts already applied, now expressed per
      declaration. Unknown.mist is an extension block whose bodies are placeholders by its own header
      ("actual behavior comes from the .NET runtime"), and Standard's extension blocks stay skipped for
      the reason EmittableBlocks records. Bootstrap emits nothing: every type in it is intrinsic or an
      alias.

      VOID STAYS A STAND-IN, and the reason is not intrinsic-ness -- Void.mist declares none. Its C#
      shape needs members Mist cannot spell: Mist has no base object and no `override`, so the equality
      overrides, IEquatable and the ToString that makes a void value print as "Void" have no Mist
      spelling. Six baseline lines print exactly that, so emitting Void.mist from source would change
      them to "Standard.Void". EmitVoidStruct moved out of CSharpEmitterV2 (935 lines, past the split
      signal) into VoidStandIn, and StandardDeclarationEmissionTests now holds that text to every member
      Void.mist declares, so the drift the stdlib target warned about fails a test instead of passing
      unnoticed. A stale doc comment describing Void, which had drifted onto EmitContextRuntime, is gone.

      NO MEMBER-LEVEL FILTER WAS ADDED, because one would be unreachable. IntrinsicMemberValidation
      refuses a member-level `intrinsic` whose containing type is not itself intrinsic
      (MIST_PM_INTRINSIC_REQUIRES_INTRINSIC_TYPE, the standard-library spec's Req 5.15), and an
      intrinsic type emits nothing -- so no emitted type can hold an intrinsic member, and a test for
      "one intrinsic method and one ordinary method" would describe a model the builder refuses.

      MEASURED: AllFeaturesV2 byte-identical to baseline and samples/Testing green under `mist test` on
      v2, which is the one consumer that compiles emitted code through MSBuild and so sees C# warnings.
      A Tier 3 test pins that an intrinsic type produces no declaration and writes nothing.
      THE INTRINSIC SURFACE IS NOW MEASURED, by samples/StandardSurface, and measuring it found two
      members v2 could not emit at all. An `intrinsic` declaration is the stdlib's promise that the
      backend supplies the member, and v2 keeps most of them without knowing it: an operator emits as an
      operator, and a member of a projected type emits as the call on that type, which is why
      Console.WriteLine and Math.Abs work and why nobody noticed the rest. Standard.Type.Of and Clone on
      every primitive are spelled differently from the CLR, and both emitted as calls that do not exist --
      `System.Type.Of(x)` and `42.Clone()`. Classic runs both. IntrinsicCalls now rewrites them: Type.Of
