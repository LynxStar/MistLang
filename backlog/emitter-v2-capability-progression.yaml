  - id: regex-type-and-literals
    name: Regex type and literals
    order: 177
    layer: regex
    requires: [class-declaration]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      Backtick literals with their own escape handling, validated at compile time, plus built-in
      members, implicit conversion to string, an explicit cast from a non-constant string, and a
      string-literal shorthand gated on compile-time validation.

      MAPPED ONTO THE CLR TYPE, NEVER DUPLICATED. `regex` emits as
      System.Text.RegularExpressions.Regex, and the four members Mist spells differently are
      rewritten at the use site: `Pattern` reads as ToString, `IsFullMatch` anchors and matches
      partially, a cast to regex constructs, and a regex reaching a string slot converts where the
      emitter already knows a target type -- an argument's parameter and a local's declared type.

      A WRAPPER WAS BUILT FIRST AND WAS WRONG. A generated Standard.Regex holding a CLR Regex made
      C#'s own rules apply the conversion, which avoided knowing target types. It also made `regex` a
      type no framework API accepts, and the same reasoning applied to String or Int32 would have the
      backend shipping a duplicate of every primitive. Intrinsic means stages 1-5 stay pure Mist and
      stage 6 answers for itself; a wrapper answers in the wrong place, and would have to be invented
      again by every other backend. ClrProjection already states this for the Standard abstracts.

      TWO SPELLINGS, ONE FORM. A backticked literal is RAW regex and a quoted shorthand is already
      written as a string body, so one escaping rule applied to both gets one of them wrong -- and
      wrong by MATCHING NOTHING rather than by failing to build. They are normalised at bind time to
      the body form LiteralExpression already holds a string in, so emission only puts the quotes
      back. The shorthand binds AS a regex literal when the target is regex, which is what keeps the
      two spellings one thing rather than a conversion the target language has to be talked into.
    unlocks: []

