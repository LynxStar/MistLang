    evidence: >
      SPEC-BACKED AND SPEC-CITED: .kiro/specs/abstract-type-unification/requirements.md, Requirements 14
      and 28. The blocker order 69 recorded -- no source location on the contract -- was moot for Stage
      5 as built: the rules run over the concrete model, where MemberType.DeclarationNode is reachable,
