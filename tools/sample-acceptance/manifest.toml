# Sample acceptance manifest -- the authoritative roster of every sample project
# and C# companion the standalone harness (run.py) must account for. It is executable
# acceptance input, not a second ledger of outstanding work or asserted greenness.
#
# run.py reconciles this list against live discovery (samples/**/mist.toml and the
# C# projects reached through their [references]) before any sample runs, so a
# newly added, removed, duplicated or unclassified project fails the run instead of
# silently disappearing. Use `run.py --list` to see the reconciliation and roster.
#
# Roles (see run.py ROLES):
#   orchestrator       AllFeaturesV2 -- run; compared to its committed baseline.
#   executable         standalone `mist run`; stdout compared exactly to expectations/<name>.out.
#   composed-executable defaults to executable but has no standalone entry point; run standalone
#                      to record its MIST0108 failure, and cross-covered through the aggregate.
#   generator-consumer `mist run`; drives a source generator through the generator protocol.
#   msbuild-consumer   `mist run` of a sub-project that references a C# project (builds MSBuild).
#   ef-consumer        manual EF demonstration; needs network + dotnet-ef (run only with --include-network).
#   test-library       no entry point; verdict from `mist test` against a committed tally.
#   library            Mist library with no entry point; built/exercised through its consumer.
#   source-generator   a generator executable; exercised through its consumer, not as a demo.
#   csharp-companion   a .csproj the compiler builds while compiling its consumer.
#
# Expectations are repo-relative when they start with samples/ or tools/, otherwise
# resolved under expectations/. The orchestrator reuses samples/__baselines__/AllFeaturesV2.out;
# it is never duplicated here.

schema = 1

