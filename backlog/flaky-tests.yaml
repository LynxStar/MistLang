  - id: storm-trait-structural-satisfaction-property
    test: Storm.SourceGenerator.Tests.StormTraitStructuralSatisfactionPropertyTests.P4c_MismatchedField_EmitsSTORM0021
    file: Test/Storm.SourceGenerator.Tests/StormTraitStructuralSatisfactionPropertyTests.cs
    discovered: 2026-08-26
    status: fixed
    symptom: >
      Failed once in a full `dotnet test Mist.slnx` run and passed on immediate rerun in isolation
      with no intervening code change. One sighting only.
    cause: >
      THE GENERATOR DREW INVALID GRAMMARS, confirmed 2026-09-14 by replay. Every field's type is
      declared as a token, and the trait name, the rule name and (in P4c) the wrong type name are drawn
      independently of those token names. When the trait or rule name equals a field's type name, or the
      wrong type equals the trait or rule name, the grammar declares one name twice and StormGrammar
      reports STORM0003. The trait binding then resolves to nothing (STORM0019) or validation sees no
      trait at all, and the property's Assert.Contains finds no STORM0020 or STORM0021 to match.

      P4a_ValidSatisfaction DRAWS THE SAME INVALID GRAMMARS AND PASSES ON THEM. It asserts the ABSENCE of
      STORM0020 and STORM0021, which a grammar that failed to build satisfies vacuously, so it never went
      red and was never a flake -- but it was checking invalid input and calling it valid.
    evidence: >
      NOT THE CHANGE UNDER TEST. The working tree held the v2 ranges layer only -- orders 123-125,
      confined to Source/Mist/ProgramModel, Source/Mist/Backends/CSharpTranspiler/Emitter,
      Source/Mist/Common/Diagnostics/Descriptors, Test/Mist.Tests, samples/ and backlog/. Nothing in
      Storm.SourceGenerator is referenced by any of them, and `git status --short` showed nothing
      modified under Source/Storm.SourceGenerator or Test/Storm.SourceGenerator.Tests.
      REPRODUCTION: one isolated rerun of the test alone, green in 41 ms. No further attempts.
      THE NAME WAS CAPTURED THIS TIME, which the entry above
      (unidentified-storm-single-failure-2026-08-04) asked the next sighting to do. The run was piped
      through `grep -E 'Failed!|Passed!|error CS|^\s+Failed '`, and the trailing pattern is what kept
      the per-test line. The MESSAGE was still lost, so the trx advice in that entry stands.
      THE PATTERN IS NOW THREE NAMED STORM PROPERTY TESTS, none sharing a subject:
      StormMemoPropagationPropertyTests.P3_MemoPropagation_RuleIR_IsMemo_MatchesSource,
      StormTraitFieldTypeResolutionPropertyTests.P3_FragmentFieldType_STORM0018Emitted, and this one
      -- plus the unidentified 2026-08-04 sighting, which was also in Storm.SourceGenerator.Tests.
      Three unrelated property tests in one project failing this way is weak evidence for three
      independent bugs and better evidence for something shared: the FsCheck draw, or process-wide
      state in the generator harness under the concurrent load of a three-project run. Every sighting
      so far has been under `dotnet test Mist.slnx`, never under the project alone.
      NEXT SIGHTING: attach `--logger "trx;LogFileName=x.trx"` and read the failing message and the
      FsCheck seed. A seed would settle the draw question outright, which is the cheapest of the
      candidates to rule in or out.

      REPRODUCED BY REPLAY, 2026-09-14, which settled the draw question the way the note above hoped.
      The file's three tests were converted to [Property] over their generators; P4b and P4c had chosen
      their field with Math.Abs(traitName.GetHashCode()), which .NET randomizes per process and no seed
      can replay, so that index is now drawn. Five rounds of 200000 draws each: P4b failed in four
      (after 45530, 74019, 184807 and 162783 draws), P4c in three (21517, 38746, 27177), P4a in none.
      Every falsifying input shared a name between two declarations: rule `S95` and field type `S95`,
      trait `Y2q` and field type `Y2q`, and for P4c trait `U5d` with wrong type `U5d`.
    fix: >
      APPLIED 2026-09-14. All three generators require every declared name -- field types, trait, rule,
      and P4c's wrong type -- to be distinct, and each test asserts the grammar built before judging
      trait validation. The tests are [Property]s, so a failure prints its replay seed and input.

  - id: mist-tests-mass-failure-under-stale-copy
    test: Mist.Tests (433 of 5000, no single test implicated)
    file: Test/Mist.Tests
    discovered: 2026-09-06
    status: fixed
    symptom: >
      A full `dotnet test Mist.slnx --no-build` reported 433 failures out of 5000. An immediate
      rerun with NO intervening code change reported 5000 passed, 0 failed. The failure messages
      were incoherent rather than assertion-shaped -- among them
      "MIST_UNDEFINED_TYPE: The type 'fixing' could not be found", naming a type no fixture
      declares -- which is the tell that the binaries under test did not match the sources.
    cause: >
      SUPERSEDED 2026-09-14: the poisoned stdlib parse cache recorded under
      mist-tests-garbled-lexemes-without-a-lock-warning, fixed there. 'fixing' is a word in the comment
      at Source/Standard/Bootstrap/Action.mist:3, and a user AST sliced against that file's text is
      exactly what an empty cache produces; deliberately poisoning the cache reproduced the message.
      A stale test DLL has no path to a name read out of a Standard comment -- mismatched binaries
      fail with missing members, not with other files' text. The MSB3026 warnings below were real and
      remain worth avoiding, but they were not needed to produce this failure.

      THE ORIGINAL EXPLANATION, kept so the reasoning can be checked: stale Mist.Tests.dll, not a test
      defect. A previous `dotnet test` was still running when the
      next `dotnet build` fired, and MSBuild reported
      "Could not copy obj\Debug\net10.0\Mist.Tests.dll to bin\Debug\net10.0\Mist.Tests.dll ...
      The file is locked by: testhost". It retried, printed no error, and the build was treated as
      successful. The subsequent `--no-build` run therefore executed a Mist.Tests.dll from before
      the change against a freshly built Mist.Core.dll.
    evidence: >
      The MSB3026 lock warnings are in the build output immediately preceding the bad run, naming
      testhost as the holder. Nothing was edited between the 433-failure run and the green rerun;
      the only difference is that the lock had cleared. Both runs were `--no-build` over the same
      sources. The working tree held the well-known member bridge (Standard.String gaining its CLR
      members), which touches only the ambient provider and the program model builder and cannot
      explain a failure naming a type called 'fixing'.
    note: >
      THE TELL BELOW PREDATES THE MECHANISM. Garbled names were read here as the sign of mismatched
      binaries; they were the poisoned cache, which the fix removes. The advice about not building
      while a test run is live stands on its own.

      NOT A FLAKE TO CHASE, and recorded because the SHAPE is worth recognising: a mass failure with
      messages that do not correspond to any assertion means suspect the binaries first, not the
      change. Test/CLAUDE.md's triage policy says rebuild before blaming the working tree; this is
      the same failure mode reached from the other side, where the rebuild silently did not happen.
      MSB3026 is a WARNING, so a build filtered for errors reports success.
      AVOIDING IT: do not start a build while a test run is live. If a run must be cut short, stop
      it and confirm no testhost process survives before rebuilding.
    recurrences:
      - date: 2026-09-06
        detail: >
          443 of 5016 under the await-diagnostic change, green on rerun with nothing edited. Reached
          a THIRD way, which is worth adding to the shape: the build was run as
          `dotnet build ... >/dev/null 2>&1` inside a chained command, so MSB3026 was not merely
          filtered out for being a warning -- the whole build output was discarded before anything
          could read it. Redirecting a build to /dev/null and then trusting `--no-build` is the same
          mistake as grepping the output for errors only.

