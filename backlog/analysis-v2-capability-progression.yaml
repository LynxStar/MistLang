# Stage 5 -- the v2 analysis phase.
#
# THE SIBLING OF emitter-v2-capability-progression.yaml AND ORDERED DIFFERENTLY ON PURPOSE. That
# register orders capabilities by what emission needs first; the 92 `analysis_phase_tasks` hanging off
# it are ordered by the emitter work that SPAWNED them, which is not the order a checker can be built
# in. This file is that order. Every rule here cites the emitter-register entry it came from, so the
# provenance stays and nothing is moved.
#
# Grep it, do not read it whole.

invariants:

  - id: samples-cannot-measure-this
    statement: >
      EVERY SAMPLE IS A VALID PROGRAM, so `samples/AllFeaturesV2` -- the whole ledger of the emitter
      arc -- is structurally blind to a refusal. No sample contains a use-after-move, a doubly-dropped
      linear value or a non-exhaustive match, so an analyzer that reports NOTHING passes every test the
      repo has. A rejection-shaped ledger is therefore order 1 rather than an afterthought, and the
      samples keep exactly one job here: proving an analyzer does not FALSE-POSITIVE on 91 working
      programs, which is a real job and not this one.

  - id: stages-4-and-5-are-peers
    statement: >
      Binding and analysis gather into ONE diagnostic bag that is gated once afterwards, so an analyzer
      runs over a model that may already hold ErrorType and may already have been reported on. Every
      rule owes the same suppression the binder's MemberResolution.Report already performs: say nothing
      about a type that already failed. One mistake, one complaint.

  - id: conversion-relation-cannot-refuse
    statement: >
      ConversionRelation is documented as partial and as unable to refuse -- "a caller may use this to
      PREFER one candidate over another, and none may use it to refuse a program". That is correct for
      overload ranking and is exactly what a typechecker needs it to stop being. A TOTAL classification
      is a separate thing that has to exist before any assignability rule does, and the partial one must
      survive alongside it: selection still needs a relation that narrows without refusing.

  - id: one-flow-framework
    statement: >
      Definite assignment, move checking, array-bounds narrowing, ref-return escape, stackalloc escape
      and ref-local liveness are ONE CFG-plus-lattice framework with six customers. Built once that is
      roughly 21 tasks riding on it; built per feature it is five frameworks that disagree at the joins.

  - id: classic-is-not-the-reference
    statement: >
      The clean-room rule holds here as it did for the emitter, and binds harder: Mist.Analysis is named
      in it. Classic's DIAGNOSTIC IDS and messages are fair game as a statement of what the language
      refuses -- they are observable behaviour -- and are cited throughout the emitter register's tasks
      for that reason. Its code is not. The sanctioned inputs are the grammar and .kiro/specs.

  - id: a-refusal-is-a-language-decision
    statement: >
      Where classic refuses and v2 need not, the refusal is a DECISION to make and record rather than a
      defect to close. Several are already open questions in the tasks below -- a relational subpattern
      on an unknown member, an enum scrutinee's exhaustiveness -- and v2 being the more permissive of the
      two is an allowed answer, stated, not a gap.

  - id: standard-is-in-scope
    statement: >
      THE RULES RUN OVER STANDARD. An intrinsic type is a Mist-expressed contract over an instance the
      backend supplies, and Standard's declarations and bodies answer to every rule a user's do -- so
      SourceTypes scopes every assembly with Mist source, Standard included, and a finding there lands
      on the Standard file that earned it. Lifting the exclusion on 2026-09-12 found one rule wrong
      about Standard rather than one defect in it: DeclarationShapeAnalyzer refused the `&&` and `||`
      that Boolean.mist itself declares, the spec's "only on Boolean" (Req 4.5) having been checked as
      "never", and it now names Boolean. A rule keyed on "this cannot be Standard" is the same bug
      waiting to be found.

# ===================================================================
# Order 1-3 -- infrastructure. Nothing else can start.
# ===================================================================

rules:

  - id: rejection-ledger
    name: A rejection-shaped ledger for the analysis phase
    order: 1
    subsystem: infrastructure
    requires: []
    status: done
    from: the deferral itself; no emitter-register task states it because no emitter task needed it
    evidence: >
      WHAT IS MISSING IS A PLACE TO PUT A PROGRAM THAT MUST NOT COMPILE. The emitter arc had one
      executable ledger and it worked because emission is observable: a sample runs, its stdout is
      diffed, and progress cannot be silently lost. Analysis inverts that. The deliverable is a refusal,
      the witness is a program that fails, and stdout has nothing to say about it.
      
      Tier 3 already has the shape: ProgramModelProbe's BuildRun plus Errors(diagnostics, id) is exactly
      a negative harness, and PropertyPatternResolutionTests uses it for nine refusals today. What it
      cannot do is carry a PROGRAM -- it wraps statements in a probe method, so a rule about a
      declaration, a constructor's paths or a whole type's conformance has nowhere to live.
      
      Decide between two shapes and record which: a corpus directory of small invalid programs each
      paired with its expected diagnostic id and line, walked by one test; or a per-subsystem Tier 3
      class in the probe style, extended to admit whole compilation units. The corpus wins on making
      progress un-loseable the way the baseline did; the probe style wins on keeping the reason for each
      refusal next to it. Neither is obviously right and the choice shapes every rule below it.
      [CORRECTED 2026-09-26: Arthur never approved one Tier 4-5 test per refusal. The corpus design
      below is withdrawn; see the WITHDRAWN task at the end of this order. Migration completed
      2026-09-26: the corpus and runner are deleted; the corpus references in this evidence are historical.]
      BOTH, WITH THE CORPUS AS THE SPINE -- Arthur's call. `refusals/` holds the programs Mist must not
      compile, one directory per rule below, walked by one test (RefusalCorpusTest, Tier 5). The Tier 3
      probe classes stay for the cases where the reasoning matters more than the count: decisions,
      near-misses, and suppression on an already-failed type. A new refusal goes in the corpus unless it
      needs a doc comment to be intelligible, in which case it goes in a probe class and the corpus
      carries the plain version.
      
      THE EXPECTATION LIVES IN THE PROGRAM, directly above the line it is about -- `// REFUSE: <ID>` --
      so it cannot drift out of step with an edit the way a hand-written line number does. The
      file-scoped `// REFUSE-FILE: <ID>` exists for the rules that report at an enclosing declaration,
      which is a parse failure and every conformance failure. A file with no marker FAILS: a case that
      does not say what it is for is not a case.
      
      EXACT ON ERRORS, which is the half that does the work. Every marked diagnostic must be reported,
      AND no unpredicted error may be -- so the corpus enforces the no-cascade invariant directly rather
      than leaving it to judgement. That caught a real defect on the FIRST RUN, with three cases in it:
      `Console.WriteLine(neverDeclared)` reported the unresolved identifier AND a derived
      MIST_PM_UNRESOLVABLE_OVERLOAD for WriteLine. Fixed in OverloadFailure.Report, which now says
      nothing when an argument is already an ErrorExpression. Keyed on ErrorExpression and not ErrorType
      because the two sentinels mean opposite things -- IdentifierBinder.ReportUnresolved already records
      the distinction, and an UnresolvedExpression is the compiler being unfinished with nothing yet
      reported.
      
      SEEDED FROM STAGE 4, not Stage 5, and deliberately: the binder already makes 104 refusals and the
      ledger does not care which stage said no. That is what let the harness be proven before a single
      analyzer existed -- mutation-checked both ways, a wrong id and a deleted marker each failing it.
      
      COST: ~0.7s per case through the real pipeline, measured at three cases. Worth re-measuring around
      30; a shells-only ambient provider is the lever if it becomes a problem, at the price of a rule
      that mis-fires on a CLR type passing anyway.
      
      A LOCAL BOUND FROM A VALUE THAT ALREADY FAILED ADDS NO SECOND COMPLAINT (2026-09-15). The
      suppression above keyed on the argument itself, so a failure that reached a call through a local
      was reported again. MEASURED at 7f3f6bb4 on v2, one project per probe: `var r = Signs.Take(small);
      Console.WriteLine(r);` over an ambiguous Take reported MIST_PM_AMBIGUOUS_OVERLOAD and then
      MIST_PM_UNRESOLVABLE_OVERLOAD at WriteLine, naming (string), (unknown). So did 47 more of the 84 rows
      that bound a `var` local from an ambiguous call, an ambiguous index, an unresolvable call or an
      unresolved identifier and then used it as an argument, a receiver, an operand or an indexed
      receiver; the other 36 reached no overload selection. So did `Console.WriteLine(nothing[0])` and
      `(nothing + 1)` with no local at all, `-r`, `r(1)`, a local copied from a failed one, and the `for`,
      `with` and `foreach` bindings -- `foreach (var e in 5)` included, which the foreach itself refuses.
      A typed local was already silent wherever its declared type fits the use. Classic, gated on an
      unresolved identifier, reported it alone, and over an ambiguous or unresolvable call cascaded the
      same way at an overloaded user method or constructor (MIST_TC_0031), silent only at WriteLine.
      
      STAGE 5 ADDED NOTHING to any of those rows. AnalysisContext.Report already says nothing about an
      ErrorType expression, and a reference to such a local is one, so the analysis half needed no change.
      Its ErrorType key is sound there for a reason the binder's is not: analysis drops no node, so an
      UnresolvedExpression it stays silent about still reaches emission's MIST_BE_UNSUPPORTED_EXPRESSION
      once nothing else is refused, which measured unchanged. A refused call instead becomes an
      ErrorExpression and takes the unfinished argument with it, which is why the binder cannot key on
      ErrorType.
      
      WHAT CHANGED. OverloadFailure's predicate moved to Construction/Binding/PriorFailure.Of, which also
      looks through an index, a unary and a binary, and accepts a LocalReferenceExpression whose
      LocalVariable.IsFailed the binder set. The binder sets it where the bound value is in hand -- `var`,
      `for (var ...)`, `with var`, and `foreach (var ...)` over a collection that failed or whose element
      the foreach refused itself. A FLAG, NOT THE DECLARATION'S INITIALIZER: a LocalVariable does not reach
      its declaration, and a `with` binding and a foreach variable have no initializer to reach. POSITIVE,
      NOT A MARK ON THE UNFINISHED CASE: a site that forgets the flag leaves a second complaint the corpus
      can see, where a site that forgot to mark an UnresolvedExpression would silence it. After the change
      all 60 rows that had cascaded report their first complaint alone, and nothing else among the 199 v2
      probes moved: `u is (0, 0)` over unknown, which parks without a diagnostic, still reaches
      MIST_PM_UNRESOLVABLE_OVERLOAD passed directly, through a local, through a copy of that local, and as
      a foreach collection.
      
      PROVED BY two corpus cases in binding, local-from-an-ambiguous-call-passed-on and
      local-from-an-ambiguous-index-passed-on, over the signed/unsigned pair whose ambiguity is decided
      rather than `Keyed<int>`, whose tie is still an open question; and nineteen rows in
      OverloadSelectionTests -- fifteen holding a failure passed on to its one complaint, four holding an
      unfinished value still reported. ELEVEN MUTATIONS on a confirmed build, each caught by the rows named
      for it: the local arm dropped from PriorFailure failed both corpus cases and the thirteen rows that
      pass through a local; the flag never set on `var` failed both corpus cases and the nine rows whose
      first local is a `var`; a local judged by its ErrorType instead of its flag failed the three
      unfinished rows that pass through a local; the index, binary and unary arms dropped failed
      `neverDeclared[0]`, the two `+ 1` rows and `-r`; the `with` and `for` flags never set failed their
      own rows; and the foreach flag keyed on ErrorType, blind to its own refusal and blind to a failed
      collection failed the unfinished foreach row, `foreach (var e in 5)` and `foreach (var e in
      neverDeclared)`, one each. The full suite -- 6254, 664 and 68 tests, AllFeaturesV2's baseline among
      them -- passed with no failure and no rerun, and the build and `dotnet format` were clean.
      
      NOT CLOSED, each measured the same day and recorded with its output against the error-expression
      sentinel entry in program-model-body-tasks: a pattern binding over a failed scrutinee; an inferred
      deconstruction that declares no locals; a declared type that failed; and a value the binder types
      ErrorType for Stage 5 to refuse, which through a local is still two and passed directly is one
      complaint and the wrong one, because the refused call drops its arguments before Stage 5 walks
      them. The fifth, a member access the binder refused, is closed below.

      A MEMBER ACCESS THE BINDER REFUSED ADDS NO SECOND COMPLAINT (2026-09-25). The suppression above
      recognized a failed LOCAL but not the refusal that produced one, so the commonest cascade of all
      survived it. MEASURED on both pipelines at 6b73b28b, one project per probe: `int k = 5;
      Console.WriteLine(k.Lenght);`, `Console.WriteLine(k.Nope())`, `var n = k.Lenght;
      Console.WriteLine(n);`, `s?.Lenght` over a `string?`, and `Math.Rond(1.5)` on a type name each
      reported MIST_PM_UNRESOLVED_MEMBER and then MIST_PM_UNRESOLVABLE_OVERLOAD at WriteLine, naming
      (string), (unknown). Each is now the first complaint alone. CLASSIC IS NOT THE ONE-COMPLAINT
      REFERENCE the note above assumed: on the same five projects it reports MIST_UNDEFINED_MEMBER TWICE
      for four of them -- only the `var` local draws one -- so v2 is now stricter here too, and classic's
      duplicate is recorded rather than matched.

      WHAT CHANGED. MemberResolution.Report now ANSWERS whether it reported; the answer leaves Resolve on
      MemberLookup.Reported and is recorded on MemberAccessExpression.IsFailed, which PriorFailure.Of
      reads beside its existing receiver walk. RECORDED, NOT RE-DERIVED, and that is the whole of the
      rule: the same NotFoundResult is a refusal already spoken on a type that answers members and a
      silence on one that does not, so a predicate that re-tested AnswersMembers would read an unknown
      receiver's silence as a refusal and swallow the only complaint that program gets. Measured on the
      model: `i.Lenght` binds an access with IsFailed true, `u.Length` over unknown one with IsFailed
      false, the receiver being UnknownType and AnswersMembers false. The two sites that record it are
      the plain and the conditional access; a `?.` on a NON-optional receiver records nothing, having
      resolved no member and reported nothing, which leaves that refusal Stage 5's.

      PROVED BY six corpus cases in binding -- refused-member-access-as-an-argument,
      refused-member-call-as-an-argument, local-from-a-refused-member-access-passed-on,
      refused-conditional-member-access-as-an-argument, refused-static-member-as-an-argument, and
      unknown-receiver-member-reaches-its-call, which expects MIST_PM_UNRESOLVABLE_OVERLOAD and is the
      case that sees a complaint SWALLOWED rather than doubled; its expectation is the
      ErrorType-for-Stage-5 item's wrong-but-current complaint and changes when that item lands -- and
      seven rows in OverloadSelectionTests, five holding a refused access to its one complaint and two
      holding an unknown receiver still reported. FIVE MUTATIONS on a confirmed build, each caught by the
      cases and rows named for it: the access arm dropped from PriorFailure failed all five cascade cases
      and the five rows that pass a refused access on; the plain access recording no refusal failed four
      of them, the conditional case being the one it cannot reach; the conditional recording none failed
      that case alone and its one row; a missing member not saying it reported failed the same five
      again; and an UNANSWERING type claiming it reported failed ONLY
      unknown-receiver-member-reaches-its-call and the two unknown rows -- the one mutation that REMOVES
      a complaint instead of doubling one, which is why that case is written to expect a diagnostic
      rather than to forbid one. The full suite -- 6697, 706 and 68 tests, AllFeaturesV2's baseline among
      them -- passed with no failure and no rerun, and the build and `dotnet format` were clean.

      A NO-OP BUILD CAN HIDE ALL OF IT, recorded because it produced a defect report that was not real.
      The mutation script restored each file with shutil.copy2, which preserves the pristine mtime, so
      the restored source read as OLDER than the mutated binary and MSBuild skipped compilation: the
      final "restored build ok" was a no-op that left the last mutation in Mist.Core.dll. The
      per-mutation verdicts were unaffected, since writing a mutation bumps the mtime, but everything
      measured afterwards ran against that binary -- the full suite failed the two unknown-receiver rows,
      which were correctly detecting the leftover mutation, and a probe of the model then "showed" an
      unknown receiver being recorded as reported, a defect that did not exist. Restore with copyfile
      plus a touch, and re-run the corpus and the rows AFTER the final restore rather than trusting the
      build's exit code.
    tasks:
      - >
        Keep the 91 banked samples as the FALSE-POSITIVE half. A new analyzer that refuses OR WARNS on a
        working program fails AllFeaturesV2 -- the warning half enforced since order 2.
      - >
        WITHDRAWN 2026-09-26: the proposed per-case provider optimization is superseded by the
        completed refusal migration; no whole-program corpus remains to optimize.
      - >
        WITHDRAWN 2026-09-26; the former provider-optimization task was never done. This order
        COMPLETELY IGNORED THE TESTING PHILOSOPHY (.claude/skills/testing-philosophy/SKILL.md): every
        corpus case was a full in-process compile, 759 Tier 4-5 tests of Tier 1-2 invariants, the
        philosophy's "most common violation". Measured on ledger 20260926-191851: RefusalCorpusTest
        took 697s of a 754s test run; every other test finished by 173s. The corpus was frozen.
        COMPLETED 2026-09-26: all 759 originals and 764 diagnostic obligations have named replacement
        rows. The 1,020 classified cases comprise 443 Tier 1 decisions, 570 Tier 2 hand-built analysis
        or binder fragments, and seven Tier 4 binding-to-analysis cases, each with exactly one effective
        xUnit Tier trait. Ledger 20260926-221712 records 878 expected failures under 61 grouped mutations
        in 47 production files; the audit matched failing refusal rows for 759/759 original cases.
        All production files match their restored copies. Ledger 20260926-225317 passed all 1,020
        classified tests in a 1s test phase, with passing rows for 759/759 originals, before deletion.
        The 759 files, README, corpus directories and RefusalCorpusTest are deleted. The final rebuild
        had zero warnings/errors (5.26s), and full-solution formatting passed. Unfiltered ledger
        20260926-225427 passed 9,491 tests (Mist.Tests 8,715, CLI 68, source generator 708), both sample
        baselines included, with zero failures/skips and empty failures.txt. Test wall time was 162s
        (2m42s), main assembly 161s, with the build measured separately. This run used an 18-CPU macOS
        host; the original 13m08s full-run measurement used 32 CPUs, so these are not controlled
        same-hardware speedup measurements. Evidence is local and Git-ignored under TestResults/ledger;
        the named tests retain coverage without a second per-case checklist. The completed plan and
        measurement details are in backlog/refusal-corpus-migration.md.

  - id: analyzer-contract
    name: The v2 analyzer contract and runner
    order: 2
    subsystem: infrastructure
    requires: [rejection-ledger]
    status: done
    from: order 97 (exhaustiveness-checking), which states the instruction this order carries out
    evidence: >
      ORDER 97 ALREADY GAVE THE INSTRUCTION: "Design the v2 analyzer contract first, with this rule as
      its first customer rather than its motivation." So the contract comes before any rule, and
      exhaustiveness is what proves it -- chosen because it needs no conversion classification, so it
      cannot be blocked by order 4.
      
      `IAnalyzer` in Mist.Analysis is CLASSIC's, over ISemanticModel, and the isolation rule bars v2
      from it. v2 needs its own: an analyzer over IProgramModel, reporting into a DiagnosticBag,
      modifying nothing. The interesting questions are not the interface.
      
      WHAT A RULE WALKS. The model is navigable without syntax, which is the whole point of it -- but a
      diagnostic needs a source location, and order 69 already records that a conformance contract has
      none to report at. So either every model entity a rule can refuse carries a SourceOrigin, or rules
      walk the AST alongside the model and the model stops being sufficient. The first is the
      ProgramModel's stated design; the second is what classic does.
      
      WHERE ANALYSIS RESULTS LIVE. ProgramModel/CLAUDE.md: "Analysis results from later passes live in
      separate annotation stores." A flow analysis produces facts later rules read -- definite assignment
      feeds the borrow checker -- so the store is a contract question, not an implementation detail, and
      it belongs here rather than being invented by the first analyzer that needs one.
      
      WHERE THE CODE LIVES. Not under ProgramModel/, whose CLAUDE.md excludes analysis; not under
      Mist.Analysis, which is classic's. A sibling namespace, and naming it is part of this order.
      
      THE THREE QUESTIONS WERE ANSWERED BY THE CODE, not chosen between.
      
      LOCATION: the model already carries its syntax. Every Expression and Pattern holds its Node, every
      declared type its DeclarationNode, and the emitter already reports through them. The SourceOrigin
      type ProgramModel/CLAUDE.md describes does not exist in code. So a rule reports at the node the
      model carries, and the contract hands rules the INTERNAL model rather than IProgramModel, exactly as
      the emitter consumes it. Order 69's blocker -- DeclarationNode absent from IMemberType -- only blocks
      a consumer confined to the public contracts, which neither consumer is. Method, Field, Property,
      Statement and LocalVariable carry no node yet, and get one when a rule first has to point at one.
      
      FACTS: decided, not built. A runner-owned store keyed by model entity, producers declared ahead of
      consumers. Built when order 10's first producer arrives; a store with no producer and no consumer is
      speculation, and ProgramModel/CLAUDE.md already rules out putting results on the model.
      
      CODE: Source/Mist/ProgramAnalysis/, namespace Mist.ProgramAnalysis -- beside Mist.ProgramModel,
      outside ProgramModel/ (whose CLAUDE.md scopes it to construction) and outside Mist.Analysis
      (classic's, and named in the clean-room rule). Renames cleanly to Mist.Analysis once classic is
      deleted, as ProgramModel is already slated to become Semantics. Its own CLAUDE.md states the contract.
      
      THE WALKER IS A TABLE BECAUSE THE CLI PUBLISHES TRIMMED. A reflection walker would raise IL2075 at
      publish and, worse, the trimmer could strip the very properties it reads -- a shipped compiler that
      silently skips subtrees while every untrimmed test passes. A table can be enumerated, so
      BodyWalkerCoverageTest holds its keys equal to every concrete node type in the model, and a node with
      no row is an internal error rather than a skip. A refined type test's predicate is deliberately NOT a
      child: it is written once in its alias and would otherwise be visited, and reported in, once per use.
      
      SUPPRESSION LIVES IN THE CONTRACT, and mutation-checking found it UNTESTED at first. AnalysisContext
      .Report takes what a finding is ABOUT and says nothing when any of it is ErrorType, so no rule has to
      remember the peer-stage invariant. Stripping that check failed nothing: a constant arm narrows to the
      SCRUTINEE's type, so over a failed scrutinee the arm itself reads as ErrorType and the analyzer's own
      arm guard bailed before Report was reached. Pinned by a guarded type test, whose arm narrows to a
      real type and so reaches Report -- now the one test that fails when the suppression goes.
      
      THE FALSE-POSITIVE HALF IS NOW REAL FOR WARNINGS. The Tier 6 test compared stdout and the exit code,
      and a Stage 5 rule that only warns touches neither -- so a rule warning on every banked sample would
      have passed. AllFeaturesV2 now fails on any `: warning ` line in stderr, which enforces
      samples/CLAUDE.md's zero-warnings rule where it had only been stated. Measured at zero lines before
      the change, so it was green on arrival.
    tasks:
      - >
        Honour CompilerOptions.EnabledAnalyzerIds, which the runner ignores. Decide first whether classic's
        ids and v2's share one namespace: a caller passing classic's today would switch every v2 rule off.
      - >
        Decide whether ProgramModel/CLAUDE.md's SourceOrigin and "nothing that requires SyntaxNode" text
        should be amended to match the code. It states a design principle, so it is flagged here rather
        than rewritten.

  - id: exhaustiveness-checking
    name: Exhaustiveness over a finite scrutinee
    order: 3
    subsystem: typechecker
    requires: [analyzer-contract]
    status: done
    from: order 97 (exhaustiveness-checking), 4 tasks
    evidence: >
      THE CONTRACT'S FIRST CUSTOMER, and the reason it is third rather than among the pattern rules at
      order 20: it needs no conversion classification. Unguarded catch-all, bool true-and-false, and
      union-constituent coverage are decidable from the model alone.
      
      IT REPORTS ONLY WHAT THE MODEL PROVES, and the false-positive half is what forced it.
      samples/TuplePatternMatching switches over (int, int) with nine relational arms and no catch-all,
      and is exhaustive; a rule assuming tuples need a catch-all would have refused a working program.
      Deciding that shape needs range reasoning, which is order 12's.
      
      THE DECISIONS, as built. A catch-all, or an unguarded type test identical to the scrutinee's type,
      covers everything. bool needs both values. An ENUM needs every variant -- MORE PERMISSIVE THAN
      CLASSIC, which has no enum rule and tells every enum switch to add a catch-all; the variants are a
      closed set, so naming all of them covers it. A union constituent is reported only when NO arm could
      match it; one reached through a guard or only partly is left alone. Anything unbounded, a TUPLE
      included, is reported only when every arm is guarded or a constant, since finitely many constants
      cannot cover it. Guards are never evaluated. An earlier explicit tuple arm was removed: it made a
      guarded-only tuple switch silent though that switch is provably incomplete.
      
      SEVERITY IS A WARNING, which is classic's for MIST_TC_0090 -- confirmed by running classic, which
      prints the warning and runs the program. Minted as MIST_PA_SWITCH_NOT_EXHAUSTIVE rather than reusing
      classic's id, as the binder minted MIST_PM_*.
      
      MEASURED: zero findings across AllFeaturesV2, AllFeatures and the three unbanked standalone samples.
      Five corpus cases, one per shape it reports; the silences pinned in ExhaustivenessDecisionTests.
      Mutation-checked five ways with every build confirmed -- analyzer silenced, guards ignored, contract
      suppression stripped, the walker's lambda row dropped, enum variants never matching -- and each fails
      at least one test. No sample matches an enum variant in a switch at all, so the enum case is exercised
      only by the corpus and its Tier 3 decision.
    tasks:
      - >
        DECIDE THE SEVERITY. Keeping classic's warning is what is built; making a non-exhaustive switch an
        error is stricter than classic and changes what compiles, which makes it a language decision rather
        than this rule's.
      - >
        Tuple product coverage, once order 12's range reasoning exists: the sample's shape becomes provable
        then rather than merely unrefused.
      - >
        An optional scrutinee covered by value arms -- `bool?` with true and false and no void -- is silent:
        a value arm counts as possibly matching every constituent. Sound, and a missed finding.

  - id: total-conversion-classification
    name: A conversion classification that can refuse
    order: 4
    subsystem: typechecker
    requires: [analyzer-contract]
    status: done
    from: the conversion-relation-cannot-refuse invariant; order 46 is its first named customer
    evidence: >
      THE ONE BLOCKER UNDER ROUGHLY 61 OF THE 91 TASKS. Every assignability rule -- assignment,
      argument, return, arm result, initializer value, coalescing operand -- asks a question the existing
      relation is documented as unable to answer. It must gain a total sibling, not be changed: overload
      selection depends on a relation that narrows and ranks without refusing, and the reasoning for
      that is recorded on ConversionRelation itself.
      
      The three kinds the partial relation declines are the work: variance, constructed generics, and
      open type parameters. Each is a decision about what Mist's conversion rules ARE, not a gap to fill
      by copying -- WidensToUnknownArguments already records one such decision, that covariance is keyed
      on the top type and nothing else because Mist has no variance annotation.
      
      CLASSIC'S VERDICTS ARE THE CONTRACT, measured on 28 casts across three probes rather than read off
      its code. A cast is admitted when the value is already assignable to the target or a declared
      operator reaches it -- cast-operators Requirement 8 -- and refused otherwise: every numeric
      narrowing, every downcast, a union narrowed to one constituent, `unknown` narrowed to anything. v2
      refused none of the eight such casts on the first probe; two failed later in Roslyn and six
      COMPILED AND RAN. The spec's own motivating case -- a cast through a base-typed variable to an
      operator only the derived type declares, commented out in samples/CastOperators -- is now refused
      and is a corpus case.
      
      CONVERSIONCLASSIFIER, beside ConversionRelation and not in place of it, answers identity, implicit,
      explicit or none for every pair, and states the rules the partial relation declines. A constructed
      type reaches its definition's bases with its own arguments substituted, and there is no variance
      beyond the covariance to unknown already stated. A type parameter is within its type constraints
      and nothing below them. A refinement is within its base, and the base reaches it only explicitly --
      the predicate is order 12's to discharge. A dependent value classifies as its domain. An enum is
      within its underlying type, and a newtype and its source reach each other only explicitly: the
      conversions the emitter spells as operators, stated because the model declares none. A fifth
      answer, UNCLASSIFIED, is for a sentinel -- an error type, a skipped CLR type -- where there is no
      type to classify and a refusal would blame the program for the compiler.

      DEPENDENT LENGTH ERASURE, 2026-09-26. Literal stackalloc lengths exposed a conversion gap:
      `Span<T>` and `ReadOnlySpan<T>` aliases carry bare unknown in their declared dependent slot,
      while sized allocations carry a lifted Int32 value. The classifier now accepts that erasure
      only for a declared dependent parameter with the same underlying value domain. Ordinary struct
      type arguments remain invariant, differing known lengths remain distinct, and a bool cannot
      fill the unknown Int32 length slot. StackallocLengthWideningTests holds both span families,
      constructed elements and aliases against the real Standard declarations, plus the refusals.
      
      THE CONSTRUCTED-GENERICS GAP WAS REAL. `(IEnumerable<int>)list` is admitted by classic, and the
      partial relation answered false for it: Inherits walks only MemberType and a List<int> is a
      ConstructedType. A cast rule built on the relation would have refused a working program.
      
      THE ENUM RULE WAS FOUND TWICE, BOTH BY MEASUREMENT. The false-positive sweep caught `(Color)0` in
      samples/Enums -- an int literal into a byte-backed enum, which classic admits. An integral-source
      rule fixed it; the next probe showed classic also admits `(Color)measured` from a double. So any
      numeric source reaches a numeric-backed enum, which is C#'s own rule for an explicit numeric step
      into an explicit operator, and the emitted `explicit operator Color?(byte)` compiles for all of
      them. It is NOT a constant rule: classic refuses `(byte)5`.
      
      THREE DELIBERATE DIVERGENCES, all more permissive than classic and all compiling in C#. `(Animal)t`
      with `T : Animal` is admitted, as Requirement 8.8 says an already-assignable cast is -- classic
      refuses it, contradicting its own spec. `(int)Color.Red` from a byte-backed enum is admitted by
      chaining the enum's implicit conversion with a widening, as FindOperator already chains around every
      user operator; classic refuses it. And Requirement 8.7 -- operators on base types not searched -- is
      not followed, because FindOperator walks base chains and overload ranking depends on it.
      
      MEASURED: zero findings across every banked sample and the three unbanked standalone ones. Ten
      corpus cases, one per refused shape. A 25-row classification table plus type-parameter and sentinel
      facts. Six mutations, each on a confirmed build -- cast rule silenced, constructed types given no
      bases, substitution ignored, type parameters given no constraint, numeric sources barred from enums,
      sentinels refused -- and each fails at least one test.

      THE ENUM RULE IS REVERSED BY DECISION (2026-09-12), superseding "found twice" above, which followed
      classic. Any numeric source was C#'s explicit numeric step leaking through, and it TRUNCATED:
      `Tier? t = (Tier)1.5;` printed Low on both pipelines while `(int)1.5` is refused on both. The
      language owner's rule, now enums Requirement 15: a cast is sugar for a conversion function, and a
      cast to an enum calls its lookup, `(underlying) -> E?`. The operand is admitted exactly when it could
      be passed to a parameter of the underlying type, judged by Assignability, so a fitting constant is
      admitted (`(Color)0`, which samples/Enums needs) and a narrowing never is. The cast is typed
      `E | void`; the refusal of `E e = (E)v` is order 5's.
      STRICTER THAN CLASSIC, measured -- `(Tier)1.5`, `(Tier)2L` and `(Color)n` from an int variable are
      MIST_PA_ENUM_CAST_ARGUMENT_MISMATCH, where classic admits all three. MORE PERMISSIVE -- another
      enum (`(Tier)Other.One`), a union-backed enum's constituent and a class declaring `implicit operator
      int` are admitted as arguments are; classic passes the first two through its checks and fails them
      in Roslyn, and the third was not probed on classic. The table's `i -> color` and `d -> color` rows
      are None now, and the int-into-an-enum corpus case reports NO_IMPLICIT_CONVERSION rather than
      CAST_REQUIRED, since no cast from an int variable reaches a byte-backed enum. Two corpus cases and
      a CastDecisionTests theory of nine admits; mutating the enum branch to refuse every lookup fails
      eight of the nine, the ninth being a cast of an enum to itself, which is no lookup. An enum over a
      NARROWER base reaches a wider one through its own implicit conversion and a widening --
      `(Wide)Priority.Low` with `Wide : long` is admitted, lowered `((Wide?)(long)(Priority.Low))` and
      prints the variant -- and the reverse is a narrowing and refused; a tenth admit, a third corpus
      case and two table rows hold both directions.

      DECLARED CAST OPERATORS ARE CALLS TOO (2026-09-12), closing the task that said FindOperator still
      followed C#. The language owner's rules: `(T)v` is `T.ExplicitCast(v)`, the operand is matched as an
      argument, so choosing among operators is overload resolution and a tie is an error; a value passes
      through at most ONE user-declared conversion, and lossless ones -- subsumption, Standard's intrinsic
      conversions, an enum to its value -- never count; C#'s one-conversion-per-cast limit is the
      emitter's to lower, never a reason to refuse. Now cast-operators Requirements 7.8 and 8.3-8.13.
      CastOperatorSelection gathers the operators on both ends and their base chains whose result
      reaches the target losslessly, prefers one answering the written type exactly, and ranks the rest
      by OverloadResolution.CompareConversions; a lone candidate is returned unjudged, as a call's is.
      CastExpression records the choice (Operator, AmbiguousOperators), its type is the called operator's
      return type, and ParameterType generalises the enum lookup's parameter, so CastAnalyzer judges
      either argument through Assignability and the emitter lowers either through CastLowering.Argument.
      The classifier's EXPLICIT answer asks the same selection, through an implicit-only IsImplicit so a
      cycle of operators cannot recurse.
      MEASURED on v2 against classic, before and after. `Feet b = (Feet)reading;` with Reading implicit to
      Meters and explicit Feet(Meters): was CAST_HAS_NO_CONVERSION, classic fails in Roslyn (CS0030), now
      prints 6, lowered `((Feet)(Meters)(reading))`. The same with an IMPLICIT Feet(Meters): was refused,
      classic Roslyn-fails, now prints 6 -- an explicit cast may call an implicit operator. `Feet f =
      reading;` with the implicit operator stays refused, now CAST_REQUIRED rather than
      NO_IMPLICIT_CONVERSION, since the cast that would work exists. `(Feet)Priority.High` over
      Feet(int): was refused, classic Roslyn-fails, now prints 6. `(Feet)2` over Feet(byte): was refused,
      classic prints 6, now prints 6. `(Label)car` through Vehicle's operator: admitted before and after,
      classic refuses (MIST_TC_0042) by its reading of 8.7, which the amendment reverses. `(Feet)sensor`
      needing two declared implicits: was CAST_HAS_NO_CONVERSION, classic Roslyn-fails, now
      MIST_PA_CAST_ARGUMENT_MISMATCH naming the operator. Unchanged: `Meters m = reading; (Feet)m` and
      `long l = new Counter(5)` print on v2, the second refused by classic (MIST_TC_0001).
      AMBIGUITY, NEW TO v2. Two operators of one signature on both ends: Roslyn failed against generated
      C# (CS0457), classic MIST_TC_0043, now MIST_PA_AMBIGUOUS_CAST naming both with their declaring
      types. Two parameters a Reading reaches by declared implicits: was CAST_HAS_NO_CONVERSION, classic
      cannot declare them (it reports MIST_SB_0043 "duplicate" for two explicit operators to one target),
      now AMBIGUOUS_CAST. `(long)tally` with implicit int and long operators printed C#'s choice (105) and
      still does, by the exact-return preference; classic refuses it (MIST_TC_0042). `(double)tally`, where
      neither answers double exactly, printed C#'s choice (the most encompassing, long) and is NOW REFUSED
      as ambiguous. DECIDED CORRECT by the language owner (2026-09-13): by the argument the two tie, and a
      candidate's result is not a tiebreak, so Mist does not follow C#'s most-encompassing rule. The shape
      is a constructed fixture, not one found in any program -- the brief's Counter declares only the int
      operator, and `(double)new Counter(5)` prints 5.
      PROVED BY five corpus cases -- three ambiguities (two parameters, both ends, two widening results),
      an argument needing two declared implicits, and an argument needing a narrowing -- plus
      assignability-core's declared-implicit-after-declared-implicit for the implicit half. Admits: six
      CastDecisionTests rows (through a declared implicit, an implicit operator called explicitly, a
      declared implicit then a widening, an enum's backing value, a fitting constant, the exact-return
      choice) and AssignabilityDecisionTests' declared implicit then a widening. Selection facts in
      CastSelectionTests: the operator called through a declared implicit, the exact-return preference,
      three ties recorded with none called, a lossless cast calling nothing among two widening operators,
      and a cast typed as its operator's narrower result. Spellings in CastLoweringTests (renamed from
      EnumCastLoweringTests). Six mutations on confirmed builds each fail at least one test: the
      exact-return preference removed, the lone candidate judged by applicability, the argument never
      judged, the classifier ignoring a called operator (which also breaks regex-from-a-string-variable,
      Regex's explicit operator being a lone candidate), every argument spelled as a cast, and ties
      resolved by taking the first. False positives: zero across all 80 banked samples, AllFeaturesV2 and
      AllFeatures green, 5890 of 5890.

      AN INTEGER CONSTANT IS AN ARGUMENT AMONG SEVERAL CANDIDATES TOO (2026-09-13), closing the task that
      said applicability was asked of types alone. ConstantConversion holds the one rule, moved out of
      Assignability -- a constant reaches every integral type that holds its value -- and both
      OverloadResolution's applicability and CastOperatorSelection ask it beside the type relation, so the
      narrowest fitting parameter wins by the betterness already there. method-overloading Requirement 3.7
      states it for calls; cast-operators 8.10 already did for casts.
      MEASURED on v2 against classic, before and after. `Take(2)` over Take(byte) and Take(string): was
      MIST_PM_UNRESOLVABLE_OVERLOAD, classic prints `byte 2`, now prints `byte 2`. `Take(2)` over Take(byte)
      and Take(long): printed `byte 2` on both pipelines before and after, but before, the MODEL chose
      Take(long), the only applicable candidate, and Roslyn chose byte from the emitted call; the two now
      agree. `(Crate)2` over Crate(byte) and Crate(string): was CAST_HAS_NO_CONVERSION, classic cannot
      declare the pair (MIST_SB_0043), now prints `byte 2`, lowered `((Crate)(byte)(2))`. `Take(300)` stays
      UNRESOLVABLE_OVERLOAD at the Mist source, where classic fails in Roslyn.
      PROVED BY OverloadSelectionTests (a theory of four constants reaching the narrowest parameter they
      fit, and 300 and an int variable reaching none), CastSelectionTests (the operator a constant fits
      narrowest), a CastDecisionTests admit among two operators, and the corpus case
      cast-constant-fitting-no-operator. Two mutations on confirmed builds each fail their tests: calls
      ignoring the constant, and casts ignoring it. Full suite green, 5915 of 5915.

      A CONSTRUCTED TYPE REACHES ITS BASES IN THE RELATION TOO (2026-09-13), closing the task that said
      Inherits could not see one. It was not only ranking: Inherits walked a MemberType alone, so a
      constructed argument reached no base and its overload was not APPLICABLE. It now walks Bases, moved
      from ConversionClassifier into ConversionRelation, substituting each constructed step's arguments.
      MEASURED on v2 against classic, with QUALIFIED calls so classic's checker judges them.
      `Sink.Take(list)` over Take(IEnumerable<int>) and Take(string): was MIST_PM_UNRESOLVABLE_OVERLOAD,
      classic prints `enumerable`, now prints it. `Sink.Take(new Box<int>(4))` over Take(IHold<int>) and
      Take(string): was UNRESOLVABLE, classic prints `held 4`, now prints it. Beside Take(unknown), both
      pipelines printed `held 4` before, but the model chose Take(unknown), the only applicable candidate,
      and Roslyn chose IHold<int>; they now agree.
      PROVED BY OverloadSelectionTests (Box<int>, IntBox through Box<int>, and the unknown sibling reaching
      IHold<int>; Box<int> reaching no IHold<string>) and ClrConstructedContainmentTests over the runtime's
      metadata (List<int> within IList, ICollection and IEnumerable of int, not IEnumerable<string>). Two
      mutations on confirmed builds each fail six tests: constructed types given no bases, and bases left
      unsubstituted. Full suite green, 5923 of 5923.

      A SIGNED INTEGRAL PARAMETER OUTRANKS AN UNSIGNED ONE IT DOES NOT CONTAIN (2026-09-13), BY DECISION AND
      MORE PERMISSIVE THAN CLASSIC. The language owner adopted C#'s table (method-overloading Requirement
      3.3, cast-operators 8.11): sbyte over byte, ushort, uint and ulong; short over ushort, uint and ulong;
      int over uint and ulong; long over ulong. The decision was first taken on a false premise and asked
      again: `Take(b)` inside Program printed `short 2` on classic only because classic's checker never
      judges a bare-name call and Roslyn chose. QUALIFIED, classic refuses every such call --
      `Sink.Take(b)` and `sink.Take(b)` over Take(short) and Take(uint), and five pairs from the table, are
      MIST_TC_0032 -- and v2 reported MIST_PM_AMBIGUOUS_OVERLOAD for the same calls. Now all print C#'s
      choice. Containment still decides first: a ushort over Take(short) and Take(uint) reaches uint alone.
      PROVED BY an OverloadSelectionTests theory (a byte over short and uint, a ushort over long and ulong,
      2 over sbyte and byte, 200 reaching byte alone, a ushort reaching uint alone) and a CastSelectionTests
      fact for the same choice among operators. Two mutations on confirmed builds each fail four tests: no
      preference, and unsigned preferred. Full suite green, 5929 of 5929.

      THE SIGNED PREFERENCE IS REVERSED BY DECISION (2026-09-13), superseding the paragraph above. The language
      owner, weighing which of C#'s two algorithms was more sound: "Let's mirror classic and be stricter.
      Ambiguous is ambiguous." Measured in plain C# first: C#'s conversion-operator algorithm breaks a tie only
      when one of the two types implicitly converts to the other, so implicit `int(Tally)` and `long(Tally)`
      into a double pick long and `Dial(short)` and `Dial(int)` from a byte pick short, while `short(Mirror)`
      and `uint(Mirror)` into a long and `Gauge(uint)` and `Gauge(short)` from a byte are both CS0457; only
      its method overload resolution carries the signed table, so the same signatures as static methods pick
      short. The preference was the one tiebreak Mist kept that chooses between two pieces of user code on a
      convention rather than on the argument, a byte reaching both short and uint unchanged. It goes for calls
      and conversions together, never for one alone, so the invisible call keeps meaning what the visible one
      does. method-overloading Requirement 3.3 is rewritten, and cast-operators 8.11 defers to it.
      MEASURED on v2 after: `Sink.Take(small)` over Take(uint) and Take(short) is MIST_PM_AMBIGUOUS_OVERLOAD, as
      is `Sink.Small(2)` over Small(byte) and Small(sbyte); `(Meter)small` over explicit Meter(uint) and
      Meter(short) is MIST_PA_AMBIGUOUS_CAST; `Gauge g = small;` over the implicit pair is
      MIST_PA_AMBIGUOUS_IMPLICIT_CONVERSION. Classic cannot declare either operator pair (MIST_SB_0043) and
      reports the calls as MIST_TC_0032. DISAMBIGUATION, measured: `Gauge g = (short)small;` prints 2,
      `(uint)small` 1, `(Meter)(short)small` 2, `Sink.Take((short)small)` short and `(uint)small` uint. A
      CONSTANT CANNOT BE DISAMBIGUATED BY A CAST: `(sbyte)2` and `(byte)2` are MIST_PA_CAST_HAS_NO_CONVERSION, as
      classic refuses `(byte)5`, so `Small(2)` chooses through a local, `sbyte signedTwo = 2;`, which prints
      sbyte. Containment still decides first: a ushort over Take(short) and Take(uint) reaches uint alone, and
      200 over Small(sbyte) and Small(byte) reaches byte.
      Operator admissibility asks the implicit selection beside the classifier in the same change, as overload
      applicability already did, so a user-defined operator's operand takes the lossless enum step too:
      `new Level() + priority` found no operator before.
      PROVED BY three corpus cases (the call, the implicit conversion, the cast), OverloadSelectionTests rows
      for the three ties and for the choices containment, a cast or a typed local makes, a CastSelectionTests
      theory of the tie and the cast that breaks it, and ImplicitConversionSelectionTests facts for the tie and
      both casts. Two mutations on confirmed builds, failing three tests and one: the signed preference
      reinstated, and operator admissibility blind to the selection. Full suite green, 6081 of 6081.

      A CAST TO `T?` CALLS `T | void`'S CONVERSION FUNCTION, NOT T'S (2026-09-13), closing the task that
      asked. The language owner: the operator a cast to `Feet?` matches is Feet?'s, "aka Feet | Void NOT
      Feet". A union declares no conversions, so `(Feet?)meters` through an operator Feet declares stays
      CAST_HAS_NO_CONVERSION, as it was on both pipelines, and the implicit form is the same call written
      invisibly: `Feet? f = meters;` through Feet's implicit operator stays MIST_PA_NO_IMPLICIT_CONVERSION,
      STRICTER THAN CLASSIC, which prints 6 for it. An operator declared on the SOURCE whose result reaches
      Feet? losslessly still applies, being found on the operand's own type. No code changed.

      TWO REFUSALS FOR A NEWTYPE OVER A MUTABLE CLASS (2026-09-13, newtypes spec task 17, recorded in full
      under emitter order 86). A cast between the newtype and a source with no IClonable of itself is
      MIST_PA_NEWTYPE_SOURCE_DEFINES_NO_COPY rather than CAST_HAS_NO_CONVERSION. Where the source has one,
      the cast calls an operator running a Clone body with the operand as this, and the rule reports
      MIST_PA_CLONE_CONVERSION_DOES_NOT_HOLD when that body does not type: the runner judges each such body
      first, every rule over it alone with its findings withheld, and hands the reasons to the rule through
      AnalysisContext.ConversionRefusals. AN INSTANCE OF A GENERIC NEWTYPE IS JUDGED THE SAME (2026-09-19):
      `(Crated<int>)new Crate<int>(1)` over a mutable `Crate<C>` was CAST_HAS_NO_CONVERSION where the closed
      twin named the missing copy, CastAnalyzer matching a bare ConcreteType only; it reads the instance's
      source through ConversionRelation.CloneSourceOf in both directions.

      THE CLASSIFIER'S IMPLICIT ANSWER ASKS CastOperatorSelection.Implicit (2026-09-13, emitter order 46), the
      selection that records the conversion at every implicit position, in place of ConversionRelation.FindOperator,
      which is deleted. So a value is implicitly convertible exactly when some position would record a conversion
      for it: `Priority` into a `Level` with `implicit operator Level(int)` classifies Implicit, where the
      containment-bracketed search had answered Explicit.

      REGEX TO STRING IS FREE IN A CHAIN (2026-09-13, emitter order 46), closing the task that said it counted
      as the one declared implicit. CastOperatorSelection brackets an operator's ends with a lossless test that
      admits one of Standard's intrinsic implicit conversions between free steps, as the glossary's
      Lossless_Conversion names them, and a cast's operand that takes its one declared implicit is now recorded
      as an ImplicitConversionExpression. MEASURED on v2 before and after: `(Feet)pattern` through explicit
      Feet(Meters) and implicit Meters(string) was MIST_PA_CAST_ARGUMENT_MISMATCH and prints the pattern;
      `(Grade)Priority.High` through explicit Grade(Level) and implicit Level(int), the enum step being lossless
      too, was CAST_ARGUMENT_MISMATCH and prints 6. `Label label = pattern;` with implicit Label(string) was
      MIST_PA_CAST_REQUIRED, and `string text = new Pattern();` with `implicit operator regex(Pattern)` was
      MIST_PA_NO_IMPLICIT_CONVERSION; both print. `Label twice = new Pattern();`, two declared conversions
      around the intrinsic step, stays refused, and `Feet needsCast = pattern;` is CAST_REQUIRED, the cast
      that would work being found through the same step. Recorded in full under emitter order 46.

      A CAST OF A FITTING INTEGER CONSTANT IS ADMITTED (2026-09-14), BY DECISION AND MORE PERMISSIVE THAN
      CLASSIC, superseding "It is NOT a constant rule" and "A CONSTANT CANNOT BE DISAMBIGUATED BY A CAST"
      above. The advice every ambiguity gave was false for a constant: `Sink.Small(2)` over Small(byte) and
      Small(sbyte) said "Cast an argument to choose one", and `Sink.Small((sbyte)2)` was
      CAST_HAS_NO_CONVERSION. The language owner chose to admit the cast rather than reword the advice: the
      constant is already a value of the target, as `byte b = 2;` says, and every conversion FUNCTION already
      took a fitting constant as its argument -- a declared operator (`(Crate)2` over Crate(byte)), an enum's
      lookup (`(Color)0`), a newtype's conversion (`(Small)2` over `new short`) -- leaving only the integral
      type itself refused. cast-operators Requirement 8.8 is amended to say so, and method-overloading 3.3
      now names `Take((sbyte)2)` as the remedy. CastAnalyzer admits a cast with no conversion function when
      ConstantConversion.Fits holds, so the rule has one home with `byte b = 2`.
      MEASURED on v2 before and after, one project per probe, against classic. `(byte)2`, `(sbyte)-1`,
      `(uint)2`, `(ulong)2` and `(SmallAdult)20` over `byte >= 18`: were CAST_HAS_NO_CONVERSION, classic
      MIST_TC_0042, now print, lowered `((byte)(2))`, `((sbyte)(-1))`, the first typed byte (Show(byte) over
      Show(int) prints byte). `Sink.Small((sbyte)2)` and `((byte)2)`: were CAST_HAS_NO_CONVERSION, classic
      TC_0042 and TC_0032, now print sbyte and byte. Unchanged: `(byte)300`, `(byte)-1` and `(byte)count`
      from an int local stay CAST_HAS_NO_CONVERSION; `(long)2` and `(AdultAge)20` print on both.
      THE THREE REMEDY MESSAGES ARE KEPT, now true for a constant. A constant reaches all three ties:
      `Sink.Small(2)` is MIST_PM_AMBIGUOUS_OVERLOAD, `Crate c = 2;` over implicit Crate(byte) and
      Crate(sbyte) MIST_PA_AMBIGUOUS_IMPLICIT_CONVERSION, `(Crate)2` over the explicit pair
      MIST_PA_AMBIGUOUS_CAST, and classic cannot declare either pair (MIST_SB_0043). Each remedy now works:
      `Sink.Small((sbyte)2)` prints sbyte, `Crate c = (byte)2;` and `(Crate)(byte)2` print byte, where all
      three were CAST_HAS_NO_CONVERSION. An argument with no type of its own reaches no tie to be advised on:
      `Sink.Run(x => x)` over Run(Func<int, int>) and Run(Func<string, string>) is
      MIST_PM_LAMBDA_PARAMETER_NO_TYPE, and `Sink.Many([])` over int[] and string[]
      MIST_PM_EMPTY_ARRAY_LITERAL_NO_TARGET, both before overload resolution. So every argument reaching the
      messages is a typed value or a fitting constant, and a cast to a parameter type is admitted for both.
      Classic also refuses the typed local, `sbyte signedTwo = 2; Sink.Small(signedTwo);` being TC_0032, so on
      classic no remedy reaches Small(sbyte) from a constant; v2 prints sbyte for it, as before.
      NOT CHANGED, and not this rule's: a cast INTO a refinement is proven by nothing on either pipeline.
      `(AdultAge)10` and `(AdultAge)n` from an int local holding 10 print 10 on v2 and on classic, and
      `(SmallAdult)20` now joins them in going unproven rather than refused; recorded as a task on order 12.
      PROVED BY a CastDecisionTests theory of five admits (byte, a negative sbyte, ulong from an int and from a
      long constant, a refinement over byte), OverloadSelectionTests rows for `(sbyte)2` and `(byte)2` choosing
      among Take(sbyte) and Take(byte), and three corpus cases: constant-narrowing now `(byte)300`, and new
      negative-constant-to-an-unsigned-type and integral-narrowing-of-a-variable. The admit mutated away on a
      confirmed build fails the five admits. Full suite green on the branch, 6177 of 6177.

      A COPY THAT CANNOT BE FIELD FOR FIELD IS ITS OWN REFUSAL (2026-09-20), newtypes Requirement 2.8 and
      MIST_PA_COPY_CONVERSION_DOES_NOT_HOLD. A copyable source whose slot names the source answers the
      newtype in the clone, so no slot of one stands for the slot of the other; NewtypeConversions records
      that first slot on the clone and synthesizes neither direction. The refusal names the slot and both
      of its types at the instance, and says the source implements no `IClonable<Source>` to say how it is
      copied. Reported through one helper, UnheldCopies, from CastAnalyzer at a cast and from
      AssignabilityAnalyzer at an implicit position, because both directions are missing and a leave asked
      for one as much as a cast does: on main 0f90bbfd `(Chain<int>)nodes` was CAST_HAS_NO_CONVERSION and
      `Node<int> back = chain;` NO_IMPLICIT_CONVERSION, neither naming the field that has to change. Where
      the source DOES implement IClonable the Requirement 10 conversions run instead, which is what makes
      this rule's silence the interesting half: the corpus case is a readonly class with a `Node? Next`
      and no IClonable, and NewtypeConversionDecisionTests holds all three positions plus the message.
      Mutating the record away to null fails the three decision rows and the three message rows; mutating
      UnheldSlot to find nothing fails those six and the readonly-clonable rows besides; mutating the report
      out of AssignabilityAnalyzer fails the two leave rows and nothing else.
    tasks:
      - >
        Order 5 is where the classification gets its other customers: assignment, argument, return, arm
        result and initializer value all ask it the question the cast rule asks now.
      - >
        A newtype's conversion is a function too, taking its source, yet `(Meters)reading` over `type
        Meters = new double` with Reading implicit to double is CAST_HAS_NO_CONVERSION on v2 and MIST_TC_0042
        on classic. Reading the spec found it written for a different model, so the newtypes spec was
        REVISED on 2026-09-13 (a renamed clone, implicit out of a copyable source, a cast in as a call) and
        this is its task 15, staged after the clone itself (tasks 13 and 14).
      - >
        A cast into a union with a refined constituent, from that constituent's base, has no conversion:
        over `type AgeOrName = AdultAge | string`, `(AgeOrName)k` for an int k and `(AgeOrName)20` are
        CAST_HAS_NO_CONVERSION on v2 (measured 2026-09-14), where `(AdultAge)k` classifies as explicit and
        `AgeOrName u = k;` is admitted and left to the refinement prover. ConversionClassifier's
        ExplicitByDeclaration reaches a refinement from its base but not a union through such a
        constituent, and ConstantConversion.Fits holds only narrower integral types. Classic admits both.
        Since order 12 judges a cast's operand against a union's refined constituents, admitting these would
        leave the predicate to the prover as the assignment does; which casts reach a union is this order's
        decision.

  - id: assignability-core
    name: Assignability at every position that has a target type
    order: 5
    subsystem: typechecker
    requires: [total-conversion-classification]
    status: done
    from: >
      orders 46, 64, 78, 79, 81, 86, 88, 95, 116 -- the tasks that all reduce to one question asked at
      different positions
    evidence: >
      NINE TASKS ACROSS SEVEN LAYERS ARE ONE RULE AT SEVEN POSITIONS. Classic spreads them over its
      MIST_TC_0001 and the 0041-0047 family; v2 asks the question once and reports it where it was asked,
      because the positions are already the places the binder pushes a target type for.

      CLASSIC'S VERDICTS ARE THE CONTRACT, measured on a 44-case probe with one refusal candidate per
      method so no failure could cascade into the next. Classic refuses 31 of them; every one of those is
      refused by v2 at the same construct. The other 13 classic ADMITS AND ROSLYN THEN REFUSES -- a long
      or double into an int local, an int variable into a byte, a constant out of range, a double literal
      into a float or decimal, a long literal into an int, a single-candidate argument of the wrong type
      (unknown included, which order 81 asked for), a lambda result or block return against the target, a
      constructed generic argument, a deconstruction element, a written enum variant value, and a field
      or property initializer. Measured a second time by running exactly those through classic's whole
      pipeline: 23 Roslyn errors, none of them a program that ran. v2 refuses all 13 at Stage 5. This is
      stricter than classic's analyzer and identical to classic's verdict, and it is the one place this
      order departs from the never-refuse-what-classic-admits rule on purpose.

      THE RULE. A value may stand at a position when Classify answers identity or implicit; explicit is
      reported as a missing cast (MIST_PA_CAST_REQUIRED, classic's TC_0001 wording), none as no
      conversion (MIST_PA_NO_IMPLICIT_CONVERSION). Two admits the classification alone would refuse:
      an integer constant into any integral type it fits, which is C#'s constant conversion and what
      makes `byte b = 1` a program -- an int constant into sbyte, byte, short, ushort, uint or ulong in
      range, a long constant into ulong when not negative, never into char, which classic also refuses;
      and a target that is a refinement over a type the value already belongs to, left to order 12 as its
      predicate is, since a rule judging it here refused `AdultAge age = 20`, `AdultAge | void`, and
      DrinkingAge into AdultAge, all of which classic admits.

      THE POSITIONS: local initializer, assignment and coalescing assignment against the target's
      non-void portion, return against the return target, argument against the selected overload's
      substituted parameter, constructor argument likewise, initializer entry against the member,
      coalescing right operand against the link, each switch arm against the switch, each array literal
      element against the literal's element type, each deconstruction element against its target,
      an expression-bodied lambda result against the function's result, a typed foreach variable against
      the collection's element, a written enum variant value against the base, a field or property
      initializer against its declaration, and an expression-bodied getter against the property. Four of
      those targets the binder knew and dropped, so the model now carries them: ReturnStatement.TargetType,
      InvocationExpression.ParameterTypes and NewExpression.ParameterTypes read through the call's own
      substitution, and ObjectInitializerAssignment.TargetType.

      THE SWEEP WAS THE WORK. The first run reported 44 findings across the 72 banked samples, every one
      a typing gap emission never needed and a checker cannot stand on. Each was fixed at its source
      rather than carved out of the rule: a comparison or logical operator now types as bool, a
      concatenation as string, and primitive arithmetic by C#'s promotion, where all of them took the left
      operand's type; a `??` whose right operand is still optional stays optional, so a chain closes at
      its last link and `int c = opt ?? o3` is refused at the local as classic refuses it; an untargeted
      block-bodied lambda, and an async block, no longer inherit the enclosing method's return type for
      their own returns;
      `new int[3]` carries its length; a projected System.Span<T> gains the unknown length its Mist
      declaration has a slot for, as a projected array always did; the classifier looks through a type
      alias, admits a value parameter into its domain, expands a constructed alias when handed the
      interner so `Action<int>` is the function type it names, holds a sized array within the unsized one
      by absorbing a lifted length into an unknown-value slot, and treats a structural function type and
      a CLR delegate of the same Invoke shape as within each other, the crossing DelegateLowering
      materialises -- whose shape logic moved into the model as DelegateShape so the two agree by
      construction. A nested refinement is unwrapped before the prover carve-out asks about its base.

      DIVERGENCES, all more permissive than classic and all compiling in C#: a typed foreach variable
      admits a widening, where classic demands the element type exactly; a switch whose arms are int and
      string is admitted into an `int | string` or `unknown` target, where classic demands one arm type
      regardless of target; a chained `??` is admitted, where classic refuses any chain outright;
      `Task<int> t = Async()` is admitted because the position wants the task, where classic auto-awaits
      and refuses; and `return v` with `T : Animal` from a method returning Animal is admitted, the
      assignability form of order 4's first divergence.

      NOT JUDGED, each on purpose: an argument to a CLR-projected member, because the model does not
      represent CLR optional parameters and so can select an overload by arity that Roslyn will not --
      `builder.UseNpgsql("...")` named the (Action) overload; an argument absorbed by a flattened pack
      slot; a collection-initializer element, whose Add overload the binder already selects; a return
      whose target is void, which is order 6's question; and a constructor chain's arguments, since no
      chained constructor is recorded.

      MEASURED: zero findings and identical stdout on AllFeaturesV2 and on AllFeatures, and zero findings on
      CSharpInteropV2, DelegateFuncConversion and Testing built standalone -- the last only once
      ClrNullability tolerated an attribute type TestHost 17.12 references but never defines, which had
      thrown before any rule ran.
      39 corpus cases, one per refused shape. 71 decision rows pinning the admits, the divergences and the
      three reach facts, with a fixture whose bodies exercise a value parameter's domain, an async int
      return, an untargeted lambda in an int method, and a constrained T returned as its constraint.
      Classifier rows for sized and unsized arrays, and facts for a value parameter's domain, alias
      expansion under an interner, and the delegate crossing. Sixteen mutations, each on a confirmed
      build: rule silenced, constant fit removed, refinement carve-out removed, explicit reported as
      none, array-length and delegate-shape and alias-expansion and value-domain rules removed one at a
      time, return and argument targets not recorded, the lambda and coalesce and comparison and
      array-creation fixes reverted, enum values and initializer entries not judged. Fifteen were caught
      on the first pass; alias expansion SURVIVED, because the alias the fact wrote in source was
      expanded by the resolver before the classifier saw it. The fact now constructs the alias through
      the interner unexpanded, as a projected `Action<int>` parameter arrives, and the rerun caught it.

      AN IMPLICIT CONVERSION WHOSE CANDIDATES TIE IS REFUSED (2026-09-13), as MIST_PA_AMBIGUOUS_IMPLICIT_CONVERSION,
      naming both operators -- cast-operators Requirements 7.6 and 13.5. The binder now records the conversion
      an implicit position calls as an ImplicitConversionExpression (emitter order 46), whose type is the
      called operator's result, so this rule judges the wrapped value as already of that type and the node
      carries the question of whether an operator was chosen at all. A tie is the node with
      AmbiguousOperators and no Operator, reported once at the value; the enclosing position stays silent,
      the tie's type being the slot's. `double d = tally;` over implicit int and long printed 2 on v2 before,
      C#'s most-encompassing choice, and is now refused, which is `(double)tally`'s verdict written invisibly.
      Classic refuses it as MIST_TC_0001. Not reported: `long exact = new Tally();` (the exact result
      outranks), `int | string reachedByOne = new Tally();` (only int reaches the slot), `double chosen =
      (long)new Tally();` (the cast chooses). A corpus case, implicit-conversion-ambiguous, and three
      decision rows. Two mutations on confirmed builds: the report silenced fails the corpus case; the report
      made on every conversion fails seven decision rows.

      AN INTEGER CONSTANT REACHES A UNION THROUGH A CONSTITUENT THAT HOLDS IT (2026-09-14), closing a false
      refusal found while probing order 4's constant cast. ConstantConversion asked whether a constant fits
      the slot's type as a whole, and `byte | void` is no integral type, so every optional over a narrower
      integral was refused a constant that classic runs. It now answers for a union as for any constituent,
      the relation's own rule for a value that is already one, and every asker -- assignability, overload
      applicability, a cast operator's parameter, order 4's cast -- takes it from there.
      MEASURED on v2 before and after, one project per probe, against classic. `byte? b = 2;`, `sbyte? s =
      -2;`, `ulong? u = 2L;`, `SmallAdult? a = 20;` over `byte >= 18`, `Sink.Opt(2)` into a byte?
      parameter, `return 2;` from a byte? method, a field initializer `byte? Size = 2;`, and `b = 2;` into a
      byte? local: were MIST_PA_NO_IMPLICIT_CONVERSION, classic prints each, now print, emitted as written
      (`byte? b = 2;`). `byte | string u = 2;`: was refused, classic prints `Union_Byte_String` (the wrapper
      has no ToString), now prints the same, and `u is byte x` reads 2 on both. `Sink.Pick(2)` over
      Pick(byte?) and Pick(string): was MIST_PM_UNRESOLVABLE_OVERLOAD, classic prints byte?, now prints it.
      `Sink.Wide(2)` over Wide(byte?) and Wide(long?) printed byte? on v2 before and after, but before, the
      MODEL chose long?, the only applicable candidate, and Roslyn chose byte? from the emitted call; they
      now agree, the narrower optional being the more specific. Classic refuses that call as ambiguous
      (MIST_TC_0032), which v2 does not follow: byte? is within long?, so it is no tie. `(byte?)2` was
      CAST_HAS_NO_CONVERSION on both pipelines and now prints 2, lowered `((byte?)(2))`, by order 4's
      amended Requirement 8.8. `SmallAdult? a = 10;` reported NO_IMPLICIT_CONVERSION beside
      REFINEMENT_VIOLATED, one mistake twice, and now reports the second alone, as classic's TC_0097 does.
      Unchanged: `byte? b = 300;`, `int i = 2; byte? b = i;` and `(byte?)300` stay refused; classic fails
      the first two in Roslyn and refuses the third.
      PROVED BY an AssignabilityDecisionTests theory of seven admits (four optionals, a union with string, an
      argument, an assignment after void), OverloadSelectionTests rows for Pick(2) and Wide(2) choosing byte?,
      a CastDecisionTests row for `(byte?)2`, and the corpus case constant-out-of-range-into-an-optional.
      Mutating the union branch away on a confirmed build fails all ten rows. Full suite green, 6177 of 6177.

      A CONSTRUCTOR CHAIN'S ARGUMENTS ARE JUDGED (2026-09-15). This order skipped them because no chained
      constructor was recorded, but the binder has recorded Constructor.ChainedConstructor and
      ChainParameterTypes since order 12 needed them, so the reason had stopped being true. MEASURED on v2
      at 78c6ad92: `public Chain() : this("x")` and `: this(300)` over `Chain(byte b)`, and `: base(300)`
      over `Parent(byte b)`, each reached Roslyn as MIST_CS_ERROR. On classic, the first is
      MIST_TC_0013 and the second fails in Roslyn. Each is now MIST_PA_NO_IMPLICIT_CONVERSION at the
      argument. A call, a construction and a chain share CheckArguments' one guard: the parameter types are
      recorded, pair with the arguments by position, and belong to neither a CLR-projected member nor a
      flattened pack. FOUND WHILE PROVING ORDER 12'S FIRST TASK, which depended on it: `: this(-5)` over a
      `byte >= 18` parameter was refused by the prover alone, and would have reached Roslyn once the prover
      stopped judging a value this rule refuses. One corpus case, constructor-chain-argument. With the chain
      check removed on a confirmed build, that case fails, reaching Roslyn as MIST_CS_ERROR again.

      AN INDEX IS JUDGED AGAINST ITS INDEXER'S PARAMETER (2026-09-15). MEASURED on v2 at 1a886d10. Over
      `public int this[byte index]`, `b[300]`, `b["x"]`, `b[n]` with `int n`, and the write `b[300] = 1`
      each reached Roslyn as MIST_CS_ERROR, and so did `k[1]` over `Keyed<string>`'s `this[K key]`. On
      classic `b[300]` fails in Roslyn too. Each is now MIST_PA_NO_IMPLICIT_CONVERSION at the index. The
      binder already read the parameter through the receiver's type arguments to place an implicit
      conversion, and then dropped it. IndexExpression.ParameterType now records it, as
      InvocationExpression.ParameterTypes records a call's. It is null for a from-end index: `c[^1]` over
      `this[int i]` on a type with a Count runs on both pipelines, reaching the element through Count
      rather than through the parameter.

      NOT JUDGED, for the reason a CLR-projected call's argument is not: the indexer the model names may not
      be the one Roslyn chooses. That covered an index into a type declaring more than one indexer until
      the binder selected among them by the index, as a call selects (the 2026-09-15 paragraph below). It
      still covers an index into a CLR-projected indexer: `d[1]` over `Dictionary<string, int>` still
      reaches Roslyn. An intrinsic indexer was not judged either, recording no slot, until the paragraph on
      intrinsic indexers below.

      THE PROVER READS THE SAME SLOT. RefinementAnalyzer.NeedIndex looked the indexer up for itself,
      unsubstituted, and asked its predicate of any integral index. It now asks Need of the recorded slot,
      with the parameter's name, so the entry test a call argument passes applies to an index too. `b[-5]`
      over `this[byte index] where index >= 18` was CONSTRAINT_VIOLATED alone and would have become two
      complaints; it is NO_IMPLICIT_CONVERSION alone. So is `b[n]` for an int n, which the flow knew was
      20 and the constraint had admitted, so it reached Roslyn before. A named refined parameter now words
      its finding as a call's does: `b[5]` over `this[SmallAdult index]` was CONSTRAINT_VIOLATED and is
      REFINEMENT_VIOLATED. Unchanged: `b[5]` over the `where` indexer (CONSTRAINT_VIOLATED), `b[20]`
      (runs), `b[5]` into an aliased receiver (CONSTRAINT_VIOLATED), and `t[-1]` over an overloaded
      indexer whose first takes `int i where i >= 0` (CONSTRAINT_VIOLATED, judged against the first as
      before).

      PROVED BY three corpus cases and seven decision rows. The corpus cases are index-argument and
      constant-outside-a-refined-indexer-base here, and indexer-literal-violates-refined-parameter in
      refinement-proving. The rows are: a byte indexer read and written with fitting constants, a generic
      indexer over byte, a from-end index, an overloaded indexer, the index mismatch reported once, and
      two RefinementDecisionTests rows leaving a constant and a local outside a `where` indexer's base to
      this rule. Five mutations on a confirmed build, each caught by the case written for it: the index
      case disabled (both corpus cases and the reported-once row), the sole-indexer condition dropped (the
      overloaded row), a from-end index given the slot (the Count row), the slot recorded unsubstituted
      (the generic row), and NeedIndex's own lookup restored (both prover rows, the where-base case as an
      unexpected CONSTRAINT_VIOLATED, and the named refinement worded as a constraint). The full suite --
      6229, 664 and 68 tests, AllFeaturesV2's baseline among them -- passed with no failure and no rerun,
      and the build and `dotnet format` were clean.

      AN INDEX SELECTS ITS INDEXER BY ITS ARGUMENT (2026-09-15), as a call selects its method, and this
      order judges the index against whichever indexer was selected. MEASURED at 60e5b8b2 on both
      pipelines, one project per probe. BOTH NAMED THE FIRST INDEXER, classic included, which the
      paragraph above measured only where nothing asserted the type: over `int this[int i]` and `string
      this[string s]`, `string s = t["x"]` was MIST_PA_NO_IMPLICIT_CONVERSION on v2 and MIST_TC_0001 on
      classic; `t["a"] = "b"` was refused on both the same way; `var v = t["x"]; int n = v.Length;` was
      MIST_PM_UNRESOLVED_MEMBER on v2 and MIST_UNDEFINED_MEMBER on classic; and `int n = a[3]` over
      `Keyed<string>`'s `this[K key]` and `this[int i]` was refused on both. `Console.WriteLine(t["x"])`
      ran on either, printing the string indexer's result, only because Roslyn selected again. Each now
      runs on v2 and prints the selected indexer's result, and so, measured after only, do `int last =
      c[^1]` and a list pattern `c is [_, _, int third]` over a type with a Count whose string indexer is
      declared first, which classic refuses at the from-end index as TC_0001. That is v2 more permissive
      than classic, on purpose: properties Requirement 11.6 refuses two indexers only when their parameter
      types agree, 11.4 resolves an access to the indexer and checks its argument, and C# compiles every
      one of them. `t[small]` with a byte over `this[short s]` and `this[uint u]` printed `short` on both
      pipelines, C#'s signed preference choosing; it is now MIST_PM_AMBIGUOUS_OVERLOAD, as
      `Sink.Take(small)` over the same pair is (method-overloading Requirement 3.3), and classic's admit
      is a divergence in the stricter direction, the call rule's. `t[1.5]` over int and string indexers,
      and `g[1]` over a lone `this[int row, int column]`, reached Roslyn as MIST_CS_ERROR on both and are
      now MIST_PM_UNRESOLVABLE_OVERLOAD and MIST_PM_NO_APPLICABLE_OVERLOAD, naming `indexer
      'Table.this[]'`. `t[-1]` over `string this[string key]` declared before `int this[int index] where
      index >= 0` printed -1 on both, v2 having judged the string indexer, and is now CONSTRAINT_VIOLATED
      once. `t[-1]` over `this[long l] where l >= 0` declared before `this[int i]` was CONSTRAINT_VIOLATED
      on v2, judged against the long indexer, and classic prints `int`; it now prints `int`, a false
      refusal closed. Unchanged on both: `numbers[1]`, `numbers[1..3]`, `span[2]`, `word[1..3]`, and
      `c[^1]` over a lone `this[int i]` with a Count.

      WHAT CHANGED. Method, and so Constructor, and Indexer implement IOverload -- the parameters, the
      type parameters and the declaring type, which is all selection reads -- and OverloadResolution,
      OverloadChoice and OverloadFailure are generic over it, so arity, applicability, betterness and the
      signed-over-unsigned tie keep one home; an indexer's type-parameter list is empty.
      Indexability.Select hands the receiver definition's IndexersList to that selector. A from-end index
      no indexer takes as it is selects again as an int position, which is C#'s lowering onto Count and an
      int indexer, and a list pattern's positional element selects as that position. IndexBinder, moved
      out of PostfixBinder, records the selected indexer as IndexExpression.Indexer and its parameter read
      through the receiver's substitution as ParameterType (still null for a from-end index, and both
      still null for an intrinsic indexer), and refuses a failed selection through OverloadFailure, whose
      suppression of an argument that already failed covers the index. PairsWithIndex keeps only the
      CLR-projected condition, and RefinementAnalyzer.NeedIndex reads the recorded slot as it did. A
      single indexer surviving arity is returned without consulting the relation, as a call's single
      candidate is, so the type check at the index stays this order's: `shelf[300]` over `this[byte slot]`
      beside `this[int row, int column]` is NO_IMPLICIT_CONVERSION at the index. Beside a string indexer
      the same constant is refused by selection instead, as unresolvable, because `Take(300)` over
      Take(byte) and Take(string) has no applicable candidate (method-overloading Requirement 3.7).

      PROVED BY five corpus cases and seven rows. The cases are
      index-overload-ambiguous-between-signed-and-unsigned, index-overload-unresolvable and
      index-overload-arity-mismatch in binding, index-into-selected-indexer here, and
      indexer-constraint-violated-on-the-selected-overload in refinement-proving. The rows:
      SelectionRecordingTests records the second-declared indexer and a string slot for a string argument,
      the same on `Keyed<string>` with the slot substituted from K, and the int indexer with a null slot
      for `ledger[^1]` over a string-first pair; ListPatternResolutionTests types a positional element by
      the int indexer of a string-first pair; AssignabilityDecisionTests moves the Overloaded row from not
      judged to judged and admitted, beside a Differing fixture whose int and string indexers return their
      own types, read and written; and RefinementDecisionTests holds `pick[-1]` silent over the long-first
      pair. Four mutations on a confirmed build, each caught by the rows named for it: the selector handed
      the first indexer alone failed eight tests -- four corpus cases, the three recording rows, the list
      pattern row, both index admits and the prover row; selection kept but the first indexer recorded
      with its slot failed seven -- two corpus cases, the three recording rows, both admits and the prover
      row; the slot recorded unsubstituted failed the Keyed<string> recording row and the existing
      Keyed<byte> admit; and PairsWithIndex restored to a sole indexer failed index-into-selected-indexer
      alone, which reached Roslyn as MIST_CS_ERROR. The full suite -- 6235, 664 and 68 tests,
      AllFeaturesV2's baseline among them -- passed with no failure and no rerun, and the build and
      `dotnet format` were clean.

      A WRITTEN PARAMETER BEATS ONE A RECEIVER'S TYPE ARGUMENT MADE IDENTICAL (2026-09-15), answering the
      question this order carried as a task, which it closes. MEASURED at 7f3f6bb4 on both pipelines, one
      project per probe, over 22 programs, with four more emitted for their lowered signatures alone.
      CLASSIC GIVES NO SINGLE ANSWER: where Roslyn chooses, it runs the call -- `b.Get(3)` and `b[3]` on
      `Keyed<int>` declaring `Get(K)` beside `Get(int)` and `this[K key]` beside `this[int i]`, a static
      `Util<int>.Get(3)`, and a type parameter nested in `Wrap<K>`, `List<K>`, `K[]`, `(K, int)` or
      `func<K, int>`, each printing the written form's answer -- and where its own check runs, it refuses:
      `new Box<int>(3)` over `Box(T)` and `Box(int)` is MIST_TC_0032, and so is `Get<U>(U, U)` beside
      `Get<T>(T, int)`. Every one of them was MIST_PM_AMBIGUOUS_OVERLOAD on v2 and now selects the written
      form, the constructor and the two generic methods included -- v2 more permissive than classic, and
      what C# does. `IntKeyed : Keyed<int>` selects through the path too, where classic reports
      UNDEFINED_MEMBER and cannot run it at all. THE REFUSAL HAD NO ANSWER: a cast cannot separate the
      pair, since `b.Get((int)3)` names the type they already share, so at `Keyed<int>` neither overload
      was callable.

      THE RULE IS C#'S, in IsBetter's one home, so a call, a construction and an index share it: a
      candidate declaring no type parameters of its OWN wins first, then, per parameter, A PARAMETER FIXED
      AT THE DECLARATION BEATS ONE THE RECEIVER'S TYPE ARGUMENT SUPPLIES -- `Get(int)` takes an int in
      every instantiation where `Get(K)` takes whatever that one gives K, so the fixed one is the narrower
      intent where they coincide -- fixed all the way down, through constructed types, arrays, tuples and
      function types. ONLY ON IDENTICAL CLOSED PARAMETER TYPES, which is what keeps it a tiebreak rather
      than a second ranking. Without that gate the genericity of one position settles a tie in another,
      which is what the existing tiebreak did, looser than the "otherwise-exact tie" its own comment
      claimed: `Take(small, 1)` with a byte over `Take<T>(uint, T)` and `Take(short, int)` printed
      short,int on v2, though a byte over short and uint is ambiguous by method-overloading Requirement
      3.3 and the non-generic pair of that shape is refused on both pipelines. It is now ambiguous -- v2
      stricter than classic, the divergence `t[small]` records above. INSTRUMENTED BEFORE THE CHANGE, the
      ungated tiebreak fired once in all of AllFeaturesV2 and Standard, on Interlocked, with identical
      closed types, so no banked program stood on it.

      STILL AMBIGUOUS, stated with the rule in method-overloading Requirements 3.8 to 3.10:
      `Pair<A, B>.Take(A)` beside `Take(B)` at `Pair<int, int>`, one type parameter being no more specific
      than another; and `Take(K, int)` against `Take(int, K)`, each more specific in one position.

      `Take(K?)` AGAINST `Take(int?)` IS NO LONGER AMBIGUOUS, 2026-09-19. It was never a tie on the rule
      -- `int?` is fixed where `K?` follows the instantiation -- and was refused only while an
      unconstrained `K?` reached the backend as `K`, so a selection of `Take(int?)` would have run the
      other. With the declaration emitted per instantiation (emitter register order 76) the preference
      is honoured: CompareSpecificity compares two optionals by their present constituents, and
      Requirement 3.11 now states the preference rather than the refusal. At `Lifted<int>` the two
      overloads are one C# signature, so the specialization names them apart and each call is named
      for Mist's choice; a call the generic body resolved to `Take(K?)` keeps that choice. Measured on
      the emitted program, not only on the selection: samples/OpenUnions prints `int?` for a present
      and an absent argument and `K?` for the call made inside. OverloadSelectionTests moved the
      `lifted.Take(3)` row from the ambiguous theory to the written-beats-closed one and added an absent
      argument; removing the optional comparison fails exactly those rows.

      PROVED BY 17 rows in OverloadSelectionTests, the wanted overload declared SECOND in every fixture:
      seven for a written parameter beating a closed one (instance, inherited and static receivers, and
      the four nested shapes), one each for the constructor, the indexer, and a signature written in one
      position of two, two for a method's own type parameter losing to a written type, one for the
      ordering between those two steps, three for the ambiguities kept, and one for the gate. Five
      mutations on a confirmed build, each caught by the row written for it: the gate dropped (the gate
      row alone), the own-type-parameter step dropped (the ordering row alone), the per-parameter
      comparison dropped and type parameters made equally specific (eleven rows each), and the comparison
      recursed into unions (the `Take(K?)` row alone). The full suite -- 6252, 664 and 68 tests,
      AllFeaturesV2's baseline among them -- passed with no failure and no rerun, and the build and
      `dotnet format` were clean.

      SUBSTITUTION REACHES A REFINEMENT'S BASE (2026-09-16), closing the task this order carried and the
      false refusal it named. MEASURED at 5459049b on both pipelines, one project per probe, over 28
      programs. Over `Keyed<K>` declaring `Ne(K key) where key not 18`, EVERY USE THROUGH A CLOSED
      RECEIVER WAS MIST_PA_NO_IMPLICIT_CONVERSION ("'int' to 'K'") -- the method, the same `where` on an
      indexer and on a constructor, a static `Keyed<int>.Ne`, an inherited `IntKeyed : Keyed<int>`, and a
      named generic alias `type Ne<K> = K not 18` at `Ne<int> x = 3` -- where classic prints each, except
      the alias, which classic refuses outright as MIST_NOT_GENERIC, and the inherited call, which it
      cannot find at all. Each now runs. TypeSubstitution.Apply descends into a RefinedType as it does a
      union or a tuple, which is also the residue emitter order 85 recorded for ExpandAlias, and the
      alias path is the same Apply.

      THE COPY SHARES THE DECLARATION'S PREDICATE CELL rather than copying it. The predicate is bound
      once, by PredicateBinder, in the scope the refinement was written in and against the base declared
      there, and PredicateBinder runs at Phase 3 while a substituted copy can be made earlier; a copy
      taken before it would be empty forever. Reading the declaration's cell is also what keeps ONE
      complaint about one mistake: `Comparability.Misordered` reads the predicate's NarrowedType, so a
      relational `where` over K stays REFINEMENT_NOT_COMPARABLE at the declaration and silent at every
