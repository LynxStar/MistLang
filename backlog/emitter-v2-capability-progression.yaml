    unlocks: [RefinementComparison]

  - id: refinement-runtime-guard-insertion
    name: Residual runtime guards for refinements
    order: 144
    layer: refinement-types
    requires: [refinement-static-discharge]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      Two proof modes from one construct -- static discharge where the value is known, and a
      residual runtime guard at a parameter. Choosing wrong is either a false reject or an unsound
      accept.

      THE TEST IS THE MODE THAT IS EMISSION'S, and it is built: `x is AdultAge age` emits
      `x is int and >= 18 and var age`, and `r is ValidInterval v` emits
      `r is Interval and { Start: >= 0 } and var v` (R12.2). The predicate is bound against the type
      it refines at the test site and carried on the pattern, because a refinement's predicate is an
      AST node until a binder touches it and only a binder can.

      A CONJUNCTION RATHER THAN A DECLARATION PATTERN, because no single C# form covers both
      predicate shapes: `int >= 18 age` is not C#, while `int and >= 18 and var age` is, and it
      spells the relational and property cases identically. The base test is kept even where the
      scrutinee already has that type -- it costs nothing, warns nothing, and is what makes the same
      emission correct when the scrutinee is wider.

      REFUSED WHERE THE PREDICATE DOES NOT BIND, as MIST_BE_REFINED_PREDICATE. This is the one place
      erasure would not lose a check but silently pass one, so an unbound predicate must not fall
      through to `x is int`.

      THE PARAMETER GUARD IS THE OTHER MODE and is not built, because WHICH call sites need one is
      decided by the static discharge that v2 does not run. Emitting a guard at every parameter
      would be sound and wrong -- the spec asks for a residual guard, residual to a proof.
    analysis_phase_tasks:
      - >
        Emit a runtime validation guard at method entry for a refined parameter whose argument was
        not statically proven at the call site (R12.4). Needs order 142's discharge first, since
