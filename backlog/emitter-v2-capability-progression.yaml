  - id: ref-struct-declarations
    name: ref struct declarations
    order: 138
    layer: stack-only
    requires: [struct-declaration]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      THE MODIFIER IS EMITTED. It was dropped, found on RefStructs once the length ambiguity stopped
      gating it: `public ref struct IntPair` in Mist became `public struct IntPair` in v2 where
      classic keeps the `ref`. NOTHING WOULD HAVE CAUGHT IT. A dropped `ref` produces a type that
