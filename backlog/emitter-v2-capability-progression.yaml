  - id: type-argument-inference
    name: Type argument inference from call arguments
    order: 55
    layer: generics
    requires: [generic-methods]
    v2_status: partial
    verified_by: v2-semantics
    evidence: >
      Unification of parameter types against argument types, including through a nested
      constructed type, then substitution into the return type so var binds concretely.

      Banked in AllFeaturesV2, which covers five inferring calls and one stating its arguments:
      T from an int and from a string, two parameters from two arguments, T read through a
      `List<int>` in a parameter position, and inference on an instance method.

      INFERENCE IS PART OF APPLICABILITY, not a step after selection. A candidate is CLOSED before
      any conversion is weighed, because ConversionRelation declines to reason about an open type
      parameter -- so a candidate left open is eliminated for being generic rather than for being
      wrong, which is how a generic overload beside a non-generic one refused a valid call before
      this. A candidate whose parameters cannot all be determined is not applicable, matching C#.

      THE CALL SITE STATES ITS TYPE ARGUMENTS IN THE EMITTED C#, inferred ones included, rather
      than leaving Roslyn to infer them again. This is a choice about failure rather than about
      correctness, and MEASURED as such: suppressing the emission entirely leaves all 4647 tests
      green, the AllFeaturesV2 v2 baseline among them, so nothing in the repository distinguishes
      stating the answer from not having one.

      The reason to state it anyway is that this algorithm is the weaker of the two, in three named
      ways: it does not track variance, so a bound read from inside a construction is fixed like any
      other rather than as an exact bound; it has no inference from lambdas or method groups; and it
      runs one pass rather than fixing in dependency order. Every shape it does
      infer, C# infers and agrees on, so its successful answers are a subset of C#'s -- established
      by reasoning over the cases, not proved. Stating them therefore makes a wrong answer a C#
      error rather than something Roslyn quietly infers correctly on our behalf.

      FIXING IS C#'S, BY DOMINANCE, measured 2026-09-13 on --pipeline experimental. Each type
      parameter collects a bound set, deduplicated by identity, and once every argument is matched is
      fixed to the first bound every other bound converts to. Against `Pick<T>(T a, T b)`:
      `Pick(1, 2L)` binds as `Pick<long>` and prints 2; `Pick(new Dog(), new Animal())` as
      `Pick<Animal>`; `Pick(u, 4)` with `u` unknown as `Pick<object>`; `Pick(n, 4)` and `Pick(4, n)`
      with `n` a NonNegative both as `Pick<int>`, where the pairwise Wider fold had answered
      NonNegative for one order; and `Pick(new Meters(1.0), new Feet(10.0))` as `Pick<Meters>` through
      Feet's declared implicit operator, printing 3.048.

      JUDGED BY ConversionClassifier, NOT ConversionRelation, which Wider asked. A parameter with no
      dominant bound is refused, and the relation's contract bars refusing on it; the classifier is
      what Stage 5's Assignability refuses an argument on, so a conflict is reported only where every
      choice among the bounds would have had some argument refused there. It also brings the rules
      the relation declines: a refinement within its base, a type parameter within its constraints, a
      user-declared implicit operator. An error-typed bound classifies Unclassified, which counts as
      converting both ways, so a failed argument never produces a conflict.

      A SECOND TIER FOR REFINEMENTS, because the first alone regressed a running program.
      `Pick(n, p)` with NonNegative n and Positive p printed 5 before this change, the fold keeping
      NonNegative and the prover discharging p; neither refinement is implicitly reached from the
      other, so dominance alone refused it. Where no bound qualifies, a refinement whose BASE the
      others all reach is taken, first in argument order, its predicate being the prover's. Both
      orders still run.

      NO TYPE IS INFERRED THAT NO ARGUMENT HAS -- DECIDED 2026-09-13, reversing a union rule this
      entry recorded as decided the same day. `Pick("x", 1)` and `Pick(new Dog(), new Cat())` are
      refused as MIST_PM_TYPE_ARGUMENTS_CONFLICT naming the parameter and its bounds, where C# reports
      CS0411; before, the first bound as `Pick<string>` and was refused only by Stage 5, at the second
      argument, as 'int' to 'string'. A union and a shared base are both the caller's to state:
      `Pick<string | int>("x", 1)` binds and runs, and `Pick<Animal>(dog, cat)` binds. Against
      inferring either: a union always exists and `unknown` is always a shared supertype, so a rule
      that looked for one would never fail and would silently accept what C# refuses, and several
      incomparable shared bases leave no single answer.

      OVERLOAD RESOLUTION KEEPS ITS SHAPE. A candidate whose parameter conflicts is left open and
      excluded, so `Over.Pick("x", 1)` beside `Pick(unknown a, unknown b)` selects the latter, and
      `Over.Pick(1, 2L)` the generic one. Only with no closed candidate is the conflict reported, and
      a parameter no argument mentions reports MIST_PM_TYPE_ARGUMENTS_NOT_INFERRED ahead of it.
      TypeArgumentFixingTests holds 13 cases on ProgramModelProbe, each mutation-checked: fixing to
      the first bound fails six, dropping the refinement tier one, dropping the not-inferred
      precedence one, dropping the conflict from the choice two, judging the first tier by
      ConversionRelation.IsWithin one, ignoring stated type arguments one, and refusing whenever any
      candidate is open one. refusals/binding/type-argument-bounds-with-no-dominant.mist holds the
      refusal.

      A GENERIC EXTENSION RECEIVER CLOSES ONLY ON AGREEMENT. Unify shared the fold, so
      `<T> extension(Duo<T, T> self)` matched a `Duo<int, long>` receiver with T fixed to long, and
      Roslyn refused the generated call: 'Duo<int, long>' does not contain a definition for 'Same'. A
      receiver's type arguments are not converted, so Unify closes a parameter only where its bounds
      are one type; that receiver is now refused on the call as MIST_PM_UNRESOLVED_MEMBER, and
      `Duo<int, int>` still prints. ExtensionLookupTests pins both, and fixing Unify by dominance
      fails it.

      Which also means the sample does not test inference as tightly as it appears to. Every result
      it prints would print the same had inference answered nothing at all; what the baseline pins
      is the emitted C#, not the answer.

      Failure is REPORTED rather than left open, by MIST_PM_TYPE_ARGUMENTS_NOT_INFERRED naming the
      parameters to state. An undetermined parameter is not a missing preference but a missing
      type: it reaches the call's result, so binding anyway records a local typed by a parameter
      out of scope and emits that parameter where a type belongs, which Roslyn then reports against
      a generated file naming neither the call nor the parameter.
    tasks:
