  - id: abstract-conformance-checking
    name: Slot filling, accessor shape and retroactive conformance
    order: 7
    subsystem: typechecker
    requires: [assignability-core, exhaustiveness-checking]
    status: done
    from: >
      orders 69, 70, 73, 74 -- 16 tasks, the largest single cluster
    evidence: >
      SPEC-BACKED AND SPEC-CITED: .kiro/specs/abstract-type-unification/requirements.md, Requirements 14
      and 28. The blocker order 69 recorded -- no source location on the contract -- was moot for Stage
      5 as built: the rules run over the concrete model, where MemberType.DeclarationNode is reachable,
      and an unfilled slot is reported at the conformer's declaration as 14.2 asks.

      CLASSIC'S VERDICTS ARE THE CONTRACT, measured on a 17-shape probe. Classic refuses an unfilled
      slot, one filled with the wrong parameter or return type, a slot inherited through the abstract
      hierarchy, a generic slot left half filled, a property slot missing an accessor (SM_0022 and
      MISSING_ABSTRACT_PROPERTY_ACCESSOR), a with block leaving a slot unanswered (WITH_0004), a mapping
      of the wrong signature (WITH_0005), a with block naming an abstract the base list already reaches
      (WITH_0003), and a nested type filling an associated type slot without meeting its constraint
      (AT_0003); it also refuses a slot hidden by a default restated on a derived abstract, which order
      69 had measured on both pipelines. Every one is refused by v2 at the same construct, and the
      mapping of the wrong signature by the binder alone. Classic admits a default left unfilled, a
      default the conformer restates, a generic slot closed by the base list, a slot filled by an
      inherited member, a diamond filled once, and a with block answered by a mapping; v2 admits all of
      those and a with block answered by the type's own member, which C# implements implicitly.

      THE RULE. Slots are the bodiless instance members of the abstracts the type's own base list
      reaches, transitively through the abstract hierarchy, each closed abstract visited once so a diamond asks
      once. Fillers are the public instance members the type declares or inherits along its concrete
      base chain, each read through the substitution of the base it came from; a default is a member,
      not a slot, and fills nothing but its own name. A member answers a slot when the arity matches
      and every type AGREES: identical by name once the abstract's own type arguments are applied,
      structurally through a construction, or indeterminate on either side -- a type parameter the
      conformer supplies nothing for, and an associated type slot, which the conformer's nested type IS
      under another name. A property slot is answered by name and judged by accessor shape, which is
      carried by which accessors exist, and its type is compared as the method types are. A with block
      answers the slots of the abstract it names by its mappings, judged by signature alone since a
      mapping renames, or by the type's own public members; a slot whose mapping the binder already
      refused counts as answered, because the author did map it and that fault has its complaint. A
      with block naming an abstract the base list or an earlier block reaches is redundant, reported
      here now rather than at emission, which kept only the deduplication. An associated type slot's
      filler is judged against the slot's constraints, and its absence reported here, both moved out of
      the backend's lift, which now consults TypeSlots in the model for the filler itself.

      NOT JUDGED, each on purpose, and each a task below: a mapping onto a non-public source member,
      which C# accepts and nobody has decided; a conformance's namespace scoping, recorded and read by
      nothing; and indexer and operator slots.

      MEASURED: the first sweep reported four findings on working programs, two rule errors -- a
      mapping's source keeps its own name, so the name check did not apply to it, and a slot typed by an
      associated type slot compared by name where it must agree -- then zero findings and identical
      stdout on AllFeaturesV2 and AllFeatures, and zero on the three unbanked samples standalone. 13
      corpus cases, one per refused shape, plus a refused mapping under binding pinning that it draws
      one complaint and not two. Nine decision rows over fixtures that are themselves under analysis,
      so the admits above are silences proven nine times over. Thirteen mutations, each on a confirmed
      build: method slots skipped, every signature agreeing, non-public members filling, base abstracts
      not walked, accessor shape and with-block slots and redundancy and the two type-slot rules each
      not judged, mappings judged by name, the abstract's type arguments not applied, refused mappings
      not counted as answered, and slot-typed signatures compared by name. Thirteen of thirteen caught
      on the first pass.

      A READONLY SLOT IS ANSWERED ONLY BY A MEMBER THAT WRITES NOTHING (2026-09-19; readonly-contexts
      Requirement 13.2 to 13.6). Found by checking a wrong claim: order 6 had said nothing holds an
      implementer to a `readonly abstract`, Arthur answered "You can't meet a contract for something
      readonly with a mutable thing", and measuring it showed the type-level reading was the mistake and the
      MEMBER-level contract unenforced. MEASURED at 84f70426 on both pipelines: over
      `readonly abstract IReadable { int GetLength(); }`, a `GetLength()` that does `Reads = Reads + 1`
      compiled on v2 and printed 1 then 2 through the abstract, as did a getter that writes; classic refuses
      both (MIST_TC_0079) at the member. v2 now reports MIST_PA_READONLY_CONTRACT_NOT_MET at classic's line
      and column. ConformanceAnalyzer asks ReadonlyInference of whatever answers the slot -- a declared
      member, an inherited one, a with block's mapped source -- whenever the SLOT is readonly, which the
      builder already writes onto every slot of a readonly abstract. The conforming type is not asked
      anything: 13.6 says it need not be readonly, and Document stays valid.

      STRICTER THAN CLASSIC THREE TIMES, each by the requirement's own words: a slot marked `readonly` by
      itself in an abstract that is not (13.2 says "explicitly or implicitly"; classic declares it); a
      member that writes nothing itself but calls one that does (13.2 says "explicit or inferred", and
      inference asks the callee's status; classic looks no further than the body); and a member inherited or
      mapped by a with block, which classic does not reach.

      PROVED BY six corpus cases -- readonly-contract-method-writes, -getter-writes, -on-one-slot (its other
      slot, not readonly, answered by a writer and silent), -method-reaches-a-write,
      -inherited-member-writes and -mapped-member-writes -- and four rows under AMemberThatWritesNothing:
      readonly members on a mutable type whose other method writes, a member that calls one that only reads,
      a writer answering an abstract that is not readonly, and an inherited reader. Each row was first shown
      to judge something by a twin that fails with this id; two first failed for the shell's reasons and not
      the rule's, one reading `Text.Length`, which has no members there, and one naming its class `Base`
      beside the fixture's. Nine mutations on a confirmed build. Eight caught: the method check and the
      getter check removed, only a written modifier counted (the inference rows), a mapped source not
      consulted, a slot's own modifier ignored while the abstract's was still asked (the one-slot case), the
      slot's modifier not consulted on a method and on a property, and every abstract read as asking. ONE
      SURVIVED AND WAS RIGHT: ignoring the abstract's own modifier changed nothing, every slot carrying it
      already, so that half of the test was deleted rather than defended. A filler excused for belonging to
      a readonly type was deleted before that for the same reason: no program could be written in which it
      decided. The full suite -- 6470, 664 and 68 tests, AllFeaturesV2's baseline among them -- passed with
      no failure and no rerun, AllFeaturesV2 run by hand was byte-identical and reported nothing, and the
