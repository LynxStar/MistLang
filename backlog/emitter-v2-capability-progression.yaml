      auto-await and yields the raw task. Composable inside a lambda body, including
      double-lifting. Also covers async block expressions.

      DELIVERED AS ONE NODE WITH A FLAG, because the two behaviours are one idea seen from either
      side: the functor asks for the task, and whether that means building one or keeping the
      insertion away depends only on whether the operand already is one.

      ASYNC LAMBDAS AND ASYNC BLOCKS COME WITH IT. A lambda's `async` is the method modifier again --
      it transforms what the body produces and makes the body an async context. An `async { ... }`
      block is a braced body wanted as a value, so it borrows the lambda's own return-type inference
      rather than repeating it, and emits as the lambda C# needs to run one. The `valuetask` hint
      constructs from that task, ValueTask having no Run of its own.

      DOUBLE-LIFTING WORKS: FirstClassFunctions' `async id => async ComputeSync(id)` at
