  - id: attribute-arguments-and-type-literals
    name: Attribute arguments including type literals
    order: 118
    layer: attributes-and-project
    requires: [attribute-declarations-and-targets]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      A dedicated argument sub-grammar exists specifically so a generic type name in
      argument position does not parse as a relational comparison. Mist has no typeof
      keyword, so a bare type name is recognized by classification and re-shaped at emission.

      ARGUMENTS ARE BOUND EXPRESSIONS, NOT FOLDED CONSTANTS, which is why this cost almost nothing
      beyond order 117. BodyEmitter already prints an expression, so unary minus, enum member access
      and type literals all arrive free; evaluating them into values here would have meant writing a
      constant folder that duplicates the emitter. That is also what forced DeclaredAttribute to be
      a separate model type from AttributeData -- Expression is internal and AttributeData is a
      public contract, so no one type can carry both a metadata value and an unevaluated expression.

      THE ONE PLACE A BOUND ARGUMENT NEEDS RESHAPING is a bare type name. In an ordinary expression
      it is nearly always the RECEIVER of a static member access, so binding settles on that reading
      and emits the name unadorned; in argument position it is a value and must become typeof.
      Nothing reports the difference -- every step of the binding succeeds -- so AttributeBuilder
      reclassifies it rather than leaving C# that does not compile.

      Covered by AttributeEmissionTests: positional order, a named argument, a keyword primitive as
      a type literal, a constructed generic as a type literal, and a declaration with no arguments
      emitting no parentheses.
