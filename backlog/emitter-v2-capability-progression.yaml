# V2 Emitter Capability Progression
#
# Hand-authored. THE SOURCE OF TRUTH for what the v2 emitter still needs and in what order.
#
# Supersedes and replaces three deleted artifacts:
#   - backlog/emitter-v2-sample-progression.yaml   (node-count ordering, see below)
#   - backlog/emitter-v2-sample-fingerprints.json  (its measured input)
#   - backlog/sample-introduction-history.yaml     (chronology, now folded into intro_order)
# and the tool that generated the first two, tools/SampleFingerprint.
#
#
# WHY THE NODE-COUNT ORDERING WAS ABANDONED
#
#   The old metric counted distinct syntax node kinds a sample introduced. A feature
#   whose difficulty is *repetition of an already-covered node* is therefore invisible to
#   it. Overload resolution is exactly that -- four `Format` methods are four
#   MethodDeclarationNodes, and MethodDeclarationNode was covered by tier 0. The metric
#   scores overloading at zero, necessarily, for any sample.
#
#   That is not a mis-estimate, it is a blind spot with a direction. Given two samples
#   needing the same work, greedy-fewest-new-nodes prefers the one that concentrates its
#   difficulty in the dimension the metric cannot see. It picked Overloading over
#   HelloMist by a one-node margin, and overload resolution was then never implemented --
#   Roslyn resolved the calls downstream and the sample went green.
#
#
# THE MODEL HERE
#
#   CAPABILITIES are the unit of work, ordered so each builds on the ones before it. A
#   capability is named in compiler terms ("overload-resolution-by-argument-type"), never
#   in node-kind terms ("MethodDeclarationNode").
#
#   SAMPLES are acceptance tests, not tasks. A sample becomes runnable when every
#   capability it requires is delivered. Its `threshold` is the last-ordered capability it
#   needs -- the point at which it unlocks.
#
#   A capability unlocks 0..N samples. Zero is normal and expected: many capabilities are
#   pure prerequisites that no sample bottoms out on. Making that explicit is a feature of
#   this model. The old linear sample list could not express "these unlock together" or
#   "this work unlocks nothing yet".
#
#   Sample status is DERIVED, never asserted. A sample cannot be marked done while any
#   capability it requires is outstanding. This is what stops the Overloading failure from
#   recurring.
#
#   WHERE GREENNESS ACTUALLY LIVES: samples/AllFeaturesV2. A sample runs on v2 if and only
#   if it is referenced from that project's mist.toml and its RunDemo() is called from
#   Program.mist, with its output appended to samples/__baselines__/AllFeaturesV2.out. That
#   is the record; this file explains it but is not it. Deliberately no `status` field here
#   -- a second place to assert greenness is a second place for it to be wrong, which is the
#   mistake the deleted sample progression made.
#
#   A sample can be green while a capability it requires is still `partial`. That is not a
#   contradiction, it means the partial's residue is unreachable from that sample, and the
#   record says which residue -- see struct-declaration (order 20), green through HelloMist
#   and Classes while its parameterless-struct-constructor workaround stands untouched.
#
#
# CROSS-REFERENCE: backlog/program-model-body-tasks.yaml
#
#   A capability here is END-TO-END: its `v2_status` covers the frontend binding AND the
#   emission together. `constructors` (order 14) is `done` on evidence citing both
#   ConstructorEmitter.Emit and the Phase 3 body walk; `operator-overload-declarations`
#   and `cast-operator-declarations` are `missing` but record that their bodies already
#   bind. So this file is not emitter-only despite the name, and its SCOPE note below is
#   explicit that it was grounded in the v2 emitter and binder both.
#
#   program-model-body-tasks.yaml holds the OTHER axis of the same work: organized by
#   language construct rather than by capability, exhaustive over the grammar, flat and
#   unordered. It answers "what does the binder still not understand?" where this file
#   answers "what do we build next, and which sample goes green when we do?"
#
#   Practical rule: update that file when the binder changes. Update this one when a
#   capability's end-to-end status or its position in the build order changes. A change
#   that moves both needs both edited -- nothing links or reconciles them.
#
#   Format warning: that file and provider-tasks.yaml do NOT parse as YAML (their
#   `- [ ] text` checklist lines are invalid). This file does. Do not write a tool that
#   assumes all three share a format.
#
#
# FIELDS
#
#   capabilities[].order        unique, contiguous from 1, and every entry in `requires`
#                               must have a strictly lower order -- no forward deps
#   capabilities[].v2_status    done | partial | missing | needs-verification | broken
#                                 missing -- not implemented yet. NOT a bug and NOT a
#                                 regression. v2 is a frontend under construction, so
#                                 every capability starts here, and the emitter is
#                                 equally silent about capabilities nobody has thought of
#                                 yet. An absent emitter path is the expected state of
#                                 unstarted work, so `evidence` on a missing capability
#                                 describes where the path will go, not a defect to fix.
#                                 broken -- a code path exists and produces output that
#                                 does not compile. Worse than missing, because there is
#                                 no diagnostic and no sentinel to catch it. This is the
#                                 status that means "bug". So does a LIVE DEFECT note in
#                                 `evidence`, which flags misbehavior in the CLASSIC
#                                 pipeline that v2 must not reproduce.
#   capabilities[].verified_by  how a `done` or `partial` claim is actually satisfied:
#                                 v2-semantics      -- v2 reasons about it correctly
#                                 roslyn-downstream -- v2 emits and Roslyn covers for it
#                                 unexercised       -- implemented, no sample runs it
#   capabilities[].evidence     the file or observation the status rests on
#   capabilities[].tasks        subtasks; a capability may have 1..N
#   capabilities[].unlocks      samples whose threshold this capability is
#
#   samples[].requires          DIRECT capability dependencies. The transitive closure is
#                               implied, not spelled out. (The first 13 sample records
#                               predate this convention and list their full closure; that is
#                               a harmless superset, not an error.)
#   samples[].threshold         highest-ordered capability in the CLOSURE of `requires`
#   samples[].intro_order       when the sample first entered the repository, carried over
#                               from the deleted chronology file. A prior and a sanity
#                               check, never an authority -- the early numbers are an
#                               artifact of one commit that split a monolithic sample, so
#                               they cannot order that cluster.
#   samples[].untested          what the sample does NOT verify despite appearing to
#
#   `untested` is the second anti-false-done mechanism. Every sample here has entries. A
#   green sample means "these capabilities did not regress", never "this feature is
#   correct".
#
#
# INVARIANTS
#
#   These held when the file was written and are worth preserving by hand. They are stated
#   here because there is deliberately no script enforcing them -- one existed during
#   authoring, caught four real modelling errors, and was then removed to keep this file the
#   only artifact. If it becomes hard to keep these straight by eye, that is the signal to
#   bring the checker back rather than to let the invariants rot.
#
#   1. Capability `order` values are unique and contiguous from 1.
#   2. Every id in a capability's `requires` exists and has a strictly LOWER order. No
#      forward dependencies.
#   3. Every id in a target's `requires` exists.
#   4. A target's `threshold` is the highest-ordered capability in the TRANSITIVE CLOSURE of
#      its `requires`, not merely the highest one listed.
#   5. A capability's `unlocks` lists exactly the targets whose threshold it is.
#   6. Every capability is reachable from some target, or is listed in
#      `orphan_capabilities` with a reason.
#   7. Every entry in `uncovered_constructs` carries a disposition.
#
#   Errors 1 and 4 are the ones that actually bit during authoring. Inserting a capability
#   mid-file renumbers everything after it, and a threshold is easy to get wrong because the
#   deciding capability is often reached indirectly rather than named in the list.
#
#
# OTHER SECTIONS
#
#   non_sample_targets    Acceptance targets that are not samples. The stdlib is one: v2
#                         transpiles it on every compile, and it exercises operators, cast
#                         operators, properties and `intrinsic` that NO sample touches.
#                         Sample-only tracking structurally cannot see those.
#
#   orphan_capabilities   Capabilities no target requires, each with a reason. Usually a
#                         soundness check whose only observable is a rejection, which no
#                         sample can contain because samples must build clean.
#
#   uncovered_constructs  Language constructs the grammar generates that appear in NO
#                         sample, each with a disposition. Recording them stops the
#                         progression from implying the sample suite is complete.
#                         The census behind this list was taken once, by diffing the
#                         generated AST node classes against the node kinds present across
#                         all 75 samples. Re-taking it means re-doing that diff by hand.
#
#
# SCOPE
#
#   All 75 samples (AllFeatures and AllFeaturesV2 excluded as orchestrators), plus the
#   stdlib as a non-sample target, plus the 24 constructs no sample covers.
#
#   Grounded in reading every .mist file and mist.toml in all 75 samples, the committed
#   out/*.cs where present, and the relevant compiler source: the v2 emitter and binder in
#   full; and in the classic pipeline CSharpEmitter, CSharpTypeMap, UnionType, UnknownType,
#   ArrayType, DependentTypeParameterType, AssociatedTypeSlotType, ConformanceMap,
#   ExhaustivenessChecker, TypeCheckerAnalyzer, ReadonlyAnalyzer, ProjectConfiguration,
#   EntryPointDiagnostics, and the stdlib Array/IEnumerable/Action declarations.
#
#   DEPTH CAVEAT: the 13 tier-0/tier-1 records were derived from a close reading of every
#   file plus the emitter paths that serve them. The other 62 are one pass deep. Their
#   capability lists are reliable; their `untested` lists are the most likely place for
#   something to have been missed.

capabilities:

  # ===================================================================
  # Layer A -- core language. Delivered.
  # ===================================================================

  - id: class-declaration
    name: Class declaration with public accessibility
    order: 1
    layer: core-language
    requires: []
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      TypeEmitter.Emit writes `{accessibility}{typeKeyword} {Name}`. Accessibility
      collapses to "public " or "" -- see non-public-type-accessibility for that gap.
    unlocks: []

  - id: methods-static-and-instance
    name: Static and instance methods with parameters and return types
    order: 2
    layer: core-language
    requires: [class-declaration]
    v2_status: done
    verified_by: v2-semantics
    evidence: MethodEmitter.Emit, ParameterEmitter.Emit, MemberModifierEmitter.Emit.
    unlocks: []

  - id: statements-core
    name: Local declarations, assignment, expression statements, return
    order: 3
    layer: core-language
    requires: [methods-static-and-instance]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      BodyEmitter handles LocalDeclarationStatement, ExpressionStatement and
      ReturnStatement (valued and bare). AssignmentExpression emits `=` only.
    unlocks: []

  - id: namespace-file-scoped
    name: File-scoped namespace and same-namespace cross-file resolution
    order: 4
    layer: core-language
    requires: [class-declaration]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      TypeEmitter emits a file-scoped namespace from MemberType.NamespaceName and derives
      the output path from it. Primitives resolves StringUtils by simple name across two
      files sharing one file-scoped namespace.
    unlocks: []

  - id: standard-library-binding
    name: Standard library binding and Standard-to-BCL rewriting
    order: 5
    layer: core-language
    requires: [namespace-file-scoped, statements-core]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      TypeEmitter unconditionally emits a System import. Console, Convert and String
      intrinsics from Source/Standard/Bootstrap bind and map onto CLR types.
    unlocks: [Simpliest]

  - id: literals-primitive
    name: Primitive literals with suffix and width handling
    order: 6
    layer: core-language
    requires: [statements-core]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      BodyEmitter.EmitLiteral, plus EmitIntegerLiteral (UL/L/U suffixes keyed on the
      resolved type) and EmitDoubleLiteral (forces a decimal point). Hex folds to decimal,
      so 0xFF emits as 255.
    unlocks: []

  - id: string-interpolation
    name: Interpolated strings with expression holes
    order: 7
    layer: core-language
    requires: [literals-primitive]
    v2_status: done
    verified_by: v2-semantics
    evidence: BodyEmitter InterpolatedStringExpression, text and hole parts.
    unlocks: []

  - id: var-type-inference
    name: var local inference
    order: 8
    layer: core-language
    requires: [statements-core]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      EmitLocalDeclaration writes the resolved type name, so inference happens in the
      binder rather than being deferred to C# var.
    unlocks: []

  - id: operators-arithmetic-comparison-logical
    name: Arithmetic, comparison and logical operators with precedence
    order: 9
    layer: core-language
    requires: [literals-primitive]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      BodyEmitter.MapBinaryOperator, MapUnaryOperator (negate and logical-not only), and
      EmitSubExpression which parenthesizes a lower-precedence child.
    unlocks: []

  - id: control-flow-basic
    name: if/else-if/else, while, for, foreach, break, nested blocks
    order: 10
    layer: core-language
    requires: [operators-arithmetic-comparison-logical]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      BodyEmitter cases for IfStatement (recursive else-if), WhileStatement, ForStatement,
      ForEachStatement, BreakStatement and nested Block.
    unlocks: []

  - id: arrays-sized-index-length
    name: Sized array creation, element access, Length
    order: 11
    layer: core-language
    requires: [control-flow-basic, var-type-inference, string-interpolation,
               standard-library-binding]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      BodyEmitter ArrayCreationExpression and IndexExpression. Length reads resolve to the
      DEPENDENT TYPE PARAMETER, not to a property: Array.mist declares
      `Array<TValue, Length:ZeroOrPositiveInt>` and no longer declares an
      `intrinsic Int32 Length { get; }` beside it. Both existed until this was fixed, and a
      bare `arr.Length` matched both -- TypeMemberLookup.AddTypeNames offers a depth-0 type
      parameter as a candidate and AddState offers the property, so CandidateSet.Resolve had
      one surviving Type and one surviving Property and returned AmbiguousResult, reported as
      six MIST_PM_AMBIGUOUS_MEMBER errors across ArrayLiterals. String.Length has no type
      parameter to collide with, which is why Primitives was always clean.
      The collision was resolved in favour of the dependent parameter, since the length is
      what that parameter IS and a second declaration of it can only disagree. Emission then
      needed TypeNameEmitter to map a LiftedType to its DOMAIN: a lifted value's Name is the
      value's text, so an inferred binding over a statically known length emitted
      `3 n = items.Length;`. It now emits `int n = items.Length;`.
      An array whose length is NOT statically known needed the same treatment and could not get
      it from the emitter, because it carries no lift to take a type from -- ConstructArray
      slots a sentinel instead, and WellKnownTypeMap projects CLR `T[]` to
      `Standard.Array<T, unknown>`. That sentinel used to be UnknownType, the user-facing top
      type, so `var count = args.Length` emitted `object count = args.Length` and `count + 1`
      failed with CS0019. The top type cannot say what it is unknown OF, which is the whole of
      the problem.
      UnknownValueType now fills that slot -- a dependent argument that knows its domain but
      not its value, the counterpart to a lift, interned per domain so `int[]` stays one type.
      Both slot shapes therefore emit their domain and both read as int. UnknownType stays the
      top type and stays `object`, which is the distinction that makes this work.
      COMPROMISE, deliberately taken. The domain is hardcoded to Int32 at the construction site
      rather than read off the Length parameter, because TypeParameter.Domain is never populated
      -- TypeParameterPopulator reads only the name and a params check, so the two dependent
      grammar variants (DependentTypeParameter and NamedConstraintDependentTypeParameter, which
      is Array's) are dropped at model construction. Populating it means resolving
      ZeroOrPositiveInt, an alias over a RefinedType, during parameter creation, which is
      dependent-type work. When that exists, UnknownValueType should carry the parameter and
      read the domain through it. Nothing else about it changes.
      WHAT THIS DOES NOT FIX. Emission of the type, not USE of the value. The model still
      carries the dependent argument and only the emitter erases it, so member access THROUGH a
      length read still fails -- `args.Length.ToString()` reports MIST_PM_UNRESOLVED_MEMBER,
      "'unknown' has no member named 'ToString'". Not a regression, and an improvement on what
      it replaced -- the same code previously emitted the same broken output with NO Mist
      diagnostic at all, because a bare UnknownType receiver hits PostfixBinder's suppression
      guard and an UnknownValueType receiver does not.
    tasks:
      - Resolve a member through a dependent argument's domain, so `arr.Length.ToString()`
        binds on Int32. Needs the expression's type to come from the domain rather than the
        substituted argument, which is the binder half of this and was left out on purpose.
      - Consider excluding type parameters from a qualified member access regardless. The
        ambiguity is gone because one declaration was removed, not because the lookup can tell
        a qualified `receiver.X` from a bare `X` -- LookupRequest.Member still differs from the
        unqualified request only by a doc comment, so the next same-named pair collides again.
        Span and ReadOnlySpan are the standing example -- both declare a Length type parameter
        AND a Length property, and are latent only because no v2 sample touches them.
    unlocks: [Primitives]

  - id: array-literals
    name: Array literals including nested, trailing-comma and empty
    order: 12
    layer: core-language
    requires: [arrays-sized-index-length]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      BodyEmitter ArrayLiteralExpression emits an explicit element type, so no target type
      is needed at the use site.
    unlocks: [ArrayLiterals]

  # ===================================================================
  # Layer B -- object model state. Delivered by 6957888b.
  # ===================================================================

  - id: instance-fields
    name: Instance field declaration and emission
    order: 13
    layer: object-model
    requires: [class-declaration]
    v2_status: done
    verified_by: v2-semantics
    evidence: FieldEmitter.Emit. Field.Ownership and Field.AttributesList are dropped silently.
    unlocks: []

  - id: constructors
    name: Constructor declaration, parameters and body
    order: 14
    layer: object-model
    requires: [instance-fields]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      ConstructorEmitter.Emit, and ProgramModelBuilder phase 3 now walks ConstructorsList.
      Before 6957888b constructor bodies were never bound at all.
    unlocks: []

  - id: this-expression
    name: this reference in an instance member
    order: 15
    layer: object-model
    requires: [constructors]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      Exercised throughout HelloMist and Classes -- this-qualified writes in every
      constructor, this-qualified reads in Point.GetX, Color.Brightness and Counter.GetValue.
      The static-member case is closed: `this` in a static method reports
      MIST_PM_THIS_IN_STATIC at the Mist source location, verified on a scratch program. It
      does not halt emission, so Roslyn then adds "Invalid expression term '.'" on the
      generated file -- see static-context-checking for that residue, which is the pipeline's
      behaviour after any reported v2 binder error rather than anything specific to `this`.
    unlocks: []

  - id: implicit-instance-field-access
    name: Bare-name field access through an implicit this
    order: 16
    layer: object-model
    requires: [this-expression]
    v2_status: partial
    verified_by: v2-semantics
    evidence: >
      TypeScope resolves the enclosing type's fields and properties as part of the ordinary
      scope-chain lookup; the IdentifierBinder fallback is gone. The precedence gap is closed
      -- members are found during the lexical stage, which runs entirely before namespace and
      import resolution -- and inherited fields now resolve through TypeScope's base-chain
      walk. Still partial for one reason: emission writes the bare name rather than a
      qualified receiver, so correctness depends on C# resolving the simple name the same way
      Mist did. That breaks for a nested type reading an enclosing type's static, which
      resolves in Mist and does not bind in the emitted C#.
    tasks:
      - Emit a qualified receiver for field references (shared with static-fields, order 21).
    unlocks: []

  - id: object-creation
    name: Object creation with arguments
    order: 17
    layer: object-model
    requires: [constructors]
    v2_status: partial
    verified_by: v2-semantics
    evidence: >
      ExpressionBinder.BindObjectCreation.

      Generic construction now binds and emits. GenericTypes is banked and its AllFeaturesV2
      baseline carries `gbox=GenericBox(42)` from `new GenericBox<int>(42)`, plus a
      `GenericBox<string>` and an abstract-typed `IGenericContainer<int>` holding one. This entry
      was previously recorded as THE LARGEST SINGLE GAP IN THE V2 BACKLOG on a measurement of
      unbound sites -- ObjectCreationExpressionPrimaryNode was 64 of 210 across the suite, with
      `new T<...>` in 29 samples against initializer-block syntax in exactly one -- and since that
      bucket was generic construction almost entirely, the bulk of it is closed.

      What remains is the initializer-block half, which is one sample's worth of syntax and waits
      on properties (order 58) to have anything to initialize.
    tasks:
      - >
        Bind an object creation carrying a property-initializer block. Only PropertyInitializers
        uses the syntax, and binding the creation while dropping the block would silently
        construct a different object, which is why it is refused rather than half-handled.
    unlocks: []

  - id: constructor-chain-this
    name: Constructor chaining to a sibling constructor
    order: 18
    layer: object-model
    requires: [object-creation]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      ConstructorBuilder.ResolveChainKind plus BodyBinder.BindChainArguments, which binds
      chain arguments in the body scope so they can see constructor parameters.
    unlocks: []

  - id: explicit-this-member-read
    name: Reading a field through an explicit this receiver
    order: 19
    layer: object-model
    requires: [implicit-instance-field-access]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      Confirmed by Classes, which reads through an explicit this in nine places across three
      types -- Point.GetX and Point.GetY return it, Point.Translate and Color.Mix use it in
      arithmetic feeding a constructor argument, Color.Describe compares three such reads in a
      chained condition, and Counter.Increment both reads and writes through it. Color.Mix
      also reads a field through a non-this receiver of struct type (other.r).
    unlocks: []

  # ===================================================================
  # Layer C -- struct and static state. Delivered.
  #
  # Both samples it gates are now referenced by AllFeaturesV2 and their output is in the
  # stored baseline: HelloMist and Classes each run on v2 with output byte-identical to
  # classic. The work was already in the emitter when this layer was written as pending --
  # nothing here was implemented to close it, the statuses were simply behind the code and
  # the two samples had never been run on v2 to find out. That is the failure mode this
  # file's `needs-verification` status exists to catch, and it cost a layer's worth of
  # apparent work to discover.
  #
  # Residue is recorded on the records below rather than dropped. None of it is reachable
  # from any sample, and all of it is emitter-side cleanup rather than binding.
  # ===================================================================

  - id: struct-declaration
    name: Struct type declaration with public fields
    order: 20
    layer: object-model
    requires: [instance-fields, constructors]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      TypeEmitter maps StructType to the struct keyword. Sample-level coverage now exists:
      HelloMist/Color and Classes/Color both emit as `public struct` with public int fields, a
      three-argument constructor and instance methods, and both run correctly.
      ConstructorEmitter.ResolveModifiers now builds the modifier set C# admits on a constructor
      rather than filtering the general member set: `static` for a static constructor, an
      accessibility otherwise, and nothing else. Measured on a scratch program declaring both a
      private parameterless struct constructor and a static constructor -- emits
      `public Marker()` with its body intact and bare `static Registry()`, and prints
      tag=3 count=11. Widening a parameterless struct constructor to public is kept: private is
      not enforceable in C# in any case, since `new T()` on a struct always compiles, so the
      declared accessibility is the frontend's to hold.

      The Void.mist question that held this at `partial` was MISFILED and has moved to
      void-unit-type (order 80). Whether Standard/Void.mist is transpiled is a question about how
      the unit type is realized, not about emitting a struct. What Void.mist would ask of THIS
      capability is a private parameterless struct constructor, which is measured above as working;
      everything else it needs belongs to properties, operator declarations and cast operators.
    unlocks: [HelloMist]

  - id: static-fields
    name: Static field declaration and access from static and instance context
    order: 21
    layer: object-model
    requires: [implicit-instance-field-access]
    v2_status: partial
    verified_by: v2-semantics
    evidence: >
      FieldEmitter routes modifiers through MemberModifierEmitter, which emits static.
      Exercised by Classes/Counter: totalCreated is declared private static, incremented from
      an INSTANCE constructor, and read from the static method GetTotalCreated, and the
      printed total is correct across two instances. The staticness rule is now real rather
      than accidental -- MethodScope narrows the lookup, so a bare-name INSTANCE field read
      inside a static method does NOT resolve. Verified on a scratch program, and the miss now
      reports MIST_PM_UNRESOLVED_IDENTIFIER against the Mist source instead of reaching the
      emitter -- see static-context-checking. Still partial only for the qualified receiver
      below.
    tasks:
      - Emit a qualified receiver for field references -- this for instance fields, the
        declaring type for statics -- instead of the bare name.
    unlocks: []

  - id: static-context-checking
    name: Reject this and instance-member access in a static member
    order: 22
    layer: object-model
    requires: [static-fields]
    v2_status: partial
    verified_by: v2-semantics
    evidence: >
      Staticness lives on MethodScope, which narrows the lookup request on the way out to the
      declaring type, so an instance member is not a CANDIDATE for a bare name inside a static
      member. `this` in a static member reports MIST_PM_THIS_IN_STATIC, read off
      Scope.EnclosingMethodScope. Static fields still resolve, as intended.
      The instance-member case is rejected by omission rather than by a dedicated check -- the
      name is not a candidate, so it comes back a miss -- and IdentifierBinder now reports that
      miss as MIST_PM_UNRESOLVED_IDENTIFIER and binds ErrorExpression. Measured on one scratch
      program carrying both shapes: a bare instance field read in a static method reports at
      Program.mist(12,16) and an ordinary misspelling at Program.mist(22,36). Reporting at
      Stage 4 means the Stage 4/5 gate stops the build before emission, so no out/ directory is
      produced at all.
      v2 is ahead of classic on both. Classic reports the misspelling TWICE and, on the
