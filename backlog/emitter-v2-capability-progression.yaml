  - id: void-unit-type
    name: void as an inhabited unit type
    order: 80
    layer: unions-and-unknown
    requires: [optional-union-representation]
    v2_status: partial
    verified_by: sample
    evidence: >
      `void` is a reserved alias for Standard.Void -- one type, two spellings. It doubles as the
      optional absence value and overlaps the type-literal rule, so one token resolves three ways
      from context alone. A void-typed parameter means "takes a unit", not "takes nothing".

      Methods ALWAYS return a value, so there is no unit-returning method that returns nothing.
      Every void method returns the singleton, which makes any emitted difference between two such
      methods the backend's invention rather than the language's.

      SYSTEM.VOID IS NOT THE TARGET, measured rather than assumed. The CLR refuses it in every
      position a unit type needs, so this is not a C# restriction that IL could route around.
      MakeGenericType gives "The type 'System.Void' may not be used as a type argument",
      Activator.CreateInstance gives "Cannot dynamically create an instance of System.Void", and
      MakeArrayType cannot load 'System.Void[]'. System.Void marks the ABSENCE of a value; Mist's
      Void is a type with one value. Standard.Void therefore has to emit as an ordinary struct.

      THE EMISSION RULE, decided. It is framed by RECEIVER rather than by expression -- what
      decides is whether something receives the type or the value, not what produced it. Every
      receiver takes Standard.Void. A TYPE receiver -- type argument, parameter type, field type,
      local type -- takes the type; a VALUE receiver -- an initializer, an argument, an assignment
      -- takes Standard.Void.Instance. Framing it this way is what covers the positions holding no
      expression at all, `Result<void>` being the plain case and the one an expression-shaped rule
      misses.

      ONE DELIBERATE EXCEPTION. A method's return type emits the C# `void` keyword, though it is a
      type receiver, because C# offers a native form there and the value is recoverable. That
      exception is exactly what the call-site lowering repairs: the call now yields nothing in C#,
      so a value receiver evaluates it as a statement, keeping its side effects, and then supplies
      Standard.Void.Instance itself. Sound because the type has one inhabitant, so the value
      carries no information and reconstruction is exact rather than approximate. Taking the
      exception is also what hands back the CLR-native shape wherever C# demands one, in overrides,
      interface members, entry points and delegate conversions.

      DO NOT COPY CLASSIC. Classic runs a whole-program usage analysis to choose per method
      between `void` and a generated MistVoid struct, and MistVoid is a hand-written C# copy of
      Void.mist that nothing keeps in step with it. Deciding by usage makes a declaration's
      signature depend on its callers, which cannot be answered for a public method whose callers
      live in a project compiled later, forces a whole override chain to change when one call site
      consumes a result, and has no answer for a method with both a consuming and a discarding
      call site. Uniform `void` plus lowering at the sites that want a value needs no such
      analysis.

      A RUNTIME OF OUR OWN WOULD NEED NONE OF THIS. All of the above is a concession to the CLR's
      treatment of System.Void. A backend targeting our own runtime can use its unit type in every
      position and drop both lowerings.

      DELIVERED TO THE DESIGN ABOVE, three residues below. The trichotomy is one binder arm
      deciding by target type; absence and the singleton are distinct expression kinds and the
      type-literal reading is the general typeof expression, typed Standard.Type. Every type
      receiver takes Standard.Void, the return-type exception lives in one place
      (MethodEmitter.EmitSignature), and the call-site lowering reconstructs the unit at ROOT
      value receivers -- a local's initializer and a return value -- by evaluating the call as a
      statement and supplying the instance. Type argument, parameter and field positions all
      emit and run. The struct itself is a generated __Void.g.cs whose members follow Void.mist,
      plus ToString and the equality overrides as backend additions so interpolation prints the
      unit's name and the constant operators compile clean.

      ONE IDENTITY, DELIBERATELY: the type literal, and the generated implicit conversion to
      Type, both produce typeof(Standard.Void) -- where classic splits between typeof(void) and
      a MistVoid struct. One type, two spellings, one reflection object; output-identical to
      classic because the short name is Void either way. VoidType runs byte-identical to
      classic, VoidValueLiteral runs for the FIRST TIME ON ANY PIPELINE and matches classic
      line-for-line; all three unlocked samples are banked in AllFeaturesV2.

      NESTED VALUE RECEIVERS ARE HOISTED (2026-09-13). MEASURED FIRST on v2: `Log.G(Log.F(), Log.H())`,
      `$"hole={Log.F()}"` and `unit = Log.F()` each failed in Roslyn -- 'cannot convert from void to
      Standard.Void', 'to object?', 'Cannot implicitly convert type void' -- where classic prints
      `g(Void,1) trail=fh`, `hole=Void then 1` and `unit=Void`. UnitHoisting walks an expression
      statement, a local's initializer, a return value, a deconstruction, a foreach collection and an if
      condition in evaluation order. A call yielding nothing whose value is taken runs as a statement
      ahead of it with Standard.Void.Instance in its place, and every operand C# would have evaluated
      before the call is first stored in a temporary: `g3(k(), f(), h())` emits `int __e1 = k(); f();
      g3(__e1, Standard.Void.Instance, h())`. No temporary for a local, a literal, this or a lambda, which
      no call can change; nor for a value-type receiver or a by-reference argument, which C# reads as a
      location when the call is made. An else-if whose condition hoists emits inside its else, and a
      while condition lowers to `while (true) { hoisted; if (!(condition)) break; body }` so the call
      runs on every iteration. The emitter reads the substitutions by node, so no bound expression is
      rebuilt. Whether a call yields nothing is its method's DECLARED return type: `Echo<void>(void)`
      returns a real Standard.Void in C# and is left where it is. A call yielding nothing that cannot be
      hoisted -- under an operand that may not run, in a for loop, or with no statement of its own -- is
      MIST_BE_UNHOISTED_UNIT_CALL at the argument, hole, assignment value or receiver, where Roslyn
      failed before; see the task below.
      MEASURED on v2, each line identical to classic's: the three positions above, `g3(2,Void,1)
      trail=kfh`, a field read before the call (`read(x) trail=xf`), a receiver made before it
      (`took trail=mf`), a unit call as the argument of one (`both(Void,2) trail=fw`), a binary operand
      stored ahead of the call (`nameread(j) trail=nf`), a constructor argument, `Log.F().ToString()`, a return, a block lambda, a while condition
      running `fbfbf`, an else-if, a foreach collection and a deconstruction; MSBuild compiles the
      lowered loop without warning. `flag && Log.Check(Log.F())` is refused on v2 and runs on classic.
      PROVED BY UnitHoistingEmissionTests (each position, the stored operand, a local left unstored, the
      lowered loop, the else-if, a unit value left alone, the refusal) and the Tier 4
      UnitHoistingRuntimeTests, whose trail `kfh`, `xf` and `mfhfk` is the order the program ran in,
      identical to classic's. Ten mutations on confirmed builds each fail at least one test. Full
      suite green, 6038 of 6038.
    tasks:
      - >
        Emit Standard.Void by transpiling Standard/Void.mist rather than generating the C#
        (delete CSharpEmitterV2.EmitVoidStruct in its favour), so the language stays the one
        authority on what Void is and a later backend inherits the definition instead of
        reimplementing it. Still waits on properties, operator declarations and cast operator
        declarations, all of which Void.mist uses.
      - >
        Take the value of a unit-valued call where hoisting cannot: under an operand that may not
        run (the right of `&&` or `||`, a coalesce, a conditional access, a switch arm, a `??=`
        value), in a `for` loop's condition or step, and in an expression with no statement of its
        own -- an expression-bodied lambda, member or local function, a field or property
        initializer, a default block entry, a constructor's base arguments. Each is
        MIST_BE_UNHOISTED_UNIT_CALL today. The first needs the conditional lowered to statements,
        the rest a statement to hoist into. Classic runs all of them but the expression-bodied
        lambda, which fails in Roslyn there too.
      - >
        Wrap rather than convert where a unit-returning method is used as a function value,
        since Func<Standard.Void> cannot bind a void-returning method. Waits on lambdas and
        method-group conversion, orders 104 to 109.
    unlocks: [OptionalTypes, VoidType, VoidValueLiteral]

