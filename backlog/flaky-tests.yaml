          THREE MEASUREMENTS MAKE IT A MECHANISM RATHER THAN A GUESS. 143 of the failures carry
          literally "MIST_UNDEFINED_NAMESPACE: The namespace 'Standard' could not be found", so the
          standard library was genuinely absent and not merely mis-resolved. The failures occupy a
          WINDOW -- first [FAIL] at 00:00:00.66, last at 00:00:32.20, nothing in the remaining 24
