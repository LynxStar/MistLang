        applicable to any argument. Separate from the identity question IsIndeterminate answers,
        which must keep excluding it. Unblocks `Console.WriteLine` on any non-string argument.
      - Extend ConversionRelation to user-defined cast operators, which ConcreteType.CastOperatorsList
