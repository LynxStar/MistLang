      AN ENUM REACHING AN OPERATOR ON ITS UNDERLYING VALUE IS NOW CALLED AT THESE SITES, the step being lossless
      by the cast-operators glossary: `Feet f = Priority.High;` over implicit Feet(int) was MIST_PA_CAST_REQUIRED
