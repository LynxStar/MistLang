# V2 Emitter Capability Progression
#
# Hand-authored. THE SOURCE OF TRUTH for what the v2 emitter still needs and in what order.
#
# Supersedes and replaces three deleted artifacts:
#   - backlog/emitter-v2-sample-progression.yaml   (node-count ordering, see below)
#   - backlog/emitter-v2-sample-fingerprints.json  (its measured input)
#   - backlog/sample-introduction-history.yaml     (chronology, now folded into intro_order)
# and the tool that generated the first two, tools/SampleFingerprint.
#
#
# WHY THE NODE-COUNT ORDERING WAS ABANDONED
#
#   The old metric counted distinct syntax node kinds a sample introduced. A feature
#   whose difficulty is *repetition of an already-covered node* is therefore invisible to
#   it. Overload resolution is exactly that -- four `Format` methods are four
#   MethodDeclarationNodes, and MethodDeclarationNode was covered by tier 0. The metric
#   scores overloading at zero, necessarily, for any sample.
#
#   That is not a mis-estimate, it is a blind spot with a direction. Given two samples
#   needing the same work, greedy-fewest-new-nodes prefers the one that concentrates its
#   difficulty in the dimension the metric cannot see. It picked Overloading over
#   HelloMist by a one-node margin, and overload resolution was then never implemented --
#   Roslyn resolved the calls downstream and the sample went green.
#
#
# THE MODEL HERE
#
#   CAPABILITIES are the unit of work, ordered so each builds on the ones before it. A
#   capability is named in compiler terms ("overload-resolution-by-argument-type"), never
#   in node-kind terms ("MethodDeclarationNode").
#
#   SAMPLES are acceptance tests, not tasks. A sample becomes runnable when every
#   capability it requires is delivered. Its `threshold` is the last-ordered capability it
#   needs -- the point at which it unlocks.
#
#   A capability unlocks 0..N samples. Zero is normal and expected: many capabilities are
#   pure prerequisites that no sample bottoms out on. Making that explicit is a feature of
#   this model. The old linear sample list could not express "these unlock together" or
#   "this work unlocks nothing yet".
#
#   Sample status is DERIVED, never asserted. A sample cannot be marked done while any
#   capability it requires is outstanding. This is what stops the Overloading failure from
#   recurring.
#
#   WHERE GREENNESS ACTUALLY LIVES: samples/AllFeaturesV2. A sample runs on v2 if and only
#   if it is referenced from that project's mist.toml and its RunDemo() is called from
#   Program.mist, with its output appended to samples/__baselines__/AllFeaturesV2.out. That
#   is the record; this file explains it but is not it. Deliberately no `status` field here
#   -- a second place to assert greenness is a second place for it to be wrong, which is the
#   mistake the deleted sample progression made.
#
#   A sample can be green while a capability it requires is still `partial`. That is not a
#   contradiction, it means the partial's residue is unreachable from that sample, and the
#   record says which residue -- see struct-declaration (order 20), green through HelloMist
#   and Classes while its parameterless-struct-constructor workaround stands untouched.
#
#   THE CHECKABLE FORM OF THAT RULE, because it was stated loosely enough to go unchecked for a
#   while and three banked samples were sitting over `missing` capabilities when it was finally
#   run: no banked sample may require a `missing` capability, directly or transitively, where
#   TRANSITIVELY FOLLOWS `requires` ONLY THROUGH `done`.
#
#   That last clause is the whole subtlety and it is not a convenience. A `done` capability
#   genuinely needed every prerequisite it declares, so its edges are the sample's business. A
#   `partial` one may declare prerequisites that only its UNDELIVERED half needs -- see
#   adhoc-refinement-where-clauses (order 147), whose accepted-and-erased syntax needs neither the
#   implication engine nor witness encoding, while the discharge it has not built needs both.
#   Following its edges would charge Properties for a residue it never touches, and reporting that
#   as a violation is how a correct record gets edited into a wrong one.
#
#   The rule catches two different faults and the difference matters. Either the capability is
#   understated and something in it works (75, 126, 127 and 147 were all `missing` while carrying a
#   green sample), or the sample's `requires` names something it does not use. Establish which
#   before touching the status: the first is a status edit, the second is an edge edit, and
#   guessing produces a file that passes its own check while describing a program that does not
#   exist.
#
#   WHAT THIS EXERCISE DELIVERS, AND WHAT IT DOES NOT
#
#   Building a program model, and emitting from it. NOT verifying that the program is valid.
#   v2 will need many analyzers and NONE of them are in scope here -- Stage 5 is an empty stub
#   on purpose, and source-to-AST is shared with classic, which is untouched.
#
#   So a capability is measured by what it makes REPRESENTABLE and EMITTABLE. Ask of any
#   proposed work: what new part of a program can now be held in memory, or emitted and run?
#   If the answer is nothing, it is not a capability task however much it improves a message.
#   Construction does report a great many errors, and every one of them is something that
#   STOPPED IT BUILDING -- a name it could not resolve, an overload it could not pick. That is
#   not the same as judging a model it finished building. Rules of the second kind go in
#   `analysis_phase_tasks`.
#
#
# CROSS-REFERENCE: backlog/program-model-body-tasks.yaml
#
#   A capability here is END-TO-END: its `v2_status` covers the frontend binding AND the
#   emission together. `constructors` (order 14) is `done` on evidence citing both
#   ConstructorEmitter.Emit and the Phase 3 body walk; `operator-overload-declarations`
#   and `cast-operator-declarations` are `missing` but record that their bodies already
#   bind. So this file is not emitter-only despite the name, and its SCOPE note below is
#   explicit that it was grounded in the v2 emitter and binder both.
#
#   program-model-body-tasks.yaml holds the OTHER axis of the same work: organized by
#   language construct rather than by capability, exhaustive over the grammar, flat and
#   unordered. It answers "what does the binder still not understand?" where this file
#   answers "what do we build next, and which sample goes green when we do?"
#
#   Practical rule: update that file when the binder changes. Update this one when a
#   capability's end-to-end status or its position in the build order changes. A change
#   that moves both needs both edited -- nothing links or reconciles them.
#
#   Format warning: that file and provider-tasks.yaml do NOT parse as YAML (their
#   `- [ ] text` checklist lines are invalid). This file does. Do not write a tool that
#   assumes all three share a format.
#
#
# FIELDS
#
#   capabilities[].order        unique, contiguous from 1, and every entry in `requires`
#                               must have a strictly lower order -- no forward deps
#   capabilities[].v2_status    done | partial | missing | needs-verification | broken
#                                 missing -- not implemented yet. NOT a bug and NOT a
#                                 regression. v2 is a frontend under construction, so
#                                 every capability starts here, and the emitter is
#                                 equally silent about capabilities nobody has thought of
#                                 yet. An absent emitter path is the expected state of
#                                 unstarted work, so `evidence` on a missing capability
#                                 describes where the path will go, not a defect to fix.
#                                 broken -- a code path exists and produces output that
#                                 does not compile. Worse than missing, because there is
#                                 no diagnostic and no sentinel to catch it. This is the
#                                 status that means "bug". So does a LIVE DEFECT note in
#                                 `evidence`, which flags misbehavior in the CLASSIC
#                                 pipeline that v2 must not reproduce.
#   capabilities[].verified_by  how a `done` or `partial` claim is actually satisfied:
#                                 v2-semantics      -- v2 reasons about it correctly
#                                 roslyn-downstream -- v2 emits and Roslyn covers for it
#                                 unexercised       -- implemented, no sample runs it
#   capabilities[].evidence     the file or observation the status rests on
#   capabilities[].tasks        subtasks; a capability may have 1..N
#   capabilities[].unlocks      samples whose threshold this capability is
#
#   capabilities[].analysis_phase_tasks
#                               rules this capability will need ENFORCED, deferred wholesale
#                               to the analysis phase that follows the samples work. Kept
#                               apart from `tasks` because they are NOT what `v2_status`
#                               measures: done here means the model is right and the emission
#                               is right, and v2 runs no analyzers at all -- Stage 5 is an
#                               empty stub. A capability with entries here is not partial;
#                               it is in the same state as every other banked capability.
#                               Recording them per capability is so the analysis phase
#                               inherits the reasoning rather than rediscovering it, and
#                               several are already-written rules that were removed on
#                               purpose rather than rules nobody has designed.
#
#                               THE TEST IS WHETHER SOMETHING IS PRODUCED, never which stage a
#                               diagnostic happens to be declared at. A rule belongs in `tasks`
#                               only if the model or the emission is WRONG without it. A rule
#                               that walks a finished model and judges it belongs here, however
#                               early CLASSIC reports the equivalent -- classic's PipelineStage
#                               is a fact about classic, and v2's construction stage reports
#                               only what stops it building.
#
#                               ORDERS 69 AND 70 GOT THIS WRONG AND IT COST AN IMPLEMENTATION.
#                               Both were recorded `partial` for a missing check, and both
#                               argued it could not be deferred BECAUSE classic declares the
#                               diagnostic at SemanticModelConstruction. Acting on that
#                               produced a Stage 4 conformance checker that made nothing new
#                               representable or emittable, let no program run that had not run
#                               before, and was reverted. Their evidence records the misreading
#                               so it is not repeated on 72, 73 or 74.
#
#   samples[].requires          DIRECT capability dependencies. The transitive closure is
#                               implied, not spelled out. (The first 13 sample records
#                               predate this convention and list their full closure; that is
#                               a harmless superset, not an error.)
#   samples[].threshold         highest-ordered capability in the CLOSURE of `requires`
#   samples[].intro_order       when the sample first entered the repository, carried over
#                               from the deleted chronology file. A prior and a sanity
#                               check, never an authority -- the early numbers are an
#                               artifact of one commit that split a monolithic sample, so
#                               they cannot order that cluster.
#   samples[].untested          what the sample does NOT verify despite appearing to
#
#   samples[].blocked_by        OPTIONAL, and present only where derivation gets the sample WRONG:
#                               its threshold and its whole closure read as satisfied and the sample
#                               still does not run. That happens when a capability overclaimed, so
#                               the field names the capability and the reasoning lives THERE, not
#                               here -- this is a pointer, never a second copy. A sample merely
#                               waiting on an outstanding capability does NOT get one; the closure
#                               already says so.
#
#   `untested` is the second anti-false-done mechanism. Every sample here has entries. A
#   green sample means "these capabilities did not regress", never "this feature is
#   correct".
#
#
# INVARIANTS
#
#   These held when the file was written and are worth preserving by hand. They are stated
#   here because there is deliberately no script enforcing them -- one existed during
#   authoring, caught four real modelling errors, and was then removed to keep this file the
#   only artifact. If it becomes hard to keep these straight by eye, that is the signal to
#   bring the checker back rather than to let the invariants rot.
#
#   1. Capability `order` values are unique and contiguous from 1.
#   2. Every id in a capability's `requires` exists and has a strictly LOWER order. No
#      forward dependencies.
#   3. Every id in a target's `requires` exists.
#   4. A target's `threshold` is the highest-ordered capability in the TRANSITIVE CLOSURE of
#      its `requires`, not merely the highest one listed.
#   5. A capability's `unlocks` lists exactly the targets whose threshold it is.
#   6. Every capability is reachable from some target, or is listed in
#      `orphan_capabilities` with a reason.
#   7. Every entry in `uncovered_constructs` carries a disposition.
#
#   Errors 1 and 4 are the ones that actually bit during authoring. Inserting a capability
#   mid-file renumbers everything after it, and a threshold is easy to get wrong because the
#   deciding capability is often reached indirectly rather than named in the list.
#
#
# OTHER SECTIONS
#
#   non_sample_targets    Acceptance targets that are not samples. The stdlib is one: v2
#                         transpiles it on every compile, and it exercises operators, cast
#                         operators, properties and `intrinsic` that NO sample touches.
#                         Sample-only tracking structurally cannot see those.
#
#   orphan_capabilities   Capabilities no target requires, each with a reason. Usually a
#                         soundness check whose only observable is a rejection, which no
#                         sample can contain because samples must build clean.
#
#   uncovered_constructs  Language constructs the grammar generates that appear in NO
#                         sample, each with a disposition. Recording them stops the
#                         progression from implying the sample suite is complete.
#                         The census behind this list was taken once, by diffing the
#                         generated AST node classes against the node kinds present across
#                         all 77 samples. Re-taking it means re-doing that diff by hand.
#
#   measured_defects      v2 code paths that EXIST and emit output that does not compile.
#                         The ordering model has no home for these -- it orders capabilities,
#                         which are unstarted or delivered -- and the LIVE DEFECT convention
#                         used in `evidence` describes CLASSIC's bugs, never v2's. Added
#                         after the first sweep that BUILT the unbanked samples instead of
#                         reasoning about them from source, which found seven producing
#                         nothing but Roslyn errors while this file recorded zero `broken`.
#                         It carries the re-measurement recipe; run that before disputing
#                         any status it names.
#
#
# SCOPE
#
#   All 77 samples (AllFeatures and AllFeaturesV2 excluded as orchestrators), plus the
#   stdlib as a non-sample target, plus the 24 constructs no sample covers.
#
#   Grounded in reading every .mist file and mist.toml in all 77 samples, the committed
#   out/*.cs where present, and the relevant compiler source: the v2 emitter and binder in
#   full; and in the classic pipeline CSharpEmitter, CSharpTypeMap, UnionType, UnknownType,
#   ArrayType, DependentTypeParameterType, AssociatedTypeSlotType, ConformanceMap,
#   ExhaustivenessChecker, TypeCheckerAnalyzer, ReadonlyAnalyzer, ProjectConfiguration,
#   EntryPointDiagnostics, and the stdlib Array/IEnumerable/Action declarations.
#
#   DEPTH CAVEAT: the 13 tier-0/tier-1 records were derived from a close reading of every
#   file plus the emitter paths that serve them. The other 62 are one pass deep. Their
#   capability lists are reliable; their `untested` lists are the most likely place for
#   something to have been missed.

capabilities:

  # ===================================================================
  # Layer A -- core language. Delivered.
  # ===================================================================

  - id: class-declaration
    name: Class declaration with public accessibility
    order: 1
    layer: core-language
    requires: []
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      TypeEmitter.Emit writes `{accessibility}{typeKeyword} {Name}`. Accessibility
      collapsed to "public " or "" until order 40 spelled every level.
    unlocks: []

  - id: methods-static-and-instance
    name: Static and instance methods with parameters and return types
    order: 2
    layer: core-language
    requires: [class-declaration]
    v2_status: done
    verified_by: v2-semantics
    evidence: MethodEmitter.Emit, ParameterEmitter.Emit, MemberModifierEmitter.Emit.
    unlocks: []

  - id: statements-core
    name: Local declarations, assignment, expression statements, return
    order: 3
    layer: core-language
    requires: [methods-static-and-instance]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      BodyEmitter handles LocalDeclarationStatement, ExpressionStatement and
      ReturnStatement (valued and bare). AssignmentExpression emits `=` only.
    unlocks: []

  - id: namespace-file-scoped
    name: File-scoped namespace and same-namespace cross-file resolution
    order: 4
    layer: core-language
    requires: [class-declaration]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      TypeEmitter emits a file-scoped namespace from MemberType.NamespaceName and derives
      the output path from it. Primitives resolves StringUtils by simple name across two
      files sharing one file-scoped namespace.
    unlocks: []

  - id: standard-library-binding
    name: Standard library binding and Standard-to-BCL rewriting
    order: 5
    layer: core-language
    requires: [namespace-file-scoped, statements-core]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      TypeEmitter unconditionally emits a System import. Console, Convert and String
      intrinsics from Source/Standard/Bootstrap bind and map onto CLR types.

      THE IMPORT IS GONE (2026-09-12), and with it the bare names it existed for. An intrinsic
      Standard type is one the backend SUBSTITUTES a CLR type for, and a substituted name is the
      emitter's to spell, not the source's using directives to cover: TypeNameEmitter had written
      `Console`, `Math`, `Span` and every other non-keyword intrinsic by its bare Standard name and
      relied on a `using System;` slammed onto every file, while dropping the file's own `using
      Standard;` on the claim that Standard has no C# counterpart -- false, since Standard is
      emitted like any Mist source (out/Standard/IClonable.cs, __Void.g.cs). Now ClrSpelling holds
      the one table from an intrinsic Standard type to its CLR name and metadata name; MapMemberType,
      LengthErasure, TaskProjection, ClrProjection, RegexLowering and IntrinsicSupply's audit all
      read it, and MapMemberType has no bare-name fallback left. EmitUsings writes exactly the Mist
      file's directives plus the manifest's globals, Standard included and nothing added. Measured
      on AllFeaturesV2: 1842 `System.Console.` and no bare `Console.`, every file's usings equal to
      its source's, stdout byte-identical. ClrSpellingTests (Tier 3) holds the table against the
      real Standard in both directions, so an intrinsic type with no spelling fails a test rather than
      a user's build. The 367 book snippets regenerated once for the full names.

      THE SDK'S IMPLICIT USINGS ARE OFF TOO (2026-09-12). The generated project had carried
      `<ImplicitUsings>enable</ImplicitUsings>`, which imports System, System.Linq and a few more into
      every generated file behind the emitter's back -- so a bare name the emitter slipped would have
      compiled anyway and the full-name rule above was unenforced at the Roslyn level. v2's
      ProjectFileEmitter now writes `disable`; classic's own project emitter is separate and
      untouched. Measured: AllFeaturesV2 and samples/Testing compile and match with nothing else
      changed, so no generated file had been relying on it.
    unlocks: [Simpliest]

  - id: literals-primitive
    name: Primitive literals with suffix and width handling
    order: 6
    layer: core-language
    requires: [statements-core]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      BodyEmitter.EmitLiteral, plus EmitIntegerLiteral (UL/L/U suffixes keyed on the
      resolved type) and EmitDoubleLiteral (forces a decimal point). Hex folds to decimal,
      so 0xFF emits as 255.
    unlocks: []

  - id: string-interpolation
    name: Interpolated strings with expression holes
    order: 7
    layer: core-language
    requires: [literals-primitive]
    v2_status: done
    verified_by: v2-semantics
    evidence: BodyEmitter InterpolatedStringExpression, text and hole parts.
    unlocks: []

  - id: var-type-inference
    name: var local inference
    order: 8
    layer: core-language
    requires: [statements-core]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      EmitLocalDeclaration writes the resolved type name, so inference happens in the
      binder rather than being deferred to C# var.
    unlocks: []

  - id: operators-arithmetic-comparison-logical
    name: Arithmetic, comparison and logical operators with precedence
    order: 9
    layer: core-language
    requires: [literals-primitive]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      BodyEmitter.MapBinaryOperator, MapUnaryOperator (negate and logical-not only), and
      EmitSubExpression which parenthesizes a lower-precedence child.

      A COMPARISON OVER OPERANDS WITH NO DECLARED OPERATOR IS TYPED WRONG, found while probing enum
      equality for order 89. `a == b` over two user CLASS instances, or two enum values, binds to an
      expression typed as the OPERAND rather than as bool, so `var eq = a == b;` gives the local the
      operand's type and Roslyn refuses the assignment against generated C#. Not enum-specific and not
      a live defect in any valid program: classic refuses both inputs with MIST_TC_0005, so Mist has no
      `==` over a reference type for a user to write. The gap is that v2 types it instead of refusing
      it. Left unbuilt because the fix is a diagnostic and refusing a program is analysis-phase work.

      ARITHMETIC ON A NARROW INTEGRAL ANSWERS ITS OWN TYPE (2026-09-14), BY DECISION, found while probing
      a newtype over byte for analysis order 4. Standard declares `Byte operator +(Byte, Byte)`
      (standard-library Requirement 3.4) and C# answers int for the same arithmetic, so every narrow slot
      failed in Roslyn on BOTH pipelines: `byte c = a + b;`, the same over `-`, `*`, `/`, `%`, short,
      sbyte and ushort, `-a` over sbyte, a byte argument and a byte return (CS0266 and CS1503). v2 typed
      `var c = a + b;` byte by the declaration and failed there too, where classic printed 300, C#'s int
      leaking through. The language owner: "I see no reason byte + byte isn't byte." NarrowArithmetic spells
      a byte, sbyte, short or ushort result back into its type, `((byte)(a + b))`, wrapping as int already
      does; BodyEmitter asks it for a binary and a unary expression, and IntrinsicCloneEmitter for a clone's
      operator over its backing values, so `type Tiny = new byte;` -- which failed in Roslyn even unused, its
      five arithmetic operators spelled `new Tiny((a.Value + b.Value))` -- now compiles (order 86).
      MEASURED on v2 after, one project per probe: bytes 200 and 100 give 44 for `+` (in a local, `var`, an
      argument, a return and an interpolation), 156 for `b - a`, 32 for `*`; 200 and 30 give 6 and 20 for `/`
      and `%`; shorts 30000 and 10000 give -25536; sbytes 100 and 50 give -106, and `-(-128)` gives -128;
      ushorts 60000 and 10000 give 4464. `a + b > b` is False, where classic prints True, and `$"{a + b}"`
      44, where classic prints 300: the two divergences, both by the decision. Newtypes over byte, short,
      sbyte and ushort wrap through their own operators -- Tinies 200 and 100 print 44, 156, 32, 2, 0 for `+`,
      `b - a`, `*`, `/`, `%` -- and `Tiny doubled = box.Size + box.Size` over a field holding 7 prints 14. Unchanged: `byte + int` selects Int32's operator and prints
      300, and a newtype over int still wraps (-294967296).
      PROVED BY NarrowArithmeticEmissionTests (seven spellings, including a nested subtraction and a
      comparison over a sum, and three left as written) and an IntrinsicCloneEmissionTests fact over a byte
      and an sbyte clone. Three mutations on confirmed builds: nothing promoted fails eight tests, the
      clone spelled by its own type rather than its source fails the clone fact, and the binary case removed
      fails six. Full suite green, 6177 of 6177, and SnippetEmitter changed no snippet by this (8 stale tabs
      from earlier cast spelling changes regenerated, 360 unchanged, 0 failed).

      AN OPERAND KEEPS THE PARENTHESES ITS POSITION NEEDS (2026-09-14), closing the task that said a
      coalescing operand lost them. Parentheses written in source reach the model as nothing, so
      EmitSubExpression puts them back wherever an operand binds more loosely than its position in C#, and
      it asked GetPrecedence, which knew binary, unary, `is` and a dropped task and called everything else
      an atom. The probe for the named defect found six more, most of them compiling and printing a
      different value. The scale now has C#'s levels for the kinds Mist emits bare -- assignment, then
      `??`, below `||`; a switch expression between multiplicative and prefix; an identity `as` taking its
      operand's own level; a byte, sbyte, short or ushort operation an atom, being spelled as a cast --
      and four sites stop writing an operand bare: a right operand of a binary asks one level tighter,
      since every binary operator Mist has is left-associative; `??` asks its own level of its right
      operand and one tighter of its left; a switch asks one tighter than itself of its scrutinee; and an
      `as` widening asks a cast's operand level.
      MEASURED on v2 before and after, one project per probe, against classic. Coalescing operands: `(maybe
      ?? b) + b` with 250 and 10 printed 250, classic 260, now 260; `b + (maybe ?? b)` over void printed 10
      for 20; `-(maybe ?? b)` 10 for -10; `!(flag ?? false)` over void False for True; `(flag ?? false) ||
      true` over false False for True; `(text ?? "abc").ToUpper()` over "xyz" printed xyz for XYZ;
      `((maybe ?? b) as int) + b` 250 for 260; `(maybe ?? b) > 5`, `(maybe ?? b) is 10`, `(text ??
      "abc").Length`, `(xs ?? ys)[0]` and `arr[(m ?? 0)..]` failed in Roslyn where classic prints True, True,
      3, 7 and 3. Right operands: `a - (b - c)` with 10, 3 and 2 printed 5 for 9, and `a / (b / c)` with 12,
      6 and 2 printed 1 for 4. `(a + b) switch { 3 => "three", _ => "other" }` printed 1other for three,
      `-(x switch { 1 => 5, _ => 6 })` 6 for -5, and `int c = (a = 5) + 1;` left a at 6 where classic has 5.
      All now print classic's value. Two v2-only shapes, classic refusing the program: `"n=" + (a + b)`
      printed n=12 and now n=3 (the concatenation is analysis order 9's recorded divergence), and `(big +
      big) as long` over 2000000000 printed 4000000000, the widening applied before the sum, and now
      -294967296 (classic MIST_TC_0160). Unchanged and still bare: `a - b - c`, `a + b * c`, `maybe ?? b`,
      and `(x switch { ... }) * 2`, which C# already reads as written and printed 10 on both.
      NOT REACHED: a lambda as an operand -- `f ?? (y => y + 1)` does not parse on either pipeline and
      `(y => y + 1)(1)` is refused on both (MIST_PM_LAMBDA_PARAMETER_NO_TYPE, MIST_TC_0116) -- and `??=` as
      an operand, refused as a statement on both.
      PROVED BY OperandParenthesesEmissionTests (nine coalescing operands, three right operands, six looser
      operands including `maybe ?? (a = 5)` and `(maybe = other) ?? 9`, four left bare) and a
      NarrowArithmeticEmissionTests row where a declared `byte operator -` over a sum keeps its right
      operand's parentheses inside the cast. Ten mutations on confirmed builds each fail at least one test:
      no coalescing row (nine), right operands at the operator's own level (three), no switch row, the
      scrutinee bare, assignment as an atom (three), no identity-`as` row, the widening operand bare, the
      coalescing operands bare (two), a narrow operation not an atom, and the narrow case's right operand at
      the operator's own level. Full suite green, 6200 of 6200; SnippetEmitter 0 updated, 368 unchanged.
    analysis_phase_tasks:
      - >
        Report a comparison whose operands have no operator that admits them, rather than typing the
        result as the operand type. Classic's MIST_TC_0005 is the model. Until then the failure lands on
        generated C# as a conversion error naming the operand type.
    unlocks: []

  - id: control-flow-basic
