        empty string identically, and nothing dereferences a defaulted string.
      - The int and bool defaults are emitted as C# default expressions, so Mist never
        computes those zero values -- Roslyn does.
      - A compiler that ignored the default expression entirely and emitted plain
        construction produces identical output for Config, Settings and AppState. The factory
        indirection is load-bearing only for Container.
      - Payload is entirely dead. Declared, given a synthesized constructor, never
        instantiated or defaulted or printed. Its comment mislabels it as a readonly struct
        with a constructor and default block.
      - AppState's default block assigns all three fields, so a PARTIAL block, where the
        interaction between block assignments and zero-init would be observable, does not
        appear.
      - Container is the only struct, the only readonly type, the only type with both a
        constructor and a default block, and the only type where construction and defaulting
        diverge. Four capabilities are entangled in one instance, so a failure in any one
        cannot be localized by this sample.
      - The bare default and the type-qualified default emit byte-identical code, so the
        bare-default path could be a syntactic rewrite and nothing would distinguish it.
      - No default expression in argument position, return position, or as a field
        initializer. Every use initializes a local with an explicit declared type.
      - No arithmetic, comparison or control flow anywhere.

