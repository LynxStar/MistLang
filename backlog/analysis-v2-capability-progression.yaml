    tasks:
      - >
        The definite-assignment spec is stricter than classic: Req 1.1 refuses any read of an
        unassigned field, and Req 1.8 treats `this` passed, returned, or invoked on as a read of every
        unassigned field. Classic refuses only a read through an explicit `this`, and v2 follows
        classic. Whether to adopt the spec's rule -- which refuses samples-shaped code like a helper
        method called from a constructor before every field is assigned -- is a decision.
      - >
        Field-path precision covers source-declared struct fields. Imported/intrinsic storage, tuple
        elements and synthesized variadic projections remain opaque and require whole-value assignment.
        Empty-layout recursion guards use struct definitions, so repeated generic wrappers around an
        empty type can conservatively require whole-value assignment when their paths are unexpanded.
        Local-function capture summaries remain flow-insensitive: a function that writes a capture
        before reading it still requires assignment at entry and does not establish assignment in its
        caller. Ref-alias referents and interprocedural assignment effects are not modeled.
      - >
        Parameters have no Introduce step: the model keeps a method's parameters as Parameter, and
        the LocalVariable each is referenced through is the body scope's. Order 11 will want them on
        the graph, and will need the binder to record the mapping.
      - >
        The worklist's iteration to a fixpoint is exercised by every loop in the corpus but cannot be
        told apart from a single pass on an intersection lattice, whose back edges only remove. The
        first customer whose lattice grows along a back edge is the one that will observe it.
  - id: ownership-borrow-checking
    name: Tiers, moves, lending and the substructural counts
    order: 11
    subsystem: ownership
    requires: [flow-framework, assignability-core]
    status: done
    from: >
      orders 134, 136, 137, 138, 140, 154, 155, 156, 158, 159, 160, 161, 164 -- 15 tasks
    evidence: >
      THE LEAST LIKE ANYTHING C# CHECKS, so it was measured on classic more than any order before it:
      twelve probes, 150 shapes, each run through classic and then through v2 until the two agreed
      everywhere but where a divergence is recorded below. What classic refuses is narrower than the
      specs say, and v2 follows classic: the spec's stricter wordings are the tasks.

      MOVES AND LEASES ARE THE FLOW FRAMEWORK'S SECOND CUSTOMER, and needed two things of it: a Leave
      step where a block's scope ends, on the fall-through, a return and a break alike, and the loops,
      header and latch, on the graph. OwnershipAnalyzer's lattice is a map of moved bindings and a map of
      leases. A binding is moved by a declaration or assignment that takes it directly, by an owned
      parameter or owned constructor argument, by an array literal, by a call `with owned`, and for a
      linear or affine value by `Drop()`; NOT by a field taking it, and NOT by a plain parameter taking a
      linear value, since classic admits a use after both. A use after a move is refused at the use, and
      a move inside a loop of a binding declared outside it at the move; a reassignment restores. A lease
      is a local declared frozen, borrowed or readonly ref from another local -- the binder now records
      the frozen tier, which it had folded into unrestricted -- and lasts until its block's Leave: the
      lender cannot be moved meanwhile, nor mutated or borrowed while frozen, nor touched at all while
      borrowed; a lease by call lasts only the call. Two paths join by remembering either's move, as
      classic does; a binding once complained of is settled, so one mistake is one complaint per path.
      Structs are never tracked: a copy is a value of its own, and classic passes one to every tier.

      TIERS, ONE LATTICE: unrestricted, readonly ref, frozen, borrowed, owned. ThisTiers gives what a
      method needs -- its `with` clause, or borrowed when its body assigns an owned field (a field
      declared owned, or any field of an owned type), or what a callee reached through an explicit
      `this.` needs -- and what a receiver gives: its declared tier for a local or parameter, owned for
      an unrestricted LOCAL, unrestricted for an unrestricted PARAMETER, owned for an owned field and
      unrestricted for a bare plain field, and owned for anything else. Every one of those is classic's
      verdict measured, including the two it draws oddly: an implicit `Deposit(1)` is not followed where
      `this.Deposit(1)` is, and `Spare.Rev(1)` is refused where `this.Spare.Rev(1)` is admitted. A
      `with` clause below what the body needs is refused at the method. Lending by call is judged by
      declared tiers only -- an unrestricted local is refused for a borrowed or frozen parameter even
      when it was `new`, which is classic's verdict and the one place its `var` inference does not
      reach -- and an owned parameter accepts any argument, the move being the flow rule's. Extracting
      an owned field into an owned binding through an unrestricted local is refused; through a clone,
      which the binder inserts for a clonable type, nothing is extracted, so string fields pass.

      DECLARATIONS, in DisciplineAnalyzer: `owned` on an abstract; `affine` or `linear` beside `owned`,
      which they imply, and `relevant` beside it, which it excludes; `ref` on a class; a ref struct as
      a field of anything but a ref struct, or as a type argument; an owned binding of a linear or
      affine value; and the containment matrix -- linear holds anything, affine holds affine or
      unrestricted, relevant holds relevant or unrestricted, every other container only unrestricted,
      with a type parameter counting as its constraint says and refused unconstrained inside a
      disciplined container. Standard's Task is relevant and ValueTask linear, so a plain class holding
      either is refused, as classic refuses it. ReadonlyAnalyzer refuses the three field writes classic
      refuses: inside a readonly method or a method of a readonly type, through a readonly parameter,
      and to a readonly field outside a constructor -- from outside the type too, which classic leaves
      to Roslyn. EscapeAnalyzer refuses a stackalloc-backed span returned, directly or through a local,
      and a lambda capturing a ref struct, an owned binding, a frozen or borrowed lease, or a readonly
      ref parameter, the last being Roslyn's refusal of an `in` parameter in a lambda.

      THREE READONLY RESIDUES CLOSED (2026-09-12), each on a selection the model now records. A
      BinaryExpression and a UnaryExpression carry the Operator they selected, and an IndexExpression
      the user Indexer it resolved to -- never an intrinsic one, since an array's or a span's element
      access has no accessor to judge, which is also what keeps `tmp[0] = 1` on a scratch array
      admitted. With those in hand: a readonly context calling a user operator whose body writes, or
      reading a user indexer whose getter writes, is MIST_PA_READONLY_CONTEXT_CALLS_MUTABLE, and
      setting a user indexer on a local or a parameter is MIST_PA_READONLY_CONTEXT_SETS_PROPERTY,
      where before the write was judged by provenance alone and a local-rooted setter went unjudged;
      a this- or field-rooted write keeps its WRITES_THROUGH_INDEX reading. The inference reads the
      same recordings, so an operator or a getter that writes now unsettles its callers as a method
      would, and an intrinsic operator is exempt as the target's own arithmetic. A READONLY PARAMETER
      now constrains what the readonly-contexts spec says it does (Req 14.2 and 14.4): calling a
      method on it that is not readonly, declared or inferred, is
      MIST_PA_READONLY_PARAMETER_CALLS_MUTABLE, and calling a setter on it -- a property's or a user
      indexer's -- is MIST_PA_READONLY_PARAMETER_SETS_PROPERTY. Measured on classic first: classic
      ADMITS the mutable call (`counter.Bump()` on a readonly parameter runs), so this is the spec
      adopted over classic on the register's own terms; classic REFUSES the property set as
      MIST_RO_0007 "Cannot assign to field", reading an auto-property's setter as a field write, and
      v2 admitted it, so that half is a contract gap closed. Getters on a readonly parameter stay
      admitted, Req 14 naming none, and a readonly REF parameter is left to the tier rule, which
      already refuses the same call as MIST_PA_THIS_TIER_MISMATCH -- judging it here too would be
      two complaints about one mistake. Five corpus cases hold the refusals; ReadonlyContextDecisionTests
      holds the admitted side, including a readonly method on a readonly parameter and an element
      write into a readonly array parameter, which is not a setter.

      NOT ENFORCED, BECAUSE CLASSIC DOES NOT: the hiding of
      mutable methods on an owned binding of a non-owned type, field-assignment provenance on an owned
      binding, the cooperation contract of an owned type, an owned binding initialised from a
      non-clonable shared value, per-field jagged ownership beyond shared extraction, lending a frozen
      or readonly ref lender to an owned parameter, and a second borrow by call while frozen. Each is
      measured admitted and each is a task below. Three divergences, more permissive and principled: a
      move on a branch that returns does not poison the path that did not take it (classic refuses,
      being path-insensitive there); a linear value passed to a plain parameter is not moved (classic
      agrees, though the emitter elides its drop -- the task below); and a frozen or borrowed lender lent
      again by call is admitted, as classic admits it.

      THE BINDER NOW CARRIES THE TIERS a parameter's local needs: Ownership and IsRef from the modifier
      and a link to the Parameter itself. An owned parameter passed on to an owned position is a move
      rather than the clone the binder inserted before, which no baseline could see.

      MEASURED: zero findings and identical stdout on AllFeaturesV2 and AllFeatures, and zero on the
      three unbanked samples, on every sweep. Sixty corpus cases, one per refused shape. Fifty-eight
      decision rows pin the admits and the divergences. Thirty-nine mutations, each on a confirmed
      build, all caught: across the flow rule nothing tracked, structs tracked, a join forgetting a
      move, a declaration or an owned parameter or a consuming call not moving, a leave never
      releasing, a reassignment not restoring, use-after-move and loop-move silenced, each lease
      admitting what it forbids; across the tier rule receivers, lend pairs, shared extraction and the
      `with` clause unjudged, an owned-field write or an explicit `this.` call needing nothing, an
      owned type's fields plain, an unrestricted parameter or a bare field providing owned; across
      the declaration rule the matrix admitting all, an unconstrained parameter, an owned abstract, a
      ref struct field or type argument, an owned substructural binding, a conflicting discipline and
      `ref` on a class admitted; the three readonly writes admitted; the stack span return and the
      captures admitted; and a break leaving no scope. Two first survived -- the join, until an
      else-branch move pinned the order paths arrive in, and the break, until a lease taken inside a
      loop and left by break pinned its release.

      LOCAL FUNCTIONS, 2026-09-11 (.kiro/specs/local-functions). A non-static local function's captures are
      judged as a lambda's: a ref struct, an owned, borrowed or frozen binding, or a readonly ref binding
      reports MIST_PA_CAPTURED_BINDING, whose message now names the closure -- lambda or local function.
      The moves and leases inside the body are judged on its nested graph from the state at the
      declaration, exactly as a lambda's are, which shares the lambda's gap: a call before the declaration
      sees the declaration's state. Two corpus cases, an owned binding and a borrowed parameter.
      THE READONLY-CONTEXT BASE RULES ARE ADOPTED, 2026-09-11, with emitter order 135, which built the
      inference they were waiting on. The decision they were recorded as -- classic enforces none of them
      -- was taken FOR adopting, the readonly-contexts spec being the sanctioned input, and the sweep
      then said what a working program does: AllFeaturesV2 and the four readonly samples standalone
      report NOTHING, byte-identical stdout, so no banked program calls a mutable member from a readonly
      context. The rules are base rules 7 to 10 inside any readonly context -- no field written, no
      setter called, no callee that is not readonly, no allocation through a constructor that is not,
      and no write THROUGH AN INDEX whose receiver chain roots at `this` or a field --
      plus the readonly BLOCK (Req 9), which is why ReadonlyAnalyzer now walks bodies structurally
      instead of sweeping nodes: a block turns the context on part-way through, and suspends a
      constructor's privilege for its extent (Req 11.13). Two privileges cut across: a constructor
      assigns the fields of its own type and calls its own readonly setters, and a readonly setter writes
      its backing field. Four corpus cases, one per report, and the admits are decision rows.

      WHAT COUNTS AS READONLY is ReadonlyInference's answer and nothing else. A member with no Mist body
      -- intrinsic, CLR-projected or abstract -- is readonly only if it SAYS so, which makes the stdlib's
      readonly TYPES (the primitives, String, Regex) readonly throughout and leaves Console and Math
      mutable. That is strict enough to refuse `Console.WriteLine` inside a declared readonly method, and
      no banked sample does it.

      THE FIRST CUT SHIPPED TWO HOLES, and they were found by probing the residue this order filed rather
      than by any test -- which is the lesson worth keeping: a rule recorded as "not reached yet" had not
      been measured, and two of the three so recorded turned out to be reachable in four lines of Mist.
      A declared readonly method could write `cells[0] = v` into a field's array, and could call a user
      indexer's setter on a field, and BOTH were admitted and ran. The same classifier serves the
      inference, so a struct method mutating an array field was also emitted `readonly` -- harmless to C#,
      which sees a reference, and a false claim at the Mist level. Both are now the one indexed-write
      rule, rooted at `this` or a field. A write rooted at a LOCAL stays admitted deliberately: a readonly
      member filling a scratch array it just allocated reaches none of the value's storage, and a
      decision row pins it.

      AN AWAIT IS A DROP (2026-09-12). `await v` binds to the same call `v.Drop()` does, so the
      use-after-drop rule sees both spellings with no case of its own: a linear ValueTask awaited twice
      is MIST_PA_USE_AFTER_MOVE at the second, as it is when dropped twice, and a relevant Task is
      admitted either number of times. Both are in the corpus and in OwnershipDecisionTests. Measured
      on the way: on 64cc36c4 the written `await v; await v;` was silent, the rule matching only the
      spelled Drop, which is the gap the one-node reading closes.

      A READONLY `??=` WAS A HOLE (2026-09-15), found by the probes order 9's accessor rule was measured
      with. `O ??= 5` inside a readonly method called the setter and printed 5 on both pipelines, while
      `O = 5` beside it was MIST_PA_READONLY_CONTEXT_SETS_PROPERTY on v2: ReadonlyAnalyzer judged only `=`
      and took a coalescing target for a read. It judges every assignment's target as the write it is, so
      the property case is MIST_PA_READONLY_CONTEXT_SETS_PROPERTY and `this[0] ??= 5`
      MIST_PA_READONLY_CONTEXT_WRITES_THROUGH_INDEX. Whether a target is ALSO read is
      AnalysisContext.DirectionOf's answer, which replaced the analyzer's own set of write targets. One
      corpus case, readonly-method-coalesces-property; ReadonlyContextDecisionTests pins a readonly method
      coalescing a local, admitted, and a write whose getter mutates judged once, as a setter. Four
      mutations, all caught by name: the coalescing write left unjudged (the corpus case), and each of the
      three read guards -- indexer, property by name, property through a receiver -- judging a write as a
      read (AWriteIsJudgedAsASetterOnlyEvenWhereTheGetterMutates).
    tasks:
      - >
        The ownership-v2 spec is stricter than classic in five places v2 follows classic on: mutable
        methods hidden on an owned binding of a non-owned type (Req 2.4), field-assignment provenance
        (Req 4), the cooperation contract (Req 5), an owned binding from a non-clonable shared source
        (Req 1.6), and a borrow by call while a frozen lease stands (Req 9.8). Each is measured
        admitted by classic; adopting any is a decision.
      - >
        A readonly parameter's constraint reaches one member deep: `counter.Bump()` and
        `counter.Count = 5` are judged, `counter.Inner.Bump()` is not, since the chain's tier is a
        question for ThisTiers rather than for a syntactic root. A getter on a readonly parameter is
        admitted, as Req 14 names none.
      - >
        Per-field jagged ownership (order 158): classic tracks only shared extraction. A move out of an
        owned field, a lease on one, and the composite state of the parent are unmeasured because
        every probe with clonable fields cloned instead; with Engine fields classic admits them all.
      - >
        A linear value passed to a plain parameter is admitted after the call by classic and by v2,
        while the emitter's DropInsertion counts that call as a move and elides the drop. One of the
        two is wrong about what a call does to a linear value.
      - >
        Ownership inference for `var` (order 159's second half) is approximated: an unrestricted local
        satisfies any receiver tier, and none for a lend by call. Classic's inference is finer in
        neither measured direction, but a `var` initialised from a parameter and used as a receiver
        needing borrowed is admitted here and may not be by classic.
      - >
        `this` inside a method is given the method's own tier when it is the receiver of an explicit
        call, and owned inside a constructor; `this` passed as an argument is not judged.
      - >
        Assignment to a readonly or borrowed parameter itself is admitted, as classic admits it.
      - >
        The stackalloc escape rule covers a return, directly or through a local or a Slice. A span
        stored into a field or collection escapes too and is unmeasured: the field form is refused
        first as a ref struct field.
  - id: refinement-proving
    name: Static discharge, implication, and nothing left to a guard
    order: 12
    subsystem: refinement
    requires: [assignability-core]
    status: done
    from: >
      orders 141, 142, 143, 144, 147, 148 -- 9 tasks
    evidence: >
      THE MOST SELF-CONTAINED OF THE FOUR, and the flow framework's third customer. Measured on five
      classic probes of 80 shapes; classic's verdicts are narrower than the specs and v2 follows
      them, the specs' stricter wordings being the tasks.

      A PREDICATE IS BOUND ONCE. PredicateBinder binds every refinement the program declares -- a
      refined alias's, a dependent parameter's `where`, a method or indexer parameter's `where` --
      onto the model before any body is bound, and every `is` against the alias shares that pattern:
      the binder no longer re-binds it per use, and an indexer's `where` clause reaches the model at
      all, which it had not. A refined type now carries its alias's name, so a message says
      'AdultAge' where it said 'Int32{refined}'.

      THE PROVER. Admitted is a sorted list of disjoint closed intervals over long -- a code point and
      a truth being integers too -- with intersection, union, complement, subset, shift and widening,
      each an exact set operation. Requirement reads what a bound predicate asks: relational patterns
      as intervals, `and` as intersection, `or` as union, `not` as complement, a nested refinement's
      own predicate, and `&lt; Length` as a bound named symbolically; a property pattern, a regex or a
      real reads as nothing the prover can decide, and nothing is refused on its account. A
      refinement holds of a value when what is known of the value is a subset of what the predicate
      admits: a constant is its own interval; a refined value is its predicate; a parameter carries
      its `where`; and a local carries what the flow established. Implication between two
      refinements is the same subset, which is what a `>= 21` assigned to a `>= 18` needs.

      THE FLOW. The framework gains an Assume step at the head of each path out of a condition, true
      or false. RefinementAnalyzer's lattice is a map of locals to interval sets with symbolic upper
      bounds: `if(x >= 18)` narrows x on the then path and `x < 18` on the else path, an `is` pattern
      narrows its scrutinee, a constant initialiser or assignment sets the local, `i = i + 1` shifts
      it, any other assignment forgets it, and `i < a.Length` is a number when the array's length is
      known and a bound against the array itself when it is not, forgotten when the array is
      reassigned. Two paths join as the union, widened to infinity only the third time a join moves
      a value, so a counting loop settles while an inner loop revisited by an outer one keeps the
      bound the outer condition gave.

      WHAT IS JUDGED: a declaration, an assignment and a return into a refined type, or into a union
      with refined constituents, any of which a constant may satisfy; an index into an array or span
      whose length is known, or whose length is unknown and which a local holds; an indexer's `where`;
      a dependent type argument against its parameter's `where` and domain; an implementation that
      constrains a parameter more than the member it implements; and, since 2026-09-11, EVERY ARGUMENT
      AT A CALL OR A CONSTRUCTION -- method, constructor, abstract slot and func value alike. Classic
      checks neither a refined parameter's argument nor a method's `where` at the call: `Twice(3)`
      against `AdultAge` and `Process(200)` against `where x < 100` are both admitted, the first
      caught by a guard classic emits at the callee and the second by nothing at all. The language's
      owner decided otherwise: a refinement is type checking and a call is where the type is met, so
      an argument is judged as the assignment it is, with the same three verdicts, and no guard is
      emitted (refinement-types R5.3, adhoc 6.1-6.9 and Req 7). A parameter's `where` is read as an
      anonymous refinement of the parameter's type -- `Foo(int x) where x > 90` takes an unnamed
      `int > 90` -- so a named refinement and a `where` on one parameter are one requirement, their
      intersection, and one finding. The constructor position reached the model only with this:
      ConstructorBuilder had never handed its `constraints` to the resolver, so `new Bounded(0)`
      against `where size > 0` bound nothing to judge. NOT judged at that point: an unknown-length
      array a field holds, which classic leaves to the runtime, and a constructor chain's `base(...)`
      arguments, whose chained constructor the model did not record. Each was a task below, and each
      was discharged the same day, in the paragraphs after the mutations.

      DIVERGENCES, each more permissive and each principled: a char literal against a char
      refinement is evaluated where classic prints '?' and refuses; a local given a constant carries
      it (`int y = 40; AdultAge a = y;`); `x > 17` narrows to `>= 18` as intervals do and classic's
      exact-match narrowing does not; the else path of `x < 18` narrows too; `i >= 0 && i < 3`
      proves an index; a `while` loop with its own increment proves one; and an implementation
      constrained to `>= -5` under an abstract's `>= 0` is weaker and admitted, where classic cannot
      read the negative literal and refuses.

      MEASURED: the first sweep reported five findings on three working samples -- indexing an
      unknown-length array through a field, and a loop over an array literal's length, which a
      nested loop then widened away -- fixed at the source; then zero findings and identical stdout
      on AllFeaturesV2 and AllFeatures, and zero on the three unbanked samples. Twenty-nine corpus
      cases, one per refused shape. Fifty-four decision rows pin the admits and the divergences;
      eleven interval facts pin the prover. Twenty-three mutations, each on a confirmed build, all
      caught: nothing judged, assumptions ignored or taken as true on the false path, a reassignment
      keeping its narrowing, a join keeping the stronger path, subset always holding, `>` admitting
      its bound, negation as identity, disjunction as intersection, a constant or a refined type or
      a parameter's `where` saying nothing, an index needing nothing with the length known or
      unknown, a symbolic bound never needed, an indexer constraint, a return, a declaration, a
      dependent argument or a strengthening implementation unjudged, predicates never bound, no
      assumption on a split, and an increment forgetting its lower bound. One first survived -- the
      symbolic bound, until a case with a proven lower bound and nothing above pinned it.

      THE CALL RULE, MEASURED: eight corpus cases, one per refused shape -- a literal, an unproven
      value and an unimplied refinement against a refined parameter, a literal and an unproven value
      against a `where`, each at a method and the two at a constructor, and a `where` on an abstract
      slot met through the abstract; fourteen decision rows for what a call discharges -- a literal,
      an implied refinement, a constant-carrying local, a narrowed local, a forwarded `where`, a
      constructor, a slot, a named refinement and a `where` on one parameter; AllFeaturesV2 and
      AllFeatures identical to baseline with the rule live, and the two green unbanked samples green.

      THE WHERE IS THE TYPE, since the same day. ConstraintResolver makes a parameter's `where` the
      parameter's type, an anonymous RefinedType over the declared one, and PredicateBinder binds it
      as it binds an alias's; Parameter.Refinement is gone, and every reader -- this rule, the
      strengthening check, the indexer path, the flow's knowledge of a parameter local -- reads
      Requirement.OfType, which now intersects a refinement with the refinement beneath it, so a
      `where` over a named refinement asks both. An anonymous refinement displays as its base and is
      named apart by its predicate's offset. Two identities had to look through it. SlotSignatures
      agrees modulo refinement, so an implementation answers a slot over a narrower or a wider set
      and the strengthening check judges the direction, which now also catches a slot over `int`
      filled by a method over `AdultAge`, unjudged before. ConversionRelation.IsImplicit unrefines
      both ends, because a refined value into an overloaded call, and a base value into a refined
      parameter with a sibling overload, were both unresolvable already for NAMED refinements: a
      sole candidate wins without applicability, which is the only reason `Twice(x)` ever bound. A
      constructor chain records the constructor its arguments selected, as `new` does, and its
      arguments are judged from an empty state. Three more corpus cases -- a chain, a `where`
      parameter reassigned outside its predicate, a slot strengthened by a named refinement -- and
      five more rows, two of them through an overloaded callee; both suites identical again.

      A FIELD-HELD ARRAY NOW CARRIES THE BOUND TOO, the second task discharged. Bound is keyed by
      holder -- the local, or the Field behind a bare `items` or a `this.items` -- so `i < items.
      Length` proves `items[i]` exactly as a local's does. Forgotten on any assignment to that field
      through any receiver, and, unless the field is readonly, at any invocation, object creation
      or await, because the code that runs then may reassign it and the flow cannot see inside it;
      a readonly field's bound survives a call. Never crosses a lambda, which already starts from
      nothing. What this refuses that classic admits: an index into an unknown-length field-held
      array with no bound, and a bound lost to a write or to a call -- three corpus cases. Six
      decision rows pin the admits: the loop over a bare field and over `this.items`, a guarded
      parameter, a call after the index inside a loop (the head re-assumes the bound), and a
      readonly field's bound across a call and across a `new`.

      THE SWEEP FOUND TWO WORKING SAMPLES INDEXING A FIELD WITHOUT A BOUND, and both were holes by
      the language's own guarantee: Iterators' enumerator read `items[index]` with a field index,
      which throws before MoveNext, and Attributes' LookupTable indexer read `data[index]` with an
      unconstrained parameter. Both now prove the index -- the enumerator copies the field index to
      a local and guards it, the indexer guards its parameter -- with stdout unchanged and the spec
      proof code following the samples. Then zero findings and identical stdout on AllFeaturesV2 and
      AllFeatures.

      AND THE WRITE SIDE, the same day: an index in assignment-target position was never judged,
      on any array, because the flow graph gives the target IndexExpression no Evaluate step, so
      `var a = new int[3]; a[7] = 10;` compiled and threw -- general.md's own example. Judge now
      asks NeedIndex of an assignment's target as it asks Need of its value; a coalescing write
      already evaluated its target as a read. Two corpus cases and six decision rows, over a
      local and a field holder. The sweep found one more site, Attributes' indexer SETTER, guarded
      now as its getter is, with the spec proof code following.

      A CAST INTO A REFINEMENT IS AN ARGUMENT, since 2026-09-14. Measured first, on both pipelines:
      `(AdultAge)10`, `int n = 10; (AdultAge)n`, an unproven `(AdultAge)n` and `(Meters)10` through
      `explicit operator Meters(AdultAge)` all compiled and printed, and so did `(SmallAdult)5` over
      `byte >= 18` on v2, classic refusing every constant cast to it as MIST_TC_0042. The call rule never
      saw a cast, whose operand is an argument all the same. Asked whether a cast is judged as an argument
      or is the one sanctioned unchecked narrowing into a refinement, the language's owner chose the first:
      a cast is sugar for a conversion-function call, CastAnalyzer's contract is that no cast can fail at
      runtime, and refinement-types 6.1 and 6.5 leave pattern matching the only way in for a value nothing
      proved (recorded as refinement-types 6.6, with a pointer from cast-operators Requirement 8).
      So the flow walk judges a cast's operand against the called operator's parameter, or against the
      written type where no operator is called, with an assignment's three verdicts, at the cast.
      Refinement to base and a cast into anything unrefined owe nothing. Only a cast whose conversion exists
      is judged -- CastAnalyzer.Converts, the predicate CastAnalyzer itself refuses on, so the two cannot
      disagree -- because `(Small)300` over `byte <= 10` and `(SmallOrName)-5` are CAST_HAS_NO_CONVERSION
      already and a violated predicate on top would be a second complaint about one mistake. A local the
      flow knows is 10 is UNPROVEN, not VIOLATED, as the same local assigned is.

      AFTER: the admit probe prints `30` and `21 70 21 20` unchanged; each refusal probe reports exactly
      one finding, at the cast; `AdultAge a = (AdultAge)10;` reports once, the declaration being satisfied
      by the cast's own type. Four corpus cases -- a literal, an unproven parameter and a literal through a
      refined operator parameter here, and a constant outside a refined byte's base in
      total-conversion-classification, pinning the guard. Eight decision rows replace the one that pinned
      the hole: a satisfying constant, a narrowed local, refinement to base, an implication, a byte
      refinement, a constant-carrying local, a union reached by subsumption and by a fitting constant, and
      the operator path; plus a per-site row and an already-failed row. Three mutations on a confirmed
      build, each caught by the case written for it: no cast arm (the three corpus cases and the per-site
      row), the written type instead of the operator's parameter (the operator case), and no Converts guard
      (the refined-byte case). The full suite with the rule live -- 6211, 664 and 68 tests, AllFeaturesV2's
      baseline among them -- passed with no failure and no rerun, and the build and `dotnet format` were
      clean. RefinementAnalyzer stood at 699 lines, so how a finding is worded moved to RefinementFindings
      first.

      ONE COMPLAINT FOR A VALUE ITS REFINED BASE CANNOT HOLD, since 2026-09-15. MEASURED on v2 at 78c6ad92,
      one project per shape, over `SmallAdult = byte >= 18`, `SmallOrName = SmallAdult | string`, `AdultAge =
      int >= 18` and `Upper = char >= 'A' and <= 'Z'`. These each reported MIST_PA_NO_IMPLICIT_CONVERSION and
      MIST_PA_REFINEMENT_VIOLATED: `SmallAdult a = -5;`, `a = -5;` after `SmallAdult a = 20;`,
      `Helpers.Take(-5)` over Take(SmallAdult), `return -5;` from a method returning SmallAdult,
      `new Box(-5)` over Box(SmallAdult), `SmallOrName s = -5;`, `Upper u = 5;`, `SmallAdult a = 5L;` and
      `AdultAge a = 5L;`. Over `Where(byte b) where b >= 18`, `Helpers.Where(-5)`, `Helpers.Where(5L)` and
      `b = -5;` inside Where each reported NO_IMPLICIT_CONVERSION and CONSTRAINT_VIOLATED. The `where` path
      asked no type question at all, so a value that is no constant was reported twice too: `return
      Where(n);` from a method over `int n` reported NO_IMPLICIT_CONVERSION and CONSTRAINT_UNPROVEN.
      `SmallAdult a = 300;` was one complaint only because 300 satisfies `>= 18`. Classic reports one
      complaint for the declaration (MIST_TC_0097) and for the `where` argument (MIST_REFINEMENT_0005).
      ALREADY ONE COMPLAINT, and unchanged: `SmallAdult a = 5;`, `AgeRange r = 500;`, `Upper u = 'a';` and
      `Where(5)` report the refinement or constraint alone, as a constant cast does behind
      CastAnalyzer.Converts. `b[-5]` over `this[byte index] where index >= 18` is CONSTRAINT_VIOLATED alone,
      because no rule judges an index argument's type (order 5's task); NeedIndex is untouched.

      THE SAME HOLE ADMITTED A PROGRAM. `type Split = int <= 5 | byte >= 200; Split s = 300;` compiled and
      ran, on v2 and on classic. The int constituent refuses 300. The byte constituent cannot hold 300, but
      its predicate was asked anyway and admitted it. This entry's own union task says a constant is judged
      by any integral constituent it FITS; Need implemented any integral constituent. The program is now
      REFINEMENT_VIOLATED, stricter than classic, by the rule that a value is proven where it meets a
      refined type and nothing is left to a guard. The language's owner confirmed the verdict after it was
      built ("300 is correct to be rejected", 2026-09-15). `Split s = 3;` and `Split s = 250;` are admitted,
      as before.

      THE RULE. A value is judged against a refined constituent only where it can enter that constituent.
      Either its type converts implicitly to the constituent's base (Accepts, unchanged), or it is an
      integer constant ConstantConversion.Fits. That is the predicate Assignability admits a constant by,
      so the two rules cannot disagree about a constant. A `where` parameter's anonymous refinement is the
      one constituent of its slot and passes the same test before its predicate is asked. The assignment
      and argument sites therefore no longer dispatch to it separately: Need does it once, for a caller that
      names the constrained slot. A cast names none, so an operator's `where` parameter keeps the refinement
      wording. A value no constituent admits is assignability's alone, the type error surviving as it does
      in `(Small)300`'s CAST_HAS_NO_CONVERSION.

