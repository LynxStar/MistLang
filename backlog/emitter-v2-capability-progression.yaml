      THE TARGET CHOOSES THE SPAN KIND, and reading it wrong is invisible in output. `stackalloc T[n]`
      says nothing about mutability, so the binding does; a first cut compared the target's own
      FullyQualifiedName against the bare declaration's and never matched, since a constructed type's
      name carries its arguments. Every ReadOnlySpan binding therefore bound as a mutable Span AND
