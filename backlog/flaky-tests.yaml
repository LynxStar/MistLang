  - id: mass-standard-namespace-not-found-stale-binaries
    test: Not one test -- 430 of 4645, then 431 of 4647, in Mist.Tests, across every area that compiles Mist source.
    file: n/a
    discovered: 2026-08-01
    status: open
    symptom: >
      A large fraction of the suite fails at once, and the failures that carry a message carry
      `MIST_UNDEFINED_NAMESPACE: The namespace 'Standard' could not be found`. Tests that never touch
      the standard library pass. A plain `dotnet build` followed by the same `dotnet test --no-build`
      returns the suite to green with no source change.
    cause: >
      NOT a product flake and not a test flake. The test binaries' copied content -- Standard/*.mist
      among it -- was absent or half-written when the run started, so the stdlib could not be loaded
      and every compilation failed at name resolution. Recorded because the SIGNATURE is worth
      recognising instantly: a mass failure whose message names the Standard namespace is a stale or
      mid-write output directory, not a semantic regression.
    evidence: >
      Seen once during the overload-resolution change. The immediately preceding run of the same
      command on the same source was green apart from one unrelated Storm flake, and the only edit in
      between was an append to this file, which no code or test reads. A rebuild plus rerun then gave
      5377/5377.

      The preceding command batch had issued `dotnet format --verify-no-changes` and
      `dotnet test --no-build` as PARALLEL tool calls. `dotnet format` loads and builds the solution
      to run its analyzers, so it can be rewriting output directories while a `--no-build` run is
      reading them. This is the second instance in this register of a test run racing a build; see the
      observer-error note under attribute-emission-round-trip-unreproduced.
      SECOND SIGHTING, 431 of 4647, during the generics substitution change. Same family, different
      trigger, and the trigger is worth knowing: the preceding command was
      `dotnet build Mist.slnx -v minimal | grep ... | head -5`. `head` closes the pipe once it has its
      five lines, which SIGPIPEs the upstream `dotnet build`, so the build can be killed PARTWAY
      THROUGH writing output directories. The "Build succeeded / 0 Warnings" read back from that
      command came off a truncated stream and did not mean the build had finished. A `--no-build` test
      run immediately after read half-written binaries.

      Cause NOT confirmed for this sighting, because the failure message was never captured -- the
      same mistake the fix note on attribute-emission-round-trip-unreproduced asks the next sighting
      to avoid. What IS established is that it was not the change under test: the experiment that
      produced it was reverted and rerun green (4647/4647), then REAPPLIED and rerun green
      (4647/4647), so the identical source both failed and passed. The family is inferred from the
      count and from the mid-write build, not read off a message.

      THIRD SIGHTING, 432 of 4677, during the user-defined conversions change, and it is the first to
      confirm the parallel-format trigger by having plainly done it: the failing
      `dotnet test Mist.slnx --no-build` was issued in the SAME parallel tool batch as a command whose
      third element was `dotnet format Mist.slnx --verify-no-changes`. The fix note below already said
      not to do that, so this sighting is evidence for the note rather than a new question.

      DURATION IS A USABLE SIGNAL, newly noted here. The failing run took 49s against 90-111s for the
      five green runs of the same command. A mass failure that finishes in HALF the time of a green run
      has collapsed early rather than failed 432 assertions on their merits, and the ratio is visible
      in the summary line without capturing anything.

      Message NOT captured, again, so the Standard-namespace signature is inferred from the count and
      the trigger rather than read. An attempt to recover it by rerunning with a grep for the failure
      detail returned nothing because that rerun was green -- which is the trap: once it goes green the
      evidence is gone, so the capture has to be on the failing run or not at all.

      NOT THE CHANGE UNDER TEST, with one caveat worth stating rather than glossing. Five subsequent
      runs were green on identical source: two `dotnet test Mist.slnx --no-build`, one single-project
      run, one slnx run deliberately issued alongside `dotnet format` in an attempt to reproduce, and
      one final full run. The caveat is that this working tree DOES refactor shared test
      infrastructure -- Test/Mist.Tests/Helpers/ProgramModelProbe.cs, extracted from
      OverloadSelectionTests -- so a test-infrastructure change cannot be dismissed on the usual
      "nothing I touched is referenced" grounds. It is ruled out on scale instead: only two classes
      derive from it, 42 tests between them, which cannot produce 432 failures.

      A SECOND CANDIDATE, 2026-09-14, and NOT an attribution. All three sightings fit the poisoned stdlib
      parse cache confirmed under mist-tests-garbled-lexemes-without-a-lock-warning: 430-432 failures, a
      run that finished in half the time, and the one captured message naming `Standard`. They equally
      fit the concurrent-build triggers recorded here, and only one message was ever read, so neither
      mechanism is established for them. What would tell them apart: a poisoned cache also yields
      "AST count (k) ... (k+32)" on v2 tests and names from other files' text on classic ones, where a
      Standard directory listed empty yields neither. Both routes are now closed -- the cache fix, and
      StdlibLoader no longer caching an empty listing -- so a recurrence under tools/test-ledger/run.sh
      would be a third mechanism, and its failures.txt would say which.
    fix: >
      Do not batch `dotnet format` in parallel with `dotnet test`. Chain them, or run the tests first.
      Do not pipe `dotnet build` into `head` either, or into anything else that closes the pipe early;
      it can kill the build mid-write and reports success while doing it. Pipe to a filter that drains
      its input, or let the build run unpiped.

      More generally, treat any mass failure naming the Standard namespace as a build-state problem
      and rebuild before reading it as a regression -- diagnosing 430 failures on the assumption they
      are real is a large amount of wasted work. Capture the message BEFORE rerunning; two of the
      three entries in this register are weaker than they need to be for want of that.

