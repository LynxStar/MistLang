  - id: index-and-range-expressions
    name: From-end indices and range expressions
    order: 123
    layer: ranges
    requires: [arrays-sized-index-length]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      NO GRAMMAR WORK WAS NEEDED and that was the first thing established. Mist.storm already carried
      `Range` (both bounds `Unary?`) and `FromEndExpression` (`CARET operand:Unary`), and the classic
      pipeline already consumed both. The `Range` tier sits BETWEEN Multiplicative and Unary, which is
      where C# ranks `..` too, so independently omittable bounds and a nested from-end bound are
      structural rather than something either binder arranges.

      Two v2 gaps, both in OperatorBinder. BindRange returned UnresolvedExpression for a real range
      under a comment calling itself a walking skeleton; it now builds a RangeExpression whose bounds
      are null where source omitted them. BindUnary had no FromEndExpression arm at all, so `^1` fell
      to the default and parked. Emission is TypeNameEmitter-free: BodyEmitter's existing
      IndexExpression arm already delegates its argument to EmitExpression, so a range arm plus
      `UnaryOperatorKind.FromEnd => "^"` was the whole backend change.

      A FROM-END INDEX IS TYPED Standard.Index, which is the one place this arm departs from every
      sibling in BindUnary -- Negate and LogicalNot answer with their operand's type. Standard.Index
      and Standard.Range already existed as `intrinsic public struct` in Source/Standard/Bootstrap and
      needed only WellKnownTypes entries; AmbientProviderTestHelper had been registering both as
      shells for some time, with a comment noting they were not in AllStandardTypes. They still are
      not, so that comment stands and no double registration was introduced.

      NO SAMPLE CAN OBSERVE THE INDEX TYPING, measured rather than assumed. Answering with the
      operand's type instead fails exactly two model tests -- AFromEndIndexIsAnIndex and
      AFromEndBoundNestsInsideARange -- and the AllFeaturesV2 baseline still passes, because `^1`
      emits identically either way and Roslyn types it correctly downstream. This is order 53's
      finding in miniature and the reason RangeAndIndexResolutionTests exists at all: the sample
      proves a match happened, only the model proves what was decided.

      EMISSION DELIBERATELY DIFFERS FROM CLASSIC. Classic renders a from-end operand with
      unconditional parentheses, so it emits `1..^(1)` (samples/RangesAndIndices/out/Program.cs).
      v2 emits `1..^1`, each bound going through EmitSubExpression at prefix precedence, because v2
      has a precedence mechanism and classic's belt-and-braces parens predate it. Invisible to
      acceptance either way: the AllFeaturesV2 baseline compares program stdout, not generated C#.
    unlocks: []
    analysis_phase_tasks:
      - Check that an index argument is ADMISSIBLE for its receiver. Array declares
        `this[ArrayBounds index]` where ArrayBounds refines int, and Standard.Index satisfies no such
        refinement, so nothing today rejects `numbers[^1]` on those grounds -- the indexer's RETURN
        type is read and its parameter is not consulted. Judging a finished model, so deferred by the
        same rule as order 97.

  - id: slicing-and-sliceable-classification
    name: Slicing, with receiver indexability classification
    order: 124
    layer: ranges
    requires: [index-and-range-expressions]
    v2_status: partial
    verified_by: v2-semantics
    evidence: >
      THE GAP WAS NARROWER THAN THE SPEC SENTENCE READS. `numbers[^1]` already typed correctly before
      any of this work: PostfixBinder.ResolveIndexerType read IndexersList[0]'s return type and
      Array declares `intrinsic public TValue this[ArrayBounds index]`, so an index access substituted
      to the element type whatever the argument was. The actual defect was that `numbers[1..3]` typed
      as int as well, the argument being ignored entirely.

      So the change is that the ARGUMENT asks the question. ResolveIndexerType is replaced by
      ResolveElementAccessType(receiver, argument, ...), and the classification moved to a new
      Construction/Binding/Indexability.cs so PatternBinder can reach it too -- order 125 needs the
      element type and the slice type of one receiver at once, which is what makes its dependency on
      this order concrete rather than notional.

      A SLICE OF AN ARRAY IS AN ARRAY OF UNKNOWN LENGTH, built through ScopeResolver.ConstructArray
      with a null length rather than assembled by hand, that being the single place an array type is
      built. `numbers[1..3]` is statically 2 long but `numbers[a..b]` is not, so no length is claimed.
      TypeNameEmitter already maps Array<T, L> to `T[]`, so emission needed no change at all, and
      `numbers[1..3][^1]` types as int because the slice is itself an ordinary indexable array -- the
      sample exercises exactly that through `trimmed[^1]`.

      ONLY THE RANGE PATH REPORTS. An index that resolves nothing keeps answering ErrorType silently
      as it always did, because a missing indexer is a member that might simply not be declared; a
      range that resolves nothing has no C# to write, so it reports MIST_PM_RECEIVER_NOT_SLICEABLE
      rather than reaching emission as a slice of an error type. Both halves are asserted, the second
      by a test that the index path stays quiet.

      MUTATION-CHECKED, and this one IS sample-visible. Making IsRange never match fails four model
      tests AND the AllFeaturesV2 baseline, because `mid.Length` does not resolve on an int. So unlike
      order 123's index typing, the index-versus-range branch is guarded from both directions.
    tasks:
      - Classify SPAN as sliceable. Span<T> and ReadOnlySpan<T> declare `this[SpanBounds index]` so
