  - id: clr-byref-parameter-projection
    name: CLR by-reference parameter projection
    order: 128
    layer: clr-interop
    requires: [clr-assembly-type-projection]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      Mist has neither an out nor an in modifier, so all three CLR by-ref kinds collapse to
      one Mist ref kind and the calling convention must be retained per parameter and
      reconstructed at emission. Direction matters -- an out parameter means the callee
      assigns, so the caller's prior value is not live, even though the syntax matches ref.

      THE OUT DIRECTION IS DELIVERED and ClrRefInterop is banked, byte-identical to classic.
      ArgumentKeywords.For reads the keyword off the parameter an argument fills, which
      EmitArguments already held -- order 132 threaded the callee through and nothing read it for
      anything but a bare `ref`. NO MODEL CHANGE WAS NEEDED: AttributeProjector already synthesizes
      an [Out] AttributeData from the CLR Out flag, described in its own comment as "the one form
      the modifier cannot distinguish from a plain ref", and nothing had ever read it. Proven at the
      emit site rather than inferred -- an instrumented clone printed
      `attrs=[MaybeNullWhenAttribute|OutAttribute]` for TryGetValue's second argument and `attrs=[]`
      for Interlocked's and for the Mist-declared helper's, and ablating the synthesis made the
      marker vanish and the emitter fall back to `ref`.

      BOTH GUARDS ON THE OUT ARM ARE LOAD-BEARING, and neither is defensive programming; each was
      measured against the .NET 10 reference pack. NOT-READONLY excludes `[In, Out] ref`, which is
      mutable ref in C# and sets the Out flag anyway -- 43 such parameters in the WindowsDesktop
      pack, where `out` is CS1620 and v2's existing `ref` is already right. BY-REF excludes a
      by-VALUE parameter carrying [Out], a marshalling annotation that says nothing about calling
      convention -- 9 in that pack, where `out` is CS1615. A two-branch cascade on the marker alone
      would have regressed both.

      THE READONLY DIRECTION IS DELIVERED TOO, and it needed the model change the emission half did
      not. ParameterModifier now carries a ByRefDirection, decided where the evidence is -- by the
      projector reading CLR metadata, or the builder reading Mist source -- and ArgumentKeywords is
      one arm per direction with no inference left in it.

      THE In METADATA FLAG IS NOT READONLY-NESS, which is the whole reason a fourth field was needed
      rather than a cleverer rule over the existing three. That flag is set by a genuine `in`, by
      `ref readonly`, and equally by `[In] ref` and `[In, Out] ref` -- interop annotations on a
      parameter that stays an ordinary mutable ref, of which the WindowsDesktop pack declares 43.
      Reading it as readonly marked every one of them readonly. Only a readonly MARKER settles it:
      IsReadOnly for `in`, RequiresLocation for `ref readonly`, and neither on a mutable ref.

      THE OLD OUT ARM WAS ACCIDENTALLY RIGHT. It excluded `[In, Out] ref` by testing NOT-IsReadonly,
      which worked only because the misclassification above set IsReadonly on it. Fixing the
      classification would have broken the out arm had the direction not replaced both.

      This closes a defect rather than adding a nicety: passing `ref` to a readonly location is
      CS8329, a hard error, and a fifteen-line program had classic running what v2 refused. It now
      emits `Sink(in v)` and matches.
    untested:
