  - id: clr-nullable-projection
    name: Projection of CLR nullability into optionals
    order: 130
    layer: clr-interop
    requires: [clr-assembly-type-projection, optional-union-representation]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      A CLR reference-type return projects to an optional, which then has to flow into
      interpolation and member access, forcing a decision about whether narrowing is required.

      DELIVERED IN BOTH PIPELINES, and it was a soundness hole rather than a nicety. Mist has no
      null; a reference the CLR hands back can be one anyway, and until 715e38c1/463a4445 it was
      typed plain T -- a naked null inside a language whose optional discipline assumes there is
      no such thing. Returns, properties, fields and indexer results are now `T | void`.

      THE RULE IS DIRECTIONAL, and the direction is the whole design. Inbound is wrapped; outbound
      parameters are NOT, because Mist has no null to send, so an outbound reference is non-null by
      construction and a union there only gives overload resolution more candidates to be ambiguous
      between. NRT annotations are ignored: an annotation is advisory, and a lying one is still a
      naked null.

      CLASSIC HAD IT EXACTLY INVERTED, which is why this was recorded `missing` against a pipeline
      that appeared to have it. ProjectNullableType already implemented the intended rule, was
      documented for "parameter type, return type, property type, field type", and cited
      Requirements 14.1/14.2/14.5/14.6 -- with ONE call site, for parameters, feeding emitter
      metadata only. The union existed in the one direction carrying no safety content and was
      absent from every direction a null can arrive from.

      THE GENERIC HALF NEEDED A SECOND MECHANISM (5b45d790, a1c66602). A parameter cannot be
      wrapped at projection -- that would make List<int>'s element optional too -- so the decision
      moves to substitution, while "the CLR could have put a null here" is knowable only at
      projection. Classic carries that fact on a marked TypeParameterType; v2 carries it on
      MemberModifiers.IsClrProjected, because v2 keys substitutions by REFERENCE and mutates
      TypeParameter.Domain later, so a marked copy would miss its binding.

      A Mist-declared generic is never wrapped, by construction rather than by heuristic.
      samples/ArityOverloads declares `Wrapper<T> { public T Value; }` and is banked.
    untested:
      - A generic parameter substituting to another OPEN parameter stays open, so the hole survives
        inside a Mist generic body over a CLR generic. Named and chosen, not measured against a
        sample.
      - CLR extension method returns go through ProjectMemberType and are not marked.
    unlocks: [AssemblyTypeProvider]

