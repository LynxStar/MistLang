  - id: declaration-shape-checks
    name: Refusals decidable from a declaration alone
    order: 6
    subsystem: typechecker
    requires: [analyzer-contract]
    status: done
    from: >
      orders 39, 42, 48, 50, 56, 57, 66, 84, 86, 87, 88 -- 13 tasks
    evidence: >
      THE CHEAPEST CLUSTER AND THE ONE LEAST LIKE THE REST: no expression is walked for its value, no
      flow is followed, and only the constraint rule asks the conversion classification. Accessibility
      permission and exposure, sealed on a base, a newtype source or an alias, an enum base that is not
      readonly, two variants sharing a value, a default block naming something that is not a field, the
      Mist-only generic constraints that erase into nothing, a missing constructor on a closing type, and
      `default` of a type that has none. Placed after the assignability spine because its value is
      breadth.

      CLASSIC'S VERDICTS ARE THE CONTRACT, measured on a probe whose symbol-stage shapes had to be split
      from its type-checker shapes, since classic's symbol errors gate its type checker and v2's binder
      errors gate Stage 5 the same way. Classic refuses private and protected access from outside the
      domain (TC_0170/0171), every inconsistent-accessibility shape -- return, parameter, field and
      property type, base class (TC_0173/0174) -- deriving from a sealed type (0177), a newtype over one
      (0178), `sealed` on an alias (0179), a non-readonly enum base and union constituent (0102/0103),
      duplicate names (SB_0061/0063), duplicate variant values (SB_0085), and `default` of a type with
      no default (DEFAULT_NOT_SUPPORTED, printed with its placeholder unfilled). Every one is refused by v2
      at the same construct. Classic admits `readonly` on a class method, an unknown default-block
      entry, and every constraint violation at a field initializer while refusing the same violation in a
      method body (TC_0077, CONSTRAINT_0015) -- so the constraint rule judges every closing, which is
      classic's verdict at more positions, and the unknown default entry is refused because Roslyn refuses
      the factory it emits.

      FOUR RULES OVER THE MODEL, all reporting as one register order. AccessibilityAnalyzer asks the two
      questions of the full-accessibility-model spec: whether a use sits inside the member's domain -- the
      declaring type for private, that type or a derivation for protected, the same assembly for internal,
      a nested type counting as inside its enclosing one -- and whether a declaration exposes a type less
      accessible than itself, with effective accessibility the narrowest along the nesting and, for
      anything structural, the narrowest of what it is built from. Internal and protected are
      incomparable, as C# has them. The abstract bases in a base list are EXEMPT, whatever Requirement
      6.2 of the spec says: C# lets a public class implement an internal interface, samples/Variadics does
      exactly that with an unmodified `abstract ICountable`, and classic runs it. DeclarationShapeAnalyzer
      holds the sealed, enum and default-block rules. ConstraintAnalyzer judges every type argument the
      source closes against every constraint of its parameter: a type constraint by the classifier, class
      and struct by the definition's kind, readonly, mutable and owned by the declared modifiers, the
      substructural three by discipline where LINEAR SATISFIES AFFINE AND RELEVANT -- exactly once is both
      at most once and at least once, and samples/SubstructuralFieldDiscipline closes both with a linear
      token -- a pack parameter elementwise over the lifted pack value, `new(T...)` by a public
      constructor of that exact signature read through the argument's own substitution, and `default` by
      Defaultability. DefaultabilityAnalyzer refuses a `default` of a class or struct the synthesis
      cannot build, against the Mist source, where the backend used to name the expression unsupported.

      WHAT THE MODEL GAINED. Method, Field, Property and Indexer carry the type that declares them and
      the node they were written at, set by the source builders and, for the declaring type, the ambient
      projectors; an exposure rule has nowhere else to report. MemberAccessExpression records what its
      name resolved to, so the access rule never resolves a second time. ConstraintClosureRegistry
      records every closing, not only the parameterized constructor ones emission needed a witness for.
      A duplicate type is reported at its declaration rather than at no location. Defaultability moved
      from the backend's synthesis into the model, since what has a default is a language rule the
      backend happened to need first; the synthesis now consults it. Each body root carries the type it
      sits in and the assembly it came from, and AnalysisContext answers both per node, because a body
      reaches its type only through a scope chain that is the binder's.

      THE SWEEP FOUND THREE RULE ERRORS ON THE FIRST RUN, twelve findings on working programs: internal
      access compared against the orchestrator's assembly rather than the accessing code's, which
      refused every internal read inside a referenced project; the substructural lattice taken as exact
