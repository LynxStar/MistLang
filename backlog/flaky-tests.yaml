  - id: attribute-emission-round-trip-unreproduced
    test: Mist.Tests.Backend.AttributeEmissionRoundTripPropertyTests.AttributeEmission_PreservesStructure_RoundTrip
    file: Test/Mist.Tests/Backend/AttributeEmissionRoundTripPropertyTests.cs
    discovered: 2026-07-26
    status: fixed
    symptom: >
      Failed twice during full-solution runs and passed on immediate rerun. Not reproduced since,
      across 19 deliberate attempts.
    cause: >
      A FALSE POSITIVE IN THE TEST'S OWN VERIFIER, confirmed 2026-09-14. The emitter was right. Check 3
      of VerifyEmittedAttributes located each of the first two lists by the first output line
      CONTAINING its first attribute. When the second list is a lone attribute whose text is a
      substring of the first list's -- `[Xunit.Fact]` after `[Xunit.Fact<string>("reason", ...)]` -- both
      searches land on the first line, and the check reports the lists merged. The generator drew that
      shape once in 5000 measured scenarios -- on that one hit, something like one run in fifty of a
      100-scenario test, from a fresh seed each time: never on demand, and indifferent to load.
    evidence: >
      DISPROVEN -- the original entry blamed the generator for drawing the same named argument twice,
      producing invalid C#. Three findings kill that theory. The test never invokes Roslyn: it
      compiles with `EmitToDisk: false` and filters to front-end diagnostics only, so invalid C# is
      never compiled. Both the Mist source and the expected C# are built from the same scenario
      record, so a duplicate appears identically on both sides of the comparison. And duplicates are
      generated constantly rather than rarely -- three named arguments drawn from a five-name pool
      collide about half the time, so essentially every run of 100 scenarios contains many, yet 14
      consecutive isolated runs (~1400 scenarios) all passed.

      REPRODUCTION ATTEMPTS, all green: 14 runs of the test alone, 3 runs of the Mist.Tests project,
      2 runs of the full solution. Both original failures were under `dotnet test Mist.slnx`, which
      runs three test projects concurrently, so the full-solution runs matched the original
      conditions and still did not fail.

      NOT YET RULED OUT, in rough order of suspicion. This test exercises the CLASSIC pipeline
      (SemanticModelBuilder, CSharpTranspilerBackend via CSharpEmitter), not ProgramModel, so
      whatever it is lives there or in shared infrastructure. Its own state looks clean: `outputDir`
      is per-instance with a GUID, and `SharedDriver` is static but private to the class. Candidates
      are therefore process-wide state reachable from the classic pipeline under concurrent load --
      assembly loading and framework reference resolution being the obvious ones.

      OBSERVER ERROR IS ALSO POSSIBLE. Both sightings were during active development, immediately
      after a rebuild, and this session contains one confirmed instance of a test run racing an
      unfinished build (`dotnet test --no-build` batched in parallel with `dotnet build
      --no-incremental`, which made every test project report its assembly as an invalid argument).
      A test run against half-written binaries could produce an unrelated failure.

      REPRODUCED BY FIXED INPUT, 2026-09-14, as the 2026-09-09 recurrence proposed. The recorded scenario
      `[Xunit.Fact<string>("reason", 279, Order = "reason")] [Xunit.Fact] on Class`, compiled through the
      test's own CompileAndGetOutput, emitted the two lists on SEPARATE lines, and the test's own
      VerifyEmittedAttributes still returned "Separate attribute lists were merged onto one line". The
      merge the entry could not find in AttributeEmitter does not exist.

      MEASURED BY VOLUME through the test's generator, compiler call and verifier: 1 failure in 5000
      drawn scenarios on the old verifier, the same shape (`[Serializable(601, 689, ...)] [Serializable]
      on Method`); 0 in 20000 on the new one. The new verifier was also fed a genuinely merged output
      and a single list split across two lines, and rejected both.
    fix: >
      APPLIED 2026-09-14. VerifyEmittedAttributes requires each expected list to be an entire output
      line by itself, which proves grouping and separation at once and cannot mistake one attribute for
      a prefix of another. The test stays a [Fact]: its failure message already carries the complete
      scenario and Mist source, which is what replaying it needs.

      Earlier, and unrelated to the cause: the generator no longer draws duplicate named arguments.
    recurrences:
      - date: 2026-09-08
        detail: >
          Seen again in a full-solution `--no-build` run (1 of 5119), green on a filtered rerun of
          the same binaries with nothing edited. The working tree held extension-lookup and
          well-known-type-map changes, neither of which touches attribute emission, and the test
          file was unmodified.
      - date: 2026-09-09
        detail: >
          THE MESSAGE THIS ENTRY HAS ASKED FOR THREE TIMES, captured before any rerun. 1 of 5170 in a
          run that BUILT FIRST and tested with --no-build, so the stdlib-copy race that explains the
          entry above is excluded here.

              Property failed: 1/100 scenarios failed.
              Scenario 61 verification failed: Separate attribute lists were merged onto one line:
                '[Xunit.Fact<string>("reason", 279, Order = "reason")]'
              Scenario: [Xunit.Fact<string>("reason", 279, Order = "reason")] [Xunit.Fact] on Class

          IT FAILED VERIFICATION, NOT COMPILATION, which is the fork this entry named as the missing
          evidence. And it points at a SHAPE rather than at load: the scenario carries TWO separate
          attribute lists on one declaration, which is what the assertion is about. That reframes the
          whole entry -- an input the generator draws rarely explains an intermittent failure that no
          amount of isolated rerunning reproduces, where load does not.

          NOT DIAGNOSED, deliberately. AttributeEmitter.EmitLines writes one line per attribute and
          merges nothing, so where the merge happens is not yet known and guessing at it is what the
          cause field forbids. The next step is to run the property with the scenario above as a fixed
          input rather than a drawn one, which now costs nothing since the scenario is written down.

          Found while landing the drop arc, which touches no attribute code.

  - id: storm-memo-propagation-property
    test: Storm.SourceGenerator.Tests.StormMemoPropagationPropertyTests.P3_MemoPropagation_RuleIR_IsMemo_MatchesSource
    file: Test/Storm.SourceGenerator.Tests/StormMemoPropagationPropertyTests.cs
    discovered: 2026-07-30
    status: fixed
    symptom: >
      Failed once in a full-solution test run and passed on immediate isolated rerun.
    cause: >
      THE GENERATOR DREW INVALID GRAMMARS, confirmed 2026-09-14 by replay. GenRuleName draws an uppercase
      letter and 1-8 lowercase ones, so it can draw `Tok`, the name of the token every generated grammar
      declares. `rule Tok = Tok;` beside `token Tok = [a-z]+;` is a duplicate declaration: StormGrammar
      reports STORM0003 and the generator stops there. The test never checked the grammar built. It
      lowered the failed grammar anyway -- lowering reports success and simply has no rule `Tok` -- and
      failed on "Rule 'Tok' not found in lowered grammar IR". Storm was right throughout. About one draw
      in 17000, fresh seed every run, so roughly one run in eighty: indifferent to load.
    evidence: >
      Failed during `dotnet test Mist.slnx --no-build` (all three test projects concurrent).
      Immediate rerun with --filter passed. The change being tested (generic object creation
      binding, TypeEmitter, ConstructorEmitter, CSharpEmitterV2) touches nothing in
      Storm.SourceGenerator. The test file was unmodified in the working tree.

      SECOND SIGHTING 2026-07-31, SAME TEST UNCONFIRMED. One of 664 failed in
      Storm.SourceGenerator.Tests under `dotnet test Mist.slnx --no-build`; the project passed
      664/664 on immediate isolated rerun and the full solution passed 5324/5324 on the next run.
      Same project, same trigger, same one-of-664 shape as above, but recorded here as UNCONFIRMED
      because the failing test's name was never captured -- the run was filtered to summary lines
      (`grep -E 'Passed:|Failed:'`), which discards the name along with the message. It may have
      been a different test in this project entirely.

      That sighting cannot implicate the change it ran against either way: the working tree held one
      edit, to backlog/emitter-v2-capability-progression.yaml, which is a document no code or test
      reads.

      PROCESS NOTE: redirect the run to a file and grep the file, rather than piping the run through
      a summary filter. Two of the three sightings across this register lost their failure message
      to exactly that.

      SIGHTING 2026-09-13, NAME CAPTURED, MESSAGE AND SEED NOT. One of 664 failed in
      Storm.SourceGenerator.Tests under `dotnet test Mist.slnx --no-build`, the run piped through
      `grep -E '^\s+Failed |Passed!|Failed!'` -- the pattern kept the name and discarded the message
      again, so the trx advice under storm-trait-field-type-resolution-property still stands. Three
      isolated reruns of the test with --filter and no edit between passed, 25, 19 and 19 ms. The
      working tree held the newtype clone (ProgramModel construction, ProgramAnalysis's runner and
      rules, one DiagnosticBag method, Test/Mist.Tests); `git status` showed nothing under
      Source/Storm.SourceGenerator or Test/Storm.SourceGenerator.Tests. During the run the Mist CLI
      was invoked against a scratch directory outside samples/, and source files were edited without
      a build.

      REPRODUCED BY REPLAY, 2026-09-14. The test was converted from a [Fact] over Gen.Sample(200) to
      [Property(MaxTest = 200)] over the same generator, so FsCheck prints the seed and the drawn input,
      and a scratch harness ran it through Check.One for five rounds of 200000 draws, each on a fresh
      seed. All five rounds failed, after 23578, 7952, 10494, 19434 and 23138 draws, every one on a
      drawn rule named `Tok`. The recorded grammar built as a fixed input gave grammar.Succeeded=False
      with "STORM0003 Duplicate declaration name 'Tok'", and lowering it anyway gave Succeeded=True with
      rules [Ohcwzl, Atlcrbbx, Xckexzv]. StormIncrementalGenerator returns on a failed grammar before it
      lowers, so no user grammar reaches that path.
    fix: >
      APPLIED 2026-09-14. GenRuleName excludes the fixed token's name, and LowerGrammar asserts the grammar
      built before lowering it, so a future invalid draw fails naming STORM0003 rather than a missing
      rule. The test is a [Property], so a failure prints its replay seed and input.
  - id: sample-runner-tests-race-concurrent-sample-runs
    test: Mist.Tests.Integration.SamplesCompileAndMatchBaselineTest.EnumReadonlyRestriction_CompilesAndProducesExpectedOutput
    file: Test/Mist.Tests/Integration/SamplesCompileAndMatchBaselineTest.cs
    discovered: 2026-07-31
    status: fixed
    symptom: >
      Failed once in a full-solution run, then passed 19/19 under --filter with no intervening
      edit, and the sample it drives ran clean from the shell with no diagnostics.
    cause: >
      NOT a product flake. Every test in this class spawns the Mist CLI against a directory under
      samples/, and the CLI writes its emitted C# into that sample's own out/ directory. Anything
      else driving the same sample concurrently writes to the same place. In this instance the test
      suite and a full 78-sample sweep were launched as PARALLEL tool calls, so both were running
      the CLI over samples/*/out/ at the same time and collided.
    evidence: >
      The failing test asserts on stdout from samples/EnumReadonlyRestriction. That sample declares
      no properties or indexers, so the change under test -- accessor body binding, PropertyEmitter,
      AccessorEmitter, the TypeEmitter walk -- has no path to it. Running the sample directly on
      classic gave a clean exit and the expected sections. The test file was unmodified. The full
      suite then passed 5324/5324 twice, both times run on its own rather than beside a sweep.

      THE FIX, MEASURED 2026-09-14. Before touching the test, the four CLI invocations the class makes
      were run by hand with --output and --bin pointed at a scratch directory outside the repo:
      AllFeatures and EnumReadonlyRestriction on classic, AllFeaturesV2 on experimental, and Testing
      under `mist test` on experimental. All four exited 0, and `find . -newer <marker>` over the
      whole worktree (excluding .git) was empty, as was the diff of `git status --ignored samples` --
      so nothing reached a sample's out/, bin/ or obj/, nor any of the samples AllFeatures and
      AllFeaturesV2 reference, which the driver only reads. `mist test`'s obj/ landed under the
      --output directory. Both AllFeatures stdouts matched their baselines byte for byte.

      After the change the class passed 5/5 through the ledger, and a poll of the temp path during a
      one-test run saw the per-test directory holding bin/ and out/ and then saw it removed. The full
      solution then passed 6883/6883 through the ledger (Mist.Tests 6151, Storm 664, CLI 68), with
      no path under samples/ newer than a marker set before it and no MistSamples_ directory left in
      the temp path. That also confirms nothing else in the suite writes under samples/.
    fix: >
      APPLIED 2026-09-14. Each SamplesCompileAndMatchBaselineTest instance owns a MistSamples_<guid>
      directory under the system temp path, passes it to the CLI as --output and --bin, points the
