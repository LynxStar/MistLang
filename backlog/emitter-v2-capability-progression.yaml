      what the sample claims to prove. It is the standing example of the baseline's blind spot, so
      the guard is RefStructEmissionTests, asserting on emitted TEXT, and no sample can stand in.

      SPELLED AFTER `readonly` AND BEFORE THE KEYWORD, which C# fixes and Mist's own modifier list
      leaves free. `readonly ref struct` is accepted and `ref readonly struct` is not.

      GUARDED ON StructType RATHER THAN ON THE FLAG. Mist PARSES `ref class` -- classic reports
      MIST2001 for it, v2 binds it silently -- so the flag genuinely reaches a class, and spelling it
      from there would emit `ref class`, which C# does not have. The guard is load-bearing rather
      than defensive, and the test that pins it declares a `ref class` to prove so.

      The layout attribute every struct carries is legal on a ByRefLike one; Roslyn accepts the pair
      on RefStructs, which is worth knowing because the attribute precedes the declaration and would
      otherwise refuse the whole type.
    analysis_phase_tasks:
      - >
        Report `ref` on a class, which classic reports as MIST2001, "The 'ref' modifier is only valid
        on struct declarations". v2 declines to emit it and stays silent.
      - >
        Propagate ref-struct-ness into legality checks at every position used -- field, parameter,
        return, foreach and local. A ref struct FIELD is the one with two answers: legal inside
        another ref struct, which RefStructs.NestedRefStruct exercises and Roslyn accepts, and CS8345
