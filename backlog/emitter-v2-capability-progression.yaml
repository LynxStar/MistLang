  - id: union-types-and-carriers
    name: Union type canonicalization and carrier generation
    order: 76
    layer: unions-and-unknown
    requires: [class-declaration]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      UnionType is structural and canonical BY CONSTRUCTION: the interner flattens nested
      unions, drops duplicates, collapses a single survivor to the bare type, and sorts
      constituents by qualified name, so spelling order never reaches identity and
      GetOrCreateUnionType returns IMistType rather than UnionType. The union's qualified
      name is built from constituent QUALIFIED names because ConversionRelation compares by
      that name, and two unions over same-named types from different namespaces must not
      collide. TypeSubstitution shares the normalization on its interner-less path.

      A general union emits one tag-and-payload carrier struct program-wide (__Unions.g.cs),
      collected from the INTERNER rather than a surface walk, since every union a program
      mentions passes through it exactly once -- locals, signatures and casts alike. The
      shape mirrors classic (byte tag, boxed payload, Is*/As* discriminators, per-constituent
      implicit conversions), and UnionCarrierNames is the one authority on the mangled name,
      so the generator and every use-site spelling agree by construction.

      Verified by twelve model-level tests in UnionTypeResolutionTests (identity, flattening,
      collapse, the C# spelling split) and a scratch probe running byte-identical to classic.
      NO BANKED SAMPLE declares a general union yet -- TypeUnions waits on pattern narrowing
      at order 98 -- so the carrier generator is absent from AllFeaturesV2's own output.

      AN OPEN UNION HAS NO CARRIER, 2026-09-11. `type Result<TError> = int | TError` interned the open
      union and the carrier file declared a struct naming `TError` unbound. Only closed substitutions
      are runtime types, and each is interned and carried on its own, so a union with a type parameter
      anywhere in it is skipped. A union over an open parameter inside a generic body has no carrier
      either and is a gap. Verified by the type-unions generics snippet.

      THE OPEN UNION IS EMITTED PER INSTANTIATION, DONE 2026-09-19 -- and no carrier could have done
      it, which was measured before it was built. Mist sorts a union and merges duplicates AFTER
      substitution: `T | R` in `Pair<T, R>` is `int | string` at both `<int, string>` and
      `<string, int>`, and plain `int` at `<int, int>`. A C# generic fills its parameters into one
      declaration by position, so any carrier written once in terms of T and R -- a generic
      `Union<T, R>` included -- disagrees with two of those three; a conversion can bridge a lone value
      but not one nested in another type, a `Cell<...>` being an object that converting would copy.
      A carrier written for the optional alone, `MistOptional<T>`, was built and measured the same way:
      it fixed every top-level position and broke `Cell<K?>`, `func<K?>` and a returned `(K?, string)`
      at a reference instantiation, which the bare lowering had compiled by accident. It is not in the
      tree.

      Lowering/UnionSpecialization decides which declarations are emitted once per instantiation: a
      TYPE or generic METHOD whose own type parameters appear in a union no C# generic can spell -- any
      open general union, or an optional over a parameter the `struct` or `class` keyword does not
      constrain (those coincide with every closed spelling already, order 78) -- and, to a fixpoint,
      any declaration that names one of those over its own parameters. Instances are read off the
      program as the variadic widths are: closed constructions from the interner, method type
      arguments from Model/GenericCallRegistry (recorded where PostfixBinder records the variadic
      widths), and whatever substituting those through an instance reaches, each instance's closed
      unions INTERNED so the carrier file holds them. An instance is emitted under its own name
      (`Pair__Standard_String__Standard_Int32`), inside a TypeNameEmitter substitution scope that now
      composes, innermost first, so a generic method of a specialized type binds both. The emission
      decisions that read a type -- a union pattern's accessor, an optional read or default, `as` --
      read it closed. A union that an instance collapses to a single type is boxed as a pattern's
      scrutinee, C# otherwise refusing the generic's catch-all arm as unreachable (CS8510). An
      instantiation that keeps needing a larger one of itself stops at 256 per declaration and is
      MIST_BE_UNBOUNDED_SPECIALIZATION.

      samples/OpenUnions banks it V2-ONLY: both orders, the merged instance, a nested
      `Cell<T | R>`, a `switch` over the union, an unconstrained `K?` through every position including
      absence, `Cell<K?>`, `func<K?>` and `(K?, string)` at `int` and `string`, and generic methods
      called directly, from another generic method and from a generic class. It does not compile with
      specialization disabled. UnionSpecializationTests pins the decisions and the spellings; five
      mutations, each caught -- the kind constraint ignored, optionals never specialized, the fixpoint
      removed, substituted instances never admitted, the unbounded report dropped. Every banked sample
