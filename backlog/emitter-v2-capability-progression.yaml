               this-expression, implicit-instance-field-access, object-creation,
               constructor-chain-this, struct-declaration, base-type-list,
               base-member-lookup, constructor-chain-base,
               constructor-chain-args-referencing-parameters, accessibility-full-model,
               sealed-modifier, struct-inheritance]
    untested:
      - Every accessibility level is exercised only on its permissive path. Every access in
        the sample is legal under "everything is public". A compiler that parsed, recorded
        and emitted the modifiers and never checked them passes the whole sample.
      - protected is indistinguishable from internal or public here. Both protected reads are
        from a derived type in the same compilation.
      - internal is indistinguishable from public -- single compilation, assembly boundary
        never crossed.
      - sealed is semantically inert; nothing derives from either sealed type. Frozen's claim
        to prove the sealed-protected warning does not fire is proof of an absence, which
        passes trivially if that warning was never implemented.
      - Struct inheritance runs with no value-semantics interaction. No struct assignment,
        copy, by-value pass or field storage. The hard question raised by inheritable structs
        -- what copying a derived struct through a base-typed slot means -- is untouched.
      - Both derived types have no fields of their own and empty constructor bodies, so
        derived-field initialization interleaved with base initialization is untested.
      - The one base-typed parameter reads a field declared on the base, so static binding
        gives the same answer. It tests assignability only.

  - name: CastOperators
