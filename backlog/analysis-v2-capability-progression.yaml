      from-end markers cancel the receiver length. Definitely negative offsets, offsets beyond every
      possible receiver length, and definitely reversed endpoints report INDEX_OUT_OF_BOUNDS. Uncertain
      endpoints retain runtime slicing semantics. Refused-slice facts prevent a second complaint through
      copies and fields of this instance, while a valid replacement or a join with a valid path clears
      that suppression. Intrinsic
      sizing is gated on a supported receiver, so an arbitrary Range indexer supplies no slice proof.

      Erased dependent slots recover UnknownValueType over the parameter's declared runtime domain in
      TypeSubstitution. Span and ReadOnlySpan Length therefore retain ZeroOrPositiveInt, and ordinary
      integer assignment, operators and the existing bounds prover can read them. The receiver's erased
      shape remains erased, lifted lengths remain lifted and no size is invented. Ordinary generic
      unknown stays the top type. Mirrored symbolic guards now use the same comparison reasoning as
      direct guards, including Length > i and negated comparisons.

      The existing flow also carries optional exact finite numeric and decoded string facts. Supported
      real comparisons, string equality and negation, and literal regex full matching can decide a
      constant, copied local or equal join; invalidation forgets the fact. An exact literal verdict
      takes precedence over a retained refinement type, and unary transformations cannot reuse their
      operand's refinement promise, so negating a Positive value does not prove another Positive.
      Integral-to-real conversion follows the emitted representation, including float-to-double precision and unsigned literal
      truncation. Regex evaluation uses the emitter's \A(?:pattern)\z wrapping, so a final newline the
      pattern does not consume is refused as it is at run time (exact since 2026-09-28; see the
      2026-09-28 paragraph below), with a 100 ms evaluation budget per match. Unsupported options and predicate compositions remain
      UNPROVEN. String slice lengths use decoded runtime characters rather than source escape spelling.

