        WATCH THE MESSAGE WHEN PORTING: classic's MIST_TC_0077 prints its template with the
        placeholders still in it rather than the type argument and parameter names, so its format
        arguments are never passed. MIST_LEX_ERROR has the same defect, which makes it a pattern in
