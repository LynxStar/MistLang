      emitter had no such path, so the exclusion dropped it entirely. The dotted registration is also
      why the failure was CS0426 against generated C# rather than a Mist diagnostic: a reference
      resolved and emitted a nesting path that nothing declared.

      EMITTED LAST INSIDE THE PARENT BODY, by recursion, so depth costs nothing -- four levels
      measured. A nested type is a declaration that happens to live there rather than part of what the
      type IS, so members come first; C# requires no order.

      THE SPURIOUS READONLY COULD NOT HAPPEN, which is a property of v2's shape rather than work done.
      Classic carries an ambient insideStruct flag that EmitClassDeclaration never clears, so a class
      nested in a struct gets readonly on its methods and C# refuses it. v2 computes inStruct as a
      local per type, so the recursive call recomputes it. Measured: a class nested in a struct WITH
      methods emits clean, which is the shape NestedInStruct.mist was written methodless to avoid.

      TYPE PARAMETERS THROUGH THE SCOPE CHAIN WERE ALREADY THERE, and this is now measured rather than
      assumed. TypeBuilder passes the enclosing type's own scope as the nested type's parent scope, so
      the outer type's parameters are simply in scope -- a nested class holding a field of the outer's
      T resolves it to that parameter with nothing redeclared.

      THE ONE REAL RESOLUTION BUG WAS QUALIFICATION LOSING TYPE-REFERENCE-NESS. PostfixBinder folded a
      resolved nested type into a MemberAccessExpression that merely happened to be TYPED as that type,
      so the next segment asked it for an INSTANCE member and a static one could not be found. That is
      the recorded MIST_PM_UNRESOLVED_MEMBER exactly, reproduced and then fixed by returning a type
      reference, which chains to any depth. BindQualifiedName already did this for a namespace
      receiver; the type receiver did not.

      NARROWED TO DECLARED TYPES, AND THE NARROWING IS LOAD-BEARING. Returning a type reference for
      EVERY resolved type broke four banked samples: `Length` on an array resolves to the second TYPE
      PARAMETER of Standard.Array<ElementType, Length>, and it reaches C# only by staying a member
      access that emits `numbers.Length` for Roslyn to resolve. TypeSlot derives from TypeParameter and
      is excluded with it. Caught by the AllFeaturesV2 baseline test, and now pinned by its own test so
      the next person does not re-widen it.

      A REFERENCE UNDER A GENERIC ENCLOSING TYPE NEEDED ITS OWN FIX. FullyQualifiedName records a
      generic segment under the arity marker it is registered with, so a nested reference emitted
      `Box<>.Wrapper`, which is not C# at all. TypeNameEmitter now builds the path segment by segment
      and respells a generic segment with its own PARAMETER names -- the only answer a definition can
      give, and the right one everywhere a definition can be named, which is inside its own body where
      those parameters are in scope. Only nested types change; a top-level generic still emits bare.

      SEVEN LIVE DEFECTS IN CLASSIC, all measured, none reproduced here. Classic cannot resolve a
      DOTTED nested type in a type position at all -- `new Holder.Point(3)` and `Holder.IAction x =
      ...` both give MIST_UNDEFINED_TYPE. It cannot reach a nested type inside an ABSTRACT by
      qualification (MIST_UNDEFINED_MEMBER on IFactory.DefaultProduct). It has the SAME
      qualification bug this order fixed, reported as MIST_TC_0016 plus MIST_TC_0015 rather than as an
      unresolved member, so `Outer.Inner.Read()`, a four-level chain and a nested type reading an
      enclosing static are all refused. And the spurious readonly above. That classic refuses so much
      of this is WHY the sample only reaches nested types from inside their enclosing type and
      hardcodes the rest -- so the sample is not evidence that classic supports what it declares.

      OUT OF SCOPE, MEASURED, AND NOT THIS ORDER'S: reaching a nested type through a CONSTRUCTED
      generic. `Box<int>.Wrapper.Info()` is MIST_PARSE_INCOMPLETE on BOTH pipelines -- the parser is
      shared and v2 does not touch it -- so it is a grammar gap rather than a model or emitter one.
      Logged under uncovered_constructs.

      EMISSION IS UNPROTECTED, and that is a property of this order unlocking nothing. Nothing in the
      test suite drives the v2 emitter except the AllFeaturesV2 baseline, and no banked sample declares
      a nested type, so a regression in the emission path would be caught by nothing until NestedScoping
      or AssociatedTypes banks. The model side is covered by
      Test/Mist.Tests/Semantics/NestedTypeResolutionTests.cs, six tests.
    analysis_phase_tasks:
