      A CONSTANT INDEX IS WAIVED FROM THE SYMBOLIC BOUND, which is a live hole this measurement found.
      Satisfied skips a required bound when the value is constant, so an index into an unknown-length array
      need only be `>= 0`: `int[] numbers = [1, 2, 3]; numbers[5]` compiles on both pipelines and throws.
      Removing the waiver is what produced the 64 above, so it cannot be removed until the lengths are
      carried.

      THE SLOT IS ALREADY DECLARED, which is the shape the residue should be closed into. Array.mist
      declares `public type ArrayBounds = ZeroOrPositiveInt and < Length;` and `intrinsic public TValue
      this[ArrayBounds index]`, so an array's bound IS a refinement type on slot 1, and the Between and
      symbolic requirements NeedIndex builds are a re-derivation of it. The model drops that slot twice:
      IndexBinder returns before selection for an array element access, and records no ParameterType for an
      intrinsic indexer. Recording it would let the array arms of this rule delete rather than grow.

      THE WAIVER IS GONE AND THE FLOW CARRIES LENGTHS (2026-09-16). The waiver was a soundness bug, not a
      trade-off: Satisfied skipped every symbolic bound for a constant, so `ArrayBounds`'s `< Length` was
      never asked of `numbers[5]`. It is deleted. What it had been hiding was measured before anything else
      changed: 62 unproven indices in AllFeaturesV2. The fix for those is the flow, because the TYPE of each
      receiver had dropped a length its origin states and nothing since has changed. Knowledge carries a
      Length interval per local. Given sets it from what the initializer says (Lengths.Of): a sized
      creation, a stackalloc, an array literal, a string literal, a slice by constant bounds, `Slice`,
      `AsSpan`, `ToArray`, `ToCharArray`, a one-argument `new Span`, and a copy. A comparison on `x.Length`
      narrows it on each path (Sized), and a list pattern narrows its scrutinee and gives its slice binding
      the length less the fixed elements (Sliced). NeedIndex proves against the typed length, else the
      flow's: an exact length asks an interval, a range of lengths asks what its shortest admits, and the symbolic
      `< Length` bound still counts beside either. A from-end index enters as knowledge -- the length
      shifted by k, and below Length whenever k is at least one (Reaching) -- so `if (xs.Length > 0)
      { xs[^1] }` proves and nothing in the rule learns what `^` means. An index into an unknown length
      with no holder was not asked at all; it is now unproven. A finding says OUT_OF_BOUNDS only for a
      single value outside the interval, and INDEX_UNPROVEN otherwise: with the waiver gone a constant can
      be merely unproven, and "Index 0 is outside the bounds of 'xs'" was false.

