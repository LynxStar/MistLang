      DependentTypes 20 errors -> 0, DependentTypeRefinementConstraints 2 -> 0,
      ArrayBoundsFlowAnalysis 1 -> 0, all three running byte-identical to classic.
      AdhocRefinementConstraints 6 -> 1, its remainder being order 141 rather than this.

      THE ORIGINAL EVIDENCE BELOW IS KEPT because its last paragraph was right about its
      dependants and wrong about nothing.
    prior_evidence: >
      A dependent parameter occupies an ordinal distinct from type parameters, its argument
      participates in constructed-type IDENTITY, and it stays readable at runtime inside
      member bodies. Domains include the integral types, bool and char, and may also be a
      named refinement.

      WAS BROKEN, NOW REFUSED, for the same reason as order 141 and by the same sweep: the emitter
      path existed and was wrong rather than absent. A dependent VALUE parameter was lowered to a C#
      TYPE parameter -- `public class FixedArray<Size>` with `return Size;` -- so every body use was
      CS0119, "'Size' is a type, which is not valid in the given context". 19 occurrences across
      three samples, with zero Mist diagnostics. UnspellableTypeGuard now refuses it with
      MIST_BE_DEPENDENT_TYPE_PARAMETER.

      THE MODEL COULD NOT ANSWER THE QUESTION, which is why the guard needed a model change to
      write. TypeParameter.Domain was designed to carry exactly this -- Standard.Type for a plain
      parameter, the value type for a dependent one -- and NOTHING POPULATES IT; ScopeResolver says
      so in a comment. So the first version of the guard was silently dead. TypeParameter.IsDependent
      now records the syntactic fact from the AST node kind, which is all a refusal needs. Domain
      remains the right home for the resolved domain, and remains empty, so a consumer wanting to
      know WHICH domain still cannot ask.

      THIS DEFECT IS WHAT BLOCKS ITS DEPENDANTS, not their own unbuilt halves. Orders 146 and 148
      stay `missing`, correctly: they have no code path of their own to be wrong. Their samples
