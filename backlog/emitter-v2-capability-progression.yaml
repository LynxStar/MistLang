      half is the frontend's: a body is an async context iff its method or lambda says `async`, and
      BindingContext carries it so a task-returning call yields the task there and its result
      everywhere else. The PROPAGATION half is the backend's: C# can only wait inside an async
      method, so a body containing an await is emitted async, its callers await it, and they become
      async in turn -- a closure over facts the binder records in AwaitUseRegistry, since half these
      awaits are inserted and exist in no syntax tree.

      A BACKEND WITH BLOCKING PRIMITIVES WOULD EMIT NONE OF THE SECOND HALF and read the same
      registry, which is the test that put it there rather than in the model. Mist's method is sync
      and its callers see a sync method; promotion is only how C# is made to honour that.
    unlocks: []

  - id: auto-await-and-explicit-await
    name: Auto-await in sync context and explicit await in async context
    order: 171
    layer: async-and-context
    requires: [sync-async-context-classification]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
      An async call in sync context yields the unwrapped value, including inside a sync
      lambda body, which changes the lambda's inferred return type. The classic pipeline
      lowers auto-await to a blocking getter, which cannot deadlock here only because
      nothing installs a synchronization context.

      DELIVERED, AS ONE NODE. The inserted await and the written one are the same thing and differ
      only in who asked, so modelling them apart would leave the emitter deciding when a call is
      awaited. THREE THINGS SUPPRESS THE INSERTION, and each is the same rule seen from a different
      side -- the position already wants the task: an async context, a task-typed target
      (`Task<int> t = f();`), and being the operand of `await` or of the async functor. That last one
      UNDOES an insertion rather than preventing it: `await f()` awaits what f produces, not the
      value unwrapped from it a moment earlier, and without it the operand is already an int and
      there is nothing left to await.

      A DELEGATE CALL TAKES THE SAME RULE. The first cut auto-awaited only method-group calls, and
      FirstClassFunctions printed four Tasks where classic printed values: a func value returning a
      task is a task-returning call however it was reached.

      THE BLOCKING GETTER SURVIVES IN EXACTLY ONE PLACE. A lambda's delegate type is fixed by the
      position it fills, so it cannot be promoted the way a method can, and an await inside a SYNC
      one blocks. It is the one place this backend cannot honour a sync context with a real await.

      V2 IS CONSISTENT WHERE CLASSIC IS NOT. Inside a string interpolation hole classic does not
      auto-await and prints the Task; v2 does, because the rule is about the call's type and its
      context and not about the position it sits in. No baseline covers it -- StructuredConcurrency
      only uses the position classic gets right.
    unlocks: []

  - id: async-expression-functor
    name: async as an expression functor
    order: 172
    layer: async-and-context
    requires: [auto-await-and-explicit-await]
    v2_status: done
    verified_by: v2-semantics
    evidence: >
