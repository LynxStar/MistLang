      WHAT CHANGED. The binder records what a position is counted against, as the model's rule for a
      dropped target asks: CountedIndexer -- the int indexer, its parameter read through the receiver, and
      the Length or Count property -- on IndexExpression.FromEnd for an Index no indexer takes, and on
      ListPattern.Reads for a user indexer. A receiver with neither property is
      MIST_PM_RECEIVER_NOT_COUNTABLE at both sites, with the element still typed so nothing cascades. The
      prover reads a from-end index's position as the count less the offset (Admitted.Minus), the count
      known only from its property's type and lift, and judges it against the recorded parameter. A list
      pattern's positions are constants from the front and the count less k from the back, within the
      count its own length test admits; a discard owes nothing, and a pattern whose test can never pass
      reads nothing. The lattice is keyed by holder rather than local, so a field of this carries a length:
      learned from a guard or a write, forgotten at a write to it and, unless readonly, at a call. A
      property or indexer accessor with a Mist body now forgets too, and so does a write through one: a
      getter that reassigned the field was invisible to the field BOUNDS as well, which this closes. An
      offset known as a range reaches [Llo - khi, Lhi - klo], below Length exactly when klo is at least
      one. A value the prover knows exactly and outside the refinement is VIOLATED, as an index known
      exactly was OUT_OF_BOUNDS; argument-refinement-not-implied-by-parameter and
      narrowing-lost-on-reassignment knew their value exactly and are re-aimed at a parameter, so they
      still test the paths they are named for.

