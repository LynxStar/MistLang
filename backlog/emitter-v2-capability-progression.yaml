      an explicitly typed local, a field initializer, a return statement, a parameter at an
      argument position, an assignment to an existing variable, and a constructed generic. All
      six bind now, and the sample is banked in AllFeaturesV2.

      FOUR OF THE SIX ALREADY PUSHED A TARGET TYPE, put there for the array-literal work.
      BindingContext has carried TargetType and a PushTargetType guard all along, used by the
      typed local, the return, the field initializer and an expression-bodied accessor. What was
      missing was the binder case for TargetTypedNewExpression, which the grammar has parsed all
      along and which reached BindPrimary unhandled and became a sentinel, plus the two remaining
      pushes -- assignment, and the argument position.

      THE ARGUMENT POSITION CARRIES A REAL LIMIT rather than an unfinished one. A parameter type
      can target an argument only once the overload is known, and the overload is chosen from the
      argument types, so the two are circular. ArgumentBinder therefore pushes a parameter type
      only where exactly ONE candidate takes this many arguments, which covers every call in the
      sample. Where several do, the argument gets no target and
      MIST_PM_TARGET_TYPED_NEW_NO_TARGET asks for the type rather than guessing at a parameter.
      C# breaks the circle properly, by treating the construction as convertible to anything with
      an applicable constructor.

