  - id: void-unit-type
    name: void as an inhabited unit type
    order: 80
    layer: unions-and-unknown
    requires: [optional-union-representation]
    v2_status: partial
    verified_by: sample
    evidence: >
      `void` is a reserved alias for Standard.Void -- one type, two spellings. It doubles as the
      optional absence value and overlaps the type-literal rule, so one token resolves three ways
      from context alone. A void-typed parameter means "takes a unit", not "takes nothing".

      Methods ALWAYS return a value, so there is no unit-returning method that returns nothing.
      Every void method returns the singleton, which makes any emitted difference between two such
      methods the backend's invention rather than the language's.

      SYSTEM.VOID IS NOT THE TARGET, measured rather than assumed. The CLR refuses it in every
      position a unit type needs, so this is not a C# restriction that IL could route around.
      MakeGenericType gives "The type 'System.Void' may not be used as a type argument",
      Activator.CreateInstance gives "Cannot dynamically create an instance of System.Void", and
      MakeArrayType cannot load 'System.Void[]'. System.Void marks the ABSENCE of a value; Mist's
      Void is a type with one value. Standard.Void therefore has to emit as an ordinary struct.

      THE EMISSION RULE, decided. It is framed by RECEIVER rather than by expression -- what
      decides is whether something receives the type or the value, not what produced it. Every
      receiver takes Standard.Void. A TYPE receiver -- type argument, parameter type, field type,
      local type -- takes the type; a VALUE receiver -- an initializer, an argument, an assignment
      -- takes Standard.Void.Instance. Framing it this way is what covers the positions holding no
      expression at all, `Result<void>` being the plain case and the one an expression-shaped rule
      misses.

      ONE DELIBERATE EXCEPTION. A method's return type emits the C# `void` keyword, though it is a
      type receiver, because C# offers a native form there and the value is recoverable. That
      exception is exactly what the call-site lowering repairs: the call now yields nothing in C#,
      so a value receiver evaluates it as a statement, keeping its side effects, and then supplies
      Standard.Void.Instance itself. Sound because the type has one inhabitant, so the value
      carries no information and reconstruction is exact rather than approximate. Taking the
      exception is also what hands back the CLR-native shape wherever C# demands one, in overrides,
      interface members, entry points and delegate conversions.

      DO NOT COPY CLASSIC. Classic runs a whole-program usage analysis to choose per method
      between `void` and a generated MistVoid struct, and MistVoid is a hand-written C# copy of
      Void.mist that nothing keeps in step with it. Deciding by usage makes a declaration's
      signature depend on its callers, which cannot be answered for a public method whose callers
      live in a project compiled later, forces a whole override chain to change when one call site
      consumes a result, and has no answer for a method with both a consuming and a discarding
      call site. Uniform `void` plus lowering at the sites that want a value needs no such
      analysis.

      A RUNTIME OF OUR OWN WOULD NEED NONE OF THIS. All of the above is a concession to the CLR's
      treatment of System.Void. A backend targeting our own runtime can use its unit type in every
      position and drop both lowerings.

      DELIVERED TO THE DESIGN ABOVE, three residues below. The trichotomy is one binder arm
      deciding by target type; absence and the singleton are distinct expression kinds and the
      type-literal reading is the general typeof expression, typed Standard.Type. Every type
      receiver takes Standard.Void, the return-type exception lives in one place
      (MethodEmitter.EmitSignature), and the call-site lowering reconstructs the unit at ROOT
      value receivers -- a local's initializer and a return value -- by evaluating the call as a
      statement and supplying the instance. Type argument, parameter and field positions all
      emit and run. The struct itself is a generated __Void.g.cs whose members follow Void.mist,
      plus ToString and the equality overrides as backend additions so interpolation prints the
      unit's name and the constant operators compile clean.

      ONE IDENTITY, DELIBERATELY: the type literal, and the generated implicit conversion to
      Type, both produce typeof(Standard.Void) -- where classic splits between typeof(void) and
      a MistVoid struct. One type, two spellings, one reflection object; output-identical to
      classic because the short name is Void either way. VoidType runs byte-identical to
      classic, VoidValueLiteral runs for the FIRST TIME ON ANY PIPELINE and matches classic
      line-for-line; all three unlocked samples are banked in AllFeaturesV2.
    tasks:
      - >
        Emit Standard.Void by transpiling Standard/Void.mist rather than generating the C#
        (delete CSharpEmitterV2.EmitVoidStruct in its favour), so the language stays the one
        authority on what Void is and a later backend inherits the definition instead of
        reimplementing it. Still waits on properties, operator declarations and cast operator
        declarations, all of which Void.mist uses.
      - >
        Hoist a unit-valued call out of NESTED value receivers -- an argument, an interpolation
        hole, an assignment right side -- preserving evaluation order against the other
        operands, in `g(f(), h())` f still running before h. Root receivers are done; the
        nested case is the part that looks smaller than it is, because every side-effectful
        operand sequenced before the call must hoist with it.
      - >
        Wrap rather than convert where a unit-returning method is used as a function value,
        since Func<Standard.Void> cannot bind a void-returning method. Waits on lambdas and
        method-group conversion, orders 104 to 109.
    unlocks: [OptionalTypes, VoidType, VoidValueLiteral]

  - id: unknown-top-type
    name: unknown as a top type
    order: 81
    layer: unions-and-unknown
    requires: [class-declaration]
    v2_status: done
    verified_by: unexercised
    evidence: >
      A real user-facing type that every non-void type is assignable to, lowering to C#
      object. Forbidden as the declared type of writable storage and of a new expression.
      Pattern matching is the designated way back to a concrete type.

      DONE MEANS THE MODEL IS RIGHT AND THE EMISSION IS RIGHT. `unknown` resolves to a real type,
      carries correctly through every position it can appear in, and lowers to C# `object`. The
      rules that REJECT a program are type checking, and v2 does none yet -- Stage 5 is an empty
      stub with no analyzer contract over IProgramModel -- which is the same state every other
      capability in this file is banked in. Analysis is a later phase over the whole language, not
      a debt owed by this entry. See `analysis_phase_tasks`.

      `unexercised` because NO SAMPLE reaches it. UnknownType is the closest consumer and still
      needs type-argument-substitution (53, broken), unknown-covariant-generic-widening (82) and
      pattern-matching-core (90), so nothing in AllFeaturesV2 spells `unknown` today and the
      positive path was measured on scratch programs rather than on a sample. The stdlib does reach
      it -- Standard/Unknown.mist declares `extension(unknown self)`, whose receiver resolves on
      every compile -- but that is the non-sample target, not sample greenness.

      Rules that judge a value flowing from one place to another were written, measured working, and
      then deleted rather than left in the binders, because putting them there sites analysis inside
      construction and pre-empts a decision the analyzer layer should make for itself. They are
      listed under "WHAT THE ANALYSIS PHASE WILL OWN" so nobody has to rediscover them.

      THE ONE REJECTION THAT STAYED, and it is in Stage 4 because of a fact about the model rather
      than a preference. Field does not store its declaring AST node -- its own doc says so, noting the
      node is reachable only through Initializer.Node when an initializer exists. A field with no
      initializer, which is exactly `public unknown slot;`, therefore has NO node anywhere in the
      finished model, so an analyzer could detect the violation and could not report it at the
      user's source. Construction is the only place that holds both the resolved type and the
      declaration it came from. Property and Indexer store no node either, so the rule is not
      splittable into a Stage 4 half for fields and a Stage 5 half for the other two -- all three
      storage kinds are reportable only from construction, which is why one descriptor covering all
      three sits in one place. Classic reaches the same split from the same constraint: its
      MIST_SB_0050/0051/0052 come from SemanticModelBuilder Pass 2 while every use-site unknown
      rule comes from TypeCheckerAnalyzer.

      MIST_PM_UNKNOWN_AT_STORAGE, one descriptor for field, property and indexer, with the member
      named as an argument. Previously accepted in silence, emitting a real object-typed slot. Fires
      on a getter-only property too: the ban is on the declared type, not on the presence of a
      setter, since a property that is read-only today is one edit away from not being. It does NOT
      fire on a parameter, a return type or a local, which is how an unknown is meant to be accepted
      and handed on -- banning those would leave the type no usable position at all.

      THE BAN CASCADES STRUCTURALLY through type arguments, union constituents and tuple elements,
      so `Box<unknown>`, `Box<Box<unknown>>`, `int | unknown`, `(int, unknown)` and
      `(int[], unknown)` are each refused. Arrays need no case of their own because v2 represents
      `T[]` as Standard.Array<T, Length>, putting the element type at a type-argument position
      already.

      THE POSITIVE PATH WAS ALREADY THERE before any of this, which is the other half of why the
      register's `missing` was wrong. `unknown` as a local, parameter and return type resolved and
      ran on v2 already: ScopeResolver mapped the keyword to UnknownType.Instance and TypeNameEmitter
      spelled it `object`. Measured by running a program that widens int, string, bool and char into
      an unknown local, passes them to an unknown parameter, and round-trips one through an
      unknown-returning method. So `missing` was simultaneously too pessimistic about the type and
      too generous about the rules.

      A TRAP FOUND EN ROUTE, and the reason the ban is not simply "does this mention UnknownType".
      AmbientTypeResolver.ResolveArrayType was building a CLR `T[]` as `Array<T, UnknownType>` --
      the user-facing top type at a dependent-VALUE position -- while ScopeResolver.ConstructArray
      builds the same array as `Array<T, UnknownValueType(int)>`. Two consequences: a CLR string[]
      and a Mist string[] interned as different types, and any structural search for unknown would
      have reported every CLR-projected array as containing it, banning array-typed fields
      wholesale. Fixed to match ScopeResolver. UnknownValueType is deliberately NOT matched by the
      walk; conflating the two unknowns is the specific mistake its own doc comment warns about.
      NOT covered by a test: the Tier 3 harness registers Standard shells without loading CLR
      assemblies, so its int[] and string[] fields come from ScopeResolver and never exercise the
      ambient path.

      WHAT THE ANALYSIS PHASE WILL OWN for this capability. Each was implemented and verified
      reporting at Mist source, then removed, so the cost of redoing it is known to be small and the
      design questions are already settled:
        * unknown flowing into a concrete target -- the defining asymmetry, and the rule that makes
          this a TOP type rather than a synonym for object. Reachable at four sites where v2 already
          pairs a target type with a value type: typed local declaration, return, assignment
          expression, typed for-initializer.
        * void into unknown -- the single exception to "every type widens in", since void is not a
          type of value and there is nothing at the assignment to receive.
        * `new Box<unknown>()` -- constructing the type is what commits its storage, so this is the
          storage ban reached through a constructor.
        * `new unknown[3]` -- every element a writable slot.
        * a member named on a bare unknown receiver.
      Today each of these instead reaches the C# backend, which reports MIST_CS_ERROR against
      generated .cs naming `object`, a type the user never wrote. That is the same residue every
      unchecked v2 construct leaves, and it is not a correctness problem for a program that was
      going to be rejected anyway -- a VALID program using `unknown` models and emits correctly,
      which is what this entry claims.

      THE SILENCE CONSTRAINT, recorded because it will govern whoever writes the analyzer. v2 has no
      assignability relation -- no numeric promotion, no subtype rule, no user conversions -- so a
      check that tried to decide arbitrary pairs would reject the programs that compile today,
      `long n = 42;` among them. Any unknown rule must answer only the questions unknown raises and
      stay silent on every other pair.

      ONE RESOLUTION FIX WAS KEPT, being resolution rather than checking. ExpressionBinder's
      ResolveElementType had no arm for UnknownElementTypeRef, so `new unknown[3]` resolved its
      element to ErrorType and emitted `new /* error */[3]` -- garbage C# provoking seven Roslyn
      errors. It now resolves to UnknownType and emits `new object[3]`: accepted, because rejecting
      it is checking, but at least a faithful lowering of what was written rather than a broken
      file.

      FOUND AND FIXED ALONGSIDE, unrelated to unknown. ConstructedType.BuildName interpolated the
      definition's arity-bearing registered name directly, so every constructed type named itself
      with the marker doubled -- `Box<int>` reported as `Box<><int>`. Invisible in behaviour, which
      is why it survived: TypeNameEmitter and TypeEmitter each stripped the marker in their own
      copy, and the only other consumer, CandidateSet's overload shadowing key, only ever compares
      one of these names with another, so any self-consistent format works there. Now stripped
      through one shared MistType.StripArity with four consumers -- ConstructedType.BuildName,
      TypeDisplay.Mist, TypeNameEmitter.EmitConstructed and TypeEmitter.CleanName, the last keeping
      its name for the emitter's own intent but delegating its body. Pinned by Tier 1 tests over
      ConstructedType naming, since no higher tier can observe it, and confirmed load-bearing by
      reverting the fix and watching four of them fail.
      NameFormatTranslator.MistNameToClrName also locates the marker and is deliberately NOT a
      consumer: it translates arity into CLR backtick notation (`List<>` to List`1), so it needs the
      comma count as well as the base name and uses the marker's absence as its not-generic test.

      DIAGNOSTICS RENDER THROUGH TypeDisplay.Mist, which spells a type the way source does rather
      than the way the model names it: Standard.Int32 as `int`, a generic without its arity marker,
      and Standard.Array<T, Length> with a rank suffix -- `int[]` when the length is an unknown
      value and `int[5]` when it was stated. Without the array case a banned `(int[], unknown)`
      reported as `(Array<int, int>, unknown)`, which names nothing the user can find in their file.
    analysis_phase_tasks:
      - Add the five use-site rules as an analyzer over IProgramModel. Everything needed survives
        construction, since Expression carries both Node and Type and the walk from method to body
        supplies the return type. Only the storage ban has to stay in Stage 4.
      - Check an argument against its parameter type once overload-resolution-by-argument-type
        (order 26) can name one, so unknown cannot enter a concrete parameter.
      - Consult universal extensions (extension(unknown self), order 113) BEFORE any bare-unknown
        member rule fires, or Standard/Unknown.mist's ToString, GetHashCode and GetType become
        unreachable on the receiver they are declared for.
    unlocks: []

  - id: unknown-covariant-generic-widening
    name: Covariant widening of a generic at unknown type-argument positions
    order: 82
    layer: unions-and-unknown
    requires: [unknown-top-type, type-argument-substitution]
    v2_status: partial
    verified_by: v2-semantics
    evidence: >
      THE SAMPLE FAILED IN ROSLYN, NOT IN MIST, and the two errors named the whole problem --
      "Cannot implicitly convert type 'MyList<int>' to 'MyList<object>'" and "An expression of type
      'MyList<object>' cannot be handled by a pattern of type 'MyList<int>'". v2 had emitted the
      widening happily; C# class generics are invariant, so the `object` spelling is a type Roslyn will
      not convert into.

      A CONSTRUCTION REACHING unknown IS SPELLED `dynamic`, transitively and at any depth, which is the
      only C# spelling that both accepts the conversion and dispatches members against the runtime
      type. A BARE unknown is untouched and stays `object` -- it is the user-facing top type with a
      domain of its own, and only the CONSTRUCTION changes spelling. Array is deliberately outside the
      rule: the Array<T, Length> special case runs first, so `unknown[]` stays `object[]`, C# arrays
      being covariant already. No sample reaches that and the choice is recorded rather than defended.

      THE FRONTEND HAD NEVER ASKED WHETHER THE WIDENING WAS LEGAL, which is the finding worth keeping.
      ConversionRelation declines constructed generics by design and its own doc says a false answer
      "may not be used to refuse a program" -- and nothing checks the assignability of a local
      declaration at all, so `MyList<unknown> w = ints;` bound because the question never came up, not
      because the answer was yes. The relation now HOLDS, which is what this order is named for.

      COVARIANCE KEYED ON THE TOP TYPE AND NOTHING ELSE. An argument position may widen to `unknown`
      and to no other supertype, so `MyList<int>` stays outside `MyList<long>` even though int is
      within long -- general covariance is unsound without a declared variance annotation and Mist has
      no syntax for one. Asserted as the pair, since the int-to-long half is what makes the refusal
      meaningful. One-directional, and CLASS definitions only: a struct generic widened this way would
