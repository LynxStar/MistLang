name_format:
  - [x] accept Mist arity notation (List<> = arity 1, Dict<,> = arity 2, Foo<,,,> = arity 4)
  - [x] translate to CLR notation (List`1, Dict`2, Foo`4) internally
  - [x] strip arity suffix from CLR names for Mist registration (List`1 -> List<>, Dictionary`2 -> Dictionary<,>)
  - [x] handle nested type names (Outer.Inner)

recursion_safety:
  # Types can reference themselves in base types, interfaces, or member signatures.
  # Cache must be populated with a shell BEFORE projecting members to avoid infinite recursion.
  - [x] insert shell into cache before member projection
  - [x] concurrent access returns same instance (TryAdd race handling)
  - [x] rollback on projection failure (remove from cache + namespace)

sentinel_attributes:
  # Sentinel attributes are ONLY needed when there is NO existing CLR attribute
  # that projects over AND the type checker or emitter needs the data.
  # If the CLR already has an attribute (e.g., [In], [Out]), project THAT attribute
  # directly -- the emitter uses it to distinguish calling conventions.
  #
  # Mist concepts that map directly (no sentinel needed):
  #   - ref/out/in parameters -> Mist ref (CLR already has [In]/[Out] attributes to distinguish)
  #   - readonly struct -> Mist readonly modifier
  #   - init-only setter -> Mist init keyword
  #   - ref struct -> Mist ref modifier
  #   - static -> Mist static modifier
  #
  # True sentinels (no CLR attribute exists, data would be lost):
  - [x] sealed class -> sentinel [Sealed] (no CLR attribute, no Mist concept)
  - [x] virtual method -> sentinel [Virtual] (no CLR attribute carries this)
  - [x] override method -> sentinel [Override] (no CLR attribute carries this)
  - [x] abstract method -> sentinel [Abstract]
  - [x] params array -> project CLR [ParamArray] attribute (no sentinel)

clr_attributes_to_project:
  # All CLR attributes that have valid destinations in Mist should be projected.
  # This lets the emitter reconstruct proper calling conventions.
  - [x] in/ref/readonly on parameter -> represented by ParameterModifier (IsRef + IsReadonly), not stored as an attribute
  - [x] [Out] on parameter -> stored as an attribute (the one convention ParameterModifier cannot distinguish from plain ref)
  - [x] [ParamArray] on parameter (params)
  - [x] readonly struct -> Mist readonly modifier ([IsReadOnly] type attribute filtered out)
  - [x] public custom attributes on classes/structs/interfaces and their methods, properties, fields, indexers, constructors, operators, cast operators, and parameters
  - [x] public custom attributes on enum types
  - [x] compiler-internal attributes excluded (CompilerGenerated, Nullable*, Dynamic, Extension, TupleElementNames, IsUnmanaged) -- TupleElementNames is excluded from the attribute list but not discarded: TupleElementNames.Of reads it into tuple element names (see missing_stdlib_types)
  - [x] positional constructor argument values (including Type-, enum-, and array-valued)
  - [x] named property/field argument values

visibility_filtering:
  - [x] project public members
  - [x] project protected members (for inheritance)
  - [x] exclude private members
  - [x] exclude internal members
  - [x] exclude event accessors (add_/remove_)
  - [x] exclude pointer-typed parameters
  - [x] exclude members with unresolvable parameter/return types

disposable:
  - [x] detect IDisposable implementation
  - [x] set HasDrop on ConcreteType
  - [x] determine Drop() vs bare IDisposable (IsDisposableDrop)

duck_typed_enumerable:
  # Types that have GetEnumerator()/MoveNext()/Current pattern but don't
  # implement IEnumerable<T> (e.g., Span<T>). NOT a provider concern —
  # the foreach lowering in the type checker should check the duck-type
  # pattern directly (like C# does) rather than synthesizing a fake
  # IEnumerable<T> interface on the projected type.
  # Deferred to a type-checker/foreach spec.
  status: deferred (type-checker concern, not provider)

intrinsic_substitution:
  # When resolving types in member signatures, CLR types that map to Standard
  # Library types must be substituted (e.g., System.Int32 -> Standard.Int32
  # in return types, parameter types, field types, etc.)
  # NOTE: This is handled implicitly by AmbientTypeResolver.ResolveByFQN
  # which checks wellKnownTypes (keyed by CLR FQN) before shells. Any CLR
  # type that has a well-known mapping resolves to the Standard Library instance.
  - [x] substitute in method return types
  - [x] substitute in method parameter types
  - [x] substitute in property types
  - [x] substitute in field types
  - [x] substitute in indexer parameter/return types
  - [x] substitute in base type references
  - [x] substitute in interface type arguments
  - [x] recursive substitution in constructed generics (e.g., List<int> -> List<Standard.Int32>)

nullable_value_types:
  # ambient-type-provider-v2 Req 11.1 and 11.9: a Nullable<T> parameter or return is the Mist
  # optional `T | void`, the inner type substituted as usual.
  - [x] Nullable<T> -> `T | void` in every position: returns, parameters, properties, fields, and
        as a type argument (IEnumerable<int?> is IEnumerable<int | void>, as a Mist `List<int?>` is)
    # Measured 2026-09-26. BEFORE: every CLR `int?` was a nominal ConstructedType System.Nullable<Int32>.
    # ResolveInbound tested for it with Nullable.GetUnderlyingType, which compares by reference against
    # the runtime's own Nullable definition and returned null for the MetadataLoadContext type (probed
    # directly: null for the loaded `int?`, System.Int32 for typeof(int?)). Parameters never came through
    # ResolveInbound at all. Against HasNullableMembers on v2, `int? m = h.GetNullableInt(false)` failed
    # MIST_PA_CAST_REQUIRED, and `.HasValue` and `.Value` bound, which optional-types Req 2.4 forbids on
    # an optional; coalescing, narrowing, interpolation and passing int, `int?` or an absent `int?` to an
    # `int?` parameter already ran, Roslyn resolving the nominal type downstream.
    # AFTER: AmbientTypeResolver.Resolve recognises a closed System.Nullable`1 by name and wraps its
    # argument. The assignment runs, the two members are refused MIST_PM_UNRESOLVED_MEMBER, and the other
    # nine probes are unchanged. AllFeaturesV2 matches its baseline before and after, so no banked
    # sample's output moved. AmbientTypeProviderV2NullableProjectionTests holds it, mutation-checked by
    # restoring GetUnderlyingType.

missing_stdlib_types:
  - [x] System.ValueTuple`N -> the Mist structural tuple (TupleType, decorated by NamedTupleType), not a Standard declaration
    # Measured 2026-09-25 on v2 against Test/Mist.Tests.InteropFixtures/TupleSignatures.cs.
    # BEFORE: a ValueTuple signature entered as a nominal ConstructedType over the projected
    # System.ValueTuple`N shell, and TupleElementNamesAttribute was dropped. Passing Mist tuple
    # literals, locals and nested/9-element literals to CLR parameters already compiled and ran, as
    # did .Item1/.Item2 on a returned pair. Everything else failed: `(int, int) r = Divide(17, 5)`
    # MIST_PA_NO_IMPLICIT_CONVERSION; `var (q, m) = ...` and the typed form MIST_PM_DECONSTRUCTION_SOURCE;
    # every element name (.Quotient, .Origin.X, .Max, .Last, foreach e.Name) MIST_PM_UNRESOLVED_MEMBER;
    # and past seven elements even .Item8/.Item9/.Item16 did not resolve (11 of 21 probes failed on
    # tuples; 3 more failed for reasons that are not tuples', listed below).
    # AFTER: AmbientTypeResolver resolves a closed ValueTuple`2..`8 to the interned TupleType of its
    # flattened elements, every Rest spread, wrapped in NamedTupleType when the member's attribute names
    # any element. All 11 now compile and print the right values, plus 23 further shapes (ref, nullable
    # narrowing, dictionary keys, name-mismatched generic arguments, `unknown` patterns, 9- and
    # 16-element round trips, BCL Enumerable.Zip(a, b) and a.Index()).
    # Tests: ClrValueTupleTests (Tier 1: NameSlots against the compiler's own attribute on every fixture
    # signature), AmbientTypeProviderV2TupleProjectionTests (Tier 3: projected structure and element
    # types), ClrTupleSignatureRuntimeTests (Tier 4: values in and out at runtime, one compile, one run).
    # Both name skips (Rest, delegate) are mutation-checked.
    # NOT TUPLES, measured beside it and unchanged by it: unqualified `Math.DivRem` is Standard.Math
    # (System.Math.DivRem works and returns the named tuple); `ps[2]` on a projected array is refused
    # MIST_PA_INDEX_UNPROVEN, the length being unknown; and the extension form `a.Zip(b)` fails
    # MIST_PM_TYPE_ARGUMENTS_NOT_INFERRED whichever overload is meant, the tuple-free selector overload
    # included, while the static form `Enumerable.Zip(a, b)` binds.
    - [x] parameters, returns, properties, fields, indexers, constructors, extension receivers and returns, operator and cast returns
    - [x] nested tuples, and tuples inside generic arguments, arrays, by-ref and Nullable
    - [x] Rest encoding flattened at any depth (8, 9 and 16 elements covered)
    - [x] element names: pre-order over the CLR type, each tuple taking its flattened count and each Rest re-taking its own (Octet's 8 elements carry 9 names); a count that disagrees drops every name
    - [x] ValueTuple`1 stays nominal: Mist tuples have two or more elements (value-tuples Req 1.3)
    - [ ] names on base types, interfaces and type-parameter constraints -- a base type's are on the type itself and simply not read; an interface's or constraint's sit on InterfaceImpl/GenericParamConstraint rows that reflection does not surface. All three stay structural and unnamed
    - [ ] names inside a non-Func/Action delegate's signature -- FunctionShape reads Invoke unnamed and the delegate's names are skipped
    - [ ] System.Tuple (reference tuples) stays nominal; no language requirement asks otherwise
  - [ ] Union type Standard Library representation
