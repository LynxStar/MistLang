      compiles the same.

      C# FIXES THE ORDER WITHIN A CLAUSE and rejects any other, so the parts are bucketed rather than
      emitted as declared: `class` or `struct`, then the types, then `new()`. Only the constraints C#
      HAS are spelled; readonly, mutable, owned and the three substructural kinds are Mist's alone and
