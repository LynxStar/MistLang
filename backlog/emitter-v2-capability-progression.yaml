      to classic. The nesting is what gives reverse order for free: a declaration that still owns its
      value takes the REST of the block as the body of a try, so each drop sits inside the try of
      every binding declared before it, and try/finally rather than a trailing statement because the
      drop has to survive a return or a throw.

