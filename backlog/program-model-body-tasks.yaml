statements:
# =============================================================================
  block:
    - [x] BlockStatement -> bound block with its own scope -- BindNestedBlock; the Block produced does not retain the scope, see bound_node_hierarchy
    - [x] nested BlockStatement (bare `{ }`)
  variable_declaration:
    # GRAMMAR MISMATCH: UninitializedVariableStatement is filed here but is a SIBLING
    # Statement alternative (uninitializedVariable:UninitializedVariableDeclaration), not
    # a VariableDeclarationStatement alternative. That is exactly why it lands in
    # StatementBinder's outer `_ =>` arm rather than BindVariableDeclaration's `default:`.
    # Worth restructuring this section to match the grammar.
    - [x] TypedVariableDeclaration (`T x = init;`) -> declared type resolved; initializer bound with declared type as target
    - [x] InferredVariableDeclaration (`var x = init;`) -> type inferred from initializer -- NOTE: when the initializer is unresolved the local silently takes ErrorType
    - [ ] UninitializedVariableStatement (`T x;`) -> declared type, no initializer -- reaches UnsupportedStatement via the outer arm; LocalDeclarationStatement.Initializer is already nullable, so the model is ready and only the binder is not
    - [x] VarTupleDeconstruction (`var (a, b) = init;`) -> element types from initializer tuple type (order 102). Names come from FirstName + RestNames; the node's third slot, IDENTIFIERs, is vestigial and no parse method assigns it. Its repetition is `*`, so `var (only) = x;` parses and is then refused on arity, no tuple having one element
    - [x] TypedTupleDeconstruction (`(T a, U b) = init;`) -> per-element declared types (order 102), assembled into a tuple and pushed as the initializer's target so a literal on the right binds elementwise
    - [ ] readonly modifier -> readonly-status on the local -- grammar exposes readonlyModifier:READONLY? on all four alternatives; never read, and LocalVariable has nowhere to put it
    - [ ] ownership specifier on local (owned / frozen / readonly-ref / borrowed / ref) -- grammar exposes ownershipSpecifier:OwnershipSpecifier?; never read
    - [ ] bare `ref` local vs `readonly ref` lend distinction (ref-kind vs ownership tier)
  return:
    - [x] ReturnStatement with value -> value bound with method return type as target -- PushTargetType(ctx.ReturnType), seeded from method.ReturnType
    - [x] bare `return;` (void)
    - [ ] `return ref expr;` (ref return) -- the grammar has refKeyword:REF?; BindReturn never inspects it and ReturnStatement has no ref field
    - [ ] top-level-statement return -> must be integer exit code (TLS mode, enclosing type is null) -- unreachable; see binding_pass_integration.top_level
  conditionals:
    - [~] IfStatement (condition bound to bool) -- MISSING: the "to bool" half. The condition is bound but not target-typed, not converted, and not checked; there is no conversion machinery to do it with
    - [x] ElseIf chain (ElseIfElseClause) -- recursive BindIf; IfStatement.ElseBranch holds either a Block or a nested IfStatement
    - [x] ElseBlock (ElseBlockElseClause)
    - [x] pattern variables from `is` in the condition are in scope in the THEN branch only (not else) -- and in the rest of the CONDITION too, which is the half worth naming: BindConditionInto builds the then-block's scope first and binds the condition into it, so one mechanism gives both (order 90)
    - [~] refinement/union narrowing applied inside the THEN branch (see mist_specific.narrowing) -- a pattern's BINDING carries the narrowed type into the branch (orders 90, 98). MISSING: narrowing the scrutinee itself, so `u` stays the union inside a branch guarded by `u is int i`, and refinement narrowing entirely
  loops:
    - [~] WhileStatement (condition bound to bool) -- MISSING: the "to bool" half, as with if
    - [x] ForStatement: initializer (typed-var-decl / var-decl / expression), condition, iterator, own for-scope -- all three ForInitializer alternatives handled. NOTE: initializer variables get no target-type push, unlike statement-level typed declarations
    - [~] ForeachStatement TypedForeach + VarForeach: iteration variable scope -- MISSING: a type for the `var` form. Both cases exist and both register the variable, but VarForeach assigns ErrorType.Instance, so `foreach(var x in ...)` produces an untyped local
    - [ ] foreach element-type inference from IEnumerable<T> (with type-argument substitution; single-impl requirement, else require annotation) -- that ErrorType assignment is the whole story; no IEnumerable<T> walk exists
    - [ ] foreach duck-typed GetEnumerator/MoveNext/Current path (deferred? see iterators-enumerables spec) -- decide + track -- STILL UNDECIDED; no decision recorded in code or comment
    - [x] BreakStatement (NOTE: grammar has NO `continue`, `do-while`, `switch`-statement, `throw`, `using`-statement, `yield`) -- parenthetical re-verified against Mist.storm 2026-07-26, still accurate
  readonly_block:
    - [ ] ReadonlyBlockStatement (`readonly { }`) -> bound block flagged readonly-context -- no case in BindStatement -> UnsupportedStatement
  expression_statement:
    - [x] ExpressionStatement -> bound expression in statement position
    - [ ] discarded-async-invocation tracking (bare async call whose result is dropped -> scope-exit await obligation; see mist_specific.async)
  context_statements:
    # The `with` family (structured-context). See mist_specific.context.
    # NONE of the six has a case in BindStatement; all reach UnsupportedStatement.
    - [ ] WithVarDeclarationStatement (`with var x = init;`)
    - [ ] WithTypedDeclarationStatement (`with T x = init;`)
    - [ ] WithDiscardDeclarationStatement (`with T _ = init;`) -> no local, context-keyed by type
    - [ ] WithPushStatement (`with expr;`)
    - [ ] WithBlockStatement (`with (expr) { }`)
    - [ ] WithVarBlockStatement (`with (var x = init) { }`) -> child scope for the binding

# =============================================================================
expressions:
# =============================================================================
  literals:
    - [x] integer literal -> type from suffix (int / uint / long / ulong) -- ParseIntegerLiteral. NOTE: the value is always boxed as long, so ulong literals above long.MaxValue parse to 0
    - [~] hex literal / binary literal (same suffix-based typing) -- MISSING: both halves. Hex binds but is HARDCODED to Int32 regardless of suffix; binary literals have no case in BindPrimary -> UnresolvedExpression
    - [x] float literal -> type from suffix (double / float / decimal)
    - [x] string literal -> string -- NOTE: only the outer quotes are stripped; escape sequences stay raw in the constant value
    - [x] char literal -> char -- same escape caveat: `'\n'` yields the backslash
    - [ ] regex literal -> regex -- no case in BindPrimary -> UnresolvedExpression. The regex TYPE keyword does resolve (ScopeResolver.ResolveReservedAlias); only the literal is missing
    - [x] true / false -> bool
    - [x] interpolated string -> string (bind each ExpressionPart; TextPart is literal)
  identifier_and_this:
    - [~] IdentifierExpression -> local / parameter / field / property / method-group / type / namespace-prefix -- MISSING: properties (no path at all). AmbiguousResult becomes an UnresolvedExpression with no diagnostic. The method GROUP now survives: MethodGroupResult becomes a MethodGroupExpression carrying every overload, which the invocation collapses once the arguments can decide
    - [~] implicit-this instance/inherited member resolution (walk base chain, classes AND structs) -- MISSING: the base chain, and everything but fields. FindEnclosingField covers class and struct (both are ConcreteType) but searches only the declaring type's FieldsList
    - [~] ThisExpression (error in static context) -- MISSING: the error. The only rejection is EnclosingType being null, which cannot happen for a bound delegate; BindingContext carries no staticness flag and the binder never receives the Method
    - [ ] FieldKeywordExpression (`field`) -> backing field of enclosing property accessor -- no case in BindPrimary; moot until accessor bodies bind
    - [~] TypeLiteralExpression (type in expression position) -- BindTypeLiteral (order 80). NOTE: `Console.WriteLine(...)` still works by a different route (identifier -> TypeResult -> TypeReferenceExpression):
      - [x] as metatype (Standard.Type) for reflection -- typed Standard.Type, emitted typeof(T); member reads resolve through the intrinsic Type shell's instance members (measured via locals in VoidValueLiteral; the direct `int.Name` spelling is untested)
      - [ ] redirect to referenced type for static member access (`string.IsNullOrEmpty(...)`) -- the literal now binds as a VALUE, so a static call through a keyword type resolves against Standard.Type's instance members and misses
      - [x] as `void` value when target type is void/optional (void value literal) -- the trichotomy in BindTypeLiteral: unit value on a void target, absence on an optional target, type literal otherwise
  assignment:
    - [~] simple assignment (`=`) -> result type is target type; bind RHS with target-type context -- MISSING: the result type only, which is value.Type rather than the target's. The RHS IS bound under the assignment target's type now, which is what lets a target-typed new stand on the right of one
    - [~] void-coalescing assignment (`??=`) -- binds as AssignmentExpression with IsCoalescing, RHS targeted at the non-void portion, emitted as C# ??= (order 79). MISSING: flow narrowing of the target afterwards (order 79's open task); the statement-only and mutable-target rules are analyzer work
    - [ ] note: assignable-target validation is a CHECK (out_of_scope); binding still resolves target/value/result -- informational; target, value and result are all resolved, modulo the result-type issue above
  operators:
    # No operator RESOLUTION exists at any precedence level. OperatorsList is populated in
    # Phase 2 and Operator.MapOperatorName synthesizes op_Addition and friends, but
    # nothing in Binding/ ever queries it. InferBinaryResultType returns left.Type for
    # every operator, including the comparisons, with an in-code "Should be Boolean" note.
    - [x] void-coalescing (`??`) -- folds into CoalesceExpression per link; the result is the left type's non-void portion and the right operand binds against it (order 79)
    - [~] logical or / and (`||`, `&&`) -> bool -- MISSING: the bool result. Folds correctly into BinaryExpression; result type is left.Type
    - [~] equality (`==`, `!=`) -> operator resolution + bool result -- MISSING: both. Folds into BinaryExpression; result type is left.Type
    - [~] relational comparison (`<`, `>`, `<=`, `>=`) -> operator resolution + bool result -- MISSING: both, as with equality
    - [ ] additive / multiplicative (`+ - * / %`):
      - [ ] builtin numeric common-type (widening ranks: sbyte<byte<short<ushort<int<uint<long<ulong<float<double<decimal) -- no rank table exists; the arithmetic arm returns left.Type
      - [ ] string concatenation (`+` with a string operand -> string) -- MapOperator always yields Add. BinaryOperatorKind.Concatenate exists in the enum but is never assigned; `"a" + 1` types as string only incidentally, because left.Type happens to be string
      - [ ] user-defined operator overload resolution (search BOTH operand types, left-operand tiebreak)
    - [~] unary negate (`-`), logical not (`!`) -> operator resolution (builtin + user-defined) -- MISSING: all resolution. Both produce UnaryExpression with result type operand.Type
    - [ ] resolved operator symbol recorded as an intrinsic property of the bound binary/unary node -- the nodes carry only a kind enum, with no Method/Operator field
  cast_and_as:
    - [~] CastExpression `(T)x` -> target type; classify conversion (see conversions) -- the node IS bound (OperatorBinder resolves the target through the full type-ref path and records CastOperatorSelection's choice on the CastExpression -- the called operator, or the tie -- typing the cast as that operator's return type), and newtype casts ride it as plain C# casts against the emitted wrapper's operators (order 86). Validation is analysis order 4's CastAnalyzer. MISSING: the conversion kind is not stored on the node
    - [x] enum cast is fallible -> result type `Enum | void` -- OperatorBinder.CastResultType lifts a cast to an enum from any value not already that enum, and CastExpression carries TargetType beside Type. A cast is sugar for the enum's lookup function, `(underlying) -> Enum?` (enums spec Requirement 15); CastExpression.LookupParameterType is that parameter, which analysis order 4 judges the operand against. Before this, `Tier t = (Tier)7;` compiled and threw NullReferenceException
    - [ ] AsExpression `x as T` -> classify as provable (identity/widening) vs runtime-checked (narrowing/union-extraction/unknown-narrowing); store the classification on the node -- BindRelational is now a switch with an `is` arm (order 90), but AsExpressionRelationalNode still falls to its `default:` and becomes UnresolvedExpression
  postfix:
    - [~] MemberAccessSuffix (`.name`) -> instance/static member type -- MISSING: a resolved SYMBOL (the node carries only a string MemberName) and the base chain. Static/instance enforcement IS done, by splitting the request rather than resolving and then rejecting. ConstructedType receivers ARE handled: the receiver is unwrapped to its definition for the lookup and the definition's type arguments substituted into what it found, so `list.Count` and `arr.Length` resolve. A Newtype receiver forwards to its source (TypeMemberLookup.EnqueueBases walks SourceType as a pseudo-base, order 86) and a TypeAlias can no longer BE a receiver type (expansion at resolution, order 84). A TupleType or NamedTupleType receiver DOES resolve, through TypeMemberLookup.FieldsOf rather than through MemberType -- `pair.Item1` off the synthesized positional fields, `point.x` off the per-name aliases a NamedTupleType layers on. EnumType and UnionType receivers still yield ErrorType
    - [x] OptionalMemberAccessSuffix (`?.name`) -- member looked up on the receiver's non-void portion, result lifted flattened, IsConditional on the bound node (order 79)
    - [~] MethodCallSuffix (`.name<T>(args)`) -> method resolution + overload + return type -- INFERENCE THROUGH AN OPTIONAL PARAMETER IS DONE (2026-09-15): `Take<T>(T? value)` called as `s.Take(3)` answers T = int, where it was MIST_PM_TYPE_ARGUMENTS_NOT_INFERRED and classic ran it. TypeArgumentInference.Match peels an optional declared type to its PRESENT constituent and matches the argument against that, taking the argument's own present constituent too, so an `int?` argument answers int rather than `int | void`. Deliberately the optional alone -- reading a general union's constituents is a wider question the caller settles by stating the argument (type-argument-inference Requirement 3) -- and a `void` argument is passed over at the argument level, since a void literal takes its type FROM the slot it fills and matching it would fix T to itself and emit it unbound at the call. samples/OptionalTypeParameters banks it, byte-identical on both pipelines; InferenceThroughOptionalsTests holds the two refusals, which no sample can. THE EMITTER HALF LANDED 2026-09-19 (emitter register order 76): a generic method whose own parameters appear in an optional or union no C# generic can spell is emitted once per call, so an ABSENT argument now reaches it too. The call's type arguments are recorded in Model/GenericCallRegistry for that. TypeArgs is resolved and suppresses inference; a generic callee without them has them inferred from the arguments. Overload resolution closes each candidate, filters by arity and applicability, takes the best, and records both the choice and its type arguments on the call. The return type is read through the winner's substitution, so `var` binds concretely
    - [x] OptionalMethodCallSuffix (`?.name(args)`) -- same projection through a conditional method group; the invocation lifts the selected overload's return type (order 79)
    - [~] InvocationSuffix (`(args)`) -> call on method group / Func / delegate value -- MISSING: the delegate case. A method-group receiver now selects an overload and takes ITS return type; a non-group receiver still falls back to receiver.Type, which is WRONG for a delegate value: invoking a Func<int,int> local yields the Func type, not int
    - [~] IndexSuffix (`[i]`) -> indexer resolution / array-element / span-element / slice -- MISSING: index typing for an intrinsic indexer (analysis order 5 judges a user indexer's index only). THE GET/SET DISTINCTION IS DONE (2026-09-15), judged in analysis rather than decided here: selection still reads the index alone, since C# selects before it refuses and a sibling that has the accessor must not rescue the indexer the index picked. Nothing records direction on IndexExpression, as nothing does on PropertyReferenceExpression: the assignment holding the index as its target says which it is, and AnalysisContext.DirectionOf is the one place that is derived -- read, write, or both for `??=`. AccessorAnalyzer (analysis order 9) refuses a read of an indexer or property with no getter as MIST_PA_NO_GET_ACCESSOR and a write with no setter as MIST_PA_NO_SET_ACCESSOR, where both used to reach Roslyn as CS0154 and CS0200. OVERLOAD RESOLUTION IS DONE (2026-09-15): Construction/Binding/Expressions/IndexBinder.cs hands the receiver definition's IndexersList to OverloadResolution.Select, the selector calls use, through IOverload, which Method and Indexer share; the resolved symbol is recorded as IndexExpression.Indexer and its parameter, substituted through the receiver, as IndexExpression.ParameterType. A failed selection is refused as a call is -- MIST_PM_NO_APPLICABLE_OVERLOAD, MIST_PM_AMBIGUOUS_OVERLOAD, MIST_PM_UNRESOLVABLE_OVERLOAD, naming `indexer 'Table.this[]'` -- and a from-end index no indexer takes as it is, like a list pattern's positional element, selects as an int position. Before, IndexersList[0] won: over `int this[int i]` and `string this[string s]`, `string s = t["x"]` was typed int and refused on both pipelines. Array and span element access DO work: the receiver is unwrapped from a ConstructedType and a TypeSubstitution is applied from its definition, and Array.mist/Span.mist declare the intrinsic indexer. An indexer on a user-declared generic type works by the same path -- `items[0]` on a `List<T>` answers T. THE ARGUMENT'S TYPE NOW ASKS THE QUESTION (order 124): ResolveIndexerType became ResolveElementAccessType and the classification moved to Construction/Binding/Indexability.cs so PatternBinder can reach it too, a list pattern needing one receiver's element type and slice type at once. A range argument answers the SLICE type -- for an array, ConstructArray with a null length, since `numbers[a..b]` has no statically known length -- and anything else answers the element type, so `numbers[1..3]` is int[] where it used to be int. Only the range path reports (MIST_PM_RECEIVER_NOT_SLICEABLE); an index that resolves nothing stays silent as before, a missing indexer being a member that might simply not be declared. STILL MISSING on the slice side: span, a Range-accepting indexer, and countable-plus-`Slice(int,int)`, none of which any type in the repository declares -- and Standard.String has no indexer at all, so it is sliceable but not indexable, which is backwards
    - [x] SwitchExpressionSuffix (`switch { arms }`) -> see patterns.switch_expression -- bound since order 95; the receiver the fold accumulated is the scrutinee, already bound
    - [ ] SpreadSuffix (`...`) -- not previously listed here; also falls into BindPostfixSuffix's `default:`
  object_creation:
    - [~] ObjectCreationExpression (`new T<...>(args) { init }`) -> constructor overload resolution -- MISSING: the initializer form only (present initializer -> UnresolvedExpression). GENERICS WORK: node.TypeArgs is resolved, the definition looked up under its arity-bearing name, and the constructed type interned, so `new List<int>()` binds. The constructor is selected and recorded on NewExpression, through the same resolution methods use
    - [ ] ObjectCreationExpressionNoArgs (`new T<...> { init }`) -- no case in BindPrimary
    - [~] TargetTypedNewExpression (`new(args) { init }`) -> type from target context; ctor resolution -- MISSING: the initializer-block form only, which stays unresolved until order 64. The bare `new(args)` takes the target type and selects its constructor through the same OverloadResolution methods use. Refuses rather than guesses in two shapes: nothing to target, and a target that is not a class or struct
    - [ ] TargetTypedNewExpressionNoArgs (`new { init }` via initializer)
    - [ ] AnonymousTypeExpression (`new { Name = e, projection }`) -> synthesized anonymous type (explicit + projected properties; name inference; duplicate detection)
    - [ ] property initializer block (NamedPropertyAssignment + CollectionElementAssignment) -- its presence is what forces ObjectCreationExpression to the sentinel
  arrays_and_spans:
    - [x] ArrayCreationExpression (`new T[n]`) -> array type (known length if literal size). Named elements share ScopeResolver.ResolveNamed with ordinary type references, including qualified names, generic arguments, transparent aliases, interning and direct constraint closures. NamedAllocationElementTypeTests pins the model; NamedAllocationElements is banked in AllFeaturesV2
    - [x] StackallocExpression (`stackalloc T[n]`) -> span type, readonly from target context. Named elements use the same resolver as array creation and ordinary type references. Integer literal sizes preserve the interned dependent length; computed sizes retain an unknown Int32 value length. StackallocLengthInferenceTests pins both span families and the size expression
    - [x] Stampable allocation elements retain actual generic arguments for structural proof. Stampability substitutes receiver and enclosing arguments without mutating the interner, inspects inherited and property backing storage, and accepts stored type parameters with an explicit stampable bound. Grammar/model retain the independent declaration guarantee and constraint kind; closing records preserve existing constraints while exposing open stampable forwarding and constrained aliases. Declaration validation and allocation refusal belong to the analysis register; samples/StampableTypes exercises emitted generic allocation. ConstructedStampabilityTests and StampableConstraintTests hold substitution and closing proof; full solution ledger 20260926-152727 passed 7681/7681 with zero build warnings/errors and formatter verification passed
    - [ ] Imported CLR stampability inference -> ambient projection needs complete private/backing-field storage metadata and an unknown-layout state for opaque reference assemblies, together with deliberate handling of the implicit System.ValueType base. Arbitrary imported structs currently remain conservatively non-stampable; source structs, intrinsic primitives and supported tuples are covered
    - [x] EmptyArrayLiteralExpression (`[]`) -> element type from target context -- GRAMMAR MISMATCH: there is no such alternative. Mist.storm has one ArrayLiteralExpression with elements:ArrayElementList?, and the implementation correctly treats `[]` as that rule with a null list, supplying the element type from the target and reporting EmptyArrayLiteralNeedsTargetType when there is none
    - [~] ArrayLiteralExpression (`[a, b, ...]`) -> element type via best-common-type -- MISSING: best-common-type. Elements bind against the target ELEMENT type and the length is known, but CommonElementType is a ReferenceEquals uniformity check that reports ArrayLiteralNoCommonElementType on any difference, because no widening infrastructure exists yet
  tuples:
    - [x] TupleLiteralExpression (named + unnamed elements) -> tuple type, interned, names as use-site metadata on the expression node (order 100). Wrapping the names into the type would make one interned tuple per spelling; a DECLARATION site is the asymmetric case and does wrap. Elements bind against the target tuple's elements one position at a time, and a target of another arity supplies no element target at all
    - [x] tuple element access (`.Item1`, named element) -- resolved by TypeMemberLookup.FieldsOf, which has both a TupleType arm (the synthesized positional fields) and a NamedTupleType arm (positional plus one alias per named element). ResolveMemberType is not the path taken; nothing here goes through MemberType. THIS LINE PREVIOUSLY CLAIMED THE OPPOSITE and was already stale when order 100 opened -- TypeMemberLookupTests covered both readings and passed
  parenthesized_and_default:
    - [x] ParenthesizedExpression -> inner type -- the parens are erased and the inner type flows through
    - [ ] DefaultExpression (`default(T)`) -> T -- no case in BindPrimary
    - [ ] DefaultLiteralExpression (`default`) -> type from target context -- no case in BindPrimary
  local_functions:
    # NET-NEW on 2026-09-11, from .kiro/specs/local-functions: a function declared as a statement,
    # at file top or in any block.
    - [x] LocalFunctionDeclaration (statement) -- LocalFunctionBinder, emitter order 187. Declared for a whole statement list before the list is bound (BodyBinder.BindList), so the name is hoisted; the body binds where the statement is reached, in a BodyScope of its own, as an async context iff `async`, with EnclosingMethod set to the function. The model holds a Method with no declaring type on Model/Statements/LocalFunctionStatement.cs beside the parameter locals
    - [x] calls -> BodyScope answers a MethodGroupResult of one candidate, so PostfixBinder.BindInvocation selects, settles and auto-awaits as for a method; a bare name converts to a func value through MethodGroupConversion
    - [x] modifiers -> ModifierBuilder; accessibility admitted and meaningless, `static` and `async` kept, every other refused (MIST_PM_LOCAL_FUNCTION_MODIFIER); type parameters refused (MIST_PM_LOCAL_FUNCTION_GENERIC); a parameter `where` resolved by ConstraintResolver as on a method
    - [x] duplicates -> two functions of one name in a scope (MIST_PM_DUPLICATE_LOCAL_FUNCTION); a local declared after a function of its name (MIST_PM_DUPLICATE_LOCAL, since the function was hoisted first)
    - [ ] a return ownership specifier, `with` clauses and attributes are not in the rule and fail to parse at the enclosing member (MIST_PARSE_INCOMPLETE), as the spec records
  lambdas:
    # NET-NEW: no prior body binding to lean on. Specify from the first-class-functions
    # / delegate-func-conversion / func-async-auto-await-fix specs.
    #
    # THE ONE LINE THAT BLOCKED ALL TEN is gone. ExpressionBinder.BindExpression used to open with
    #   var assignment = expression.AsAssignmentOrNull(); if(assignment is null) return new UnresolvedExpression(...)
    # which turned every lambda into a sentinel before any lambda-specific code could run. The dispatch
    # now tests LambdaForm FIRST, ahead of the assignment unwrap, which is also the grammar's ordering:
    # a lambda binds looser than everything, so `x => a = b` is a lambda whose body assigns.
    - [x] LambdaExpression BlockLambda + ExpressionLambda -- LambdaBinder, orders 104-105. Both bodies are kept in separate slots on Model/Expressions/LambdaExpression.cs, exactly one set, because they are different C# forms rather than one form spelled two ways
    - [x] parameter lists: ParenthesizedLambdaParams (typed + untyped) + SingleImplicitParam -- all three, normalized to a (name, optional type ref, node) triple so no AST node has to be fabricated for the bare-identifier form
    - [x] target-type-driven parameter inference -- from a structural FunctionType, positionally. NOT from Func or a DelegateType: `Func<params TArgs, TResult>` needs type packs (orders 149-153, missing), so the model type is structural and interned, and the CLR family is chosen at emission. A parameter is typed by its annotation or by the target and by nothing else -- inferring it from the body would be circular, the body being what the parameter's type is read against
    - [x] explicit-typed-parameter lambdas without target type -> construct the function type from the annotations plus the inferred result
    - [x] body binding in a child scope; return-type inference (expression body, or collect block returns -> common type) -- the block is bound BEFORE the type is known, which is what lets the result be read off its returns. The walk does not descend a NESTED lambda, whose returns answer to it instead. A body returning nothing is void; returns that disagree are refused
    - [~] `static` and `async` lambda modifiers -- static is carried and emitted, and C# enforces the capture ban (CS8820) against the generated file; reporting it against Mist source is analysis-phase work, see order 107. ASYNC is PARKED rather than ignored: the modifier changes what the body's type means, so binding it synchronously would answer confidently with the wrong result
    - [ ] async lambda return-type wrapping (-> Task<T>) -- the async layer's, orders 169-175
    - [x] method-group -> delegate / Func conversion (single-overload selection against target) -- order 108, at the point PostfixBinder already had for reporting an unconsumed group. Selection is by IDENTITY per position, the CLR's rule for binding a delegate rather than for passing an argument, so a method taking an int does not convert to a `func<long, ...>`. A generic method is declined, its type arguments being inferable only from the target
    - [ ] closure-capture analysis (record captured symbols for the future emitter) -- not needed for capture to WORK: a lambda body binds in a scope chained to the enclosing one, so a captured name resolves to the very same LocalVariable and nothing copies (order 106). A recorded capture set is what an analyzer would need, which is the same thing order 107's rejection wants
    - [ ] a target that is a UNION over a function type, which `func<int, int>?` is: `func<int, int>? f = x => x + 1;` is MIST_PM_LAMBDA_PARAMETER_NO_TYPE on v2 (measured 2026-09-20, order 104's suffixes), the target-type walk reading a UnionType and stopping. Classic runs it. The rule to specify is which constituent a lambda is targeted by when several are function types of its arity -- one is the obvious answer and two is a refusal, neither of which is written anywhere yet. Going through a typed local (`func<int, int> plus = x => x + 1;` then assigning) works today
  arguments:
    - [~] ValueArgument -- MISSING: nothing for the value case itself; argument expressions bind in both BindArguments overloads. Listed partial because it shares GetAllExpressions() with the ref case below
    - [ ] RefArgument (`ref x`) -- ref-ness is ERASED. Generated/ArgumentListNodeExtensions.cs unwraps RefArgument and ValueArgument to the same ExpressionNode, so the bound tree cannot distinguish `f(x)` from `f(ref x)`. That file's own header calls itself a shim until it handles ref arguments
    - [~] argument binding threads parameter types as target types (lambdas, void literal, default, target-typed new) -- MISSING: the case where SEVERAL candidates share an arity, which is circular -- a parameter can target an argument only once the overload is known, and the overload is chosen from the argument types. ArgumentBinder pushes the parameter type where exactly one candidate matches by arity, and pushes NULL otherwise, which also stopped an enclosing target type leaking into an argument list it had nothing to say about
  ranges_and_indices:
    # Both were in the grammar all along and both degraded to the sentinel. Orders 123-124 closed them.
    - [x] RangeExpression (`a..b`) -- RangeExpression, typed Standard.Range (order 123). Both bounds are nullable and null means source OMITTED the bound, never a substituted edge value: C# spells an omitted bound by writing nothing, so `..2` and a bound that happens to equal zero are different code. The grammar had already made this structural -- the `Range` tier sits between Multiplicative and Unary with both bounds `Unary?`, which is where C# ranks `..` too, so omittable bounds and a nested from-end bound needed no arranging. Emission goes through EmitSubExpression at prefix precedence, so v2 writes `1..^1` where classic writes `1..^(1)`
    - [x] FromEndExpression (`^x`) -- UnaryExpression with UnaryOperatorKind.FromEnd, typed Standard.Index (order 123). THE ONE ARM IN BindUnary THAT DOES NOT ANSWER WITH ITS OPERAND'S TYPE, because `^1` is an offset from the end and not the integer 1, and an element access has to tell a position from a count. Standard.Index and Standard.Range already existed as intrinsic structs in Bootstrap and needed only WellKnownTypes entries. NO SAMPLE CAN OBSERVE THE TYPING -- answering with the operand's type instead fails two model tests and leaves the AllFeaturesV2 baseline green, since `^1` emits identically either way

# =============================================================================
patterns:
# =============================================================================
  # Used by `is` expressions and switch-expression arms. Binding introduces pattern
  # variables and computes the narrowed type; exhaustiveness is a CHECK (out_of_scope).
  #
  # THE `is` ENTRY POINT IS OPEN (order 90). Model/Patterns/ holds the hierarchy -- an abstract
  # Pattern carrying NarrowedType and Binding, with TypeTestPattern and CatchAllPattern under it --
  # and PatternBinder walks the grammar's or/and/unary/primary chain. Binding is singular per
  # pattern node ON PURPOSE: a property or tuple pattern's several binders live on its subpatterns,
  # so multiplicity comes from the recursion and no list is needed here.
  #
  # BOTH ENTRY POINTS ARE NOW OPEN -- `switch { }` since order 95, through a BindPostfixSuffix arm. A
  # pattern form not yet carried answers null from PatternBinder, which parks the whole `is` or the whole
  # switch as UnresolvedExpression rather than half-binding it.
  #
  # WHETHER A BINDING MAY BE INTRODUCED travels down the walk as a flag (orders 91-92). `or` and `not`
  # clear it and a binding attempted under either is reported, because matching there establishes no
  # value for the name -- and left alone the local would be declared in the guarded block's scope while
  # emission wrote no C# pattern to produce it.
  combinators:
    - [x] OrPattern / AndPattern -- DisjunctionPattern and ConjunctionPattern, both FLAT lists however source grouped them. Operands come from GrammarRepetition.LeadAndRepeated, which is Left plus the whole repetition array: the generated Right slot holds the LAST repeated operand AND appears in the array, so a fold reading Left and Right drops the middle operand of a three-way chain, as the classic emitter's EmitOrPattern does. Order 103 gave that walk a sibling for rules with TWO required operands and moved both into one file, the difference between them being exactly what a caller gets wrong. A conjunction narrows AS IT GOES -- each operand binds against what its predecessors proved, matching how C# narrows and therefore matching the C# emission hands it. A disjunction narrows to the scrutinee and NOT to the union of its operands, because interning that union would add a carrier struct to __Unions.g.cs for a type the program never names
    - [x] UnaryPattern: NotPattern / DirectPattern -- NegatedPattern narrows to the scrutinee and keeps no binding, both because failing a test establishes nothing positive. DirectPattern passes through to the primary
    - [x] ParenthesizedPattern -- NOT modelled, deliberately: it binds to whatever it wraps and emission re-derives the parentheses from pattern precedence (or < and < not, which Mist and C# rank identically). Same treatment the expression side gives source parens
  primary_patterns:
    - [x] TypePattern (`T name`) -- TypeTestPattern, resolved through the full type-ref path so a constructed generic keeps its type argument. GRAMMAR NOTE, and it is load-bearing: the rule is name:(IDENTIFIER | DISCARD), so `T _` is a TypePattern carrying a discard TOKEN, not a DiscardPattern -- PatternBinder separates the two readings on the token's kind, and reading it the other way would drop the type test
    - [x] BareTypePattern (`T`) -> type test -- TypeTestPattern with no binding. A DOTTED name reads as an enum VARIANT first, because a Mist variant is a value and names no type: `Direction.North` binds to the same ComparisonPattern a constant pattern does, carrying the MemberAccessExpression that `Direction.North` binds to in expression position. Tried BEFORE type resolution and through the scope's own Lookup, since ScopeResolver.ResolveNamedType reports what it cannot find -- the fallback ordering would report an unresolved type alongside a correctly bound pattern. Read off the QUALIFIER rather than the scrutinee, so a variant of another enum is not accepted by name and an `unknown` scrutinee is not refused; a dotted nested TYPE (`Outer.Inner`) still binds as a type test
    - [x] VarPattern (`var name`) -> binds scrutinee's static type -- CatchAllPattern. The static type, not the runtime one, so on an `unknown` scrutinee the binding is honestly still un-narrowed
    - [x] DiscardPattern (`_`) -- CatchAllPattern with no binding, the same kind `var _` binds to. Emitted as `var _`, valid C# where a bare `_` is not
    - [x] relational patterns (`< > <= >=` const) -- ComparisonPattern, the same kind a constant pattern binds to; the bound is a full expression through OperatorBinder.BindVoidCoalescing, since the grammar admits one there. Narrows nothing: a value test says nothing about which type holds the value
    - [~] ConstantPattern (int / float / string / char / regex / true / false) -- ComparisonPattern with ComparisonKind.Equal, so a constant pattern is not its own kind. All five primitive forms bind through LiteralBinder, whose entry points now take a lexeme rather than a node so ConstantLiteralNode and PrimaryNode share the suffix and quote parsing. MISSING: regex, the one alternative that answers null -- a regex test is not a C# pattern at all (classic lowers it to Regex.IsMatch) and belongs with the regex layer
    - [x] PropertyPattern (`Type? { sub: pat, ... } name?`) -- PropertyPattern retains an optional TypeTestPattern and whole-value Binding alongside its subpattern bindings. The leading QualifiedIdentifier resolves through type lookup and explicit alias expansion, including closed generic aliases; its tested type is the receiver for MemberResolution.ResolveStorage and the whole binding. Untyped patterns use the non-void scrutinee type. Type tests retain union constituents and refinements through BindTypeTest. PropertyPattern precedes BareTypePattern in the grammar, and Storm consumes optional token alternatives so the trailing name/discard parses without changing the shared Token? AST API. Conditions and switch arms supply the binding scope; LocalNames registers whole and member names separately and gives condition headers their own C# naming scope. BodyWalker visits the retained type test, PatternAnalyzer judges it, and flow binds the whole value only after type and member matches succeed. Parser/model/scope/flow/direct-emitter and batched in-process runtime coverage pins both target forms, null/type failures and getter short-circuiting. New generic-pattern spelling and unknown-member behavior remain outside this change.
    - [x] TuplePositionalPattern (`(p, p, ...)`) -> per-element scrutinee types -- TuplePattern (order 103). Elements come from GrammarRepetition.TwoLeadsAndRepeated: a tuple has TWO required operands before its repetition, so the combinators' Left-plus-array walk is WRONG here and would drop the second element. TuplePattern.TestedType records whether matching must type-test the tuple at runtime or only read its elements out, which is decided by whether the scrutinee is statically a tuple and is two different C# constructs rather than two spellings of one. Where it is not, the tuple to test is read off the element patterns' narrowed types and the whole `is` PARKS if any of them narrows to nothing nameable -- `u is (0, 0)` says the elements equal zero and not which tuple holds them. Arity against a statically-typed tuple, and a scrutinee that is neither a tuple nor `unknown`, are both refused at construction
    - [x] ListPattern (`[ ... ]`) with slice element (`.. name`) -- ListPattern with a ListPatternElement per position (order 125). ONE PATTERN, TWO SCRUTINEE TYPES, which is what separates it from TuplePattern and why it needs order 124: a positional element is scrutineed by the element type and a slice by the SLICE type, so `[var first, .. var middle, var last]` types first and last as int while middle is int[]. Elements come from GrammarRepetition.LeadAndRepeated, and both optional grammar slots are optional RULE references, so `[]` and a bare `..` both arrive. Keeps no binding of its own -- the grammar spells no trailing name here at all, so every binder lives on an element, the slice included. NO MINIMUM LENGTH IS COMPUTED: C# derives it from the pattern's shape, so restating it would be a second authority. A second slice is refused, since it leaves undetermined which elements count from the front. An `unknown` scrutinee is REFUSED where a tuple pattern type-tests one, and that asymmetry is C#'s -- `[...]` is the only list-pattern spelling C# has and it needs a countable scrutinee, so there is no type to name ahead of it. With this arm every one of PrimaryPattern's thirteen alternatives binds, so BindPrimary's `default:` is unreachable from any spelling
  variable_binding:
    - [x] introduce pattern variables into the correct scope -- StatementBinder.BindConditionInto builds the guarded block's BodyScope BEFORE the condition and binds the condition into it, so a binding reaches the rest of its own condition and the block, and neither the else nor anything after. That ordering is the whole point -- it is what makes `x is Foo f && f.Bar` expressible, where hoisting the binding into the branch does not. PostfixBinder.BindArm does the same for a switch arm; see switch_expression below. A NESTED binder needs nothing further, a property pattern's subpatterns declaring into whatever scope the caller put in effect
    - [x] named-tuple element destructuring binds each named element (C#-style; whole-binding uses unnamed tuple type) -- order 103. The GRAMMAR hands `(int x, int y) whole` over as a TYPE pattern, not a tuple pattern: `(int x, int y)` is a valid TupleSingleTypeRef and TypePattern is the earlier alternative, so the element names arrive as names on a NamedTupleType. PatternBinder lifts them into locals, one CatchAllPattern per element at that element's type, and the whole-value binder is typed by the UNDERLYING tuple so `whole.x` deliberately does not resolve while `whole.Item1` does. THIS IS WHERE Pattern.Binding BEING SINGULAR PER NODE IS FIRST TESTED AT THE NODE LEVEL -- three names, one of them this node's own and two on its subpatterns. bindingsPermitted reaches all three: under `not`, all three are refused
  switch_expression:
    - [x] SwitchArm: pattern + optional `when` guard (bound at VoidCoalescing precedence) + result expression -- Model/Expressions/SwitchExpression.cs holds SwitchExpression and SwitchArm. The guard goes through OperatorBinder.BindVoidCoalescing, matching the grammar's floor, and binds with the target type pushed AWAY: a guard is a condition, and the type the switch is expected to produce is the one thing it is not. Recorded only where written, which is the shape order 97's coverage rule will read to tell a guarded arm from an unguarded one
    - [x] arm scope holds the arm's pattern variables -- PostfixBinder.BindArm swaps ctx.Scope to a fresh BodyScope around the arm, built BEFORE the pattern binds into it, so bindings reach that arm's guard and result and nothing else: not a sibling arm, not a sibling's guard, not after the switch. Two arms may reuse a name because neither declares into shared ground
    - [~] result-type unification across arms (best-common-type / common base) -- a TARGET type wins outright when one is in effect, leaving assignability to Roslyn as everywhere else. With no target the arms must agree by interned identity, following LiteralBinder.CommonElementType's precedent, and an arm whose result failed to bind is skipped rather than compared so its failure is not re-reported as a disagreement. MISSING: best-common-type proper, which needs the conversion and numeric-promotion infrastructure nothing here has yet -- so `1 or 2 => 1, _ => 2L` reports instead of widening to long

# =============================================================================
name_and_symbol_resolution:
# =============================================================================
  # All part of the one clean-room binder; specify from the grammar and the
  # method-overloading / type-argument-inference / extension-method-binding specs.
  members:
    - [~] member lookup on a receiver type (instance vs static) -- MISSING: symbols and enforcement. ResolveMemberType picks the right lookup type (ReferencedType for a TypeReferenceExpression receiver, else receiver.Type) but returns a TYPE, never a symbol, and never checks that the member's staticness matches the receiver form
    - [ ] base-chain walk for classes and structs (inherited members) -- ConcreteType.BaseType and MemberType.BaseAbstractTypes are populated in Phase 2; neither ResolveMemberType nor FindEnclosingField follows them
    - [~] ConstructedType member lookup with type-parameter -> type-argument substitution -- MISSING: only inherited METHODS. Member access, indexers and call return types all unwrap the receiver to its Definition and apply a TypeSubstitution built from it, which OWNS the parameters it answers for: the definition's own list is consulted, so a method's type parameter sharing an ordinal with the enclosing type's is no longer answered out of the receiver's arguments. Substitution is also RECURSIVE, so a member typed `List<T>` on a `Box<int>` is a `List<int>` rather than staying open. A field or property inherited from a GENERIC base now resolves and is substituted: TypeMemberLookup records the ConstructedType bases it stepped through on FieldResult and PropertyResult, and TypeSubstitution.ForMember folds them over the receiver's map, resolving each hop's arguments through the map built so far so `StringPair -> Pair<string> -> Box<A>` binds Box.T to string and not to Pair.A. Keying on parameter IDENTITY rather than name and ordinal is what makes a RENAMED or REORDERED base parameter work, which is where classic answers wrongly. An inherited METHOD is still withheld -- a group spans every depth and MergeMethods flattens across them, so one substitution per group would be wrong
    - [ ] constrained type-parameter member access (via abstract / base-class constraints)
    - [ ] associated-type-slot member access -- Model/TypeSlot.cs exists from Phase 2; binding never consults it
    - [ ] default-method-in-abstract fallback (Rust-style defaults callable on the concrete type)
    - [~] special-cased member access: tuple (ItemN + named), anonymous type, enum member, array (.Length/.AsSpan), span (.Length/.Slice), string -- TUPLES ARE DONE, and not as a special case in the member-access path: TypeMemberLookup.FieldsOf answers for both TupleType and NamedTupleType, so the ordinary lookup finds them. The rest have no special cases. `string` works only incidentally, because Standard.String is a ClassType with declared members; array and span do NOT, because they are ConstructedTypes and hit the gap above even though Array.mist declares `intrinsic public Int32 Length`
    - [x] type-alias transparency (unwrap before member lookup) -- satisfied by construction rather than by an unwrap: since order 84 an alias never survives resolution (chains complete on demand, AliasedType is never another alias), so no receiver is ever alias-typed and member lookup needs no arm
    - [~] union projection for member access (`T | void` -> member resolved on T) -- CONDITIONAL access projects and lifts (order 79); a PLAIN `.` on an optional receiver still resolves nothing (UnionType is not a MemberType -> ErrorType), and refusing that spelling with "use ?." is analyzer work
  methods_and_overloads:
    - [~] method-group collection (own scope + inherited + ambient) -- MISSING: ambient/extension methods, which never enter the group. Inherited ones DO: CandidateSet.MergeMethods spans the base chain nearest-first and shadows by signature, so a derived override hides the base and a different signature accumulates. Both consumers now carry the group through to the call rather than discarding it
    - [~] overload resolution (applicability, most-specific, left-operand tiebreak, ref exact-match filtering, non-generic preference) -- OverloadResolution.Select runs arity -> closing -> applicability -> pairwise betterness (exact over converted, then narrower target, then non-generic over generic). ConversionRelation covers identity, implicit numeric widening, inheritance and union containment (order 77: constituent -> union and union -> covering union, with exact-beats-union ranking falling out of the containment comparison). MISSING: the left-operand tiebreak, ref exact-match filtering, and conversions outside that relation -- user-defined casts, tuples, variance. Non-generic preference is DONE, and was not optional once generic candidates could be closed: closing makes a generic signature identical to a non-generic sibling's, so `Tag<U>(U)` beside `Tag(int)` tied for `Tag(3)` and the call was refused as ambiguous between a method and its own specialisation. Every failure is now reported rather than guessed at -- no arity match, wrong stated type-argument count, undetermined type arguments, no applicable candidate, or a tie
    - [x] resolved method symbol recorded as an intrinsic property of the bound call node -- InvocationExpression.Method and NewExpression.Constructor. Null on each means "no member was resolved" rather than "not implemented": invoking a delegate value selects nothing, and a type declaring no constructor has nothing to select
  generic_inference:
    - [~] generic method type-argument inference (unify parameter types against argument types) -- MISSING: unification against a BASE of the declared parameter type, so `F<T>(IEnumerable<T>)` called with a `List<int>` answers nothing; it requires the same definition. Gated on the base-chain walk above. Matching descends a construction, so T is read through a `List<T>` parameter, and arrays come through the same arm. A parameter answered twice takes the widening answer -- `F<T>(T, T)` on `(1, 2L)` gives long -- but two answers neither of which converts keep the earlier one and let applicability eliminate the candidate, where C# rejects the call itself
    - [x] lambda arguments deferred during applicability (wildcard until overload selected) -- 2026-09-25, emitter order 55. A lambda in a slot the call has not closed -- several candidates of the arity, or a sole GENERIC one whose type arguments are not stated -- is an UnboundLambdaExpression until selection is done, and a method group in the same slot is left to the call -- the group that IS the argument, never one nested in it (a `??` operand, a switch arm), which converts against its own target. Inference reads the ordinary arguments first, then types each callable once the parameters its inputs mention are fixed, and its result teaches the rest; applicability binds the lambda under each closed candidate with diagnostics withheld and registries discarded (LambdaTrials, ProgramModel.Discarding). The binding that stays is made after selection against the chosen parameter, so it is the binding the call stating its type arguments makes
    - [x] substitute inferred type args into the return type -- OverloadChoice carries the winner's substitution, receiver's arguments and the method's own together, and the call's type is the return type read through it. This is what makes `var` bind concretely; it used to take the unsubstituted parameter and emit it where C# wanted a type
    - [x] explicit type arguments path (`.m<T>(...)`) + arity checks -- both spellings: the bare-identifier form GenericInvocationExpression (`f<int>(x)`, a distinct Primary alternative) reaches PostfixBinder.BindGenericInvocation, and MethodCallSuffix.TypeArgs is resolved on the suffix form. Stated arguments suppress inference entirely, candidates are filtered to those declaring that many type parameters, a count matching none reports MIST_PM_TYPE_ARGUMENT_COUNT_MISMATCH, and they close the target each argument binds against, so a lambda passed to `Apply<int, string>(...)` is a `func<int, string>` (emitter order 55)
    - [x] inferred type args recorded as an intrinsic property of the bound call node -- MemberAccessExpression.TypeArguments and MethodReferenceExpression.TypeArguments, and the emitter STATES them rather than leaving Roslyn to infer again. Recorded for the same reason InvocationExpression.Method is: emission otherwise re-derives the call, so nothing distinguishes a correct inference from no inference followed by a lucky one. Measured -- suppressing the emission leaves all 4647 tests green, so today nothing does distinguish them
  extensions:
    # Grep for Extension across Construction/Binding/ returns nothing: the registry built
    # in Phase 2b (Scaffolding/ExtensionBuilder.cs, Model/ExtensionBlock.cs) is never
    # consulted during binding.
    - [ ] extension-member binding via the extension registry (already built in Phase 1/2)
    - [ ] applicability + specificity ordering; ambiguity diagnostic
    - [ ] namespace-visibility filtering (only imported namespaces)
    - [ ] generic extension receiver-type unification
    - [ ] static extension members (TypeName.Member) + universal + union-receiver extensions
  constructors_indexers:
    - [~] constructor overload resolution (object creation + target-typed new) -- MISSING: target-typed new with an initializer block, and target-typed new written where nothing supplies a target, which is refused rather than resolved. Both forms otherwise select through the same OverloadResolution.Select methods use, unwrapping a constructed type to reach the definition its constructors are declared on and passing it as the source of the arguments to substitute in. A constructor declares no type parameters of its own, so the closing stage is a no-op for it
    - [~] constructor chains (`: this(...)` / `: base(...)`) -- MISSING: the target constructor. BindChainArguments binds the arguments into Constructor.ChainArgumentsList, in the body scope and before the body so they see the parameters, but only ChainKind records which flavor it was
    - [x] indexer resolution (get/set), array/span element access -- overload resolution, the resolved symbol and the get/set distinction are done (2026-09-15), the last judged in analysis from the assignment that holds the index. See postfix.IndexSuffix
  namespaces:
    - [x] namespace-prefix / fully-qualified name resolution in expression position -- IsKnownNamespace (accepts registered namespaces and proper prefixes) -> NamespaceResult -> NamespaceReferenceExpression, then PostfixBinder.BindQualifiedName collapses the receiver per step so the sentinel never survives into the finished tree
    - [~] ambient (CLR) type + member resolution via the ambient provider -- AmbientTypeProviderV2.BuildAndRegister projects types AND their members onto MemberType shells, so ResolveMemberType finds ambient members, subject to every member-access gap above. UNVERIFIED: the XML doc on ScopeResolver.IsKnownNamespace claims ambient namespaces are not registered and so System.Console-style qualification does not resolve; BuildAndRegister does call GetOrAddNamespace for every shell, which contradicts it. Reading says the comment is stale; this was not confirmed at runtime, so the marker stays partial until it is

# =============================================================================
type_inference_and_conversions:
# =============================================================================
  target_typing:
    # Thread the target type explicitly as a parameter of the bind functions.
    # Only three of the eight sites push at all.
    - [x] variable-declaration target type -- TypedVariableDeclaration only; for-initializers do not push
    - [x] return-statement target type (method/lambda return)
    - [x] assignment-RHS target type -- the assignment target is bound first, so its type targets the value
    - [~] argument target type (from resolved parameter type) -- MISSING: the several-candidates case for any argument but a lambda or a method group, which needs the argument to take part in applicability before it has a type -- those two do since 2026-09-25, typed per candidate (see generic_inference). One candidate of the right arity supplies its parameter types, now SUBSTITUTED against a constructed receiver so an argument to `new Result<void>(...)` sees Void rather than T (order 80); several supply none
    - [x] object-creation / target-typed-new (constructor parameter types) -- both go through ArgumentBinder with the target's constructors, so a nested `new(new(...))` reaches the inner parameter's type
    - [x] empty-array element target type -- LiteralBinder.ArrayElementType + PushTargetType
    - [x] lambda parameter target types -- LambdaBinder reads them off the target's function shape (order 105), a CLR delegate's Invoke included; an argument's target is its parameter under the sole candidate, or under each closed candidate in turn and then the chosen one (2026-09-25)
    - [x] void-value-literal + default-literal target type -- the void literal reads it for its three-way resolution (order 80); the bare default already did
  best_common_type:
    - [ ] switch-expression arm unification
    - [~] array-literal element unification -- MISSING: unification. CommonElementType is a reference-identity uniformity check plus a diagnostic
    - [ ] lambda multi-return unification
  conversions:
    # Model conversions EXPLICITLY as a bound conversion node carrying a classification,
    # so the future emitter knows exactly what to emit. Specify the rules from the type
    # specs (type-unions, newtypes, refinement-types, unknown-type, cast-operators,
    # as-operator, optional-types, enums, value-tuples, stack-only-types).
    #
    # NOTHING HERE EXISTS. Grep for Conversion across Source/Mist/ProgramModel/ returns
    # nothing: no bound conversion node, no classification enum, no classifying function.
    # The bound tree does not record that a conversion happens AT ALL, which is also why
    # `if` and `while` conditions cannot be bound to bool and why array literals cannot
    # widen. This subsection is the main structural prerequisite for the rest of the file.
    - [ ] identity
    - [ ] numeric widening (via implicit cast operators on stdlib bootstrap types)
    - [ ] reference / subtype (class + struct base chains)
    - [ ] abstract implementation (+ retroactive with-block conformance)
    - [ ] constructed-generic identity + covariant unknown-widening (class-only restriction)
    - [~] tuple structural (arity + element assignability; name erasure) -- ConversionRelation.WidensElementwise compares equal-arity tuples position by position, recursing through IsWithin so numeric widening and inheritance reach into an element and a nested tuple is comparable at all. Name erasure is NOT an arm: it is a Structural() unwrap at the ENTRY of both IsWithin and IsIdentity, because identity here is compared by fully qualified name and a NamedTupleType's name interpolates its element names, which made a named tuple non-identical to its own shape. Mutation-checked (order 100): removing the unwrap fails the identity assertion only, containment surviving through the element-wise arm. MISSING, as with everything else in this section: no bound conversion node records it, and an element that is `unknown` makes the comparison decline rather than succeed, IsIndeterminate covering the top type
    - [ ] tuple element-name MISMATCH between a literal and its target -- names are emitted as source spelled them, so a literal whose names disagree with the declared target's produces C# that compiles with CS8123 (the tuple element name is ignored). Roslyn warnings are collected at Error only, so nothing surfaces it
    - [~] tuple arity above 7 -- a C# ValueTuple nests its eighth element onward under Rest, while TupleType synthesizes Item1..ItemN flat. MEMBER ACCESS IS NOT WRONG, measured 2026-09-25: C# exposes Item8..ItemN on a tuple TYPE, and v2 always emits tuple syntax, so `nine.Item9`, typed assignment to a 9-tuple and `var (a, ..., i)` all run, on Mist-declared tuples and on CLR-projected 9- and 16-element results alike (ClrTupleSignatureRuntimeTests). STILL BROKEN: the flat `System.ValueTuple<...>` that EmitAsPatternType writes for a type pattern -- `box is (int, int, int, int, int, int, int, int, string) back` fails MIST_CS_ERROR "The non-generic type 'ValueTuple' cannot be used with type arguments". Loud rather than silent: Roslyn has no such type, so the build stops
    - [ ] array / span sizing (known-length -> unknown-length; kind must match for spans)
    - [~] union widening (constituent -> union; union -> wider union) and narrowing (via `is`) -- widening is ConversionRelation.WidensIntoUnion, containment recursing through IsWithin (order 77). Narrowing via `is` works for EVERY union now: an optional bypasses the carrier for Nullable or the bare type and C# tests it directly (order 90), and a non-optional union narrows through the carrier's nullable per-constituent accessor, which keeps the test and the binding in one C# pattern (order 98). MISSING, and the reason this stays partial: no bound conversion node records any of it, as with everything else here
    - [ ] dependent-type-parameter <-> value type
    - [x] newtype nominal distinctness (only same newtype; explicit cast required otherwise) -- falls out of ConversionRelation having no newtype arm (FQN identity only), mutation-checked by NewtypeResolutionTests (order 86); the "cast required" DIAGNOSTIC on a mixing assignment is analyzer work, like everything here
    - [~] delegate / func signature compatibility + method-group conversion -- method-group conversion against a structural function type is done (order 108), by identity per parameter position and on the result. A FunctionType is interned, so compatibility between two function types is reference identity and needs no arm of its own. MISSING: named DELEGATE types, which Mist cannot declare at all -- they enter only by CLR projection (order 126), so order 109 is unreachable from the functions layer
    - [ ] refinement subtyping (predicate implication) + widening to base type
    - [ ] enum -> underlying type
    - [x] type-alias transparency (unwrap both sides) -- nothing to unwrap since order 84: aliases are expanded at resolution, so no type reaching a conversion is an alias
    - [ ] unknown top-type rules (any non-void -> unknown ok; unknown -> concrete rejected; narrow via `is`)
    - [ ] user-defined implicit / explicit cast operator resolution (record the operator on the node)

# =============================================================================
mist_specific_semantics:
# =============================================================================
  ownership:
    - [ ] ownership specifier on locals/returns (owned / frozen / readonly-ref / borrowed / ref) -> OwnershipKind on bound local -- LocalVariable has no OwnershipKind and the binder never reads the specifier. Method.ReturnOwnership and Field.Ownership ARE populated, but that is the signature layer, not body binding
    - [ ] ref locals / ref returns (RefKind) -- no RefKind type exists in ProgramModel/
    - [ ] readonly locals (readonly-status)
    - [~] this-tier from `with {tier}` clause (already on Method.DeclaredThisTier; ensure bodies see it) -- MISSING: exactly the "bodies see it" half. DeclaredThisTier is populated, but BindingContext carries only Scope/EnclosingType/ReturnType/TargetType and the binder never receives the Method
    - [ ] NOTE: move/borrow DISCIPLINE is a check (out_of_scope); binding records tiers only
  context:
    # All blocked upstream: the whole `with` family is unsupported at statement level, so
    # nothing downstream of it can be exercised.
    - [ ] resolve context values pushed via the `with` family
    - [ ] ambient context lookup (a value of a context-bound type is available in scope)
    - [ ] context-binding scoping (push / block / var-block) -- Model/ContextBinding.cs and Method.ContextBindingsList exist from Phase 2; binding never reads them
    - [ ] NOTE: cooperation-contract + context DISCIPLINE is a check (out_of_scope)
  dependent_types:
    - [ ] dependent value arguments in expressions (e.g. `N:int` type params carrying values) -- TypeInterner.LiftLiteral and ScopeResolver's literal-lifting exist, but only for type-reference positions
    - [ ] dependent-parameter references / forwarding in bodies
  refinement_and_union_narrowing:
    # UNION narrowing is done (orders 90 and 98); REFINEMENT narrowing is not started, and neither is
    # narrowing anything other than a pattern's own binding.
    - [~] narrow from `is` pattern (then-branch / arm scope) -- the narrowed type is Pattern.NarrowedType, intrinsic to the bound pattern, and the binding it types is declared into the scope of whatever the pattern guards: a branch (order 90) or a switch arm (order 95). MISSING: narrowing the SCRUTINEE itself rather than a binding, so a bare `u` after `u is int i` is still the union
    - [ ] narrow from comparisons / conditions
    - [ ] for-loop bound narrowing (array-bounds-flow-analysis feeds this; decide scope) -- STILL UNDECIDED
    - [x] union narrowing to a constituent -- resolved during binding and recorded on the pattern as TypeTestPattern.Constituent, because the same lookup answers which carrier accessor to name AND whether the test has any lowering at all. Identity across every constituent is tried before containment, so an exact constituent is never answered by a wider one containing it; containment then lets `Animal | int` narrow to Dog through the Animal accessor. A type no constituent holds is reported by construction rather than an analyzer -- it is a test with no accessor to name, not merely one that always fails (order 98)
    - [ ] NOTE: refinement SATISFACTION solving is a check (out_of_scope); binding tracks narrowed types
  newtypes:
    - [x] newtype wrap / unwrap in expressions (member access unwraps to source; assignment stays nominal) -- member access forwards through TypeMemberLookup.EnqueueBases (SourceType walks as a pseudo-base, private members hidden by depth), the synthesized Value field covers intrinsic sources, construction forwards via ExpressionBinder.ConstructionTarget, and the expression's type stays the Newtype throughout (order 86). SUPERSEDED for a non-generic, non-intrinsic class or struct source on 2026-09-13: that newtype is a ClassType or StructType bound from its source's declaration (NewtypeCloner, CloneScope), so nothing forwards; forwarding remains for intrinsic, generic and alias sources until the revised newtypes spec's task 14
  async_await:
    # All four async/await AST nodes (Await, Async, AsyncBlock, AsyncHintBlock) hit
    # BindUnary's `default:` -> UnresolvedExpression.
    - [ ] `await` unwraps Task<T> / ValueTask<T> -> T
    - [ ] auto-await: direct invocation of async method in sync context auto-unwraps Task<T>
    - [ ] async block (`async { }`) -> Task<T>; async hint block (`async valuetask { }`) -> ValueTask<T>
    - [ ] async functor (`async expr`) -> wraps in Task<T>
    - [ ] discarded-task tracking per block scope (scope-exit await); async promotion signal for the emitter
  stackalloc_ref:
    - [x] stackalloc -> span type (readonly from target; qualified/generic/alias element resolution shared with ordinary references). Integer literal sizes carry a known length, and computed sizes carry an unknown Int32 value length
    - [ ] ref-expression / ref-argument value categories -- ref on arguments is erased by GetAllExpressions()

# =============================================================================
emitter_lowering_annotations:
# =============================================================================
  # Facts the FUTURE emitter needs, produced during binding. These are INTRINSIC
  # bound-node properties (never syntax-node-keyed side tables). Listed so the
  # bound-node contracts reserve room for them now.
  - [x] resolved Type on every bound expression -- abstract and non-null everywhere; failures use ErrorType.Instance
  - [ ] resolved operator symbol on binary/unary/implicit-cast nodes -- kind enums only, and no implicit-cast node exists
  - [x] inferred type arguments on generic call nodes -- MemberAccessExpression.TypeArguments and MethodReferenceExpression.TypeArguments, holding the winner's own arguments whether stated or inferred. Unlike InvocationExpression.Method, the emitter READS these, stating them on the callee so that a wrong answer becomes a C# error rather than being re-inferred correctly by Roslyn and passing. Nothing yet TESTS that difference -- see the measurement under type-argument-inference in the capability register
  - [ ] as-conversion kind: provable vs runtime-checked -- `as` does not bind
  - [~] resolved member / method / constructor symbol on access + call nodes -- PRESENT on MethodReferenceExpression.Method, FieldReferenceExpression.Field, TypeReferenceExpression.ReferencedType. ABSENT on MemberAccessExpression (string name only), InvocationExpression, ObjectCreationExpression, IndexExpression
  - [ ] implicit .Clone() insertion sites (ownership bridging via IClonable)
  - [ ] discarded async tasks per block scope (scope-exit await)
  # Inference passes that run as pipeline stages (NOT analyzers) and feed the emitter.
  # Decide whether these run during Phase 3 binding or as separate post-binding passes.
  # ALL FOUR ARE STILL UNDECIDED -- no comment anywhere records the Phase-3-vs-later
  # choice. All four also exist in the LEGACY Mist.Analysis/Backends; they are [ ] here
  # strictly against ProgramModel/, per the clean-room rule.
  - [ ] readonly inference (member readonly classification) [track: needed for emit]
  - [ ] IClonable derivation [track: needed for move/clone emit]
  - [ ] synthetic Drop() inference + auto-drop scope obligations [track: needed for drop emit] -- ConcreteType.HasDrop/IsDisposableDrop exist but are assigned ONLY from the backend (DisposableDetector, TypeProjector) for ambient types; nothing sets them from Mist source, and there is no scope-obligation tracking
  - [ ] ownership tier inference + move/borrow resolution [track: needed for clone/move emit]

# =============================================================================
binding_pass_integration:
# =============================================================================
  member_bodies:
    - [x] method bodies -- MemberType.EnumerateDelegates yields MethodsList
    - [~] constructor bodies + constructor chains -- bodies done via ConcreteType.EnumerateDelegates; chains partial, arguments bound but target constructor unresolved (see constructors_indexers)
    - [x] operator bodies -- EnumerateDelegates yields OperatorsList
    - [x] cast-operator bodies -- ConcreteType.EnumerateDelegates yields CastOperatorsList
    - [ ] property accessors: block get/set/init, expression-bodied (`such that`), auto (no body), `field` keyword -- AccessorBuilder produces `Body = new Block(body)` with an EMPTY Statements list and `ExpressionBody = new UnresolvedExpression(...)`; nothing rebinds them. Accessors are not Methods, so the delegate walk structurally cannot reach them -- this needs its own BodyBinder.BindBody pass, which is what BindBody's doc comment already anticipates
    - [ ] expression-bodied property (`prop such that expr`) -- PropertyBuilder stores an UnresolvedExpression
    - [ ] indexer accessors (block + expression-bodied) -- same AccessorBuilder path
    - [ ] field initializers (`= expr`) -- ConcreteTypeBuilder stores an UnresolvedExpression, never rebound; same for Property.Initializer
    - [ ] enum member values (`= expr`) -- EnumTypeBuilder stores an UnresolvedExpression. EnumMember.Value's doc says "stashed for later evaluation"; Phase 3 does not evaluate it either
    - [ ] default blocks (default field/type initializers) -- ConcreteTypeBuilder stores UnresolvedExpressions and DefaultBlock retains its DeclarationNode for later evaluation
  top_level:
    - [ ] top-level statements (enclosing type null; integer exit-code return contract) -- NOT MODELLED AT ALL, upstream of binding: the grammar has statement:Statement as StatementItem, but TypeBuilder.Build's switch handles only TypeItem/ExtensionItem/WithItem/NamespaceItem, so StatementItemTopLevelItemNode is never matched anywhere in ProgramModel/. This is also why BindingContext.EnclosingType's documented "null for top-level statements" case is unreachable
  wiring:
    - [ ] populate Method.Scope / accessor scopes with parameters + locals during binding -- the sharpest gap here. BindDelegate registers parameters into `new Scope(method.Scope)`, a transient that is never stored; every block/if/while/for/foreach scope is likewise a binder local; Method.Scope itself only ever holds type parameters; Block has no Scope property. Net effect: the finished model CANNOT be navigated from a member to its body's locals via scopes, only indirectly via LocalDeclarationStatement.Local. Accessors have no scope at all
    - [~] attach the bound block to the member (replace the raw Block/BlockNode wrapper) -- MISSING: the replacement. Method.Body does point at a Block whose Statements are really bound, so the member reaches a bound tree. But Block still exposes BlockNode Node and BindBody READS body.Node.Statements to drive itself, so the AST reference is load-bearing rather than vestigial; Expression exposes SyntaxNode Node on every node. Removing the AST needs BindBody restructured to be fed differently
    - [ ] wire ExperimentalPipeline stage 5/6 later (analyzers + emitter consume the bound tree) -- OUT OF SCOPE here, but bound tree is their input -- for reference, ExperimentalPipeline calls ProgramModelBuilder.Build at Stage 4 with 5/6 stubbed

# =============================================================================
out_of_scope:
# =============================================================================
  # Analyzers are intentionally skipped for now (user directive). These are pure
  # CHECKS -- the bound tree must carry enough info to run them later, but the checks
  # themselves are NOT part of finishing the ProgramModel body representation. When
  # they are eventually built they must ALSO be clean-room (no legacy Analysis code);
  # the names below only identify which deferred check is meant.
  analyzer_checks:
    - definite assignment / forward dataflow
    - ownership / move / borrow discipline enforcement (OwnershipAnalyzer)
    - drop / use-after-drop discipline (DropAnalyzer)
    - readonly discipline enforcement (ReadonlyAnalyzer)
    - refinement satisfaction solving (RefinementSolver)
    - switch exhaustiveness (ExhaustivenessChecker) -- the capability register's order 97 asserted this was
      capability work until it was reclassified to agree with this list. Its analysis_phase_tasks now hold
      the three rules worth keeping, the tuple and enum decisions classic gets wrong in opposite
      directions, and the reason none of it has started: v2 has no analyzer contract yet, so this rule
      would be designing one
    - accessibility enforcement
    - frame / stack escape (FrameEscapeAnalyzer)
    - structured-context discipline (ContextCheckerAnalyzer)
    - entry-point signature validation (EntryPointAnalyzer)
  emitter:
    - the C# emitter itself. Ordering, dependencies and sample acceptance for it live in
      backlog/emitter-v2-capability-progression.yaml; see CROSS-REFERENCE in the header
      for how that file's end-to-end capabilities overlap this one's constructs.

# =============================================================================
verification:
# =============================================================================
  # Clean-room verification: the classic pipeline is NOT an oracle. Correctness is
  # established from the language spec and from AUTHORED expected results -- never by
  # diffing against the legacy Semantics/Analysis output.
  #
  # ProgramModel has no unit tests by design and is normally exercised end-to-end.
  # The emitter does not exist yet, so during this phase verification is limited to
  # self-contained checks on the bound tree.
  #
  # NONE of this exists yet: there is no verification harness for the bound tree at all.
  # Two of the invariants below are also currently FALSE rather than merely unchecked,
  # which makes them useful now as bug-finders rather than as regression guards.
  - [ ] structural invariants: every bound expression has a non-null resolved type (ErrorType only where a diagnostic was emitted) -- CURRENTLY FALSE. UnresolvedExpression yields ErrorType at 14 sites and only 2 emit a diagnostic; ResolveMemberType and ResolveIndexerType also return ErrorType silently; NamespaceReferenceExpression.Type is ErrorType by design. Deciding which of those are acceptable is part of the task
  - [ ] every call / member / operator node has a resolved symbol (or a recorded error) -- CURRENTLY UNSATISFIABLE: InvocationExpression, MemberAccessExpression, IndexExpression, ObjectCreationExpression, BinaryExpression and UnaryExpression have no symbol field to check
  - [ ] every conversion site carries an explicit classification -- no conversion sites are modelled
  - [ ] targeted assertions: bind small authored Mist snippets and assert the expected bound-node types / resolved symbols directly (expectations derived from the spec, not from the legacy frontend)
  - [ ] progress against samples/ (mirror the provider approach): start from the empty/simple app and work up to AllFeatures binding with zero construction diagnostics -- NOTE: because both sentinels are silent, "the sample runs" cannot serve as the signal here; the harness has to assert on the bound tree
  - [ ] once the emitter exists: emit C#, compile it, run it, and assert the program output equals the AUTHORED expected output (final exit criterion; no comparison against the classic pipeline)
